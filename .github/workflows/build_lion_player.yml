                      currentTrackIndex = index
                      val uri = playlistUris[index]
                      val title = playlistTitles.getOrNull(index) ?: "Lion Player"
                      binding.txtVideoTitle.text = title
                      player?.let {
                          it.setMediaItem(MediaItem.fromUri(Uri.parse(uri)))
                          it.prepare()
                          it.playWhenReady = true
                      }
                  }
              }

              private fun playNextTrack() {
                  if (playlistUris.isNotEmpty() && currentTrackIndex < playlistUris.size - 1) {
                      playTrackAtIndex(currentTrackIndex + 1)
                      Toast.makeText(this, "التالي: ${playlistTitles.getOrNull(currentTrackIndex) ?: ""}", Toast.LENGTH_SHORT).show()
                  } else {
                      Toast.makeText(this, "نهاية القائمة", Toast.LENGTH_SHORT).show()
                  }
              }

