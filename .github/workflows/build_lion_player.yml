        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LionPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
