              private fun initSelectionBar() {
                  binding.btnCancelSelection.setOnClickListener { exitSelectionMode() }
                  binding.btnFavoriteSelected.setOnClickListener {
                      val selected = displayedList.filter { it.isSelected && !it.isFolder }
                      if (selected.isNotEmpty()) toggleFavoriteMultiple(selected)
