                  binding.btnMiniPlayPause.setOnClickListener { LionPlayerManager.togglePlayPause(this) }
                  binding.btnMiniNext.setOnClickListener { LionPlayerManager.playNext(this) }
                  binding.btnMiniClose.setOnClickListener {
