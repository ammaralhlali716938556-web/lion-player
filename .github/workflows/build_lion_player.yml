            R.id.action_view_mode -> {
                isGrid = !isGrid
                binding.rvMedia.layoutManager = if (isGrid) GridLayoutManager(this, 2) else LinearLayoutManager(this)
                val current = viewModel.filteredMediaList.value ?: emptyList()
                mediaAdapter.updateData(current, isGrid)
                return true
            }
            R.id.action_sort -> {
                showSortDialog()
                return true
            }
            R.id.action_settings -> {
                PlayerSettingsBottomSheet.newInstance().show(supportFragmentManager, PlayerSettingsBottomSheet.TAG)
                return true
            }
          }
          return super.onOptionsItemSelected(item)
          }

          private fun showSortDialog() {
          val options = arrayOf("التاريخ (الأحدث أولاً)", "التاريخ (الأقدم أولاً)", "الاسم (أ - ي)", "الاسم (ي - أ)", "الحجم (الأكبر أولاً)", "الحجم (الأصغر أولاً)")
          AlertDialog.Builder(this)
            .setTitle("ترتيب الملفات")
            .setItems(options) { _, which ->
                when (which) {
                    0 -> { viewModel.currentSort = SortOption.DATE; viewModel.isSortAscending = false }
                    1 -> { viewModel.currentSort = SortOption.DATE; viewModel.isSortAscending = true }
                    2 -> { viewModel.currentSort = SortOption.NAME; viewModel.isSortAscending = true }
                    3 -> { viewModel.currentSort = SortOption.NAME; viewModel.isSortAscending = false }
                    4 -> { viewModel.currentSort = SortOption.SIZE; viewModel.isSortAscending = false }
                    5 -> { viewModel.currentSort = SortOption.SIZE; viewModel.isSortAscending = true }
                }
                viewModel.applyFilterAndSort()
            }
            .show()
          }

          private fun setupRecyclerView() {
          mediaAdapter = MediaAdapter(
            items = emptyList(),
            isGrid = isGrid,
            onItemClick = { item ->
                if (item.isFolder) {
                    viewModel.currentFolder = item.parentFolder
                    viewModel.applyFilterAndSort()
                } else {
                    val fullList = ArrayList(viewModel.filteredMediaList.value?.filter { !it.isFolder } ?: emptyList())
                    val clickedIndex = fullList.indexOfFirst { it.id == item.id }.coerceAtLeast(0)
                    LionPlayerManager.playPlaylist(this, fullList, clickedIndex)
                    if (item.isVideo) {
                        startActivity(Intent(this, PlayerActivity::class.java))
                    } else {
                        updateMiniPlayer()
                    }
                }
            },
            onItemLongClick = { _ ->
                updateSelectionUI(1)
            },
            onMoreClick = { _, item ->
                showItemActionDialog(item)
            },
            onSelectionChanged = { count ->
                updateSelectionUI(count)
            }
          )

          binding.rvMedia.layoutManager = LinearLayoutManager(this)
          binding.rvMedia.adapter = mediaAdapter
          }

          private fun setupBottomNavigation() {
          binding.bottomNavigation.setOnItemSelectedListener { item ->
            when (item.itemId) {
                R.id.nav_all -> {
                    viewModel.currentFilter = "ALL"
                    viewModel.currentFolder = null
                }
                R.id.nav_videos -> {
                    viewModel.currentFilter = "VIDEOS"
                    viewModel.currentFolder = null
                }
                R.id.nav_audios -> {
                    viewModel.currentFilter = "AUDIOS"
                    viewModel.currentFolder = null
                }
                R.id.nav_folders -> {
                    viewModel.currentFilter = "FOLDERS"
                    viewModel.currentFolder = null
                }
                R.id.nav_favorites -> {
                    viewModel.currentFilter = "FAVORITES"
                    viewModel.currentFolder = null
                }
            }
            viewModel.applyFilterAndSort()
            true
          }
          }

          private fun setupSelectionBar() {
          binding.btnCancelSelection.setOnClickListener {
            mediaAdapter.isSelectionMode = false
            binding.selectionBar.visibility = View.GONE
          }

          binding.btnSelectAll.setOnClickListener {
            mediaAdapter.selectAll(true)
          }

          binding.btnVaultSelected.setOnClickListener {
            val selected = mediaAdapter.getSelectedItems()
            if (selected.isNotEmpty()) {
                confirmMoveToVaultMultiple(selected)
            }
          }

          binding.btnFavoriteSelected.setOnClickListener {
            val selected = mediaAdapter.getSelectedItems()
            selected.forEach { viewModel.toggleFavorite(it) }
            mediaAdapter.isSelectionMode = false
            binding.selectionBar.visibility = View.GONE
          }

          binding.btnDeleteSelected.setOnClickListener {
            val selected = mediaAdapter.getSelectedItems()
            if (selected.isNotEmpty()) {
                AlertDialog.Builder(this)
                    .setTitle("حذف الملفات")
                    .setMessage("هل أنت متأكد من رغبتك في حذف ${selected.size} ملفات؟")
                    .setPositiveButton("حذف") { _, _ ->
                        viewModel.removeItems(selected)
                        mediaAdapter.isSelectionMode = false
                        binding.selectionBar.visibility = View.GONE
                        Toast.makeText(this, "تم حذف الملفات", Toast.LENGTH_SHORT).show()
                    }
                    .setNegativeButton("إلغاء", null)
                    .show()
            }
          }
          }

          private fun updateSelectionUI(count: Int) {
          if (count > 0 || mediaAdapter.isSelectionMode) {
            binding.selectionBar.visibility = View.VISIBLE
            binding.tvSelectionCount.text = "$count محدد"
          } else {
            binding.selectionBar.visibility = View.GONE
          }
          }

          private fun showItemActionDialog(item: MediaItem) {
          val options = arrayOf(
            if (item.isFavorite) "إزالة من المفضلة" else "إضافة للمفضلة",
            "🔒 نقل إلى الخزينة السرية",
            "مشاركة",
            "تفاصيل",
            "حذف"
          )

          AlertDialog.Builder(this)
            .setTitle(item.title)
            .setItems(options) { _, which ->
                when (which) {
                    0 -> viewModel.toggleFavorite(item)
                    1 -> confirmMoveToVault(item)
                    2 -> {
                        val shareIntent = Intent(Intent.ACTION_SEND).apply {
                            type = if (item.isVideo) "video/*" else "audio/*"
                            putExtra(Intent.EXTRA_STREAM, Uri.parse(item.uri))
                        }
                        startActivity(Intent.createChooser(shareIntent, "مشاركة الملف"))
                    }
                    3 -> showItemDetails(item)
                    4 -> {
                        AlertDialog.Builder(this)
                            .setTitle("حذف الملف")
                            .setMessage("هل أنت متأكد من حذف ${item.title}؟")
                            .setPositiveButton("حذف") { _, _ ->
                                viewModel.removeItems(listOf(item))
                                Toast.makeText(this, "تم الحذف", Toast.LENGTH_SHORT).show()
                            }
                            .setNegativeButton("إلغاء", null)
                            .show()
                    }
                }
            }
            .show()
          }

          private fun showItemDetails(item: MediaItem) {
          val msg = "الاسم: ${item.title}\nالمسار: ${item.path}\nالنوع: ${if (item.isVideo) "فيديو" else "صوت"}\nالمدة: ${LionPlayerManager.formatDuration(item.duration)}\nالمجلد: ${item.parentFolder}"
          AlertDialog.Builder(this)
            .setTitle("تفاصيل الملف")
            .setMessage(msg)
            .setPositiveButton("حسناً", null)
            .show()
          }

          private fun confirmMoveToVault(item: MediaItem) {
          AlertDialog.Builder(this)
            .setTitle("🔒 تأمين وإخفاء الملف")
            .setMessage("سيتم تشفير هذا الملف ونقله داخل الخزينة السرية الآمنة، ولن يظهر في أي تطبيق خارجي أو المعرض العام للهاتف.\n\nهل تريد المتابعة؟")
            .setPositiveButton("نقل وتشفير") { _, _ ->
                lifecycleScope.launch {
                    val mime = if (item.isVideo) "video/*" else "audio/*"
                    val success = withContext(Dispatchers.IO) {
                        val imported = VaultSecurityManager.encryptAndImportFile(
                            context = this@MainActivity,
                            sourceUri = Uri.parse(item.uri),
                            originalName = item.title,
                            mimeType = mime
                        )
                        if (imported != null) {
                            // Try deleting original media file
                            try {
                                contentResolver.delete(Uri.parse(item.uri), null, null)
                            } catch (e: Exception) {
                                // Ignore if storage permission limits direct deletion
                            }
                            true
                        } else {
                            false
                        }
                    }

                    if (success) {
                        viewModel.removeItems(listOf(item))
                        Toast.makeText(this@MainActivity, "تم تأمين الملف ونقله للخزينة بنجاح 🔒", Toast.LENGTH_LONG).show()
                    } else {
                        Toast.makeText(this@MainActivity, "فشل تشفير ونقل الملف", Toast.LENGTH_SHORT).show()
                    }
                }
            }
            .setNegativeButton("إلغاء", null)
            .show()
          }

          private fun confirmMoveToVaultMultiple(items: List<MediaItem>) {
          AlertDialog.Builder(this)
            .setTitle("🔒 تأمين ${items.size} ملفات")
            .setMessage("سيتم تشفير هذه الملفات وحفظها في الخزينة السرية المحمية ببصمة الإصبع ورمز PIN.\n\nهل تريد المتابعة؟")
            .setPositiveButton("نقل وتشفير") { _, _ ->
                lifecycleScope.launch {
                    var successCount = 0
                    withContext(Dispatchers.IO) {
                        for (item in items) {
                            val mime = if (item.isVideo) "video/*" else "audio/*"
                            val imported = VaultSecurityManager.encryptAndImportFile(
                                context = this@MainActivity,
                                sourceUri = Uri.parse(item.uri),
                                originalName = item.title,
                                mimeType = mime
                            )
                            if (imported != null) {
                                successCount++
                                try {
                                    contentResolver.delete(Uri.parse(item.uri), null, null)
                                } catch (e: Exception) {}
                            }
                        }
                    }
                    viewModel.removeItems(items)
                    mediaAdapter.isSelectionMode = false
                    binding.selectionBar.visibility = View.GONE
                    Toast.makeText(this@MainActivity, "تم تأمين $successCount ملفات في الخزينة بنجاح 🔒", Toast.LENGTH_LONG).show()
                }
            }
            .setNegativeButton("إلغاء", null)
            .show()
          }

          private fun setupMiniPlayer() {
          binding.btnMiniPlayPause.setOnClickListener {
            LionPlayerManager.togglePlayPause(this)
            updateMiniPlayer()
          }

          binding.btnMiniNext.setOnClickListener {
            LionPlayerManager.playNext(this)
            updateMiniPlayer()
          }

          binding.btnMiniPrev.setOnClickListener {
            LionPlayerManager.playPrevious(this)
            updateMiniPlayer()
          }

          binding.btnMiniClose.setOnClickListener {
            LionPlayerManager.stop(this)
            binding.miniPlayerLayout.visibility = View.GONE
          }

          binding.miniPlayerLayout.setOnClickListener {
            val curr = LionPlayerManager.getCurrentItem()
            if (curr != null && curr.isVideo) {
                startActivity(Intent(this, PlayerActivity::class.java))
            }
          }
          }

          private fun updateMiniPlayer() {
          val curr = LionPlayerManager.getCurrentItem()
          val player = LionPlayerManager.player
          if (curr != null && player != null) {
            binding.miniPlayerLayout.visibility = View.VISIBLE
            binding.tvMiniTitle.text = curr.title
            binding.tvMiniSub.text = if (curr.isVideo) "فيديو" else curr.artist
            binding.btnMiniPlayPause.setImageResource(
                if (player.isPlaying) R.drawable.ic_pause else R.drawable.ic_play
            )
            binding.ivMiniThumb.loadThumbnail(curr, if (curr.isVideo) R.drawable.ic_video else R.drawable.ic_music_note)
          } else {
            binding.miniPlayerLayout.visibility = View.GONE
          }
          }

          private fun observeViewModel() {
          viewModel.filteredMediaList.observe(this) { list ->
            mediaAdapter.updateData(list, isGrid)
            binding.tvEmptyState.visibility = if (list.isEmpty()) View.VISIBLE else View.GONE
            binding.rvMedia.visibility = if (list.isEmpty()) View.GONE else View.VISIBLE
          }
          }
          }

