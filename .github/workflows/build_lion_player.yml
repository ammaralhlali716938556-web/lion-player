              private fun setupRecyclerView() {
                  mediaAdapter = MediaAdapter(
                      displayedList,
                      viewStyle,
                      showExtensions,
                      isSelectionMode = false,
                      onItemClick = { item ->
                          if (mediaAdapter.isSelectionMode) {
                              if (!item.isFolder) {
                                  item.isSelected = !item.isSelected
                                  updateSelectionUI()
                              }
                          } else {
                              if (item.isFolder) {
                                  currentSelectedFolder = item.title
                                  refreshListDisplay()
                                  updatePasteBarUI()
                              } else {
                                  val playlist = ArrayList(displayedList.filter { !it.isFolder })
                                  val index = playlist.indexOfFirst { it.id == item.id }.coerceAtLeast(0)
                                  val intent = Intent(this, PlayerActivity::class.java).apply {
                                      putExtra("PLAYLIST", playlist)
                                      putExtra("CURRENT_INDEX", index)
                                  }
                                  startActivity(intent)
                              }
                          }
                      },
                      onItemLongClick = { item -> enterSelectionMode(item) },
                      onMoreOptionsClick = { item, _ -> showItemActionDialog(item) }
                  )
                  applyLayoutManager()
                  binding.rvMedia.adapter = mediaAdapter
          
                  var lastScaleTriggerTime = 0L
                  scaleGestureDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(detector: ScaleGestureDetector): Boolean {
                          val now = System.currentTimeMillis()
                          if (now - lastScaleTriggerTime < 350) return false
                          val factor = detector.scaleFactor
                          if (factor > 1.15f) {
                              lastScaleTriggerTime = now
                              zoomIn()
                              return true
                          } else if (factor < 0.85f) {
                              lastScaleTriggerTime = now
                              zoomOut()
                              return true
                          }
                          return false
                      }
                  })
          
                  binding.rvMedia.setOnTouchListener { _, event ->
                      scaleGestureDetector.onTouchEvent(event)
                      false
                  }
              }
          
              private fun setupBottomNav() {
                  binding.bottomNavigation.setOnItemSelectedListener { menuItem ->
                      when (menuItem.itemId) {
                          R.id.nav_local -> { currentTab = TAB_VIDEO; currentSelectedFolder = null; refreshListDisplay() }
                          R.id.nav_music -> { currentTab = TAB_AUDIO; currentSelectedFolder = null; refreshListDisplay() }
                          R.id.nav_all -> { currentTab = TAB_ALL; currentSelectedFolder = null; refreshListDisplay() }
                          R.id.nav_favorites -> { currentTab = TAB_FAVORITES; currentSelectedFolder = null; refreshListDisplay() }
                          R.id.nav_iptv -> { startActivity(Intent(this, IptvActivity::class.java)) }
                          R.id.nav_vault -> { startActivity(Intent(this, VaultActivity::class.java)) }
                      }
                      true
                  }
              }
          
              private fun checkAndRequestPermissions() {
                  val needed = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_MEDIA_VIDEO)
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_MEDIA_AUDIO)
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                  }
          
                  if (needed.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toTypedArray(), PERMISSION_REQ_CODE)
                  } else {
                      loadMedia()
                  }
              }
          
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == PERMISSION_REQ_CODE && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      loadMedia()
                  }
              }
          
              private fun loadMedia() {
                  lifecycleScope.launch {
                      rawVideosList.clear()
                      rawVideosList.addAll(mediaRepository.getVideos())
                      rawAudioList.clear()
                      rawAudioList.addAll(mediaRepository.getAudio())
                      syncFavoritesFromPrefs()
                      refreshListDisplay()
                  }
              }
          
              private fun syncFavoritesFromPrefs() {
                  val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
                  rawVideosList.forEach { it.isFavorite = favSet.contains(it.id.toString()) }
                  rawAudioList.forEach { it.isFavorite = favSet.contains(it.id.toString()) }
              }
          
              private fun refreshListDisplay() {
                  displayedList.clear()
                  when (currentTab) {
                      TAB_VIDEO -> {
                          if (isVideoFolderMode && currentSelectedFolder == null) {
                              binding.topToolbar.title = "مجلدات الفيديو"
                              val grouped = rawVideosList.groupBy { it.parentFolder }
                              for ((folderName, items) in grouped) {
                                  val firstItem = items.firstOrNull()
                                  displayedList.add(
                                      MediaItem(
                                          id = firstItem?.id ?: folderName.hashCode().toLong(),
                                          title = folderName,
                                          uri = firstItem?.uri ?: "",
                                          duration = 0,
                                          size = items.sumOf { it.size },
                                          dateAdded = items.maxOfOrNull { it.dateAdded } ?: 0,
                                          isVideo = true,
                                          parentFolder = folderName,
                                          isFolder = true,
                                          itemCount = items.size
                                      )
                                  )
                              }
                          } else if (isVideoFolderMode && currentSelectedFolder != null) {
                              binding.topToolbar.title = currentSelectedFolder
                              displayedList.addAll(rawVideosList.filter { it.parentFolder == currentSelectedFolder })
                          } else {
                              binding.topToolbar.title = "كافة الفيديوهات"
                              displayedList.addAll(rawVideosList)
                          }
                      }
                      TAB_AUDIO -> {
                          if (isAudioFolderMode && currentSelectedFolder == null) {
                              binding.topToolbar.title = "مجلدات الصوت"
                              val grouped = rawAudioList.groupBy { it.parentFolder }
                              for ((folderName, items) in grouped) {
                                  val firstItem = items.firstOrNull()
                                  displayedList.add(
                                      MediaItem(
                                          id = firstItem?.id ?: folderName.hashCode().toLong(),
                                          title = folderName,
                                          uri = firstItem?.uri ?: "",
                                          duration = 0,
                                          size = items.sumOf { it.size },
                                          dateAdded = items.maxOfOrNull { it.dateAdded } ?: 0,
                                          isVideo = false,
                                          parentFolder = folderName,
                                          isFolder = true,
                                          itemCount = items.size
                                      )
                                  )
                              }
                          } else if (isAudioFolderMode && currentSelectedFolder != null) {
                              binding.topToolbar.title = currentSelectedFolder
                              displayedList.addAll(rawAudioList.filter { it.parentFolder == currentSelectedFolder })
                          } else {
                              binding.topToolbar.title = "كافة الصوتيات"
                              displayedList.addAll(rawAudioList)
                          }
                      }
                      TAB_ALL -> {
                          binding.topToolbar.title = "جميع الملفات"
                          displayedList.addAll(rawVideosList)
                          displayedList.addAll(rawAudioList)
                      }
                      TAB_FAVORITES -> {
                          binding.topToolbar.title = "المفضلة"
                          displayedList.addAll(rawVideosList.filter { it.isFavorite })
                          displayedList.addAll(rawAudioList.filter { it.isFavorite })
                      }
                  }
                  applySorting()
                  mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  binding.tvEmptyState.visibility = if (displayedList.isEmpty()) View.VISIBLE else View.GONE
              }
          
              private fun applySorting() {
                  val comp = when (sortBy) {
                      "name" -> compareBy<MediaItem> { it.title.lowercase() }
                      "date" -> compareBy { it.dateAdded }
                      "size" -> compareBy { it.size }
                      "duration" -> compareBy { it.duration }
                      else -> compareBy { it.title.lowercase() }
                  }
                  if (sortAsc) displayedList.sortWith(comp) else displayedList.sortWith(comp.reversed())
              }
          
              private fun enterSelectionMode(item: MediaItem? = null) {
                  mediaAdapter.isSelectionMode = true
                  binding.selectionBar.visibility = View.VISIBLE
                  item?.isSelected = true
                  updateSelectionUI()
              }
          
              private fun exitSelectionMode() {
                  mediaAdapter.isSelectionMode = false
                  binding.selectionBar.visibility = View.GONE
                  displayedList.forEach { it.isSelected = false }
                  mediaAdapter.notifyDataSetChanged()
              }
          
              private fun updateSelectionUI() {
                  val count = displayedList.count { it.isSelected && !it.isFolder }
                  binding.tvSelectionCount.text = "تم تحديد $count"
                  mediaAdapter.notifyDataSetChanged()
              }
          
              private fun confirmDeleteMultiple(items: List<MediaItem>) {
                  val uris = items.map { Uri.parse(it.uri) }
                  ScopedStorageHelper.requestDeleteMedia(
                      activity = this,
                      launcher = deleteRequestLauncher,
                      uris = uris,
                      fallbackLegacyAction = {
                          items.forEach { ScopedStorageHelper.deleteFileLegacy(contentResolver, Uri.parse(it.uri), it.path) }
                          loadMedia()
                          exitSelectionMode()
                      }
                  )
              }
          
              private fun startClipboardOperation(action: ClipAction) {
                  val selected = displayedList.filter { it.isSelected && !it.isFolder }
                  if (selected.isEmpty()) return
                  clipBufferList.clear()
                  clipBufferList.addAll(selected)
                  activeClipAction = action
                  exitSelectionMode()
                  updatePasteBarUI()
              }
          
              private fun updatePasteBarUI() {
                  if (activeClipAction != ClipAction.NONE && clipBufferList.isNotEmpty()) {
                      binding.pasteBar.visibility = View.VISIBLE
                      val actionStr = if (activeClipAction == ClipAction.COPY) "نسخ" else "نقل"
                      binding.tvPasteStatus.text = "جاهز لـ $actionStr (${clipBufferList.size}) مقاطع"
                  } else {
                      binding.pasteBar.visibility = View.GONE
                  }
              }
          
              private fun cancelPasteOperation() {
                  activeClipAction = ClipAction.NONE
                  clipBufferList.clear()
                  updatePasteBarUI()
              }
          
              private fun executePaste() {
                  if (clipBufferList.isEmpty() || activeClipAction == ClipAction.NONE) return
                  val targetDir = Environment.getExternalStoragePublicDirectory(
                      if (currentTab == TAB_AUDIO) Environment.DIRECTORY_MUSIC else Environment.DIRECTORY_MOVIES
                  )
                  if (!targetDir.exists()) targetDir.mkdirs()
          
                  for (item in clipBufferList) {
                      val src = File(item.path)
                      if (src.exists()) {
                          val dst = File(targetDir, src.name)
                          try {
                              FileInputStream(src).use { inp ->
                                  FileOutputStream(dst).use { out -> inp.copyTo(out) }
                              }
                              if (activeClipAction == ClipAction.MOVE) src.delete()
                          } catch (e: Exception) {}
                      }
                  }
                  Toast.makeText(this, "تمت العملية بنجاح إلى: ${targetDir.name}", Toast.LENGTH_SHORT).show()
                  cancelPasteOperation()
                  loadMedia()
              }
          
              private fun toggleFavoriteMultiple(items: List<MediaItem>) {
                  val favSet = prefs.getStringSet("favorite_ids", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  items.forEach {
                      if (it.isFavorite) favSet.remove(it.id.toString()) else favSet.add(it.id.toString())
                      it.isFavorite = !it.isFavorite
                  }
                  prefs.edit().putStringSet("favorite_ids", favSet).apply()
                  refreshListDisplay()
                  exitSelectionMode()
              }
          
              private fun showItemActionDialog(item: MediaItem) {
                  val options = arrayOf("تحديد", "نسخ", "نقل", if (item.isFavorite) "إزالة من المفضلة" else "إضافة للمفضلة", "حذف")
                  AlertDialog.Builder(this)
                      .setTitle(item.title)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> enterSelectionMode(item)
                              1 -> { clipBufferList.clear(); clipBufferList.add(item); activeClipAction = ClipAction.COPY; updatePasteBarUI() }
                              2 -> { clipBufferList.clear(); clipBufferList.add(item); activeClipAction = ClipAction.MOVE; updatePasteBarUI() }
                              3 -> toggleFavoriteMultiple(listOf(item))
                              4 -> confirmDeleteMultiple(listOf(item))
                          }
                      }
                      .show()
              }
          
              private fun zoomIn() {
                  if (viewStyle == MediaAdapter.VIEW_MODE_GRID_SMALL) viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
                  else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) viewStyle = MediaAdapter.VIEW_MODE_LIST
                  applyLayoutManager()
                  mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
              }
          
              private fun zoomOut() {
                  if (viewStyle == MediaAdapter.VIEW_MODE_LIST) viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
                  else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) viewStyle = MediaAdapter.VIEW_MODE_GRID_SMALL
                  applyLayoutManager()
                  mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
              }
          
              private fun applyLayoutManager() {
                  when (viewStyle) {
                      MediaAdapter.VIEW_MODE_LIST -> binding.rvMedia.layoutManager = LinearLayoutManager(this)
                      MediaAdapter.VIEW_MODE_GRID_LARGE -> binding.rvMedia.layoutManager = GridLayoutManager(this, 2)
                      MediaAdapter.VIEW_MODE_GRID_SMALL -> binding.rvMedia.layoutManager = GridLayoutManager(this, 3)
                  }
              }
          
              override fun onCreateOptionsMenu(menu: Menu?): Boolean {
                  menuInflater.inflate(R.menu.top_main_menu, menu)
                  val searchView = menu?.findItem(R.id.action_search)?.actionView as? SearchView
                  searchView?.setOnQueryTextListener(object : SearchView.OnQueryTextListener {
                      override fun onQueryTextSubmit(query: String?): Boolean = false
                      override fun onQueryTextChange(newText: String?): Boolean {
                          val q = newText.orEmpty()
                          val filtered = (rawVideosList + rawAudioList).filter { it.title.contains(q, ignoreCase = true) }
                          displayedList.clear()
                          displayedList.addAll(filtered)
                          mediaAdapter.notifyDataSetChanged()
                          return true
                      }
                  })
                  return true
              }
          
              override fun onOptionsItemSelected(item: MenuItem): Boolean {
                  when (item.itemId) {
                      R.id.action_open_stream -> showOpenStreamDialog()
                      R.id.action_refresh -> loadMedia()
                      R.id.action_settings -> PlayerSettingsBottomSheet.show(this)
                  }
                  return super.onOptionsItemSelected(item)
              }
          
              private fun showOpenStreamDialog() {
                  val input = EditText(this).apply {
                      hint = "أدخل رابط البث (HLS, DASH, RTSP, HTTP)..."
                  }
                  AlertDialog.Builder(this)
                      .setTitle("فتح رابط بث شبكي مباشر")
                      .setView(input)
                      .setPositiveButton("تشغيل") { _, _ ->
                          val url = input.text.toString().trim()
                          if (url.isNotEmpty()) {
                              val streamItem = MediaItem(
                                  id = url.hashCode().toLong(),
                                  title = "بث مباشر",
                                  uri = url,
                                  duration = 0,
                                  size = 0,
                                  dateAdded = System.currentTimeMillis() / 1000,
                                  isVideo = true
                              )
                              val intent = Intent(this, PlayerActivity::class.java).apply {
                                  putExtra("PLAYLIST", arrayListOf(streamItem))
                                  putExtra("CURRENT_INDEX", 0)
                              }
                              startActivity(intent)
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }
          
              override fun onResume() {
                  super.onResume()
                  updateMiniPlayerUI()
              }
          }
