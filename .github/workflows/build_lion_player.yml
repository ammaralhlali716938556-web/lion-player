name: Build Lion Player APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Lion Player
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create App Code & Environment
        run: |
          # 1. إعداد مسار SDK والذاكرة
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          # 2. إنشاء المجلدات
          mkdir -p app/src/main/java/com/lion/player/model
          mkdir -p app/src/main/java/com/lion/player/adapter
          mkdir -p app/src/main/java/com/lion/player/utils
          mkdir -p app/src/main/java/com/lion/player/ui
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/menu

          # 3. إعدادات Gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LionPlayer"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.lion.player'
              compileSdk 34

              defaultConfig {
                  applicationId "com.lion.player"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables.useSupportLibrary = true
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

              // Media3
              implementation 'androidx.media3:media3-exoplayer:1.3.0'
              implementation 'androidx.media3:media3-ui:1.3.0'
              implementation 'androidx.media3:media3-common:1.3.0'

              // Glide
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -dontwarn androidx.media3.**
          -keep class androidx.media3.** { *; }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_lion_logo"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_lion_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LionPlayer">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ui.PlayerActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout"
                      android:supportsPictureInPicture="true"
                      android:theme="@style/Theme.LionPlayer.Player" />
              </application>
          </manifest>
          EOF

          # 5. Values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Lion Player</string>
              <string name="tab_local">محلي</string>
              <string name="tab_stream">بث مباشر</string>
              <string name="tab_music">موسيقى</string>
              <string name="decoder_hw">HW</string>
              <string name="decoder_sw">SW</string>
              <string name="decoder_hw_plus">HW+</string>
              <string name="kids_lock_active">تم تفعيل قفل الأطفال</string>
              <string name="speed">سرعة التشغيل</string>
              <string name="sleep_timer">مؤقت النوم</string>
              <string name="properties">خصائص الملف</string>
              <string name="audio_track">المسار الصوتي</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="lion_gold">#FFB300</color>
              <color name="lion_gold_dark">#FF8F00</color>
              <color name="lion_dark_bg">#121212</color>
              <color name="lion_surface">#1E1E1E</color>
              <color name="lion_surface_variant">#2A2A2A</color>
              <color name="lion_text_primary">#FFFFFF</color>
              <color name="lion_text_secondary">#B0B0B0</color>
              <color name="lion_badge_hw">#4CAF50</color>
              <color name="lion_badge_sw">#2196F3</color>
              <color name="lion_badge_hw_plus">#FF9800</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LionPlayer" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/lion_gold</item>
                  <item name="colorSecondary">@color/lion_gold_dark</item>
                  <item name="android:statusBarColor">@color/lion_dark_bg</item>
                  <item name="android:navigationBarColor">@color/lion_dark_bg</item>
                  <item name="android:windowBackground">@color/lion_dark_bg</item>
              </style>

              <style name="Theme.LionPlayer.Player" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # 6. الأيقونات والمتجهات (Drawables)
          cat << 'EOF' > app/src/main/res/drawable/ic_lion_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFB300" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,16.5v-9l6,4.5 -6,4.5z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="36dp" android:height="36dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="36dp" android:height="36dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M6,19h4V5H6v14zm8,-14v14h4V5h-4z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_skip_previous.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="36dp" android:height="36dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M6,6h2v12H6zm3.5,6l8.5,6V6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_skip_next.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="36dp" android:height="36dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M6,18l8.5,-6L6,6v12zM16,6v12h2V6h-2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_lock.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M18,8h-1V6c0,-2.76 -2.24,-5 -5,-5S7,3.24 7,6v2H6c-1.1,0 -2,0.9 -2,2v10c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V10c0,-1.1 -0.9,-2 -2,-2zm-6,9c-1.1,0 -2,-0.9 -2,-2s0.9,-2 2,-2 2,0.9 2,2 -0.9,2 -2,2zm3.1,-9H8.9V6c0,-1.71 1.39,-3.1 3.1,-3.1 1.71,0 3.1,1.39 3.1,3.1v2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_lock_open.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFB300" android:pathData="M12,17c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zm6,-9h-1V6c0,-2.76 -2.24,-5 -5,-5 -2.28,0 -4.27,1.54 -4.84,3.75l1.94,0.5C10.45,3.95 11.63,3 13,3c1.71,0 3.1,1.39 3.1,3.1v2H6c-1.1,0 -2,0.9 -2,2v10c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V10c0,-1.1 -0.9,-2 -2,-2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_aspect_ratio.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19,12h-2v3h-3v2h5v-5zM7,9h3V7H5v5h2V9zm14,-6H3c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h18c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zm0,16.01H3V4.99h18v14.02z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_subtitles.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,4H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V6c0,-1.1 -0.9,-2 -2,-2zm-10,7H5v-2h5v2zm8,6H5v-2h13v2zm2,-3H5v-2h15v2zm0,-3h-4v-2h4v2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_pip.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19,11h-8v6h8v-6zm4,8V4.98C23,3.88 22.1,3 21,3H3c-1.1,0 -2,0.88 -2,1.98V19c0,1.1 0.9,2 2,2h18c1.1,0 2,-0.9 2,-2zm-2,0.02H3V4.97h18v14.05z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_audiotrack.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_more_vert.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zm0,2c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zm0,6c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_back.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_folder.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFB300" android:pathData="M10,4H4c-1.1,0 -1.99,0.9 -1.99,2L2,18c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V8c0,-1.1 -0.9,-2 -2,-2h-8l-2,-2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_video.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFB300" android:pathData="M17,10.5V7c0,-0.55 -0.45,-1 -1,-1H4c-0.55,0 -1,0.45 -1,1v10c0,0.55 0.45,1 1,1h12c0.55,0 1,-0.45 1,-1v-3.5l4,4v-11l-4,4z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_screen_rotation.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M16.48,2.52c3.27,1.55 5.61,4.72 5.97,8.48h1.5C23.44,4.84 18.29,0 12,0l-0.66,0.03 3.81,3.81 1.33,-1.32zM10.23,1.75c-0.59,-0.59 -1.54,-0.59 -2.12,0L1.75,8.11c-0.59,0.59 -0.59,1.54 0,2.12l12.02,12.02c0.59,0.59 1.54,0.59 2.12,0l6.36,-6.36c0.59,-0.59 0.59,-1.54 0,-2.12L10.23,1.75zM14.83,21.19L2.81,9.17l6.36,-6.36 12.02,12.02 -6.36,6.36z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_sort.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M3,18h6v-2H3v2zM3,6v2h18V6H3zm0,7h12v-2H3v2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_view_mode.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M4,11h5V5H4v6zm0,7h5v-6H4v6zm6,0h5v-6h-5v6zm6,0h5v-6h-5v6zm-6,-7h5V5h-5v6zm6,-6v6h5V5h-5z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_music_note.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFB300" android:pathData="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_brightness.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFB300" android:pathData="M20,8.69V4h-4.69L12,0.69 8.69,4H4v4.69L0.69,12 4,15.31V20h4.69L12,23.31 15.31,20H20v-4.69L23.31,12 20,8.69zM12,18c-3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6 6,2.69 6,6 -2.69,6 -6,6z"/>
          </vector>
          EOF

          # 7. القوائم (Menus)
          cat << 'EOF' > app/src/main/res/menu/top_main_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto">
              <item
                  android:id="@+id/action_folder_toggle"
                  android:icon="@drawable/ic_folder"
                  android:title="مجلدات / كافة الملفات"
                  app:showAsAction="always" />
              <item
                  android:id="@+id/action_display_style"
                  android:icon="@drawable/ic_view_mode"
                  android:title="شكل العرض"
                  app:showAsAction="always" />
              <item
                  android:id="@+id/action_sort"
                  android:icon="@drawable/ic_sort"
                  android:title="فرز وترتيب"
                  app:showAsAction="always" />
          </menu>
          EOF

          cat << 'EOF' > app/src/main/res/menu/bottom_nav_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item
                  android:id="@+id/nav_local"
                  android:icon="@drawable/ic_folder"
                  android:title="@string/tab_local" />
              <item
                  android:id="@+id/nav_music"
                  android:icon="@drawable/ic_audiotrack"
                  android:title="@string/tab_music" />
              <item
                  android:id="@+id/nav_stream"
                  android:icon="@drawable/ic_video"
                  android:title="@string/tab_stream" />
          </menu>
          EOF

          # 8. التخطيطات (Layouts)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/lion_dark_bg">

              <com.google.android.material.appbar.MaterialToolbar
                  android:id="@+id/topToolbar"
                  android:layout_width="match_parent"
                  android:layout_height="?attr/actionBarSize"
                  android:background="@color/lion_surface"
                  app:title="Lion Player"
                  app:titleTextColor="@color/lion_gold"
                  app:navigationIcon="@drawable/ic_lion_logo"
                  app:layout_constraintTop_toTopOf="parent" />

              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefresh"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  app:layout_constraintTop_toBottomOf="@id/topToolbar"
                  app:layout_constraintBottom_toTopOf="@id/bottomNavigation">

                  <androidx.recyclerview.widget.RecyclerView
                      android:id="@+id/recyclerViewMedia"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:padding="4dp" />
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>

              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottomNavigation"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/lion_surface"
                  app:itemIconTint="@color/lion_gold"
                  app:itemTextColor="@color/lion_text_primary"
                  app:menu="@menu/bottom_nav_menu"
                  app:layout_constraintBottom_toBottomOf="parent" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_media_video.xml
          <?xml version="1.0" encoding="utf-8"?>
          <com.google.android.material.card.MaterialCardView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_margin="3dp"
              app:cardBackgroundColor="@color/lion_surface"
              app:cardCornerRadius="8dp">

              <LinearLayout
                  android:layout_width="match_parent"
