            Toast.makeText(this, "يرجى إعداد الخزينة السرية وتعيين رمز PIN أولاً", Toast.LENGTH_LONG).show()
            startActivity(Intent(this, VaultActivity::class.java))
            return
                  }

                  AlertDialog.Builder(this)
            .setTitle("نقل وتشفير بالخزينة السرية")
            .setMessage("هل تريد نقل وتشفير ${items.size} ملفات داخل الخزينة السرية؟ ستختفي هذه الملفات من المعرض ومن المشغلات الأخرى تماماً.")
            .setIcon(R.drawable.ic_vault)
