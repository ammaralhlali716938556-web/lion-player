          cat << 'EOF' > app/src/main/java/com/lionplayer/app/ui/SplashActivity.kt
          package com.lionplayer.app.ui

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.view.WindowInsets
          import android.view.animation.AccelerateDecelerateInterpolator
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import com.lionplayer.app.R

          @SuppressLint("CustomSplashScreen")
          class SplashActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hideSystemBars()
                  setContentView(R.layout.activity_splash)

                  val ivLogo = findViewById<ImageView>(R.id.ivSplashLogo)
                  val tvName = findViewById<TextView>(R.id.tvSplashName)

                  ivLogo.alpha = 0f
                  ivLogo.scaleX = 0.65f
                  ivLogo.scaleY = 0.65f
                  tvName.alpha = 0f
                  tvName.translationY = 35f

                  ivLogo.animate()
                      .alpha(1f)
                      .scaleX(1.08f)
                      .scaleY(1.08f)
                      .setDuration(350)
                      .setInterpolator(AccelerateDecelerateInterpolator())
                      .withEndAction {
                          ivLogo.animate().scaleX(1.0f).scaleY(1.0f).setDuration(200).start()
                      }
                      .start()

                  tvName.animate()
                      .alpha(1f)
                      .translationY(0f)
                      .setDuration(400)
                      .setStartDelay(100)
                      .start()

                  Handler(Looper.getMainLooper()).postDelayed({
                      val intent = Intent(this, MainActivity::class.java)
                      startActivity(intent)
                      overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
                      finish()
                  }, 850)
              }

              private fun hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      )
                  }
              }
          }
