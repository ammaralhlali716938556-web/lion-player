          package com.lionplayer.app.model

          import java.io.Serializable

          data class MediaItem(
              val id: Long,
              val title: String,
              val uri: String,
              val duration: Long,
              val size: Long,
              val dateAdded: Long,
              val isVideo: Boolean,
              val parentFolder: String = "الرئيسي",
              var isFolder: Boolean = false,
              var itemCount: Int = 0
          ) : Serializable
