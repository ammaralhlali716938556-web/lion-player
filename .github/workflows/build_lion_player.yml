          cat << 'EOF_VAULT_SECURITY' > app/src/main/java/com/lionplayer/app/vault/security/VaultSecurityManager.kt
          package com.lionplayer.app.vault.security

          import android.content.ContentValues
          import android.content.Context
          import android.content.SharedPreferences
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import androidx.security.crypto.EncryptedFile
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          import com.lionplayer.app.vault.model.VaultItem
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.security.MessageDigest
          import java.util.UUID

          class VaultSecurityManager(private val context: Context) {

          private val masterKey: MasterKey by lazy {
          MasterKey.Builder(context)
            .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)
            .build()
          }

          private val securePrefs: SharedPreferences by lazy {
          EncryptedSharedPreferences.create(
            context,
            "lion_vault_secure_prefs",
            masterKey,
            EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
            EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
          )
          }

          companion object {
          private const val KEY_VAULT_INITIALIZED = "vault_initialized"
          private const val KEY_PIN_HASH = "vault_pin_hash"
          private const val KEY_SECURITY_QUESTION = "vault_security_question"
          private const val KEY_SECURITY_ANSWER_HASH = "vault_security_answer_hash"
          private const val KEY_VAULT_ITEMS_JSON = "vault_items_json"
          private const val VAULT_DIR_NAME = "secure_vault"
          private const val NOMEDIA_FILE = ".nomedia"
          }

          fun isVaultInitialized(): Boolean {
          return securePrefs.getBoolean(KEY_VAULT_INITIALIZED, false)
          }

          private fun hashString(input: String): String {
          val digest = MessageDigest.getInstance("SHA-256")
          val hashBytes = digest.digest(input.trim().lowercase().toByteArray(Charsets.UTF_8))
          return hashBytes.joinToString("") { "%02x".format(it) }
          }

          fun setupVault(pin: String, question: String, answer: String): Boolean {
          if (pin.length < 4 || answer.trim().isEmpty()) return false
          securePrefs.edit()
            .putBoolean(KEY_VAULT_INITIALIZED, true)
            .putString(KEY_PIN_HASH, hashString(pin))
            .putString(KEY_SECURITY_QUESTION, question.trim())
            .putString(KEY_SECURITY_ANSWER_HASH, hashString(answer))
            .apply()
          ensureVaultDirectory()
          return true
          }

          fun verifyPin(pin: String): Boolean {
          val storedHash = securePrefs.getString(KEY_PIN_HASH, null) ?: return false
          return storedHash == hashString(pin)
          }

          fun getSecurityQuestion(): String {
          return securePrefs.getString(KEY_SECURITY_QUESTION, "ما هو سؤال الأمان الخاص بك؟") ?: "سؤال الأمان"
          }

          fun verifySecurityAnswer(answer: String): Boolean {
          val storedAnswerHash = securePrefs.getString(KEY_SECURITY_ANSWER_HASH, null) ?: return false
          return storedAnswerHash == hashString(answer)
          }

          fun updatePin(newPin: String): Boolean {
          if (newPin.length < 4) return false
          securePrefs.edit()
            .putString(KEY_PIN_HASH, hashString(newPin))
            .apply()
          return true
          }

          fun getVaultDirectory(): File {
          val dir = File(context.filesDir, VAULT_DIR_NAME)
          if (!dir.exists()) {
            dir.mkdirs()
          }
          val noMedia = File(dir, NOMEDIA_FILE)
          if (!noMedia.exists()) {
            try {
                noMedia.createNewFile()
            } catch (e: Exception) {}
          }
          return dir
          }

          private fun ensureVaultDirectory(): File = getVaultDirectory()

          @Synchronized
          fun getVaultItems(): List<VaultItem> {
          val jsonStr = securePrefs.getString(KEY_VAULT_ITEMS_JSON, "[]") ?: "[]"
          val list = mutableListOf<VaultItem>()
          try {
            val jsonArray = JSONArray(jsonStr)
            for (i in 0 until jsonArray.length()) {
                val obj = jsonArray.getJSONObject(i)
                list.add(
                    VaultItem(
                        id = obj.getString("id"),
                        originalName = obj.getString("originalName"),
                        originalPath = obj.optString("originalPath", ""),
                        isVideo = obj.getBoolean("isVideo"),
                        size = obj.getLong("size"),
                        duration = obj.getLong("duration"),
                        dateAdded = obj.getLong("dateAdded"),
                        encryptedFileName = obj.getString("encryptedFileName")
                    )
                )
            }
          } catch (e: Exception) {}
          return list
          }

          @Synchronized
          private fun saveVaultItems(items: List<VaultItem>) {
          val jsonArray = JSONArray()
          for (item in items) {
            val obj = JSONObject().apply {
                put("id", item.id)
                put("originalName", item.originalName)
                put("originalPath", item.originalPath)
                put("isVideo", item.isVideo)
                put("size", item.size)
                put("duration", item.duration)
                put("dateAdded", item.dateAdded)
                put("encryptedFileName", item.encryptedFileName)
            }
            jsonArray.put(obj)
          }
          securePrefs.edit().putString(KEY_VAULT_ITEMS_JSON, jsonArray.toString()).apply()
          }

          suspend fun encryptAndStoreFile(
          sourceUri: Uri,
          originalName: String,
          originalPath: String,
          isVideo: Boolean,
          size: Long,
          duration: Long
          ): VaultItem? = withContext(Dispatchers.IO) {
          try {
            val vaultDir = ensureVaultDirectory()
            val id = UUID.randomUUID().toString()
            val encFileName = "$id.enc"
            val targetFile = File(vaultDir, encFileName)
            if (targetFile.exists()) targetFile.delete()

            val encryptedFile = EncryptedFile.Builder(
                context,
                targetFile,
                masterKey,
                EncryptedFile.FileEncryptionScheme.AES256_GCM_HKDF_4KB
            ).build()

            val inputStream = context.contentResolver.openInputStream(sourceUri) ?: return@withContext null
            encryptedFile.openFileOutput().use { output ->
                inputStream.use { input ->
                    input.copyTo(output)
                }
            }

            val item = VaultItem(
                id = id,
                originalName = originalName,
                originalPath = originalPath,
                isVideo = isVideo,
                size = if (size > 0) size else targetFile.length(),
                duration = duration,
                dateAdded = System.currentTimeMillis(),
                encryptedFileName = encFileName
            )

            val currentItems = getVaultItems().toMutableList()
            currentItems.add(0, item)
            saveVaultItems(currentItems)

            item
          } catch (e: Exception) {
            null
          }
          }

          suspend fun decryptAndRestoreFile(item: VaultItem): Uri? = withContext(Dispatchers.IO) {
          try {
            val vaultDir = getVaultDirectory()
            val encFile = File(vaultDir, item.encryptedFileName)
            if (!encFile.exists()) return@withContext null

            val encryptedFile = EncryptedFile.Builder(
                context,
                encFile,
                masterKey,
                EncryptedFile.FileEncryptionScheme.AES256_GCM_HKDF_4KB
            ).build()

            val resolver = context.contentResolver
            val isVideo = item.isVideo
            val collectionUri = if (isVideo) {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                } else {
                    MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                }
            } else {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    MediaStore.Audio.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                } else {
                    MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                }
            }

            val mimeType = if (isVideo) "video/*" else "audio/*"
            val relativeDir = if (isVideo) "Movies/LionPlayer_Restored" else "Music/LionPlayer_Restored"

            val values = ContentValues().apply {
                put(MediaStore.MediaColumns.DISPLAY_NAME, item.originalName)
                put(MediaStore.MediaColumns.MIME_TYPE, mimeType)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    put(MediaStore.MediaColumns.RELATIVE_PATH, relativeDir)
                    put(MediaStore.MediaColumns.IS_PENDING, 1)
                }
            }

            val newUri = resolver.insert(collectionUri, values) ?: return@withContext null

            resolver.openOutputStream(newUri)?.use { output ->
                encryptedFile.openFileInput().use { input ->
                    input.copyTo(output)
                }
            }

            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                values.clear()
                values.put(MediaStore.MediaColumns.IS_PENDING, 0)
                resolver.update(newUri, values, null, null)
            }

            // Remove from vault
            encFile.delete()
            val items = getVaultItems().filter { it.id != item.id }
            saveVaultItems(items)

            // Notify media scanner
            MediaScannerConnection.scanFile(context, arrayOf(newUri.toString()), arrayOf(mimeType), null)

            newUri
          } catch (e: Exception) {
            null
          }
          }

          suspend fun decryptToTempCache(item: VaultItem): File? = withContext(Dispatchers.IO) {
          try {
            val vaultDir = getVaultDirectory()
            val encFile = File(vaultDir, item.encryptedFileName)
            if (!encFile.exists()) return@withContext null

            val encryptedFile = EncryptedFile.Builder(
                context,
                encFile,
                masterKey,
                EncryptedFile.FileEncryptionScheme.AES256_GCM_HKDF_4KB
            ).build()

            val ext = item.originalName.substringAfterLast('.', if (item.isVideo) "mp4" else "mp3")
            val tempFile = File(context.cacheDir, "vault_playback_${item.id}.$ext")
            if (tempFile.exists()) tempFile.delete()

            encryptedFile.openFileInput().use { input ->
                FileOutputStream(tempFile).use { output ->
                    input.copyTo(output)
                }
            }
            tempFile
          } catch (e: Exception) {
            null
          }
          }

          fun deleteVaultItem(item: VaultItem): Boolean {
          return try {
            val vaultDir = getVaultDirectory()
            val encFile = File(vaultDir, item.encryptedFileName)
            if (encFile.exists()) {
                encFile.delete()
            }
            val items = getVaultItems().filter { it.id != item.id }
            saveVaultItems(items)
            true
          } catch (e: Exception) {
            false
          }
          }
          }

