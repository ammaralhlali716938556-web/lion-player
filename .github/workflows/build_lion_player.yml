              android:layout_height="match_parent"
              android:background="@color/app_background"
              android:gravity="center_horizontal"
              android:orientation="vertical"
              android:padding="24dp">

              <ImageView
                  android:id="@+id/ivVaultLockIcon"
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:layout_marginTop="32dp"
                  android:src="@drawable/ic_vault"
                  app:tint="@color/primary" />

              <TextView
                  android:id="@+id/tvVaultLockTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:text="الخزينة السرية"
                  android:textColor="@color/text_primary"
                  android:textSize="22sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvVaultLockSubtitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:gravity="center"
                  android:text="أدخل رمز PIN أو استخدم البصمة لفتح القفل"
                  android:textColor="@color/text_secondary"
                  android:textSize="13sp" />

              <!-- PIN Dots -->
              <LinearLayout
                  android:id="@+id/layoutPinDots"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="28dp"
                  android:layout_marginBottom="24dp"
                  android:orientation="horizontal">

                  <ImageView
                      android:id="@+id/dot1"
                      android:layout_width="18dp"
                      android:layout_height="18dp"
                      android:layout_margin="8dp"
                      android:src="@drawable/bg_pin_dot_empty" />

                  <ImageView
                      android:id="@+id/dot2"
                      android:layout_width="18dp"
                      android:layout_height="18dp"
                      android:layout_margin="8dp"
                      android:src="@drawable/bg_pin_dot_empty" />

                  <ImageView
                      android:id="@+id/dot3"
                      android:layout_width="18dp"
                      android:layout_height="18dp"
                      android:layout_margin="8dp"
                      android:src="@drawable/bg_pin_dot_empty" />

                  <ImageView
                      android:id="@+id/dot4"
                      android:layout_width="18dp"
                      android:layout_height="18dp"
                      android:layout_margin="8dp"
                      android:src="@drawable/bg_pin_dot_empty" />
              </LinearLayout>

              <!-- Keypad Layout -->
              <GridLayout
                  android:id="@+id/keypadGrid"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:alignmentMode="alignMargins"
                  android:columnCount="3"
                  android:rowCount="4"
                  android:useDefaultMargins="true">

                  <TextView
                      android:id="@+id/btnKey1"
                      style="@style/KeypadButtonStyle"
                      android:text="1" />

                  <TextView
                      android:id="@+id/btnKey2"
                      style="@style/KeypadButtonStyle"
                      android:text="2" />

                  <TextView
                      android:id="@+id/btnKey3"
                      style="@style/KeypadButtonStyle"
                      android:text="3" />

                  <TextView
                      android:id="@+id/btnKey4"
                      style="@style/KeypadButtonStyle"
