package com.lionplayer.app.util

import com.lionplayer.app.model.LyricsLine
import java.util.regex.Pattern

object LrcParser {
    private val TIME_PATTERN = Pattern.compile("\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\]")

    fun parse(lrcContent: String): List<LyricsLine> {
        val lines = mutableListOf<LyricsLine>()
        val rawLines = lrcContent.lines()

        for (line in rawLines) {
            val matcher = TIME_PATTERN.matcher(line)
            var lastIndex = 0
            val lineTimes = mutableListOf<Long>()

            while (matcher.find()) {
                val min = matcher.group(1)?.toLongOrNull() ?: 0L
                val sec = matcher.group(2)?.toLongOrNull() ?: 0L
                val msStr = matcher.group(3)
                val ms = when (msStr?.length) {
                    2 -> (msStr.toLongOrNull() ?: 0L) * 10
                    3 -> msStr.toLongOrNull() ?: 0L
                    else -> 0L
                }
                val totalMs = (min * 60 + sec) * 1000 + ms
                lineTimes.add(totalMs)
                lastIndex = matcher.end()
            }

            val text = line.substring(lastIndex).trim()
            if (text.isNotEmpty()) {
                for (t in lineTimes) {
                    lines.add(LyricsLine(t, text))
                }
            }
        }
        return lines.sortedBy { it.timeMs }
    }
}
