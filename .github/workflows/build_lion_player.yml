    private fun showAbRepeatDialog() {
        val currentPos = LionPlayerManager.player?.currentPosition ?: 0L
        val view = layoutInflater.inflate(R.layout.dialog_ab_repeat, null)
        val tvMarkerA = view.findViewById<TextView>(R.id.tvMarkerA)
        val tvMarkerB = view.findViewById<TextView>(R.id.tvMarkerB)
        val btnSetA = view.findViewById<Button>(R.id.btnSetMarkerA)
        val btnSetB = view.findViewById<Button>(R.id.btnSetMarkerB)
        val btnClear = view.findViewById<Button>(R.id.btnClearLoop)

        fun updateTexts() {
            val aStr = LionPlayerManager.markerA?.let { formatDuration(it) } ?: "غير محددة"
            val bStr = LionPlayerManager.markerB?.let { formatDuration(it) } ?: "غير محددة"
            tvMarkerA.text = "نقطة البداية (A): $aStr"
            tvMarkerB.text = "نقطة النهاية (B): $bStr"
        }
        updateTexts()

        val dialog = AlertDialog.Builder(this)
            .setTitle("تكرار مقطع A-B (AB Repeat)")
            .setView(view)
            .setPositiveButton("تم") { d, _ -> d.dismiss() }
            .create()

        btnSetA.setOnClickListener {
            LionPlayerManager.setMarkerA(currentPos)
            updateTexts()
            Toast.makeText(this, "تم تعيين نقطة A عند: ${formatDuration(currentPos)}", Toast.LENGTH_SHORT).show()
        }

        btnSetB.setOnClickListener {
            if (LionPlayerManager.markerA == null) {
                Toast.makeText(this, "يرجى تعيين نقطة A أولاً", Toast.LENGTH_SHORT).show()
            } else {
                LionPlayerManager.setMarkerB(currentPos)
                updateTexts()
                hudAbLoop.visibility = View.VISIBLE
                Toast.makeText(this, "تم تفعيل تكرار مقطع A-B 🔁", Toast.LENGTH_SHORT).show()
            }
        }

        btnClear.setOnClickListener {
            LionPlayerManager.clearAbLoop()
            updateTexts()
            hudAbLoop.visibility = View.GONE
            Toast.makeText(this, "تم مسح تكرار A-B", Toast.LENGTH_SHORT).show()
        }

        dialog.show()
    }

