                  val dialog = AlertDialog.Builder(this)
            .setTitle(R.string.vault_title)
            .setView(dialogBinding.root)
            .setCancelable(false)
            .setPositiveButton("حفظ", null)
            .setNegativeButton(if (isReset) "إلغاء" else "خروج") { d, _ ->
                d.dismiss()
                if (!isReset) finish()
            }
            .create()

                  dialog.setOnShowListener {
            val saveBtn = dialog.getButton(AlertDialog.BUTTON_POSITIVE)
            saveBtn.setOnClickListener {
                val pin = dialogBinding.etDialogPin.text?.toString()?.trim() ?: ""
                val confirmPin = dialogBinding.etDialogConfirmPin.text?.toString()?.trim() ?: ""
                val question = dialogBinding.etDialogSecurityQuestion.text?.toString()?.trim() ?: ""
                val answer = dialogBinding.etDialogSecurityAnswer.text?.toString()?.trim() ?: ""

                if (pin.length != 4) {
                    dialogBinding.etDialogPin.error = "يجب أن يتكون رمز PIN من 4 أرقام"
                    return@setOnClickListener
                }
                if (pin != confirmPin) {
                    dialogBinding.etDialogConfirmPin.error = getString(R.string.vault_pin_mismatch)
                    return@setOnClickListener
                }
                if (question.isEmpty()) {
                    dialogBinding.etDialogSecurityQuestion.error = "يرجى كتابة سؤال الأمان"
                    return@setOnClickListener
                }
                if (answer.isEmpty()) {
                    dialogBinding.etDialogSecurityAnswer.error = "يرجى كتابة إجابة سؤال الأمان"
                    return@setOnClickListener
                }

                VaultManager.setupVault(this, pin, question, answer)
                dialog.dismiss()
                Toast.makeText(this, "تم تعيين رمز PIN وحماية الخزينة بنجاح 🔒", Toast.LENGTH_LONG).show()
                unlockVault()
            }
