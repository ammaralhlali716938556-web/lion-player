                      <ImageButton
                          android:id=\"@+id/btnRewind10\"
                          android:layout_width=\"42dp\"
                          android:layout_height=\"42dp\"
                          android:background=\"?attr/selectableItemBackgroundBorderless\"
                          android:contentDescription=\"@string/app_name\"
                          android:src=\"@drawable/ic_replay_10\"
                          app:tint=\"#FFFFFF\" />

                      <ImageButton
                          android:id=\"@+id/btnPlayPause\"
                          android:layout_width=\"58dp\"
                          android:layout_height=\"58dp\"
                          android:background=\"?attr/selectableItemBackgroundBorderless\"
                          android:contentDescription=\"@string/app_name\"
                          android:src=\"@drawable/ic_play\"
                          app:tint=\"#FF9800\" />

                      <ImageButton
                          android:id=\"@+id/btnForward10\"
                          android:layout_width=\"42dp\"
                          android:layout_height=\"42dp\"
                          android:background=\"?attr/selectableItemBackgroundBorderless\"
                          android:contentDescription=\"@string/app_name\"
                          android:src=\"@drawable/ic_forward_10\"
                          app:tint=\"#FFFFFF\" />

                      <ImageButton
                          android:id=\"@+id/btnNext\"
                          android:layout_width=\"42dp\"
                          android:layout_height=\"42dp\"
                          android:background=\"?attr/selectableItemBackgroundBorderless\"
                          android:contentDescription=\"@string/app_name\"
                          android:src=\"@drawable/ic_skip_next\"
                          app:tint=\"#FFFFFF\" />
                  </LinearLayout>

                  <HorizontalScrollView
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:scrollbars=\"none\">

                      <LinearLayout
                          android:layout_width=\"wrap_content\"
                          android:layout_height=\"wrap_content\"
                          android:gravity=\"center_vertical\"
                          android:orientation=\"horizontal\">

                          <ImageButton
                              android:id=\"@+id/btnRepeat\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_repeat\"
                              app:tint=\"#FFFFFF\" />

                          <ImageButton
                              android:id=\"@+id/btnAbRepeat\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_ab_repeat\"
                              app:tint=\"#FFFFFF\" />

                          <ImageButton
                              android:id=\"@+id/btnLock\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_lock\"
                              app:tint=\"#FFFFFF\" />

                          <ImageButton
                              android:id=\"@+id/btnRotate\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_screen_rotation\"
                              app:tint=\"#FFFFFF\" />

                          <ImageButton
                              android:id=\"@+id/btnPip\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_pip\"
                              app:tint=\"#FFFFFF\" />

                          <ImageButton
                              android:id=\"@+id/btnResize\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_aspect_ratio\"
                              app:tint=\"#FFFFFF\" />

                          <ImageButton
                              android:id=\"@+id/btnToggleNav\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_view_mode\"
                              app:tint=\"#FFFFFF\" />

                          <ImageButton
                              android:id=\"@+id/btnEqualizer\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_equalizer\"
                              app:tint=\"#FFFFFF\" />

                          <ImageButton
                              android:id=\"@+id/btnSleepTimer\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_timer\"
                              app:tint=\"#FFFFFF\" />

                          <ImageButton
                              android:id=\"@+id/btnKidsLock\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_child_friendly\"
                              app:tint=\"#FFFFFF\" />

                          <ImageButton
                              android:id=\"@+id/btnLyricsToggle\"
                              android:layout_width=\"38dp\"
                              android:layout_height=\"38dp\"
                              android:background=\"?attr/selectableItemBackgroundBorderless\"
                              android:contentDescription=\"@string/app_name\"
                              android:src=\"@drawable/ic_lyrics\"
                              app:tint=\"#FFFFFF\" />

                          <com.google.android.material.button.MaterialButton
                              android:id=\"@+id/btnSpeed\"
                              style=\"@style/Widget.MaterialComponents.Button.TextButton\"
                              android:layout_width=\"wrap_content\"
                              android:layout_height=\"38dp\"
                              android:minWidth=\"0dp\"
                              android:text=\"1.0x\"
                              android:textColor=\"#FFFFFF\"
                              android:textSize=\"11sp\" />
                      </LinearLayout>
                  </HorizontalScrollView>
              </LinearLayout>

              <!-- ===================== HUD overlays ===================== -->
              <LinearLayout
                  android:id=\"@+id/hudSeek\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@drawable/bg_hud\"
                  android:gravity=\"center\"
                  android:orientation=\"vertical\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toTopOf=\"parent\">

                  <TextView
                      android:id=\"@+id/tvSeekTarget\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:gravity=\"center\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"13sp\" />
              </LinearLayout>

              <LinearLayout
                  android:id=\"@+id/hudVolume\"
                  android:layout_width=\"160dp\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@drawable/bg_hud\"
                  android:gravity=\"center\"
                  android:orientation=\"vertical\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toTopOf=\"parent\">

                  <TextView
                      android:id=\"@+id/tvVolumeValue\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:text=\"50%\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"14sp\" />

                  <ProgressBar
                      android:id=\"@+id/volumeProgressBar\"
                      style=\"?android:attr/progressBarStyleHorizontal\"
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:max=\"100\"
                      android:progressDrawable=\"@drawable/progress_hud\" />
              </LinearLayout>

              <LinearLayout
                  android:id=\"@+id/hudBrightness\"
                  android:layout_width=\"160dp\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@drawable/bg_hud\"
                  android:gravity=\"center\"
                  android:orientation=\"vertical\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toTopOf=\"parent\">

                  <TextView
                      android:id=\"@+id/tvBrightnessValue\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:text=\"50%\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"14sp\" />

                  <ProgressBar
                      android:id=\"@+id/brightnessProgressBar\"
                      style=\"?android:attr/progressBarStyleHorizontal\"
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:max=\"100\"
                      android:progressDrawable=\"@drawable/progress_hud\" />
              </LinearLayout>

              <LinearLayout
                  android:id=\"@+id/hudFastForward\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@drawable/bg_hud\"
                  android:gravity=\"center\"
                  android:orientation=\"vertical\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toTopOf=\"parent\">

                  <TextView
                      android:id=\"@+id/tvFastForwardValue\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:text=\"2.0x ⏩\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"14sp\" />
              </LinearLayout>

              <LinearLayout
                  android:id=\"@+id/hudZoom\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@drawable/bg_hud\"
                  android:gravity=\"center\"
                  android:orientation=\"vertical\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toTopOf=\"parent\">

                  <TextView
                      android:id=\"@+id/tvZoomValue\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:text=\"100%\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"14sp\" />
              </LinearLayout>

              <LinearLayout
                  android:id=\"@+id/hudDoubleTapLeft\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:layout_marginStart=\"36dp\"
                  android:background=\"@drawable/bg_hud\"
                  android:gravity=\"center\"
                  android:orientation=\"vertical\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toTopOf=\"parent\">

                  <TextView
                      android:id=\"@+id/tvDoubleTapLeftText\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:text=\"-10s\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"14sp\" />
              </LinearLayout>

              <LinearLayout
                  android:id=\"@+id/hudDoubleTapRight\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:layout_marginEnd=\"36dp\"
                  android:background=\"@drawable/bg_hud\"
                  android:gravity=\"center\"
                  android:orientation=\"vertical\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintTop_toTopOf=\"parent\">

                  <TextView
                      android:id=\"@+id/tvDoubleTapRightText\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:text=\"+10s\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"14sp\" />
              </LinearLayout>

              <LinearLayout
                  android:id=\"@+id/hudKidsLockHint\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@drawable/bg_hud\"
                  android:gravity=\"center\"
                  android:orientation=\"vertical\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toTopOf=\"parent\">

                  <TextView
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:text=\"قفل الأطفال مفعّل — انقر الزوايا الأربع\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"13sp\" />

                  <TextView
                      android:id=\"@+id/tvKidsLockProgress\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"6dp\"
                      android:text=\"○ ○ ○ ○\"
                      android:textColor=\"#FF9800\"
                      android:textSize=\"16sp\"
                      android:textStyle=\"bold\" />
              </LinearLayout>

              <!-- Seek thumbnail preview -->
              <LinearLayout
                  android:id=\"@+id/layoutThumbnailPreview\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:layout_marginBottom=\"12dp\"
                  android:background=\"@drawable/bg_hud\"
                  android:gravity=\"center\"
                  android:orientation=\"vertical\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toTopOf=\"@id/bottomControls\"
                  app:layout_constraintStart_toStartOf=\"parent\">

                  <ImageView
                      android:id=\"@+id/ivThumbnailPreview\"
                      android:layout_width=\"144dp\"
                      android:layout_height=\"88dp\"
                      android:contentDescription=\"@string/content_desc\"
                      android:scaleType=\"centerCrop\" />

                  <TextView
                      android:id=\"@+id/tvThumbnailTime\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"4dp\"
                      android:text=\"00:00\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"12sp\" />
              </LinearLayout>

          </androidx.constraintlayout.widget.ConstraintLayout>
          """)

