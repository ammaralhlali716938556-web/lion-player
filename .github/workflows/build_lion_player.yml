          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.util.UUID

          /**
           * ============================================================================
           *  إدارة ملفات الخزينة: التشفير / فك التشفير / الفهرس / ملف .nomedia
           * ----------------------------------------------------------------------------
           *  • المجلد المعزول : context.filesDir/lion_vault  (لا يصله أي تطبيق آخر)
           *  • التشفير        : EncryptedFile = AES-256-GCM-HKDF-4KB (مكتبة Tink)
           *  • الفهرس         : index.json داخل EncryptedSharedPreferences (مشفّر بالكامل)
           *  • الإخفاء        : ملف .nomedia داخل مجلدات التطبيق حتى لا تفهرسه MediaStore
           *  • الاستعادة      : فك التشفير ثم الإدراج في MediaStore (Movies/LionVault أو
           *                     Music/LionVault) أو إلى مجلد SAF يختاره المستخدم.
           * ============================================================================
           */
          object VaultManager {

              private const val VAULT_DIR_NAME = \"lion_vault\"
              private const val DECRYPT_CACHE_DIR = \"lion_vault_cache\"
              private const val PREF_INDEX_KEY = \"vault_index_v1\"
              private const val BUFFER_SIZE = 64 * 1024

              private val ioScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)

              /** اسم المجلد الظاهر للعناصر القادمة من الخزينة داخل قائمة المشغل */
              const val VAULT_FOLDER_LABEL = \"الخزينة السرية\"

              // =========================================================================
              //  المسارات المعزولة
              // =========================================================================

              /** المجلد الداخلي الخاص بالتطبيق الذي تُحفظ فيه الملفات المشفّرة */
              fun vaultDir(context: Context): File {
                  val dir = File(context.filesDir, VAULT_DIR_NAME)
                  if (!dir.exists()) dir.mkdirs()
                  ensureNoMedia(dir)
                  return dir
              }

              /** مجلد فك التشفير المؤقت (داخل cacheDir ويُمسح عند إعادة القفل) */
              fun decryptCacheDir(context: Context): File {
                  val dir = File(context.cacheDir, DECRYPT_CACHE_DIR)
                  if (!dir.exists()) dir.mkdirs()
                  ensureNoMedia(dir)
                  return dir
              }

              /**
               * إنشاء ملف ‎.nomedia داخل المجلد: يضمن عدم فهرسة أي ملف (حتى لو سُرب المسار)
               * في معرض الوسائط أو أي مشغل آخر على الهاتف.
               */
              fun ensureNoMedia(dir: File): File {
                  val noMedia = File(dir, \".nomedia\")
                  try {
                      if (!noMedia.exists()) {
                          noMedia.createNewFile()
                          noMedia.writeText(\"Lion Player Secure Vault - do not index\")
                      }
                  } catch (e: Exception) {
                      // لا يفشل التدفق بسبب .nomedia
                  }
                  return noMedia
              }

              // =========================================================================
              //  ملف EncryptedFile
              // =========================================================================

              /**
               * بناء EncryptedFile (AES-256-GCM-HKDF-4KB عبر Tink):
               *  • API 23+  -> Builder(Context, File, MasterKey, scheme)
               *  • API 21/22 -> Builder(File, Context, keyAlias, scheme)
               */
              private fun buildEncryptedFile(context: Context, file: File): EncryptedFile {
                  val appContext = context.applicationContext
                  val keyMaterial = VaultSecurityManager.masterKeyMaterial(appContext)
                  val builder = if (keyMaterial is MasterKey) {
                      EncryptedFile.Builder(
                          appContext,
                          file,
                          keyMaterial,
                          EncryptedFile.FileEncryptionScheme.AES256_GCM_HKDF_4KB
                      )
                  } else {
                      @Suppress(\"DEPRECATION\")
                      EncryptedFile.Builder(
                          file,
                          appContext,
                          keyMaterial as String,
                          EncryptedFile.FileEncryptionScheme.AES256_GCM_HKDF_4KB
                      )
                  }
                  return builder.build()
              }

              // =========================================================================
              //  الفهرس المشفّر
              // =========================================================================

              fun listVaultFiles(context: Context): List<VaultFileItem> {
                  return try {
                      val raw = VaultSecurityManager.securePrefs(context)
                          .getString(PREF_INDEX_KEY, null) ?: return emptyList()
                      val array = JSONArray(raw)
                      val list = ArrayList<VaultFileItem>(array.length())
                      for (i in 0 until array.length()) {
                          val o = array.optJSONObject(i) ?: continue
                          val name = o.optString(\"name\")
                          val fileName = o.optString(\"file\")
                          if (name.isEmpty() || fileName.isEmpty()) continue
                          // تنظيف الملفات اليتيمة من الفهرس (محذوفة يدوياً من المجلد)
                          if (!File(vaultDir(context), fileName).exists()) continue
                          list.add(
                              VaultFileItem(
                                  id = o.optString(\"id\"),
                                  displayName = name,
                                  encryptedFileName = fileName,
                                  sizeBytes = o.optLong(\"size\"),
                                  isVideo = o.optBoolean(\"video\"),
                                  originalFolder = o.optString(\"folder\"),
                                  addedAt = o.optLong(\"addedAt\"),
                                  originalUri = o.optString(\"uri\")
                              )
                          )
                      }
                      list.sortedByDescending { it.addedAt }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun saveIndex(context: Context, items: List<VaultFileItem>) {
                  val array = JSONArray()
                  for (item in items) {
                      array.put(
                          JSONObject().apply {
                              put(\"id\", item.id)
                              put(\"name\", item.displayName)
                              put(\"file\", item.encryptedFileName)
                              put(\"size\", item.sizeBytes)
                              put(\"video\", item.isVideo)
                              put(\"folder\", item.originalFolder)
                              put(\"addedAt\", item.addedAt)
                              put(\"uri\", item.originalUri)
                          }
                      )
                  }
                  VaultSecurityManager.securePrefs(context)
                      .edit()
                      .putString(PREF_INDEX_KEY, array.toString())
                      .apply()
              }

              private fun findItem(context: Context, id: String): VaultFileItem? =
                  listVaultFiles(context).firstOrNull { it.id == id }

              // =========================================================================
              //  1) الإخفاء: نقل + تشفير ملف من الوسائط العامة إلى الخزينة
              // =========================================================================

              /**
               * يشفّر ملف وسائط (من MediaStore) داخل الخزينة.
               * @param deleteOriginal حذف الملف الأصلي من الهاتف بعد نجاح التشفير (نقل فعلي).
               */
              suspend fun lockMediaItem(
                  context: Context,
                  item: MediaItem,
                  deleteOriginal: Boolean = true
              ): VaultResult<VaultFileItem> = withContext(Dispatchers.IO) {
                  try {
                      val resolver = context.contentResolver
                      val sourceUri = Uri.parse(item.uri)
                      val id = UUID.randomUUID().toString()
                      val safeName = sanitizeName(item.title.ifEmpty { \"media_file\" })
                      val target = File(vaultDir(context), \"${id.take(8)}.lv\")
                      if (target.exists()) target.delete()

                      val encryptedFile = buildEncryptedFile(context, target)
                      var written = 0L

                      resolver.openInputStream(sourceUri)?.use { input ->
                          encryptedFile.openFileOutput().use { output ->
                              val buffer = ByteArray(BUFFER_SIZE)
                              while (true) {
                                  val read = input.read(buffer)
                                  if (read <= 0) break
                                  output.write(buffer, 0, read)
                                  written += read
                              }
                              output.flush()
                          }
                      } ?: run {
                          VaultSecurityManager.secureDelete(target)
                          return@withContext VaultResult.Failure(\"تعذّر قراءة الملف الأصلي\")
                      }

                      val vaultItem = VaultFileItem(
                          id = id,
                          displayName = safeName,
                          encryptedFileName = target.name,
                          sizeBytes = if (written > 0) written else item.size,
                          isVideo = item.isVideo,
                          originalFolder = item.parentFolder.ifEmpty { \"الرئيسي\" },
                          addedAt = System.currentTimeMillis(),
                          originalUri = item.uri
                      )

                      val all = listVaultFiles(context).toMutableList()
                      all.add(0, vaultItem)
                      saveIndex(context, all)

                      if (deleteOriginal) {
                          runCatching { resolver.delete(sourceUri, null, null) }
                          runCatching {
                              if (item.path.isNotEmpty()) File(item.path).delete()
                          }
                      }
                      VaultResult.Success(vaultItem)
                  } catch (e: Exception) {
                      VaultResult.Failure(e.localizedMessage ?: \"فشل تشفير الملف\")
                  }
              }

              /**
               * يشفّر ملفاً من مزود مستندات عام (SAF / ACTION_OPEN_DOCUMENT) داخل الخزينة.
               */
              suspend fun lockFromUri(
                  context: Context,
                  uri: Uri,
                  isVideo: Boolean,
                  deleteOriginal: Boolean = false
              ): VaultResult<VaultFileItem> = withContext(Dispatchers.IO) {
                  try {
                      val resolver = context.contentResolver
                      val displayName = queryDisplayName(context, uri) ?: \"vault_file_${System.currentTimeMillis()}\"
                      val id = UUID.randomUUID().toString()
                      val target = File(vaultDir(context), \"${id.take(8)}.lv\")
                      if (target.exists()) target.delete()

                      val encryptedFile = buildEncryptedFile(context, target)
                      var written = 0L

                      resolver.openInputStream(uri)?.use { input ->
                          encryptedFile.openFileOutput().use { output ->
                              val buffer = ByteArray(BUFFER_SIZE)
                              while (true) {
                                  val read = input.read(buffer)
                                  if (read <= 0) break
                                  output.write(buffer, 0, read)
                                  written += read
                              }
                              output.flush()
                          }
                      } ?: run {
                          VaultSecurityManager.secureDelete(target)
                          return@withContext VaultResult.Failure(\"تعذّر قراءة الملف المحدد\")
                      }

                      val vaultItem = VaultFileItem(
                          id = id,
                          displayName = sanitizeName(displayName),
                          encryptedFileName = target.name,
                          sizeBytes = written,
                          isVideo = isVideo,
                          originalFolder = \"مستند خارجي\",
                          addedAt = System.currentTimeMillis(),
                          originalUri = uri.toString()
                      )
                      val all = listVaultFiles(context).toMutableList()
                      all.add(0, vaultItem)
                      saveIndex(context, all)

                      if (deleteOriginal) runCatching { resolver.delete(uri, null, null) }
                      VaultResult.Success(vaultItem)
                  } catch (e: Exception) {
                      VaultResult.Failure(e.localizedMessage ?: \"فشل تشفير الملف\")
                  }
              }

              // =========================================================================
              //  2) فك التشفير المؤقت للتشغيل داخل التطبيق
              // =========================================================================

              /**
               * يفك تشفير الملف إلى مجلد cache المعزول (.nomedia) حتى يستطيع ExoPlayer تشغيله.
               * الملف المؤقت يُمسح عند الخروج من الخزينة أو إعادة قفلها.
               */
              suspend fun decryptToCache(context: Context, id: String): VaultResult<File> =
                  withContext(Dispatchers.IO) {
                      val item = findItem(context, id)
                          ?: return@withContext VaultResult.Failure(\"الملف غير موجود في الخزينة\")
                      val encrypted = File(vaultDir(context), item.encryptedFileName)
                      if (!encrypted.exists()) {
                          return@withContext VaultResult.Failure(\"الملف المشفّر مفقود من المجلد\")
                      }
                      val outDir = decryptCacheDir(context)
                      val out = File(outDir, item.decryptedFileName)
                      val tmp = File(outDir, \"${item.decryptedFileName}.part\")
                      try {
                          if (tmp.exists()) tmp.delete()
                          buildEncryptedFile(context, encrypted).openFileInput().use { input ->
                              FileOutputStream(tmp).use { output ->
                                  val buffer = ByteArray(BUFFER_SIZE)
                                  while (true) {
                                      val read = input.read(buffer)
                                      if (read <= 0) break
                                      output.write(buffer, 0, read)
                                  }
                                  output.flush()
                              }
                          }
                          if (out.exists()) out.delete()
                          if (!tmp.renameTo(out)) {
                              tmp.inputStream().use { i -> FileOutputStream(out).use { i.copyTo(it) } }
                              tmp.delete()
                          }
                          VaultSession.touch()
                          VaultResult.Success(out)
                      } catch (e: Exception) {
                          VaultSecurityManager.secureDelete(tmp)
                          VaultResult.Failure(e.localizedMessage ?: \"فشل فك التشفير\")
                      }
                  }

              // =========================================================================
              //  3) إلغاء القفل: استعادة الملف إلى مجلد عام في الهاتف
              // =========================================================================

              /**
               * يفك التشفير ثم يُدرج الملف في MediaStore العام:
               * Movies/LionVault للفيديو أو Music/LionVault للصوت.
               * @return مسار/URI الملف المستعاد.
               */
              suspend fun restoreToPublicStorage(
                  context: Context,
                  id: String,
                  removeFromVault: Boolean = true
              ): VaultResult<String> = withContext(Dispatchers.IO) {
                  val decrypted = decryptToCache(context, id)
                  if (decrypted is VaultResult.Failure) {
                      return@withContext VaultResult.Failure(decrypted.message)
                  }
                  val file = (decrypted as VaultResult.Success).value
                  try {
                      val saved = com.lionplayer.app.util.StorageHelper.insertFileToMediaStore(
                          context = context,
                          sourceFile = file,
                          displayName = findItem(context, id)?.displayName ?: file.name,
                          isVideo = findItem(context, id)?.isVideo ?: true
                      )
                      if (saved != null) {
                          if (removeFromVault) deleteVaultFile(context, id, stopPlayback = false)
                          VaultResult.Success(saved.toString())
                      } else {
                          VaultResult.Failure(\"تعذّر حفظ الملف في ذاكرة الهاتف\")
                      }
                  } catch (e: Exception) {
                      VaultResult.Failure(e.localizedMessage ?: \"فشل الاستعادة\")
                  }
              }

              /** فك التشفير إلى مجلد SAF يختاره المستخدم (مفيد لبطاقات SD) */
              suspend fun restoreToSafTree(
                  context: Context,
                  id: String,
                  treeUri: Uri,
                  removeFromVault: Boolean = true
              ): VaultResult<String> = withContext(Dispatchers.IO) {
                  val decrypted = decryptToCache(context, id)
                  if (decrypted is VaultResult.Failure) {
                      return@withContext VaultResult.Failure(decrypted.message)
                  }
                  try {
                      val saved = com.lionplayer.app.util.StorageHelper.copyFileToSafTree(
                          context = context,
                          sourceFile = (decrypted as VaultResult.Success).value,
                          treeUri = treeUri,
                          isVideo = findItem(context, id)?.isVideo ?: true
                      )
                      if (saved != null) {
                          if (removeFromVault) deleteVaultFile(context, id, stopPlayback = false)
                          VaultResult.Success(saved.toString())
                      } else {
                          VaultResult.Failure(\"تعذّر الحفظ في المجلد المحدد\")
                      }
                  } catch (e: Exception) {
                      VaultResult.Failure(e.localizedMessage ?: \"فشل الاستعادة إلى SAF\")
                  }
              }

              // =========================================================================
              //  الحذف / التنظيف / القفل
              // =========================================================================

              fun deleteVaultFile(context: Context, id: String, stopPlayback: Boolean = true) {
                  findItem(context, id)?.let { item ->
                      if (stopPlayback) stopPlaybackIfVaultItem(context, id)
                      VaultSecurityManager.secureDelete(File(vaultDir(context), item.encryptedFileName))
                      VaultSecurityManager.secureDelete(File(decryptCacheDir(context), item.decryptedFileName))
                      val all = listVaultFiles(context).toMutableList()
                      all.removeAll { it.id == id }
                      saveIndex(context, all)
                  }
              }

              fun clearAllVaultFiles(context: Context) {
                  stopVaultPlayback(context)
                  try {
                      vaultDir(context).listFiles()?.forEach { it.delete() }
                      decryptCacheDir(context).listFiles()?.forEach { it.delete() }
                  } catch (e: Exception) {
                      // تجاهل مقصود
                  }
                  saveIndex(context, emptyList())
              }

              /**
               * إعادة قفل الخزينة: إنهاء أي تشغيل قادم من الخزينة + مسح النسخ المفكوكة
               * من الذاكرة المؤقتة + مسح ذاكرة Coil المصغّرات من القرص.
               */
              fun lockVault(context: Context) {
                  stopVaultPlayback(context)
                  wipeDecryptedCache(context)
                  VaultSession.lock()
              }

              fun wipeDecryptedCache(context: Context) {
                  try {
                      decryptCacheDir(context).listFiles()?.forEach { it.delete() }
                  } catch (e: Exception) {
                      // تجاهل مقصود
                  }
                  // مسح المصغّرات المخزّنة (Coil) حتى لا تبقى آثار مرئية لملفات الخزينة
                  ioScope.launch {
                      runCatching { coil.Coil.imageLoader(context).diskCache?.clear() }
                      runCatching { coil.Coil.imageLoader(context).memoryCache?.clear() }
                  }
              }

              private fun stopPlaybackIfVaultItem(context: Context, id: String) {
                  val current = com.lionplayer.app.player.LionPlayerManager.getCurrentItem()
                  if (current != null && current.uri.contains(\"vault_\") && current.id == vaultIdToMediaId(id)) {
                      stopVaultPlayback(context)
                  }
              }

              private fun stopVaultPlayback(context: Context) {
                  val current = com.lionplayer.app.player.LionPlayerManager.getCurrentItem()
                  if (current != null && current.parentFolder == VAULT_FOLDER_LABEL) {
                      com.lionplayer.app.player.LionPlayerManager.stop(context)
                  }
              }

              // =========================================================================
              //  أدوات مساعدة
              // =========================================================================

              /** معرّف MediaItem المستخدم لعناصر الخزينة داخل المشغل */
              fun vaultIdToMediaId(id: String): Long {
                  var hash = 1125899906842597L // عدد أولي
                  for (c in id) hash = 31 * hash + c.code
                  return -kotlin.math.abs(hash)
              }

              fun sanitizeName(name: String): String {
                  val cleaned = name.replace(Regex(\"[\\\\\\\\/:*?\\\"<>|]\"), \"_\").trim()
                  return cleaned.ifEmpty { \"vault_file\" }
              }

              private fun queryDisplayName(context: Context, uri: Uri): String? {
                  return try {
                      context.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          if (cursor.moveToFirst()) {
                              val idx = cursor.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME)
                              if (idx >= 0) cursor.getString(idx) else null
                          } else null
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              fun formatSize(bytes: Long): String {
                  if (bytes <= 0) return \"0 MB\"
                  val mb = bytes / (1024.0 * 1024.0)
                  return if (mb >= 1024) {
                      String.format(java.util.Locale.US, \"%.2f GB\", mb / 1024.0)
                  } else {
                      String.format(java.util.Locale.US, \"%.1f MB\", mb)
                  }
              }

              /** حجم الخزينة الكلي على القرص */
              fun totalVaultSize(context: Context): Long {
                  return try {
                      vaultDir(context).listFiles()?.sumOf { it.length() } ?: 0L
                  } catch (e: Exception) {
                      0L
                  }
              }

              /** مسار المجلد المعزول (لعرضه للمستخدم كتأكيد على العزل) */
              fun vaultPath(context: Context): String = vaultDir(context).absolutePath

              /** فحص سريع لقابلية فك التشفير (يُستخدم لعرض حالة التشفير) */
              fun isFileIntact(context: Context, item: VaultFileItem): Boolean {
                  val f = File(vaultDir(context), item.encryptedFileName)
                  return f.exists() && f.length() > 0
              }

              /** نسخة FileInputStream مساعدة للاختبارات/التشخيص */
              fun openRawEncrypted(context: Context, item: VaultFileItem): FileInputStream? {
                  val f = File(vaultDir(context), item.encryptedFileName)
                  return if (f.exists()) FileInputStream(f) else null
              }
          }
          """)

          # ---------------- app/src/main/java/com/lionplayer/app/vault/VaultSecurityManager.kt ----------------
          add('app/src/main/java/com/lionplayer/app/vault/VaultSecurityManager.kt',
          """\
          package com.lionplayer.app.vault

          import android.content.Context
          import android.content.SharedPreferences
          import android.os.Build
          import android.util.Base64
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          import androidx.security.crypto.MasterKeys
          import java.io.File
          import java.security.SecureRandom
          import javax.crypto.SecretKeyFactory
          import javax.crypto.spec.PBEKeySpec

          /**
           * ============================================================================
           *  Lion Player - Secure Vault (الخزينة السرية)
           * ----------------------------------------------------------------------------
           *  1) حماية الدخول : PIN مشتق عبر PBKDF2-HMAC-SHA256 (120,000 دورة) +
           *     مصادقة بيومترية عبر androidx.biometric.
           *  2) استعادة الرمز : سؤال أمان محلي (تُخزَّن إجابته كمشتق PBKDF2 وليس نصاً صريحاً).
           *  3) المفاتيح       : كل الأسرار محفوظة داخل EncryptedSharedPreferences
           *     (AES-256-GCM) ومفتاحها الرئيسي مربوط بـ Android Keystore.
           *  4) الملفات        : تُشفَّر بـ EncryptedFile (AES-256-GCM-HKDF-4KB / Tink)
           *     داخل context.filesDir/lion_vault + ملف .nomedia.
           *  5) الواجهة        : FLAG_SECURE يمنع لقطات الشاشة وتسجيل الشاشة.
           * ============================================================================
           */

          /** وصف ملف واحد داخل الخزينة المشفّرة */
          data class VaultFileItem(
              val id: String,
              val displayName: String,
              val encryptedFileName: String,
              val sizeBytes: Long,
              val isVideo: Boolean,
              val originalFolder: String,
              val addedAt: Long,
              val originalUri: String = \"\"
          ) {
              /** الامتداد الأصلي (مهم حتى يتعرف ExoPlayer على نوع الحاوية بعد فك التشفير) */
              val extension: String
                  get() = displayName.substringAfterLast('.', \"\").lowercase()

              /** اسم الملف المؤقت بعد فك التشفير (يحمل نفس الامتداد) */
              val decryptedFileName: String
                  get() {
                      val safeId = id.replace(Regex(\"[^A-Za-z0-9]\"), \"\")
                      val ext = if (extension.isEmpty()) (if (isVideo) \"mp4\" else \"mp3\") else extension
                      return \"vault_${safeId}.$ext\"
                  }
          }

          /** نتيجة موحّدة لعمليات الخزينة */
          sealed class VaultResult<out T> {
              data class Success<T>(val value: T) : VaultResult<T>()
              data class Failure(val message: String) : VaultResult<Nothing>()
          }

          /**
           * حالة فتح الخزينة في الذاكرة فقط (لا تُخزَّن على القرص أبداً).
           * تنتهي صلاحيتها تلقائياً بعد المدة التي يحددها المستخدم.
           */
          object VaultSession {
              @Volatile
              private var unlockedAt: Long = 0L

              @Volatile
              var autoLockMinutes: Int = 5
                  private set

              fun setAutoLock(minutes: Int) {
                  autoLockMinutes = minutes.coerceIn(1, 120)
              }

              val isUnlocked: Boolean
                  get() {
                      if (unlockedAt == 0L) return false
                      val timeoutMs = autoLockMinutes * 60_000L
                      return (System.currentTimeMillis() - unlockedAt) < timeoutMs
                  }

              fun unlock() {
                  unlockedAt = System.currentTimeMillis()
              }

              fun touch() {
                  if (unlockedAt != 0L) unlockedAt = System.currentTimeMillis()
              }

              fun lock() {
                  unlockedAt = 0L
              }
          }

          object VaultSecurityManager {

              private const val PREFS_NAME = \"lion_vault_secure_prefs\"
              private const val KEYSET_ALIAS = \"lion_vault_master_keyset\"
              private const val PREF_FILE_NAME = \"__lion_vault_master_key_prefs__\"

              // ---- مفاتيح التخزين ----
              private const val PREF_PIN_SALT = \"pin_salt\"
              private const val PREF_PIN_HASH = \"pin_hash\"
              private const val PREF_ANSWER_SALT = \"answer_salt\"
              private const val PREF_ANSWER_HASH = \"answer_hash\"
              private const val PREF_QUESTION = \"security_question\"
              private const val PREF_BIOMETRIC = \"biometric_enabled\"
              private const val PREF_AUTO_LOCK = \"auto_lock_minutes\"
              private const val PREF_FAIL_COUNT = \"fail_count\"
              private const val PREF_LOCKOUT_UNTIL = \"lockout_until\"
              private const val PREF_SECURE_WINDOW = \"flag_secure_enabled\"

              private const val PIN_ITERATIONS = 120_000
              private const val ANSWER_ITERATIONS = 60_000
              private const val KEY_LENGTH_BITS = 256

              /** حد محاولات PIN الفاشلة قبل التجميد المؤقت */
              const val MAX_PIN_ATTEMPTS = 5
              private const val LOCKOUT_MS = 30_000L

              const val MIN_PIN_LENGTH = 4
              const val MAX_PIN_LENGTH = 8

              val SECURITY_QUESTIONS: List<String> = listOf(
                  \"ما اسم أول مدرسة درست فيها؟\",
                  \"ما اسم حيوانك الأليف الأول؟\",
                  \"ما اسم مدينة والدتك قبل الزواج؟\",
                  \"ما رقم هاتف منزل العائلة القديم؟\",
                  \"ما اسم أول صديق لك؟\",
                  \"ما اسم الشارع الذي نشأت فيه؟\"
              )

              @Volatile
              private var cachedPrefs: SharedPreferences? = null

              // =========================================================================
              //  EncryptedSharedPreferences - تخزين الأسرار
              // =========================================================================

              @Synchronized
              fun securePrefs(context: Context): SharedPreferences {
                  cachedPrefs?.let { return it }
                  val appContext = context.applicationContext

                  val keyMaterial = masterKeyMaterial(appContext)

                  val prefs = if (keyMaterial is MasterKey) {
                      // API 23+ : MasterKey الحديث (Android Keystore + AES256-GCM)
                      EncryptedSharedPreferences.create(
                          appContext,
                          PREFS_NAME,
                          keyMaterial,
                          EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                          EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                      )
                  } else {
                      // API 21/22 : مسار الاسم النصي (deprecated) المدعوم من security-crypto
                      @Suppress(\"DEPRECATION\")
                      EncryptedSharedPreferences.create(
                          PREFS_NAME,
                          keyMaterial as String,
                          appContext,
                          EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                          EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                      )
                  }
                  cachedPrefs = prefs
                  return prefs
              }

              /**
               * مادة المفتاح الرئيسي:
               *  • API 23+  -> [MasterKey] مربوط بـ Android Keystore (AES-256-GCM).
               *  • API 21/22 -> اسم المفتاح النصي عبر [MasterKeys] (المسار القديم المدعوم).
               */
              fun masterKeyMaterial(context: Context): Any {
                  val appContext = context.applicationContext
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      MasterKey.Builder(appContext)
                          .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)
                          .build()
                  } else {
                      @Suppress(\"DEPRECATION\")
                      MasterKeys.getOrCreate(MasterKeys.AES256_GCM_SPEC)
                  }
              }

              // =========================================================================
              //  تهيئة الخزينة / حالة التفعيل
              // =========================================================================

              fun isVaultEnabled(context: Context): Boolean {
                  val prefs = securePrefs(context)
                  return prefs.getString(PREF_PIN_HASH, null)?.isNotEmpty() == true
              }

              fun isBiometricEnabled(context: Context): Boolean =
                  securePrefs(context).getBoolean(PREF_BIOMETRIC, true)

              fun setBiometricEnabled(context: Context, enabled: Boolean) {
                  securePrefs(context).edit().putBoolean(PREF_BIOMETRIC, enabled).apply()
              }

              fun isSecureWindowEnabled(context: Context): Boolean =
                  securePrefs(context).getBoolean(PREF_SECURE_WINDOW, true)

              fun setSecureWindowEnabled(context: Context, enabled: Boolean) {
                  securePrefs(context).edit().putBoolean(PREF_SECURE_WINDOW, enabled).apply()
              }

              fun getAutoLockMinutes(context: Context): Int {
                  val stored = securePrefs(context).getInt(PREF_AUTO_LOCK, 5)
                  VaultSession.setAutoLock(stored)
                  return VaultSession.autoLockMinutes
              }

              fun setAutoLockMinutes(context: Context, minutes: Int) {
                  VaultSession.setAutoLock(minutes)
                  securePrefs(context).edit().putInt(PREF_AUTO_LOCK, VaultSession.autoLockMinutes).apply()
              }

              /**
               * أول تهيئة للخزينة: يحفظ PIN وسؤال الأمان (كمشتقات PBKDF2) ثم يفتح الجلسة.
               */
              fun initializeVault(
                  context: Context,
                  pin: String,
                  question: String,
                  answer: String,
                  biometricEnabled: Boolean
              ): VaultResult<Unit> {
                  return try {
                      val pinSalt = randomSalt()
                      val pinHash = derive(pin, pinSalt, PIN_ITERATIONS)
                      val answerSalt = randomSalt()
                      val answerHash = derive(normalizeAnswer(answer), answerSalt, ANSWER_ITERATIONS)

                      securePrefs(context).edit()
                          .putString(PREF_PIN_SALT, encode(pinSalt))
                          .putString(PREF_PIN_HASH, encode(pinHash))
                          .putString(PREF_ANSWER_SALT, encode(answerSalt))
                          .putString(PREF_ANSWER_HASH, encode(answerHash))
                          .putString(PREF_QUESTION, question)
                          .putBoolean(PREF_BIOMETRIC, biometricEnabled)
                          .putInt(PREF_FAIL_COUNT, 0)
                          .putLong(PREF_LOCKOUT_UNTIL, 0L)
                          .putBoolean(PREF_SECURE_WINDOW, true)
                          .apply()

                      resetAttemptState(context)
                      VaultSession.unlock()
                      VaultResult.Success(Unit)
                  } catch (e: Exception) {
                      VaultResult.Failure(e.localizedMessage ?: \"تعذّر تهيئة الخزينة\")
                  }
              }

              // =========================================================================
              //  التحقق من رمز PIN + الحماية من التخمين
              // =========================================================================

              /** الوقت المتبقي للتجميد بالميلي ثانية (0 إن لم يكن هناك تجميد) */
              fun lockoutRemainingMs(context: Context): Long {
                  val until = securePrefs(context).getLong(PREF_LOCKOUT_UNTIL, 0L)
                  val remaining = until - System.currentTimeMillis()
                  return if (remaining > 0L) remaining else 0L
              }

              fun failedAttempts(context: Context): Int =
                  securePrefs(context).getInt(PREF_FAIL_COUNT, 0)

              fun verifyPin(context: Context, pin: String): VaultResult<Unit> {
                  if (!isVaultEnabled(context)) {
                      return VaultResult.Failure(\"الخزينة غير مفعّلة بعد\")
                  }
                  val lockout = lockoutRemainingMs(context)
                  if (lockout > 0L) {
                      return VaultResult.Failure(\"محاولات كثيرة خاطئة — انتظر ${(lockout / 1000L) + 1} ثانية\")
                  }
                  return try {
                      val prefs = securePrefs(context)
                      val salt = decode(prefs.getString(PREF_PIN_SALT, null) ?: return VaultResult.Failure(\"الرمز غير صالح\"))
                      val expected = decode(prefs.getString(PREF_PIN_HASH, null) ?: return VaultResult.Failure(\"الرمز غير صالح\"))
                      val actual = derive(pin, salt, PIN_ITERATIONS)

                      if (constantTimeEquals(expected, actual)) {
                          resetAttemptState(context)
                          VaultSession.unlock()
                          VaultResult.Success(Unit)
                      } else {
                          registerFailedAttempt(context)
                          val remaining = MAX_PIN_ATTEMPTS - failedAttempts(context)
                          if (remaining <= 0) {
                              VaultResult.Failure(\"تم إيقاف المحاولات مؤقتاً — أعد المحاولة بعد 30 ثانية\")
                          } else {
                              VaultResult.Failure(\"رمز PIN غير صحيح — المحاولات المتبقية: $remaining\")
                          }
                      }
                  } catch (e: Exception) {
                      VaultResult.Failure(\"خطأ أثناء التحقق من الرمز\")
                  }
              }

              private fun registerFailedAttempt(context: Context) {
                  val prefs = securePrefs(context)
                  val count = prefs.getInt(PREF_FAIL_COUNT, 0) + 1
                  val editor = prefs.edit().putInt(PREF_FAIL_COUNT, count)
                  if (count >= MAX_PIN_ATTEMPTS) {
                      editor.putLong(PREF_LOCKOUT_UNTIL, System.currentTimeMillis() + LOCKOUT_MS)
                          .putInt(PREF_FAIL_COUNT, 0)
                  }
                  editor.apply()
              }

              private fun resetAttemptState(context: Context) {
                  securePrefs(context).edit()
                      .putInt(PREF_FAIL_COUNT, 0)
                      .putLong(PREF_LOCKOUT_UNTIL, 0L)
                      .apply()
              }

              // =========================================================================
              //  استعادة الرمز عبر سؤال الأمان المحلي
              // =========================================================================

              fun getSecurityQuestion(context: Context): String =
                  securePrefs(context).getString(PREF_QUESTION, SECURITY_QUESTIONS[0])
                      ?: SECURITY_QUESTIONS[0]

              /**
               * يتحقق من إجابة سؤال الأمان ثم يعيّن رمز PIN جديد مباشرة.
               * لا تُخزَّن الإجابة أو الرمز كنص صريح إطلاقاً.
               */
              fun resetPinWithSecurityAnswer(
                  context: Context,
                  answer: String,
                  newPin: String
              ): VaultResult<Unit> {
                  if (!isVaultEnabled(context)) return VaultResult.Failure(\"الخزينة غير مفعّلة بعد\")
                  if (lockoutRemainingMs(context) > 0L) {
                      return VaultResult.Failure(\"انتظر قليلاً ثم أعد المحاولة\")
                  }
                  return try {
                      val prefs = securePrefs(context)
                      val salt = decode(prefs.getString(PREF_ANSWER_SALT, null)
                          ?: return VaultResult.Failure(\"سؤال الأمان غير مضبوط\"))
                      val expected = decode(prefs.getString(PREF_ANSWER_HASH, null)
                          ?: return VaultResult.Failure(\"سؤال الأمان غير مضبوط\"))
                      val actual = derive(normalizeAnswer(answer), salt, ANSWER_ITERATIONS)

                      if (!constantTimeEquals(expected, actual)) {
                          registerFailedAttempt(context)
                          return VaultResult.Failure(\"إجابة سؤال الأمان غير صحيحة\")
                      }

                      val pinSalt = randomSalt()
                      prefs.edit()
                          .putString(PREF_PIN_SALT, encode(pinSalt))
                          .putString(PREF_PIN_HASH, encode(derive(newPin, pinSalt, PIN_ITERATIONS)))
                          .apply()

                      resetAttemptState(context)
                      VaultSession.unlock()
                      VaultResult.Success(Unit)
                  } catch (e: Exception) {
                      VaultResult.Failure(\"تعذّر إتمام عملية الاستعادة\")
                  }
              }

              /**
               * تحقق منفصل من إجابة سؤال الأمان (بدون تغيير الرمز).
               * يُستخدم في واجهة الاستعادة قبل عرض حقول الرمز الجديد.
               */
              fun verifySecurityAnswer(context: Context, answer: String): Boolean {
                  if (!isVaultEnabled(context)) return false
                  if (lockoutRemainingMs(context) > 0L) return false
                  return try {
                      val prefs = securePrefs(context)
                      val salt = decode(prefs.getString(PREF_ANSWER_SALT, null) ?: return false)
                      val expected = decode(prefs.getString(PREF_ANSWER_HASH, null) ?: return false)
                      val actual = derive(normalizeAnswer(answer), salt, ANSWER_ITERATIONS)
                      val ok = constantTimeEquals(expected, actual)
                      if (!ok) registerFailedAttempt(context) else resetAttemptState(context)
                      ok
                  } catch (e: Exception) {
                      false
                  }
              }

              /** تغيير رمز PIN بعد التأكد من الرمز الحالي */
              fun changePin(context: Context, oldPin: String, newPin: String): VaultResult<Unit> {
                  val verified = verifyPin(context, oldPin)
                  if (verified !is VaultResult.Success) {
                      return VaultResult.Failure((verified as VaultResult.Failure).message)
                  }
                  return try {
                      val salt = randomSalt()
                      securePrefs(context).edit()
                          .putString(PREF_PIN_SALT, encode(salt))
                          .putString(PREF_PIN_HASH, encode(derive(newPin, salt, PIN_ITERATIONS)))
                          .apply()
                      VaultResult.Success(Unit)
                  } catch (e: Exception) {
                      VaultResult.Failure(\"تعذّر تغيير رمز PIN\")
                  }
              }

              /**
               * إعادة ضبط كاملة للخزينة (تُحذف كل المفاتيح والملفات المشفّرة).
               * تُستخدم فقط بعد التحقق من إجابة سؤال الأمان.
               */
              fun wipeVault(context: Context): VaultResult<Unit> {
                  return try {
                      VaultSession.lock()
                      securePrefs(context).edit().clear().apply()
                      VaultResult.Success(Unit)
                  } catch (e: Exception) {
                      VaultResult.Failure(\"تعذّر مسح الخزينة\")
                  }
              }

              // =========================================================================
              //  أدوات التشفير المساعدة
              // =========================================================================

              private fun randomSalt(): ByteArray {
                  val salt = ByteArray(16)
                  SecureRandom().nextBytes(salt)
                  return salt
              }

              private fun derive(secret: String, salt: ByteArray, iterations: Int): ByteArray {
                  val spec = PBEKeySpec(secret.toCharArray(), salt, iterations, KEY_LENGTH_BITS)
                  return try {
                      SecretKeyFactory.getInstance(\"PBKDF2WithHmacSHA256\").generateSecret(spec).encoded
                  } finally {
                      spec.clearPassword()
                  }
              }

              private fun normalizeAnswer(answer: String): String =
                  answer.trim().lowercase().replace(Regex(\"\\\\s+\"), \" \")

              /** مقارنة بزمن ثابت لمنع هجمات التوقيت */
              private fun constantTimeEquals(a: ByteArray, b: ByteArray): Boolean {
                  if (a.size != b.size) return false
                  var diff = 0
                  for (i in a.indices) diff = diff or (a[i].toInt() xor b[i].toInt())
                  return diff == 0
              }

              private fun encode(bytes: ByteArray): String =
                  Base64.encodeToString(bytes, Base64.NO_WRAP)

              private fun decode(value: String): ByteArray =
                  Base64.decode(value, Base64.NO_WRAP)

              /** تنظيف آمن لمصفوفة بايتات في الذاكرة */
              fun zeroOut(bytes: ByteArray?) {
                  bytes?.fill(0)
              }

              /** حذف آمن لملف */
              fun secureDelete(file: File?) {
                  try {
                      if (file != null && file.exists()) file.delete()
                  } catch (e: Exception) {
                      // تجاهل مقصود
                  }
              }
          }
          """)

