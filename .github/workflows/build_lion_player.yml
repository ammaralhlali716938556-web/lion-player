          package com.lion.player.ui

          import android.app.PictureInPictureParams
          import android.content.res.Configuration
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.SeekBar
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import com.lion.player.R
          import com.lion.player.databinding.ActivityPlayerBinding
          import com.lion.player.utils.AudioBoostManager
          import java.util.Locale

          class PlayerActivity : AppCompatActivity() {

              private lateinit var binding: ActivityPlayerBinding
              private var player: ExoPlayer? = null
              private lateinit var audioBoostManager: AudioBoostManager

              private var isKidsLocked = false
              private var currentVolumePercent = 100
              private var currentBrightnessPercent = 50
              private var currentDecoderMode = DecoderMode.HW

              private val handler = Handler(Looper.getMainLooper())
              private var isOverlayVisible = true

              enum class DecoderMode { HW, SW, HW_PLUS }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityPlayerBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  audioBoostManager = AudioBoostManager(this)

                  setupPlayer()
                  setupControls()
                  setupGestures()
                  setupSubtitleDrag()
              }

              private fun setupPlayer() {
                  val renderersFactory = DefaultRenderersFactory(this).apply {
                      when (currentDecoderMode) {
                          DecoderMode.HW -> setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_OFF)
                          DecoderMode.SW -> setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER)
                          DecoderMode.HW_PLUS -> setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON)
                      }
                  }

                  val exo = ExoPlayer.Builder(this, renderersFactory).build()
                  player = exo
                  binding.playerView.player = exo

                  val uriString = intent.getStringExtra("VIDEO_URI") ?: ""
                  val mediaItem = MediaItem.fromUri(Uri.parse(uriString))
                  exo.setMediaItem(mediaItem)
                  exo.prepare()
                  exo.playWhenReady = true

                  exo.addListener(object : Player.Listener {
                      override fun onPlaybackStateChanged(playbackState: Int) {
                          if (playbackState == Player.STATE_READY) {
                              binding.seekBarVideo.max = exo.duration.toInt()
                              binding.txtTotalTime.text = formatTime(exo.duration)
                              audioBoostManager.attachAudioSession(exo.audioSessionId)
                          }
                      }
                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          binding.btnPlayPause.setImageResource(
                              if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play
                          )
                      }
                  })

                  binding.txtVideoTitle.text = intent.getStringExtra("VIDEO_TITLE") ?: "Lion Player"
                  startProgressUpdater()
              }

              private fun setupControls() {
                  binding.btnBack.setOnClickListener { finish() }

                  binding.btnDecoderSwitch.setOnClickListener {
                      cycleDecoder()
                  }

                  binding.btnPlayPause.setOnClickListener {
                      player?.let {
                          if (it.isPlaying) it.pause() else it.play()
                      }
                  }

                  binding.btnKidsLock.setOnClickListener {
                      enableKidsLock()
                  }

                  binding.btnUnlockFloating.setOnClickListener {
                      disableKidsLock()
                  }

                  binding.btnAspectRatio.setOnClickListener {
                      cycleAspectRatio()
                  }

                  binding.btnPip.setOnClickListener {
                      enterPipMode()
                  }

                  binding.btnAudioTrack.setOnClickListener {
                      showAudioTrackDialog()
                  }

                  binding.btnMoreOptions.setOnClickListener {
                      showAdvancedOptionsMenu()
                  }

                  binding.seekBarVideo.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, prog: Int, fromUser: Boolean) {
                          if (fromUser) {
                              player?.seekTo(prog.toLong())
                              binding.txtCurrentTime.text = formatTime(prog.toLong())
                          }
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })
              }

              private fun cycleDecoder() {
                  currentDecoderMode = when (currentDecoderMode) {
                      DecoderMode.HW -> {
                          binding.btnDecoderSwitch.text = getString(R.string.decoder_sw)
                          binding.btnDecoderSwitch.setBackgroundColor(getColor(R.color.lion_badge_sw))
                          DecoderMode.SW
                      }
                      DecoderMode.SW -> {
                          binding.btnDecoderSwitch.text = getString(R.string.decoder_hw_plus)
                          binding.btnDecoderSwitch.setBackgroundColor(getColor(R.color.lion_badge_hw_plus))
                          DecoderMode.HW_PLUS
                      }
                      DecoderMode.HW_PLUS -> {
                          binding.btnDecoderSwitch.text = getString(R.string.decoder_hw)
                          binding.btnDecoderSwitch.setBackgroundColor(getColor(R.color.lion_badge_hw))
                          DecoderMode.HW
                      }
                  }
                  val currentPos = player?.currentPosition ?: 0L
                  player?.release()
                  setupPlayer()
                  player?.seekTo(currentPos)
              }

              private fun enableKidsLock() {
                  isKidsLocked = true
                  binding.topControlsOverlay.visibility = View.GONE
                  binding.bottomControlsOverlay.visibility = View.GONE
                  binding.btnUnlockFloating.visibility = View.VISIBLE
                  Toast.makeText(this, getString(R.string.kids_lock_active), Toast.LENGTH_LONG).show()
              }

              private fun disableKidsLock() {
                  isKidsLocked = false
                  binding.btnUnlockFloating.visibility = View.GONE
                  binding.topControlsOverlay.visibility = View.VISIBLE
                  binding.bottomControlsOverlay.visibility = View.VISIBLE
              }

              private fun cycleAspectRatio() {
                  val current = binding.playerView.resizeMode
                  val next = when (current) {
                      androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIT -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FILL
                      androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FILL -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                      else -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIT
                  }
                  binding.playerView.resizeMode = next
              }

              private fun setupGestures() {
                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (!isKidsLocked) {
                              toggleOverlayControls()
                          }
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          if (isKidsLocked) return false
                          player?.let {
                              if (e.x < window.decorView.width / 2) {
                                  it.seekTo(maxOf(0L, it.currentPosition - 10000))
                                  showHudFeedback("تأخير -10 ثواني", 50)
                              } else {
                                  it.seekTo(minOf(it.duration, it.currentPosition + 10000))
                                  showHudFeedback("تقديم +10 ثواني", 50)
                              }
                          }
                          return true
                      }

                      override fun onScroll(e1: MotionEvent?, e2: MotionEvent, dX: Float, dY: Float): Boolean {
                          if (isKidsLocked || e1 == null) return false
                          val screenWidth = window.decorView.width
                          val screenHeight = window.decorView.height
                          val deltaPercent = ((dY / screenHeight) * 100).toInt()

                          if (e1.x > screenWidth * 0.6) {
                              currentVolumePercent = (currentVolumePercent + deltaPercent).coerceIn(0, 200)
                              audioBoostManager.setBoostLevel(currentVolumePercent)
                              showHudFeedback(String.format(getString(R.string.audio_boost), currentVolumePercent), currentVolumePercent)
                          } else if (e1.x < screenWidth * 0.4) {
                              currentBrightnessPercent = (currentBrightnessPercent + deltaPercent).coerceIn(1, 100)
                              val lp = window.attributes
                              lp.screenBrightness = currentBrightnessPercent / 100f
                              window.attributes = lp
                              showHudFeedback(String.format(getString(R.string.brightness), currentBrightnessPercent), currentBrightnessPercent)
                          }
                          return true
                      }
                  })

                  binding.playerRootLayout.setOnTouchListener { _, event ->
                      gestureDetector.onTouchEvent(event)
                      true
                  }
              }

              private fun setupSubtitleDrag() {
                  var dX = 0f
                  var dY = 0f
                  binding.txtDraggableSubtitle.setOnTouchListener { view, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              dX = view.x - event.rawX
                              dY = view.y - event.rawY
                          }
                          MotionEvent.ACTION_MOVE -> {
                              view.animate().x(event.rawX + dX).y(event.rawY + dY).setDuration(0).start()
                          }
                      }
                      true
                  }
              }

              private fun showHudFeedback(title: String, progress: Int) {
                  binding.hudGestureFeedback.visibility = View.VISIBLE
                  binding.txtHudTitle.text = title
                  binding.progressHud.progress = progress
                  handler.removeCallbacks(hideHudRunnable)
                  handler.postDelayed(hideHudRunnable, 1000)
              }

              private val hideHudRunnable = Runnable {
                  binding.hudGestureFeedback.visibility = View.GONE
              }

              private fun toggleOverlayControls() {
                  isOverlayVisible = !isOverlayVisible
                  val vis = if (isOverlayVisible) View.VISIBLE else View.GONE
                  binding.topControlsOverlay.visibility = vis
                  binding.bottomControlsOverlay.visibility = vis
              }

              private fun enterPipMode() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val params = PictureInPictureParams.Builder().build()
                      enterPictureInPictureMode(params)
                  } else {
                      Toast.makeText(this, "خاصية PiP غير مدعومة على هذا الإصدار", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onPictureInPictureModeChanged(isInPip: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPip, newConfig)
                  val vis = if (isInPip) View.GONE else View.VISIBLE
                  binding.topControlsOverlay.visibility = vis
                  binding.bottomControlsOverlay.visibility = vis
              }

              private fun showAudioTrackDialog() {
                  val tracks = player?.currentTracks ?: return
                  val audioGroups = tracks.groups.filter { it.type == C.TRACK_TYPE_AUDIO }
                  if (audioGroups.isEmpty()) {
                      Toast.makeText(this, "لا توجد مسارات صوتية إضافية", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val names = audioGroups.mapIndexed { i, _ -> "المسار #${i + 1}" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle(getString(R.string.audio_track))
                      .setItems(names) { _, which ->
                          Toast.makeText(this, "تم اختيار: ${names[which]}", Toast.LENGTH_SHORT).show()
                      }.show()
              }

              private fun showAdvancedOptionsMenu() {
                  val options = arrayOf(
                      "سرعة التشغيل",
                      "مؤقت النوم",
                      "خصائص الملف"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("الخيارات المتقدمة")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> {
                                  val speeds = arrayOf("0.5x", "1.0x (طبيعي)", "1.5x", "2.0x")
                                  val vals = floatArrayOf(0.5f, 1.0f, 1.5f, 2.0f)
                                  AlertDialog.Builder(this)
                                      .setTitle("سرعة التشغيل")
                                      .setItems(speeds) { _, i -> player?.setPlaybackSpeed(vals[i]) }
                                      .show()
                              }
                              1 -> {
                                  handler.postDelayed({ player?.pause(); finish() }, 30 * 60 * 1000L)
                                  Toast.makeText(this, "تم ضبط إيقاف التشغيل بعد 30 دقيقة", Toast.LENGTH_SHORT).show()
                              }
                              2 -> {
                                  val fmt = player?.videoFormat
                                  AlertDialog.Builder(this)
                                      .setTitle(getString(R.string.properties))
                                      .setMessage("الأبعاد: ${fmt?.width}x${fmt?.height}\nالكوديك: ${fmt?.sampleMimeType}")
                                      .setPositiveButton("إغلاق", null)
                                      .show()
                              }
                          }
                      }.show()
              }

              private fun startProgressUpdater() {
                  handler.post(object : Runnable {
                      override fun run() {
                          player?.let {
                              if (it.isPlaying) {
                                  binding.seekBarVideo.progress = it.currentPosition.toInt()
                                  binding.txtCurrentTime.text = formatTime(it.currentPosition)
                              }
                          }
                          handler.postDelayed(this, 1000)
                      }
                  })
              }

              private fun formatTime(ms: Long): String {
                  val totalSec = ms / 1000
                  val seconds = totalSec % 60
                  val minutes = (totalSec / 60) % 60
                  val hours = totalSec / 3600
                  return if (hours > 0) {
                      String.format(Locale.getDefault(), "%02d:%02d:%02d", hours, minutes, seconds)
                  } else {
                      String.format(Locale.getDefault(), "%02d:%02d", minutes, seconds)
                  }
              }

              override fun onStop() {
                  super.onStop()
                  player?.pause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  audioBoostManager.release()
                  player?.release()
                  player = null
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LionPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
