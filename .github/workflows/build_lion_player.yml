              private fun setupRecyclerView() {
                  mediaAdapter = MediaAdapter(
                      displayedList,
                      viewStyle,
                      showExtensions,
                      false,
                      onItemClick = { item ->
                          if (mediaAdapter.isSelectionMode) {
                              if (!item.isFolder) {
                                  item.isSelected = !item.isSelected
                                  updateSelectionUI()
                              }
                          } else {
                              if (item.isFolder) {
                                  currentSelectedFolder = item.title
                                  prefs.edit().putString("last_folder", currentSelectedFolder).apply()
                                  refreshListDisplay()
                                  updatePasteBarUI()
                              } else {
                                  val playlist = ArrayList(displayedList.filter { !it.isFolder })
                                  val index = playlist.indexOfFirst { it.id == item.id }.coerceAtLeast(0)
                                  val intent = Intent(this, PlayerActivity::class.java).apply {
                                      putExtra("PLAYLIST", playlist)
                                      putExtra("CURRENT_INDEX", index)
                                  }
                                  startActivity(intent)
                              }
                          }
                      },
                      onItemLongClick = { item ->
                          enterSelectionMode(item)
                      },
                      onMoreOptionsClick = { item, _ -> showItemActionDialog(item) }
                  )
                  applyLayoutManager()
                  rvMedia.adapter = mediaAdapter

                  var lastScaleTriggerTime = 0L
                  scaleGestureDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(detector: ScaleGestureDetector): Boolean {
                          val now = System.currentTimeMillis()
                          if (now - lastScaleTriggerTime < 350) return false

                          val factor = detector.scaleFactor
                          if (factor > 1.15f) {
                              lastScaleTriggerTime = now
                              zoomIn()
                              return true
                          } else if (factor < 0.85f) {
                              lastScaleTriggerTime = now
                              zoomOut()
                              return true
                          }
                          return false
                      }
                  })

                  rvMedia.setOnTouchListener { _, event ->
                      scaleGestureDetector.onTouchEvent(event)
                      false
                  }
              }

              private fun showItemActionDialog(item: MediaItem) {
                  val favoriteTitle = if (item.isFavorite) "إلغاء التفضيل" else "تفضيل"
                  val options = arrayOf(
                      "تحديد",
                      "نسخ",
                      "نقل",
                      favoriteTitle,
                      "إعادة تسمية",
                      "مشاركة",
                      "خصائص",
                      "حذف"
                  )

                  AlertDialog.Builder(this)
                      .setTitle(item.title)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> enterSelectionMode(item)
                              1 -> {
                                  clipBufferList.clear()
                                  clipBufferList.add(item)
                                  activeClipAction = ClipAction.COPY
                                  updatePasteBarUI()
                                  Toast.makeText(this, "تم نسخ المقطع. انتقل للمجلد المطلوب واضغط لصق هنا", Toast.LENGTH_SHORT).show()
                              }
                              2 -> {
                                  clipBufferList.clear()
                                  clipBufferList.add(item)
                                  activeClipAction = ClipAction.MOVE
                                  updatePasteBarUI()
                                  Toast.makeText(this, "تم تحديد المقطع للنقل. انتقل للمجلد واضغط لصق هنا", Toast.LENGTH_SHORT).show()
                              }
                              3 -> toggleFavorite(item)
                              4 -> showRenameDialog(item)
                              5 -> shareMediaItem(item)
                              6 -> showPropertiesDialog(item)
                              7 -> confirmDeleteMediaItem(item)
                          }
                      }
                      .show()
              }

              private fun toggleFavorite(item: MediaItem) {
                  val favSet = prefs.getStringSet("favorite_ids", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  val idStr = item.id.toString()
                  if (item.isFavorite) {
                      favSet.remove(idStr)
                      item.isFavorite = false
                      Toast.makeText(this, "تمت الإزالة من المفضلة", Toast.LENGTH_SHORT).show()
                  } else {
                      favSet.add(idStr)
                      item.isFavorite = true
                      Toast.makeText(this, "تمت الإضافة إلى المفضلة ❤️", Toast.LENGTH_SHORT).show()
                  }
                  prefs.edit().putStringSet("favorite_ids", favSet).apply()
                  refreshListDisplay()
              }

              private fun showRenameDialog(item: MediaItem) {
                  val input = EditText(this).apply {
                      setText(item.title)
                      setSelection(item.title.length)
                  }
                  AlertDialog.Builder(this)
                      .setTitle("إعادة تسمية")
                      .setView(input)
                      .setPositiveButton("حفظ") { _, _ ->
                          val newName = input.text.toString().trim()
                          if (newName.isNotEmpty()) {
                              item.title = newName
                              mediaAdapter.notifyDataSetChanged()
                              Toast.makeText(this, "تمت إعادة التسمية بنجاح", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun shareMediaItem(item: MediaItem) {
                  try {
                      val intent = Intent(Intent.ACTION_SEND).apply {
                          type = if (item.isVideo) "video/*" else "audio/*"
                          putExtra(Intent.EXTRA_STREAM, Uri.parse(item.uri))
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(intent, "مشاركة المقطع"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "تعذر مشاركة المقطع", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun showPropertiesDialog(item: MediaItem) {
                  val sdf = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.getDefault())
                  val dateStr = sdf.format(Date(item.dateAdded * 1000L))
                  val sizeMb = String.format(Locale.US, "%.2f MB", item.size / (1024.0 * 1024.0))
                  val durStr = LionPlayerManager.formatDuration(item.duration)

                  val message = """
                      الاسم: ${item.title}
                      المسار: ${item.path.ifEmpty { item.uri }}
                      النوع: ${if (item.isVideo) "فيديو" else "صوتيات"}
                      الألبوم: ${item.album}
                      الفنان: ${item.artist}
                      الحجم: $sizeMb
                      المدة: $durStr
                      تاريخ الإضافة: $dateStr
                  """.trimIndent()

                  AlertDialog.Builder(this)
                      .setTitle("خصائص المقطع")
                      .setMessage(message)
                      .setPositiveButton("إغلاق", null)
                      .show()
              }

              private fun confirmDeleteMediaItem(item: MediaItem) {
                  AlertDialog.Builder(this)
                      .setTitle("حذف المقطع")
                      .setMessage("هل أنت متأكد من رغبتك في حذف ${item.title} نهائياً من الجهاز؟")
                      .setPositiveButton("حذف") { _, _ ->
                          performDelete(listOf(item))
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun confirmDeleteMultiple(items: List<MediaItem>) {
                  AlertDialog.Builder(this)
                      .setTitle("حذف المقاطع المحددة")
                      .setMessage("هل أنت متأكد من رغبتك في حذف ${items.size} عناصر نهائياً من الذاكرة؟")
                      .setPositiveButton("حذف") { _, _ ->
                          performDelete(items)
                          exitSelectionMode()
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun performDelete(items: List<MediaItem>) {
                  for (item in items) {
                      try {
                          if (item.path.isNotEmpty()) {
                              File(item.path).delete()
                          }
                          contentResolver.delete(Uri.parse(item.uri), null, null)
                      } catch (e: Exception) {}
                      rawVideosList.removeAll { it.id == item.id }
                      rawAudioList.removeAll { it.id == item.id }
                  }
                  refreshListDisplay()
                  Toast.makeText(this, "تم الحذف بنجاح", Toast.LENGTH_SHORT).show()
              }

              private fun zoomIn() {
                  if (viewStyle == MediaAdapter.VIEW_MODE_GRID_SMALL) {
                      viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
                      applyLayoutManager()
                      saveViewStylePref()
                      mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  } else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) {
                      viewStyle = MediaAdapter.VIEW_MODE_LIST
                      applyLayoutManager()
                      saveViewStylePref()
                      mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  }
              }

              private fun zoomOut() {
                  if (viewStyle == MediaAdapter.VIEW_MODE_LIST) {
                      viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
                      applyLayoutManager()
                      saveViewStylePref()
                      mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  } else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) {
                      viewStyle = MediaAdapter.VIEW_MODE_GRID_SMALL
                      applyLayoutManager()
                      saveViewStylePref()
                      mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  }
              }

              private fun saveViewStylePref() {
                  prefs.edit().putInt("view_style", viewStyle).apply()
              }

              private fun applyLayoutManager() {
                  when (viewStyle) {
                      MediaAdapter.VIEW_MODE_LIST -> rvMedia.layoutManager = LinearLayoutManager(this)
                      MediaAdapter.VIEW_MODE_GRID_LARGE -> rvMedia.layoutManager = GridLayoutManager(this, 2)
                      MediaAdapter.VIEW_MODE_GRID_SMALL -> rvMedia.layoutManager = GridLayoutManager(this, 3)
                  }
              }

              private fun setupBottomNav() {
                  bottomNav.setOnItemSelectedListener { menuItem ->
                      val newTab = when (menuItem.itemId) {
                          R.id.nav_local -> TAB_VIDEO
                          R.id.nav_music -> TAB_AUDIO
                          R.id.nav_all -> TAB_ALL
                          R.id.nav_favorites -> TAB_FAVORITES
                          else -> TAB_VIDEO
                      }
                      if (currentTab != newTab) {
                          currentTab = newTab
                          currentSelectedFolder = null
                          prefs.edit().putInt("last_tab", currentTab).putString("last_folder", null).apply()
                          refreshListDisplay()
                          updatePasteBarUI()
                      }
                      true
                  }
              }

              private fun checkAndRequestPermissions() {
                  val permissionsNeeded = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.READ_MEDIA_VIDEO)
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.READ_MEDIA_AUDIO)
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      }
                  }

                  if (permissionsNeeded.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, permissionsNeeded.toTypedArray(), PERMISSION_REQ_CODE)
                  } else {
                      loadMedia()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == PERMISSION_REQ_CODE) {
                      if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          loadMedia()
                      } else {
                          Toast.makeText(this, "يرجى منح صلاحيات الوسائط لتشغيل الملفات", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun loadMedia() {
                  loadVideos()
                  loadAudio()
                  refreshListDisplay()
                  updatePasteBarUI()
              }

              private fun syncFavoritesFromPrefs() {
                  val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
                  var changed = false
                  for (item in rawVideosList) {
                      val isFav = favSet.contains(item.id.toString())
                      if (item.isFavorite != isFav) {
                          item.isFavorite = isFav
                          changed = true
                      }
                  }
                  for (item in rawAudioList) {
                      val isFav = favSet.contains(item.id.toString())
                      if (item.isFavorite != isFav) {
                          item.isFavorite = isFav
                          changed = true
                      }
                  }
                  if (changed) {
                      refreshListDisplay()
                  }
              }

              private fun loadVideos() {
                  rawVideosList.clear()
                  val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
                  val uri = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(
                      MediaStore.Video.Media._ID,
                      MediaStore.Video.Media.DISPLAY_NAME,
                      MediaStore.Video.Media.DATA,
                      MediaStore.Video.Media.DURATION,
                      MediaStore.Video.Media.SIZE,
                      MediaStore.Video.Media.DATE_ADDED,
                      MediaStore.Video.Media.ARTIST,
                      MediaStore.Video.Media.ALBUM
                  )

                  try {
                      contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                          val nameCol = cursor.getColumnIndex(MediaStore.Video.Media.DISPLAY_NAME)
                          val dataCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                          val durationCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                          val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                          val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED)
                          val artistCol = cursor.getColumnIndex(MediaStore.Video.Media.ARTIST)
                          val albumCol = cursor.getColumnIndex(MediaStore.Video.Media.ALBUM)

                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(idCol)
                              val path = cursor.getString(dataCol) ?: ""
                              val dispName = if (nameCol != -1) cursor.getString(nameCol) ?: "" else ""
                              val title = if (dispName.isNotEmpty()) dispName else File(path).name.ifEmpty { "فيديو" }
                              val duration = cursor.getLong(durationCol)
                              val size = cursor.getLong(sizeCol)
                              val dateAdded = cursor.getLong(dateCol)
                              val artist = if (artistCol != -1) cursor.getString(artistCol) ?: "فيديو" else "فيديو"
                              val album = if (albumCol != -1) cursor.getString(albumCol) ?: "فيديو" else "فيديو"
                              val contentUri = ContentUris.withAppendedId(uri, id).toString()
                              val folderName = try {
                                  val parent = File(path).parentFile?.name
                                  if (!parent.isNullOrEmpty()) parent else "الرئيسي"
                              } catch (e: Exception) {
                                  "الرئيسي"
                              }
                              val isFav = favSet.contains(id.toString())

                              rawVideosList.add(
                                  MediaItem(
                                      id, title, contentUri, duration, size, dateAdded, true,
                                      folderName, false, 0, artist, album, isFav, path
                                  )
                              )
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun loadAudio() {
                  rawAudioList.clear()
                  val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
                  val uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.DISPLAY_NAME,
