          cat << 'EOF' > app/src/main/java/com/lionplayer/app/ui/PlayerSettingsBottomSheet.kt
          package com.lionplayer.app.ui

          import android.app.Activity
          import android.content.Context
          import android.view.LayoutInflater
          import android.view.View
          import android.widget.*
          import com.google.android.material.bottomsheet.BottomSheetDialog
          import com.lionplayer.app.LionPlayerApp
          import com.lionplayer.app.R
          import com.lionplayer.app.player.LionPlayerManager

          object PlayerSettingsBottomSheet {

              fun show(
                  activity: Activity,
                  onEqualizerClick: (() -> Unit)? = null,
                  onVolumeBoostChanged: ((Boolean) -> Unit)? = null,
                  onSettingChanged: (() -> Unit)? = null
              ) {
                  val prefs = activity.getSharedPreferences("lion_player_prefs", Context.MODE_PRIVATE)
                  val dialog = BottomSheetDialog(activity, R.style.BottomSheetDialogTheme)
                  val view = LayoutInflater.from(activity).inflate(R.layout.bottom_sheet_settings, null)
                  dialog.setContentView(view)

                  // 1. أزرار السمة والمظهر
                  val btnThemeDark = view.findViewById<TextView>(R.id.btnThemeDark)
                  val btnThemeLight = view.findViewById<TextView>(R.id.btnThemeLight)
                  val btnThemeSystem = view.findViewById<TextView>(R.id.btnThemeSystem)

                  var currentTheme = prefs.getString("theme_mode", "dark") ?: "dark"

                  fun updateThemeUI() {
                      btnThemeDark.isSelected = (currentTheme == "dark")
                      btnThemeLight.isSelected = (currentTheme == "light")
                      btnThemeSystem.isSelected = (currentTheme == "system")
                  }
                  updateThemeUI()

                  fun applyNewTheme(newTheme: String) {
                      if (currentTheme != newTheme) {
                          currentTheme = newTheme
                          prefs.edit().putString("theme_mode", newTheme).apply()
                          updateThemeUI()
                          dialog.dismiss()
                          LionPlayerApp.applyTheme(newTheme)
                      }
                  }

                  btnThemeDark.setOnClickListener { applyNewTheme("dark") }
                  btnThemeLight.setOnClickListener { applyNewTheme("light") }
                  btnThemeSystem.setOnClickListener { applyNewTheme("system") }

                  // 2. مضاعفة الصوت
                  val switchBoost = view.findViewById<Switch>(R.id.switchVolumeBoost)
                  val isBoost = prefs.getBoolean("volume_boost_enabled", false)
                  switchBoost.isChecked = isBoost
                  switchBoost.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean("volume_boost_enabled", isChecked).apply()
                      onVolumeBoostChanged?.invoke(isChecked)
                      onSettingChanged?.invoke()
                      val msg = if (isChecked) "تم تفعيل مضاعفة الصوت حتى 200%" else "تم إيقاف مضاعفة الصوت"
                      Toast.makeText(activity, msg, Toast.LENGTH_SHORT).show()
                  }

                  // 3. فتح معادل الصوت والمؤثرات
                  val layoutEqualizer = view.findViewById<View>(R.id.layoutEqualizerSetting)
                  layoutEqualizer.setOnClickListener {
                      dialog.dismiss()
                      onEqualizerClick?.invoke()
                  }

                  // 4. سرعة الضغط المطول
                  val speedIdx = prefs.getInt("long_press_speed_idx", 3).coerceIn(0, 3)
                  val speedBtns = listOf(
                      view.findViewById<TextView>(R.id.btnSpeed125),
                      view.findViewById<TextView>(R.id.btnSpeed150),
                      view.findViewById<TextView>(R.id.btnSpeed175),
                      view.findViewById<TextView>(R.id.btnSpeed200)
                  )
                  val speedValues = floatArrayOf(1.25f, 1.5f, 1.75f, 2.0f)
                  val speedLabels = arrayOf("1.25x", "1.5x", "1.75x", "2x")

                  fun updateSpeedUI(selected: Int) {
                      speedBtns.forEachIndexed { idx, btn ->
                          btn.isSelected = (idx == selected)
                      }
                  }
                  updateSpeedUI(speedIdx)

                  speedBtns.forEachIndexed { idx, btn ->
                      btn.setOnClickListener {
                          prefs.edit()
                              .putInt("long_press_speed_idx", idx)
                              .putFloat("long_press_speed", speedValues[idx])
                              .putString("long_press_speed_str", speedLabels[idx])
                              .apply()
                          updateSpeedUI(idx)
                          onSettingChanged?.invoke()
                          Toast.makeText(activity, "سرعة التسريع بالضغط: ${speedLabels[idx]}", Toast.LENGTH_SHORT).show()
                      }
                  }

                  // 5. استئناف تشغيل الفيديو
                  val resumeMode = prefs.getInt("resume_playback_mode", 0).coerceIn(0, 2)
                  val radioResumeAuto = view.findViewById<RadioButton>(R.id.radioResumeAuto)
                  val radioResumeStart = view.findViewById<RadioButton>(R.id.radioResumeStart)
                  val radioResumeAsk = view.findViewById<RadioButton>(R.id.radioResumeAsk)

                  when (resumeMode) {
                      0 -> radioResumeAuto.isChecked = true
                      1 -> radioResumeStart.isChecked = true
                      2 -> radioResumeAsk.isChecked = true
                  }

                  val radioGroupResume = view.findViewById<RadioGroup>(R.id.radioGroupResume)
                  radioGroupResume.setOnCheckedChangeListener { _, checkedId ->
                      val mode = when (checkedId) {
                          R.id.radioResumeAuto -> 0
                          R.id.radioResumeStart -> 1
                          R.id.radioResumeAsk -> 2
                          else -> 0
                      }
                      prefs.edit().putInt("resume_playback_mode", mode).apply()
                      onSettingChanged?.invoke()
                  }

                  // 6. التحكم بسماعة البلوتوث
                  val switchBt = view.findViewById<Switch>(R.id.switchBluetooth)
                  switchBt.isChecked = prefs.getBoolean("bluetooth_headset_control", true)
                  switchBt.setOnCheckedChangeListener { _, isChecked ->
                      LionPlayerManager.bluetoothControlEnabled = isChecked
                      prefs.edit().putBoolean("bluetooth_headset_control", isChecked).apply()
                      onSettingChanged?.invoke()
                  }

                  // 7. إظهار كلمات الأغاني
                  val switchLyrics = view.findViewById<Switch>(R.id.switchLyrics)
                  switchLyrics.isChecked = prefs.getBoolean("show_lyrics", true)
                  switchLyrics.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean("show_lyrics", isChecked).apply()
                      onSettingChanged?.invoke()
                  }

                  // 8. إظهار امتدادات الملفات
                  val switchExtensions = view.findViewById<Switch>(R.id.switchExtensions)
                  switchExtensions.isChecked = prefs.getBoolean("show_extensions", false)
                  switchExtensions.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean("show_extensions", isChecked).apply()
                      onSettingChanged?.invoke()
                  }

                  // زر الإغلاق
                  view.findViewById<View>(R.id.btnCloseSettings).setOnClickListener {
                      dialog.dismiss()
                  }

                  dialog.show()
              }
          }
