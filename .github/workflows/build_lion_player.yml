              private var isAudioFolderMode = true
              private var currentSelectedFolder: String? = null
              private var sortBy = "name"
              private var sortAsc = true
              private var viewStyle = MediaAdapter.VIEW_MODE_LIST
              private var showExtensions = false

              enum class ClipAction { NONE, COPY, MOVE }
              private var activeClipAction = ClipAction.NONE
              private val clipBufferList = mutableListOf<MediaItem>()

              private val rawVideosList = mutableListOf<MediaItem>()
              private val rawAudioList = mutableListOf<MediaItem>()
              private val displayedList = mutableListOf<MediaItem>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showSystemBars()
                  setContentView(R.layout.activity_main)

                  prefs = getSharedPreferences("lion_player_prefs", Context.MODE_PRIVATE)
                  showExtensions = prefs.getBoolean("show_extensions", false)
                  viewStyle = prefs.getInt("view_style", MediaAdapter.VIEW_MODE_LIST)
                  sortBy = prefs.getString("sort_by", "name") ?: "name"
                  sortAsc = prefs.getBoolean("sort_asc", true)
                  isVideoFolderMode = prefs.getBoolean("is_video_folder_mode", true)
                  isAudioFolderMode = prefs.getBoolean("is_audio_folder_mode", true)
                  currentTab = prefs.getInt("last_tab", TAB_VIDEO)
                  currentSelectedFolder = prefs.getString("last_folder", null)
                  LionPlayerManager.bluetoothControlEnabled = prefs.getBoolean("bluetooth_headset_control", true)

                  toolbar = findViewById(R.id.topToolbar)
