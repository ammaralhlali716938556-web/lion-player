          package com.lionplayer.app.data.repository
          
          import com.lionplayer.app.data.model.IptvChannel
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.BufferedReader
          import java.io.InputStream
          import java.io.InputStreamReader
          import java.net.URL
          import java.util.regex.Pattern
          
          class IptvRepository {
          
              suspend fun parseFromUrl(m3uUrl: String): List<IptvChannel> = withContext(Dispatchers.IO) {
                  val stream = URL(m3uUrl).openStream()
                  parseFromStream(stream)
              }
          
              suspend fun parseFromStream(inputStream: InputStream): List<IptvChannel> = withContext(Dispatchers.IO) {
                  val channels = mutableListOf<IptvChannel>()
                  val reader = BufferedReader(InputStreamReader(inputStream))
                  var line: String?
          
                  var currentName = ""
                  var currentLogo = ""
                  var currentGroup = "عام"
                  var currentTvgId = ""
          
                  val logoPattern = Pattern.compile("tvg-logo="([^"]+)"")
                  val groupPattern = Pattern.compile("group-title="([^"]+)"")
                  val idPattern = Pattern.compile("tvg-id="([^"]+)"")
          
                  while (reader.readLine().also { line = it } != null) {
                      val trimmed = line!!.trim()
                      if (trimmed.startsWith("#EXTINF:")) {
                          val logoMatcher = logoPattern.matcher(trimmed)
                          if (logoMatcher.find()) currentLogo = logoMatcher.group(1) ?: ""
          
                          val groupMatcher = groupPattern.matcher(trimmed)
                          if (groupMatcher.find()) currentGroup = groupMatcher.group(1) ?: "عام"
          
                          val idMatcher = idPattern.matcher(trimmed)
                          if (idMatcher.find()) currentTvgId = idMatcher.group(1) ?: ""
          
                          val commaIndex = trimmed.lastIndexOf(',')
                          currentName = if (commaIndex != -1 && commaIndex < trimmed.length - 1) {
                              trimmed.substring(commaIndex + 1).trim()
                          } else "قناة بدون اسم"
          
                      } else if (trimmed.isNotEmpty() && !trimmed.startsWith("#")) {
                          if (currentName.isNotEmpty()) {
                              channels.add(
                                  IptvChannel(
                                      name = currentName,
                                      streamUrl = trimmed,
                                      logoUrl = currentLogo,
                                      group = currentGroup,
                                      tvgId = currentTvgId
                                  )
                              )
                              currentName = ""
                              currentLogo = ""
                              currentGroup = "عام"
                              currentTvgId = ""
                          }
                      }
                  }
                  reader.close()
                  channels
              }
          }
