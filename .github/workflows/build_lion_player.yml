name: Build Lion Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Lion Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create App Code & Environment
        run: |
          mkdir -p gradle
          mkdir -p local-maven/androidx/media3/media3-decoder-ffmpeg/1.3.0
          mkdir -p app/src/main/java/com/lionplayer/app/model
          mkdir -p app/src/main/java/com/lionplayer/app/adapter
          mkdir -p app/src/main/java/com/lionplayer/app/player
          mkdir -p app/src/main/java/com/lionplayer/app/receiver
          mkdir -p app/src/main/java/com/lionplayer/app/subtitle
          mkdir -p app/src/main/java/com/lionplayer/app/ui
          mkdir -p app/src/main/java/com/lionplayer/app/viewmodel
          mkdir -p app/src/main/java/com/lionplayer/app/util
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/color

          # Setup local-maven stub for media3-decoder-ffmpeg if required by offline resolver
          python3 -c "import os, zipfile; maven_dir = 'local-maven/androidx/media3/media3-decoder-ffmpeg/1.3.0'; os.makedirs(maven_dir, exist_ok=True); pom = '<?xml version=\"1.0\" encoding=\"UTF-8\"?><project xmlns=\"http://maven.apache.org/POM/4.0.0\" xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"><modelVersion>4.0.0</modelVersion><groupId>androidx.media3</groupId><artifactId>media3-decoder-ffmpeg</artifactId><version>1.3.0</version><packaging>aar</packaging></project>'; open(os.path.join(maven_dir, 'media3-decoder-ffmpeg-1.3.0.pom'), 'w').write(pom); zf = zipfile.ZipFile(os.path.join(maven_dir, 'media3-decoder-ffmpeg-1.3.0.aar'), 'w'); zf.writestr('AndroidManifest.xml', '<?xml version=\"1.0\" encoding=\"utf-8\"?><manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"androidx.media3.decoder.ffmpeg\" />'); cj = zipfile.ZipFile('classes.jar', 'w'); cj.close(); zf.write('classes.jar', 'classes.jar'); zf.close(); os.remove('classes.jar')"

          cat << 'EOF_FILE_app_build_gradle_0' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.lionplayer.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.lionplayer.app"
                  minSdk 23
                  targetSdk 34
                  versionCode 11
                  versionName "2.0.0"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
            debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.media:media:1.7.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'

              // Architecture Components & Coroutines
              implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

              // AndroidX Biometric & Security Crypto for Secure Vault
              implementation 'androidx.biometric:biometric:1.1.0'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'

              // Coil High-Performance Image & Video Thumbnail Loading
              implementation 'io.coil-kt:coil:2.6.0'
              implementation 'io.coil-kt:coil-video:2.6.0'

              // Media3
              def media3_version = "1.3.0"
              implementation "androidx.media3:media3-exoplayer:$media3_version"
              implementation "androidx.media3:media3-ui:$media3_version"
              implementation "androidx.media3:media3-common:$media3_version"
              implementation "androidx.media3:media3-session:$media3_version"
              implementation "androidx.media3:media3-extractor:$media3_version"
          }
          EOF_FILE_app_build_gradle_0

          cat << 'EOF_FILE_app_proguard-rules_pro_1' > app/proguard-rules.pro
          -keep class androidx.media3.** { *; }
          -keep class com.lionplayer.app.model.* { *; }
          -keep class com.lionplayer.app.subtitle.* { *; }
          -keep class coil.* { *; }
          -keep class androidx.biometric.** { *; }
          -keep class androidx.security.crypto.** { *; }
          EOF_FILE_app_proguard-rules_pro_1

          cat << 'EOF_FILE_app_src_main_AndroidManifest_xml_2' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:name=".LionPlayerApp"
                  android:allowBackup="false"
                  android:icon="@drawable/ic_lion_logo"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_lion_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LionPlayer"
                  android:requestLegacyExternalStorage="true"
                  tools:targetApi="34">

                  <activity
            android:name=".ui.SplashActivity"
            android:exported="true"
            android:theme="@style/Theme.LionPlayer.NoActionBar">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
                  </activity>

                  <activity
            android:name=".ui.MainActivity"
            android:exported="true"
            android:windowSoftInputMode="adjustPan" />

                  <activity
            android:name=".ui.PlayerActivity"
            android:exported="true"
            android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout"
            android:supportsPictureInPicture="true" />

                  <activity
            android:name=".ui.VaultActivity"
            android:exported="false"
            android:windowSoftInputMode="adjustResize" />

                  <receiver
            android:name=".receiver.NotificationReceiver"
            android:exported="false" />

              </application>

          </manifest>
          EOF_FILE_app_src_main_AndroidManifest_xml_2

          cat << 'EOF_FILE_build_gradle_3' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "${rootDir}/local-maven" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "${rootDir}/local-maven" }
              }
          }

          tasks.register('clean', Delete) {
              delete rootProject.layout.buildDirectory
          }
          EOF_FILE_build_gradle_3

          cat << 'EOF_FILE_gradle_properties_4' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF_FILE_gradle_properties_4

          cat << 'EOF_FILE_settings_gradle_5' > settings.gradle
          rootProject.name = "LionPlayer"
          include ':app'
          EOF_FILE_settings_gradle_5

          cat << 'EOF_FILE_app_src_main_res_color_color_chip_text_xml_6' > app/src/main/res/color/color_chip_text.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
