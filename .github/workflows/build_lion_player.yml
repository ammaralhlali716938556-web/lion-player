    private fun showTrackSelectionDialog() {
        val player = LionPlayerManager.player ?: return
        val currentTracks = player.currentTracks

        val trackNames = mutableListOf<String>()
        val trackTypes = mutableListOf<Int>()

        for (group in currentTracks.groups) {
            val type = group.type
            if (type == C.TRACK_TYPE_AUDIO || type == C.TRACK_TYPE_TEXT) {
                for (i in 0 until group.length) {
                    val format = group.getTrackFormat(i)
                    val label = format.label ?: format.language ?: "مسار $i"
                    val typeStr = if (type == C.TRACK_TYPE_AUDIO) "صوت" else "ترجمة"
                    val isSelected = group.isTrackSelected(i)
                    val mark = if (isSelected) " ✓" else ""
                    trackNames.add("[$typeStr] $label$mark")
                    trackTypes.add(type)
                }
            }
        }

        if (trackNames.isEmpty()) {
            Toast.makeText(this, "لا توجد مسارات ترجمة أو صوتيات متعددة مدمجة", Toast.LENGTH_SHORT).show()
            return
        }

        AlertDialog.Builder(this)
            .setTitle("المسارات والترجمات المتاحة")
            .setItems(trackNames.toTypedArray()) { _, which ->
                Toast.makeText(this, "تم اختيار: ${trackNames[which]}", Toast.LENGTH_SHORT).show()
            }
            .setPositiveButton("إغلاق", null)
            .show()
    }

