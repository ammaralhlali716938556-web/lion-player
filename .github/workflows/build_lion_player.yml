          import com.lionplayer.app.R
          import com.lionplayer.app.databinding.ActivityVaultAuthBinding
          import com.lionplayer.app.security.VaultManager
          
          class VaultAuthActivity : AppCompatActivity() {
          
              private lateinit var binding: ActivityVaultAuthBinding
              private val pinBuilder = StringBuilder()
              private var isSetupMode = false
              private var setupStep = 1 // 1: enter new pin, 2: confirm pin
              private var tempNewPin = ""
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // Activate FLAG_SECURE to prevent screenshots and screen recordings
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  )
          
                  binding = ActivityVaultAuthBinding.inflate(layoutInflater)
                  setContentView(binding.root)
          
                  isSetupMode = !VaultManager.isVaultSetup(this)
          
                  if (isSetupMode) {
                      initSetupMode()
                  } else {
                      initUnlockMode()
                  }
          
                  setupKeypad()
              }
          
              private fun initSetupMode() {
                  binding.tvVaultAuthTitle.text = "إعداد الخزينة السرية 🔒"
                  binding.tvVaultAuthSubtitle.text = "أنشئ رمز PIN جديد من 4 أرقام"
                  binding.btnForgotPin.visibility = View.GONE
                  binding.btnBiometricAuth.visibility = View.INVISIBLE
                  setupStep = 1
                  tempNewPin = ""
                  clearPin()
              }
          
              private fun initUnlockMode() {
                  binding.tvVaultAuthTitle.text = getString(R.string.vault_title)
                  binding.tvVaultAuthSubtitle.text = getString(R.string.vault_pin_prompt)
                  binding.btnForgotPin.visibility = View.VISIBLE
                  binding.btnBiometricAuth.visibility = View.VISIBLE
          
                  binding.btnForgotPin.setOnClickListener { showSecurityQuestionRecoveryDialog() }
                  binding.btnBiometricAuth.setOnClickListener { showBiometricPrompt() }
          
                  if (VaultManager.isBiometricEnabled(this)) {
                      showBiometricPrompt()
                  }
              }
          
              private fun setupKeypad() {
                  val numberButtons = listOf(
                      binding.btnKey0 to "0",
                      binding.btnKey1 to "1",
                      binding.btnKey2 to "2",
                      binding.btnKey3 to "3",
                      binding.btnKey4 to "4",
                      binding.btnKey5 to "5",
                      binding.btnKey6 to "6",
                      binding.btnKey7 to "7",
                      binding.btnKey8 to "8",
                      binding.btnKey9 to "9"
                  )
          
                  for ((btn, digit) in numberButtons) {
                      btn.setOnClickListener { onDigitClicked(digit) }
                  }
          
                  binding.btnBackspace.setOnClickListener {
                      if (pinBuilder.isNotEmpty()) {
                          pinBuilder.deleteCharAt(pinBuilder.length - 1)
                          updatePinDots()
                      }
                  }
              }
          
              private fun onDigitClicked(digit: String) {
                  if (pinBuilder.length < 4) {
                      pinBuilder.append(digit)
                      updatePinDots()
                      if (pinBuilder.length == 4) {
                          handlePinComplete(pinBuilder.toString())
                      }
                  }
              }
          
              private fun updatePinDots() {
                  val len = pinBuilder.length
                  binding.dot1.setImageResource(if (len >= 1) R.drawable.bg_pin_dot_on else R.drawable.bg_pin_dot_off)
                  binding.dot2.setImageResource(if (len >= 2) R.drawable.bg_pin_dot_on else R.drawable.bg_pin_dot_off)
                  binding.dot3.setImageResource(if (len >= 3) R.drawable.bg_pin_dot_on else R.drawable.bg_pin_dot_off)
                  binding.dot4.setImageResource(if (len >= 4) R.drawable.bg_pin_dot_on else R.drawable.bg_pin_dot_off)
              }
          
              private fun clearPin() {
                  pinBuilder.clear()
                  updatePinDots()
              }
          
              private fun handlePinComplete(pin: String) {
                  if (isSetupMode) {
                      if (setupStep == 1) {
                          tempNewPin = pin
                          setupStep = 2
                          clearPin()
                          binding.tvVaultAuthSubtitle.text = getString(R.string.vault_pin_confirm)
                      } else if (setupStep == 2) {
                          if (pin == tempNewPin) {
                              showSetupSecurityQuestionDialog(pin)
                          } else {
                              Toast.makeText(this, "الرمزان غير متطابقين، حاول مجدداً", Toast.LENGTH_SHORT).show()
                              initSetupMode()
                          }
                      }
                  } else {
                      if (VaultManager.verifyPin(this, pin)) {
                          openVault()
                      } else {
                          Toast.makeText(this, "رمز PIN غير صحيح ❌", Toast.LENGTH_SHORT).show()
                          clearPin()
                      }
                  }
              }
          
              private fun showSetupSecurityQuestionDialog(pin: String) {
                  val questions = arrayOf(
                      "ما هو اسم أول مدرسة التحقت بها؟",
                      "ما هي مدينتك المفضلة؟",
                      "ما هو اسم حيوانك الأليف الأول؟",
                      "ما هي وجبتك المفضلة؟"
                  )
          
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 24, 48, 16)
                  }
          
                  val tvLabelQ = TextView(this).apply {
                      text = "اختر سؤال الأمان للاستعادة:"
                      textSize = 14f
                      setPadding(0, 0, 0, 8)
                  }
                  val spinnerQ = Spinner(this).apply {
                      adapter = ArrayAdapter(this@VaultAuthActivity, android.R.layout.simple_spinner_dropdown_item, questions)
                  }
                  val tvLabelA = TextView(this).apply {
                      text = "الإجابة:"
                      textSize = 14f
                      setPadding(0, 16, 0, 8)
                  }
                  val etAnswer = EditText(this).apply {
                      hint = "أدخل إجابة تتذكرها دائماً..."
                  }
          
                  layout.addView(tvLabelQ)
                  layout.addView(spinnerQ)
                  layout.addView(tvLabelA)
                  layout.addView(etAnswer)
          
                  AlertDialog.Builder(this)
                      .setTitle(R.string.vault_security_q_title)
                      .setMessage("سؤال الأمان سيسمح لك باستعادة الدخول إذا نسيت رمز PIN.")
                      .setView(layout)
                      .setCancelable(false)
                      .setPositiveButton("حفظ وتفعيل الخزينة") { _, _ ->
                          val chosenQ = spinnerQ.selectedItem.toString()
                          val ans = etAnswer.text.toString().trim()
                          if (ans.isNotEmpty()) {
                              VaultManager.setupVault(this, pin, chosenQ, ans)
                              Toast.makeText(this, "تم تفعيل الخزينة السرية بنجاح 🔒", Toast.LENGTH_SHORT).show()
                              openVault()
                          } else {
                              Toast.makeText(this, "يرجى إدخال إجابة صالحة", Toast.LENGTH_SHORT).show()
                              initSetupMode()
                          }
                      }
                      .setNegativeButton("إلغاء") { _, _ -> initSetupMode() }
                      .show()
              }
          
              private fun showBiometricPrompt() {
                  val biometricManager = BiometricManager.from(this)
                  val canAuth = biometricManager.canAuthenticate(
                      BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.BIOMETRIC_WEAK
                  )
                  if (canAuth != BiometricManager.BIOMETRIC_SUCCESS) {
                      return
                  }
          
                  val executor = ContextCompat.getMainExecutor(this)
                  val biometricPrompt = BiometricPrompt(this, executor, object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                          super.onAuthenticationSucceeded(result)
                          openVault()
                      }
                      override fun onAuthenticationFailed() {
                          super.onAuthenticationFailed()
                          Toast.makeText(this@VaultAuthActivity, "فشلت المصادقة بالبصمة", Toast.LENGTH_SHORT).show()
                      }
                  })
          
                  val promptInfo = BiometricPrompt.PromptInfo.Builder()
                      .setTitle(getString(R.string.vault_biometric_title))
                      .setSubtitle(getString(R.string.vault_biometric_sub))
                      .setNegativeButtonText("إلغاء")
                      .build()
          
                  biometricPrompt.authenticate(promptInfo)
              }
          
              private fun showSecurityQuestionRecoveryDialog() {
                  val question = VaultManager.getSecurityQuestion(this) ?: "ما هو سؤال الأمان الخاص بك؟"
                  val input = EditText(this).apply {
                      hint = "أدخل الإجابة هنا..."
                  }
          
                  AlertDialog.Builder(this)
                      .setTitle("استعادة رمز PIN")
                      .setMessage("سؤال الأمان:\n$question")
                      .setView(input)
                      .setPositiveButton("تحقق") { _, _ ->
                          val answer = input.text.toString().trim()
                          if (VaultManager.verifySecurityAnswer(this, answer)) {
                              showResetPinDialog()
                          } else {
                              Toast.makeText(this, "إجابة سؤال الأمان غير صحيحة ❌", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }
          
              private fun showResetPinDialog() {
                  val input = EditText(this).apply {
                      hint = "رمز PIN الجديد (4 أرقام)"
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER or android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD
                  }
          
                  AlertDialog.Builder(this)
                      .setTitle("تعيين رمز PIN جديد")
                      .setView(input)
                      .setPositiveButton("حفظ") { _, _ ->
                          val newPin = input.text.toString().trim()
                          if (newPin.length == 4) {
                              VaultManager.resetPin(this, newPin)
                              Toast.makeText(this, "تم تغيير رمز PIN بنجاح! 🔒", Toast.LENGTH_SHORT).show()
                              openVault()
                          } else {
                              Toast.makeText(this, "يجب أن يتكون الرمز من 4 أرقام بالضبط", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }
          
              private fun openVault() {
                  val intent = Intent(this, VaultActivity::class.java)
                  startActivity(intent)
                  finish()
              }
          }
