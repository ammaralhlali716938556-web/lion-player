name: Build Lion Player Pro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Lion Player Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create App Code & Environment
        run: |
          mkdir -p app
          mkdir -p app/src/main
          mkdir -p app/src/main/java/com/lionplayer/app
          mkdir -p app/src/main/java/com/lionplayer/app/adapter
          mkdir -p app/src/main/java/com/lionplayer/app/data/vault
          mkdir -p app/src/main/java/com/lionplayer/app/model
          mkdir -p app/src/main/java/com/lionplayer/app/player
          mkdir -p app/src/main/java/com/lionplayer/app/player/datasource
          mkdir -p app/src/main/java/com/lionplayer/app/receiver
          mkdir -p app/src/main/java/com/lionplayer/app/repository
          mkdir -p app/src/main/java/com/lionplayer/app/service
          mkdir -p app/src/main/java/com/lionplayer/app/ui
          mkdir -p app/src/main/java/com/lionplayer/app/util
          mkdir -p app/src/main/res/color
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night

          # File: gradle.properties
          cat << 'EOF_FILE_0' > gradle.properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
EOF_FILE_0

          # File: settings.gradle
          cat << 'EOF_FILE_1' > settings.gradle
rootProject.name = "LionPlayer"
include ':app'
EOF_FILE_1

          # File: build.gradle
          cat << 'EOF_FILE_2' > build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
EOF_FILE_2

          # File: app/build.gradle
          cat << 'EOF_FILE_3' > app/build.gradle
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lionplayer.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lionplayer.app"
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'

    def media3_version = "1.3.0"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-cast:$media3_version"

    implementation "com.google.android.gms:play-services-cast-framework:21.4.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
EOF_FILE_3

          # File: app/proguard-rules.pro
          cat << 'EOF_FILE_4' > app/proguard-rules.pro
-keep class androidx.media3.** { *; }
-keep class com.lionplayer.app.model.** { *; }
-keep class com.google.android.gms.cast.** { *; }
EOF_FILE_4

          # File: app/src/main/AndroidManifest.xml
          cat << 'EOF_FILE_5' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:tools="http://schemas.android.com/tools">

    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-permission android:name="android.permission.BLUETOOTH" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

    <application
        android:name=".LionPlayerApp"
        android:allowBackup="true"
        android:icon="@drawable/ic_lion_logo"
        android:label="@string/app_name"
        android:roundIcon="@drawable/ic_lion_logo"
        android:supportsRtl="true"
        android:requestLegacyExternalStorage="true"
        android:theme="@style/Theme.LionPlayer">

        <meta-data
            android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME"
            android:value="com.lionplayer.app.player.CastOptionsProvider" />

        <activity
            android:name=".ui.SplashActivity"
            android:theme="@style/Theme.LionPlayer.Player"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

        <activity
            android:name=".ui.MainActivity"
            android:exported="false" />

        <activity
            android:name=".ui.PlayerActivity"
            android:theme="@style/Theme.LionPlayer.Player"
            android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
            android:supportsPictureInPicture="true"
            android:launchMode="singleTask"
            android:exported="false" />

        <service
            android:name=".service.LionMediaSessionService"
            android:exported="true"
            android:foregroundServiceType="mediaPlayback">
            <intent-filter>
                <action android:name="androidx.media3.session.MediaSessionService" />
            </intent-filter>
        </service>

        <service
            android:name=".service.FloatingPlayerService"
            android:exported="false"
            android:foregroundServiceType="mediaPlayback" />

        <receiver
            android:name=".receiver.NotificationReceiver"
            android:exported="false">
            <intent-filter>
                <action android:name="com.lionplayer.app.ACTION_NOTIF_PREV" />
                <action android:name="com.lionplayer.app.ACTION_NOTIF_PLAY_PAUSE" />
                <action android:name="com.lionplayer.app.ACTION_NOTIF_NEXT" />
                <action android:name="com.lionplayer.app.ACTION_NOTIF_CLOSE" />
            </intent-filter>
        </receiver>
    </application>
</manifest>
EOF_FILE_5

