      - name: Create App Code & Environment
        run: python3 create_project.py

      - name: Verify project structure
        run: |
          echo "== Kotlin sources: $(find app/src/main/java -name '*.kt' | wc -l) files =="
          find app/src/main/java -name '*.kt' | sort
          echo "== Secure Vault sources =="
          find app/src/main/java/com/lionplayer/app/vault -name '*.kt' | sort
          echo "== Layouts: $(ls app/src/main/res/layout | wc -l) | Drawables: $(ls app/src/main/res/drawable | wc -l) =="
          ls -1 app/build.gradle settings.gradle gradle.properties app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Show APK output
        run: |
          ls -lh app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LionPlayer-SecureVault-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
