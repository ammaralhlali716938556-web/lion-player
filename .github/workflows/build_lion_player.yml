              private fun openPlayerFromMini() {
                  val current = LionPlayerManager.getCurrentItem() ?: return
                  val playlist = LionPlayerManager.playlist
                  val index = LionPlayerManager.currentIndex
                  val intent = Intent(this, PlayerActivity::class.java).apply {
                      putExtra("PLAYLIST", playlist)
                      putExtra("CURRENT_INDEX", index)
                  }
                  startActivity(intent)
              }
          
              private fun updateMiniPlayerUI() {
                  val current = LionPlayerManager.getCurrentItem()
                  val player = LionPlayerManager.player
                  if (current != null && player != null) {
                      binding.miniPlayerLayout.visibility = View.VISIBLE
                      binding.tvMiniTitle.text = current.title
                      binding.tvMiniSub.text = if (current.isVideo) "فيديو • ${current.parentFolder}" else "صوتيات • ${current.artist}"
                      binding.ivMiniThumb.load(Uri.parse(current.uri)) {
                          placeholder(if (current.isVideo) R.drawable.ic_video else R.drawable.ic_music_note)
                          error(if (current.isVideo) R.drawable.ic_video else R.drawable.ic_music_note)
                          crossfade(true)
                      }
                      binding.btnMiniPlayPause.setImageResource(if (player.isPlaying) R.drawable.ic_pause else R.drawable.ic_play)
                  } else {
                      binding.miniPlayerLayout.visibility = View.GONE
                  }
