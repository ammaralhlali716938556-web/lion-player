          package com.lion.player.adapter

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import com.bumptech.glide.Glide
          import com.lion.player.R
          import com.lion.player.model.VideoItem
          import java.util.Locale

          class VideoAdapter(
              private val onVideoClick: (VideoItem) -> Unit,
              private val onVideoLongClick: (VideoItem) -> Unit
          ) : RecyclerView.Adapter<VideoAdapter.VideoViewHolder>() {

              private val videos = mutableListOf<VideoItem>()

              fun submitList(list: List<VideoItem>) {
                  videos.clear()
                  videos.addAll(list)
                  notifyDataSetChanged()
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VideoViewHolder {
                  val v = LayoutInflater.from(parent.context).inflate(R.layout.item_media_video, parent, false)
                  return VideoViewHolder(v)
              }

              override fun onBindViewHolder(holder: VideoViewHolder, position: Int) {
                  holder.bind(videos[position])
              }

              override fun getItemCount(): Int = videos.size

              inner class VideoViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
                  private val imgThumbnail: ImageView = itemView.findViewById(R.id.imgThumbnail)
                  private val txtTitle: TextView = itemView.findViewById(R.id.txtTitle)
                  private val txtDetails: TextView = itemView.findViewById(R.id.txtDetails)

                  fun bind(item: VideoItem) {
                      txtTitle.text = item.title
                      val durationMin = (item.duration / 1000) / 60
                      val durationSec = (item.duration / 1000) % 60
                      val sizeMb = item.size / (1024 * 1024)
                      txtDetails.text = String.format(Locale.getDefault(), "%02d:%02d • %d MB • %s", durationMin, durationSec, sizeMb, item.resolution)

                      Glide.with(itemView.context)
                          .load(item.uri)
                          .placeholder(R.drawable.ic_video)
                          .into(imgThumbnail)

                      itemView.setOnClickListener { onVideoClick(item) }
                      itemView.setOnLongClickListener {
                          onVideoLongClick(item)
                          true
                      }
                  }
              }
          }
