          # app/src/main/java/com/lionplayer/app/util/FormatUtils.kt
          cat << 'EOF_FILE_29' > app/src/main/java/com/lionplayer/app/util/FormatUtils.kt
          package com.lionplayer.app.util
          
          import java.util.Locale
          
          object FormatUtils {
          
              fun formatDuration(durationMs: Long): String {
                  val totalSec = durationMs / 1000
                  val sec = totalSec % 60
                  val min = (totalSec / 60) % 60
                  val hrs = totalSec / 3600
                  return if (hrs > 0) {
                      String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
                  } else {
                      String.format(Locale.US, "%02d:%02d", min, sec)
                  }
              }
          
              fun formatDurationWithMillis(durationMs: Long): String {
                  val totalSec = durationMs / 1000
                  val sec = totalSec % 60
                  val min = (totalSec / 60) % 60
                  val hrs = totalSec / 3600
                  val tenths = (durationMs % 1000) / 100
                  return if (hrs > 0) {
                      String.format(Locale.US, "%d:%02d:%02d.%d", hrs, min, sec, tenths)
                  } else {
                      String.format(Locale.US, "%02d:%02d.%d", min, sec, tenths)
                  }
              }
          
              fun formatFileSize(size: Long): String {
                  if (size <= 0) return "0 MB"
                  val mb = size / (1024.0 * 1024.0)
                  return String.format(Locale.US, "%.1f MB", mb)
              }
          }
