                          binding.tvThumbDuration.visibility = View.GONE
                          binding.tvNewBadge.visibility = View.GONE

                          if (item.newCount > 0) {
                              binding.tvFolderNewCount.visibility = View.VISIBLE
                              binding.tvFolderNewCount.text = if (item.newCount > 99) "99+" else item.newCount.toString()
                          } else {
                              binding.tvFolderNewCount.visibility = View.GONE
                          }
                      } else {
                          binding.tvFolderNewCount.visibility = View.GONE
                          if (item.isNew && !(isSelectionMode && item.isSelected)) {
                              binding.tvNewBadge.visibility = View.VISIBLE
                          } else {
                              binding.tvNewBadge.visibility = View.GONE
                          }

                          if (item.duration > 0) {
                              binding.tvThumbDuration.visibility = View.VISIBLE
                              binding.tvThumbDuration.text = formatDuration(item.duration)
                          } else {
                              binding.tvThumbDuration.visibility = View.GONE
                          }

                          binding.tvSubInfo.visibility = View.VISIBLE
                          val albumStr = if (item.album.isNotEmpty() && item.album != "<unknown>") item.album else "ألبوم غير محدد"
                          val artistStr = if (item.artist.isNotEmpty() && item.artist != "<unknown>") item.artist else "فنان غير معروف"
                          binding.tvSubInfo.text = "الألبوم: $albumStr • الفنان: $artistStr"

                          val sizeFormatted = formatFileSize(item.size)
                          val durationFormatted = formatDuration(item.duration)
                          val favMark = if (item.isFavorite) " ❤️" else ""
                          binding.tvDetails.text = "$durationFormatted | $sizeFormatted$favMark"

                          binding.btnMore.visibility = if (isSelectionMode) View.GONE else View.VISIBLE
                          binding.btnMore.setOnClickListener { v -> onMoreOptionsClick(item, v) }
                      }

                      itemView.setOnClickListener { onItemClick(item) }
                      itemView.setOnLongClickListener {
                          if (!item.isFolder) {
                              onItemLongClick(item)
                              true
                          } else false
                      }
                  }
              }

              private fun formatFileSize(size: Long): String {
                  if (size <= 0) return "0 MB"
                  val mb = size / (1024.0 * 1024.0)
                  return String.format(Locale.US, "%.1f MB", mb)
              }

              private fun formatDuration(durationMs: Long): String {
                  val totalSec = durationMs / 1000
                  val sec = totalSec % 60
                  val min = (totalSec / 60) % 60
                  val hrs = totalSec / 3600
                  return if (hrs > 0) {
                      String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
                  } else {
                      String.format(Locale.US, "%02d:%02d", min, sec)
                  }
              }
          }
