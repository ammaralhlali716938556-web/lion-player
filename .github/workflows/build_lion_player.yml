              private fun toggleFavoriteMultiple(items: List<MediaItem>) {
                  val favSet = prefs.getStringSet("favorite_ids", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  val allAlreadyFav = items.all { it.isFavorite }

                  for (item in items) {
                      val idStr = item.id.toString()
                      if (allAlreadyFav) {
                          favSet.remove(idStr)
                          item.isFavorite = false
                      } else {
                          favSet.add(idStr)
                          item.isFavorite = true
                      }
                  }

                  prefs.edit().putStringSet("favorite_ids", favSet).apply()
                  refreshListDisplay()
                  exitSelectionMode()

                  val msg = if (allAlreadyFav) {
                      "تمت إزالة (${items.size}) مقاطع من المفضلة"
                  } else {
                      "تمت إضافة (${items.size}) مقاطع إلى المفضلة ❤️"
