          # ---------------- app/src/main/res/layout/activity_vault_setup.xml ----------------
          add('app/src/main/res/layout/activity_vault_setup.xml',
          """\
          <?xml version=\"1.0\" encoding=\"utf-8\"?>
          <!-- First-run vault setup: PIN + local security question. FLAG_SECURE applied in code -->
          <ScrollView xmlns:android=\"http://schemas.android.com/apk/res/android\"
              xmlns:app=\"http://schemas.android.com/apk/res-auto\"
              android:layout_width=\"match_parent\"
              android:layout_height=\"match_parent\"
              android:background=\"@color/vault_background\"
              android:fillViewport=\"true\">

              <LinearLayout
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:orientation=\"vertical\"
                  android:paddingStart=\"24dp\"
                  android:paddingTop=\"28dp\"
                  android:paddingEnd=\"24dp\"
                  android:paddingBottom=\"28dp\">

                  <ImageView
                      android:layout_width=\"64dp\"
                      android:layout_height=\"64dp\"
                      android:layout_gravity=\"center_horizontal\"
                      android:contentDescription=\"@string/vault_name\"
                      android:src=\"@drawable/ic_lock\"
                      app:tint=\"@color/vault_accent\" />

                  <TextView
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"14dp\"
                      android:gravity=\"center\"
                      android:text=\"@string/vault_setup_title\"
                      android:textColor=\"@color/vault_text\"
                      android:textSize=\"20sp\"
                      android:textStyle=\"bold\" />

                  <TextView
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"6dp\"
                      android:gravity=\"center\"
                      android:text=\"@string/vault_setup_subtitle\"
                      android:textColor=\"@color/vault_text_secondary\"
                      android:textSize=\"13sp\" />

                  <EditText
                      android:id=\"@+id/etSetupPin\"
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"22dp\"
                      android:background=\"@drawable/bg_vault_input\"
                      android:hint=\"@string/vault_pin_hint\"
                      android:importantForAutofill=\"no\"
                      android:inputType=\"numberPassword\"
                      android:maxLength=\"8\"
                      android:textColor=\"@color/vault_text\"
                      android:textColorHint=\"@color/vault_text_secondary\"
                      android:textSize=\"17sp\" />

                  <EditText
                      android:id=\"@+id/etSetupPinConfirm\"
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"12dp\"
                      android:background=\"@drawable/bg_vault_input\"
                      android:hint=\"@string/vault_confirm_pin\"
                      android:importantForAutofill=\"no\"
                      android:inputType=\"numberPassword\"
                      android:maxLength=\"8\"
                      android:textColor=\"@color/vault_text\"
                      android:textColorHint=\"@color/vault_text_secondary\"
                      android:textSize=\"17sp\" />

                  <TextView
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"22dp\"
                      android:text=\"@string/vault_security_question\"
                      android:textColor=\"@color/vault_accent\"
                      android:textSize=\"13sp\"
                      android:textStyle=\"bold\" />

                  <Spinner
                      android:id=\"@+id/spinnerQuestion\"
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"6dp\"
                      android:background=\"@drawable/bg_vault_input\" />

                  <EditText
                      android:id=\"@+id/etSetupAnswer\"
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"12dp\"
                      android:background=\"@drawable/bg_vault_input\"
                      android:hint=\"@string/vault_security_answer\"
                      android:importantForAutofill=\"no\"
                      android:inputType=\"text\"
                      android:maxLines=\"1\"
                      android:textColor=\"@color/vault_text\"
                      android:textColorHint=\"@color/vault_text_secondary\"
                      android:textSize=\"15sp\" />

                  <com.google.android.material.materialswitch.MaterialSwitch
                      android:id=\"@+id/switchEnableBiometric\"
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"18dp\"
                      android:text=\"تفعيل فتح الخزينة ببصمة الإصبع\"
                      android:textColor=\"@color/vault_text\" />

                  <TextView
                      android:id=\"@+id/tvSetupInfo\"
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"16dp\"
                      android:background=\"@drawable/bg_vault_card\"
                      android:lineSpacingExtra=\"3dp\"
                      android:padding=\"14dp\"
                      android:text=\"الملفات تُشفّر بـ AES-256-GCM داخل مجلد التطبيق المعزول (filesDir) ويُضاف ملف ‎.nomedia لضمان عدم ظهورها في المعرض أو أي مشغل آخر.\"
                      android:textColor=\"@color/vault_text_secondary\"
                      android:textSize=\"11sp\" />

                  <com.google.android.material.button.MaterialButton
                      android:id=\"@+id/btnSaveVault\"
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"20dp\"
                      android:text=\"@string/vault_save\"
                      android:textColor=\"#06121C\"
                      android:textStyle=\"bold\"
                      app:backgroundTint=\"@color/vault_accent\"
                      app:cornerRadius=\"14dp\" />

              </LinearLayout>
          </ScrollView>
          """)

