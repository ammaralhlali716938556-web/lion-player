              private fun initAudioManager() {
                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  maxSystemVolume = audioManager?.getStreamMaxVolume(AudioManager.STREAM_MUSIC) ?: 15
                  val currVol = audioManager?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: (maxSystemVolume / 2)
                  currentTotalVolumePercent = (currVol.toFloat() / maxSystemVolume.toFloat()) * 100f
              }

              private fun initAudioEffects() {
                  try {
                      val sessionId = LionPlayerManager.player?.audioSessionId ?: 0
                      if (sessionId != C.AUDIO_SESSION_ID_UNSET && sessionId != 0) {
                          if (equalizer == null) {
                              equalizer = Equalizer(0, sessionId).apply { enabled = true }
                          }
                          if (bassBoost == null) {
                              bassBoost = BassBoost(0, sessionId).apply { enabled = true }
                          }
                          if (presetReverb == null) {
                              presetReverb = PresetReverb(0, sessionId).apply { enabled = true }
                          }
                          if (loudnessEnhancer == null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                              loudnessEnhancer = LoudnessEnhancer(sessionId).apply {
                                  enabled = currentTotalVolumePercent > 100f
                                  if (currentTotalVolumePercent > 100f) {
                                      val boostRatio = (currentTotalVolumePercent - 100f) / 100f
                                      setTargetGain((boostRatio * 1000f).toInt())
                                  }
                              }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun applyVolumePercent(targetPercent: Float) {
                  val volumeBoostEnabled = prefs.getBoolean("volume_boost_enabled", false)
                  val maxPercent = if (volumeBoostEnabled) 200f else 100f
                  val clampedPercent = targetPercent.coerceIn(0f, maxPercent)
                  currentTotalVolumePercent = clampedPercent

                  audioManager?.let { am ->
                      if (clampedPercent <= 100f) {
                          val targetSysVol = kotlin.math.round((clampedPercent / 100f) * maxSystemVolume).toInt().coerceIn(0, maxSystemVolume)
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, targetSysVol, 0)
                          try {
                              loudnessEnhancer?.setTargetGain(0)
                              loudnessEnhancer?.enabled = false
                          } catch (e: Exception) {}
                      } else {
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, maxSystemVolume, 0)
                          val boostRatio = (clampedPercent - 100f) / 100f
                          val targetGainmB = (boostRatio * 1000f).toInt()
                          initAudioEffects()
                          try {
                              loudnessEnhancer?.apply {
                                  setTargetGain(targetGainmB)
                                  enabled = true
                              }
                          } catch (e: Exception) {}
                      }
                  }

                  hudVolume.visibility = View.VISIBLE
                  volumeProgressBar.max = if (volumeBoostEnabled) 200 else 100
                  volumeProgressBar.progress = clampedPercent.toInt()
                  if (clampedPercent > 100f) {
                      tvVolumeValue.text = "${clampedPercent.toInt()}% 🔊 مضاعف"
                      tvVolumeValue.setTextColor(Color.parseColor("#FF9800"))
                  } else {
                      tvVolumeValue.text = "${clampedPercent.toInt()}%"
                      tvVolumeValue.setTextColor(Color.WHITE)
                  }
              }

              private fun updateBrightnessByPercent(deltaPercent: Float) {
                  val initialPercent = initialBrightness * 100f
                  val targetPercent = (initialPercent + deltaPercent).coerceIn(1f, 100f)

                  val layoutParams = window.attributes
                  layoutParams.screenBrightness = (targetPercent / 100f).coerceIn(0.01f, 1.0f)
                  window.attributes = layoutParams

                  hudBrightness.visibility = View.VISIBLE
                  brightnessProgressBar.progress = targetPercent.toInt()
                  tvBrightnessValue.text = "${targetPercent.toInt()}%"
              }

              private fun applyVideoTransform() {
                  val targetView = playerView.videoSurfaceView ?: playerView
                  targetView.pivotX = targetView.width / 2f
                  targetView.pivotY = targetView.height / 2f
                  targetView.scaleX = videoScale
                  targetView.scaleY = videoScale

                  if (videoScale <= 1.05f) {
                      videoScale = 1.0f
                      targetView.scaleX = 1.0f
                      targetView.scaleY = 1.0f
                      videoTranslationX = 0f
                      videoTranslationY = 0f
                      targetView.translationX = 0f
                      targetView.translationY = 0f
                  } else {
                      val maxTransX = (targetView.width * (videoScale - 1f)) / 2f
                      val maxTransY = (targetView.height * (videoScale - 1f)) / 2f
                      videoTranslationX = videoTranslationX.coerceIn(-maxTransX, maxTransX)
                      videoTranslationY = videoTranslationY.coerceIn(-maxTransY, maxTransY)
                      targetView.translationX = videoTranslationX
                      targetView.translationY = videoTranslationY
                  }

                  if (videoScale > 1.0f) {
                      hudZoom.visibility = View.VISIBLE
                      tvZoomValue.text = "تكبير ${(videoScale * 100).toInt()}%"
                  } else {
                      hudZoom.visibility = View.GONE
                  }
              }

              private fun checkResumePositionForTrack(item: LionMediaItem) {
                  if (!item.isVideo || item.id == lastCheckedResumeItemId) return
                  lastCheckedResumeItemId = item.id

                  val savedPos = prefs.getLong("video_resume_pos_${item.id}", 0L)
                  if (savedPos > 3000L) {
                      val resumeMode = prefs.getInt("resume_playback_mode", 0)
                      when (resumeMode) {
                          0 -> {
                              LionPlayerManager.player?.seekTo(savedPos)
                              Toast.makeText(this, "تم استئناف المقطع من ${formatDuration(savedPos)}", Toast.LENGTH_SHORT).show()
                          }
                          1 -> {
                              LionPlayerManager.player?.seekTo(0L)
                          }
                          2 -> {
                              val p = LionPlayerManager.player
                              p?.pause()
                              AlertDialog.Builder(this)
                                  .setTitle("استئناف المشاهدة")
                                  .setMessage("هل ترغب في متابعة المقطع من حيث توقفت (${formatDuration(savedPos)}) أم البدء من البداية؟")
                                  .setPositiveButton("استئناف (${formatDuration(savedPos)})") { _, _ ->
                                      p?.seekTo(savedPos)
                                      p?.play()
                                  }
                                  .setNegativeButton("من البداية") { _, _ ->
                                      p?.seekTo(0L)
                                      p?.play()
                                  }
                                  .setCancelable(false)
                                  .show()
                          }
                      }
                  }
              }

              private fun saveCurrentVideoPosition() {
                  val currentItem = LionPlayerManager.getCurrentItem()
                  if (currentItem?.isVideo == true) {
                      val p = LionPlayerManager.player
                      val pos = p?.currentPosition ?: 0L
                      val dur = p?.duration ?: 0L
                      if (dur > 0 && pos > 3000L && pos < dur - 5000L) {
                          prefs.edit().putLong("video_resume_pos_${currentItem.id}", pos).apply()
                      } else if (pos >= dur - 5000L) {
                          prefs.edit().remove("video_resume_pos_${currentItem.id}").apply()
                      }
                  }
              }

              private fun updateScreenLock() {
                  val currentItem = LionPlayerManager.getCurrentItem()
                  val isVideo = currentItem?.isVideo == true
                  val isPlaying = LionPlayerManager.player?.isPlaying == true

                  if (isVideo && isPlaying && !isLocked) {
                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  } else {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
              }

              private fun updateFavoriteIcon(isFav: Boolean) {
                  if (isFav) {
                      btnFavorite.setImageResource(R.drawable.ic_favorite)
                      btnFavorite.setColorFilter(Color.parseColor("#FF9800"))
                  } else {
                      btnFavorite.setImageResource(R.drawable.ic_favorite_border)
                      btnFavorite.setColorFilter(Color.WHITE)
                  }
              }

              private fun updateUIForItem(item: LionMediaItem) {
                  tvVideoTitle.text = item.title
                  val dur = item.duration.coerceAtLeast(0L)
                  tvTotalTime.text = formatDuration(dur)
                  playerSeekBar.max = dur.toInt()
                  val curr = LionPlayerManager.player?.currentPosition ?: 0L
                  playerSeekBar.progress = curr.toInt()
                  tvCurrentTime.text = formatDuration(curr)

                  // تحديث حالة زر التفضيل
                  val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
                  item.isFavorite = favSet.contains(item.id.toString())
                  updateFavoriteIcon(item.isFavorite)

                  val videoControlsVis = if (item.isVideo) View.VISIBLE else View.GONE
                  btnRotate.visibility = videoControlsVis
                  btnDecoder.visibility = videoControlsVis
                  btnPip.visibility = videoControlsVis
                  btnResize.visibility = videoControlsVis
                  btnToggleNav.visibility = videoControlsVis

                  btnLyricsToggle.visibility = if (!item.isVideo) View.VISIBLE else View.GONE

                  // النقاط الثلاث وزر التفضيل يظهران دائماً للفيديو والصوت
                  btnFavorite.visibility = View.VISIBLE
                  btnMore.visibility = View.VISIBLE

                  videoScale = 1.0f
                  videoTranslationX = 0f
                  videoTranslationY = 0f
                  applyVideoTransform()

                  if (item.isVideo) {
                      applySystemBarsVisibility()
                      layoutLyrics.visibility = View.GONE
                      checkResumePositionForTrack(item)
                  } else {
                      showSystemNavBars()
                      checkAndLoadLyrics(item)
                  }

                  updateScreenLock()
              }

              private fun checkAndLoadLyrics(item: LionMediaItem) {
                  val showLyricsPref = prefs.getBoolean("show_lyrics", true)
                  if (!showLyricsPref || item.isVideo) {
                      layoutLyrics.visibility = View.GONE
                      return
                  }

                  val lyricsFound = extractLyrics(item)
                  if (lyricsFound.isNotEmpty()) {
                      tvLyrics.text = lyricsFound
                      layoutLyrics.visibility = View.VISIBLE
                  } else {
                      layoutLyrics.visibility = View.GONE
                  }
              }

              private fun extractLyrics(item: LionMediaItem): String {
                  try {
                      if (item.path.isNotEmpty()) {
                          val lrcFile = File(item.path.substringBeforeLast('.') + ".lrc")
                          if (lrcFile.exists()) return lrcFile.readText()

                          val txtFile = File(item.path.substringBeforeLast('.') + ".txt")
                          if (txtFile.exists()) return txtFile.readText()
                      }
                      val retriever = MediaMetadataRetriever()
                      if (item.path.isNotEmpty() && File(item.path).exists()) {
                          retriever.setDataSource(item.path)
                      } else {
                          retriever.setDataSource(this, Uri.parse(item.uri))
                      }
                      val comp = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_COMPILATION)
                      retriever.release()
                      if (!comp.isNullOrEmpty()) return comp
                  } catch (e: Exception) {}
                  return ""
              }

              private fun updatePlayPauseButton(isPlaying: Boolean) {
                  if (isPlaying) {
                      btnPlayPause.setImageResource(R.drawable.ic_pause)
                  } else {
                      btnPlayPause.setImageResource(R.drawable.ic_play)
                  }
                  updateScreenLock()
              }

              private fun setupListeners() {
                  btnBack.setOnClickListener { handleBackAction() }

                  // زر التفضيل داخل المشغل مع حركة نبض جميلة
                  btnFavorite.setOnClickListener {
                      val currentItem = LionPlayerManager.getCurrentItem() ?: return@setOnClickListener
                      val favSet = prefs.getStringSet("favorite_ids", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                      val idStr = currentItem.id.toString()
                      if (currentItem.isFavorite) {
                          favSet.remove(idStr)
                          currentItem.isFavorite = false
                          Toast.makeText(this, "تمت الإزالة من المفضلة", Toast.LENGTH_SHORT).show()
                      } else {
                          favSet.add(idStr)
                          currentItem.isFavorite = true
                          Toast.makeText(this, "تمت الإضافة إلى المفضلة ❤️", Toast.LENGTH_SHORT).show()
                      }
                      prefs.edit().putStringSet("favorite_ids", favSet).apply()
                      updateFavoriteIcon(currentItem.isFavorite)

                      btnFavorite.animate().scaleX(1.35f).scaleY(1.35f).setDuration(120).withEndAction {
                          btnFavorite.animate().scaleX(1.0f).scaleY(1.0f).setDuration(120).start()
                      }.start()
                  }

                  // زر النقاط الثلاث داخل المشغل لفتح الإعدادات الأنيقة
                  btnMore.setOnClickListener {
                      PlayerSettingsBottomSheet.show(
                          activity = this,
                          onEqualizerClick = { showAudioSettingsDialog() },
                          onVolumeBoostChanged = { isBoosted ->
                              if (!isBoosted && currentTotalVolumePercent > 100f) {
                                  applyVolumePercent(100f)
                              }
                          },
                          onSettingChanged = {
                              LionPlayerManager.getCurrentItem()?.let { updateUIForItem(it) }
                          }
                      )
                  }

                  btnRotate.setOnClickListener {
                      rotationState = (rotationState + 1) % 3
                      when (rotationState) {
                          0 -> {
                              requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR
                              Toast.makeText(this, "تدوير تلقائي", Toast.LENGTH_SHORT).show()
                          }
                          1 -> {
                              requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                              Toast.makeText(this, "تدوير أفقي", Toast.LENGTH_SHORT).show()
                          }
                          2 -> {
                              requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                              Toast.makeText(this, "تدوير عمودي", Toast.LENGTH_SHORT).show()
                          }
                      }
                      applySystemBarsVisibility()
                  }

                  btnToggleNav.setOnClickListener {
                      if (isSystemNavHidden) {
                          showSystemNavBars()
                          Toast.makeText(this, "إظهار أزرار التنقل", Toast.LENGTH_SHORT).show()
                      } else {
                          hideSystemBars()
                          Toast.makeText(this, "إلغاء وإخفاء أزرار التنقل", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnLyricsToggle.setOnClickListener {
                      val current = LionPlayerManager.getCurrentItem() ?: return@setOnClickListener
                      if (layoutLyrics.visibility == View.VISIBLE) {
                          layoutLyrics.visibility = View.GONE
                      } else {
                          checkAndLoadLyrics(current)
                          if (layoutLyrics.visibility != View.VISIBLE) {
                              Toast.makeText(this, "لا توجد كلمات مدمجة لهذا المقطع", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  btnPlayPause.setOnClickListener { LionPlayerManager.togglePlayPause(this) }
                  btnNext.setOnClickListener { LionPlayerManager.playNext(this) }
                  btnPrev.setOnClickListener { LionPlayerManager.playPrevious(this) }

                  btnRewind10.setOnClickListener {
                      LionPlayerManager.player?.let { p ->
                          p.seekTo((p.currentPosition - 10000).coerceAtLeast(0L))
                          LionPlayerManager.updateNotification(this)
                      }
                  }

                  btnForward10.setOnClickListener {
                      LionPlayerManager.player?.let { p ->
                          p.seekTo((p.currentPosition + 10000).coerceAtMost(p.duration))
                          LionPlayerManager.updateNotification(this)
                      }
                  }

                  btnEqualizer.setOnClickListener { showAudioSettingsDialog() }

                  btnLock.setOnClickListener {
                      isLocked = true
                      hideAllControls()
                      btnUnlock.visibility = View.VISIBLE
                      updateScreenLock()
                      Toast.makeText(this, "تم قفل الشاشة", Toast.LENGTH_SHORT).show()
                  }

                  btnUnlock.setOnClickListener {
                      isLocked = false
                      btnUnlock.visibility = View.GONE
                      showAllControls()
                      updateScreenLock()
                      Toast.makeText(this, "تم إلغاء قفل الشاشة", Toast.LENGTH_SHORT).show()
                  }

                  btnPip.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          hideAllControls()
                          val params = PictureInPictureParams.Builder().build()
                          enterPictureInPictureMode(params)
                      } else {
                          Toast.makeText(this, "خاصية النافذة العائمة غير مدعومة", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnResize.setOnClickListener {
                      val modes = arrayOf("ملاءمة للشاشة (Fit)", "ملء الشاشة (Crop)", "تمديد (Stretch)")
                      AlertDialog.Builder(this)
                          .setTitle("أبعاد الفيديو")
                          .setItems(modes) { _, which ->
                              when (which) {
                                  0 -> playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                                  1 -> playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                                  2 -> playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FILL
                              }
                          }
                          .show()
                  }

                  btnSpeed.setOnClickListener {
                      val speeds = arrayOf("0.5x", "0.75x", "1.0x", "1.25x", "1.5x", "2.0x")
                      AlertDialog.Builder(this)
                          .setTitle("سرعة التشغيل")
                          .setItems(speeds) { _, which ->
                              val speedVal = when (which) {
                                  0 -> 0.5f
                                  1 -> 0.75f
                                  2 -> 1.0f
                                  3 -> 1.25f
                                  4 -> 1.5f
                                  5 -> 2.0f
                                  else -> 1.0f
                              }
                              LionPlayerManager.player?.playbackParameters = PlaybackParameters(speedVal)
                              btnSpeed.text = speeds[which]
                          }
                          .show()
                  }

                  playerSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) {
                              LionPlayerManager.player?.seekTo(progress.toLong())
                              tvCurrentTime.text = formatDuration(progress.toLong())
                          }
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          LionPlayerManager.updateNotification(this@PlayerActivity)
                      }
                  })
              }

              private fun showAudioSettingsDialog() {
                  initAudioEffects()
                  val eq = equalizer
                  val rev = presetReverb
                  if (eq == null) {
                      Toast.makeText(this, "معادل الصوت غير مدعوم أو لم يبدأ التشغيل بعد", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val builder = AlertDialog.Builder(this)
                  builder.setTitle("إعدادات الصوت والمؤثرات")

                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 24, 32, 24)
                  }

                  val switchBoost = Switch(this).apply {
                      text = "مضاعفة الصوت حتى 200% (تعزيز نقي)"
                      isChecked = prefs.getBoolean("volume_boost_enabled", false)
                      setTextColor(Color.WHITE)
                      setOnCheckedChangeListener { _, isChecked ->
                          prefs.edit().putBoolean("volume_boost_enabled", isChecked).apply()
                          val msg = if (isChecked) "تم تفعيل مضاعفة الصوت حتى 200%" else "تم إيقاف مضاعفة الصوت"
                          Toast.makeText(this@PlayerActivity, msg, Toast.LENGTH_SHORT).show()
                          if (!isChecked && currentTotalVolumePercent > 100f) {
                              applyVolumePercent(100f)
                          }
                      }
                  }
                  layout.addView(switchBoost)

                  val switchEnable = Switch(this).apply {
                      text = "تفعيل المعادل الصوتي"
                      isChecked = eq.enabled
                      setTextColor(Color.WHITE)
                      setPadding(0, 16, 0, 0)
                      setOnCheckedChangeListener { _, isChecked ->
                          eq.enabled = isChecked
                          bassBoost?.enabled = isChecked
                      }
                  }
                  layout.addView(switchEnable)

                  val numPresets = eq.numberOfPresets.toInt()
                  if (numPresets > 0) {
                      val presetNames = (0 until numPresets).map { eq.getPresetName(it.toShort()) }
                      val tvPresets = TextView(this).apply {
                          text = "الأنماط الجاهزة (كلاسيك، روك، بوب):"
                          setTextColor(Color.parseColor("#FF9800"))
                          setPadding(0, 16, 0, 8)
                      }
                      layout.addView(tvPresets)

                      val spinner = Spinner(this)
                      val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, presetNames)
                      spinner.adapter = adapter
                      try {
                          spinner.setSelection(eq.currentPreset.toInt().coerceIn(0, numPresets - 1))
                      } catch (e: Exception) {}

                      spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, p1: View?, position: Int, p3: Long) {
                              try { eq.usePreset(position.toShort()) } catch (e: Exception) {}
                          }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                      layout.addView(spinner)
                  }

                  if (rev != null) {
                      val tvReverb = TextView(this).apply {
                          text = "تأثير الصدى (Reverb):"
                          setTextColor(Color.parseColor("#FF9800"))
                          setPadding(0, 20, 0, 8)
                      }
                      layout.addView(tvReverb)

                      val switchReverb = Switch(this).apply {
                          text = "تفعيل الصدى"
                          isChecked = rev.enabled
                          setTextColor(Color.WHITE)
                          setOnCheckedChangeListener { _, isChecked -> rev.enabled = isChecked }
                      }
                      layout.addView(switchReverb)

                      val reverbPresets = arrayOf("بدون صدى", "غرفة صغيرة", "غرفة متوسطة", "قاعة واسعة", "مسرح وقاعة كبرى", "صدى معدني")
                      val reverbPresetValues = shortArrayOf(
                          PresetReverb.PRESET_NONE,
                          PresetReverb.PRESET_SMALLROOM,
                          PresetReverb.PRESET_MEDIUMROOM,
                          PresetReverb.PRESET_LARGEROOM,
                          PresetReverb.PRESET_LARGEHALL,
                          PresetReverb.PRESET_PLATE
                      )

                      val reverbSpinner = Spinner(this)
                      val revAdapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, reverbPresets)
                      reverbSpinner.adapter = revAdapter

                      reverbSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, p1: View?, position: Int, p3: Long) {
                              try {
                                  rev.preset = reverbPresetValues[position]
                              } catch (e: Exception) {}
                          }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                      layout.addView(reverbSpinner)
                  }

                  scroll.addView(layout)
                  builder.setView(scroll)
                  builder.setPositiveButton("تم", null)
                  builder.show()
              }

              private fun setupGestureDetection() {
                  scaleGestureDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScaleBegin(detector: ScaleGestureDetector): Boolean {
                          isPinching = true
                          handler.removeCallbacks(longPressRunnable)
                          return true
                      }

                      override fun onScale(detector: ScaleGestureDetector): Boolean {
                          val factor = detector.scaleFactor
                          videoScale = (videoScale * factor).coerceIn(1.0f, 5.0f)
                          applyVideoTransform()
                          return true
                      }

                      override fun onScaleEnd(detector: ScaleGestureDetector) {
                          if (videoScale <= 1.05f) {
                              videoScale = 1.0f
                              applyVideoTransform()
                          }
                          handler.postDelayed({ isPinching = false }, 200)
                          handler.removeCallbacks(hideZoomHudRunnable)
                          handler.postDelayed(hideZoomHudRunnable, 1500)
                      }
                  })

                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (!isLocked && !isLongPressSpeeding) {
                              if (isInFloatingWindow() || controlsVisible) {
                                  hideAllControls()
                              } else {
                                  showAllControls()
                              }
                              applySystemBarsVisibility()
                          }
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          if (isLocked || isInFloatingWindow()) return true
                          if (videoScale > 1.05f) {
                              videoScale = 1.0f
                              videoTranslationX = 0f
                              videoTranslationY = 0f
                              applyVideoTransform()
                              Toast.makeText(this@PlayerActivity, "إعادة التكبير 100%", Toast.LENGTH_SHORT).show()
                              return true
                          }
                          val screenWidth = resources.displayMetrics.widthPixels
                          val p = LionPlayerManager.player ?: return true
                          if (e.x > screenWidth / 2) {
                              p.seekTo((p.currentPosition + 10000).coerceAtMost(p.duration))
                              Toast.makeText(this@PlayerActivity, "+10 ثواني", Toast.LENGTH_SHORT).show()
                          } else {
                              p.seekTo((p.currentPosition - 10000).coerceAtLeast(0L))
                              Toast.makeText(this@PlayerActivity, "-10 ثواني", Toast.LENGTH_SHORT).show()
                          }
                          return true
                      }
                  })

                  playerView.setOnTouchListener { _, event ->
                      scaleGestureDetector.onTouchEvent(event)
                      gestureDetector.onTouchEvent(event)
                      if (isLocked || isInFloatingWindow()) return@setOnTouchListener true

                      val screenWidth = resources.displayMetrics.widthPixels
                      val screenHeight = resources.displayMetrics.heightPixels

                      when (event.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              gestureStartX = event.x
                              initialGestureY = event.y
                              lastTouchX = event.x
                              lastTouchY = event.y
                              isDraggingVertical = false
                              isDraggingHorizontal = false
                              gestureMode = 0
                              initialSeekPosition = LionPlayerManager.player?.currentPosition ?: 0L

                              audioManager?.let { am ->
                                  initialVolume = am.getStreamVolume(AudioManager.STREAM_MUSIC)
                              }
                              val lp = window.attributes
                              initialBrightness = if (lp.screenBrightness >= 0f) lp.screenBrightness else 0.5f

                              if (event.pointerCount == 1 && videoScale <= 1.05f && LionPlayerManager.player?.isPlaying == true) {
                                  handler.postDelayed(longPressRunnable, 400)
                              }
                          }
                          MotionEvent.ACTION_POINTER_DOWN -> {
                              handler.removeCallbacks(longPressRunnable)
                              hudVolume.visibility = View.GONE
                              hudBrightness.visibility = View.GONE
                              hudSeek.visibility = View.GONE
                              isDraggingVertical = false
                              isDraggingHorizontal = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.x - gestureStartX
                              val dy = event.y - initialGestureY

                              if (kotlin.math.abs(dx) > 20 || kotlin.math.abs(dy) > 20) {
                                  handler.removeCallbacks(longPressRunnable)
                              }

                              if (event.pointerCount >= 2 && videoScale > 1.05f) {
                                  val moveX = event.x - lastTouchX
                                  val moveY = event.y - lastTouchY
                                  videoTranslationX += moveX
                                  videoTranslationY += moveY
                                  applyVideoTransform()
                              } else if (event.pointerCount == 1 && !isPinching && !isLongPressSpeeding) {
                                  if (videoScale > 1.05f) {
                                      val moveX = event.x - lastTouchX
                                      val moveY = event.y - lastTouchY
                                      videoTranslationX += moveX
                                      videoTranslationY += moveY
                                      applyVideoTransform()
                                  } else {
                                      if (!isDraggingVertical && !isDraggingHorizontal) {
                                          if (kotlin.math.abs(dy) > 25 && kotlin.math.abs(dy) > kotlin.math.abs(dx)) {
                                              isDraggingVertical = true
                                              gestureMode = if (gestureStartX > screenWidth / 2) GESTURE_VOLUME else GESTURE_BRIGHTNESS
                                          } else if (kotlin.math.abs(dx) > 25 && kotlin.math.abs(dx) > kotlin.math.abs(dy)) {
                                              isDraggingHorizontal = true
                                          }
                                      }

                                      if (isDraggingVertical) {
                                          val deltaY = initialGestureY - event.y
                                          val volumeBoostEnabled = prefs.getBoolean("volume_boost_enabled", false)
                                          val maxPerc = if (volumeBoostEnabled) 200f else 100f
                                          val deltaPercent = (deltaY / (screenHeight * 0.6f)) * maxPerc

                                          if (gestureMode == GESTURE_VOLUME) {
                                              val initPerc = (initialVolume.toFloat() / maxSystemVolume.toFloat()) * 100f
                                              applyVolumePercent(initPerc + deltaPercent)
                                          } else if (gestureMode == GESTURE_BRIGHTNESS) {
                                              updateBrightnessByPercent((deltaY / (screenHeight * 0.6f)) * 100f)
                                          }
                                      } else if (isDraggingHorizontal) {
                                          val deltaX = gestureStartX - event.x
                                          val seekOffsetMs = (deltaX / screenWidth) * 90000L
                                          val maxDur = LionPlayerManager.player?.duration?.coerceAtLeast(0L) ?: 0L
                                          if (maxDur > 0) {
                                              targetSeekPosition = (initialSeekPosition + seekOffsetMs.toLong()).coerceIn(0L, maxDur)

                                              playerSeekBar.progress = targetSeekPosition.toInt()
                                              tvCurrentTime.text = formatDuration(targetSeekPosition)

                                              hudSeek.visibility = View.VISIBLE
                                              val diffSeconds = (targetSeekPosition - initialSeekPosition) / 1000
                                              val sign = if (diffSeconds >= 0) "+" else ""
                                              tvSeekTarget.text = "$sign${diffSeconds}s\n${formatDuration(targetSeekPosition)} / ${formatDuration(maxDur)}"
                                          }
                                      }
                                  }
                              }
                              lastTouchX = event.x
                              lastTouchY = event.y
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              handler.removeCallbacks(longPressRunnable)

                              if (isLongPressSpeeding) {
                                  isLongPressSpeeding = false
                                  hudFastForward.visibility = View.GONE
                                  LionPlayerManager.player?.playbackParameters = PlaybackParameters(originalSpeedBeforeLongPress)
                              }

                              if (isDraggingHorizontal) {
                                  LionPlayerManager.player?.seekTo(targetSeekPosition)
                                  LionPlayerManager.updateNotification(this)
                                  hudSeek.visibility = View.GONE
                              }
                              hudVolume.visibility = View.GONE
                              hudBrightness.visibility = View.GONE
                              isDraggingVertical = false
                              isDraggingHorizontal = false
                          }
                      }
                      true
                  }
              }

              private fun formatDuration(durationMs: Long): String {
                  val totalSec = durationMs / 1000
                  val sec = totalSec % 60
                  val min = (totalSec / 60) % 60
                  val hrs = totalSec / 3600
                  return if (hrs > 0) {
                      String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
                  } else {
                      String.format(Locale.US, "%02d:%02d", min, sec)
                  }
              }

              private fun handleBackAction() {
                  if (isLocked) {
                      Toast.makeText(this, "الشاشة مقفلة! اضغط على زر القفل أولاً", Toast.LENGTH_SHORT).show()
                      return
                  }

                  saveCurrentVideoPosition()

                  val currentItem = LionPlayerManager.getCurrentItem()
                  val isVideo = currentItem?.isVideo ?: true

                  if (isVideo) {
                      AlertDialog.Builder(this)
                          .setTitle("تشغيل الفيديو")
                          .setMessage("هل تريد استمرار تشغيل الفيديو في الخلفية أم الإغلاق؟")
                          .setPositiveButton("استمرار بالعمل") { _, _ ->
                              LionPlayerManager.allowBackgroundPlayback = true
                              LionPlayerManager.updateNotification(this)
                              finish()
                          }
                          .setNegativeButton("إغلاق") { _, _ ->
                              LionPlayerManager.stop(this)
                              finish()
                          }
                          .setNeutralButton("إلغاء", null)
                          .show()
                  } else {
                      LionPlayerManager.allowBackgroundPlayback = true
                      LionPlayerManager.updateNotification(this)
                      finish()
                  }
              }

              override fun onBackPressed() {
                  handleBackAction()
              }

              override fun onStart() {
                  super.onStart()
                  LionPlayerManager.onTrackChanged = { item ->
                      runOnUiThread { updateUIForItem(item) }
                  }
                  LionPlayerManager.onPlaybackStateChanged = { isPlaying ->
                      runOnUiThread { updatePlayPauseButton(isPlaying) }
                  }
                  LionPlayerManager.getCurrentItem()?.let { updateUIForItem(it) }
                  playerView.player = LionPlayerManager.player
                  updatePlayPauseButton(LionPlayerManager.player?.isPlaying == true)
                  updateScreenLock()
                  handler.post(updateProgressRunnable)
              }

              override fun onResume() {
                  super.onResume()
                  applySystemBarsVisibility()
                  updateScreenLock()
              }

              override fun onPause() {
                  super.onPause()
                  saveCurrentVideoPosition()
              }

              override fun onStop() {
                  super.onStop()
                  saveCurrentVideoPosition()
                  LionPlayerManager.onTrackChanged = null
                  LionPlayerManager.onPlaybackStateChanged = null
                  updateScreenLock()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  saveCurrentVideoPosition()
                  handler.removeCallbacks(updateProgressRunnable)
                  handler.removeCallbacks(longPressRunnable)
                  handler.removeCallbacks(hideZoomHudRunnable)
                  playerView.player = null
                  try {
                      loudnessEnhancer?.enabled = false
                      loudnessEnhancer?.release()
                      loudnessEnhancer = null
                  } catch (e: Exception) {}
                  if (!LionPlayerManager.allowBackgroundPlayback && LionPlayerManager.player?.isPlaying != true) {
                      LionPlayerManager.dismissNotification(this)
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LionPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
