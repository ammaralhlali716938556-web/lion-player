package com.lionplayer.app.service

import android.app.Notification
import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.Service
import android.content.Context
import android.content.Intent
import android.graphics.PixelFormat
import android.os.Build
import android.os.IBinder
import android.view.*
import android.widget.FrameLayout
import android.widget.ImageButton
import androidx.core.app.NotificationCompat
import androidx.media3.ui.PlayerView
import com.lionplayer.app.R
import com.lionplayer.app.player.LionPlayerManager

class FloatingPlayerService : Service() {

    private var windowManager: WindowManager? = null
    private var floatingView: View? = null
    private var isCollapsedToBubble = false

    override fun onBind(intent: Intent?): IBinder? = null

    override fun onCreate() {
        super.onCreate()
        createNotificationChannel()
        startForeground(1001, createServiceNotification())

        windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
        initFloatingLayout()
    }

    private fun createServiceNotification(): Notification {
        return NotificationCompat.Builder(this, "lion_floating_channel")
            .setContentTitle("مشغل الفقاعة والنافذة العائمة")
            .setContentText("المشغل يعمل فوق التطبيقات الأخرى")
            .setSmallIcon(R.drawable.ic_lion_logo)
            .setPriority(NotificationCompat.PRIORITY_LOW)
            .build()
    }

    private fun createNotificationChannel() {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            val channel = NotificationChannel(
                "lion_floating_channel",
                "Floating Player",
                NotificationManager.IMPORTANCE_LOW
            )
            getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
        }
    }

    private fun initFloatingLayout() {
        val inflater = LayoutInflater.from(this)
        floatingView = inflater.inflate(R.layout.view_floating_bubble, null)

        val layoutFlag = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
        } else {
            @Suppress("DEPRECATION")
            WindowManager.LayoutParams.TYPE_PHONE
        }

        val params = WindowManager.LayoutParams(
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.WRAP_CONTENT,
            layoutFlag,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
            PixelFormat.TRANSLUCENT
        ).apply {
            gravity = Gravity.TOP or Gravity.START
            x = 100
            y = 100
        }

        val playerView = floatingView?.findViewById<PlayerView>(R.id.floatingPlayerView)
        playerView?.player = LionPlayerManager.player

        val btnClose = floatingView?.findViewById<ImageButton>(R.id.btnFloatingClose)
        btnClose?.setOnClickListener { stopSelf() }

        val btnCollapse = floatingView?.findViewById<ImageButton>(R.id.btnFloatingCollapse)
        val floatingRoot = floatingView?.findViewById<FrameLayout>(R.id.floatingRoot)

        btnCollapse?.setOnClickListener {
            isCollapsedToBubble = !isCollapsedToBubble
            if (isCollapsedToBubble) {
                playerView?.visibility = View.GONE
                floatingRoot?.setBackgroundResource(R.drawable.bg_floating_bubble)
                params.width = 160
                params.height = 160
            } else {
                playerView?.visibility = View.VISIBLE
                floatingRoot?.setBackgroundResource(R.drawable.bg_floating_window)
                params.width = WindowManager.LayoutParams.WRAP_CONTENT
                params.height = WindowManager.LayoutParams.WRAP_CONTENT
            }
            windowManager?.updateViewLayout(floatingView, params)
        }

        // Draggable touch handling
        floatingView?.setOnTouchListener(object : View.OnTouchListener {
            private var initialX = 0
            private var initialY = 0
            private var initialTouchX = 0f
            private var initialTouchY = 0f

            override fun onTouch(v: View?, event: MotionEvent): Boolean {
                when (event.action) {
                    MotionEvent.ACTION_DOWN -> {
                        initialX = params.x
                        initialY = params.y
                        initialTouchX = event.rawX
                        initialTouchY = event.rawY
                        return true
                    }
                    MotionEvent.ACTION_MOVE -> {
                        params.x = initialX + (event.rawX - initialTouchX).toInt()
                        params.y = initialY + (event.rawY - initialTouchY).toInt()
                        windowManager?.updateViewLayout(floatingView, params)
                        return true
                    }
                }
                return false
            }
        })

        try {
            windowManager?.addView(floatingView, params)
        } catch (e: Exception) {
            e.printStackTrace()
        }
    }

    override fun onDestroy() {
        floatingView?.let { windowManager?.removeView(it) }
        floatingView = null
        super.onDestroy()
    }
}
