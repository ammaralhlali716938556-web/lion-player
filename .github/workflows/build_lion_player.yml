package com.lionplayer.app.security

import android.content.Context
import android.content.SharedPreferences
import android.util.Base64
import androidx.biometric.BiometricManager
import androidx.biometric.BiometricPrompt
import androidx.core.content.ContextCompat
import androidx.fragment.app.FragmentActivity
import androidx.security.crypto.EncryptedSharedPreferences
import androidx.security.crypto.MasterKey
import com.lionplayer.app.model.MediaItem
import java.io.File
import java.io.FileInputStream
import java.io.FileOutputStream
import java.security.SecureRandom
import javax.crypto.Cipher
import javax.crypto.CipherInputStream
import javax.crypto.CipherOutputStream
import javax.crypto.spec.GCMParameterSpec
import javax.crypto.spec.SecretKeySpec

object VaultManager {

    private const val PREFS_NAME = "lion_vault_secure_prefs"
    private const val KEY_PIN = "vault_master_pin"
    private const val KEY_DECOY_PIN = "vault_decoy_pin"
    private const val KEY_AES_SECRET = "vault_aes_key"

    private fun getSecurePrefs(context: Context): SharedPreferences {
        val masterKey = MasterKey.Builder(context)
            .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)
            .build()
        return EncryptedSharedPreferences.create(
            context,
            PREFS_NAME,
            masterKey,
            EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
            EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
        )
    }

    private fun getSecretKey(context: Context): SecretKeySpec {
        val prefs = getSecurePrefs(context)
        var encodedKey = prefs.getString(KEY_AES_SECRET, null)
        if (encodedKey == null) {
            val keyBytes = ByteArray(32)
            SecureRandom().nextBytes(keyBytes)
            encodedKey = Base64.encodeToString(keyBytes, Base64.NO_WRAP)
            prefs.edit().putString(KEY_AES_SECRET, encodedKey).apply()
        }
        val keyBytes = Base64.decode(encodedKey, Base64.NO_WRAP)
        return SecretKeySpec(keyBytes, "AES")
    }

    fun hasPin(context: Context): Boolean {
        return getSecurePrefs(context).contains(KEY_PIN)
    }

    fun setPin(context: Context, pin: String, decoyPin: String? = null) {
        val editor = getSecurePrefs(context).edit()
        editor.putString(KEY_PIN, pin)
        if (!decoyPin.isNullOrEmpty()) {
            editor.putString(KEY_DECOY_PIN, decoyPin)
        } else {
            editor.remove(KEY_DECOY_PIN)
        }
        editor.apply()
    }

    fun verifyPin(context: Context, inputPin: String): PinResult {
        val prefs = getSecurePrefs(context)
        val master = prefs.getString(KEY_PIN, "")
        val decoy = prefs.getString(KEY_DECOY_PIN, "")
        return when (inputPin) {
            master -> PinResult.SUCCESS
            decoy -> PinResult.DECOY
            else -> PinResult.INVALID
        }
    }

    enum class PinResult { SUCCESS, DECOY, INVALID }

    fun authenticateBiometric(
        activity: FragmentActivity,
        onSuccess: () -> Unit,
        onError: (String) -> Unit
    ) {
        val executor = ContextCompat.getMainExecutor(activity)
        val prompt = BiometricPrompt(activity, executor, object : BiometricPrompt.AuthenticationCallback() {
            override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                super.onAuthenticationSucceeded(result)
                onSuccess()
            }

            override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                super.onAuthenticationError(errorCode, errString)
                onError(errString.toString())
            }
        })

        val promptInfo = BiometricPrompt.PromptInfo.Builder()
            .setTitle("الخزنة الخاصة والآمنة")
            .setSubtitle("قم بتأكيد هويتك بواسطة بصمة الإصبع أو الوجه")
            .setNegativeButtonText("إلغاء")
            .build()

        prompt.authenticate(promptInfo)
    }

    fun encryptFileToVault(context: Context, originalFile: File, isVideo: Boolean): File {
        val vaultDir = File(context.filesDir, "vault").apply { if (!exists()) mkdirs() }
        val destEncrypted = File(vaultDir, "${System.currentTimeMillis()}_${originalFile.name}.enc")

        val key = getSecretKey(context)
        val iv = ByteArray(12)
        SecureRandom().nextBytes(iv)

        val cipher = Cipher.getInstance("AES/GCM/NoPadding")
        val spec = GCMParameterSpec(128, iv)
        cipher.init(Cipher.ENCRYPT_MODE, key, spec)

        FileOutputStream(destEncrypted).use { fos ->
            fos.write(iv)
            CipherOutputStream(fos, cipher).use { cos ->
                FileInputStream(originalFile).use { fis ->
                    val buffer = ByteArray(1024 * 32)
                    var read: Int
                    while (fis.read(buffer).also { read = it } != -1) {
                        cos.write(buffer, 0, read)
                    }
                }
            }
        }
        return destEncrypted
    }

    fun decryptVaultFile(context: Context, encryptedFile: File, targetFile: File) {
        val key = getSecretKey(context)
        FileInputStream(encryptedFile).use { fis ->
            val iv = ByteArray(12)
            fis.read(iv)
            val cipher = Cipher.getInstance("AES/GCM/NoPadding")
            val spec = GCMParameterSpec(128, iv)
            cipher.init(Cipher.DECRYPT_MODE, key, spec)

            CipherInputStream(fis, cipher).use { cis ->
                FileOutputStream(targetFile).use { fos ->
                    val buffer = ByteArray(1024 * 32)
                    var read: Int
                    while (cis.read(buffer).also { read = it } != -1) {
                        fos.write(buffer, 0, read)
                    }
                }
            }
        }
    }

    fun getVaultItems(context: Context): List<MediaItem> {
        val vaultDir = File(context.filesDir, "vault")
        if (!vaultDir.exists()) return emptyList()

        val files = vaultDir.listFiles() ?: return emptyList()
        val list = mutableListOf<MediaItem>()

        for (file in files) {
            val isVid = file.name.endsWith(".mp4.enc") || file.name.endsWith(".mkv.enc") || file.name.contains("video", true)
            list.add(
                MediaItem(
                    id = file.name.hashCode().toLong(),
                    title = file.name.substringBeforeLast(".enc"),
                    uri = file.absolutePath,
                    duration = 0,
                    size = file.length(),
                    dateAdded = file.lastModified() / 1000,
                    isVideo = isVid,
                    parentFolder = "الخزنة",
                    isFolder = false,
                    path = file.absolutePath,
                    isVault = true
                )
            )
        }
        return list
    }
}
