                              when (which) {
                                  0 -> playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                                  1 -> playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                                  2 -> playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FILL
                              }
                          }
                          .show()
                  }

                  btnSpeed.setOnClickListener {
                      val speeds = arrayOf("0.5x", "0.75x", "1.0x", "1.25x", "1.5x", "2.0x")
                      AlertDialog.Builder(this)
                          .setTitle("سرعة التشغيل")
                          .setItems(speeds) { _, which ->
                              val speedVal = when (which) {
                                  0 -> 0.5f
                                  1 -> 0.75f
                                  2 -> 1.0f
                                  3 -> 1.25f
                                  4 -> 1.5f
                                  5 -> 2.0f
                                  else -> 1.0f
                              }
                              player?.playbackParameters = PlaybackParameters(speedVal)
                              btnSpeed.text = speeds[which]
                          }
                          .show()
                  }

                  playerSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) {
                              player?.seekTo(progress.toLong())
                              tvCurrentTime.text = formatDuration(progress.toLong())
                          }
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })
              }

              private fun setupGestureDetection() {
                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (!isLocked) {
                              controlsVisible = !controlsVisible
                              val visibility = if (controlsVisible) View.VISIBLE else View.GONE
                              topControls.visibility = visibility
                              bottomControls.visibility = visibility
                          }
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          if (isLocked) return true
                          val screenWidth = resources.displayMetrics.widthPixels
                          if (e.x > screenWidth / 2) {
                              player?.let { it.seekTo((it.currentPosition + 10000).coerceAtMost(it.duration)) }
                              Toast.makeText(this@PlayerActivity, "+10 ثواني", Toast.LENGTH_SHORT).show()
                          } else {
                              player?.let { it.seekTo((it.currentPosition - 10000).coerceAtLeast(0L)) }
                              Toast.makeText(this@PlayerActivity, "-10 ثواني", Toast.LENGTH_SHORT).show()
                          }
                          return true
                      }
                  })

                  playerView.setOnTouchListener { _, event ->
                      gestureDetector.onTouchEvent(event)
                      if (isLocked) return@setOnTouchListener true

                      val screenWidth = resources.displayMetrics.widthPixels
                      val screenHeight = resources.displayMetrics.heightPixels

                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              gestureStartX = event.x
                              gestureStartY = event.y
                              isDraggingVertical = false
                              isDraggingHorizontal = false
                              gestureMode = 0
                              initialSeekPosition = player?.currentPosition ?: 0L
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.x - gestureStartX
                              val dy = event.y - gestureStartY

                              if (!isDraggingVertical && !isDraggingHorizontal) {
                                  if (kotlin.math.abs(dy) > 30 && kotlin.math.abs(dy) > kotlin.math.abs(dx)) {
                                      isDraggingVertical = true
                                      gestureMode = if (gestureStartX > screenWidth / 2) GESTURE_VOLUME else GESTURE_BRIGHTNESS
                                  } else if (kotlin.math.abs(dx) > 30 && kotlin.math.abs(dx) > kotlin.math.abs(dy)) {
                                      isDraggingHorizontal = true
                                  }
                              }

                              if (isDraggingVertical) {
                                  val deltaY = gestureStartY - event.y
                                  val deltaPercent = (deltaY / screenHeight) * 100f * 1.5f
                                  gestureStartY = event.y

                                  if (gestureMode == GESTURE_VOLUME) {
                                      adjustVolume(deltaPercent)
                                  } else if (gestureMode == GESTURE_BRIGHTNESS) {
                                      adjustBrightness(deltaPercent)
                                  }
                              } else if (isDraggingHorizontal) {
                                  val deltaX = gestureStartX - event.x
                                  val seekOffsetMs = (deltaX / screenWidth) * 60000L
                                  targetSeekPosition = (initialSeekPosition + seekOffsetMs.toLong()).coerceIn(0L, player?.duration?.coerceAtLeast(0L) ?: 0L)

                                  hudSeek.visibility = View.VISIBLE
                                  val diffSeconds = (targetSeekPosition - initialSeekPosition) / 1000
                                  val sign = if (diffSeconds >= 0) "+" else ""
                                  tvSeekTarget.text = "$sign${diffSeconds}s (${formatDuration(targetSeekPosition)})"
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              if (isDraggingHorizontal) {
                                  player?.seekTo(targetSeekPosition)
                                  hudSeek.visibility = View.GONE
                              }
                              hudVolume.visibility = View.GONE
                              hudBrightness.visibility = View.GONE
                              isDraggingVertical = false
                              isDraggingHorizontal = false
                          }
                      }
                      true
                  }
              }

              private fun adjustVolume(deltaPercent: Float) {
                  audioManager?.let { am ->
                      val currentVol = am.getStreamVolume(AudioManager.STREAM_MUSIC)
                      val currentPercent = (currentVol.toFloat() / maxSystemVolume.toFloat()) * 100f
                      var newPercent = currentPercent + deltaPercent
                      newPercent = newPercent.coerceIn(0f, 100f)

                      val targetVol = ((newPercent / 100f) * maxSystemVolume).toInt().coerceIn(0, maxSystemVolume)
                      am.setStreamVolume(AudioManager.STREAM_MUSIC, targetVol, 0)

                      hudVolume.visibility = View.VISIBLE
                      volumeProgressBar.progress = newPercent.toInt()
                      tvVolumeValue.text = "${newPercent.toInt()}%"
                  }
              }

              private fun adjustBrightness(deltaPercent: Float) {
                  val layoutParams = window.attributes
                  var currentBrightness = layoutParams.screenBrightness
                  if (currentBrightness < 0f) currentBrightness = 0.5f

                  var newBrightness = currentBrightness + (deltaPercent / 100f)
                  newBrightness = newBrightness.coerceIn(0.01f, 1.0f)
                  layoutParams.screenBrightness = newBrightness
                  window.attributes = layoutParams

                  val percent = (newBrightness * 100).toInt()
                  hudBrightness.visibility = View.VISIBLE
                  brightnessProgressBar.progress = percent
                  tvBrightnessValue.text = "$percent%"
              }

              private fun formatDuration(durationMs: Long): String {
                  val totalSec = durationMs / 1000
                  val sec = totalSec % 60
                  val min = (totalSec / 60) % 60
                  val hrs = totalSec / 3600
                  return if (hrs > 0) {
                      String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
                  } else {
                      String.format(Locale.US, "%02d:%02d", min, sec)
                  }
              }

              override fun onBackPressed() {
                  if (isLocked) {
                      Toast.makeText(this, "الشاشة مقفلة! اضغط على زر القفل أولاً", Toast.LENGTH_SHORT).show()
                      return
                  }

                  if (player?.isPlaying == true) {
                      AlertDialog.Builder(this)
                          .setTitle("تشغيل في الخلفية")
                          .setMessage("هل ترغب في استمرار تشغيل الصوت في الخلفية؟")
                          .setPositiveButton("نعم (تشغيل في الخلفية)") { _, _ ->
                              allowBackgroundPlayback = true
                              updateNotification()
                              moveTaskToBack(true)
                          }
                          .setNegativeButton("لا (إيقاف وخروج)") { _, _ ->
                              allowBackgroundPlayback = false
                              dismissNotification()
                              player?.stop()
                              finish()
                          }
                          .setNeutralButton("إلغاء", null)
                          .show()
                  } else {
                      dismissNotification()
                      super.onBackPressed()
                  }
              }

              override fun onStart() {
                  super.onStart()
                  handler.post(updateProgressRunnable)
              }

              override fun onStop() {
                  super.onStop()
                  val powerManager = getSystemService(Context.POWER_SERVICE) as? PowerManager
                  val isInteractive = powerManager?.isInteractive ?: true
                  if (!isInteractive || isScreenOff || allowBackgroundPlayback) {
                      updateNotification()
                  } else {
                      player?.pause()
                      updateNotification()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(updateProgressRunnable)
                  try {
                      unregisterReceiver(screenReceiver)
                  } catch (_: Exception) {}
                  try {
                      unregisterReceiver(notificationReceiver)
                  } catch (_: Exception) {}
                  dismissNotification()
                  player?.release()
                  player = null
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LionPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
