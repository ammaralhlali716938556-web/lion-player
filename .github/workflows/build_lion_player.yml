    private val autoHideLandscapeRunnable = Runnable {
        val currentItem = LionPlayerManager.getCurrentItem()
        val isLandscape = resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
        if (currentItem?.isVideo == true && isLandscape) {
            hideAllControls()
            hideSystemBars()
        }
    }

    private fun scheduleAutoHideLandscape() {
        handler.removeCallbacks(autoHideLandscapeRunnable)
        val currentItem = LionPlayerManager.getCurrentItem()
        val isLandscape = resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
        if (currentItem?.isVideo == true && isLandscape) {
            handler.postDelayed(autoHideLandscapeRunnable, 2500L)
        }
    }

    private var isLongPressSpeeding = false
    private var originalSpeedBeforeLongPress = 1.0f
    private val longPressRunnable = Runnable {
        if (!isDraggingVertical && !isDraggingHorizontal && !isPinching && videoScale <= 1.05f) {
            val p = LionPlayerManager.player
            if (p?.isPlaying == true) {
                isLongPressSpeeding = true
                originalSpeedBeforeLongPress = p.playbackParameters.speed
                val targetSpeed = prefs.getFloat("long_press_speed", 2.0f)
                val speedLabel = prefs.getString("long_press_speed_str", "2x") ?: "${targetSpeed}x"
                p.playbackParameters = PlaybackParameters(targetSpeed)

                hudFastForward.visibility = View.VISIBLE
                tvFastForwardValue.text = "$speedLabel ⏩ تسريع"
                try {
                    playerView.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                } catch (e: Exception) {}
            }
        }
    }

    private var lastCheckedResumeItemId: Long = -1L

    private val handler = Looper.getMainLooper().let { Handler(it) }
    private val updateProgressRunnable = object : Runnable {
        override fun run() {
            LionPlayerManager.player?.let { p ->
                if (p.isPlaying) {
                    val current = p.currentPosition
                    val total = p.duration.coerceAtLeast(0L)
                    playerSeekBar.max = total.toInt()
                    playerSeekBar.progress = current.toInt()
                    tvCurrentTime.text = formatDuration(current)
                    tvTotalTime.text = formatDuration(total)

                    // Synchronize Karaoke Lyrics view
                    if (layoutLyrics.visibility == View.VISIBLE) {
                        val activeLine = lyricsAdapter.updateCurrentTime(current)
                        if (activeLine != -1) {
                            rvLyrics.smoothScrollToPosition(activeLine)
                        }
                    }
                }
            }
            handler.postDelayed(this, 1000)
        }
    }

