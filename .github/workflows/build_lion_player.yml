                      }
                  } catch (e: Exception) {}
                  return list
              }
          
              @Synchronized
              private fun saveVaultItems(context: Context, items: List<VaultItem>) {
                  val arr = JSONArray()
                  for (item in items) {
                      val obj = JSONObject().apply {
                          put("id", item.id)
                          put("encryptedFileName", item.encryptedFileName)
                          put("originalTitle", item.originalTitle)
                          put("originalPath", item.originalPath)
                          put("originalParentFolder", item.originalParentFolder)
                          put("mimeType", item.mimeType)
                          put("isVideo", item.isVideo)
                          put("size", item.size)
                          put("duration", item.duration)
                          put("dateAdded", item.dateAdded)
                          put("dateEncrypted", item.dateEncrypted)
