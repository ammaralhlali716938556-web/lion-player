          package com.lionplayer.app.player
          
          import android.content.Context
          import android.media.AudioManager
          import android.media.audiofx.BassBoost
          import android.media.audiofx.Equalizer
          import android.media.audiofx.LoudnessEnhancer
          import android.media.audiofx.PresetReverb
          import android.os.Build
          import androidx.media3.common.C
          
          class AudioEffectsController(private val context: Context) {
          
              private val audioManager = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              val maxSystemVolume: Int = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
              var currentVolumePercent: Float = 100f
                  private set
          
              var equalizer: Equalizer? = null
                  private set
              var bassBoost: BassBoost? = null
                  private set
              var presetReverb: PresetReverb? = null
                  private set
              var loudnessEnhancer: LoudnessEnhancer? = null
                  private set
          
              fun initialize(audioSessionId: Int) {
                  if (audioSessionId == C.AUDIO_SESSION_ID_UNSET || audioSessionId == 0) return
          
                  try {
                      if (equalizer == null) {
                          equalizer = Equalizer(0, audioSessionId).apply { enabled = true }
                      }
                      if (bassBoost == null) {
                          bassBoost = BassBoost(0, audioSessionId).apply { enabled = true }
                      }
                      if (presetReverb == null) {
                          presetReverb = PresetReverb(0, audioSessionId)
                      }
                      if (loudnessEnhancer == null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                          loudnessEnhancer = LoudnessEnhancer(audioSessionId)
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }
          
              /**
               * Volume Boost up to 200% with Dynamic Range Compression / Limiter clamping
               * to eliminate audio distortion and crackling.
               */
              fun setVolumePercent(targetPercent: Float, volumeBoostEnabled: Boolean): Float {
                  val maxPercent = if (volumeBoostEnabled) 200f else 100f
                  val clamped = targetPercent.coerceIn(0f, maxPercent)
                  currentVolumePercent = clamped
          
                  if (clamped <= 100f) {
                      val targetSysVol = kotlin.math.round((clamped / 100f) * maxSystemVolume).toInt().coerceIn(0, maxSystemVolume)
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, targetSysVol, 0)
                      try {
                          loudnessEnhancer?.apply {
                              setTargetGain(0)
                              enabled = false
                          }
                      } catch (e: Exception) {}
                  } else {
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, maxSystemVolume, 0)
                      val boostFraction = (clamped - 100f) / 100f
                      // Target gain up to 1500 mB (15 dB) with smooth compression curve
                      val targetGain = (boostFraction * 1500f).toInt()
                      try {
                          loudnessEnhancer?.apply {
                              setTargetGain(targetGain)
                              enabled = true
                          }
                      } catch (e: Exception) {}
                  }
                  return clamped
              }
          
              fun release() {
                  try {
                      equalizer?.release()
                      bassBoost?.release()
                      presetReverb?.release()
                      loudnessEnhancer?.release()
                  } catch (e: Exception) {}
                  equalizer = null
                  bassBoost = null
                  presetReverb = null
                  loudnessEnhancer = null
              }
          }
