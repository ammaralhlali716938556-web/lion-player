          class SubtitleSettingsBottomSheet : BottomSheetDialogFragment() {

          private var _binding: BottomSheetSubtitlesBinding? = null
          private val binding get() = _binding!!

          private var currentDelay: Long = 0L

          private val pickSubtitleLauncher = registerForActivityResult(
          ActivityResultContracts.StartActivityForResult()
          ) { result ->
          if (result.resultCode == Activity.RESULT_OK && result.data != null) {
            val uri: Uri? = result.data?.data
            if (uri != null) {
                LionPlayerManager.attachCustomSubtitle(requireContext(), uri)
                Toast.makeText(requireContext(), "تم تحميل ملف الترجمة بنجاح", Toast.LENGTH_SHORT).show()
                dismiss()
            }
          }
          }

          override fun onCreateView(
          inflater: LayoutInflater,
          container: ViewGroup?,
          savedInstanceState: Bundle?
          ): View {
          _binding = BottomSheetSubtitlesBinding.inflate(inflater, container, false)
          return binding.root
          }

          override fun onViewCreated(view: View, savedInstanceState: Bundle?) {
          super.onViewCreated(view, savedInstanceState)

          binding.btnPickLocalSubtitle.setOnClickListener {
            val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                type = "*/*"
                addCategory(Intent.CATEGORY_OPENABLE)
            }
            pickSubtitleLauncher.launch(intent)
          }

          binding.btnOpenSubtitlesSearch.setOnClickListener {
            Toast.makeText(requireContext(), "البحث التلقائي عبر OpenSubtitles نشط", Toast.LENGTH_SHORT).show()
          }

          binding.btnSelectSubtitleTrack.setOnClickListener {
            showSubtitleTrackPicker()
          }

          binding.sbSubtitleDelay.progress = 50 // Represents 0 offset in range [-5000ms, +5000ms]
          binding.sbSubtitleDelay.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
            override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                val delayMs = (progress - 50) * 100L
                currentDelay = delayMs
                binding.tvDelayValue.text = "${delayMs} ms"
                if (fromUser) {
                    LionPlayerManager.applySubtitleOffset(requireContext(), delayMs)
                }
            }
            override fun onStartTrackingTouch(seekBar: SeekBar?) {}
            override fun onStopTrackingTouch(seekBar: SeekBar?) {}
          })

          binding.btnDelayMinus.setOnClickListener {
            binding.sbSubtitleDelay.progress = (binding.sbSubtitleDelay.progress - 1).coerceAtLeast(0)
          }

          binding.btnDelayPlus.setOnClickListener {
            binding.sbSubtitleDelay.progress = (binding.sbSubtitleDelay.progress + 1).coerceAtMost(100)
          }
          }

          private fun showSubtitleTrackPicker() {
          val player = LionPlayerManager.player ?: return
          val currentTracks = player.currentTracks
          val subtitleTrackList = mutableListOf<Pair<androidx.media3.common.TrackGroup, Int>>()
          val trackNames = mutableListOf<String>()

          trackNames.add("إيقاف الترجمة")

          for (group in currentTracks.groups) {
            if (group.type == androidx.media3.common.C.TRACK_TYPE_TEXT) {
                for (i in 0 until group.length) {
                    val format = group.getTrackFormat(i)
                    val label = format.label ?: format.language ?: "ترجمة ${subtitleTrackList.size + 1}"
                    trackNames.add(label)
                    subtitleTrackList.add(Pair(group.mediaTrackGroup, i))
                }
            }
          }

          if (subtitleTrackList.isEmpty()) {
            Toast.makeText(requireContext(), "لا توجد مسارات ترجمة مدمجة", Toast.LENGTH_SHORT).show()
            return
          }

          AlertDialog.Builder(requireContext())
            .setTitle("اختر مسار الترجمة")
            .setItems(trackNames.toTypedArray()) { _, which ->
                if (which == 0) {
                    LionPlayerManager.disableSubtitles()
                    Toast.makeText(requireContext(), "تم إيقاف الترجمة", Toast.LENGTH_SHORT).show()
                } else {
                    val pair = subtitleTrackList[which - 1]
                    LionPlayerManager.selectSubtitleTrack(pair.first, pair.second)
                    Toast.makeText(requireContext(), "تم تفعيل: ${trackNames[which]}", Toast.LENGTH_SHORT).show()
                }
                dismiss()
            }
            .show()
          }

          override fun onDestroyView() {
          super.onDestroyView()
          _binding = null
          }

          companion object {
          const val TAG = "SubtitleSettingsBottomSheet"
          fun newInstance(): SubtitleSettingsBottomSheet = SubtitleSettingsBottomSheet()
          }
          }

