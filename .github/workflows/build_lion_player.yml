name: Build Lion Player APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate & Compile Lion Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Complete Android Project Files
        run: |
          echo "==== [1/6] إنشاء مجلدات المشروع ===="
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/lion/player/model
          mkdir -p app/src/main/java/com/lion/player/adapter
          mkdir -p app/src/main/java/com/lion/player/utils
          mkdir -p app/src/main/java/com/lion/player/ui
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/menu

          echo "==== [2/6] إعداد ملفات Gradle ===="
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LionPlayer"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.lion.player"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.lion.player"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables.useSupportLibrary = true
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      isMinifyEnabled = false
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-DEBUG"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")

              // AndroidX Media3 (ExoPlayer)
              val media3Version = "1.3.1"
              implementation("androidx.media3:media3-exoplayer:$media3Version")
              implementation("androidx.media3:media3-ui:$media3Version")
              implementation("androidx.media3:media3-common:$media3Version")
              implementation("androidx.media3:media3-session:$media3Version")
              implementation("androidx.media3:media3-extractor:$media3Version")

              // Image Loading
              implementation("com.github.bumptech.glide:glide:4.16.0")
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          # Keep Media3 / ExoPlayer codecs
          -keep class androidx.media3.** { *; }
          -dontwarn androidx.media3.**
          EOF

          echo "==== [3/6] إنشاء المانيفست والموارد (Manifest & Resources) ===="
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_lion_logo"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_lion_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LionPlayer"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.LionPlayer">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ui.PlayerActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden"
                      android:supportsPictureInPicture="true"
                      android:theme="@style/Theme.LionPlayer.Player" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Lion Player</string>
              <string name="tab_local">محلي (Local)</string>
              <string name="tab_stream">فيديو (Stream)</string>
              <string name="tab_music">موسيقى (Music)</string>
              <string name="search_hint">بحث في الفيديوهات...</string>
              <string name="decoder_hw">HW</string>
              <string name="decoder_sw">SW</string>
              <string name="decoder_hw_plus">HW+</string>
              <string name="kids_lock_active">تم تفعيل قفل الأطفال (المس لفك القفل)</string>
              <string name="audio_boost">تعزيز الصوت: %1$d%%</string>
              <string name="brightness">السطوع: %1$d%%</string>
              <string name="speed">سرعة التشغيل</string>
              <string name="sleep_timer">مؤقت النوم</string>
              <string name="properties">خصائص الملف</string>
              <string name="subtitles">الترجمة</string>
              <string name="online_subs">بحث عن ترجمة أونلاين</string>
              <string name="audio_track">المسار الصوتي</string>
              <string name="aspect_ratio">نسبة العرض</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="lion_gold">#FFB300</color>
              <color name="lion_gold_dark">#FF8F00</color>
              <color name="lion_dark_bg">#121212</color>
              <color name="lion_surface">#1E1E1E</color>
              <color name="lion_surface_variant">#2A2A2A</color>
              <color name="lion_text_primary">#FFFFFF</color>
              <color name="lion_text_secondary">#B0B0B0</color>
              <color name="lion_overlay_bg">#80000000</color>
              <color name="lion_badge_hw">#4CAF50</color>
              <color name="lion_badge_sw">#2196F3</color>
              <color name="lion_badge_hw_plus">#FF9800</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LionPlayer" parent="Theme.Material3.Dark.NoActionBar">
                  <item name="colorPrimary">@color/lion_gold</item>
                  <item name="colorSecondary">@color/lion_gold_dark</item>
                  <item name="android:statusBarColor">@color/lion_dark_bg</item>
                  <item name="android:navigationBarColor">@color/lion_dark_bg</item>
                  <item name="android:windowBackground">@color/lion_dark_bg</item>
              </style>

              <style name="Theme.LionPlayer.Player" parent="Theme.Material3.Dark.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # أيقونات المتجهات Vector Drawables
          cat << 'EOF' > app/src/main/res/drawable/ic_lion_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFB300" android:pathData="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M10,8.5L16,12L10,15.5V8.5Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M8,5.14V19.14L19,12.14L8,5.14Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M14,19H18V5H14M6,19H10V5H6V19Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_lock.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M18,8H17V6C17,3.24 14.76,1 12,1C9.24,1 7,3.24 7,6V8H6C4.9,8 4,8.9 4,10V20C4,21.1 4.9,22 6,22H18C19.1,22 20,21.1 20,20V10C20,8.9 19.1,8 18,8M12,17C10.9,17 10,16.1 10,15C10,13.9 10.9,13 12,13C13.1,13 14,13.9 14,15C14,16.1 13.1,17 12,17M9,8V6C9,4.34 10.34,3 12,3C13.66,3 15,4.34 15,6V8H9Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_lock_open.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFB300" android:pathData="M18,8H17V6C17,3.24 14.76,1 12,1C9.24,1 7,3.24 7,6H9C9,4.34 10.34,3 12,3C13.66,3 15,4.34 15,6V8H6C4.9,8 4,8.9 4,10V20C4,21.1 4.9,22 6,22H18C19.1,22 20,21.1 20,20V10C20,8.9 19.1,8 18,8Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_subtitles.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,4H4C2.9,4 2,4.9 2,6V18C2,19.1 2.9,20 4,20H20C21.1,20 22,19.1 22,18V6C22,4.9 21.1,4 20,4M4,12H8V14H4V12M14,18H4V16H14V18M20,18H16V16H20V18M20,14H10V12H20V14Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_headset.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,1C6.48,1 2,5.48 2,11V18C2,19.66 3.34,21 5,21H8V13H4V11C4,6.58 7.58,3 12,3C16.42,3 20,6.58 20,11V13H16V21H19C20.66,21 22,19.66 22,18V11C22,5.48 17.52,1 12,1Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_pip.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19,7H11V13H19V7M21,3H3C1.9,3 1,3.9 1,5V19C1,20.1 1.9,21 3,21H21C22.1,21 23,20.1 23,19V5C23,3.9 22.1,3 21,3M21,19H3V5H21V19Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_aspect_ratio.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19,12H21V19C21,20.1 20.1,21 19,21H12V19H19V12M5,12H3V5C3,3.9 3.9,3 5,3H12V5H5V12M21,5V7H19V5H17V3H19C20.1,3 21,3.9 21,5M5,19V17H3V19C3,20.1 3.9,21 5,21H7V19H5Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_folder.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFB300" android:pathData="M10,4L12,6H20C21.1,6 22,6.9 22,8V18C22,19.1 21.1,20 20,20H4C2.9,20 2,19.1 2,18L2.01,6C2.01,4.9 2.9,4 4,4H10Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_video.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFB300" android:pathData="M17,10.5V7C17,6.45 16.55,6 16,6H4C3.45,6 3,6.45 3,7V17C3,17.55 3.45,18 4,18H16C16.55,18 17,17.55 17,17V13.5L21,17.5V6.5L17,10.5Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_more_vert.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,16A2,2 0 0,1 14,18A2,2 0 0,1 12,20A2,2 0 0,1 10,18A2,2 0 0,1 12,16M12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12A2,2 0 0,1 12,10M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_audiotrack.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,3V13.55C11.41,13.21 10.73,13 10,13C7.79,13 6,14.79 6,17C6,19.21 7.79,21 10,21C12.21,21 14,19.21 14,17V7H18V3H12Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_back.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,11H7.83L13.42,5.41L12,4L4,12L12,20L13.41,18.59L7.83,13H20V11Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/menu/bottom_nav_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item
                  android:id="@+id/nav_local"
                  android:icon="@drawable/ic_folder"
                  android:title="@string/tab_local" />
              <item
                  android:id="@+id/nav_stream"
                  android:icon="@drawable/ic_video"
                  android:title="@string/tab_stream" />
              <item
                  android:id="@+id/nav_music"
                  android:icon="@drawable/ic_audiotrack"
                  android:title="@string/tab_music" />
          </menu>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/lion_dark_bg">

              <com.google.android.material.appbar.MaterialToolbar
                  android:id="@+id/topToolbar"
                  android:layout_width="match_parent"
                  android:layout_height="?attr/actionBarSize"
                  android:background="@color/lion_surface"
                  app:title="Lion Player"
                  app:titleTextColor="@color/lion_gold"
                  app:navigationIcon="@drawable/ic_lion_logo"
                  app:layout_constraintTop_toTopOf="parent" />

              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefresh"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  app:layout_constraintTop_toBottomOf="@id/topToolbar"
                  app:layout_constraintBottom_toTopOf="@id/bottomNavigation">

                  <androidx.recyclerview.widget.RecyclerView
                      android:id="@+id/recyclerViewMedia"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:clipToPadding="false"
                      android:padding="8dp" />
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>

              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottomNavigation"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/lion_surface"
                  app:itemIconTint="@color/lion_gold"
                  app:itemTextColor="@color/lion_text_primary"
                  app:menu="@menu/bottom_nav_menu"
                  app:layout_constraintBottom_toBottomOf="parent" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_media_video.xml
          <?xml version="1.0" encoding="utf-8"?>
          <com.google.android.material.card.MaterialCardView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_margin="4dp"
              app:cardBackgroundColor="@color/lion_surface"
              app:cardCornerRadius="8dp"
              app:strokeColor="@color/lion_surface_variant"
              app:strokeWidth="1dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="8dp">

                  <ImageView
                      android:id="@+id/imgThumbnail"
                      android:layout_width="100dp"
                      android:layout_height="64dp"
                      android:scaleType="centerCrop"
                      android:background="@color/lion_surface_variant"
                      android:src="@drawable/ic_video" />

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="12dp"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/txtTitle"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Video Title"
                          android:textColor="@color/lion_text_primary"
                          android:textSize="14sp"
                          android:textStyle="bold"
                          android:maxLines="2"
                          android:ellipsize="end" />

                      <TextView
                          android:id="@+id/txtDetails"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="1080p • 12:45 • 150 MB"
                          android:textColor="@color/lion_text_secondary"
                          android:textSize="12sp" />
                  </LinearLayout>
              </LinearLayout>
          </com.google.android.material.card.MaterialCardView>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_player.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/playerRootLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@android:color/black"
              android:keepScreenOn="true">

              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:use_controller="false"
                  app:resize_mode="fit" />

              <!-- الترجمة التفاعلية القابلة للسحب والتكبير -->
              <TextView
                  android:id="@+id/txtDraggableSubtitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:layout_centerHorizontal="true"
                  android:layout_marginBottom="70dp"
                  android:padding="6dp"
                  android:background="#80000000"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:shadowColor="#000000"
                  android:shadowRadius="4"
                  android:visibility="gone" />

              <!-- مؤشرات الإيماءات (Volume / Brightness / Seek HUD) -->
              <LinearLayout
                  android:id="@+id/hudGestureFeedback"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:padding="16dp"
                  android:background="@drawable/ic_lion_logo"
                  android:backgroundTint="#AA000000"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:visibility="gone">

                  <TextView
                      android:id="@+id/txtHudTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="@color/lion_gold"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <ProgressBar
                      android:id="@+id/progressHud"
                      style="?android:attr/progressBarStyleHorizontal"
                      android:layout_width="120dp"
                      android:layout_height="8dp"
                      android:layout_marginTop="8dp"
                      android:max="200"
                      android:progressTint="@color/lion_gold" />
              </LinearLayout>

              <!-- الشريط العلوي العائم (Top Overlay) -->
              <RelativeLayout
                  android:id="@+id/topControlsOverlay"
                  android:layout_width="match_parent"
