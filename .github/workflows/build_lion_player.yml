          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.lionplayer.app.R
          import com.lionplayer.app.databinding.ActivityVaultBinding
          import com.lionplayer.app.vault.adapter.VaultMediaAdapter
          import com.lionplayer.app.vault.model.VaultItem
          import com.lionplayer.app.vault.security.VaultSecurityManager
          import kotlinx.coroutines.launch
          import java.io.File
          import java.util.Locale

          class VaultActivity : AppCompatActivity() {

          private lateinit var binding: ActivityVaultBinding
          private lateinit var vaultSecurityManager: VaultSecurityManager
          private lateinit var adapter: VaultMediaAdapter

          private val pickMediaLauncher = registerForActivityResult(
          ActivityResultContracts.GetMultipleContents()
          ) { uris: List<Uri> ->
          if (uris.isNotEmpty()) {
            importUrisToVault(uris)
          }
          }

          override fun onCreate(savedInstanceState: Bundle?) {
          super.onCreate(savedInstanceState)
          window.setFlags(
            WindowManager.LayoutParams.FLAG_SECURE,
            WindowManager.LayoutParams.FLAG_SECURE
          )

          binding = ActivityVaultBinding.inflate(layoutInflater)
          setContentView(binding.root)

          vaultSecurityManager = VaultSecurityManager(this)

          setSupportActionBar(binding.vaultToolbar)
          binding.vaultToolbar.setNavigationOnClickListener { finish() }

          setupRecyclerView()
          binding.fabAddToVault.setOnClickListener {
            pickMediaLauncher.launch("*/*")
          }

          loadVaultItems()
          }

          private fun setupRecyclerView() {
          adapter = VaultMediaAdapter(
            items = emptyList(),
            onItemClick = { item -> playVaultItem(item) },
            onRestoreClick = { item -> confirmRestoreItem(item) },
            onDeleteClick = { item -> confirmDeleteItem(item) }
          )
          binding.rvVaultItems.layoutManager = LinearLayoutManager(this)
          binding.rvVaultItems.adapter = adapter
          }

          private fun loadVaultItems() {
          val items = vaultSecurityManager.getVaultItems()
          adapter.updateData(items)

          binding.layoutEmptyVault.visibility = if (items.isEmpty()) View.VISIBLE else View.GONE
          binding.rvVaultItems.visibility = if (items.isEmpty()) View.GONE else View.VISIBLE

          val totalSizeMb = items.sumOf { it.size } / (1024.0 * 1024.0)
          binding.tvVaultStats.text = String.format(Locale.US, "%d ملفات مشفرة (%.1f MB) • AES-256 GCM", items.size, totalSizeMb)
          }

          private fun playVaultItem(item: VaultItem) {
          @Suppress("DEPRECATION")
          val progressDialog = ProgressDialog(this).apply {
            setMessage("جاري فك التشفير الآمن للعرض...")
            setCancelable(false)
            show()
          }

          lifecycleScope.launch {
            val tempFile = vaultSecurityManager.decryptToTempCache(item)
            progressDialog.dismiss()
            if (tempFile != null && tempFile.exists()) {
                val intent = Intent(this@VaultActivity, VaultPlayerActivity::class.java).apply {
                    putExtra("EXTRA_VAULT_ITEM", item)
                    putExtra("EXTRA_TEMP_PATH", tempFile.absolutePath)
                }
                startActivity(intent)
            } else {
                Toast.makeText(this@VaultActivity, "تعذر فك تشفير الملف للعرض", Toast.LENGTH_SHORT).show()
            }
          }
          }

          private fun confirmRestoreItem(item: VaultItem) {
          AlertDialog.Builder(this)
            .setTitle("استعادة إلى معرض الهاتف")
            .setMessage("هل تريد إلغاء قفل \"${item.originalName}\" وفك تشفيره وإعادته إلى مجلد الوسائط العام بالهاتف؟")
            .setPositiveButton("استعادة") { _, _ ->
                @Suppress("DEPRECATION")
                val pd = ProgressDialog(this).apply {
                    setMessage("جاري فك التشفير والاستعادة...")
                    setCancelable(false)
                    show()
                }

                lifecycleScope.launch {
                    val restoredUri = vaultSecurityManager.decryptAndRestoreFile(item)
                    pd.dismiss()
                    if (restoredUri != null) {
                        Toast.makeText(this@VaultActivity, "تم فك التشفير واستعادة الملف بنجاح! 🔓", Toast.LENGTH_LONG).show()
                        loadVaultItems()
                    } else {
                        Toast.makeText(this@VaultActivity, "حدث خطأ أثناء استعادة الملف", Toast.LENGTH_SHORT).show()
                    }
                }
            }
            .setNegativeButton("إلغاء", null)
            .show()
          }

          private fun confirmDeleteItem(item: VaultItem) {
          AlertDialog.Builder(this)
            .setTitle("حذف نهائي")
            .setMessage("هل أنت متأكد من حذف \"${item.originalName}\" نهائياً من الخزينة؟ لن يمكن استرجاعه.")
            .setPositiveButton("حذف نهائي") { _, _ ->
                val success = vaultSecurityManager.deleteVaultItem(item)
                if (success) {
                    Toast.makeText(this, "تم حذف الملف نهائياً", Toast.LENGTH_SHORT).show()
                    loadVaultItems()
                } else {
                    Toast.makeText(this, "فشل حذف الملف", Toast.LENGTH_SHORT).show()
                }
            }
            .setNegativeButton("إلغاء", null)
            .show()
          }

          private fun importUrisToVault(uris: List<Uri>) {
          @Suppress("DEPRECATION")
          val pd = ProgressDialog(this).apply {
            setMessage("جاري تشفير وحفظ الملفات في الخزينة (AES-256)...")
            setCancelable(false)
            show()
          }

          lifecycleScope.launch {
            var count = 0
            for (uri in uris) {
                var fileName = "media_file_${System.currentTimeMillis()}"
                var fileSize = 0L
                var isVideo = true

                try {
                    contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                        val nameCol = cursor.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME)
                        val sizeCol = cursor.getColumnIndex(android.provider.OpenableColumns.SIZE)
                        if (cursor.moveToFirst()) {
                            if (nameCol != -1) fileName = cursor.getString(nameCol) ?: fileName
                            if (sizeCol != -1) fileSize = cursor.getLong(sizeCol)
                        }
                    }
                    val mime = contentResolver.getType(uri) ?: ""
                    isVideo = !mime.startsWith("audio")
                } catch (e: Exception) {}

                val vaultItem = vaultSecurityManager.encryptAndStoreFile(
                    sourceUri = uri,
                    originalName = fileName,
                    originalPath = uri.toString(),
                    isVideo = isVideo,
                    size = fileSize,
                    duration = 0L
                )
                if (vaultItem != null) count++
            }
            pd.dismiss()
            Toast.makeText(this@VaultActivity, "تم تشفير ($count) ملفات داخل الخزينة بنجاح 🔒", Toast.LENGTH_SHORT).show()
            loadVaultItems()
          }
          }

          override fun onCreateOptionsMenu(menu: Menu?): Boolean {
          menuInflater.inflate(R.menu.vault_menu, menu)
          return true
          }

          override fun onOptionsItemSelected(item: MenuItem): Boolean {
          when (item.itemId) {
            R.id.action_change_pin -> {
                showChangePinDialog()
                return true
            }
            R.id.action_lock_now -> {
                finish()
                return true
            }
          }
          return super.onOptionsItemSelected(item)
          }

          private fun showChangePinDialog() {
          val input = EditText(this).apply {
            hint = "أدخل رمز PIN الجديد (4 أرقام)"
            inputType = android.text.InputType.TYPE_CLASS_NUMBER or android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD
            filters = arrayOf(android.text.InputFilter.LengthFilter(4))
          }

          AlertDialog.Builder(this)
            .setTitle("تغيير رمز PIN")
