                      TAB_VIDEO -> R.id.nav_local
                      TAB_AUDIO -> R.id.nav_music
                      TAB_ALL -> R.id.nav_all
                      TAB_FAVORITES -> R.id.nav_favorites
                      else -> R.id.nav_local
                  }
                  bottomNav.selectedItemId = targetMenuId
                  checkAndRequestPermissions()
              }

              private fun showSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.show(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  }
                  window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
              }

              private fun initSelectionBar() {
                  selectionBar = findViewById(R.id.selectionBar)
                  tvSelectionCount = findViewById(R.id.tvSelectionCount)
                  btnCancelSelection = findViewById(R.id.btnCancelSelection)
                  btnSelectAll = findViewById(R.id.btnSelectAll)
                  btnCopySelected = findViewById(R.id.btnCopySelected)
                  btnMoveSelected = findViewById(R.id.btnMoveSelected)
                  btnDeleteSelected = findViewById(R.id.btnDeleteSelected)

                  btnCancelSelection.setOnClickListener { exitSelectionMode() }
                  btnSelectAll.setOnClickListener {
                      val allSelected = displayedList.filter { !it.isFolder }.all { it.isSelected }
                      displayedList.forEach { if (!it.isFolder) it.isSelected = !allSelected }
                      updateSelectionUI()
                  }
                  btnCopySelected.setOnClickListener { startClipboardOperation(ClipAction.COPY) }
                  btnMoveSelected.setOnClickListener { startClipboardOperation(ClipAction.MOVE) }
                  btnDeleteSelected.setOnClickListener {
                      val selected = displayedList.filter { it.isSelected && !it.isFolder }
                      if (selected.isNotEmpty()) confirmDeleteMultiple(selected)
                  }
              }

              private fun initPasteBar() {
                  pasteBar = findViewById(R.id.pasteBar)
                  tvPasteStatus = findViewById(R.id.tvPasteStatus)
                  btnExecutePaste = findViewById(R.id.btnExecutePaste)
                  btnCancelPaste = findViewById(R.id.btnCancelPaste)

                  btnExecutePaste.setOnClickListener { executePaste() }
                  btnCancelPaste.setOnClickListener { cancelPasteOperation() }
              }

              private fun startClipboardOperation(action: ClipAction) {
                  val selected = displayedList.filter { it.isSelected && !it.isFolder }
                  if (selected.isEmpty()) {
                      Toast.makeText(this, "يرجى تحديد مقطع واحد على الأقل", Toast.LENGTH_SHORT).show()
                      return
                  }
                  clipBufferList.clear()
                  clipBufferList.addAll(selected)
                  activeClipAction = action
                  exitSelectionMode()
                  updatePasteBarUI()
                  val actionName = if (action == ClipAction.COPY) "نسخ" else "نقل"
                  Toast.makeText(this, "تم اختيار $actionName (${clipBufferList.size}) مقاطع. انتقل للمجلد واضغط لصق", Toast.LENGTH_LONG).show()
              }

              private fun updatePasteBarUI() {
                  if (activeClipAction != ClipAction.NONE && clipBufferList.isNotEmpty()) {
                      pasteBar.visibility = View.VISIBLE
                      val typeStr = if (activeClipAction == ClipAction.COPY) "نسخ" else "نقل"
                      val destFolder = currentSelectedFolder ?: "المجلد الحالي"
                      tvPasteStatus.text = "جاهز لـ $typeStr (${clipBufferList.size}) إلى: $destFolder"
                  } else {
                      pasteBar.visibility = View.GONE
                  }
              }

              private fun cancelPasteOperation() {
                  activeClipAction = ClipAction.NONE
                  clipBufferList.clear()
                  updatePasteBarUI()
              }

              private fun executePaste() {
                  if (clipBufferList.isEmpty() || activeClipAction == ClipAction.NONE) return
                  val targetDir: File = run {
                      if (currentSelectedFolder != null) {
                          val sample = (rawVideosList + rawAudioList).firstOrNull { it.parentFolder == currentSelectedFolder && it.path.isNotEmpty() }
                          if (sample != null) File(sample.path).parentFile ?: getPublicMediaDir() else getPublicMediaDir()
                      } else getPublicMediaDir()
                  }
                  if (!targetDir.exists()) targetDir.mkdirs()

                  var successCount = 0
                  val filesToScan = mutableListOf<String>()
                  for (item in clipBufferList) {
                      val srcFile = File(item.path)
                      if (srcFile.exists()) {
                          val destFile = File(targetDir, srcFile.name)
                          try {
                              if (activeClipAction == ClipAction.COPY) {
                                  copyFile(srcFile, destFile)
                                  filesToScan.add(destFile.absolutePath)
                                  successCount++
                              } else if (activeClipAction == ClipAction.MOVE) {
                                  if (!srcFile.renameTo(destFile)) { copyFile(srcFile, destFile); srcFile.delete() }
                                  filesToScan.add(destFile.absolutePath)
                                  try { contentResolver.delete(Uri.parse(item.uri), null, null) } catch (e: Exception) {}
                                  successCount++
                              }
                          } catch (e: Exception) {}
                      }
                  }
                  if (filesToScan.isNotEmpty()) {
                      MediaScannerConnection.scanFile(this, filesToScan.toTypedArray(), null) { _, _ -> runOnUiThread { loadMedia() } }
                  }
                  Toast.makeText(this, "تمت العملية بنجاح لـ $successCount ملفات", Toast.LENGTH_SHORT).show()
                  cancelPasteOperation()
                  loadMedia()
              }

              private fun getPublicMediaDir(): File {
                  return if (currentTab == TAB_AUDIO) Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC)
                  else Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES)
              }

              private fun copyFile(src: File, dst: File) {
                  FileInputStream(src).use { input ->
                      FileOutputStream(dst).use { output ->
                          val buffer = ByteArray(1024 * 32)
                          var read: Int
                          while (input.read(buffer).also { read = it } > 0) output.write(buffer, 0, read)
                      }
                  }
              }

              private fun enterSelectionMode(initialItem: MediaItem? = null) {
                  mediaAdapter.isSelectionMode = true
                  selectionBar.visibility = View.VISIBLE
                  initialItem?.isSelected = true
                  updateSelectionUI()
              }

              private fun exitSelectionMode() {
                  mediaAdapter.isSelectionMode = false
                  selectionBar.visibility = View.GONE
                  displayedList.forEach { it.isSelected = false }
                  mediaAdapter.notifyDataSetChanged()
              }

              private fun updateSelectionUI() {
                  val count = displayedList.count { it.isSelected && !it.isFolder }
                  tvSelectionCount.text = "تم تحديد $count"
                  mediaAdapter.notifyDataSetChanged()
              }

              private fun initMiniPlayer() {
                  miniPlayerLayout = findViewById(R.id.miniPlayerLayout)
                  ivMiniThumb = findViewById(R.id.ivMiniThumb)
                  tvMiniTitle = findViewById(R.id.tvMiniTitle)
                  tvMiniSub = findViewById(R.id.tvMiniSub)
                  btnMiniPrev = findViewById(R.id.btnMiniPrev)
                  btnMiniPlayPause = findViewById(R.id.btnMiniPlayPause)
                  btnMiniNext = findViewById(R.id.btnMiniNext)
                  btnMiniClose = findViewById(R.id.btnMiniClose)

                  findViewById<View>(R.id.miniPlayerInfo).setOnClickListener { openPlayerFromMini() }
                  ivMiniThumb.setOnClickListener { openPlayerFromMini() }

                  btnMiniPrev.setOnClickListener { LionPlayerManager.playPrevious(this) }
                  btnMiniPlayPause.setOnClickListener { LionPlayerManager.togglePlayPause(this) }
                  btnMiniNext.setOnClickListener { LionPlayerManager.playNext(this) }
                  btnMiniClose.setOnClickListener {
                      LionPlayerManager.stop(this)
                      miniPlayerLayout.visibility = View.GONE
                  }
              }

              private fun openPlayerFromMini() {
                  val playlist = LionPlayerManager.playlist
                  val index = LionPlayerManager.currentIndex
                  val intent = Intent(this, PlayerActivity::class.java).apply {
                      putExtra("PLAYLIST", playlist)
                      putExtra("CURRENT_INDEX", index)
                  }
                  startActivity(intent)
              }

              private fun updateMiniPlayerUI() {
                  val current = LionPlayerManager.getCurrentItem()
                  val player = LionPlayerManager.player
                  if (current != null && player != null) {
                      miniPlayerLayout.visibility = View.VISIBLE
                      tvMiniTitle.text = current.title
                      tvMiniSub.text = if (current.isVideo) "فيديو • ${current.parentFolder}" else "صوتيات • ${current.artist}"
                      ThumbnailLoader.load(ivMiniThumb, current)
                      btnMiniPlayPause.setImageResource(if (player.isPlaying) R.drawable.ic_pause else R.drawable.ic_play)
                  } else {
                      miniPlayerLayout.visibility = View.GONE
                  }
              }

              private fun setupRecyclerView() {
                  mediaAdapter = MediaAdapter(
                      displayedList, viewStyle, showExtensions, false,
                      onItemClick = { item ->
                          if (mediaAdapter.isSelectionMode) {
                              if (!item.isFolder) { item.isSelected = !item.isSelected; updateSelectionUI() }
                          } else {
                              if (item.isFolder) {
                                  currentSelectedFolder = item.title
                                  prefs.edit().putString("last_folder", currentSelectedFolder).apply()
                                  refreshListDisplay()
                                  updatePasteBarUI()
                              } else {
                                  val playlist = ArrayList(displayedList.filter { !it.isFolder })
                                  val index = playlist.indexOfFirst { it.id == item.id }.coerceAtLeast(0)
                                  startActivity(Intent(this, PlayerActivity::class.java).apply {
                                      putExtra("PLAYLIST", playlist)
                                      putExtra("CURRENT_INDEX", index)
                                  })
                              }
                          }
                      },
                      onItemLongClick = { item -> enterSelectionMode(item) },
                      onMoreOptionsClick = { item, _ -> showItemActionDialog(item) }
                  )
                  applyLayoutManager()
                  rvMedia.adapter = mediaAdapter

                  var lastScaleTriggerTime = 0L
                  scaleGestureDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(detector: ScaleGestureDetector): Boolean {
                          val now = System.currentTimeMillis()
                          if (now - lastScaleTriggerTime < 350) return false
                          if (detector.scaleFactor > 1.15f) { lastScaleTriggerTime = now; zoomIn(); return true }
                          if (detector.scaleFactor < 0.85f) { lastScaleTriggerTime = now; zoomOut(); return true }
                          return false
                      }
                  })
                  rvMedia.setOnTouchListener { _, event -> scaleGestureDetector.onTouchEvent(event); false }
              }

              private fun showItemActionDialog(item: MediaItem) {
                  val favoriteTitle = if (item.isFavorite) "إلغاء التفضيل" else "تفضيل"
                  val options = arrayOf("تحديد", "نسخ", "نقل", favoriteTitle, "إعادة تسمية", "مشاركة", "خصائص", "حذف")
                  AlertDialog.Builder(this)
                      .setTitle(item.title)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> enterSelectionMode(item)
                              1 -> { clipBufferList.clear(); clipBufferList.add(item); activeClipAction = ClipAction.COPY; updatePasteBarUI(); Toast.makeText(this, "تم نسخ المقطع", Toast.LENGTH_SHORT).show() }
                              2 -> { clipBufferList.clear(); clipBufferList.add(item); activeClipAction = ClipAction.MOVE; updatePasteBarUI(); Toast.makeText(this, "تم تحديد المقطع للنقل", Toast.LENGTH_SHORT).show() }
                              3 -> toggleFavorite(item)
                              4 -> showRenameDialog(item)
                              5 -> shareMediaItem(item)
                              6 -> showPropertiesDialog(item)
                              7 -> confirmDeleteMediaItem(item)
                          }
                      }.show()
              }

              private fun toggleFavorite(item: MediaItem) {
                  val favSet = prefs.getStringSet("favorite_ids", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  if (item.isFavorite) { favSet.remove(item.id.toString()); item.isFavorite = false }
                  else { favSet.add(item.id.toString()); item.isFavorite = true }
                  prefs.edit().putStringSet("favorite_ids", favSet).apply()
                  refreshListDisplay()
              }

              private fun showRenameDialog(item: MediaItem) {
                  val input = EditText(this).apply { setText(item.title); setSelection(item.title.length) }
                  AlertDialog.Builder(this).setTitle("إعادة تسمية").setView(input)
                      .setPositiveButton("حفظ") { _, _ ->
                          val newName = input.text.toString().trim()
                          if (newName.isNotEmpty()) { item.title = newName; mediaAdapter.notifyDataSetChanged() }
                      }.setNegativeButton("إلغاء", null).show()
              }

              private fun shareMediaItem(item: MediaItem) {
                  try {
                      startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply {
                          type = if (item.isVideo) "video/*" else "audio/*"
                          putExtra(Intent.EXTRA_STREAM, Uri.parse(item.uri))
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }, "مشاركة المقطع"))
                  } catch (e: Exception) {}
              }

              private fun showPropertiesDialog(item: MediaItem) {
                  val sdf = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.getDefault())
                  val message = """
                      الاسم: ${item.title}
                      المسار: ${item.path.ifEmpty { item.uri }}
                      النوع: ${if (item.isVideo) "فيديو" else "صوتيات"}
                      الحجم: ${String.format(Locale.US, "%.2f MB", item.size / (1024.0 * 1024.0))}
                      المدة: ${LionPlayerManager.formatDuration(item.duration)}
                      التاريخ: ${sdf.format(Date(item.dateAdded * 1000L))}
                  """.trimIndent()
                  AlertDialog.Builder(this).setTitle("خصائص المقطع").setMessage(message).setPositiveButton("إغلاق", null).show()
              }

              private fun confirmDeleteMediaItem(item: MediaItem) {
                  AlertDialog.Builder(this).setTitle("حذف المقطع").setMessage("هل تريد بالتأكيد حذف ${item.title}؟")
                      .setPositiveButton("حذف") { _, _ -> performDelete(listOf(item)) }.setNegativeButton("إلغاء", null).show()
              }

              private fun confirmDeleteMultiple(items: List<MediaItem>) {
                  AlertDialog.Builder(this).setTitle("حذف المقاطع المحددة").setMessage("هل تريد بالتأكيد حذف ${items.size} عناصر؟")
                      .setPositiveButton("حذف") { _, _ -> performDelete(items); exitSelectionMode() }.setNegativeButton("إلغاء", null).show()
              }

              private fun performDelete(items: List<MediaItem>) {
                  for (item in items) {
                      try { if (item.path.isNotEmpty()) File(item.path).delete(); contentResolver.delete(Uri.parse(item.uri), null, null) } catch (e: Exception) {}
                      rawVideosList.removeAll { it.id == item.id }
                      rawAudioList.removeAll { it.id == item.id }
                  }
                  refreshListDisplay()
              }

              private fun zoomIn() {
                  if (viewStyle == MediaAdapter.VIEW_MODE_GRID_SMALL) viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
                  else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) viewStyle = MediaAdapter.VIEW_MODE_LIST
                  applyLayoutManager(); prefs.edit().putInt("view_style", viewStyle).apply(); mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
              }

              private fun zoomOut() {
                  if (viewStyle == MediaAdapter.VIEW_MODE_LIST) viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
                  else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) viewStyle = MediaAdapter.VIEW_MODE_GRID_SMALL
                  applyLayoutManager(); prefs.edit().putInt("view_style", viewStyle).apply(); mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
              }

              private fun applyLayoutManager() {
                  when (viewStyle) {
                      MediaAdapter.VIEW_MODE_LIST -> rvMedia.layoutManager = LinearLayoutManager(this)
                      MediaAdapter.VIEW_MODE_GRID_LARGE -> rvMedia.layoutManager = GridLayoutManager(this, 2)
                      MediaAdapter.VIEW_MODE_GRID_SMALL -> rvMedia.layoutManager = GridLayoutManager(this, 3)
                  }
              }

              private fun setupBottomNav() {
                  bottomNav.setOnItemSelectedListener { menuItem ->
                      val newTab = when (menuItem.itemId) {
                          R.id.nav_local -> TAB_VIDEO
                          R.id.nav_music -> TAB_AUDIO
                          R.id.nav_all -> TAB_ALL
                          R.id.nav_favorites -> TAB_FAVORITES
                          else -> TAB_VIDEO
                      }
                      if (currentTab != newTab) {
                          currentTab = newTab
                          currentSelectedFolder = null
                          prefs.edit().putInt("last_tab", currentTab).putString("last_folder", null).apply()
                          refreshListDisplay()
                          updatePasteBarUI()
                      }
                      true
                  }
              }

              private fun checkAndRequestPermissions() {
                  val permissionsNeeded = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) permissionsNeeded.add(Manifest.permission.READ_MEDIA_VIDEO)
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) permissionsNeeded.add(Manifest.permission.READ_MEDIA_AUDIO)
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) permissionsNeeded.add(Manifest.permission.POST_NOTIFICATIONS)
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) permissionsNeeded.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) permissionsNeeded.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                  }
                  if (permissionsNeeded.isNotEmpty()) ActivityCompat.requestPermissions(this, permissionsNeeded.toTypedArray(), PERMISSION_REQ_CODE)
                  else loadMedia()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == PERMISSION_REQ_CODE && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) loadMedia()
              }

              private fun loadMedia() {
                  loadVideos()
                  loadAudio()
                  refreshListDisplay()
                  updatePasteBarUI()
              }

              private fun loadVideos() {
                  rawVideosList.clear()
                  val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
                  val uri = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(MediaStore.Video.Media._ID, MediaStore.Video.Media.DISPLAY_NAME, MediaStore.Video.Media.DATA, MediaStore.Video.Media.DURATION, MediaStore.Video.Media.SIZE, MediaStore.Video.Media.DATE_ADDED, MediaStore.Video.Media.ARTIST, MediaStore.Video.Media.ALBUM)

                  try {
                      contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                          val nameCol = cursor.getColumnIndex(MediaStore.Video.Media.DISPLAY_NAME)
                          val dataCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                          val durCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                          val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                          val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED)
                          val artistCol = cursor.getColumnIndex(MediaStore.Video.Media.ARTIST)
                          val albumCol = cursor.getColumnIndex(MediaStore.Video.Media.ALBUM)

                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(idCol)
                              val path = cursor.getString(dataCol) ?: ""
                              val dispName = if (nameCol != -1) cursor.getString(nameCol) ?: "" else ""
                              val title = if (dispName.isNotEmpty()) dispName else File(path).name.ifEmpty { "فيديو" }
                              val duration = cursor.getLong(durCol)
                              val size = cursor.getLong(sizeCol)
                              val dateAdded = cursor.getLong(dateCol)
                              val artist = if (artistCol != -1) cursor.getString(artistCol) ?: "فيديو" else "فيديو"
                              val album = if (albumCol != -1) cursor.getString(albumCol) ?: "فيديو" else "فيديو"
                              val contentUri = ContentUris.withAppendedId(uri, id).toString()
                              val folderName = try { File(path).parentFile?.name ?: "الرئيسي" } catch (e: Exception) { "الرئيسي" }
                              rawVideosList.add(MediaItem(id, title, contentUri, duration, size, dateAdded, true, folderName, false, 0, artist, album, favSet.contains(id.toString()), path))
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun loadAudio() {
                  rawAudioList.clear()
                  val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
                  val uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.DISPLAY_NAME, MediaStore.Audio.Media.DATA, MediaStore.Audio.Media.DURATION, MediaStore.Audio.Media.SIZE, MediaStore.Audio.Media.DATE_ADDED, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.ALBUM)

                  try {
                      contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val nameCol = cursor.getColumnIndex(MediaStore.Audio.Media.DISPLAY_NAME)
                          val dataCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DATA)
                          val durCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                          val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.SIZE)
                          val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DATE_ADDED)
                          val artistCol = cursor.getColumnIndex(MediaStore.Audio.Media.ARTIST)
                          val albumCol = cursor.getColumnIndex(MediaStore.Audio.Media.ALBUM)

                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(idCol)
                              val path = cursor.getString(dataCol) ?: ""
                              val dispName = if (nameCol != -1) cursor.getString(nameCol) ?: "" else ""
                              val title = if (dispName.isNotEmpty()) dispName else File(path).name.ifEmpty { "صوتيات" }
                              val duration = cursor.getLong(durCol)
                              val size = cursor.getLong(sizeCol)
                              val dateAdded = cursor.getLong(dateCol)
                              val artist = if (artistCol != -1) cursor.getString(artistCol) ?: "فنان غير معروف" else "فنان غير معروف"
                              val album = if (albumCol != -1) cursor.getString(albumCol) ?: "ألبوم غير محدد" else "ألبوم غير محدد"
                              val contentUri = ContentUris.withAppendedId(uri, id).toString()
                              val folderName = try { File(path).parentFile?.name ?: "الرئيسي" } catch (e: Exception) { "الرئيسي" }
                              rawAudioList.add(MediaItem(id, title, contentUri, duration, size, dateAdded, false, folderName, false, 0, artist, album, favSet.contains(id.toString()), path))
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun refreshListDisplay() {
                  displayedList.clear()
                  when (currentTab) {
                      TAB_VIDEO -> {
                          if (isVideoFolderMode && currentSelectedFolder == null) {
                              toolbar.title = "مجلدات الفيديو"
                              for ((folderName, items) in rawVideosList.groupBy { it.parentFolder }) {
                                  displayedList.add(MediaItem(folderName.hashCode().toLong(), folderName, "", 0, items.sumOf { it.size }, items.maxOfOrNull { it.dateAdded } ?: 0, true, folderName, true, items.size))
                              }
                          } else if (isVideoFolderMode && currentSelectedFolder != null) {
                              toolbar.title = currentSelectedFolder
                              displayedList.addAll(rawVideosList.filter { it.parentFolder == currentSelectedFolder })
                          } else {
                              toolbar.title = "كافة الفيديوهات"
                              displayedList.addAll(rawVideosList)
                          }
                      }
                      TAB_AUDIO -> {
                          if (isAudioFolderMode && currentSelectedFolder == null) {
                              toolbar.title = "مجلدات الصوت"
                              for ((folderName, items) in rawAudioList.groupBy { it.parentFolder }) {
                                  displayedList.add(MediaItem(folderName.hashCode().toLong(), folderName, "", 0, items.sumOf { it.size }, items.maxOfOrNull { it.dateAdded } ?: 0, false, folderName, true, items.size))
                              }
                          } else if (isAudioFolderMode && currentSelectedFolder != null) {
                              toolbar.title = currentSelectedFolder
                              displayedList.addAll(rawAudioList.filter { it.parentFolder == currentSelectedFolder })
                          } else {
                              toolbar.title = "كافة الصوتيات"
                              displayedList.addAll(rawAudioList)
                          }
                      }
                      TAB_ALL -> {
                          toolbar.title = "جميع الملفات"
                          displayedList.addAll(rawVideosList)
                          displayedList.addAll(rawAudioList)
                      }
                      TAB_FAVORITES -> {
                          toolbar.title = "المفضلة"
                          displayedList.addAll(rawVideosList.filter { it.isFavorite })
                          displayedList.addAll(rawAudioList.filter { it.isFavorite })
                      }
                  }
                  applySorting()
                  mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  tvEmptyState.visibility = if (displayedList.isEmpty()) View.VISIBLE else View.GONE
              }

              private fun applySorting() {
                  val comparator = when (sortBy) {
                      "name" -> compareBy<MediaItem> { it.title.lowercase() }
                      "date" -> compareBy { it.dateAdded }
                      "size" -> compareBy { it.size }
                      "duration" -> compareBy { it.duration }
                      else -> compareBy { it.title.lowercase() }
                  }
                  if (sortAsc) displayedList.sortWith(comparator) else displayedList.sortWith(comparator.reversed())
              }

              override fun onCreateOptionsMenu(menu: Menu?): Boolean {
                  menuInflater.inflate(R.menu.top_main_menu, menu)
                  (menu?.findItem(R.id.action_search)?.actionView as? SearchView)?.setOnQueryTextListener(object : SearchView.OnQueryTextListener {
                      override fun onQueryTextSubmit(query: String?): Boolean = false
                      override fun onQueryTextChange(newText: String?): Boolean { filterSearch(newText.orEmpty()); return true }
                  })
                  menu?.findItem(R.id.action_toggle_extension)?.isChecked = showExtensions
                  return true
              }

              private fun filterSearch(query: String) {
                  val combined = when (currentTab) {
                      TAB_VIDEO -> rawVideosList
                      TAB_AUDIO -> rawAudioList
                      TAB_ALL -> rawVideosList + rawAudioList
                      TAB_FAVORITES -> (rawVideosList + rawAudioList).filter { it.isFavorite }
                      else -> rawVideosList
                  }
                  displayedList.clear()
                  displayedList.addAll(combined.filter { it.title.contains(query, ignoreCase = true) })
                  applySorting()
                  mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
              }

              override fun onOptionsItemSelected(item: MenuItem): Boolean {
                  when (item.itemId) {
                      R.id.action_refresh -> { loadMedia(); return true }
                      R.id.action_view_mode -> {
                          AlertDialog.Builder(this).setTitle("أسلوب العرض").setSingleChoiceItems(arrayOf("قائمة", "شبكة كبيرة", "شبكة صغيرة"), viewStyle) { d, w ->
                              viewStyle = w; prefs.edit().putInt("view_style", viewStyle).apply(); applyLayoutManager(); mediaAdapter.updateData(displayedList, viewStyle, showExtensions); d.dismiss()
                          }.show(); return true
                      }
                      R.id.action_display_mode -> {
                          val current = if ((if (currentTab == TAB_VIDEO) isVideoFolderMode else isAudioFolderMode)) 0 else 1
                          AlertDialog.Builder(this).setTitle("طريقة العرض").setSingleChoiceItems(arrayOf("مجلدات", "كافة الملفات"), current) { d, w ->
                              val setFolder = (w == 0)
                              if (currentTab == TAB_VIDEO) { isVideoFolderMode = setFolder; prefs.edit().putBoolean("is_video_folder_mode", setFolder).apply() }
                              else { isAudioFolderMode = setFolder; prefs.edit().putBoolean("is_audio_folder_mode", setFolder).apply() }
                              currentSelectedFolder = null; prefs.edit().putString("last_folder", null).apply(); refreshListDisplay(); updatePasteBarUI(); d.dismiss()
                          }.show(); return true
                      }
                      R.id.action_sort -> {
                          AlertDialog.Builder(this).setTitle("فرز حسب").setSingleChoiceItems(arrayOf("الاسم", "التاريخ", "الحجم", "المدة"), when (sortBy) { "date" -> 1 "size" -> 2 "duration" -> 3 else -> 0 }) { d, w ->
                              sortBy = when (w) { 1 -> "date" 2 -> "size" 3 -> "duration" else -> "name" }
                              prefs.edit().putString("sort_by", sortBy).apply(); refreshListDisplay(); d.dismiss()
                          }.show(); return true
                      }
                      R.id.action_order -> {
                          AlertDialog.Builder(this).setTitle("ترتيب").setSingleChoiceItems(arrayOf("تصاعدي", "تنازلي"), if (sortAsc) 0 else 1) { d, w ->
                              sortAsc = (w == 0); prefs.edit().putBoolean("sort_asc", sortAsc).apply(); refreshListDisplay(); d.dismiss()
                          }.show(); return true
                      }
                      R.id.action_toggle_extension -> {
                          showExtensions = !showExtensions
                          item.isChecked = showExtensions
                          prefs.edit().putBoolean("show_extensions", showExtensions).apply()
                          mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                          return true
                      }
                      R.id.action_settings -> {
                          val checked = booleanArrayOf(LionPlayerManager.bluetoothControlEnabled, prefs.getBoolean("show_lyrics", true))
                          AlertDialog.Builder(this).setTitle("الإعدادات العامة").setMultiChoiceItems(arrayOf("التحكم بسماعة البلوتوث", "إظهار كلمات الأغاني"), checked) { _, which, isChecked ->
                              if (which == 0) { LionPlayerManager.bluetoothControlEnabled = isChecked; prefs.edit().putBoolean("bluetooth_headset_control", isChecked).apply() }
                              else { prefs.edit().putBoolean("show_lyrics", isChecked).apply() }
                          }.setPositiveButton("تم", null).show(); return true
                      }
                  }
                  return super.onOptionsItemSelected(item)
              }

              override fun onStart() {
                  super.onStart()
                  updateMiniPlayerUI()
                  LionPlayerManager.onTrackChanged = { runOnUiThread { updateMiniPlayerUI() } }
                  LionPlayerManager.onPlaybackStateChanged = { runOnUiThread { updateMiniPlayerUI() } }
              }

              override fun onResume() {
                  super.onResume()
                  showSystemBars()
                  updateMiniPlayerUI()
              }

              override fun onBackPressed() {
                  if (mediaAdapter.isSelectionMode) exitSelectionMode()
                  else if (currentSelectedFolder != null) {
                      currentSelectedFolder = null
                      prefs.edit().putString("last_folder", null).apply()
                      refreshListDisplay()
                      updatePasteBarUI()
                  } else super.onBackPressed()
              }
          }
