          # app/src/main/java/com/lionplayer/app/util/ScopedStorageHelper.kt
          cat << 'EOF_FILE_30' > app/src/main/java/com/lionplayer/app/util/ScopedStorageHelper.kt
          package com.lionplayer.app.util
          
          import android.app.Activity
          import android.content.ContentResolver
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import androidx.activity.result.ActivityResultLauncher
          import androidx.activity.result.IntentSenderRequest
          import java.io.File
          
          object ScopedStorageHelper {
          
              fun hasFullStorageAccess(context: Context): Boolean {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      Environment.isExternalStorageManager()
                  } else {
                      true
                  }
              }
          
              /**
               * Modern Scoped Storage Delete Request for Android 11+ (API 30+)
               */
              fun requestDeleteMedia(
                  activity: Activity,
                  launcher: ActivityResultLauncher<IntentSenderRequest>,
                  uris: List<Uri>,
                  fallbackLegacyAction: () -> Unit
              ) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      try {
                          val pendingIntent = MediaStore.createDeleteRequest(activity.contentResolver, uris)
                          val request = IntentSenderRequest.Builder(pendingIntent.intentSender).build()
                          launcher.launch(request)
                      } catch (e: Exception) {
                          fallbackLegacyAction()
                      }
                  } else {
                      fallbackLegacyAction()
                  }
              }
          
              /**
               * Modern Scoped Storage Write Request for Android 11+ (API 30+)
               */
              fun requestWriteMedia(
                  activity: Activity,
                  launcher: ActivityResultLauncher<IntentSenderRequest>,
                  uris: List<Uri>,
                  onGrantedDirectly: () -> Unit
              ) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      try {
                          val pendingIntent = MediaStore.createWriteRequest(activity.contentResolver, uris)
                          val request = IntentSenderRequest.Builder(pendingIntent.intentSender).build()
                          launcher.launch(request)
                      } catch (e: Exception) {
                          onGrantedDirectly()
                      }
                  } else {
                      onGrantedDirectly()
                  }
              }
          
              fun deleteFileLegacy(contentResolver: ContentResolver, uri: Uri, path: String): Boolean {
                  var deleted = false
                  try {
                      if (path.isNotEmpty()) {
                          val f = File(path)
                          if (f.exists()) {
                              deleted = f.delete()
                          }
                      }
                  } catch (e: Exception) {}
                  try {
                      contentResolver.delete(uri, null, null)
                      deleted = true
                  } catch (e: Exception) {}
                  return deleted
              }
          }
