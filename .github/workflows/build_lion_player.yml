          # activity_splash.xml
          cat << 'EOF' > app/src/main/res/layout/activity_splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/background_dark">

              <LinearLayout
                  android:id="@+id/splashContainer"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:gravity="center"
                  android:orientation="vertical"
                  android:padding="24dp">

                  <ImageView
                      android:id="@+id/ivSplashLogo"
                      android:layout_width="160dp"
                      android:layout_height="160dp"
                      android:src="@drawable/ic_lion_logo" />

                  <TextView
                      android:id="@+id/tvSplashTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:text="@string/app_name"
                      android:textColor="@color/primary"
                      android:textSize="32sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:text="@string/app_slogan"
                      android:textColor="@color/text_secondary"
                      android:textSize="14sp" />
              </LinearLayout>
          </FrameLayout>
          EOF

          # activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true"
              android:background="@color/background_dark">

              <com.google.android.material.appbar.MaterialToolbar
                  android:id="@+id/topToolbar"
                  android:layout_width="match_parent"
                  android:layout_height="?attr/actionBarSize"
                  android:background="@color/surface_dark"
                  app:title="@string/app_name"
                  app:titleTextColor="@color/text_primary"
                  app:layout_constraintTop_toTopOf="parent" />

              <LinearLayout
                  android:id="@+id/selectionBar"
                  android:layout_width="match_parent"
                  android:layout_height="?attr/actionBarSize"
                  android:background="@color/surface_dark"
                  android:gravity="center_vertical"
                  android:paddingStart="8dp"
                  android:paddingEnd="8dp"
                  android:visibility="gone"
                  app:layout_constraintTop_toTopOf="parent">

                  <ImageButton android:id="@+id/btnCancelSelection" android:layout_width="40dp" android:layout_height="40dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_close" app:tint="@color/text_primary" />
                  <TextView android:id="@+id/tvSelectionCount" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="8dp" android:text="تم تحديد 1" android:textColor="@color/text_primary" android:textSize="15sp" android:textStyle="bold" />
                  <ImageButton android:id="@+id/btnSelectAll" android:layout_width="40dp" android:layout_height="40dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_all_files" app:tint="@color/text_primary" />
                  <ImageButton android:id="@+id/btnCopySelected" android:layout_width="40dp" android:layout_height="40dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_copy" app:tint="@color/text_primary" />
                  <ImageButton android:id="@+id/btnMoveSelected" android:layout_width="40dp" android:layout_height="40dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_move" app:tint="@color/text_primary" />
                  <ImageButton android:id="@+id/btnDeleteSelected" android:layout_width="40dp" android:layout_height="40dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_close" app:tint="#F44336" />
              </LinearLayout>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvMedia"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:clipToPadding="false"
                  app:layout_constraintTop_toBottomOf="@id/topToolbar"
                  app:layout_constraintBottom_toTopOf="@id/pasteBar" />

              <TextView
                  android:id="@+id/tvEmptyState"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="لا توجد ملفات للعرض"
                  android:textColor="@color/text_secondary"
                  android:textSize="16sp"
                  android:visibility="gone"
                  app:layout_constraintTop_toTopOf="@id/rvMedia"
                  app:layout_constraintBottom_toBottomOf="@id/rvMedia"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <LinearLayout
                  android:id="@+id/pasteBar"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:background="#1E2836"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toTopOf="@id/miniPlayerLayout">

                  <ImageView android:id="@+id/ivPasteIcon" android:layout_width="24dp" android:layout_height="24dp" android:src="@drawable/ic_paste" app:tint="@color/primary" />
                  <TextView android:id="@+id/tvPasteStatus" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="8dp" android:layout_marginEnd="8dp" android:ellipsize="end" android:maxLines="1" android:text="جاهز للصق" android:textColor="#FFFFFF" android:textSize="13sp" />
                  <Button android:id="@+id/btnExecutePaste" android:layout_width="wrap_content" android:layout_height="36dp" android:backgroundTint="@color/primary" android:text="لصق هنا" android:textColor="#FFFFFF" android:textSize="12sp" />
                  <ImageButton android:id="@+id/btnCancelPaste" android:layout_width="36dp" android:layout_height="36dp" android:layout_marginStart="4dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_close" app:tint="@color/text_secondary" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/miniPlayerLayout"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:background="@drawable/bg_mini_player"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="8dp"
                  android:paddingEnd="8dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toTopOf="@id/bottomNavigation">

                  <ImageView android:id="@+id/ivMiniThumb" android:layout_width="48dp" android:layout_height="48dp" android:scaleType="centerCrop" android:background="@drawable/bg_thumb_round" android:clipToOutline="true" android:src="@drawable/ic_video" />
                  <LinearLayout android:id="@+id/miniPlayerInfo" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="10dp" android:layout_marginEnd="6dp" android:orientation="vertical">
                      <TextView android:id="@+id/tvMiniTitle" android:layout_width="wrap_content" android:layout_height="wrap_content" android:ellipsize="end" android:maxLines="1" android:textColor="@color/text_primary" android:textSize="13sp" android:textStyle="bold" />
                      <TextView android:id="@+id/tvMiniSub" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="2dp" android:ellipsize="end" android:maxLines="1" android:textColor="@color/accent" android:textSize="11sp" />
                  </LinearLayout>
                  <ImageButton android:id="@+id/btnMiniPrev" android:layout_width="38dp" android:layout_height="38dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_skip_previous" app:tint="@color/text_primary" />
                  <ImageButton android:id="@+id/btnMiniPlayPause" android:layout_width="44dp" android:layout_height="44dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_play" app:tint="@color/primary" />
                  <ImageButton android:id="@+id/btnMiniNext" android:layout_width="38dp" android:layout_height="38dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_skip_next" app:tint="@color/text_primary" />
                  <ImageButton android:id="@+id/btnMiniClose" android:layout_width="36dp" android:layout_height="36dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_close" app:tint="@color/text_secondary" />
              </LinearLayout>

              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottomNavigation"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/surface_dark"
                  app:itemIconTint="@color/primary"
                  app:itemTextColor="@color/text_primary"
                  app:menu="@menu/bottom_nav_menu"
                  app:layout_constraintBottom_toBottomOf="parent" />
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_media_video.xml
