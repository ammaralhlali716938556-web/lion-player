          # 14. ThumbnailLoader.kt
          cat << 'EOF' > app/src/main/java/com/lionplayer/app/adapter/ThumbnailLoader.kt
          package com.lionplayer.app.adapter

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.Process
          import android.util.LruCache
          import android.util.Size
          import android.widget.ImageView
          import com.lionplayer.app.R
          import com.lionplayer.app.model.MediaItem
          import java.io.File
          import java.util.concurrent.Executors

          object ThumbnailLoader {
              private val maxMemory = (Runtime.getRuntime().maxMemory() / 1024).toInt()
              private val cacheSize = maxMemory / 8
              private val memoryCache = object : LruCache<String, Bitmap>(cacheSize) {
                  override fun sizeOf(key: String, bitmap: Bitmap): Int = bitmap.byteCount / 1024
              }
              private val executor = Executors.newFixedThreadPool(2) { r ->
                  Thread { Process.setThreadPriority(Process.THREAD_PRIORITY_BACKGROUND); r.run() }
              }
              private val mainHandler = Handler(Looper.getMainLooper())

              fun load(imageView: ImageView, item: MediaItem) {
                  if (item.isFolder) {
                      imageView.setImageResource(R.drawable.ic_folder)
                      return
                  }
                  val cacheKey = "${item.id}_${item.isVideo}"
                  val cachedBitmap = memoryCache.get(cacheKey)
                  if (cachedBitmap != null) {
                      imageView.setImageBitmap(cachedBitmap)
                      return
                  }
                  val placeholder = if (item.isVideo) R.drawable.ic_video else R.drawable.ic_music_note
                  imageView.setImageResource(placeholder)
                  imageView.tag = cacheKey

                  executor.execute {
                      if (imageView.tag != cacheKey) return@execute
                      val bitmap = retrieveThumbnail(imageView.context, item)
                      if (bitmap != null) {
                          memoryCache.put(cacheKey, bitmap)
                          mainHandler.post {
                              if (imageView.tag == cacheKey) {
                                  imageView.setImageBitmap(bitmap)
                              }
                          }
                      }
                  }
              }

              private fun retrieveThumbnail(context: Context, item: MediaItem): Bitmap? {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          try {
                              context.contentResolver.loadThumbnail(Uri.parse(item.uri), Size(96, 96), null)
                          } catch (e: Exception) { fallbackThumbnail(context, item) }
                      } else { fallbackThumbnail(context, item) }
                  } catch (e: Exception) { null }
              }

              private fun fallbackThumbnail(context: Context, item: MediaItem): Bitmap? {
                  val retriever = MediaMetadataRetriever()
                  return try {
                      if (item.path.isNotEmpty() && File(item.path).exists()) {
                          retriever.setDataSource(item.path)
                      } else {
                          retriever.setDataSource(context, Uri.parse(item.uri))
                      }
                      if (item.isVideo) {
                          retriever.getFrameAtTime(1000000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)?.let { scaleDown(it, 96) }
                      } else {
                          val art = retriever.embeddedPicture
                          if (art != null) decodeSampled(art, 96, 96) else null
                      }
                  } catch (e: Exception) { null }
                  finally { try { retriever.release() } catch (e: Exception) {} }
              }

              private fun scaleDown(bitmap: Bitmap, maxDim: Int): Bitmap {
                  val width = bitmap.width
                  val height = bitmap.height
                  if (width <= maxDim && height <= maxDim) return bitmap
                  val ratio = width.toFloat() / height.toFloat()
                  val targetW = if (width > height) maxDim else (maxDim * ratio).toInt()
                  val targetH = if (width > height) (maxDim / ratio).toInt() else maxDim
                  val scaled = Bitmap.createScaledBitmap(bitmap, targetW.coerceAtLeast(1), targetH.coerceAtLeast(1), true)
                  if (scaled != bitmap) bitmap.recycle()
                  return scaled
              }

              private fun decodeSampled(data: ByteArray, reqW: Int, reqH: Int): Bitmap? {
                  val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeByteArray(data, 0, data.size, options)
                  var inSampleSize = 1
                  if (options.outHeight > reqH || options.outWidth > reqW) {
                      val halfH = options.outHeight / 2
                      val halfW = options.outWidth / 2
                      while ((halfH / inSampleSize) >= reqH && (halfW / inSampleSize) >= reqW) {
                          inSampleSize *= 2
                      }
                  }
                  options.inSampleSize = inSampleSize
                  options.inJustDecodeBounds = false
                  return BitmapFactory.decodeByteArray(data, 0, data.size, options)
              }
          }
          EOF

          # 15. LionPlayerManager.kt
          cat << 'EOF' > app/src/main/java/com/lionplayer/app/player/LionPlayerManager.kt
          package com.lionplayer.app.player

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.style.ForegroundColorSpan
          import android.text.style.RelativeSizeSpan
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import com.lionplayer.app.R
          import com.lionplayer.app.model.MediaItem as LionMediaItem
          import com.lionplayer.app.receiver.NotificationReceiver
          import com.lionplayer.app.ui.PlayerActivity
          import java.util.ArrayList
          import java.util.Locale

          object LionPlayerManager {
              const val CHANNEL_ID = "lion_playback_channel"
              const val NOTIFICATION_ID = 2024

              var player: ExoPlayer? = null
                  private set
              private var mediaSession: MediaSession? = null

              var playlist: ArrayList<LionMediaItem> = arrayListOf()
              var currentIndex: Int = 0
              var allowBackgroundPlayback: Boolean = false
              var bluetoothControlEnabled: Boolean = true

              var onTrackChanged: ((LionMediaItem) -> Unit)? = null
              var onPlaybackStateChanged: ((Boolean) -> Unit)? = null

              private val tickerHandler = Handler(Looper.getMainLooper())
              private var appContextRef: Context? = null
              private val progressTickerRunnable = object : Runnable {
                  override fun run() {
                      appContextRef?.let { ctx ->
                          if (player?.isPlaying == true) {
                              updateNotification(ctx)
                              tickerHandler.postDelayed(this, 1000)
                          }
                      }
                  }
              }

              fun getOrCreatePlayer(context: Context): ExoPlayer {
                  val appContext = context.applicationContext
                  appContextRef = appContext

                  if (player == null) {
                      player = ExoPlayer.Builder(appContext)
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(C.USAGE_MEDIA)
                                  .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                                  .build(),
                              true
                          )
                          .setWakeMode(C.WAKE_MODE_LOCAL)
                          .setHandleAudioBecomingNoisy(true)
                          .build().apply {
                              addListener(object : Player.Listener {
                                  override fun onIsPlayingChanged(isPlaying: Boolean) {
                                      onPlaybackStateChanged?.invoke(isPlaying)
                                      updateNotification(appContext)
                                      tickerHandler.removeCallbacks(progressTickerRunnable)
                                      if (isPlaying) {
                                          tickerHandler.postDelayed(progressTickerRunnable, 1000)
                                      }
                                  }
                                  override fun onPlaybackStateChanged(playbackState: Int) {
                                      if (playbackState == Player.STATE_ENDED) {
                                          if (currentIndex < playlist.size - 1) {
                                              playNext(appContext)
                                          } else {
                                              onPlaybackStateChanged?.invoke(false)
                                              updateNotification(appContext)
                                          }
                                      }
                                  }
                              })
                          }

                      mediaSession = MediaSession.Builder(appContext, player!!)
                          .setId("LionMediaSession")
                          .setCallback(object : MediaSession.Callback {
                              override fun onMediaButtonEvent(
                                  session: MediaSession,
                                  controllerInfo: MediaSession.ControllerInfo,
                                  intent: Intent
                              ): Boolean {
                                  if (!bluetoothControlEnabled) return true
                                  return super.onMediaButtonEvent(session, controllerInfo, intent)
                              }
                          })
                          .build()

                      createNotificationChannel(appContext)
                  }
                  return player!!
              }

              fun playPlaylist(context: Context, list: ArrayList<LionMediaItem>, index: Int) {
                  val appContext = context.applicationContext
                  val p = getOrCreatePlayer(appContext)
                  val currentItem = playlist.getOrNull(currentIndex)
                  val targetItem = list.getOrNull(index)

                  if (currentItem != null && targetItem != null && currentItem.id == targetItem.id && p.isPlaying) {
                      playlist = list
                      currentIndex = index
                      onTrackChanged?.invoke(targetItem)
                      return
                  }
                  playlist = list
                  currentIndex = index
                  playCurrentItem(appContext)
              }

              fun playCurrentItem(context: Context) {
                  val item = playlist.getOrNull(currentIndex) ?: return
                  val appContext = context.applicationContext
                  val p = getOrCreatePlayer(appContext)

                  if (!item.isVideo) {
                      allowBackgroundPlayback = true
                  }
                  val mediaItem = MediaItem.fromUri(Uri.parse(item.uri))
                  p.setMediaItem(mediaItem)
                  p.prepare()
                  p.play()

                  onTrackChanged?.invoke(item)
                  onPlaybackStateChanged?.invoke(true)
                  updateNotification(appContext)
              }

              fun playNext(context: Context) {
                  if (currentIndex < playlist.size - 1) {
                      currentIndex++
                      playCurrentItem(context)
                  } else {
                      Toast.makeText(context.applicationContext, "هذا هو العنصر الأخير في القائمة", Toast.LENGTH_SHORT).show()
                  }
              }

              fun playPrevious(context: Context) {
                  if (currentIndex > 0) {
                      currentIndex--
                      playCurrentItem(context)
                  } else {
                      Toast.makeText(context.applicationContext, "هذا هو العنصر الأول في القائمة", Toast.LENGTH_SHORT).show()
                  }
              }

              fun togglePlayPause(context: Context) {
                  val p = player ?: return
                  if (p.isPlaying) p.pause() else p.play()
                  updateNotification(context)
              }

              fun stop(context: Context) {
                  allowBackgroundPlayback = false
                  tickerHandler.removeCallbacks(progressTickerRunnable)
                  player?.stop()
                  dismissNotification(context)
                  onPlaybackStateChanged?.invoke(false)
              }

              fun release() {
                  allowBackgroundPlayback = false
                  tickerHandler.removeCallbacks(progressTickerRunnable)
                  mediaSession?.release()
                  mediaSession = null
                  player?.release()
                  player = null
              }

              fun getCurrentItem(): LionMediaItem? = playlist.getOrNull(currentIndex)

              fun createNotificationChannel(context: Context) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(CHANNEL_ID, "Lion Playback", NotificationManager.IMPORTANCE_LOW).apply {
                          description = "Lion Player Media Controls"
                          setShowBadge(false)
                          setSound(null, null)
                          enableVibration(false)
                      }
                      context.getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }
              }

              fun formatDuration(durationMs: Long): String {
                  val totalSec = durationMs / 1000
                  val sec = totalSec % 60
                  val min = (totalSec / 60) % 60
                  val hrs = totalSec / 3600
                  return if (hrs > 0) String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
                  else String.format(Locale.US, "%02d:%02d", min, sec)
              }

              fun updateNotification(context: Context) {
                  val currentItem = playlist.getOrNull(currentIndex) ?: return
                  val p = player
                  val isPlaying = p?.isPlaying == true
                  val appContext = context.applicationContext
                  val currentPos = p?.currentPosition ?: 0L
                  val totalDur = (if (p != null && p.duration > 0) p.duration else currentItem.duration).coerceAtLeast(0L)
                  val timeString = "${formatDuration(currentPos)} / ${formatDuration(totalDur)}"
                  val mediaTypeString = if (currentItem.isVideo) "فيديو" else "صوت"

                  val notifTitle: CharSequence = if (currentItem.artist.isNotEmpty() && currentItem.artist != "غير معروف") {
                      val fullText = "${currentItem.title}  ${currentItem.artist}"
                      val span = SpannableString(fullText)
                      val start = currentItem.title.length
                      span.setSpan(RelativeSizeSpan(0.8f), start, fullText.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      span.setSpan(ForegroundColorSpan(Color.parseColor("#B0BEC5")), start, fullText.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      span
                  } else currentItem.title

                  val pendingFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE else PendingIntent.FLAG_UPDATE_CURRENT

                  val contentIntent = Intent(appContext, PlayerActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP }
                  val contentPendingIntent = PendingIntent.getActivity(appContext, 0, contentIntent, pendingFlags)

                  val prevPending = PendingIntent.getBroadcast(appContext, 1, Intent(NotificationReceiver.ACTION_NOTIF_PREV).setPackage(appContext.packageName), pendingFlags)
                  val playPausePending = PendingIntent.getBroadcast(appContext, 2, Intent(NotificationReceiver.ACTION_NOTIF_PLAY_PAUSE).setPackage(appContext.packageName), pendingFlags)
                  val nextPending = PendingIntent.getBroadcast(appContext, 3, Intent(NotificationReceiver.ACTION_NOTIF_NEXT).setPackage(appContext.packageName), pendingFlags)
                  val closePending = PendingIntent.getBroadcast(appContext, 4, Intent(NotificationReceiver.ACTION_NOTIF_CLOSE).setPackage(appContext.packageName), pendingFlags)

                  val playPauseIcon = if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play
                  val builder = NotificationCompat.Builder(appContext, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_lion_logo)
                      .setContentTitle(notifTitle)
                      .setContentText("$timeString • $mediaTypeString")
                      .setSubText(timeString)
                      .setContentIntent(contentPendingIntent)
                      .setOngoing(isPlaying)
                      .setOnlyAlertOnce(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .addAction(R.drawable.ic_skip_previous, "السابق", prevPending)
                      .addAction(playPauseIcon, if (isPlaying) "إيقاف مؤقت" else "تشغيل", playPausePending)
                      .addAction(R.drawable.ic_skip_next, "التالي", nextPending)
                      .addAction(R.drawable.ic_close, "إنهاء", closePending)

                  try {
                      builder.setStyle(androidx.media.app.NotificationCompat.MediaStyle().setShowActionsInCompactView(0, 1, 2))
                  } catch (e: Exception) {}

                  val manager = appContext.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  try { manager.notify(NOTIFICATION_ID, builder.build()) } catch (e: SecurityException) {}
              }

              fun dismissNotification(context: Context) {
                  tickerHandler.removeCallbacks(progressTickerRunnable)
                  val manager = context.applicationContext.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.cancel(NOTIFICATION_ID)
              }
          }
