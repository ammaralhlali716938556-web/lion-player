          # app/src/main/java/com/lionplayer/app/LionPlayerApp.kt
          cat << 'EOF_FILE_3' > app/src/main/java/com/lionplayer/app/LionPlayerApp.kt
          package com.lionplayer.app
          
          import android.app.Application
          import android.content.Context
          import androidx.appcompat.app.AppCompatDelegate
          import coil.Coil
          import coil.ImageLoader
          import coil.decode.VideoFrameDecoder
          import coil.disk.DiskCache
          import coil.memory.MemoryCache
          
          class LionPlayerApp : Application() {
          
              override fun onCreate() {
                  super.onCreate()
          
                  // 1. Setup High-Performance Asynchronous Thumbnail Engine (Coil with VideoFrameDecoder)
                  val imageLoader = ImageLoader.Builder(this)
                      .components {
                          add(VideoFrameDecoder.Factory())
                      }
                      .crossfade(true)
                      .memoryCache {
                          MemoryCache.Builder(this)
                              .maxSizePercent(0.25)
                              .build()
                      }
                      .diskCache {
                          DiskCache.Builder()
                              .directory(cacheDir.resolve("media_thumb_cache"))
                              .maxSizeBytes(128 * 1024 * 1024) // 128 MB disk LRU cache
                              .build()
                      }
                      .build()
                  Coil.setImageLoader(imageLoader)
          
                  // 2. Apply theme preference
                  val prefs = getSharedPreferences("lion_player_prefs", Context.MODE_PRIVATE)
                  val mode = prefs.getString("theme_mode", "dark") ?: "dark"
                  applyTheme(mode)
              }
          
              companion object {
                  fun applyTheme(mode: String) {
                      when (mode) {
                          "light" -> AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_NO)
                          "dark", "amoled" -> AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_YES)
                          "system" -> AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM)
                          else -> AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_YES)
                      }
                  }
              }
          }
