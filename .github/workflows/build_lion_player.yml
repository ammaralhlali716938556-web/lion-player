              @SuppressLint("ClickableViewAccessibility")
              private fun setupGestures() {
                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (!isKidsLocked) {
                              toggleOverlayControls()
                          }
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          if (isKidsLocked) return false
                          player?.let {
                              if (e.x < window.decorView.width / 2) {
                                  it.seekTo(maxOf(0L, it.currentPosition - 10000))
                                  showSeekHud("تأخير -10 ثواني")
                              } else {
                                  it.seekTo(minOf(it.duration, it.currentPosition + 10000))
                                  showSeekHud("تقديم +10 ثواني")
                              }
                          }
                          return true
                      }
                  })

                  binding.playerRootLayout.setOnTouchListener { _, event ->
                      gestureDetector.onTouchEvent(event)
                      if (isKidsLocked) return@setOnTouchListener true

                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              gestureInitialX = event.x
                              gestureInitialY = event.y
                              gestureInitialVolume = currentVolumePercent
                              gestureInitialBrightness = currentBrightnessPercent
                              gestureInitialPosition = player?.currentPosition ?: 0L
                              gestureTargetPosition = gestureInitialPosition
                              isSeekingGesture = false
                              isVolumeOrBrightnessGesture = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.x - gestureInitialX
                              // السحب للأعلى (event.y أقل من البداية) يعطي dy موجباً لزيادة القيمة
                              val dy = gestureInitialY - event.y
                              val absDx = Math.abs(dx)
                              val absDy = Math.abs(dy)

                              if (!isSeekingGesture && !isVolumeOrBrightnessGesture) {
                                  if (absDx > absDy && absDx > 40) {
                                      isSeekingGesture = true
                                  } else if (absDy > absDx && absDy > 40) {
                                      isVolumeOrBrightnessGesture = true
                                  }
                              }

                              if (isSeekingGesture) {
                                  // السحب لليسار يقدم والسحب لليمين يؤخر
                                  val screenWidth = window.decorView.width.toFloat()
                                  val seekDeltaMs = ((-dx / screenWidth) * 90000L).toLong()
                                  val totalDur = player?.duration ?: 0L
                                  val safeDur = if (totalDur > 0) totalDur else Long.MAX_VALUE
                                  gestureTargetPosition = (gestureInitialPosition + seekDeltaMs).coerceIn(0L, safeDur)

                                  val sign = if (seekDeltaMs >= 0) "+" else ""
                                  val deltaSec = seekDeltaMs / 1000
                                  showSeekHud("${sign}${deltaSec}s [${formatTime(gestureTargetPosition)} / ${formatTime(safeDur)}]")
                              } else if (isVolumeOrBrightnessGesture) {
                                  val screenHeight = window.decorView.height.toFloat()
                                  val deltaPercent = ((dy / screenHeight) * 100).toInt()

                                  if (gestureInitialX > window.decorView.width * 0.55f) {
                                      // يمين الشاشة: الصوت (فوق يزداد / تحت ينقص حتى 100%)
                                      currentVolumePercent = (gestureInitialVolume + deltaPercent).coerceIn(0, 100)
                                      audioBoostManager.setBoostLevel(currentVolumePercent)
                                      showVolumeHud(currentVolumePercent)
                                  } else if (gestureInitialX < window.decorView.width * 0.45f) {
                                      // يسار الشاشة: السطوع (فوق يزداد / تحت ينقص حتى 100%)
                                      currentBrightnessPercent = (gestureInitialBrightness + deltaPercent).coerceIn(1, 100)
                                      val lp = window.attributes
                                      lp.screenBrightness = currentBrightnessPercent / 100f
                                      window.attributes = lp
                                      showBrightnessHud(currentBrightnessPercent)
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              if (isSeekingGesture) {
                                  player?.seekTo(gestureTargetPosition)
                                  isSeekingGesture = false
                                  handler.postDelayed({ binding.hudSeek.visibility = View.GONE }, 700)
                              }
                              isVolumeOrBrightnessGesture = false
                          }
                      }
                      true
                  }
              }

              private fun showSeekHud(text: String) {
                  binding.hudSeek.visibility = View.VISIBLE
                  binding.txtSeekHud.text = text
              }

              private fun showVolumeHud(percent: Int) {
                  binding.hudVolume.visibility = View.VISIBLE
                  binding.progressVolume.progress = percent
                  binding.txtVolumePercent.text = "${percent}%"
                  handler.removeCallbacks(hideVolumeRunnable)
                  handler.postDelayed(hideVolumeRunnable, 1000)
              }

              private val hideVolumeRunnable = Runnable {
                  binding.hudVolume.visibility = View.GONE
              }

              private fun showBrightnessHud(percent: Int) {
                  binding.hudBrightness.visibility = View.VISIBLE
                  binding.progressBrightness.progress = percent
                  binding.txtBrightnessPercent.text = "${percent}%"
                  handler.removeCallbacks(hideBrightnessRunnable)
                  handler.postDelayed(hideBrightnessRunnable, 1000)
              }

              private val hideBrightnessRunnable = Runnable {
                  binding.hudBrightness.visibility = View.GONE
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupSubtitleDrag() {
                  var dX = 0f
                  var dY = 0f
                  binding.txtDraggableSubtitle.setOnTouchListener { view, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              dX = view.x - event.rawX
                              dY = view.y - event.rawY
                          }
                          MotionEvent.ACTION_MOVE -> {
                              view.animate().x(event.rawX + dX).y(event.rawY + dY).setDuration(0).start()
                          }
                      }
                      true
                  }
              }

              private fun toggleOverlayControls() {
                  isOverlayVisible = !isOverlayVisible
                  val vis = if (isOverlayVisible) View.VISIBLE else View.GONE
                  binding.topControlsOverlay.visibility = vis
                  binding.bottomControlsOverlay.visibility = vis
              }

              private fun enterPipMode() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val params = PictureInPictureParams.Builder().build()
                      enterPictureInPictureMode(params)
                  } else {
                      Toast.makeText(this, "خاصية PiP غير مدعومة على هذا الإصدار", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onPictureInPictureModeChanged(isInPip: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPip, newConfig)
                  val vis = if (isInPip) View.GONE else View.VISIBLE
                  binding.topControlsOverlay.visibility = vis
                  binding.bottomControlsOverlay.visibility = vis
              }

              private fun showAudioTrackDialog() {
                  val tracks = player?.currentTracks ?: return
                  val audioGroups = tracks.groups.filter { it.type == C.TRACK_TYPE_AUDIO }
                  if (audioGroups.isEmpty()) {
                      Toast.makeText(this, "لا توجد مسارات صوتية إضافية", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val names = audioGroups.mapIndexed { i, _ -> "المسار #${i + 1}" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle(getString(R.string.audio_track))
                      .setItems(names) { _, which ->
                          Toast.makeText(this, "تم اختيار: ${names[which]}", Toast.LENGTH_SHORT).show()
                      }.show()
              }

              private fun showAdvancedOptionsMenu() {
                  val options = arrayOf(
                      "سرعة التشغيل",
                      "مؤقت النوم",
                      "خصائص الملف"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("الخيارات المتقدمة")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> {
                                  val speeds = arrayOf("0.5x", "1.0x (طبيعي)", "1.5x", "2.0x")
                                  val vals = floatArrayOf(0.5f, 1.0f, 1.5f, 2.0f)
                                  AlertDialog.Builder(this)
                                      .setTitle("سرعة التشغيل")
                                      .setItems(speeds) { _, i -> player?.setPlaybackSpeed(vals[i]) }
                                      .show()
                              }
                              1 -> {
                                  handler.postDelayed({ player?.pause(); finish() }, 30 * 60 * 1000L)
                                  Toast.makeText(this, "تم ضبط إيقاف التشغيل بعد 30 دقيقة", Toast.LENGTH_SHORT).show()
                              }
                              2 -> {
                                  val size = player?.videoSize
                                  AlertDialog.Builder(this)
                                      .setTitle(getString(R.string.properties))
                                      .setMessage("الأبعاد: ${size?.width}x${size?.height}")
                                      .setPositiveButton("إغلاق", null)
                                      .show()
                              }
                          }
                      }.show()
              }

              private fun startProgressUpdater() {
                  handler.post(object : Runnable {
                      override fun run() {
                          player?.let {
                              if (it.isPlaying) {
                                  binding.seekBarVideo.progress = it.currentPosition.toInt()
                                  binding.txtCurrentTime.text = formatTime(it.currentPosition)
                              }
                          }
                          handler.postDelayed(this, 1000)
                      }
                  })
              }

              private fun formatTime(ms: Long): String {
                  val totalSec = ms / 1000
                  val seconds = totalSec % 60
                  val minutes = (totalSec / 60) % 60
                  val hours = totalSec / 3600
                  return if (hours > 0) {
                      String.format(Locale.getDefault(), "%02d:%02d:%02d", hours, minutes, seconds)
                  } else {
                      String.format(Locale.getDefault(), "%02d:%02d", minutes, seconds)
                  }
              }

              override fun onStop() {
                  super.onStop()
                  player?.pause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  player = null
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LionPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
