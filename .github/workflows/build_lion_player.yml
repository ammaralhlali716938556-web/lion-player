          cat << 'EOF' > app/src/main/java/com/lion/player/adapter/MediaAdapter.kt
          package com.lion.player.adapter

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import com.bumptech.glide.Glide
          import com.lion.player.R
          import com.lion.player.model.MediaItem
          import java.util.Locale

          class MediaAdapter(
              private val onItemClick: (MediaItem) -> Unit,
              private val onItemLongClick: (MediaItem) -> Unit
          ) : RecyclerView.Adapter<MediaAdapter.MediaViewHolder>() {

              enum class DisplayStyle { LIST, GRID_LARGE, GRID_SMALL }
              var currentStyle = DisplayStyle.LIST

              private val items = mutableListOf<MediaItem>()

              fun submitList(list: List<MediaItem>) {
                  items.clear()
                  items.addAll(list)
                  notifyDataSetChanged()
              }

              override fun getItemViewType(position: Int): Int {
                  return if (currentStyle == DisplayStyle.LIST) 0 else 1
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): MediaViewHolder {
                  val layoutId = if (viewType == 0) R.layout.item_media_video else R.layout.item_media_grid
                  val v = LayoutInflater.from(parent.context).inflate(layoutId, parent, false)
                  return MediaViewHolder(v)
              }

              override fun onBindViewHolder(holder: MediaViewHolder, position: Int) {
                  holder.bind(items[position])
              }

              override fun getItemCount(): Int = items.size

              inner class MediaViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
                  private val imgThumbnail: ImageView = itemView.findViewById(R.id.imgThumbnail)
                  private val txtTitle: TextView = itemView.findViewById(R.id.txtTitle)
                  private val txtDetails: TextView = itemView.findViewById(R.id.txtDetails)

                  fun bind(item: MediaItem) {
                      txtTitle.text = item.title

                      if (item.isFolder) {
                          imgThumbnail.setImageResource(R.drawable.ic_folder)
                          txtDetails.text = "${item.itemCount} عنصر"
                      } else if (item.isAudio) {
                          imgThumbnail.setImageResource(R.drawable.ic_music_note)
                          val durationMin = (item.duration / 1000) / 60
                          val durationSec = (item.duration / 1000) % 60
                          val sizeMb = item.size / (1024 * 1024)
                          txtDetails.text = String.format(Locale.getDefault(), "%s • %02d:%02d • %d MB", item.extraInfo, durationMin, durationSec, sizeMb)
                      } else {
                          val durationMin = (item.duration / 1000) / 60
                          val durationSec = (item.duration / 1000) % 60
                          val sizeMb = item.size / (1024 * 1024)
                          txtDetails.text = String.format(Locale.getDefault(), "%02d:%02d • %d MB • %s", durationMin, durationSec, sizeMb, item.extraInfo)

                          Glide.with(itemView.context)
                              .load(item.uri)
                              .placeholder(R.drawable.ic_video)
                              .into(imgThumbnail)
                      }

                      itemView.setOnClickListener { onItemClick(item) }
                      itemView.setOnLongClickListener {
                          onItemLongClick(item)
                          true
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/lion/player/ui/MainActivity.kt
          package com.lion.player.ui

          import android.Manifest
          import android.content.ContentUris
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.lion.player.R
          import com.lion.player.adapter.MediaAdapter
          import com.lion.player.databinding.ActivityMainBinding
          import com.lion.player.model.MediaItem
          import java.io.File

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private lateinit var mediaAdapter: MediaAdapter
              private val allVideosList = mutableListOf<MediaItem>()
              private val allAudiosList = mutableListOf<MediaItem>()

              private var isFolderView = true
              private var currentSelectedFolder: String? = null
              private var isAudioTabSelected = false

              enum class SortBy { NAME, DATE, SIZE, DURATION }
              private var currentSort = SortBy.DATE
              private var isAscending = false
              private var currentStyle = MediaAdapter.DisplayStyle.LIST

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  setupToolbar()
                  setupRecyclerView()
                  setupBottomNav()
                  setupBackPress()
                  checkPermissionsAndLoad()

                  binding.swipeRefresh.setOnRefreshListener {
                      if (isAudioTabSelected) loadLocalAudios() else loadLocalVideos()
                      binding.swipeRefresh.isRefreshing = false
                  }
              }

              private fun setupToolbar() {
                  binding.topToolbar.inflateMenu(R.menu.top_main_menu)
                  binding.topToolbar.setOnMenuItemClickListener { menuItem ->
                      when (menuItem.itemId) {
                          R.id.action_folder_toggle -> {
                              isFolderView = !isFolderView
                              currentSelectedFolder = null
                              updateToolbarTitle()
                              displayCurrentMedia()
                              Toast.makeText(this, if (isFolderView) "عرض كمجلدات" else "عرض كافة الملفات", Toast.LENGTH_SHORT).show()
                              true
                          }
                          R.id.action_display_style -> {
                              showDisplayStyleDialog()
                              true
                          }
                          R.id.action_sort -> {
                              showSortAndOrderDialog()
                              true
                          }
                          else -> false
                      }
                  }

                  binding.topToolbar.setNavigationOnClickListener {
                      if (currentSelectedFolder != null) {
                          currentSelectedFolder = null
                          updateToolbarTitle()
                          displayCurrentMedia()
                      }
                  }
              }

              private fun showDisplayStyleDialog() {
                  val styles = arrayOf("📄 قائمة تفصيلية (عمود واحد)", "🖼️ مصغرات كبيرة (عمودين)", "🔲 مصغرات صغيرة (3 أعمدة)")
                  AlertDialog.Builder(this)
                      .setTitle("اختر شكل العرض:")
                      .setItems(styles) { _, which ->
                          when (which) {
                              0 -> {
                                  currentStyle = MediaAdapter.DisplayStyle.LIST
                                  binding.recyclerViewMedia.layoutManager = LinearLayoutManager(this)
                              }
                              1 -> {
                                  currentStyle = MediaAdapter.DisplayStyle.GRID_LARGE
                                  binding.recyclerViewMedia.layoutManager = GridLayoutManager(this, 2)
                              }
                              2 -> {
                                  currentStyle = MediaAdapter.DisplayStyle.GRID_SMALL
                                  binding.recyclerViewMedia.layoutManager = GridLayoutManager(this, 3)
                              }
                          }
                          mediaAdapter.currentStyle = currentStyle
                          mediaAdapter.notifyDataSetChanged()
                      }
                      .show()
              }

              private fun setupRecyclerView() {
                  mediaAdapter = MediaAdapter(
                      onItemClick = { item ->
                          if (item.isFolder) {
                              currentSelectedFolder = item.folderName
                              updateToolbarTitle()
                              displayCurrentMedia()
                          } else {
                              launchPlayer(item)
                          }
                      },
                      onItemLongClick = { item ->
                          if (!item.isFolder) showItemOptions(item)
                      }
                  )
                  binding.recyclerViewMedia.layoutManager = LinearLayoutManager(this)
                  binding.recyclerViewMedia.adapter = mediaAdapter
              }

              private fun launchPlayer(clickedItem: MediaItem) {
                  val activeList = if (isAudioTabSelected) allAudiosList else allVideosList
                  val currentItems = if (currentSelectedFolder != null) {
                      activeList.filter { it.folderName == currentSelectedFolder }
                  } else if (!isFolderView) {
                      activeList
                  } else {
                      listOf(clickedItem)
                  }

                  val sorted = sortItems(currentItems)
                  val uris = ArrayList(sorted.map { it.uri.toString() })
                  val titles = ArrayList(sorted.map { it.title })
                  val index = sorted.indexOfFirst { it.id == clickedItem.id }.coerceAtLeast(0)

                  val intent = Intent(this, PlayerActivity::class.java).apply {
                      putStringArrayListExtra("PLAYLIST_URIS", uris)
                      putStringArrayListExtra("PLAYLIST_TITLES", titles)
                      putExtra("CURRENT_INDEX", index)
                      putExtra("VIDEO_URI", clickedItem.uri.toString())
                      putExtra("VIDEO_TITLE", clickedItem.title)
                  }
                  startActivity(intent)
              }

              private fun setupBottomNav() {
                  binding.bottomNavigation.setOnItemSelectedListener { item ->
                      when (item.itemId) {
                          R.id.nav_local -> {
                              isAudioTabSelected = false
                              currentSelectedFolder = null
                              updateToolbarTitle()
                              loadLocalVideos()
                              true
                          }
                          R.id.nav_music -> {
                              isAudioTabSelected = true
                              currentSelectedFolder = null
                              updateToolbarTitle()
                              loadLocalAudios()
                              true
                          }
                          R.id.nav_stream -> {
                              showStreamDialog()
                              true
                          }
                          else -> false
                      }
                  }
              }

              private fun setupBackPress() {
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (currentSelectedFolder != null) {
                              currentSelectedFolder = null
                              updateToolbarTitle()
                              displayCurrentMedia()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })
              }

              private fun updateToolbarTitle() {
                  if (currentSelectedFolder != null) {
                      binding.topToolbar.title = currentSelectedFolder
                      binding.topToolbar.setNavigationIcon(R.drawable.ic_back)
                  } else if (isAudioTabSelected) {
                      binding.topToolbar.title = "الموسيقى والصوتيات"
                      binding.topToolbar.setNavigationIcon(R.drawable.ic_lion_logo)
                  } else {
                      binding.topToolbar.title = "Lion Player"
                      binding.topToolbar.setNavigationIcon(R.drawable.ic_lion_logo)
                  }
              }

              private fun showSortAndOrderDialog() {
                  val sortOptions = arrayOf(
                      "الاسم (تصاعدي)", "الاسم (تنازلي)",
                      "التاريخ (الأحدث أولاً)", "التاريخ (الأقدم أولاً)",
                      "الحجم (الأكبر أولاً)", "الحجم (الأصغر أولاً)",
                      "المدة (الأطول أولاً)", "المدة (الأقصر أولاً)"
                  )

                  AlertDialog.Builder(this)
                      .setTitle("فرز وترتيب حسب:")
                      .setItems(sortOptions) { _, which ->
                          when (which) {
                              0 -> { currentSort = SortBy.NAME; isAscending = true }
                              1 -> { currentSort = SortBy.NAME; isAscending = false }
                              2 -> { currentSort = SortBy.DATE; isAscending = false }
                              3 -> { currentSort = SortBy.DATE; isAscending = true }
                              4 -> { currentSort = SortBy.SIZE; isAscending = false }
                              5 -> { currentSort = SortBy.SIZE; isAscending = true }
                              6 -> { currentSort = SortBy.DURATION; isAscending = false }
                              7 -> { currentSort = SortBy.DURATION; isAscending = true }
                          }
                          displayCurrentMedia()
                          Toast.makeText(this, "تم الفرز بنجاح", Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }

              private fun checkPermissionsAndLoad() {
                  val permissions = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      arrayOf(Manifest.permission.READ_MEDIA_VIDEO, Manifest.permission.READ_MEDIA_AUDIO)
                  } else {
                      arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }

                  val needReq = permissions.any {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (needReq) {
                      ActivityCompat.requestPermissions(this, permissions, 1001)
                  } else {
                      loadLocalVideos()
                  }
              }

              private fun loadLocalVideos() {
                  allVideosList.clear()
                  val projection = arrayOf(
                      MediaStore.Video.Media._ID,
                      MediaStore.Video.Media.TITLE,
                      MediaStore.Video.Media.DATA,
                      MediaStore.Video.Media.DURATION,
                      MediaStore.Video.Media.SIZE,
                      MediaStore.Video.Media.RESOLUTION,
                      MediaStore.Video.Media.BUCKET_DISPLAY_NAME,
                      MediaStore.Video.Media.DATE_ADDED
                  )

                  val cursor = contentResolver.query(
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                      projection, null, null, null
                  )

                  cursor?.use {
                      val idCol = it.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                      val titleCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.TITLE)
                      val dataCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                      val durCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                      val sizeCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                      val resCol = it.getColumnIndex(MediaStore.Video.Media.RESOLUTION)
                      val folderCol = it.getColumnIndex(MediaStore.Video.Media.BUCKET_DISPLAY_NAME)
                      val dateCol = it.getColumnIndex(MediaStore.Video.Media.DATE_ADDED)

                      while (it.moveToNext()) {
                          val id = it.getLong(idCol)
                          val title = it.getString(titleCol) ?: "Unknown"
                          val path = it.getString(dataCol) ?: ""
                          val duration = it.getLong(durCol)
                          val size = it.getLong(sizeCol)
                          val resolution = if (resCol != -1) it.getString(resCol) ?: "HD" else "HD"
                          val folder = if (folderCol != -1) it.getString(folderCol) ?: "Local" else "Local"
                          val dateAdded = if (dateCol != -1) it.getLong(dateCol) else 0L
                          val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)

                          allVideosList.add(MediaItem(id, title, path, uri, duration, size, resolution, folder, false, false, 0, dateAdded))
                      }
                  }
                  displayCurrentMedia()
              }

              private fun loadLocalAudios() {
                  allAudiosList.clear()
                  val projection = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.TITLE,
                      MediaStore.Audio.Media.ARTIST,
                      MediaStore.Audio.Media.DATA,
                      MediaStore.Audio.Media.DURATION,
                      MediaStore.Audio.Media.SIZE,
                      MediaStore.Audio.Media.DATE_ADDED
                  )

                  val selection = "${MediaStore.Audio.Media.IS_MUSIC} != 0"
                  val cursor = contentResolver.query(
                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                      projection, selection, null, null
                  )

                  cursor?.use {
                      val idCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                      val titleCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                      val artistCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                      val dataCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.DATA)
                      val durCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                      val sizeCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.SIZE)
                      val dateCol = it.getColumnIndex(MediaStore.Audio.Media.DATE_ADDED)

                      while (it.moveToNext()) {
                          val id = it.getLong(idCol)
                          val title = it.getString(titleCol) ?: "Audio"
                          val artist = it.getString(artistCol) ?: "Artist"
                          val path = it.getString(dataCol) ?: ""
                          val duration = it.getLong(durCol)
                          val size = it.getLong(sizeCol)
                          val dateAdded = if (dateCol != -1) it.getLong(dateCol) else 0L
                          val uri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)

                          val folder = try {
                              File(path).parentFile?.name ?: "Music"
                          } catch (_: Exception) {
                              "Music"
                          }

                          allAudiosList.add(MediaItem(id, title, path, uri, duration, size, artist, folder, false, true, 0, dateAdded))
                      }
                  }
                  displayCurrentMedia()
              }

              private fun displayCurrentMedia() {
                  val activeList = if (isAudioTabSelected) allAudiosList else allVideosList

                  if (isFolderView && currentSelectedFolder == null) {
                      val folderGroups = activeList.groupBy { it.folderName }
                      val folders = folderGroups.map { (folderName, items) ->
                          MediaItem(
                              id = 0,
                              title = folderName,
                              path = "",
                              uri = android.net.Uri.EMPTY,
                              duration = 0,
                              size = 0,
                              extraInfo = "",
                              folderName = folderName,
                              isFolder = true,
                              isAudio = isAudioTabSelected,
                              itemCount = items.size,
                              dateAdded = items.maxOfOrNull { it.dateAdded } ?: 0L
                          )
                      }
                      mediaAdapter.submitList(sortItems(folders))
                  } else if (isFolderView && currentSelectedFolder != null) {
                      val folderItems = activeList.filter { it.folderName == currentSelectedFolder }
                      mediaAdapter.submitList(sortItems(folderItems))
                  } else {
                      mediaAdapter.submitList(sortItems(activeList))
                  }
              }

              private fun sortItems(list: List<MediaItem>): List<MediaItem> {
                  val sorted = when (currentSort) {
                      SortBy.NAME -> list.sortedBy { it.title.lowercase() }
                      SortBy.DATE -> list.sortedBy { it.dateAdded }
                      SortBy.SIZE -> list.sortedBy { it.size }
                      SortBy.DURATION -> list.sortedBy { it.duration }
                  }
                  return if (isAscending) sorted else sorted.reversed()
              }

              private fun showStreamDialog() {
                  val input = android.widget.EditText(this).apply {
                      hint = "https://example.com/video.mp4"
                  }
                  AlertDialog.Builder(this)
                      .setTitle("تشغيل رابط عبر الإنترنت")
                      .setView(input)
                      .setPositiveButton("تشغيل") { _, _ ->
                          val url = input.text.toString().trim()
                          if (url.isNotEmpty()) {
                              val intent = Intent(this, PlayerActivity::class.java).apply {
                                  putExtra("VIDEO_URI", url)
                                  putExtra("VIDEO_TITLE", "Online Stream")
                              }
                              startActivity(intent)
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun showItemOptions(item: MediaItem) {
                  val options = arrayOf("مشاركة", "الخصائص")
                  AlertDialog.Builder(this)
                      .setTitle(item.title)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> {
                                  val share = Intent(Intent.ACTION_SEND).apply {
                                      type = if (item.isAudio) "audio/*" else "video/*"
                                      putExtra(Intent.EXTRA_STREAM, item.uri)
                                  }
                                  startActivity(Intent.createChooser(share, "مشاركة الملف"))
                              }
                              1 -> {
                                  AlertDialog.Builder(this)
                                      .setTitle("خصائص الملف")
                                      .setMessage("الاسم: ${item.title}\nالمسار: ${item.path}\nالحجم: ${item.size / (1024*1024)} MB\nالمعلومات: ${item.extraInfo}")
                                      .setPositiveButton("إغلاق", null)
                                      .show()
                              }
                          }
                      }.show()
              }
          }
