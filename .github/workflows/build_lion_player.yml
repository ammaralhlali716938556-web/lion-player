                  val pinHash = hashString(pin + salt)
                  val answerHash = hashString(answer.trim().lowercase())
                  return prefs.edit()
            .putString(PREF_PIN_SALT, salt)
            .putString(PREF_PIN_HASH, pinHash)
            .putString(PREF_SECURITY_QUESTION, question.trim())
            .putString(PREF_SECURITY_ANSWER_HASH, answerHash)
            .commit()
