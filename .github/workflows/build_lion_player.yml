          import android.widget.ImageButton
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.SearchView
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.google.android.material.appbar.MaterialToolbar
          import com.google.android.material.bottomnavigation.BottomNavigationView
          import com.lionplayer.app.R
          import com.lionplayer.app.adapter.MediaAdapter
          import com.lionplayer.app.adapter.ThumbnailLoader
          import com.lionplayer.app.model.MediaItem
          import com.lionplayer.app.player.LionPlayerManager
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.ArrayList
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private val PERMISSION_REQ_CODE = 101

              private lateinit var toolbar: MaterialToolbar
              private lateinit var rvMedia: RecyclerView
              private lateinit var tvEmptyState: TextView
              private lateinit var bottomNav: BottomNavigationView
              private lateinit var mediaAdapter: MediaAdapter
              private lateinit var scaleGestureDetector: ScaleGestureDetector
              private lateinit var prefs: SharedPreferences

              // عناصر المشغل المصغر السفلي
              private lateinit var miniPlayerLayout: LinearLayout
              private lateinit var ivMiniThumb: ImageView
              private lateinit var tvMiniTitle: TextView
              private lateinit var tvMiniSub: TextView
              private lateinit var btnMiniPrev: ImageButton
              private lateinit var btnMiniPlayPause: ImageButton
              private lateinit var btnMiniNext: ImageButton
              private lateinit var btnMiniClose: ImageButton

              // التبويبات: 0 فيديو، 1 صوت، 2 جميع الملفات، 3 المفضلة
              private var currentTab = 0
              private val TAB_VIDEO = 0
              private val TAB_AUDIO = 1
              private val TAB_ALL = 2
              private val TAB_FAVORITES = 3

              private var isVideoFolderMode = true
              private var isAudioFolderMode = true
              private var currentSelectedFolder: String? = null

              private var sortBy = "name"
              private var sortAsc = true
              private var viewStyle = MediaAdapter.VIEW_MODE_LIST
              private var showExtensions = false

              private var copiedMediaItem: MediaItem? = null

              private val rawVideosList = mutableListOf<MediaItem>()
              private val rawAudioList = mutableListOf<MediaItem>()
              private val displayedList = mutableListOf<MediaItem>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showSystemBars()
                  setContentView(R.layout.activity_main)

                  prefs = getSharedPreferences("lion_player_prefs", Context.MODE_PRIVATE)
                  showExtensions = prefs.getBoolean("show_extensions", false)

                  toolbar = findViewById(R.id.topToolbar)
                  rvMedia = findViewById(R.id.rvMedia)
                  tvEmptyState = findViewById(R.id.tvEmptyState)
                  bottomNav = findViewById(R.id.bottomNavigation)

                  initMiniPlayer()

                  setSupportActionBar(toolbar)
                  setupRecyclerView()
                  setupBottomNav()

                  checkAndRequestPermissions()
              }

              private fun showSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let { controller ->
                          controller.show(
                              WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars()
                          )
                          controller.systemBarsBehavior = WindowInsetsController.BEHAVIOR_DEFAULT
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  }
                  window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
              }

              private fun initMiniPlayer() {
                  miniPlayerLayout = findViewById(R.id.miniPlayerLayout)
                  ivMiniThumb = findViewById(R.id.ivMiniThumb)
                  tvMiniTitle = findViewById(R.id.tvMiniTitle)
                  tvMiniSub = findViewById(R.id.tvMiniSub)
                  btnMiniPrev = findViewById(R.id.btnMiniPrev)
                  btnMiniPlayPause = findViewById(R.id.btnMiniPlayPause)
                  btnMiniNext = findViewById(R.id.btnMiniNext)
                  btnMiniClose = findViewById(R.id.btnMiniClose)

                  findViewById<View>(R.id.miniPlayerInfo).setOnClickListener { openPlayerFromMini() }
                  ivMiniThumb.setOnClickListener { openPlayerFromMini() }

                  btnMiniPrev.setOnClickListener { LionPlayerManager.playPrevious(this) }
                  btnMiniPlayPause.setOnClickListener { LionPlayerManager.togglePlayPause(this) }
                  btnMiniNext.setOnClickListener { LionPlayerManager.playNext(this) }
                  btnMiniClose.setOnClickListener {
                      LionPlayerManager.stop(this)
                      miniPlayerLayout.visibility = View.GONE
                  }
              }

              private fun openPlayerFromMini() {
                  val current = LionPlayerManager.getCurrentItem() ?: return
                  val playlist = LionPlayerManager.playlist
                  val index = LionPlayerManager.currentIndex
                  val intent = Intent(this, PlayerActivity::class.java).apply {
                      putExtra("PLAYLIST", playlist)
                      putExtra("CURRENT_INDEX", index)
                  }
                  startActivity(intent)
              }

              private fun updateMiniPlayerUI() {
                  val current = LionPlayerManager.getCurrentItem()
                  val player = LionPlayerManager.player
                  if (current != null && player != null) {
                      miniPlayerLayout.visibility = View.VISIBLE
                      tvMiniTitle.text = current.title
                      val subText = if (current.isVideo) "فيديو • ${current.parentFolder}" else "صوتيات • ${current.artist}"
                      tvMiniSub.text = subText
                      ThumbnailLoader.load(ivMiniThumb, current)

                      val isPlaying = player.isPlaying
                      btnMiniPlayPause.setImageResource(if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play)
                  } else {
                      miniPlayerLayout.visibility = View.GONE
                  }
              }

              private fun setupRecyclerView() {
                  mediaAdapter = MediaAdapter(
                      displayedList,
                      viewStyle,
                      showExtensions,
                      onItemClick = { item ->
                          if (item.isFolder) {
                              currentSelectedFolder = item.title
                              refreshListDisplay()
                          } else {
                              val playlist = ArrayList(displayedList.filter { !it.isFolder })
                              val index = playlist.indexOfFirst { it.id == item.id }.coerceAtLeast(0)
                              val intent = Intent(this, PlayerActivity::class.java).apply {
                                  putExtra("PLAYLIST", playlist)
                                  putExtra("CURRENT_INDEX", index)
                              }
                              startActivity(intent)
                          }
                      },
                      onItemLongClick = { item -> showItemActionDialog(item) },
                      onMoreOptionsClick = { item, _ -> showItemActionDialog(item) }
                  )
                  applyLayoutManager()
                  rvMedia.adapter = mediaAdapter

                  var lastScaleTriggerTime = 0L
                  scaleGestureDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(detector: ScaleGestureDetector): Boolean {
                          val now = System.currentTimeMillis()
                          if (now - lastScaleTriggerTime < 350) return false

                          val factor = detector.scaleFactor
                          if (factor > 1.15f) {
                              lastScaleTriggerTime = now
                              zoomIn()
                              return true
                          } else if (factor < 0.85f) {
                              lastScaleTriggerTime = now
                              zoomOut()
                              return true
                          }
                          return false
                      }
                  })

                  rvMedia.setOnTouchListener { _, event ->
                      scaleGestureDetector.onTouchEvent(event)
                      false
                  }
              }

              private fun showItemActionDialog(item: MediaItem) {
                  val favoriteTitle = if (item.isFavorite) "إلغاء التفضيل" else "تفضيل"
                  val options = arrayOf(
                      "تحديد",
                      favoriteTitle,
                      "نسخ",
                      "لصق",
                      "إعادة تسمية",
                      "مشاركة",
                      "خصائص",
                      "حذف"
                  )

                  AlertDialog.Builder(this)
                      .setTitle(item.title)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> Toast.makeText(this, "تم تحديد: ${item.title}", Toast.LENGTH_SHORT).show()
                              1 -> toggleFavorite(item)
                              2 -> {
                                  copiedMediaItem = item
                                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                  val clip = ClipData.newPlainText("Media Path", item.path.ifEmpty { item.uri })
                                  clipboard.setPrimaryClip(clip)
                                  Toast.makeText(this, "تم نسخ مسار المقطع إلى الحافظة", Toast.LENGTH_SHORT).show()
                              }
                              3 -> {
                                  if (copiedMediaItem != null) {
                                      Toast.makeText(this, "تم لصق بيانات: ${copiedMediaItem?.title}", Toast.LENGTH_SHORT).show()
                                  } else {
                                      Toast.makeText(this, "لا يوجد مقطع منسوخ حالياً", Toast.LENGTH_SHORT).show()
                                  }
                              }
                              4 -> showRenameDialog(item)
                              5 -> shareMediaItem(item)
                              6 -> showPropertiesDialog(item)
                              7 -> confirmDeleteMediaItem(item)
                          }
                      }
                      .show()
              }

              private fun toggleFavorite(item: MediaItem) {
                  val favSet = prefs.getStringSet("favorite_ids", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  val idStr = item.id.toString()
                  if (item.isFavorite) {
                      favSet.remove(idStr)
                      item.isFavorite = false
                      Toast.makeText(this, "تمت الإزالة من المفضلة", Toast.LENGTH_SHORT).show()
                  } else {
                      favSet.add(idStr)
                      item.isFavorite = true
                      Toast.makeText(this, "تمت الإضافة إلى المفضلة ❤️", Toast.LENGTH_SHORT).show()
                  }
                  prefs.edit().putStringSet("favorite_ids", favSet).apply()
                  refreshListDisplay()
              }

              private fun showRenameDialog(item: MediaItem) {
                  val input = EditText(this).apply {
                      setText(item.title)
                      setSelection(item.title.length)
                  }
                  AlertDialog.Builder(this)
                      .setTitle("إعادة تسمية")
                      .setView(input)
                      .setPositiveButton("حفظ") { _, _ ->
                          val newName = input.text.toString().trim()
                          if (newName.isNotEmpty()) {
                              item.title = newName
                              mediaAdapter.notifyDataSetChanged()
                              Toast.makeText(this, "تمت إعادة التسمية بنجاح", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun shareMediaItem(item: MediaItem) {
                  try {
                      val intent = Intent(Intent.ACTION_SEND).apply {
                          type = if (item.isVideo) "video/*" else "audio/*"
                          putExtra(Intent.EXTRA_STREAM, Uri.parse(item.uri))
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(intent, "مشاركة المقطع"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "تعذر مشاركة المقطع", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun showPropertiesDialog(item: MediaItem) {
                  val sdf = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.getDefault())
                  val dateStr = sdf.format(Date(item.dateAdded * 1000L))
                  val sizeMb = String.format(Locale.US, "%.2f MB", item.size / (1024.0 * 1024.0))
                  val durStr = LionPlayerManager.formatDuration(item.duration)

                  val message = """
                      الاسم: ${item.title}
                      المسار: ${item.path.ifEmpty { item.uri }}
                      النوع: ${if (item.isVideo) "فيديو" else "صوتيات"}
                      المجلد: ${item.parentFolder}
                      الألبوم: ${item.album}
                      الفنان: ${item.artist}
                      الحجم: $sizeMb
                      المدة: $durStr
                      تاريخ الإضافة: $dateStr
                  """.trimIndent()

                  AlertDialog.Builder(this)
                      .setTitle("خصائص المقطع")
                      .setMessage(message)
                      .setPositiveButton("إغلاق", null)
                      .show()
              }

              private fun confirmDeleteMediaItem(item: MediaItem) {
                  AlertDialog.Builder(this)
                      .setTitle("حذف المقطع")
                      .setMessage("هل أنت متأكد من رغبتك في حذف ${item.title}؟")
                      .setPositiveButton("حذف") { _, _ ->
                          try {
                              contentResolver.delete(Uri.parse(item.uri), null, null)
                          } catch (e: Exception) {}
                          rawVideosList.removeAll { it.id == item.id }
                          rawAudioList.removeAll { it.id == item.id }
                          refreshListDisplay()
                          Toast.makeText(this, "تم الحذف بنجاح", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun zoomIn() {
                  if (viewStyle == MediaAdapter.VIEW_MODE_GRID_SMALL) {
                      viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
                      applyLayoutManager()
                      mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  } else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) {
                      viewStyle = MediaAdapter.VIEW_MODE_LIST
                      applyLayoutManager()
                      mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  }
              }

              private fun zoomOut() {
                  if (viewStyle == MediaAdapter.VIEW_MODE_LIST) {
                      viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
                      applyLayoutManager()
                      mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  } else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) {
                      viewStyle = MediaAdapter.VIEW_MODE_GRID_SMALL
                      applyLayoutManager()
                      mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  }
              }

              private fun applyLayoutManager() {
                  when (viewStyle) {
                      MediaAdapter.VIEW_MODE_LIST -> rvMedia.layoutManager = LinearLayoutManager(this)
                      MediaAdapter.VIEW_MODE_GRID_LARGE -> rvMedia.layoutManager = GridLayoutManager(this, 2)
                      MediaAdapter.VIEW_MODE_GRID_SMALL -> rvMedia.layoutManager = GridLayoutManager(this, 3)
                  }
              }

              private fun setupBottomNav() {
                  bottomNav.setOnItemSelectedListener { menuItem ->
                      when (menuItem.itemId) {
                          R.id.nav_local -> {
                              currentTab = TAB_VIDEO
                              currentSelectedFolder = null
                              refreshListDisplay()
                              true
                          }
                          R.id.nav_music -> {
                              currentTab = TAB_AUDIO
                              currentSelectedFolder = null
                              refreshListDisplay()
                              true
                          }
                          R.id.nav_all -> {
                              currentTab = TAB_ALL
                              currentSelectedFolder = null
                              refreshListDisplay()
                              true
                          }
                          R.id.nav_favorites -> {
                              currentTab = TAB_FAVORITES
                              currentSelectedFolder = null
                              refreshListDisplay()
                              true
                          }
                          else -> false
                      }
                  }
              }

              private fun checkAndRequestPermissions() {
                  val permissionsNeeded = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.READ_MEDIA_VIDEO)
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.READ_MEDIA_AUDIO)
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                  }

                  if (permissionsNeeded.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, permissionsNeeded.toTypedArray(), PERMISSION_REQ_CODE)
                  } else {
                      loadMedia()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == PERMISSION_REQ_CODE) {
                      if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          loadMedia()
                      } else {
                          Toast.makeText(this, "يرجى منح صلاحيات الوسائط لتشغيل الملفات", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun loadMedia() {
                  loadVideos()
                  loadAudio()
                  refreshListDisplay()
              }

              private fun loadVideos() {
                  rawVideosList.clear()
                  val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
                  val uri = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(
                      MediaStore.Video.Media._ID,
                      MediaStore.Video.Media.TITLE,
                      MediaStore.Video.Media.DATA,
                      MediaStore.Video.Media.DURATION,
                      MediaStore.Video.Media.SIZE,
                      MediaStore.Video.Media.DATE_ADDED,
                      MediaStore.Video.Media.ARTIST,
                      MediaStore.Video.Media.ALBUM
                  )

                  try {
                      contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                          val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.TITLE)
                          val dataCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                          val durationCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                          val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                          val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED)
                          val artistCol = cursor.getColumnIndex(MediaStore.Video.Media.ARTIST)
                          val albumCol = cursor.getColumnIndex(MediaStore.Video.Media.ALBUM)

                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(idCol)
                              val title = cursor.getString(titleCol) ?: "فيديو غير معروف"
                              val path = cursor.getString(dataCol) ?: ""
                              val duration = cursor.getLong(durationCol)
                              val size = cursor.getLong(sizeCol)
                              val dateAdded = cursor.getLong(dateCol)
                              val artist = if (artistCol != -1) cursor.getString(artistCol) ?: "فيديو" else "فيديو"
                              val album = if (albumCol != -1) cursor.getString(albumCol) ?: "فيديو" else "فيديو"
                              val contentUri = ContentUris.withAppendedId(uri, id).toString()
                              val folderName = try {
                                  val parent = File(path).parentFile?.name
                                  if (!parent.isNullOrEmpty()) parent else "الرئيسي"
                              } catch (e: Exception) {
                                  "الرئيسي"
                              }
                              val isFav = favSet.contains(id.toString())

                              rawVideosList.add(
                                  MediaItem(
                                      id, title, contentUri, duration, size, dateAdded, true,
                                      folderName, false, 0, artist, album, isFav, path
                                  )
                              )
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun loadAudio() {
                  rawAudioList.clear()
                  val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
                  val uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.TITLE,
                      MediaStore.Audio.Media.DATA,
                      MediaStore.Audio.Media.DURATION,
                      MediaStore.Audio.Media.SIZE,
                      MediaStore.Audio.Media.DATE_ADDED,
                      MediaStore.Audio.Media.ARTIST,
                      MediaStore.Audio.Media.ALBUM
                  )

                  try {
                      contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val dataCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DATA)
                          val durationCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                          val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.SIZE)
                          val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DATE_ADDED)
                          val artistCol = cursor.getColumnIndex(MediaStore.Audio.Media.ARTIST)
                          val albumCol = cursor.getColumnIndex(MediaStore.Audio.Media.ALBUM)

                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(idCol)
                              val title = cursor.getString(titleCol) ?: "صوت غير معروف"
                              val path = cursor.getString(dataCol) ?: ""
                              val duration = cursor.getLong(durationCol)
                              val size = cursor.getLong(sizeCol)
                              val dateAdded = cursor.getLong(dateCol)
                              val artist = if (artistCol != -1) cursor.getString(artistCol) ?: "فنان غير معروف" else "فنان غير معروف"
                              val album = if (albumCol != -1) cursor.getString(albumCol) ?: "ألبوم غير محدد" else "ألبوم غير محدد"
                              val contentUri = ContentUris.withAppendedId(uri, id).toString()
                              val folderName = try {
                                  val parent = File(path).parentFile?.name
                                  if (!parent.isNullOrEmpty()) parent else "الرئيسي"
                              } catch (e: Exception) {
                                  "الرئيسي"
                              }
                              val isFav = favSet.contains(id.toString())

                              rawAudioList.add(
                                  MediaItem(
                                      id, title, contentUri, duration, size, dateAdded, false,
                                      folderName, false, 0, artist, album, isFav, path
                                  )
                              )
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun refreshListDisplay() {
                  displayedList.clear()

                  when (currentTab) {
                      TAB_VIDEO -> {
                          if (isVideoFolderMode && currentSelectedFolder == null) {
                              toolbar.title = "مجلدات الفيديو"
                              val grouped = rawVideosList.groupBy { it.parentFolder }
                              for ((folderName, items) in grouped) {
                                  displayedList.add(
                                      MediaItem(
                                          id = folderName.hashCode().toLong(),
                                          title = folderName,
                                          uri = "",
                                          duration = 0,
                                          size = items.sumOf { it.size },
                                          dateAdded = items.maxOfOrNull { it.dateAdded } ?: 0,
                                          isVideo = true,
                                          parentFolder = folderName,
                                          isFolder = true,
                                          itemCount = items.size
                                      )
                                  )
                              }
                          } else if (isVideoFolderMode && currentSelectedFolder != null) {
                              toolbar.title = currentSelectedFolder
                              displayedList.addAll(rawVideosList.filter { it.parentFolder == currentSelectedFolder })
                          } else {
                              toolbar.title = "كافة الفيديوهات"
                              displayedList.addAll(rawVideosList)
                          }
                      }
                      TAB_AUDIO -> {
                          if (isAudioFolderMode && currentSelectedFolder == null) {
                              toolbar.title = "مجلدات الصوت"
                              val grouped = rawAudioList.groupBy { it.parentFolder }
                              for ((folderName, items) in grouped) {
                                  displayedList.add(
                                      MediaItem(
                                          id = folderName.hashCode().toLong(),
                                          title = folderName,
                                          uri = "",
                                          duration = 0,
                                          size = items.sumOf { it.size },
                                          dateAdded = items.maxOfOrNull { it.dateAdded } ?: 0,
                                          isVideo = false,
                                          parentFolder = folderName,
                                          isFolder = true,
                                          itemCount = items.size
                                      )
                                  )
                              }
                          } else if (isAudioFolderMode && currentSelectedFolder != null) {
                              toolbar.title = currentSelectedFolder
                              displayedList.addAll(rawAudioList.filter { it.parentFolder == currentSelectedFolder })
                          } else {
                              toolbar.title = "كافة الصوتيات"
                              displayedList.addAll(rawAudioList)
                          }
                      }
                      TAB_ALL -> {
                          toolbar.title = "جميع الملفات"
                          displayedList.addAll(rawVideosList)
                          displayedList.addAll(rawAudioList)
                      }
                      TAB_FAVORITES -> {
                          toolbar.title = "المفضلة"
                          val favVideos = rawVideosList.filter { it.isFavorite }
                          val favAudios = rawAudioList.filter { it.isFavorite }
                          displayedList.addAll(favVideos)
                          displayedList.addAll(favAudios)
                      }
                  }

                  applySorting()
                  mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                  tvEmptyState.visibility = if (displayedList.isEmpty()) View.VISIBLE else View.GONE
              }

              private fun applySorting() {
                  val comparator = when (sortBy) {
                      "name" -> compareBy<MediaItem> { it.title.lowercase() }
                      "date" -> compareBy { it.dateAdded }
                      "size" -> compareBy { it.size }
                      "duration" -> compareBy { it.duration }
                      else -> compareBy { it.title.lowercase() }
                  }
                  if (sortAsc) {
                      displayedList.sortWith(comparator)
                  } else {
                      displayedList.sortWith(comparator.reversed())
                  }
              }

              override fun onCreateOptionsMenu(menu: Menu?): Boolean {
                  menuInflater.inflate(R.menu.top_main_menu, menu)
                  val searchItem = menu?.findItem(R.id.action_search)
                  val searchView = searchItem?.actionView as? SearchView
                  searchView?.queryHint = "ابحث عن أي مقطع..."
                  searchView?.setOnQueryTextListener(object : SearchView.OnQueryTextListener {
                      override fun onQueryTextSubmit(query: String?): Boolean = false
                      override fun onQueryTextChange(newText: String?): Boolean {
                          filterSearch(newText.orEmpty())
                          return true
                      }
                  })

                  val extItem = menu?.findItem(R.id.action_toggle_extension)
                  extItem?.isChecked = showExtensions

                  return true
              }

              private fun filterSearch(query: String) {
                  val combined = mutableListOf<MediaItem>()
                  when (currentTab) {
                      TAB_VIDEO -> combined.addAll(rawVideosList)
                      TAB_AUDIO -> combined.addAll(rawAudioList)
                      TAB_ALL -> { combined.addAll(rawVideosList); combined.addAll(rawAudioList) }
                      TAB_FAVORITES -> {
                          combined.addAll(rawVideosList.filter { it.isFavorite })
                          combined.addAll(rawAudioList.filter { it.isFavorite })
                      }
                  }
                  val filtered = combined.filter { it.title.contains(query, ignoreCase = true) }
                  displayedList.clear()
                  displayedList.addAll(filtered)
                  applySorting()
                  mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
              }

              override fun onOptionsItemSelected(item: MenuItem): Boolean {
                  when (item.itemId) {
                      R.id.action_refresh -> {
                          Toast.makeText(this, "جاري تحديث المقاطع...", Toast.LENGTH_SHORT).show()
                          loadMedia()
                          return true
                      }
                      R.id.action_view_mode -> {
                          showViewStyleDialog()
                          return true
                      }
                      R.id.action_display_mode -> {
                          showDisplayModeDialog()
                          return true
                      }
                      R.id.action_sort -> {
                          showSortByDialog()
                          return true
                      }
                      R.id.action_order -> {
                          showOrderDialog()
                          return true
                      }
                      R.id.action_toggle_extension -> {
                          showExtensions = !showExtensions
                          item.isChecked = showExtensions
                          prefs.edit().putBoolean("show_extensions", showExtensions).apply()
                          mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                          val msg = if (showExtensions) "تم تفعيل إظهار الامتدادات" else "تم إخفاء الامتدادات"
                          Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                          return true
                      }
                  }
                  return super.onOptionsItemSelected(item)
              }

              private fun showViewStyleDialog() {
                  val styles = arrayOf("قائمة (List)", "مصغرات كبيرة (Grid 2)", "مصغرات صغيرة (Grid 3)")
                  AlertDialog.Builder(this)
                      .setTitle("أسلوب العرض")
                      .setSingleChoiceItems(styles, viewStyle) { dialog, which ->
                          viewStyle = which
                          applyLayoutManager()
                          mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
                          dialog.dismiss()
                      }
                      .show()
              }

              private fun showDisplayModeDialog() {
                  val isCurrentlyFolder = if (currentTab == TAB_VIDEO) isVideoFolderMode else isAudioFolderMode
                  val currentSelection = if (isCurrentlyFolder) 0 else 1
                  val options = arrayOf("عرض كمجلدات", "عرض كافة الملفات")
                  AlertDialog.Builder(this)
                      .setTitle("طريقة العرض")
                      .setSingleChoiceItems(options, currentSelection) { dialog, which ->
                          val setFolder = (which == 0)
                          if (currentTab == TAB_VIDEO) isVideoFolderMode = setFolder else isAudioFolderMode = setFolder
                          currentSelectedFolder = null
                          refreshListDisplay()
                          dialog.dismiss()
                      }
                      .show()
              }

              private fun showSortByDialog() {
                  val options = arrayOf("الاسم", "تاريخ الإضافة", "الحجم", "المدة")
                  val current = when (sortBy) {
                      "name" -> 0
                      "date" -> 1
                      "size" -> 2
                      "duration" -> 3
                      else -> 0
                  }
                  AlertDialog.Builder(this)
                      .setTitle("فرز حسب")
                      .setSingleChoiceItems(options, current) { dialog, which ->
                          sortBy = when (which) {
                              0 -> "name"
                              1 -> "date"
                              2 -> "size"
                              3 -> "duration"
                              else -> "name"
                          }
                          refreshListDisplay()
                          dialog.dismiss()
                      }
                      .show()
              }

              private fun showOrderDialog() {
                  val options = arrayOf("تصاعدي", "تنازلي")
                  val current = if (sortAsc) 0 else 1
                  AlertDialog.Builder(this)
                      .setTitle("ترتيب")
                      .setSingleChoiceItems(options, current) { dialog, which ->
                          sortAsc = (which == 0)
                          refreshListDisplay()
                          dialog.dismiss()
                      }
                      .show()
              }

              override fun onStart() {
                  super.onStart()
                  updateMiniPlayerUI()
                  LionPlayerManager.onTrackChanged = { runOnUiThread { updateMiniPlayerUI() } }
                  LionPlayerManager.onPlaybackStateChanged = { runOnUiThread { updateMiniPlayerUI() } }
              }

              override fun onResume() {
                  super.onResume()
                  showSystemBars()
                  updateMiniPlayerUI()
              }

              override fun onBackPressed() {
                  if (currentSelectedFolder != null) {
                      currentSelectedFolder = null
                      refreshListDisplay()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
