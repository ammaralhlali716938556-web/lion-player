          /**
           * أدوات Scoped Storage (Android 10–15) و SAF DocumentFile.
           * أُضيفت دالتا [insertFileToMediaStore] و[copyFileToSafTree] لخدمة
           * \"استعادة الملفات من الخزينة السرية إلى مجلد عام في الهاتف\".
           */
          object StorageHelper {

              /** مجلد الاستعادة العام الذي تُرجَع إليه ملفات الخزينة */
              const val VAULT_RESTORE_FOLDER = \"LionVault\"

              fun buildDeleteIntentSenderRequest(context: Context, items: List<MediaItem>): IntentSenderRequest? {
                  if (items.isEmpty()) return null
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      val uris = items.map { Uri.parse(it.uri) }
                      val pi = MediaStore.createDeleteRequest(context.contentResolver, uris)
                      return IntentSenderRequest.Builder(pi.intentSender).build()
                  }
                  return null
              }

              fun buildWriteIntentSenderRequest(context: Context, items: List<MediaItem>): IntentSenderRequest? {
                  if (items.isEmpty()) return null
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      val uris = items.map { Uri.parse(it.uri) }
                      val pi = MediaStore.createWriteRequest(context.contentResolver, uris)
                      return IntentSenderRequest.Builder(pi.intentSender).build()
                  }
                  return null
              }

              suspend fun renameMediaItem(context: Context, item: MediaItem, newName: String): Boolean =
                  withContext(Dispatchers.IO) {
                      try {
                          val values = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, newName)
                          }
                          val rows = context.contentResolver.update(Uri.parse(item.uri), values, null, null)
                          if (rows > 0) return@withContext true

                          if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q && item.path.isNotEmpty()) {
                              val oldFile = File(item.path)
                              val newFile = File(oldFile.parentFile, newName)
                              if (oldFile.renameTo(newFile)) return@withContext true
                          }
                          false
                      } catch (e: Exception) {
                          false
                      }
                  }

              suspend fun performLegacyDelete(context: Context, items: List<MediaItem>): Int =
                  withContext(Dispatchers.IO) {
                      var count = 0
                      for (item in items) {
                          try {
                              if (item.path.isNotEmpty()) File(item.path).delete()
                              context.contentResolver.delete(Uri.parse(item.uri), null, null)
                              count++
                          } catch (e: Exception) {
                              // تجاهل مقصود
                          }
                      }
                      count
                  }

              suspend fun copyItemToMediaStore(
                  context: Context,
                  item: MediaItem,
                  targetRelativeFolder: String
              ): Uri? = withContext(Dispatchers.IO) {
                  try {
                      val resolver = context.contentResolver
                      val isVideo = item.isVideo
                      val collectionUri = collectionFor(context, isVideo)

                      val fileName = if (item.path.isNotEmpty()) File(item.path).name else item.title
                      val mimeType = if (isVideo) \"video/*\" else \"audio/*\"
                      val relativeDir = if (isVideo) \"Movies/$targetRelativeFolder\" else \"Music/$targetRelativeFolder\"

                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                          put(MediaStore.MediaColumns.MIME_TYPE, mimeType)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(MediaStore.MediaColumns.RELATIVE_PATH, relativeDir)
                              put(MediaStore.MediaColumns.IS_PENDING, 1)
                          }
                      }

                      val newUri = resolver.insert(collectionUri, values) ?: return@withContext null

                      resolver.openInputStream(Uri.parse(item.uri))?.use { input ->
                          resolver.openOutputStream(newUri)?.use { output -> input.copyTo(output) }
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          values.clear()
                          values.put(MediaStore.MediaColumns.IS_PENDING, 0)
                          resolver.update(newUri, values, null, null)
                      }
                      newUri
                  } catch (e: Exception) {
                      null
                  }
              }

              suspend fun copyItemToSafTree(
                  context: Context,
                  item: MediaItem,
                  treeUri: Uri
              ): Uri? = withContext(Dispatchers.IO) {
                  try {
                      val pickedDir = DocumentFile.fromTreeUri(context, treeUri) ?: return@withContext null
                      val mime = if (item.isVideo) \"video/*\" else \"audio/*\"
                      val name = if (item.path.isNotEmpty()) File(item.path).name else item.title
                      val newFileDoc = pickedDir.createFile(mime, name) ?: return@withContext null

                      context.contentResolver.openInputStream(Uri.parse(item.uri))?.use { input ->
                          context.contentResolver.openOutputStream(newFileDoc.uri)?.use { output ->
                              input.copyTo(output)
                          }
                      }
                      newFileDoc.uri
                  } catch (e: Exception) {
                      null
                  }
              }

              // =========================================================================
              //  أدوات استعادة ملفات \"الخزينة السرية\"
              // =========================================================================

              /**
               * إدخال ملف مفكوك التشفير إلى MediaStore العام:
               * Movies/LionVault للفيديو أو Music/LionVault للصوت.
               * يدعم Android 10+ عبر RELATIVE_PATH، والأجهزة الأقدم عبر DATA.
               */
              fun insertFileToMediaStore(
                  context: Context,
                  sourceFile: File,
                  displayName: String,
                  isVideo: Boolean
              ): Uri? {
                  if (!sourceFile.exists()) return null
                  return try {
                      val resolver = context.contentResolver
                      val collectionUri = collectionFor(context, isVideo)
                      val mimeType = guessMimeType(displayName, isVideo)

                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, sanitize(displayName))
                          put(MediaStore.MediaColumns.MIME_TYPE, mimeType)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              val dir = if (isVideo) \"Movies/$VAULT_RESTORE_FOLDER\" else \"Music/$VAULT_RESTORE_FOLDER\"
                              put(MediaStore.MediaColumns.RELATIVE_PATH, dir)
                              put(MediaStore.MediaColumns.IS_PENDING, 1)
                          }
                      }

                      val newUri = resolver.insert(collectionUri, values) ?: return null

                      resolver.openOutputStream(newUri)?.use { output ->
                          sourceFile.inputStream().use { input -> input.copyTo(output) }
                      } ?: run {
                          resolver.delete(newUri, null, null)
                          return null
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          values.clear()
                          values.put(MediaStore.MediaColumns.IS_PENDING, 0)
                          resolver.update(newUri, values, null, null)
                      } else {
                          // Android 9 وأقل: نسخ مباشر إلى المسار العام
                          val publicDir = if (isVideo) {
                              android.os.Environment.getExternalStoragePublicDirectory(
                                  android.os.Environment.DIRECTORY_MOVIES
                              )
                          } else {
                              android.os.Environment.getExternalStoragePublicDirectory(
                                  android.os.Environment.DIRECTORY_MUSIC
                              )
                          }
                          val target = File(publicDir, VAULT_RESTORE_FOLDER)
                          if (!target.exists()) target.mkdirs()
                          val outFile = File(target, sanitize(displayName))
                          sourceFile.inputStream().use { input ->
                              outFile.outputStream().use { output -> input.copyTo(output) }
                          }
                          val legacyValues = ContentValues().apply {
                              put(MediaStore.MediaColumns.DATA, outFile.absolutePath)
                              put(MediaStore.MediaColumns.DISPLAY_NAME, sanitize(displayName))
                              put(MediaStore.MediaColumns.MIME_TYPE, mimeType)
                          }
                          resolver.update(newUri, legacyValues, null, null)
                      }
                      newUri
                  } catch (e: Exception) {
                      null
                  }
              }

              /** نسخ ملف مفكوك التشفير إلى مجلد SAF اختاره المستخدم (بطاقة SD مثلاً) */
              fun copyFileToSafTree(
                  context: Context,
                  sourceFile: File,
                  treeUri: Uri,
                  isVideo: Boolean
              ): Uri? {
                  if (!sourceFile.exists()) return null
                  return try {
                      val pickedDir = DocumentFile.fromTreeUri(context, treeUri) ?: return null
                      val mime = guessMimeType(sourceFile.name, isVideo)
                      val newFileDoc = pickedDir.createFile(mime, sanitize(sourceFile.name)) ?: return null
                      context.contentResolver.openOutputStream(newFileDoc.uri)?.use { output ->
                          sourceFile.inputStream().use { input -> input.copyTo(output) }
                      } ?: return null
                      newFileDoc.uri
                  } catch (e: Exception) {
                      null
                  }
              }

              /** Intent مشاركة آمن (لا يُستخدم مع ملفات الخزينة) */
              fun buildShareIntent(context: Context, item: MediaItem): Intent {
                  return Intent(Intent.ACTION_SEND).apply {
                      type = if (item.isVideo) \"video/*\" else \"audio/*\"
                      putExtra(Intent.EXTRA_STREAM, Uri.parse(item.uri))
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
              }

              private fun collectionFor(context: Context, isVideo: Boolean): Uri {
                  return if (isVideo) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                      } else {
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                      }
                  } else {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          MediaStore.Audio.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                      } else {
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                      }
                  }
              }

              private fun guessMimeType(name: String, isVideo: Boolean): String {
                  val ext = name.substringAfterLast('.', \"\").lowercase()
                  val map = mapOf(
                      \"mp4\" to \"video/mp4\", \"mkv\" to \"video/x-matroska\", \"webm\" to \"video/webm\",
                      \"avi\" to \"video/x-msvideo\", \"mov\" to \"video/quicktime\", \"3gp\" to \"video/3gpp\",
                      \"ts\" to \"video/mp2t\", \"m4v\" to \"video/x-m4v\",
                      \"mp3\" to \"audio/mpeg\", \"m4a\" to \"audio/mp4\", \"aac\" to \"audio/aac\",
                      \"flac\" to \"audio/flac\", \"wav\" to \"audio/wav\", \"ogg\" to \"audio/ogg\",
                      \"opus\" to \"audio/opus\", \"wma\" to \"audio/x-ms-wma\"
                  )
                  return map[ext] ?: if (isVideo) \"video/*\" else \"audio/*\"
              }

              private fun sanitize(name: String): String =
                  name.replace(Regex(\"[\\\\\\\\/:*?\\\"<>|]\"), \"_\").ifEmpty { \"media_file\" }
          }
          """)

          # ---------------- app/src/main/java/com/lionplayer/app/vault/BiometricVaultHelper.kt ----------------
          add('app/src/main/java/com/lionplayer/app/vault/BiometricVaultHelper.kt',
          """\
          package com.lionplayer.app.vault

          import android.content.Context
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import androidx.fragment.app.FragmentActivity

          /**
           * ============================================================================
           *  المصادقة البيومترية للخزينة عبر androidx.biometric:biometric
           * ----------------------------------------------------------------------------
           *  • BIOMETRIC_STRONG  : بصمة إصبع (أو قزحية) مصنّفة Class 3.
           *  • DEVICE_CREDENTIAL : رمز قفل الجهاز كبديل عند فشل البصمة.
           *  • إن لم يكن للجهاز مستشعر بصمة، يُخفى زر البصمة ويُعتمد رمز PIN فقط.
           * ============================================================================
           */
          object BiometricVaultHelper {

              /** هل الجهاز يدعم مصادقة بيومترية قوية؟ */
              fun isBiometricHardwareAvailable(context: Context): Boolean {
                  val manager = BiometricManager.from(context)
                  return manager.canAuthenticate(
                      BiometricManager.Authenticators.BIOMETRIC_STRONG or
                          BiometricManager.Authenticators.DEVICE_CREDENTIAL
                  ) == BiometricManager.BIOMETRIC_SUCCESS
              }

              fun biometricStatus(context: Context): Int =
                  BiometricManager.from(context).canAuthenticate(
                      BiometricManager.Authenticators.BIOMETRIC_STRONG or
                          BiometricManager.Authenticators.DEVICE_CREDENTIAL
                  )

              /**
               * يُظهر نافذة المصادقة البيومترية.
               * @param onSuccess يُستدعى عند نجاح المصادقة (يُفتح القفل).
               * @param onError   يُستدعى عند الخطأ مع رسالة قابلة للعرض.
               * @param onFallback يُستدعى عند اختيار المستخدم \"استخدام رمز PIN\".
               */
              fun prompt(
                  activity: FragmentActivity,
                  title: String,
                  subtitle: String,
                  negativeButtonText: String,
                  onSuccess: () -> Unit,
                  onError: (String) -> Unit,
                  onFallback: () -> Unit = {}
              ) {
                  if (!isBiometricHardwareAvailable(activity)) {
                      onError(\"المصادقة البيومترية غير متاحة على هذا الجهاز — استخدم رمز PIN\")
                      onFallback()
                      return
                  }

                  val executor = ContextCompat.getMainExecutor(activity)

                  val callback = object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                          super.onAuthenticationSucceeded(result)
                          // نجاح المصادقة = فتح جلسة الخزينة
                          VaultSession.unlock()
                          onSuccess()
                      }

                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                          super.onAuthenticationError(errorCode, errString)
                          when (errorCode) {
                              BiometricPrompt.ERROR_NEGATIVE_BUTTON,
                              BiometricPrompt.ERROR_USER_CANCELED,
                              BiometricPrompt.ERROR_CANCELED -> onFallback()

                              BiometricPrompt.ERROR_LOCKOUT,
                              BiometricPrompt.ERROR_LOCKOUT_PERMANENT ->
                                  onError(\"تم قفل المستشعر مؤقتاً — استخدم رمز PIN ثم أعد المحاولة\")

                              BiometricPrompt.ERROR_NO_BIOMETRICS,
                              BiometricPrompt.ERROR_HW_NOT_PRESENT -> {
                                  onError(\"لا توجد بصمة مسجّلة على الجهاز — استخدم رمز PIN\")
                                  onFallback()
                              }

                              else -> onError(errString.toString())
                          }
                      }

                      override fun onAuthenticationFailed() {
                          super.onAuthenticationFailed()
                          onError(\"لم يتم التعرّف على البصمة — أعد المحاولة\")
                      }
                  }

                  val biometricPrompt = BiometricPrompt(activity, executor, callback)

                  val promptInfo = BiometricPrompt.PromptInfo.Builder()
                      .setTitle(title)
                      .setSubtitle(subtitle)
                      .setAllowedAuthenticators(
                          BiometricManager.Authenticators.BIOMETRIC_STRONG or
                              BiometricManager.Authenticators.DEVICE_CREDENTIAL
                      )
                      .setConfirmationRequired(false)
                      .build()

                  // ملاحظة: عند استخدام DEVICE_CREDENTIAL لا يُسمح بزر سلبي (Negative Button)
                  runCatching { biometricPrompt.authenticate(promptInfo) }
                      .onFailure {
                          // بعض الأجهزة ترفض DEVICE_CREDENTIAL معاً، نعيد المحاولة بالبصمة فقط + زر PIN
                          val fallbackInfo = BiometricPrompt.PromptInfo.Builder()
                              .setTitle(title)
                              .setSubtitle(subtitle)
                              .setNegativeButtonText(negativeButtonText)
                              .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG)
                              .setConfirmationRequired(false)
                              .build()
                          runCatching { biometricPrompt.authenticate(fallbackInfo) }
                              .onFailure { onFallback() }
                      }
              }
          }
          """)

          # ---------------- app/src/main/java/com/lionplayer/app/vault/VaultActivity.kt ----------------
          add('app/src/main/java/com/lionplayer/app/vault/VaultActivity.kt',
          """\
          package com.lionplayer.app.vault

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.PopupMenu
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.google.android.material.appbar.MaterialToolbar
          import com.google.android.material.floatingactionbutton.ExtendedFloatingActionButton
          import com.lionplayer.app.R
          import com.lionplayer.app.model.MediaItem
          import com.lionplayer.app.player.LionPlayerManager
          import com.lionplayer.app.ui.PlayerActivity
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          /**
           * ============================================================================
           *  شاشة الخزينة السرية (داخل القفل)
           * ----------------------------------------------------------------------------
           *  • FLAG_SECURE: منع لقطات الشاشة وتسجيل الشاشة.
           *  • عرض الملفات المشفّرة + تشغيلها بعد فك تشفير مؤقت داخل الذاكرة المعزولة.
           *  • زر \"استعادة إلى الذاكرة\": يفك التشفير ويعيد الملف إلى مجلد عام في الهاتف
           *    (Movies/LionVault أو Music/LionVault) أو إلى مجلد SAF يختاره المستخدم.
           *  • إعادة القفل تمسح كل النسخ المفكوكة وتُنهي أي تشغيل.
           * ============================================================================
           */
          class VaultActivity : AppCompatActivity() {

              private lateinit var rvFiles: RecyclerView
              private lateinit var emptyState: LinearLayout
              private lateinit var progressBar: ProgressBar
              private lateinit var tvCount: TextView
              private lateinit var tvStorage: TextView
              private lateinit var toolbar: MaterialToolbar

              private lateinit var adapter: VaultAdapter

              private var pendingRestoreItem: VaultFileItem? = null

              /** منتقي ملفات عام (SAF) لإضافة ملفات من خارج MediaStore */
              private val pickFilesLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenMultipleDocuments()
              ) { uris ->
                  if (!uris.isNullOrEmpty()) encryptPickedUris(uris)
              }

              /** منتقي مجلد SAF للاستعادة */
              private val safTreeLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocumentTree()
              ) { treeUri ->
                  if (treeUri != null) {
                      val flags = Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      runCatching { contentResolver.takePersistableUriPermission(treeUri, flags) }
                      pendingRestoreItem?.let { restoreToSaf(it, treeUri) }
                      pendingRestoreItem = null
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // ===== حماية الشاشة داخل قسم الخزينة =====
                  applySecureFlag()

                  setContentView(R.layout.activity_vault)

                  toolbar = findViewById(R.id.vaultToolbar)
                  rvFiles = findViewById(R.id.rvVaultFiles)
                  emptyState = findViewById(R.id.vaultEmptyState)
                  progressBar = findViewById(R.id.vaultProgress)
                  tvCount = findViewById(R.id.tvVaultFilesCount)
                  tvStorage = findViewById(R.id.tvVaultStorageInfo)

                  toolbar.setNavigationOnClickListener { finish() }
                  toolbar.setOnMenuItemClickListener { onMenuItem(it.itemId) }

                  adapter = VaultAdapter(
                      items = emptyList(),
                      onPlay = { playVaultItem(it) },
                      onRestore = { askRestoreDestination(it) },
                      onDelete = { confirmDelete(it) },
                      onMore = { item, anchor -> showItemMenu(item, anchor) }
                  )
                  rvFiles.layoutManager = LinearLayoutManager(this)
                  rvFiles.adapter = adapter

                  findViewById<ExtendedFloatingActionButton>(R.id.fabAddToVault)
                      .setOnClickListener { openFilePicker() }

                  VaultSecurityManager.getAutoLockMinutes(this)

                  if (intent.getBooleanExtra(EXTRA_OPEN_PICKER, false)) {
                      intent.removeExtra(EXTRA_OPEN_PICKER)
                      rvFiles.post { openFilePicker() }
                  }
              }

              private fun applySecureFlag() {
                  if (VaultSecurityManager.isSecureWindowEnabled(this)) {
                      window.setFlags(
                          WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE
                      )
                  } else {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                  }
              }

              override fun onStart() {
                  super.onStart()
                  // أي وصول بدون جلسة مفتوحة يُرجع المستخدم إلى شاشة القفل
                  if (!VaultSession.isUnlocked) {
                      startActivity(Intent(this, VaultLockActivity::class.java))
                      finish()
                      return
                  }
                  VaultSession.touch()
                  refreshList()
              }

              override fun onResume() {
                  super.onResume()
                  VaultSession.touch()
              }

              // =========================================================================
              //  القائمة
              // =========================================================================

              private fun refreshList() {
                  val items = VaultManager.listVaultFiles(this)
                  adapter.submit(items)
                  emptyState.visibility = if (items.isEmpty()) View.VISIBLE else View.GONE
                  rvFiles.visibility = if (items.isEmpty()) View.GONE else View.VISIBLE
                  tvCount.text = \"${getString(R.string.vault_files_count)}: ${items.size}\"
                  tvStorage.text = \"الحجم المشفّر: ${VaultManager.formatSize(VaultManager.totalVaultSize(this))}  •  \" +
                      \"قفل تلقائي بعد ${VaultSession.autoLockMinutes} دقيقة\"
              }

              private fun setLoading(loading: Boolean) {
                  progressBar.visibility = if (loading) View.VISIBLE else View.GONE
                  rvFiles.alpha = if (loading) 0.4f else 1f
              }

              // =========================================================================
              //  إضافة ملفات جديدة إلى الخزينة
              // =========================================================================

              private fun openFilePicker() {
                  runCatching {
                      pickFilesLauncher.launch(arrayOf(\"video/*\", \"audio/*\"))
                  }.onFailure {
                      Toast.makeText(this, \"تعذّر فتح منتقي الملفات\", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun encryptPickedUris(uris: List<Uri>) {
                  setLoading(true)
                  lifecycleScope.launch {
                      var success = 0
                      var failure = 0
                      for (uri in uris) {
                          val isVideo = guessIsVideo(uri)
                          when (val result = VaultManager.lockFromUri(this@VaultActivity, uri, isVideo)) {
                              is VaultResult.Success -> success++
                              is VaultResult.Failure -> {
                                  failure++
                                  if (failure == 1) toast(result.message)
                              }
                          }
                      }
                      setLoading(false)
                      refreshList()
                      toast(\"تم تشفير $success ملف داخل الخزينة\" + if (failure > 0) \" — فشل $failure\" else \"\")
                  }
              }

              private fun guessIsVideo(uri: Uri): Boolean {
                  val type = runCatching { contentResolver.getType(uri) }.getOrNull()
                  if (type != null) return type.startsWith(\"video\", ignoreCase = true)
                  val name = uri.lastPathSegment.orEmpty().lowercase()
                  return VIDEO_EXTENSIONS.any { name.endsWith(\".$it\") }
              }

              // =========================================================================
              //  التشغيل الآمن داخل التطبيق
              // =========================================================================

              private fun playVaultItem(item: VaultFileItem) {
                  VaultSession.touch()
                  setLoading(true)
                  lifecycleScope.launch {
                      when (val result = VaultManager.decryptToCache(this@VaultActivity, item.id)) {
                          is VaultResult.Success -> {
                              setLoading(false)
                              val file = result.value
                              val mediaItem = MediaItem(
                                  id = VaultManager.vaultIdToMediaId(item.id),
                                  title = item.displayName,
                                  uri = Uri.fromFile(file).toString(),
                                  duration = 0L,
                                  size = item.sizeBytes,
                                  dateAdded = item.addedAt / 1000L,
                                  isVideo = item.isVideo,
                                  parentFolder = VaultManager.VAULT_FOLDER_LABEL,
                                  artist = \"الخزينة السرية\",
                                  album = \"ملف مشفّر\",
                                  path = file.absolutePath
                              )
                              val playlist = ArrayList(listOf(mediaItem))
                              val intent = Intent(this@VaultActivity, PlayerActivity::class.java).apply {
                                  putExtra(\"PLAYLIST\", playlist)
                                  putExtra(\"CURRENT_INDEX\", 0)
                                  putExtra(PlayerActivity.EXTRA_FROM_VAULT, true)
                              }
                              startActivity(intent)
                          }
                          is VaultResult.Failure -> {
                              setLoading(false)
                              toast(result.message)
                          }
                      }
                  }
              }

              // =========================================================================
              //  إلغاء القفل / الاستعادة إلى مجلد عام
              // =========================================================================

              private fun askRestoreDestination(item: VaultFileItem) {
                  val options = arrayOf(
                      if (item.isVideo) \"استعادة إلى Movies/LionVault\" else \"استعادة إلى Music/LionVault\",
                      \"استعادة إلى مجلد أختاره (SAF / بطاقة SD)\"
                  )
                  AlertDialog.Builder(this, R.style.VaultTheme)
                      .setTitle(R.string.vault_restore)
                      .setMessage(\"سيُفك تشفير \\\"${item.displayName}\\\" ويُحفظ في ذاكرة الهاتف العامة.\\n\" +
                          \"هل تريد إبقاء نسخة داخل الخزينة؟\")
                      .setItems(options) { _, which ->
                          if (which == 0) restoreToMediaStore(item)
                          else {
                              pendingRestoreItem = item
                              runCatching { safTreeLauncher.launch(null) }
                                  .onFailure { toast(\"تعذّر فتح منتقي المجلدات\") }
                          }
                      }
                      .setNegativeButton(\"إلغاء\", null)
                      .show()
              }

              private fun restoreToMediaStore(item: VaultFileItem) {
                  setLoading(true)
                  lifecycleScope.launch {
                      when (val result = VaultManager.restoreToPublicStorage(
                          context = this@VaultActivity,
                          id = item.id,
                          removeFromVault = true
                      )) {
                          is VaultResult.Success -> {
                              setLoading(false)
                              refreshList()
                              toast(\"تمت استعادة \\\"${item.displayName}\\\" إلى ذاكرة الهاتف ✔\")
                          }
                          is VaultResult.Failure -> {
                              setLoading(false)
                              toast(result.message)
                          }
                      }
                  }
              }

              private fun restoreToSaf(item: VaultFileItem, treeUri: Uri) {
                  setLoading(true)
                  lifecycleScope.launch {
                      when (val result = VaultManager.restoreToSafTree(
                          context = this@VaultActivity,
                          id = item.id,
                          treeUri = treeUri,
                          removeFromVault = true
                      )) {
                          is VaultResult.Success -> {
                              setLoading(false)
                              refreshList()
                              toast(\"تمت الاستعادة إلى المجلد المحدد ✔\")
                          }
                          is VaultResult.Failure -> {
                              setLoading(false)
                              toast(result.message)
                          }
                      }
                  }
              }

              private fun restoreAll() {
                  val items = VaultManager.listVaultFiles(this)
                  if (items.isEmpty()) {
                      toast(\"لا توجد ملفات داخل الخزينة\")
                      return
                  }
                  AlertDialog.Builder(this, R.style.VaultTheme)
                      .setTitle(R.string.vault_restore)
                      .setMessage(\"سيتم فك تشفير ${items.size} ملف وإعادتها إلى ذاكرة الهاتف ثم حذفها من الخزينة. المتابعة؟\")
                      .setPositiveButton(\"استعادة الكل\") { _, _ ->
                          setLoading(true)
                          lifecycleScope.launch {
                              var ok = 0
                              for (item in items) {
                                  val result = VaultManager.restoreToPublicStorage(
                                      this@VaultActivity, item.id, true
                                  )
                                  if (result is VaultResult.Success) ok++
                              }
                              setLoading(false)
                              refreshList()
                              toast(\"تمت استعادة $ok ملف بنجاح\")
                          }
                      }
                      .setNegativeButton(\"إلغاء\", null)
                      .show()
              }

              // =========================================================================
              //  الحذف وإعادة القفل وإدارة الرمز
              // =========================================================================

              private fun confirmDelete(item: VaultFileItem) {
                  AlertDialog.Builder(this, R.style.VaultTheme)
                      .setTitle(R.string.vault_delete)
                      .setMessage(\"سيُحذف \\\"${item.displayName}\\\" نهائياً من الخزينة (الملف مشفّر ولا يمكن استعادته).\")
                      .setPositiveButton(\"حذف نهائي\") { _, _ ->
                          VaultManager.deleteVaultFile(this, item.id)
                          refreshList()
                          toast(\"تم الحذف من الخزينة\")
                      }
                      .setNegativeButton(\"إلغاء\", null)
                      .show()
              }

              private fun showItemMenu(item: VaultFileItem, anchor: View) {
                  val menu = PopupMenu(this, anchor)
                  menu.menu.add(0, 1, 0, \"تشغيل داخل التطبيق\")
                  menu.menu.add(0, 2, 1, getString(R.string.vault_restore))
                  menu.menu.add(0, 3, 2, \"خصائص الملف\")
                  menu.menu.add(0, 4, 3, getString(R.string.vault_delete))
                  menu.setOnMenuItemClickListener { menuItem ->
                      when (menuItem.itemId) {
                          1 -> playVaultItem(item)
                          2 -> askRestoreDestination(item)
                          3 -> showProperties(item)
                          4 -> confirmDelete(item)
                      }
                      true
                  }
                  menu.show()
              }

              private fun showProperties(item: VaultFileItem) {
                  val message = \"\"\"
                      الاسم: ${item.displayName}
                      النوع: ${if (item.isVideo) \"فيديو\" else \"صوتيات\"}
                      الحجم: ${VaultManager.formatSize(item.sizeBytes)}
                      الملف المشفّر: ${item.encryptedFileName}
                      المجلد الأصلي: ${item.originalFolder}
                      التشفير: AES-256-GCM-HKDF-4KB (Tink)
                      المجلد المعزول: ${VaultManager.vaultPath(this)}
                      .nomedia: ${if (java.io.File(VaultManager.vaultDir(this), \".nomedia\").exists()) \"موجود ✔\" else \"غير موجود\"}
                  \"\"\".trimIndent()

                  AlertDialog.Builder(this, R.style.VaultTheme)
                      .setTitle(\"خصائص الملف المشفّر\")
                      .setMessage(message)
                      .setPositiveButton(\"إغلاق\", null)
                      .show()
              }

              private fun onMenuItem(itemId: Int): Boolean {
                  when (itemId) {
                      R.id.action_vault_add -> openFilePicker()
                      R.id.action_vault_relock -> relock()
                      R.id.action_vault_change_pin -> showChangePinDialog()
                      R.id.action_vault_auto_lock -> showAutoLockDialog()
                      R.id.action_vault_restore_all -> restoreAll()
                      else -> return false
                  }
                  return true
              }

              private fun showChangePinDialog() {
                  val oldPin = android.widget.EditText(this).apply {
                      hint = \"رمز PIN الحالي\"
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER or
                          android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      setPadding(48, 32, 48, 32)
                  }
                  val newPin = android.widget.EditText(this).apply {
                      hint = getString(R.string.vault_new_pin)
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER or
                          android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      setPadding(48, 32, 48, 32)
                  }
                  val confirm = android.widget.EditText(this).apply {
                      hint = getString(R.string.vault_confirm_pin)
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER or
                          android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      setPadding(48, 32, 48, 32)
                  }
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 12, 24, 12)
                      addView(oldPin); addView(newPin); addView(confirm)
                  }

                  AlertDialog.Builder(this, R.style.VaultTheme)
                      .setTitle(R.string.vault_change_pin)
                      .setView(container)
                      .setPositiveButton(\"حفظ\") { _, _ ->
                          val o = oldPin.text?.toString().orEmpty()
                          val n = newPin.text?.toString().orEmpty()
                          val c = confirm.text?.toString().orEmpty()
                          if (n.length !in VaultSecurityManager.MIN_PIN_LENGTH..VaultSecurityManager.MAX_PIN_LENGTH) {
                              toast(\"رمز PIN يجب أن يكون من ${VaultSecurityManager.MIN_PIN_LENGTH} إلى ${VaultSecurityManager.MAX_PIN_LENGTH} أرقام\")
                              return@setPositiveButton
                          }
                          if (n != c) {
                              toast(\"رمزا PIN غير متطابقين\")
                              return@setPositiveButton
                          }
                          when (val result = VaultSecurityManager.changePin(this, o, n)) {
                              is VaultResult.Success -> toast(\"تم تغيير رمز PIN بنجاح ✔\")
                              is VaultResult.Failure -> toast(result.message)
                          }
                      }
                      .setNegativeButton(\"إلغاء\", null)
                      .show()
              }

              private fun showAutoLockDialog() {
                  val labels = arrayOf(\"دقيقة واحدة\", \"5 دقائق\", \"10 دقائق\", \"30 دقيقة\", \"60 دقيقة\")
                  val values = intArrayOf(1, 5, 10, 30, 60)
                  val current = values.indexOf(VaultSession.autoLockMinutes).coerceAtLeast(1)
                  AlertDialog.Builder(this, R.style.VaultTheme)
                      .setTitle(R.string.vault_auto_lock)
                      .setSingleChoiceItems(labels, current) { dialog, which ->
                          VaultSecurityManager.setAutoLockMinutes(this, values[which])
                          refreshList()
                          toast(\"القفل التلقائي بعد ${labels[which]}\")
                          dialog.dismiss()
                      }
                      .setNegativeButton(\"إلغاء\", null)
                      .show()
              }

              private fun relock() {
                  VaultManager.lockVault(this)
                  toast(\"تم إعادة قفل الخزينة 🔒\")
                  startActivity(Intent(this, VaultLockActivity::class.java))
                  finish()
              }

              @Deprecated(\"Deprecated in Java\")
              override fun onBackPressed() {
                  // الخروج من الخزينة = إعادة قفلها ومسح النسخ المفكوكة
                  relock()
              }

              private fun toast(message: String) =
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show()

              companion object {
                  const val EXTRA_OPEN_PICKER = \"extra_open_picker\"

                  private val VIDEO_EXTENSIONS = listOf(
                      \"mp4\", \"mkv\", \"webm\", \"avi\", \"mov\", \"3gp\", \"ts\", \"m4v\", \"flv\", \"wmv\"
                  )
              }
          }
          """)

          # ---------------- app/src/main/java/com/lionplayer/app/vault/VaultAdapter.kt ----------------
          add('app/src/main/java/com/lionplayer/app/vault/VaultAdapter.kt',
          """\
          package com.lionplayer.app.vault

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageButton
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import com.lionplayer.app.R
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * قائمة الملفات المشفّرة داخل الخزينة.
           * لا تُعرض أي مصغّرة حقيقية هنا (لا يوجد فك تشفير للتصفح) — فقط أيقونة نوع الملف.
           */
          class VaultAdapter(
              private var items: List<VaultFileItem>,
              private val onPlay: (VaultFileItem) -> Unit,
              private val onRestore: (VaultFileItem) -> Unit,
              private val onDelete: (VaultFileItem) -> Unit,
              private val onMore: (VaultFileItem, View) -> Unit
          ) : RecyclerView.Adapter<VaultAdapter.VaultViewHolder>() {

              fun submit(newItems: List<VaultFileItem>) {
                  items = newItems
                  notifyDataSetChanged()
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VaultViewHolder {
                  val view = LayoutInflater.from(parent.context)
                      .inflate(R.layout.item_vault_file, parent, false)
                  return VaultViewHolder(view)
              }

              override fun getItemCount(): Int = items.size

              override fun onBindViewHolder(holder: VaultViewHolder, position: Int) {
                  holder.bind(items[position])
              }

              inner class VaultViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
                  private val ivType: ImageView = itemView.findViewById(R.id.ivVaultItemType)
                  private val tvName: TextView = itemView.findViewById(R.id.tvVaultItemName)
                  private val tvInfo: TextView = itemView.findViewById(R.id.tvVaultItemInfo)
                  private val btnPlay: TextView = itemView.findViewById(R.id.btnVaultItemPlay)
                  private val btnRestore: TextView = itemView.findViewById(R.id.btnVaultItemRestore)
                  private val btnDelete: TextView = itemView.findViewById(R.id.btnVaultItemDelete)
                  private val btnMore: ImageButton = itemView.findViewById(R.id.btnVaultItemMore)

                  private val dateFormat = SimpleDateFormat(\"yyyy/MM/dd  HH:mm\", Locale.getDefault())

                  fun bind(item: VaultFileItem) {
                      ivType.setImageResource(if (item.isVideo) R.drawable.ic_video else R.drawable.ic_music_note)
                      tvName.text = item.displayName

                      val date = if (item.addedAt > 0) dateFormat.format(Date(item.addedAt)) else \"-\"
                      tvInfo.text = \"🔐 ${VaultManager.formatSize(item.sizeBytes)}  •  $date  •  من: ${item.originalFolder}\"

                      btnPlay.setOnClickListener { onPlay(item) }
                      btnRestore.setOnClickListener { onRestore(item) }
                      btnDelete.setOnClickListener { onDelete(item) }
                      btnMore.setOnClickListener { v -> onMore(item, v) }
                      itemView.setOnClickListener { onPlay(item) }
                  }
              }
          }
          """)

          # ---------------- app/src/main/java/com/lionplayer/app/vault/VaultLockActivity.kt ----------------
          add('app/src/main/java/com/lionplayer/app/vault/VaultLockActivity.kt',
          """\
          package com.lionplayer.app.vault

          import android.content.Intent
          import android.os.Bundle
          import android.os.CountDownTimer
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.View
          import android.view.WindowManager
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.core.content.ContextCompat
          import androidx.fragment.app.FragmentActivity
          import com.lionplayer.app.R

          /**
           * ============================================================================
           *  بوابة الدخول إلى الخزينة السرية
           * ----------------------------------------------------------------------------
           *  • رمز PIN (4–8 أرقام) أو مصادقة بيومترية عبر androidx.biometric.
           *  • استعادة عبر سؤال أمان محلي (إجابته مخزّنة كمشتق PBKDF2).
           *  • FLAG_SECURE: لا لقطات شاشة ولا تسجيل شاشة ولا ظهور في قائمة التطبيقات الحديثة.
           *  • تجميد 30 ثانية بعد 5 محاولات خاطئة.
           * ============================================================================
           */
          class VaultLockActivity : FragmentActivity() {

              private lateinit var etPin: EditText
              private lateinit var tvMessage: TextView
              private lateinit var tvTitle: TextView
              private lateinit var tvSubtitle: TextView
              private lateinit var pinDots: LinearLayout
              private lateinit var btnUnlock: View
              private lateinit var btnBiometric: View
              private lateinit var btnForgot: View

              private var lockoutTimer: CountDownTimer? = null
              private var isVerifying = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // ===== حماية الشاشة: منع لقطة الشاشة/تسجيل الشاشة داخل الخزينة =====
                  applySecureFlag()

                  setContentView(R.layout.activity_vault_lock)

                  etPin = findViewById(R.id.etPin)
                  tvMessage = findViewById(R.id.tvLockMessage)
                  tvTitle = findViewById(R.id.tvLockTitle)
                  tvSubtitle = findViewById(R.id.tvLockSubtitle)
                  pinDots = findViewById(R.id.pinDotsContainer)
                  btnUnlock = findViewById(R.id.btnUnlock)
                  btnBiometric = findViewById(R.id.btnBiometric)
                  btnForgot = findViewById(R.id.btnForgotPin)

                  // إن لم تُفعَّل الخزينة بعد -> شاشة الإعداد
                  if (!VaultSecurityManager.isVaultEnabled(this)) {
                      startActivity(Intent(this, VaultSetupActivity::class.java))
                      finish()
                      return
                  }

                  VaultSecurityManager.getAutoLockMinutes(this)

                  btnUnlock.setOnClickListener { attemptUnlock() }
                  btnForgot.setOnClickListener { showRecoveryFlow() }
                  findViewById<View>(R.id.btnCancelLock).setOnClickListener { cancelAndExit() }

                  // إظهار زر البصمة فقط عند توفر عتاد مدعوم وتفعيل المستخدم له
                  val biometricAvailable = VaultSecurityManager.isBiometricEnabled(this) &&
                      BiometricVaultHelper.isBiometricHardwareAvailable(this)
                  btnBiometric.visibility = if (biometricAvailable) View.VISIBLE else View.GONE
                  btnBiometric.setOnClickListener { startBiometricPrompt() }

                  buildPinDots(VaultSecurityManager.MIN_PIN_LENGTH)

                  etPin.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          val text = s?.toString().orEmpty()
                          updatePinDots(text.length)
                          if (text.length >= VaultSecurityManager.MIN_PIN_LENGTH && !isVerifying) {
                              attemptUnlock()
                          }
                      }
                  })
              }

              private fun applySecureFlag() {
                  if (VaultSecurityManager.isSecureWindowEnabled(this)) {
                      window.setFlags(
                          WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE
                      )
                  } else {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                  }
              }

              override fun onStart() {
                  super.onStart()
                  if (!VaultSecurityManager.isVaultEnabled(this)) {
                      startActivity(Intent(this, VaultSetupActivity::class.java))
                      finish()
                      return
                  }
                  refreshLockoutState()
                  // فتح تلقائي بالبصمة عند الدخول
                  if (VaultSecurityManager.isBiometricEnabled(this) &&
                      BiometricVaultHelper.isBiometricHardwareAvailable(this)
                  ) {
                      startBiometricPrompt()
                  }
              }

              override fun onStop() {
                  super.onStop()
                  lockoutTimer?.cancel()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  lockoutTimer?.cancel()
                  lockoutTimer = null
              }

              // =========================================================================
              //  مؤشرات PIN
              // =========================================================================

              private fun buildPinDots(count: Int) {
                  pinDots.removeAllViews()
                  val size = (16 * resources.displayMetrics.density).toInt()
                  val margin = (8 * resources.displayMetrics.density).toInt()
                  for (i in 0 until VaultSecurityManager.MAX_PIN_LENGTH) {
                      val dot = ImageView(this).apply {
                          layoutParams = LinearLayout.LayoutParams(size, size).apply {
                              marginStart = margin
                              marginEnd = margin
                          }
                          setImageResource(R.drawable.bg_vault_pin_dot)
                      }
                      pinDots.addView(dot)
                  }
                  updatePinDots(0)
              }

              private fun updatePinDots(filled: Int) {
                  for (i in 0 until pinDots.childCount) {
                      val child = pinDots.getChildAt(i) as? ImageView ?: continue
                      val visible = i < VaultSecurityManager.MAX_PIN_LENGTH
                      child.visibility = if (visible) View.VISIBLE else View.GONE
                      child.setImageResource(
                          if (i < filled) R.drawable.bg_vault_pin_dot_filled else R.drawable.bg_vault_pin_dot
                      )
                  }
              }

              // =========================================================================
              //  فتح القفل
              // =========================================================================

              private fun attemptUnlock() {
                  if (isVerifying) return
                  val pin = etPin.text?.toString().orEmpty()
                  if (pin.length < VaultSecurityManager.MIN_PIN_LENGTH) {
                      showMessage(\"أدخل رمز PIN من ${VaultSecurityManager.MIN_PIN_LENGTH} إلى ${VaultSecurityManager.MAX_PIN_LENGTH} أرقام\", true)
                      return
                  }
                  val lockout = VaultSecurityManager.lockoutRemainingMs(this)
                  if (lockout > 0L) {
                      startLockoutCountdown(lockout)
                      return
                  }

                  isVerifying = true
                  when (val result = VaultSecurityManager.verifyPin(this, pin)) {
                      is VaultResult.Success -> onUnlocked()
                      is VaultResult.Failure -> {
                          isVerifying = false
                          etPin.setText(\"\")
                          updatePinDots(0)
                          showMessage(result.message, true)
                          shakePinField()
                          refreshLockoutState()
                      }
                  }
              }

              private fun onUnlocked() {
                  isVerifying = false
                  etPin.setText(\"\")
                  showMessage(\"\", false)
                  Toast.makeText(this, \"تم فتح الخزينة السرية 🔓\", Toast.LENGTH_SHORT).show()
                  startActivity(Intent(this, VaultActivity::class.java))
                  finish()
              }

              private fun shakePinField() {
                  etPin.animate()
                      .translationX(18f).setDuration(60)
                      .withEndAction {
                          etPin.animate().translationX(-18f).setDuration(60)
                              .withEndAction { etPin.animate().translationX(0f).setDuration(60).start() }
                              .start()
                      }
                      .start()
              }

              // =========================================================================
              //  المصادقة البيومترية
              // =========================================================================

              private fun startBiometricPrompt() {
                  BiometricVaultHelper.prompt(
                      activity = this,
                      title = getString(R.string.vault_biometric_title),
                      subtitle = getString(R.string.vault_biometric_subtitle),
                      negativeButtonText = getString(R.string.vault_biometric_negative),
                      onSuccess = { onUnlocked() },
                      onError = { msg -> showMessage(msg, true) },
                      onFallback = { etPin.requestFocus() }
                  )
              }

              // =========================================================================
              //  الاستعادة عند نسيان الرمز (سؤال أمان محلي)
              // =========================================================================

              private fun showRecoveryFlow() {
                  val question = VaultSecurityManager.getSecurityQuestion(this)

                  val answerInput = EditText(this).apply {
                      hint = \"إجابة سؤال الأمان\"
                      setPadding(48, 32, 48, 32)
                  }

                  AlertDialog.Builder(this, R.style.VaultTheme)
                      .setTitle(R.string.vault_recovery_title)
                      .setMessage(\"$question\\n\\n${getString(R.string.vault_recovery_subtitle)}\")
                      .setView(answerInput)
                      .setPositiveButton(\"تحقق\") { _, _ ->
                          verifyAnswerAndReset(answerInput.text?.toString().orEmpty())
                      }
                      .setNegativeButton(\"إلغاء\", null)
                      .show()
              }

              private fun verifyAnswerAndReset(answer: String) {
                  if (answer.isBlank()) {
                      showMessage(\"أدخل إجابة سؤال الأمان\", true)
                      return
                  }
                  // تحقق أولي باستخدام رمز فارغ غير صالح: نستخدم دالة مخصصة أدناه
                  val newPinInput = EditText(this).apply {
                      hint = getString(R.string.vault_new_pin)
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER or
                          android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      setPadding(48, 32, 48, 32)
                  }

                  // نؤجل كتابة الرمز الجديد حتى يتم التحقق من الإجابة (يتم داخل resetPinWithSecurityAnswer)
                  val confirmInput = EditText(this).apply {
                      hint = getString(R.string.vault_confirm_pin)
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER or
                          android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      setPadding(48, 32, 48, 32)
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 12, 24, 12)
                      addView(newPinInput)
                      addView(confirmInput)
                  }

                  // التحقق من الإجابة أولاً (باستخدام رمز مؤقت مكوّن من 4 أصفار لن يُحفظ إن فشلت الإجابة)
                  val probe = VaultSecurityManager.verifySecurityAnswer(this, answer)
                  if (!probe) {
                      showMessage(\"إجابة سؤال الأمان غير صحيحة\", true)
                      return
                  }

                  AlertDialog.Builder(this, R.style.VaultTheme)
                      .setTitle(R.string.vault_new_pin)
                      .setMessage(\"تم التحقق من إجابة سؤال الأمان ✔ — عيّن رمز PIN جديداً\")
                      .setView(container)
                      .setPositiveButton(R.string.vault_reset_pin) { _, _ ->
                          val pin = newPinInput.text?.toString().orEmpty()
                          val confirm = confirmInput.text?.toString().orEmpty()
                          if (!isValidPin(pin)) {
                              showMessage(\"رمز PIN يجب أن يكون من ${VaultSecurityManager.MIN_PIN_LENGTH} إلى ${VaultSecurityManager.MAX_PIN_LENGTH} أرقام\", true)
                              return@setPositiveButton
                          }
                          if (pin != confirm) {
                              showMessage(\"رمزا PIN غير متطابقين\", true)
                              return@setPositiveButton
                          }
                          when (val result = VaultSecurityManager.resetPinWithSecurityAnswer(this, answer, pin)) {
                              is VaultResult.Success -> {
                                  showMessage(\"\", false)
                                  Toast.makeText(this, \"تم تعيين رمز PIN جديد بنجاح ✔\", Toast.LENGTH_LONG).show()
                                  onUnlocked()
                              }
                              is VaultResult.Failure -> showMessage(result.message, true)
                          }
                      }
                      .setNegativeButton(\"إلغاء\", null)
                      .show()
              }

              private fun isValidPin(pin: String): Boolean =
                  pin.length in VaultSecurityManager.MIN_PIN_LENGTH..VaultSecurityManager.MAX_PIN_LENGTH &&
                      pin.all { it.isDigit() }

              // =========================================================================
              //  التجميد المؤقت بعد المحاولات الفاشلة
              // =========================================================================

              private fun refreshLockoutState() {
                  val remaining = VaultSecurityManager.lockoutRemainingMs(this)
                  if (remaining > 0L) startLockoutCountdown(remaining)
                  else {
                      lockoutTimer?.cancel()
                      lockoutTimer = null
                      btnUnlock.isEnabled = true
                      etPin.isEnabled = true
                  }
              }

              private fun startLockoutCountdown(remainingMs: Long) {
                  lockoutTimer?.cancel()
                  btnUnlock.isEnabled = false
                  etPin.isEnabled = false
                  lockoutTimer = object : CountDownTimer(remainingMs, 1000L) {
                      override fun onTick(millisUntilFinished: Long) {
                          val seconds = (millisUntilFinished / 1000L) + 1
                          showMessage(\"محاولات كثيرة خاطئة — أعد المحاولة بعد $seconds ثانية\", true)
                      }

                      override fun onFinish() {
                          btnUnlock.isEnabled = true
                          etPin.isEnabled = true
                          showMessage(\"\", false)
                      }
                  }.start()
              }

              private fun showMessage(message: String, isError: Boolean) {
                  tvMessage.text = message
                  tvMessage.setTextColor(
                      ContextCompat.getColor(
                          this,
                          if (isError) R.color.vault_error else R.color.vault_accent
                      )
                  )
              }

              private fun cancelAndExit() {
                  VaultSession.lock()
                  finish()
              }

              @Deprecated(\"Deprecated in Java\")
              override fun onBackPressed() {
                  cancelAndExit()
              }
          }
          """)

