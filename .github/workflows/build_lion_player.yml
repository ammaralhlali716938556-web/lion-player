package com.lionplayer.app.util

import android.os.Handler
import android.os.Looper

object SleepTimer {
    private val handler = Handler(Looper.getMainLooper())
    private var sleepRunnable: Runnable? = null
    private var fadeRunnable: Runnable? = null

    var isRunning: Boolean = false
        private set

    fun startTimer(durationMinutes: Int, onFadeVolume: (Float) -> Unit, onStopPlayback: () -> Unit) {
        cancel()
        isRunning = true
        val totalMs = durationMinutes * 60 * 1000L
        val fadeStartMs = (totalMs - 60000L).coerceAtLeast(0L)

        fadeRunnable = Runnable {
            startFadeOut(onFadeVolume)
        }
        handler.postDelayed(fadeRunnable!!, fadeStartMs)

        sleepRunnable = Runnable {
            isRunning = false
            onStopPlayback()
        }
        handler.postDelayed(sleepRunnable!!, totalMs)
    }

    private fun startFadeOut(onFadeVolume: (Float) -> Unit) {
        val steps = 20
        val interval = 60000L / steps
        for (i in 1..steps) {
            handler.postDelayed({
                if (isRunning) {
                    val volumeFactor = 1.0f - (i.toFloat() / steps.toFloat())
                    onFadeVolume(volumeFactor)
                }
            }, i * interval)
        }
    }

    fun cancel() {
        isRunning = false
        sleepRunnable?.let { handler.removeCallbacks(it) }
        fadeRunnable?.let { handler.removeCallbacks(it) }
        sleepRunnable = null
        fadeRunnable = null
    }
}
