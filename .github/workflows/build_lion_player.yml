import android.widget.ImageView
import android.widget.TextView
import androidx.recyclerview.widget.RecyclerView
import coil.load
import coil.request.videoFrameMillis
import com.lionplayer.app.R
import com.lionplayer.app.model.MediaItem
import java.io.File
import java.util.Locale

class MediaAdapter(
    private var items: List<MediaItem>,
    private var viewMode: Int,
    private var showExtensions: Boolean,
    var isSelectionMode: Boolean = false,
    private val onItemClick: (MediaItem) -> Unit,
    private val onItemLongClick: (MediaItem) -> Unit,
    private val onMoreOptionsClick: (MediaItem, View) -> Unit
) : RecyclerView.Adapter<MediaAdapter.MediaViewHolder>() {

    companion object {
        const val VIEW_MODE_LIST = 0
        const val VIEW_MODE_GRID_LARGE = 1
        const val VIEW_MODE_GRID_SMALL = 2
    }

    fun updateData(newItems: List<MediaItem>, newViewMode: Int = viewMode, newShowExt: Boolean = showExtensions) {
        this.items = newItems
        this.viewMode = newViewMode
        this.showExtensions = newShowExt
        notifyDataSetChanged()
    }

    override fun getItemViewType(position: Int): Int = viewMode

    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): MediaViewHolder {
        val layoutId = if (viewType == VIEW_MODE_LIST) {
            R.layout.item_media_video
        } else {
            R.layout.item_media_grid
        }
        val view = LayoutInflater.from(parent.context).inflate(layoutId, parent, false)
        return MediaViewHolder(view)
    }

    override fun onBindViewHolder(holder: MediaViewHolder, position: Int) {
        holder.bind(items[position])
    }

    override fun getItemCount(): Int = items.size

    inner class MediaViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
        private val itemRootView: View? = itemView.findViewById(R.id.itemRootView)
        private val ivCheck: ImageView? = itemView.findViewById(R.id.ivCheck)
        private val ivThumbnail: ImageView = itemView.findViewById(R.id.ivThumbnail)
        private val tvTitle: TextView = itemView.findViewById(R.id.tvTitle)
        private val tvSubInfo: TextView = itemView.findViewById(R.id.tvSubInfo)
        private val tvDetails: TextView = itemView.findViewById(R.id.tvDetails)
        private val btnMore: ImageButton? = itemView.findViewById(R.id.btnMore)
        private val tvThumbDuration: TextView? = itemView.findViewById(R.id.tvThumbDuration)
        private val tvNewBadge: TextView? = itemView.findViewById(R.id.tvNewBadge)
        private val tvFolderNewCount: TextView? = itemView.findViewById(R.id.tvFolderNewCount)

        fun bind(item: MediaItem) {
            val ext = if (item.path.isNotEmpty()) File(item.path).extension else ""
            val displayTitle = if (item.isFolder) {
                item.title
            } else if (showExtensions) {
                if (item.title.contains(".") || ext.isEmpty()) item.title else "${item.title}.$ext"
            } else {
                item.title.substringBeforeLast('.')
            }
            tvTitle.text = displayTitle

            if (isSelectionMode && !item.isFolder) {
                ivCheck?.visibility = View.VISIBLE
                if (item.isSelected) {
                    ivCheck?.setImageResource(R.drawable.ic_check_circle)
                    itemRootView?.setBackgroundColor(Color.parseColor("#33FF9800"))
                } else {
                    ivCheck?.setImageResource(R.drawable.bg_thumb_round)
                    itemRootView?.setBackgroundColor(Color.TRANSPARENT)
                }
            } else {
                ivCheck?.visibility = View.GONE
                itemRootView?.setBackgroundColor(Color.TRANSPARENT)
            }

            // High-Performance Coil Thumbnail Engine
            if (item.isFolder) {
                ivThumbnail.setImageResource(R.drawable.ic_folder)
            } else if (item.isStream) {
                ivThumbnail.setImageResource(R.drawable.ic_stream)
            } else if (item.isVault) {
                ivThumbnail.setImageResource(R.drawable.ic_vault)
            } else if (item.isVideo) {
                val mediaUri = if (item.uri.isNotEmpty()) Uri.parse(item.uri) else Uri.fromFile(File(item.path))
                ivThumbnail.load(mediaUri) {
                    crossfade(true)
                    placeholder(R.drawable.ic_video)
                    error(R.drawable.ic_video)
                    videoFrameMillis(1000)
                }
            } else {
                val mediaUri = if (item.uri.isNotEmpty()) Uri.parse(item.uri) else Uri.fromFile(File(item.path))
                ivThumbnail.load(mediaUri) {
                    crossfade(true)
                    placeholder(R.drawable.ic_music_note)
                    error(R.drawable.ic_music_note)
                }
            }

            if (item.isFolder) {
                tvSubInfo.visibility = View.GONE
                tvDetails.text = "${item.itemCount} عناصر"
                btnMore?.visibility = View.GONE
                tvThumbDuration?.visibility = View.GONE
                tvNewBadge?.visibility = View.GONE

                if (item.newCount > 0) {
                    tvFolderNewCount?.visibility = View.VISIBLE
                    tvFolderNewCount?.text = if (item.newCount > 99) "99+" else item.newCount.toString()
                } else {
                    tvFolderNewCount?.visibility = View.GONE
                }
            } else {
                tvFolderNewCount?.visibility = View.GONE
                if (item.isNew && !(isSelectionMode && item.isSelected)) {
                    tvNewBadge?.visibility = View.VISIBLE
                } else {
                    tvNewBadge?.visibility = View.GONE
                }

                if (item.duration > 0) {
                    tvThumbDuration?.visibility = View.VISIBLE
                    tvThumbDuration?.text = formatDuration(item.duration)
                } else {
                    tvThumbDuration?.visibility = View.GONE
                }

                tvSubInfo.visibility = View.VISIBLE
                val albumStr = if (item.album.isNotEmpty() && item.album != "<unknown>") item.album else "ألبوم غير محدد"
                val artistStr = if (item.artist.isNotEmpty() && item.artist != "<unknown>") item.artist else "فنان غير معروف"
                tvSubInfo.text = "الألبوم: $albumStr • الفنان: $artistStr"

                val sizeFormatted = formatFileSize(item.size)
                val durationFormatted = formatDuration(item.duration)
                val favMark = if (item.isFavorite) " ❤️" else ""
                tvDetails.text = "$durationFormatted | $sizeFormatted$favMark"

                btnMore?.visibility = if (isSelectionMode) View.GONE else View.VISIBLE
                btnMore?.setOnClickListener { v -> onMoreOptionsClick(item, v) }
            }

            itemView.setOnClickListener { onItemClick(item) }
            itemView.setOnLongClickListener {
                if (!item.isFolder) {
                    onItemLongClick(item)
                    true
                } else false
            }
        }

        private fun formatFileSize(size: Long): String {
            if (size <= 0) return "0 MB"
            val mb = size / (1024.0 * 1024.0)
            return String.format(Locale.US, "%.1f MB", mb)
        }

        private fun formatDuration(durationMs: Long): String {
            val totalSec = durationMs / 1000
            val sec = totalSec % 60
            val min = (totalSec / 60) % 60
            val hrs = totalSec / 3600
            return if (hrs > 0) {
                String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
            } else {
                String.format(Locale.US, "%02d:%02d", min, sec)
            }
        }
    }
}
