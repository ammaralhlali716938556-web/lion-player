          cat << 'EOF_FILE_14' > app/src/main/java/com/lionplayer/app/player/LionPlayerManager.kt
          package com.lionplayer.app.player
          
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.widget.Toast
          import androidx.core.content.ContextCompat
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackParameters
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.SeekParameters
          import com.lionplayer.app.data.model.MediaItem as LionMediaItem
          import com.lionplayer.app.player.decoder.DecoderFactory
          import java.util.ArrayList
          
          object LionPlayerManager {
          
              const val CHANNEL_ID = "lion_playback_channel"
              const val NOTIFICATION_ID = 2024
          
              var player: ExoPlayer? = null
                  private set
          
              var effectsController: AudioEffectsController? = null
                  private set
          
              var playlist: ArrayList<LionMediaItem> = arrayListOf()
              var currentIndex: Int = 0
              var allowBackgroundPlayback: Boolean = false
              var bluetoothControlEnabled: Boolean = true
          
              var currentDecoderMode: String = DecoderFactory.MODE_HW
              var isRepeatMode: Boolean = false
          
              // A-B Looping Markers (in milliseconds)
              var markerA: Long? = null
              var markerB: Long? = null
              var isAbRepeatActive: Boolean = false
          
              var onTrackChanged: ((LionMediaItem) -> Unit)? = null
              var onPlaybackStateChanged: ((Boolean) -> Unit)? = null
          
              private val mainHandler = Handler(Looper.getMainLooper())
              private val abLoopRunnable = object : Runnable {
                  override fun run() {
                      val p = player
                      if (isAbRepeatActive && p != null && markerA != null && markerB != null) {
                          if (p.currentPosition >= markerB!!) {
                              p.seekTo(markerA!!)
                          }
                      }
                      if (isAbRepeatActive) {
                          mainHandler.postDelayed(this, 50)
                      }
                  }
              }
          
              fun attachPlayer(exoPlayer: ExoPlayer, context: Context) {
                  player = exoPlayer
                  effectsController = AudioEffectsController(context.applicationContext)
                  effectsController?.initialize(exoPlayer.audioSessionId)
              }
          
              fun getOrCreatePlayer(context: Context, mode: String = currentDecoderMode): ExoPlayer {
                  val appContext = context.applicationContext
                  if (player == null) {
                      currentDecoderMode = mode
                      val exo = ExoPlayer.Builder(appContext)
                          .setRenderersFactory(DecoderFactory.create(appContext, mode))
                          .setSeekParameters(SeekParameters.EXACT)
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(C.USAGE_MEDIA)
                                  .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                                  .build(),
                              true
                          )
                          .setWakeMode(C.WAKE_MODE_LOCAL)
                          .setHandleAudioBecomingNoisy(true)
                          .build()
          
                      attachPlayer(exo, appContext)
                      setupPlayerListeners(appContext, exo)
          
                      // Start Foreground MediaSessionService on API 26+
                      try {
                          val serviceIntent = Intent(appContext, LionMediaSessionService::class.java)
                          ContextCompat.startForegroundService(appContext, serviceIntent)
                      } catch (e: Exception) {}
                  }
                  return player!!
              }
          
              private fun setupPlayerListeners(context: Context, exo: ExoPlayer) {
                  exo.addListener(object : Player.Listener {
                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          onPlaybackStateChanged?.invoke(isPlaying)
                      }
          
                      override fun onPlaybackStateChanged(playbackState: Int) {
                          if (playbackState == Player.STATE_ENDED) {
                              if (isRepeatMode || exo.repeatMode == Player.REPEAT_MODE_ONE) {
                                  exo.seekTo(0L)
                                  exo.play()
                                  return
                              }
                              if (currentIndex < playlist.size - 1) {
                                  playNext(context)
                              } else {
                                  onPlaybackStateChanged?.invoke(false)
                              }
                          }
                      }
                  })
              }
          
              fun switchDecoder(context: Context, mode: String): ExoPlayer {
                  currentDecoderMode = mode
                  val p = player
                  val currentPos = p?.currentPosition ?: 0L
                  val wasPlaying = p?.isPlaying == true
                  val speed = p?.playbackParameters?.speed ?: 1.0f
          
                  p?.release()
                  player = null
                  effectsController?.release()
                  effectsController = null
          
                  val newPlayer = getOrCreatePlayer(context, mode)
                  newPlayer.playbackParameters = PlaybackParameters(speed)
          
                  val curItem = playlist.getOrNull(currentIndex)
                  if (curItem != null) {
                      val mediaItem = MediaItem.fromUri(Uri.parse(curItem.uri))
                      newPlayer.setMediaItem(mediaItem)
                      newPlayer.prepare()
                      newPlayer.seekTo(currentPos)
                      if (wasPlaying) newPlayer.play()
                  }
                  return newPlayer
              }
          
              fun toggleAbRepeat(currentPos: Long): String {
                  return if (markerA == null) {
                      markerA = currentPos
                      "تم تعيين النقطة A عند ${currentPos / 1000}s"
                  } else if (markerB == null && currentPos > markerA!!) {
                      markerB = currentPos
                      isAbRepeatActive = true
                      mainHandler.post(abLoopRunnable)
                      "تم تعيين النقطة B وتفعيل التكرار A-B"
                  } else {
                      clearAbRepeat()
                      "تم إلغاء تكرار A-B"
                  }
              }
          
              fun clearAbRepeat() {
                  markerA = null
                  markerB = null
                  isAbRepeatActive = false
                  mainHandler.removeCallbacks(abLoopRunnable)
              }
          
              fun playPlaylist(context: Context, list: ArrayList<LionMediaItem>, index: Int) {
                  playlist = list
                  currentIndex = index
                  playCurrentItem(context)
              }
          
              fun playCurrentItem(context: Context) {
                  val item = playlist.getOrNull(currentIndex) ?: return
                  val appContext = context.applicationContext
                  val p = getOrCreatePlayer(appContext)
          
                  if (!item.isVideo) {
                      allowBackgroundPlayback = true
                  }
          
                  val mediaItem = MediaItem.fromUri(Uri.parse(item.uri))
                  p.setMediaItem(mediaItem)
                  p.prepare()
                  p.play()
          
                  clearAbRepeat()
                  onTrackChanged?.invoke(item)
                  onPlaybackStateChanged?.invoke(true)
              }
          
              fun playNext(context: Context) {
                  if (currentIndex < playlist.size - 1) {
                      currentIndex++
                      playCurrentItem(context)
                  } else {
                      Toast.makeText(context.applicationContext, "هذا هو العنصر الأخير في القائمة", Toast.LENGTH_SHORT).show()
                  }
              }
          
              fun playPrevious(context: Context) {
                  if (currentIndex > 0) {
                      currentIndex--
                      playCurrentItem(context)
                  } else {
                      Toast.makeText(context.applicationContext, "هذا هو العنصر الأول في القائمة", Toast.LENGTH_SHORT).show()
                  }
              }
          
              fun togglePlayPause(context: Context) {
                  val p = player ?: return
                  if (p.isPlaying) {
                      p.pause()
                  } else {
                      p.play()
                  }
              }
          
              fun toggleRepeat(): Boolean {
                  isRepeatMode = !isRepeatMode
                  player?.repeatMode = if (isRepeatMode) Player.REPEAT_MODE_ONE else Player.REPEAT_MODE_OFF
                  return isRepeatMode
              }
          
              fun stop(context: Context) {
                  allowBackgroundPlayback = false
                  player?.stop()
                  onPlaybackStateChanged?.invoke(false)
              }
          
              fun getCurrentItem(): LionMediaItem? = playlist.getOrNull(currentIndex)
          }
