          import androidx.media3.exoplayer.SeekParameters
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService
          import com.lionplayer.app.R
          import com.lionplayer.app.player.decoder.DecoderFactory
          import com.lionplayer.app.receiver.NotificationReceiver
          import com.lionplayer.app.ui.PlayerActivity
          
          @UnstableApi
          class LionMediaSessionService : MediaSessionService() {
          
              private var player: ExoPlayer? = null
              private var mediaSession: MediaSession? = null
          
              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
          
                  val exo = ExoPlayer.Builder(this)
                      .setRenderersFactory(DecoderFactory.create(this, LionPlayerManager.currentDecoderMode))
                      .setSeekParameters(SeekParameters.EXACT)
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(C.USAGE_MEDIA)
                              .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                              .build(),
                          true
                      )
                      .setWakeMode(C.WAKE_MODE_LOCAL)
                      .setHandleAudioBecomingNoisy(true)
                      .build()
          
                  player = exo
          
                  mediaSession = MediaSession.Builder(this, exo)
                      .setId("LionMediaSession")
                      .build()
          
                  LionPlayerManager.attachPlayer(exo, this)
          
                  exo.addListener(object : Player.Listener {
                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          if (isPlaying) {
                              startForegroundPlaybackNotification()
                          } else if (!LionPlayerManager.allowBackgroundPlayback) {
                              stopForeground(STOP_FOREGROUND_DETACH)
                          }
                      }
                  })
              }
          
              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          LionPlayerManager.CHANNEL_ID,
                          "Lion Player Playback",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "Lion Player Media Playback Notification"
                          setShowBadge(false)
                          setSound(null, null)
                      }
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }
          
              private fun startForegroundPlaybackNotification() {
                  val currentItem = LionPlayerManager.getCurrentItem()
                  val title = currentItem?.title ?: "Lion Player"
                  val artist = currentItem?.artist ?: "جارٍ التشغيل"
          
                  val contentIntent = Intent(this, PlayerActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  } else PendingIntent.FLAG_UPDATE_CURRENT
          
                  val pendingContent = PendingIntent.getActivity(this, 0, contentIntent, flags)
          
                  val prevIntent = Intent(NotificationReceiver.ACTION_NOTIF_PREV).setPackage(packageName)
                  val prevPending = PendingIntent.getBroadcast(this, 1, prevIntent, flags)
          
                  val playPauseIntent = Intent(NotificationReceiver.ACTION_NOTIF_PLAY_PAUSE).setPackage(packageName)
                  val playPausePending = PendingIntent.getBroadcast(this, 2, playPauseIntent, flags)
          
                  val nextIntent = Intent(NotificationReceiver.ACTION_NOTIF_NEXT).setPackage(packageName)
                  val nextPending = PendingIntent.getBroadcast(this, 3, nextIntent, flags)
          
                  val closeIntent = Intent(NotificationReceiver.ACTION_NOTIF_CLOSE).setPackage(packageName)
                  val closePending = PendingIntent.getBroadcast(this, 4, closeIntent, flags)
          
                  val notification = NotificationCompat.Builder(this, LionPlayerManager.CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_lion_logo)
                      .setContentTitle(title)
                      .setContentText(artist)
                      .setContentIntent(pendingContent)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .addAction(R.drawable.ic_skip_previous, "السابق", prevPending)
                      .addAction(R.drawable.ic_pause, "إيقاف مؤقت", playPausePending)
                      .addAction(R.drawable.ic_skip_next, "التالي", nextPending)
                      .addAction(R.drawable.ic_close, "إغلاق", closePending)
                      .setStyle(
                          androidx.media.app.NotificationCompat.MediaStyle()
                              .setShowActionsInCompactView(0, 1, 2)
                      )
                      .build()
          
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          LionPlayerManager.NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK
                      )
                  } else {
                      startForeground(LionPlayerManager.NOTIFICATION_ID, notification)
                  }
              }
          
              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = mediaSession
          
              override fun onDestroy() {
                  mediaSession?.run {
                      player.release()
                      release()
                      mediaSession = null
                  }
                  player = null
                  super.onDestroy()
              }
          }
