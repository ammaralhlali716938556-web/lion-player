          # ---------------- app/src/main/res/layout/activity_vault.xml ----------------
          add('app/src/main/res/layout/activity_vault.xml',
          """\
          <?xml version=\"1.0\" encoding=\"utf-8\"?>
          <!-- Inside-vault screen: FLAG_SECURE is enabled in VaultActivity.onCreate() -->
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"
              xmlns:app=\"http://schemas.android.com/apk/res-auto\"
              android:layout_width=\"match_parent\"
              android:layout_height=\"match_parent\"
              android:background=\"@color/vault_background\">

              <com.google.android.material.appbar.MaterialToolbar
                  android:id=\"@+id/vaultToolbar\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"?attr/actionBarSize\"
                  android:background=\"@color/vault_surface\"
                  app:layout_constraintTop_toTopOf=\"parent\"
                  app:menu=\"@menu/vault_menu\"
                  app:navigationIcon=\"@drawable/ic_back\"
                  app:title=\"@string/vault_name\"
                  app:titleTextColor=\"@color/vault_text\" />

              <LinearLayout
                  android:id=\"@+id/vaultHeaderCard\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:layout_margin=\"12dp\"
                  android:background=\"@drawable/bg_vault_card\"
                  android:gravity=\"center_vertical\"
                  android:orientation=\"horizontal\"
                  android:padding=\"14dp\"
                  app:layout_constraintTop_toBottomOf=\"@id/vaultToolbar\">

                  <ImageView
                      android:layout_width=\"38dp\"
                      android:layout_height=\"38dp\"
                      android:contentDescription=\"@string/vault_name\"
                      android:src=\"@drawable/ic_shield\"
                      app:tint=\"@color/vault_accent\" />

                  <LinearLayout
                      android:layout_width=\"0dp\"
                      android:layout_height=\"wrap_content\"
                      android:layout_weight=\"1\"
                      android:orientation=\"vertical\"
                      android:paddingStart=\"12dp\"
                      android:paddingEnd=\"6dp\">

                      <TextView
                          android:id=\"@+id/tvVaultFilesCount\"
                          android:layout_width=\"match_parent\"
                          android:layout_height=\"wrap_content\"
                          android:textColor=\"@color/vault_text\"
                          android:textSize=\"14sp\"
                          android:textStyle=\"bold\" />

                      <TextView
                          android:id=\"@+id/tvVaultStorageInfo\"
                          android:layout_width=\"match_parent\"
                          android:layout_height=\"wrap_content\"
                          android:layout_marginTop=\"3dp\"
                          android:textColor=\"@color/vault_text_secondary\"
                          android:textSize=\"11sp\" />
                  </LinearLayout>

                  <TextView
                      android:id=\"@+id/tvVaultSecureBadge\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:background=\"@drawable/bg_vault_badge\"
                      android:text=\"AES-256-GCM\"
                      android:textColor=\"@color/vault_accent\"
                      android:textSize=\"10sp\" />
              </LinearLayout>

              <androidx.recyclerview.widget.RecyclerView
                  android:id=\"@+id/rvVaultFiles\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"0dp\"
                  android:clipToPadding=\"false\"
                  android:paddingStart=\"12dp\"
                  android:paddingEnd=\"12dp\"
                  android:paddingBottom=\"90dp\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintTop_toBottomOf=\"@id/vaultHeaderCard\" />

              <LinearLayout
                  android:id=\"@+id/vaultEmptyState\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:gravity=\"center\"
                  android:orientation=\"vertical\"
                  android:padding=\"32dp\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintTop_toBottomOf=\"@id/vaultHeaderCard\">

                  <ImageView
                      android:layout_width=\"72dp\"
                      android:layout_height=\"72dp\"
                      android:contentDescription=\"@string/vault_name\"
                      android:src=\"@drawable/ic_vault\"
                      app:tint=\"#3300E5A0\" />

                  <TextView
                      android:layout_width=\"match_parent\"
                      android:layout_height=\"wrap_content\"
                      android:layout_marginTop=\"12dp\"
                      android:gravity=\"center\"
                      android:text=\"@string/vault_empty\"
                      android:textColor=\"@color/vault_text_secondary\"
                      android:textSize=\"13sp\" />
              </LinearLayout>

              <ProgressBar
                  android:id=\"@+id/vaultProgress\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:indeterminateTint=\"@color/vault_accent\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toTopOf=\"parent\" />

              <com.google.android.material.floatingactionbutton.ExtendedFloatingActionButton
                  android:id=\"@+id/fabAddToVault\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:layout_margin=\"16dp\"
                  android:text=\"@string/vault_add_files\"
                  android:textColor=\"#06121C\"
                  app:backgroundTint=\"@color/vault_accent\"
                  app:icon=\"@drawable/ic_download\"
                  app:iconTint=\"#06121C\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintEnd_toEndOf=\"parent\" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          """)

          # ---------------- app/src/main/res/layout/activity_vault_lock.xml ----------------
          add('app/src/main/res/layout/activity_vault_lock.xml',
          """\
          <?xml version=\"1.0\" encoding=\"utf-8\"?>
          <!-- Secure Vault lock screen. FLAG_SECURE is applied in VaultLockActivity.onCreate() -->
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"
              xmlns:app=\"http://schemas.android.com/apk/res-auto\"
              android:id=\"@+id/vaultLockRoot\"
              android:layout_width=\"match_parent\"
              android:layout_height=\"match_parent\"
              android:background=\"@color/vault_background\">

              <ImageView
                  android:id=\"@+id/ivVaultIcon\"
                  android:layout_width=\"86dp\"
                  android:layout_height=\"86dp\"
                  android:layout_marginTop=\"64dp\"
                  android:contentDescription=\"@string/vault_name\"
                  android:src=\"@drawable/ic_shield\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toTopOf=\"parent\"
                  app:tint=\"@color/vault_accent\" />

              <TextView
                  android:id=\"@+id/tvLockTitle\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:layout_marginTop=\"18dp\"
                  android:gravity=\"center\"
                  android:paddingStart=\"24dp\"
                  android:paddingEnd=\"24dp\"
                  android:text=\"@string/vault_lock_title\"
                  android:textColor=\"@color/vault_text\"
                  android:textSize=\"20sp\"
                  android:textStyle=\"bold\"
                  app:layout_constraintTop_toBottomOf=\"@id/ivVaultIcon\" />

              <TextView
                  android:id=\"@+id/tvLockSubtitle\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:layout_marginTop=\"6dp\"
                  android:gravity=\"center\"
                  android:paddingStart=\"28dp\"
                  android:paddingEnd=\"28dp\"
                  android:text=\"@string/vault_lock_subtitle\"
                  android:textColor=\"@color/vault_text_secondary\"
                  android:textSize=\"13sp\"
                  app:layout_constraintTop_toBottomOf=\"@id/tvLockTitle\" />

              <!-- PIN dots are generated at runtime -->
              <LinearLayout
                  android:id=\"@+id/pinDotsContainer\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:layout_marginTop=\"28dp\"
                  android:gravity=\"center\"
                  android:orientation=\"horizontal\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toBottomOf=\"@id/tvLockSubtitle\" />

              <EditText
                  android:id=\"@+id/etPin\"
                  android:layout_width=\"220dp\"
                  android:layout_height=\"wrap_content\"
                  android:layout_marginTop=\"18dp\"
                  android:background=\"@drawable/bg_vault_input\"
                  android:cursorVisible=\"false\"
                  android:gravity=\"center\"
                  android:hint=\"@string/vault_pin_hint\"
                  android:importantForAutofill=\"no\"
                  android:inputType=\"numberPassword\"
                  android:letterSpacing=\"0.4\"
                  android:maxLength=\"8\"
                  android:textColor=\"@color/vault_text\"
                  android:textColorHint=\"@color/vault_text_secondary\"
                  android:textSize=\"20sp\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toBottomOf=\"@id/pinDotsContainer\" />

              <TextView
                  android:id=\"@+id/tvLockMessage\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:layout_marginTop=\"10dp\"
                  android:gravity=\"center\"
                  android:paddingStart=\"24dp\"
                  android:paddingEnd=\"24dp\"
                  android:textColor=\"@color/vault_error\"
                  android:textSize=\"12sp\"
                  app:layout_constraintTop_toBottomOf=\"@id/etPin\" />

              <com.google.android.material.button.MaterialButton
                  android:id=\"@+id/btnUnlock\"
                  android:layout_width=\"0dp\"
                  android:layout_height=\"wrap_content\"
                  android:layout_marginStart=\"32dp\"
                  android:layout_marginTop=\"20dp\"
                  android:layout_marginEnd=\"32dp\"
                  android:background=\"@drawable/bg_vault_button\"
                  android:text=\"@string/vault_unlock\"
                  android:textColor=\"#06121C\"
                  android:textStyle=\"bold\"
                  app:backgroundTint=\"@color/vault_accent\"
                  app:cornerRadius=\"14dp\"
                  app:layout_constraintEnd_toEndOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
                  app:layout_constraintTop_toBottomOf=\"@id/tvLockMessage\" />

              <com.google.android.material.button.MaterialButton
                  android:id=\"@+id/btnBiometric\"
                  style=\"@style/Widget.MaterialComponents.Button.OutlinedButton\"
                  android:layout_width=\"0dp\"
                  android:layout_height=\"wrap_content\"
                  android:layout_marginStart=\"32dp\"
                  android:layout_marginTop=\"10dp\"
                  android:layout_marginEnd=\"32dp\"
                  android:text=\"@string/vault_use_biometric\"
