                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="12dp"
                  android:paddingEnd="6dp"
                  android:paddingTop="8dp"
                  android:paddingBottom="8dp">
          
                  <ImageView
                      android:id="@+id/ivCheck"
                      android:layout_width="28dp"
                      android:layout_height="28dp"
                      android:layout_marginEnd="10dp"
                      android:src="@drawable/ic_check_circle"
                      android:visibility="gone" />
          
                  <FrameLayout
                      android:layout_width="62dp"
                      android:layout_height="56dp">
          
                      <ImageView
                          android:id="@+id/ivThumbnail"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:scaleType="centerCrop"
                          android:background="@drawable/bg_thumb_round"
                          android:clipToOutline="true"
                          android:src="@drawable/ic_video" />
          
                      <TextView
                          android:id="@+id/tvNewBadge"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="top|start"
                          android:layout_margin="3dp"
                          android:background="@drawable/bg_new_badge"
                          android:paddingStart="4dp"
                          android:paddingEnd="4dp"
                          android:paddingTop="1dp"
                          android:paddingBottom="1dp"
                          android:text="NEW"
                          android:textColor="#FFFFFF"
                          android:textSize="8sp"
                          android:textStyle="bold"
                          android:visibility="gone" />
          
                      <TextView
                          android:id="@+id/tvFolderNewCount"
                          android:layout_width="18dp"
                          android:layout_height="18dp"
                          android:layout_gravity="top|end"
                          android:layout_margin="2dp"
                          android:background="@drawable/bg_badge_red_circle"
                          android:gravity="center"
                          android:textColor="#FFFFFF"
                          android:textSize="9sp"
                          android:textStyle="bold"
                          android:visibility="gone" />
          
                      <TextView
                          android:id="@+id/tvThumbDuration"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="bottom|end"
                          android:layout_margin="3dp"
                          android:background="@drawable/bg_duration_badge"
                          android:paddingStart="4dp"
                          android:paddingEnd="4dp"
                          android:paddingTop="1dp"
                          android:paddingBottom="1dp"
                          android:textColor="#FFFFFF"
                          android:textSize="9sp"
                          android:textStyle="bold"
                          android:visibility="gone" />
                  </FrameLayout>
          
                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="12dp"
                      android:layout_marginEnd="6dp"
                      android:orientation="vertical">
          
                      <TextView
                          android:id="@+id/tvTitle"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:ellipsize="end"
                          android:maxLines="1"
                          android:textColor="@color/text_primary"
                          android:textSize="14sp"
                          android:textStyle="bold" />
          
                      <TextView
                          android:id="@+id/tvSubInfo"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:ellipsize="end"
                          android:maxLines="1"
                          android:textColor="@color/primary"
                          android:textSize="10sp" />
          
                      <TextView
                          android:id="@+id/tvDetails"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:textColor="@color/text_secondary"
                          android:textSize="11sp" />
                  </LinearLayout>
          
                  <ImageButton
                      android:id="@+id/btnMore"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_more_vert"
                      app:tint="@color/text_secondary" />
              </LinearLayout>
          
              <View
                  android:layout_width="match_parent"
                  android:layout_height="1dp"
                  android:layout_marginStart="76dp"
                  android:background="@color/divider_color" />
          </LinearLayout>
          EOF_FILE_95

