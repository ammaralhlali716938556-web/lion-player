          package com.lionplayer.app.ui
          
          import android.app.Activity
          import android.view.LayoutInflater
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import com.lionplayer.app.data.repository.SubtitleRepository
          import com.lionplayer.app.databinding.DialogSubtitlesBinding
          import com.lionplayer.app.player.LionPlayerManager
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          
          object SubtitleDialog {
          
              private var subtitleDelayOffsetMs = 0L
          
              fun show(
                  activity: Activity,
                  videoPath: String,
                  videoTitle: String,
                  onSubtitleLoaded: ((String) -> Unit)? = null
              ) {
                  val binding = DialogSubtitlesBinding.inflate(LayoutInflater.from(activity))
                  val dialog = AlertDialog.Builder(activity)
                      .setView(binding.root)
                      .create()
          
                  binding.tvSubOffset.text = "${subtitleDelayOffsetMs} ms"
          
                  binding.btnSubMinus100.setOnClickListener {
                      subtitleDelayOffsetMs -= 100
                      binding.tvSubOffset.text = "${subtitleDelayOffsetMs} ms"
                      Toast.makeText(activity, "تأخير الترجمة: ${subtitleDelayOffsetMs} ms", Toast.LENGTH_SHORT).show()
                  }
          
                  binding.btnSubPlus100.setOnClickListener {
                      subtitleDelayOffsetMs += 100
                      binding.tvSubOffset.text = "${subtitleDelayOffsetMs} ms"
                      Toast.makeText(activity, "تقديم الترجمة: ${subtitleDelayOffsetMs} ms", Toast.LENGTH_SHORT).show()
                  }
          
                  binding.btnFetchOpenSubtitles.setOnClickListener {
                      Toast.makeText(activity, "جاري البحث في OpenSubtitles...", Toast.LENGTH_SHORT).show()
                      CoroutineScope(Dispatchers.IO).launch {
                          val repo = SubtitleRepository()
                          val results = repo.searchOpenSubtitles(videoTitle)
                          withContext(Dispatchers.Main) {
                              if (results.isNotEmpty()) {
                                  val names = results.map { "${it.name} (${it.language})" }.toTypedArray()
                                  AlertDialog.Builder(activity)
                                      .setTitle("نتائج البحث في OpenSubtitles")
                                      .setItems(names) { _, which ->
                                          Toast.makeText(activity, "تم اختيار: ${results[which].name}", Toast.LENGTH_SHORT).show()
                                          dialog.dismiss()
                                      }
                                      .show()
                              } else {
                                  Toast.makeText(activity, "لم يتم العثور على ترجمات مطابقة عبر الإنترنت", Toast.LENGTH_LONG).show()
                              }
                          }
                      }
                  }
          
                  binding.btnLoadLocalSub.setOnClickListener {
                      val repo = SubtitleRepository()
                      val locals = repo.findLocalSubtitles(videoPath)
                      if (locals.isNotEmpty()) {
                          val names = locals.map { it.name }.toTypedArray()
                          AlertDialog.Builder(activity)
                              .setTitle("الترجمات المحلية المكتشفة:")
                              .setItems(names) { _, which ->
                                  onSubtitleLoaded?.invoke(locals[which].uri)
                                  Toast.makeText(activity, "تم تحميل: ${locals[which].name}", Toast.LENGTH_SHORT).show()
                                  dialog.dismiss()
                              }
                              .show()
                      } else {
                          Toast.makeText(activity, "لم يتم العثور على ملفات ترجمة بنفس اسم الفيديو بالمجلد", Toast.LENGTH_LONG).show()
                      }
                  }
          
                  dialog.show()
              }
          }
