class MainActivity : AppCompatActivity() {

    private val PERMISSION_REQ_CODE = 101

    private lateinit var toolbar: MaterialToolbar
    private lateinit var rvMedia: RecyclerView
    private lateinit var tvEmptyState: TextView
    private lateinit var bottomNav: BottomNavigationView
    private lateinit var mediaAdapter: MediaAdapter
    private lateinit var scaleGestureDetector: ScaleGestureDetector
    private lateinit var prefs: SharedPreferences

    // شريط التحديد المتعدد
    private lateinit var selectionBar: LinearLayout
    private lateinit var btnCancelSelection: ImageButton
    private lateinit var tvSelectedCount: TextView
    private lateinit var btnSelectAll: ImageButton
    private lateinit var btnActionCopy: ImageButton
    private lateinit var btnActionMove: ImageButton
    private lateinit var btnActionDelete: ImageButton

    // شريط اللصق العائم
    private lateinit var pasteBarLayout: LinearLayout
    private lateinit var tvPasteStatus: TextView
    private lateinit var btnDoPaste: Button
    private lateinit var btnCancelPaste: ImageButton

    // عناصر المشغل المصغر
    private lateinit var miniPlayerLayout: LinearLayout
    private lateinit var ivMiniThumb: ImageView
    private lateinit var tvMiniTitle: TextView
    private lateinit var tvMiniSub: TextView
    private lateinit var btnMiniPrev: ImageButton
    private lateinit var btnMiniPlayPause: ImageButton
    private lateinit var btnMiniNext: ImageButton
    private lateinit var btnMiniClose: ImageButton

    private var currentTab = 0
    private val TAB_VIDEO = 0
    private val TAB_AUDIO = 1
    private val TAB_ALL = 2
    private val TAB_FAVORITES = 3

    private var isVideoFolderMode = true
    private var isAudioFolderMode = true
    private var currentSelectedFolder: String? = null

    private var sortBy = "name"
    private var sortAsc = true
    private var viewStyle = MediaAdapter.VIEW_MODE_LIST
    private var showExtensions = false

    private var isSelectionMode = false
    private val clipboardItems = mutableListOf<MediaItem>()
    private var clipboardOp = 0 // 1: COPY, 2: MOVE
    private val OP_NONE = 0
    private val OP_COPY = 1
    private val OP_MOVE = 2

    private val rawVideosList = mutableListOf<MediaItem>()
    private val rawAudioList = mutableListOf<MediaItem>()
    private val displayedList = mutableListOf<MediaItem>()

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        showSystemBars()
        setContentView(R.layout.activity_main)

        prefs = getSharedPreferences("lion_player_prefs", Context.MODE_PRIVATE)
        loadSavedPreferences()

        toolbar = findViewById(R.id.topToolbar)
        rvMedia = findViewById(R.id.rvMedia)
        tvEmptyState = findViewById(R.id.tvEmptyState)
        bottomNav = findViewById(R.id.bottomNavigation)

        initSelectionBar()
        initPasteBar()
        initMiniPlayer()

        setSupportActionBar(toolbar)
        setupRecyclerView()
        setupBottomNav()

        checkAndRequestPermissions()
    }

    // الحفظ التلقائي لكافة الإعدادات وآخر مجلد مفتوح
    private fun loadSavedPreferences() {
        showExtensions = prefs.getBoolean("show_extensions", false)
        sortBy = prefs.getString("sort_by", "name") ?: "name"
        sortAsc = prefs.getBoolean("sort_asc", true)
        viewStyle = prefs.getInt("view_style", MediaAdapter.VIEW_MODE_LIST)
        currentTab = prefs.getInt("last_tab", TAB_VIDEO)
        currentSelectedFolder = prefs.getString("last_folder", null)
        isVideoFolderMode = prefs.getBoolean("is_video_folder_mode", true)
        isAudioFolderMode = prefs.getBoolean("is_audio_folder_mode", true)
    }

    private fun saveCurrentState() {
        prefs.edit()
            .putString("sort_by", sortBy)
            .putBoolean("sort_asc", sortAsc)
            .putInt("view_style", viewStyle)
            .putBoolean("show_extensions", showExtensions)
            .putInt("last_tab", currentTab)
            .putString("last_folder", currentSelectedFolder)
            .putBoolean("is_video_folder_mode", isVideoFolderMode)
            .putBoolean("is_audio_folder_mode", isAudioFolderMode)
            .apply()
    }

    private fun showSystemBars() {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
            window.insetsController?.let { controller ->
                controller.show(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                controller.systemBarsBehavior = WindowInsetsController.BEHAVIOR_DEFAULT
            }
        } else {
            @Suppress("DEPRECATION")
            window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
        }
        window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
    }

    private fun initSelectionBar() {
        selectionBar = findViewById(R.id.selectionBar)
        btnCancelSelection = findViewById(R.id.btnCancelSelection)
        tvSelectedCount = findViewById(R.id.tvSelectedCount)
        btnSelectAll = findViewById(R.id.btnSelectAll)
        btnActionCopy = findViewById(R.id.btnActionCopy)
        btnActionMove = findViewById(R.id.btnActionMove)
        btnActionDelete = findViewById(R.id.btnActionDelete)

        btnCancelSelection.setOnClickListener { exitSelectionMode() }

        btnSelectAll.setOnClickListener {
            val allSelected = displayedList.filter { !it.isFolder }.all { it.isSelected }
            displayedList.filter { !it.isFolder }.forEach { it.isSelected = !allSelected }
            updateSelectionUI()
        }

        btnActionCopy.setOnClickListener {
            val selected = displayedList.filter { it.isSelected && !it.isFolder }
            if (selected.isNotEmpty()) {
                clipboardItems.clear()
                clipboardItems.addAll(selected)
                clipboardOp = OP_COPY
                exitSelectionMode()
                updatePasteBarUI()
                Toast.makeText(this, "تم نسخ ${selected.size} عناصر. انتقل للمجلد واضغط لصق", Toast.LENGTH_SHORT).show()
            }
        }

        btnActionMove.setOnClickListener {
            val selected = displayedList.filter { it.isSelected && !it.isFolder }
            if (selected.isNotEmpty()) {
                clipboardItems.clear()
                clipboardItems.addAll(selected)
                clipboardOp = OP_MOVE
                exitSelectionMode()
                updatePasteBarUI()
                Toast.makeText(this, "تم اختيار نقل ${selected.size} عناصر. انتقل للمجلد واضغط لصق", Toast.LENGTH_SHORT).show()
            }
        }

        btnActionDelete.setOnClickListener {
            val selected = displayedList.filter { it.isSelected && !it.isFolder }
            if (selected.isNotEmpty()) {
                confirmDeleteMultiple(selected)
            }
        }
    }

    private fun initPasteBar() {
        pasteBarLayout = findViewById(R.id.pasteBarLayout)
        tvPasteStatus = findViewById(R.id.tvPasteStatus)
        btnDoPaste = findViewById(R.id.btnDoPaste)
        btnCancelPaste = findViewById(R.id.btnCancelPaste)

        btnDoPaste.setOnClickListener { executePaste() }
        btnCancelPaste.setOnClickListener {
            clipboardItems.clear()
            clipboardOp = OP_NONE
            updatePasteBarUI()
            Toast.makeText(this, "تم إلغاء عملية اللصق", Toast.LENGTH_SHORT).show()
        }
    }

    private fun updatePasteBarUI() {
        if (clipboardItems.isNotEmpty() && clipboardOp != OP_NONE) {
            pasteBarLayout.visibility = View.VISIBLE
            val opText = if (clipboardOp == OP_COPY) "نسخ" else "نقل"
            tvPasteStatus.text = "جاهز لـ $opText (${clipboardItems.size} عناصر)"
        } else {
            pasteBarLayout.visibility = View.GONE
        }
    }

    private fun enterSelectionMode(initialItem: MediaItem? = null) {
        isSelectionMode = true
        selectionBar.visibility = View.VISIBLE
        toolbar.visibility = View.GONE

        displayedList.forEach { it.isSelected = false }
        initialItem?.isSelected = true

        updateSelectionUI()
    }

    private fun exitSelectionMode() {
        isSelectionMode = false
        displayedList.forEach { it.isSelected = false }
        selectionBar.visibility = View.GONE
        toolbar.visibility = View.VISIBLE
        mediaAdapter.updateData(displayedList, viewStyle, showExtensions, false)
    }

    private fun updateSelectionUI() {
        val count = displayedList.count { it.isSelected && !it.isFolder }
        tvSelectedCount.text = "تم تحديد $count"
        mediaAdapter.updateData(displayedList, viewStyle, showExtensions, true)
    }

    // تنفيذ عملية اللصق والنقل الفعلي على وسيط التخزين
    private fun executePaste() {
        if (clipboardItems.isEmpty()) return

        val targetDir: File = if (currentSelectedFolder != null) {
            val folderItem = displayedList.firstOrNull { it.path.isNotEmpty() }
            if (folderItem != null && File(folderItem.path).parentFile != null) {
                File(folderItem.path).parentFile!!
            } else {
                File(Environment.getExternalStorageDirectory(), currentSelectedFolder!!)
            }
        } else {
            val defaultFolder = if (currentTab == TAB_VIDEO) Environment.DIRECTORY_MOVIES else Environment.DIRECTORY_MUSIC
            Environment.getExternalStoragePublicDirectory(defaultFolder)
        }

        if (!targetDir.exists()) {
            targetDir.mkdirs()
        }

        val isMove = clipboardOp == OP_MOVE
        var successCount = 0

        for (item in clipboardItems) {
            val srcFile = File(item.path)
            if (!srcFile.exists()) continue

            var destFile = File(targetDir, srcFile.name)
            if (destFile.exists() && destFile.absolutePath != srcFile.absolutePath) {
                val baseName = srcFile.name.substringBeforeLast('.')
                val ext = srcFile.name.substringAfterLast('.', "")
                val extDot = if (ext.isNotEmpty()) ".$ext" else ""
                var copyIdx = 1
                while (destFile.exists()) {
                    destFile = File(targetDir, "${baseName}_$copyIdx$extDot")
                    copyIdx++
                }
            }

            try {
                if (isMove) {
                    val renamed = srcFile.renameTo(destFile)
                    if (renamed) {
                        try { contentResolver.delete(Uri.parse(item.uri), null, null) } catch (e: Exception) {}
                        successCount++
                    } else {
                        srcFile.copyTo(destFile, overwrite = true)
                        srcFile.delete()
                        try { contentResolver.delete(Uri.parse(item.uri), null, null) } catch (e: Exception) {}
                        successCount++
                    }
                } else {
                    srcFile.copyTo(destFile, overwrite = true)
                    successCount++
                }

                MediaScannerConnection.scanFile(
                    this,
                    arrayOf(destFile.absolutePath),
                    null,
                    null
                )
            } catch (e: Exception) {
                e.printStackTrace()
            }
        }

        val actionWord = if (isMove) "نقل" else "نسخ"
        Toast.makeText(this, "تم $actionWord $successCount عناصر بنجاح إلى: ${targetDir.name}", Toast.LENGTH_LONG).show()

        if (isMove) {
            clipboardItems.clear()
            clipboardOp = OP_NONE
            updatePasteBarUI()
        }

        loadMedia()
    }

    private fun confirmDeleteMultiple(itemsToDelete: List<MediaItem>) {
        AlertDialog.Builder(this)
            .setTitle("حذف العناصر المحددة")
            .setMessage("هل أنت متأكد من حذف ${itemsToDelete.size} عناصر نهائياً من الذاكرة؟")
            .setPositiveButton("حذف") { _, _ ->
                for (item in itemsToDelete) {
                    try {
                        val f = File(item.path)
                        if (f.exists()) f.delete()
                        contentResolver.delete(Uri.parse(item.uri), null, null)
                    } catch (e: Exception) {}
                    rawVideosList.removeAll { it.id == item.id }
                    rawAudioList.removeAll { it.id == item.id }
                }
                exitSelectionMode()
                refreshListDisplay()
                Toast.makeText(this, "تم الحذف بنجاح", Toast.LENGTH_SHORT).show()
            }
            .setNegativeButton("إلغاء", null)
            .show()
    }

    private fun initMiniPlayer() {
        miniPlayerLayout = findViewById(R.id.miniPlayerLayout)
        ivMiniThumb = findViewById(R.id.ivMiniThumb)
        tvMiniTitle = findViewById(R.id.tvMiniTitle)
        tvMiniSub = findViewById(R.id.tvMiniSub)
        btnMiniPrev = findViewById(R.id.btnMiniPrev)
        btnMiniPlayPause = findViewById(R.id.btnMiniPlayPause)
        btnMiniNext = findViewById(R.id.btnMiniNext)
        btnMiniClose = findViewById(R.id.btnMiniClose)

        findViewById<View>(R.id.miniPlayerInfo).setOnClickListener { openPlayerFromMini() }
        ivMiniThumb.setOnClickListener { openPlayerFromMini() }

        btnMiniPrev.setOnClickListener { LionPlayerManager.playPrevious(this) }
        btnMiniPlayPause.setOnClickListener { LionPlayerManager.togglePlayPause(this) }
        btnMiniNext.setOnClickListener { LionPlayerManager.playNext(this) }
        btnMiniClose.setOnClickListener {
            LionPlayerManager.stop(this)
            miniPlayerLayout.visibility = View.GONE
        }
    }

    private fun openPlayerFromMini() {
        val current = LionPlayerManager.getCurrentItem() ?: return
        val playlist = LionPlayerManager.playlist
        val index = LionPlayerManager.currentIndex
        val intent = Intent(this, PlayerActivity::class.java).apply {
            putExtra("PLAYLIST", playlist)
            putExtra("CURRENT_INDEX", index)
        }
        startActivity(intent)
    }

    private fun updateMiniPlayerUI() {
        val current = LionPlayerManager.getCurrentItem()
        val player = LionPlayerManager.player
        if (current != null && player != null) {
            miniPlayerLayout.visibility = View.VISIBLE
            tvMiniTitle.text = current.title
            val subText = if (current.isVideo) "فيديو • ${current.parentFolder}" else "صوتيات • ${current.artist}"
            tvMiniSub.text = subText
            ThumbnailLoader.load(ivMiniThumb, current)

            val isPlaying = player.isPlaying
            btnMiniPlayPause.setImageResource(if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play)
        } else {
            miniPlayerLayout.visibility = View.GONE
        }
    }

    private fun setupRecyclerView() {
        mediaAdapter = MediaAdapter(
            displayedList,
            viewStyle,
            showExtensions,
            isSelectionMode,
            onItemClick = { item ->
                if (isSelectionMode) {
                    if (!item.isFolder) {
                        item.isSelected = !item.isSelected
                        updateSelectionUI()
                    }
                } else {
                    if (item.isFolder) {
                        currentSelectedFolder = item.title
                        saveCurrentState()
                        refreshListDisplay()
                    } else {
                        val playlist = ArrayList(displayedList.filter { !it.isFolder })
                        val index = playlist.indexOfFirst { it.id == item.id }.coerceAtLeast(0)
                        val intent = Intent(this, PlayerActivity::class.java).apply {
                            putExtra("PLAYLIST", playlist)
                            putExtra("CURRENT_INDEX", index)
                        }
                        startActivity(intent)
                    }
                }
            },
            onItemLongClick = { item ->
                if (!isSelectionMode) {
                    enterSelectionMode(item)
                }
            },
            onMoreOptionsClick = { item, _ -> showItemActionDialog(item) }
        )
        applyLayoutManager()
        rvMedia.adapter = mediaAdapter

        var lastScaleTriggerTime = 0L
        scaleGestureDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
            override fun onScale(detector: ScaleGestureDetector): Boolean {
                val now = System.currentTimeMillis()
                if (now - lastScaleTriggerTime < 350) return false

                val factor = detector.scaleFactor
                if (factor > 1.15f) {
                    lastScaleTriggerTime = now
                    zoomIn()
                    return true
                } else if (factor < 0.85f) {
                    lastScaleTriggerTime = now
                    zoomOut()
                    return true
                }
                return false
            }
        })

        rvMedia.setOnTouchListener { _, event ->
            scaleGestureDetector.onTouchEvent(event)
            false
        }
    }

    private fun showItemActionDialog(item: MediaItem) {
        val favoriteTitle = if (item.isFavorite) "إلغاء التفضيل" else "تفضيل"
        val hasClipboard = clipboardItems.isNotEmpty()
        val pasteTitle = if (hasClipboard) "لصق (${clipboardItems.size} عناصر هنا)" else "لصق (غير متوفر)"

        val options = arrayOf(
            "تحديد",
            "نسخ",
            "نقل",
            pasteTitle,
            favoriteTitle,
            "إعادة تسمية",
            "مشاركة",
            "خصائص",
            "حذف"
        )

        AlertDialog.Builder(this)
            .setTitle(item.title)
            .setItems(options) { _, which ->
                when (which) {
                    0 -> enterSelectionMode(item)
                    1 -> {
                        clipboardItems.clear()
                        clipboardItems.add(item)
                        clipboardOp = OP_COPY
                        updatePasteBarUI()
                        Toast.makeText(this, "تم نسخ المقطع. انتقل إلى المجلد المراد واضغط لصق", Toast.LENGTH_SHORT).show()
                    }
                    2 -> {
                        clipboardItems.clear()
                        clipboardItems.add(item)
                        clipboardOp = OP_MOVE
                        updatePasteBarUI()
                        Toast.makeText(this, "تم اختيار نقل المقطع. انتقل للمجلد المراد واضغط لصق", Toast.LENGTH_SHORT).show()
                    }
                    3 -> {
                        if (hasClipboard) {
                            executePaste()
                        } else {
                            Toast.makeText(this, "يرجى نسخ أو نقل ملفات أولاً قبل استخدام اللصق", Toast.LENGTH_SHORT).show()
                        }
                    }
                    4 -> toggleFavorite(item)
                    5 -> showRenameDialog(item)
                    6 -> shareMediaItem(item)
                    7 -> showPropertiesDialog(item)
                    8 -> confirmDeleteSingle(item)
                }
            }
            .show()
    }

    private fun toggleFavorite(item: MediaItem) {
        val favSet = prefs.getStringSet("favorite_ids", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
        val idStr = item.id.toString()
        if (item.isFavorite) {
            favSet.remove(idStr)
            item.isFavorite = false
            Toast.makeText(this, "تمت الإزالة من المفضلة", Toast.LENGTH_SHORT).show()
        } else {
            favSet.add(idStr)
            item.isFavorite = true
            Toast.makeText(this, "تمت الإضافة إلى المفضلة ❤️", Toast.LENGTH_SHORT).show()
        }
        prefs.edit().putStringSet("favorite_ids", favSet).apply()
        refreshListDisplay()
    }

    private fun showRenameDialog(item: MediaItem) {
        val input = EditText(this).apply {
            setText(item.title)
            setSelection(item.title.length)
        }
        AlertDialog.Builder(this)
            .setTitle("إعادة تسمية")
            .setView(input)
            .setPositiveButton("حفظ") { _, _ ->
                val newName = input.text.toString().trim()
                if (newName.isNotEmpty()) {
                    item.title = newName
                    mediaAdapter.notifyDataSetChanged()
                    Toast.makeText(this, "تمت إعادة التسمية بنجاح", Toast.LENGTH_SHORT).show()
                }
            }
            .setNegativeButton("إلغاء", null)
            .show()
    }

    private fun shareMediaItem(item: MediaItem) {
        try {
            val intent = Intent(Intent.ACTION_SEND).apply {
                type = if (item.isVideo) "video/*" else "audio/*"
                putExtra(Intent.EXTRA_STREAM, Uri.parse(item.uri))
                addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
            }
            startActivity(Intent.createChooser(intent, "مشاركة المقطع"))
        } catch (e: Exception) {
            Toast.makeText(this, "تعذر مشاركة المقطع", Toast.LENGTH_SHORT).show()
        }
    }

    private fun showPropertiesDialog(item: MediaItem) {
        val sdf = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.getDefault())
        val dateStr = sdf.format(Date(item.dateAdded * 1000L))
        val sizeMb = String.format(Locale.US, "%.2f MB", item.size / (1024.0 * 1024.0))
        val durStr = LionPlayerManager.formatDuration(item.duration)

        val message = """
            الاسم: ${item.title}
            المسار: ${item.path.ifEmpty { item.uri }}
            النوع: ${if (item.isVideo) "فيديو" else "صوتيات"}
            المجلد: ${item.parentFolder}
            الألبوم: ${item.album}
            الفنان: ${item.artist}
            الحجم: $sizeMb
            المدة: $durStr
            تاريخ الإضافة: $dateStr
        """.trimIndent()

        AlertDialog.Builder(this)
            .setTitle("خصائص المقطع")
            .setMessage(message)
            .setPositiveButton("إغلاق", null)
            .show()
    }

    private fun confirmDeleteSingle(item: MediaItem) {
        AlertDialog.Builder(this)
            .setTitle("حذف المقطع")
            .setMessage("هل أنت متأكد من رغبتك في حذف ${item.title}؟")
            .setPositiveButton("حذف") { _, _ ->
                try {
                    val f = File(item.path)
                    if (f.exists()) f.delete()
                    contentResolver.delete(Uri.parse(item.uri), null, null)
                } catch (e: Exception) {}
                rawVideosList.removeAll { it.id == item.id }
                rawAudioList.removeAll { it.id == item.id }
                refreshListDisplay()
                Toast.makeText(this, "تم الحذف بنجاح", Toast.LENGTH_SHORT).show()
            }
            .setNegativeButton("إلغاء", null)
            .show()
    }

    private fun zoomIn() {
        if (viewStyle == MediaAdapter.VIEW_MODE_GRID_SMALL) {
            viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
            applyLayoutManager()
            saveCurrentState()
            mediaAdapter.updateData(displayedList, viewStyle, showExtensions, isSelectionMode)
        } else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) {
            viewStyle = MediaAdapter.VIEW_MODE_LIST
            applyLayoutManager()
            saveCurrentState()
            mediaAdapter.updateData(displayedList, viewStyle, showExtensions, isSelectionMode)
        }
    }

    private fun zoomOut() {
        if (viewStyle == MediaAdapter.VIEW_MODE_LIST) {
            viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
            applyLayoutManager()
            saveCurrentState()
            mediaAdapter.updateData(displayedList, viewStyle, showExtensions, isSelectionMode)
        } else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) {
            viewStyle = MediaAdapter.VIEW_MODE_GRID_SMALL
            applyLayoutManager()
            saveCurrentState()
            mediaAdapter.updateData(displayedList, viewStyle, showExtensions, isSelectionMode)
        }
    }

    private fun applyLayoutManager() {
        when (viewStyle) {
            MediaAdapter.VIEW_MODE_LIST -> rvMedia.layoutManager = LinearLayoutManager(this)
            MediaAdapter.VIEW_MODE_GRID_LARGE -> rvMedia.layoutManager = GridLayoutManager(this, 2)
            MediaAdapter.VIEW_MODE_GRID_SMALL -> rvMedia.layoutManager = GridLayoutManager(this, 3)
        }
    }

    private fun setupBottomNav() {
        when (currentTab) {
            TAB_VIDEO -> bottomNav.selectedItemId = R.id.nav_local
            TAB_AUDIO -> bottomNav.selectedItemId = R.id.nav_music
            TAB_ALL -> bottomNav.selectedItemId = R.id.nav_all
            TAB_FAVORITES -> bottomNav.selectedItemId = R.id.nav_favorites
        }

        bottomNav.setOnItemSelectedListener { menuItem ->
            when (menuItem.itemId) {
                R.id.nav_local -> {
                    currentTab = TAB_VIDEO
                    currentSelectedFolder = null
                    saveCurrentState()
                    refreshListDisplay()
                    true
                }
                R.id.nav_music -> {
                    currentTab = TAB_AUDIO
                    currentSelectedFolder = null
                    saveCurrentState()
                    refreshListDisplay()
                    true
                }
                R.id.nav_all -> {
                    currentTab = TAB_ALL
                    currentSelectedFolder = null
                    saveCurrentState()
                    refreshListDisplay()
                    true
                }
                R.id.nav_favorites -> {
                    currentTab = TAB_FAVORITES
                    currentSelectedFolder = null
                    saveCurrentState()
                    refreshListDisplay()
                    true
                }
                else -> false
            }
        }
    }

    private fun checkAndRequestPermissions() {
        val permissionsNeeded = mutableListOf<String>()
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                permissionsNeeded.add(Manifest.permission.READ_MEDIA_VIDEO)
            }
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                permissionsNeeded.add(Manifest.permission.READ_MEDIA_AUDIO)
            }
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                permissionsNeeded.add(Manifest.permission.POST_NOTIFICATIONS)
            }
        } else {
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                permissionsNeeded.add(Manifest.permission.READ_EXTERNAL_STORAGE)
            }
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                permissionsNeeded.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
            }
        }

        if (permissionsNeeded.isNotEmpty()) {
            ActivityCompat.requestPermissions(this, permissionsNeeded.toTypedArray(), PERMISSION_REQ_CODE)
        } else {
            loadMedia()
        }
    }

    override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults)
        if (requestCode == PERMISSION_REQ_CODE) {
            if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                loadMedia()
            } else {
                Toast.makeText(this, "يرجى منح صلاحيات الوسائط لتشغيل وإدارة الملفات", Toast.LENGTH_LONG).show()
            }
        }
    }

    private fun loadMedia() {
        loadVideos()
        loadAudio()
        refreshListDisplay()
    }

    private fun loadVideos() {
        rawVideosList.clear()
        val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
        val uri = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
        val projection = arrayOf(
            MediaStore.Video.Media._ID,
            MediaStore.Video.Media.TITLE,
            MediaStore.Video.Media.DATA,
            MediaStore.Video.Media.DURATION,
            MediaStore.Video.Media.SIZE,
            MediaStore.Video.Media.DATE_ADDED,
            MediaStore.Video.Media.ARTIST,
            MediaStore.Video.Media.ALBUM,
            MediaStore.Video.Media.DISPLAY_NAME
        )

        try {
            contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.TITLE)
                val dataCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                val durationCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED)
                val artistCol = cursor.getColumnIndex(MediaStore.Video.Media.ARTIST)
                val albumCol = cursor.getColumnIndex(MediaStore.Video.Media.ALBUM)
                val dispNameCol = cursor.getColumnIndex(MediaStore.Video.Media.DISPLAY_NAME)

                while (cursor.moveToNext()) {
                    val id = cursor.getLong(idCol)
                    val rawTitle = cursor.getString(titleCol) ?: "فيديو"
                    val path = cursor.getString(dataCol) ?: ""
                    val dispName = if (dispNameCol != -1) cursor.getString(dispNameCol) else null
                    val duration = cursor.getLong(durationCol)
                    val size = cursor.getLong(sizeCol)
                    val dateAdded = cursor.getLong(dateCol)
                    val artist = if (artistCol != -1) cursor.getString(artistCol) ?: "فيديو" else "فيديو"
                    val album = if (albumCol != -1) cursor.getString(albumCol) ?: "فيديو" else "فيديو"
                    val contentUri = ContentUris.withAppendedId(uri, id).toString()

                    val folderName = try {
                        val parent = File(path).parentFile?.name
                        if (!parent.isNullOrEmpty()) parent else "الرئيسي"
                    } catch (e: Exception) {
                        "الرئيسي"
                    }

                    val fileExt = if (!dispName.isNullOrEmpty() && dispName.contains(".")) {
                        dispName.substringAfterLast('.')
                    } else if (path.contains(".")) {
                        path.substringAfterLast('.')
                    } else "mp4"

                    val finalTitle = if (!dispName.isNullOrEmpty()) dispName.substringBeforeLast('.') else rawTitle
                    val isFav = favSet.contains(id.toString())

                    rawVideosList.add(
                        MediaItem(
                            id, finalTitle, contentUri, duration, size, dateAdded, true,
                            folderName, false, 0, artist, album, isFav, path, false, fileExt
                        )
                    )
                }
            }
        } catch (e: Exception) {}
    }

    private fun loadAudio() {
        rawAudioList.clear()
