          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/app_background"
              android:padding="24dp">
          
              <ImageView
                  android:id="@+id/ivVaultLockIcon"
                  android:layout_width="72dp"
                  android:layout_height="72dp"
                  android:src="@drawable/ic_vault"
                  app:tint="@color/primary"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  android:layout_marginTop="32dp" />
          
              <TextView
                  android:id="@+id/tvVaultAuthTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:text="@string/vault_title"
                  android:textColor="@color/text_primary"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  app:layout_constraintTop_toBottomOf="@id/ivVaultLockIcon"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />
          
              <TextView
                  android:id="@+id/tvVaultAuthSubtitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:text="@string/vault_pin_prompt"
                  android:textColor="@color/text_secondary"
                  android:textSize="14sp"
                  app:layout_constraintTop_toBottomOf="@id/tvVaultAuthTitle"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />
          
              <!-- PIN Dots Indicators -->
              <LinearLayout
                  android:id="@+id/layoutPinDots"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="28dp"
                  android:gravity="center"
                  android:orientation="horizontal"
                  app:layout_constraintTop_toBottomOf="@id/tvVaultAuthSubtitle"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">
          
                  <ImageView
                      android:id="@+id/dot1"
                      android:layout_width="18dp"
                      android:layout_height="18dp"
                      android:layout_margin="8dp"
                      android:src="@drawable/bg_pin_dot_off" />
          
                  <ImageView
                      android:id="@+id/dot2"
                      android:layout_width="18dp"
                      android:layout_height="18dp"
                      android:layout_margin="8dp"
                      android:src="@drawable/bg_pin_dot_off" />
          
                  <ImageView
                      android:id="@+id/dot3"
                      android:layout_width="18dp"
                      android:layout_height="18dp"
                      android:layout_margin="8dp"
                      android:src="@drawable/bg_pin_dot_off" />
          
                  <ImageView
                      android:id="@+id/dot4"
                      android:layout_width="18dp"
                      android:layout_height="18dp"
                      android:layout_margin="8dp"
                      android:src="@drawable/bg_pin_dot_off" />
              </LinearLayout>
          
              <!-- Keypad Layout -->
              <TableLayout
                  android:id="@+id/keypadLayout"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:stretchColumns="*"
                  app:layout_constraintTop_toBottomOf="@id/layoutPinDots"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintBottom_toTopOf="@id/btnForgotPin">
          
                  <TableRow android:layout_margin="6dp">
                      <TextView android:id="@+id/btnKey1" android:text="1" android:layout_width="72dp" android:layout_height="72dp" android:gravity="center" android:textSize="26sp" android:textStyle="bold" android:textColor="@color/text_primary" android:background="@drawable/bg_keypad_circle" />
                      <TextView android:id="@+id/btnKey2" android:text="2" android:layout_width="72dp" android:layout_height="72dp" android:gravity="center" android:textSize="26sp" android:textStyle="bold" android:textColor="@color/text_primary" android:background="@drawable/bg_keypad_circle" android:layout_marginStart="16dp" android:layout_marginEnd="16dp" />
                      <TextView android:id="@+id/btnKey3" android:text="3" android:layout_width="72dp" android:layout_height="72dp" android:gravity="center" android:textSize="26sp" android:textStyle="bold" android:textColor="@color/text_primary" android:background="@drawable/bg_keypad_circle" />
                  </TableRow>
          
                  <TableRow android:layout_margin="6dp">
                      <TextView android:id="@+id/btnKey4" android:text="4" android:layout_width="72dp" android:layout_height="72dp" android:gravity="center" android:textSize="26sp" android:textStyle="bold" android:textColor="@color/text_primary" android:background="@drawable/bg_keypad_circle" />
                      <TextView android:id="@+id/btnKey5" android:text="5" android:layout_width="72dp" android:layout_height="72dp" android:gravity="center" android:textSize="26sp" android:textStyle="bold" android:textColor="@color/text_primary" android:background="@drawable/bg_keypad_circle" android:layout_marginStart="16dp" android:layout_marginEnd="16dp" />
                      <TextView android:id="@+id/btnKey6" android:text="6" android:layout_width="72dp" android:layout_height="72dp" android:gravity="center" android:textSize="26sp" android:textStyle="bold" android:textColor="@color/text_primary" android:background="@drawable/bg_keypad_circle" />
                  </TableRow>
          
                  <TableRow android:layout_margin="6dp">
                      <TextView android:id="@+id/btnKey7" android:text="7" android:layout_width="72dp" android:layout_height="72dp" android:gravity="center" android:textSize="26sp" android:textStyle="bold" android:textColor="@color/text_primary" android:background="@drawable/bg_keypad_circle" />
                      <TextView android:id="@+id/btnKey8" android:text="8" android:layout_width="72dp" android:layout_height="72dp" android:gravity="center" android:textSize="26sp" android:textStyle="bold" android:textColor="@color/text_primary" android:background="@drawable/bg_keypad_circle" android:layout_marginStart="16dp" android:layout_marginEnd="16dp" />
                      <TextView android:id="@+id/btnKey9" android:text="9" android:layout_width="72dp" android:layout_height="72dp" android:gravity="center" android:textSize="26sp" android:textStyle="bold" android:textColor="@color/text_primary" android:background="@drawable/bg_keypad_circle" />
                  </TableRow>
          
                  <TableRow android:layout_margin="6dp">
                      <ImageButton
                          android:id="@+id/btnBiometricAuth"
                          android:layout_width="72dp"
                          android:layout_height="72dp"
                          android:background="@drawable/bg_keypad_circle"
                          android:src="@drawable/ic_fingerprint"
                          app:tint="@color/primary"
                          android:contentDescription="بصمة الإصبع" />
          
                      <TextView android:id="@+id/btnKey0" android:text="0" android:layout_width="72dp" android:layout_height="72dp" android:gravity="center" android:textSize="26sp" android:textStyle="bold" android:textColor="@color/text_primary" android:background="@drawable/bg_keypad_circle" android:layout_marginStart="16dp" android:layout_marginEnd="16dp" />
          
                      <ImageButton
                          android:id="@+id/btnBackspace"
                          android:layout_width="72dp"
                          android:layout_height="72dp"
                          android:background="@drawable/bg_keypad_circle"
                          android:src="@drawable/ic_close"
                          app:tint="@color/text_primary"
                          android:contentDescription="مسح" />
                  </TableRow>
              </TableLayout>
          
              <TextView
                  android:id="@+id/btnForgotPin"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="16dp"
                  android:padding="8dp"
                  android:text="@string/vault_forgot_pin"
                  android:textColor="@color/primary"
                  android:textSize="14sp"
                  android:textStyle="bold"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />
          
