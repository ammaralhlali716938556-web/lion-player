          # 18. SubtitleUtils.kt
          cat << 'EOF_SUB_UTILS' > app/src/main/java/com/lionplayer/app/subtitle/SubtitleUtils.kt
          package com.lionplayer.app.subtitle

          import android.content.Context
          import android.net.Uri
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MimeTypes
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.util.Locale
          import java.util.regex.Pattern

          object SubtitleUtils {

              fun getSubtitleMimeType(filePathOrUri: String): String {
                  val lower = filePathOrUri.lowercase(Locale.ROOT)
                  return when {
                      lower.endsWith(".srt") -> MimeTypes.APPLICATION_SUBRIP
                      lower.endsWith(".vtt") -> MimeTypes.TEXT_VTT
                      lower.endsWith(".ass") || lower.endsWith(".ssa") -> MimeTypes.TEXT_SSA
                      else -> MimeTypes.APPLICATION_SUBRIP
                  }
              }

              fun buildSubtitleConfiguration(uri: Uri, label: String = "ترجمة مخصصة"): MediaItem.SubtitleConfiguration {
                  val mime = getSubtitleMimeType(uri.toString())
                  return MediaItem.SubtitleConfiguration.Builder(uri)
                      .setMimeType(mime)
                      .setLanguage("ar")
                      .setLabel(label)
                      .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                      .build()
              }

              fun shiftSubtitleFile(context: Context, sourceUri: Uri, offsetMs: Long): Uri {
                  if (offsetMs == 0L) return sourceUri
                  return try {
                      val mime = getSubtitleMimeType(sourceUri.toString())
                      val inputStream = context.contentResolver.openInputStream(sourceUri) ?: return sourceUri
                      val reader = BufferedReader(InputStreamReader(inputStream))
                      val lines = reader.readLines()
                      reader.close()

                      val shiftedLines = when (mime) {
                          MimeTypes.APPLICATION_SUBRIP -> shiftSrt(lines, offsetMs)
                          MimeTypes.TEXT_VTT -> shiftVtt(lines, offsetMs)
                          MimeTypes.TEXT_SSA -> shiftAss(lines, offsetMs)
                          else -> shiftSrt(lines, offsetMs)
                      }

                      val ext = when (mime) {
                          MimeTypes.TEXT_SSA -> ".ass"
                          MimeTypes.TEXT_VTT -> ".vtt"
                          else -> ".srt"
                      }
                      val cacheFile = File(context.cacheDir, "shifted_sub_${System.currentTimeMillis()}$ext")
                      cacheFile.writeText(shiftedLines.joinToString("\n"))
                      Uri.fromFile(cacheFile)
                  } catch (e: Exception) {
                      sourceUri
                  }
              }

              private fun shiftSrt(lines: List<String>, offsetMs: Long): List<String> {
                  val p = Pattern.compile("(\\d{2}):(\\d{2}):(\\d{2}),(\\d{3})\\s*-->\\s*(\\d{2}):(\\d{2}):(\\d{2}),(\\d{3})")
                  return lines.map { line ->
                      val m = p.matcher(line)
                      if (m.find()) {
                          val startMs = parseTime(m.group(1), m.group(2), m.group(3), m.group(4))
                          val endMs = parseTime(m.group(5), m.group(6), m.group(7), m.group(8))
                          val newStart = (startMs + offsetMs).coerceAtLeast(0L)
                          val newEnd = (endMs + offsetMs).coerceAtLeast(0L)
                          "${formatSrtTime(newStart)} --> ${formatSrtTime(newEnd)}"
                      } else {
                          line
                      }
                  }
              }

              private fun shiftVtt(lines: List<String>, offsetMs: Long): List<String> {
                  val p = Pattern.compile("(\\d{2}):(\\d{2}):(\\d{2})\\.(\\d{3})\\s*-->\\s*(\\d{2}):(\\d{2}):(\\d{2})\\.(\\d{3})")
                  return lines.map { line ->
                      val m = p.matcher(line)
                      if (m.find()) {
                          val startMs = parseTime(m.group(1), m.group(2), m.group(3), m.group(4))
                          val endMs = parseTime(m.group(5), m.group(6), m.group(7), m.group(8))
                          val newStart = (startMs + offsetMs).coerceAtLeast(0L)
                          val newEnd = (endMs + offsetMs).coerceAtLeast(0L)
                          "${formatVttTime(newStart)} --> ${formatVttTime(newEnd)}"
                      } else {
                          line
                      }
                  }
              }

              private fun shiftAss(lines: List<String>, offsetMs: Long): List<String> {
                  val p = Pattern.compile("Dialogue:\\s*\\d+,(\\d+:\\d{2}:\\d{2}\\.\\d{2}),(\\d+:\\d{2}:\\d{2}\\.\\d{2}),(.*)")
                  return lines.map { line ->
                      val m = p.matcher(line)
                      if (m.find()) {
                          val startMs = parseAssTime(m.group(1))
                          val endMs = parseAssTime(m.group(2))
                          val rest = m.group(3)
                          val newStart = (startMs + offsetMs).coerceAtLeast(0L)
                          val newEnd = (endMs + offsetMs).coerceAtLeast(0L)
                          "Dialogue: 0,${formatAssTime(newStart)},${formatAssTime(newEnd)},$rest"
                      } else {
                          line
                      }
                  }
              }

              private fun parseTime(h: String, m: String, s: String, ms: String): Long {
                  return (h.toLong() * 3600000L) + (m.toLong() * 60000L) + (s.toLong() * 1000L) + ms.toLong()
              }

              private fun parseAssTime(t: String): Long {
                  val parts = t.split(":")
                  val h = parts[0].toLong()
                  val m = parts[1].toLong()
                  val secParts = parts[2].split(".")
                  val s = secParts[0].toLong()
                  val cs = secParts[1].toLong() * 10L
                  return (h * 3600000L) + (m * 60000L) + (s * 1000L) + cs
              }

              private fun formatSrtTime(ms: Long): String {
                  val h = ms / 3600000L
                  val rem = ms % 3600000L
                  val m = rem / 60000L
                  val rem2 = rem % 60000L
                  val s = rem2 / 1000L
                  val msec = rem2 % 1000L
                  return String.format(Locale.US, "%02d:%02d:%02d,%03d", h, m, s, msec)
              }

              private fun formatVttTime(ms: Long): String {
                  val h = ms / 3600000L
                  val rem = ms % 3600000L
                  val m = rem / 60000L
                  val rem2 = rem % 60000L
                  val s = rem2 / 1000L
                  val msec = rem2 % 1000L
                  return String.format(Locale.US, "%02d:%02d:%02d.%03d", h, m, s, msec)
              }

              private fun formatAssTime(ms: Long): String {
                  val h = ms / 3600000L
                  val rem = ms % 3600000L
                  val m = rem / 60000L
                  val rem2 = rem % 60000L
                  val s = rem2 / 1000L
                  val cs = (rem2 % 1000L) / 10L
                  return String.format(Locale.US, "%d:%02d:%02d.%02d", h, m, s, cs)
              }
          }
          EOF_SUB_UTILS

          # 19. OpenSubtitlesManager.kt
          cat << 'EOF_OS_MGR' > app/src/main/java/com/lionplayer/app/subtitle/OpenSubtitlesManager.kt
          package com.lionplayer.app.subtitle

          import android.content.Context
          import android.net.Uri
          import org.json.JSONObject
          import java.io.DataInputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.util.concurrent.Executors

          data class SubtitleResult(
              val fileId: Int,
              val fileName: String,
              val language: String,
              val downloadUrl: String
          )

          object OpenSubtitlesManager {

              private val executor = Executors.newSingleThreadExecutor()
              private const val API_BASE = "https://api.opensubtitles.com/api/v1"
              private const val API_KEY = "lion_player_community_key"

              fun computeMovieHash(file: File): String {
                  val size = file.length()
                  val chunkSize = 65536L
                  if (size < chunkSize) return ""
                  var head = 0L
                  var tail = 0L

                  FileInputStream(file).use { fis ->
                      val buf = ByteArray(chunkSize.toInt())
                      val dis = DataInputStream(fis)
                      dis.readFully(buf)
                      head = computeChunkHash(buf)

                      fis.channel.position((size - chunkSize).coerceAtLeast(0L))
                      dis.readFully(buf)
                      tail = computeChunkHash(buf)
                  }

                  val hash = (size + head + tail)
                  return String.format("%016x", hash)
              }

              private fun computeChunkHash(bytes: ByteArray): Long {
                  val bb = ByteBuffer.wrap(bytes).order(ByteOrder.LITTLE_ENDIAN)
                  var hash = 0L
                  while (bb.hasRemaining()) {
                      hash += bb.long
                  }
                  return hash
              }

              fun searchSubtitles(
                  context: Context,
                  query: String,
                  movieHash: String? = null,
                  onSuccess: (List<SubtitleResult>) -> Unit,
                  onError: (String) -> Unit
              ) {
                  executor.execute {
                      try {
                          val urlStr = buildString {
                              append("$API_BASE/subtitles?languages=ar,en")
                              if (!movieHash.isNullOrEmpty()) {
                                  append("&moviehash=$movieHash")
                              }
                              if (query.isNotEmpty()) {
                                  append("&query=").append(URLEncoder.encode(query, "UTF-8"))
                              }
                          }
                          val url = URL(urlStr)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "GET"
                          conn.setRequestProperty("Api-Key", API_KEY)
                          conn.setRequestProperty("User-Agent", "LionPlayer v1.7")
                          conn.connectTimeout = 10000
                          conn.readTimeout = 10000

                          val code = conn.responseCode
                          if (code in 200..299) {
                              val response = conn.inputStream.bufferedReader().use { it.readText() }
                              val json = JSONObject(response)
                              val dataArr = json.optJSONArray("data")
                              val list = mutableListOf<SubtitleResult>()
                              if (dataArr != null) {
                                  for (i in 0 until dataArr.length()) {
                                      val item = dataArr.getJSONObject(i)
                                      val attr = item.optJSONObject("attributes")
                                      val files = attr?.optJSONArray("files")
                                      val firstFile = files?.optJSONObject(0)
                                      val fileId = firstFile?.optInt("file_id") ?: 0
                                      val fileName = firstFile?.optString("file_name") ?: "subtitle_$fileId.srt"
                                      val lang = attr?.optString("language") ?: "ar"
                                      val dlUrl = "$API_BASE/download"
                                      list.add(SubtitleResult(fileId, fileName, lang, dlUrl))
                                  }
                              }
                              onSuccess(list)
                          } else {
                              onError("فشل الاتصال بخادم الترجمة (كود $code)")
                          }
                      } catch (e: Exception) {
                          onError(e.localizedMessage ?: "حدث خطأ أثناء البحث")
                      }
                  }
              }

              fun downloadSubtitle(
                  context: Context,
                  result: SubtitleResult,
                  onSuccess: (Uri) -> Unit,
                  onError: (String) -> Unit
              ) {
                  executor.execute {
                      try {
                          val url = URL(result.downloadUrl)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Api-Key", API_KEY)
                          conn.setRequestProperty("User-Agent", "LionPlayer v1.7")
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.doOutput = true

                          val body = JSONObject().apply { put("file_id", result.fileId) }
                          conn.outputStream.use { it.write(body.toString().toByteArray()) }

                          val code = conn.responseCode
                          if (code in 200..299) {
                              val resp = conn.inputStream.bufferedReader().use { it.readText() }
                              val respJson = JSONObject(resp)
                              val link = respJson.optString("link")
                              if (link.isNotEmpty()) {
                                  val dlConn = URL(link).openConnection() as HttpURLConnection
                                  val subFile = File(context.cacheDir, result.fileName)
                                  dlConn.inputStream.use { input ->
                                      FileOutputStream(subFile).use { output ->
                                          input.copyTo(output)
                                      }
                                  }
                                  onSuccess(Uri.fromFile(subFile))
                              } else {
                                  onError("تعذر استخراج رابط التنزيل المباشر")
                              }
                          } else {
                              onError("فشل طلب التنزيل (كود $code)")
                          }
                      } catch (e: Exception) {
                          onError(e.localizedMessage ?: "حدث خطأ أثناء تنزيل الترجمة")
                      }
                  }
              }
          }
