### 2. كود `LionPlayerManager.kt` الكامل
*(يشمل: التقدم بالثانية الواحدة لحظياً، اسم الفنان بخط أصغر في الإشعار، حجب أزرار البلوتوث عند الإلغاء)*

```kotlin
package com.lionplayer.app.player

import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.PendingIntent
import android.content.Context
import android.content.Intent
import android.graphics.Color
import android.net.Uri
import android.os.Build
import android.os.Handler
import android.os.Looper
import android.text.SpannableStringBuilder
import android.text.Spanned
import android.text.style.ForegroundColorSpan
import android.text.style.RelativeSizeSpan
import android.widget.Toast
import androidx.core.app.NotificationCompat
import androidx.media3.common.AudioAttributes
import androidx.media3.common.C
import androidx.media3.common.MediaItem
import androidx.media3.common.Player
import androidx.media3.exoplayer.ExoPlayer
import androidx.media3.session.MediaSession
import com.lionplayer.app.R
import com.lionplayer.app.model.MediaItem as LionMediaItem
import com.lionplayer.app.receiver.NotificationReceiver
import com.lionplayer.app.ui.PlayerActivity
import java.util.ArrayList
import java.util.Locale

object LionPlayerManager {

    const val CHANNEL_ID = "lion_playback_channel"
    const val NOTIFICATION_ID = 2024

    var player: ExoPlayer? = null
        private set

    private var mediaSession: MediaSession? = null
    private var appContext: Context? = null

    var playlist: ArrayList<LionMediaItem> = arrayListOf()
    var currentIndex: Int = 0
    var allowBackgroundPlayback: Boolean = false

    var onTrackChanged: ((LionMediaItem) -> Unit)? = null
    var onPlaybackStateChanged: ((Boolean) -> Unit)? = null

    // عداد الإشعار للتحديث الفوري كل ثانية واحدة بالضبط
    private val notifTickerHandler = Handler(Looper.getMainLooper())
    private val notifTickerRunnable = object : Runnable {
        override fun run() {
            val p = player
            if (p != null && p.isPlaying) {
                appContext?.let { updateNotification(it) }
                notifTickerHandler.postDelayed(this, 1000L)
            }
        }
    }

    fun getOrCreatePlayer(context: Context): ExoPlayer {
        if (player == null) {
            appContext = context.applicationContext
            player = ExoPlayer.Builder(appContext!!)
                .setAudioAttributes(
                    AudioAttributes.Builder()
                        .setUsage(C.USAGE_MEDIA)
                        .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                        .build(),
                    true
                )
                .setWakeMode(C.WAKE_MODE_LOCAL)
                .setHandleAudioBecomingNoisy(true)
                .build().apply {
                    addListener(object : Player.Listener {
                        override fun onIsPlayingChanged(isPlaying: Boolean) {
                            onPlaybackStateChanged?.invoke(isPlaying)
                            appContext?.let {
                                updateNotification(it)
                                if (isPlaying) {
                                    startNotifTicker()
                                } else {
                                    stopNotifTicker()
                                }
                            }
                        }

                        override fun onPlaybackStateChanged(playbackState: Int) {
                            if (playbackState == Player.STATE_ENDED) {
                                if (currentIndex < playlist.size - 1) {
                                    appContext?.let { playNext(it) }
                                } else {
                                    stopNotifTicker()
                                    onPlaybackStateChanged?.invoke(false)
                                    appContext?.let { updateNotification(it) }
                                }
                            }
                        }
                    })
                }

            // كول باك التحكم بسماعة البلوتوث
            val sessionCallback = object : MediaSession.Callback {
                override fun onMediaButtonEvent(
                    session: MediaSession,
                    controllerInfo: MediaSession.ControllerInfo,
                    intent: Intent
                ): Boolean {
                    val prefs = appContext?.getSharedPreferences("lion_player_prefs", Context.MODE_PRIVATE)
                    val bluetoothEnabled = prefs?.getBoolean("bluetooth_headset_controls_enabled", true) ?: true
                    if (!bluetoothEnabled) {
                        // عند إلغاء التفعيل يتم حجب تحكم سماعة البلوتوث نهائياً
                        return true
                    }
                    return super.onMediaButtonEvent(session, controllerInfo, intent)
                }
            }

            mediaSession = MediaSession.Builder(appContext!, player!!)
                .setId("LionMediaSession")
                .setCallback(sessionCallback)
                .build()

            createNotificationChannel(appContext!!)
        }
        return player!!
    }

    private fun startNotifTicker() {
        notifTickerHandler.removeCallbacks(notifTickerRunnable)
        notifTickerHandler.postDelayed(notifTickerRunnable, 1000L)
    }

    private fun stopNotifTicker() {
        notifTickerHandler.removeCallbacks(notifTickerRunnable)
    }

    fun playPlaylist(context: Context, list: ArrayList<LionMediaItem>, index: Int) {
        val appCtx = context.applicationContext
        appContext = appCtx
        val p = getOrCreatePlayer(appCtx)

        val currentItem = playlist.getOrNull(currentIndex)
        val targetItem = list.getOrNull(index)

        if (currentItem != null && targetItem != null && currentItem.id == targetItem.id && p.isPlaying) {
            playlist = list
            currentIndex = index
            onTrackChanged?.invoke(targetItem)
            return
        }

        playlist = list
        currentIndex = index
        playCurrentItem(appCtx)
    }

    fun playCurrentItem(context: Context) {
        val item = playlist.getOrNull(currentIndex) ?: return
        val appCtx = context.applicationContext
        appContext = appCtx
        val p = getOrCreatePlayer(appCtx)

        if (!item.isVideo) {
            allowBackgroundPlayback = true
        }

        val mediaItem = MediaItem.fromUri(Uri.parse(item.uri))
        p.setMediaItem(mediaItem)
        p.prepare()
        p.play()

        onTrackChanged?.invoke(item)
        onPlaybackStateChanged?.invoke(true)
        updateNotification(appCtx)
        startNotifTicker()
    }

    fun playNext(context: Context) {
        if (currentIndex < playlist.size - 1) {
            currentIndex++
            playCurrentItem(context)
        } else {
            Toast.makeText(context.applicationContext, "هذا هو العنصر الأخير في القائمة", Toast.LENGTH_SHORT).show()
        }
    }

    fun playPrevious(context: Context) {
        if (currentIndex > 0) {
            currentIndex--
            playCurrentItem(context)
        } else {
            Toast.makeText(context.applicationContext, "هذا هو العنصر الأول في القائمة", Toast.LENGTH_SHORT).show()
        }
    }

    fun togglePlayPause(context: Context) {
        val p = player ?: return
        if (p.isPlaying) {
            p.pause()
            stopNotifTicker()
        } else {
            p.play()
            startNotifTicker()
        }
        updateNotification(context)
    }

    fun stop(context: Context) {
        allowBackgroundPlayback = false
        stopNotifTicker()
        player?.stop()
        dismissNotification(context)
        onPlaybackStateChanged?.invoke(false)
    }

    fun release() {
        stopNotifTicker()
        allowBackgroundPlayback = false
        mediaSession?.release()
        mediaSession = null
        player?.release()
        player = null
    }

    fun getCurrentItem(): LionMediaItem? = playlist.getOrNull(currentIndex)

    fun createNotificationChannel(context: Context) {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            val name = "Lion Playback"
            val desc = "Lion Player Media Playback Controls"
            val importance = NotificationManager.IMPORTANCE_LOW
            val channel = NotificationChannel(CHANNEL_ID, name, importance).apply {
                description = desc
                setShowBadge(false)
                setSound(null, null)
                enableVibration(false)
            }
            val manager = context.getSystemService(NotificationManager::class.java)
            manager?.createNotificationChannel(channel)
        }
    }

    fun formatDuration(durationMs: Long): String {
        val totalSec = durationMs / 1000
        val sec = totalSec % 60
        val min = (totalSec / 60) % 60
        val hrs = totalSec / 3600
        return if (hrs > 0) {
            String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
        } else {
            String.format(Locale.US, "%02d:%02d", min, sec)
        }
    }

    fun updateNotification(context: Context) {
        val currentItem = playlist.getOrNull(currentIndex) ?: return
        val p = player
        val isPlaying = p?.isPlaying == true
        val appCtx = context.applicationContext

        val currentPos = p?.currentPosition ?: 0L
        val totalDur = (if (p != null && p.duration > 0) p.duration else currentItem.duration).coerceAtLeast(0L)
        val timeString = "${formatDuration(currentPos)} / ${formatDuration(totalDur)}"
        val mediaTypeString = if (currentItem.isVideo) "فيديو" else "صوتيات"

        // إضافة اسم الفنان بجانب اسم المقطع بخط أصغر قليلاً
        val artistName = if (currentItem.artist.isNotEmpty() && currentItem.artist != "<unknown>") currentItem.artist else "فنان غير معروف"
        val titleSpannable = SpannableStringBuilder().apply {
            append(currentItem.title)
            append("  ")
            val start = length
            append(artistName)
            setSpan(RelativeSizeSpan(0.82f), start, length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
            setSpan(ForegroundColorSpan(Color.LTGRAY), start, length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
        }

        val pendingFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
        } else {
            PendingIntent.FLAG_UPDATE_CURRENT
        }

        val contentIntent = Intent(appCtx, PlayerActivity::class.java).apply {
            flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
        }
        val contentPendingIntent = PendingIntent.getActivity(appCtx, 0, contentIntent, pendingFlags)

        val prevIntent = Intent(NotificationReceiver.ACTION_NOTIF_PREV).setPackage(appCtx.packageName)
        val prevPending = PendingIntent.getBroadcast(appCtx, 1, prevIntent, pendingFlags)

        val playPauseIntent = Intent(NotificationReceiver.ACTION_NOTIF_PLAY_PAUSE).setPackage(appCtx.packageName)
        val playPausePending = PendingIntent.getBroadcast(appCtx, 2, playPauseIntent, pendingFlags)

        val nextIntent = Intent(NotificationReceiver.ACTION_NOTIF_NEXT).setPackage(appCtx.packageName)
        val nextPending = PendingIntent.getBroadcast(appCtx, 3, nextIntent, pendingFlags)

        val closeIntent = Intent(NotificationReceiver.ACTION_NOTIF_CLOSE).setPackage(appCtx.packageName)
        val closePending = PendingIntent.getBroadcast(appCtx, 4, closeIntent, pendingFlags)

        val playPauseIcon = if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play
        val playPauseTitle = if (isPlaying) "إيقاف مؤقت" else "تشغيل"

        val builder = NotificationCompat.Builder(appCtx, CHANNEL_ID)
            .setSmallIcon(R.drawable.ic_lion_logo)
            .setContentTitle(titleSpannable)
            .setContentText("$timeString • $mediaTypeString")
            .setSubText(timeString)
            .setContentIntent(contentPendingIntent)
            .setOngoing(isPlaying)
            .setOnlyAlertOnce(true)
            .setPriority(NotificationCompat.PRIORITY_LOW)
            .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
            .addAction(R.drawable.ic_skip_previous, "السابق", prevPending)
            .addAction(playPauseIcon, playPauseTitle, playPausePending)
            .addAction(R.drawable.ic_skip_next, "التالي", nextPending)
            .addAction(R.drawable.ic_close, "إنهاء", closePending)

        try {
            builder.setStyle(
                androidx.media.app.NotificationCompat.MediaStyle()
                    .setShowActionsInCompactView(0, 1, 2)
            )
        } catch (e: Exception) {}

        val manager = appCtx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
        try {
            manager.notify(NOTIFICATION_ID, builder.build())
        } catch (e: SecurityException) {}
    }

    fun dismissNotification(context: Context) {
        stopNotifTicker()
        val manager = context.applicationContext.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
        manager.cancel(NOTIFICATION_ID)
    }
}
```

