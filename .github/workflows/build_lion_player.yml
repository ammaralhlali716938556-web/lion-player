              }

              fun updateData(newItems: List<MediaItem>, newViewMode: Int = viewMode, newShowExt: Boolean = showExtensions) {
                  this.items = newItems
                  this.viewMode = newViewMode
                  this.showExtensions = newShowExt
                  notifyDataSetChanged()
              }

              override fun getItemViewType(position: Int): Int = viewMode

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): BaseViewHolder {
                  val inflater = LayoutInflater.from(parent.context)
                  return if (viewType == VIEW_MODE_LIST) {
                      val binding = ItemMediaVideoBinding.inflate(inflater, parent, false)
                      ListViewHolder(binding)
                  } else {
                      val binding = ItemMediaGridBinding.inflate(inflater, parent, false)
                      GridViewHolder(binding)
                  }
              }

              override fun onBindViewHolder(holder: BaseViewHolder, position: Int) {
                  holder.bind(items[position])
              }

              override fun getItemCount(): Int = items.size

              abstract inner class BaseViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
                  abstract fun bind(item: MediaItem)
              }

              inner class ListViewHolder(private val binding: ItemMediaVideoBinding) : BaseViewHolder(binding.root) {
                  override fun bind(item: MediaItem) {
                      val ext = if (item.path.isNotEmpty()) File(item.path).extension else ""
                      val displayTitle = if (item.isFolder) {
                          item.title
                      } else if (showExtensions) {
                          if (item.title.contains(".") || ext.isEmpty()) item.title else "${item.title}.$ext"
                      } else {
                          item.title.substringBeforeLast('.')
                      }
                      binding.tvTitle.text = displayTitle

                      if (isSelectionMode && !item.isFolder) {
                          binding.ivCheck.visibility = View.VISIBLE
                          if (item.isSelected) {
                              binding.ivCheck.setImageResource(R.drawable.ic_check_circle)
                              binding.itemRootView.setBackgroundColor(Color.parseColor("#33FF9800"))
                          } else {
                              binding.ivCheck.setImageResource(R.drawable.bg_thumb_round)
                              binding.itemRootView.setBackgroundColor(Color.TRANSPARENT)
                          }
                      } else {
                          binding.ivCheck.visibility = View.GONE
                          binding.itemRootView.setBackgroundColor(Color.TRANSPARENT)
                      }

                      binding.ivThumbnail.loadMediaThumbnail(item)

                      if (item.isFolder) {
                          binding.tvSubInfo.visibility = View.GONE
                          binding.tvDetails.text = "${item.itemCount} عناصر"
                          binding.btnMore.visibility = View.GONE
                          binding.tvThumbDuration.visibility = View.GONE
                          binding.tvNewBadge.visibility = View.GONE

                          if (item.newCount > 0) {
                              binding.tvFolderNewCount.visibility = View.VISIBLE
                              binding.tvFolderNewCount.text = if (item.newCount > 99) "99+" else item.newCount.toString()
                          } else {
                              binding.tvFolderNewCount.visibility = View.GONE
                          }
                      } else {
                          binding.tvFolderNewCount.visibility = View.GONE
                          if (item.isNew && !(isSelectionMode && item.isSelected)) {
                              binding.tvNewBadge.visibility = View.VISIBLE
                          } else {
                              binding.tvNewBadge.visibility = View.GONE
                          }

                          if (item.duration > 0) {
                              binding.tvThumbDuration.visibility = View.VISIBLE
                              binding.tvThumbDuration.text = formatDuration(item.duration)
