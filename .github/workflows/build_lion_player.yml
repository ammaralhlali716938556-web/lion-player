                                          val boost = prefs.getBoolean("volume_boost_enabled", false)
                                          val finalPerc = LionPlayerManager.effectsController?.setVolumePercent(initialVolumePercent + deltaPerc, boost) ?: 100f
                                          binding.hudVolume.visibility = View.VISIBLE
                                          binding.volumeProgressBar.progress = finalPerc.toInt()
                                          binding.tvVolumeValue.text = "${finalPerc.toInt()}%"
                                      } else {
                                          val b = ((initialBrightness * 100f + deltaPerc) / 100f).coerceIn(0.01f, 1.0f)
                                          val lp = window.attributes
                                          lp.screenBrightness = b
                                          window.attributes = lp
                                          binding.hudBrightness.visibility = View.VISIBLE
                                          binding.brightnessProgressBar.progress = (b * 100).toInt()
                                          binding.tvBrightnessValue.text = "${(b * 100).toInt()}%"
                                      }
                                  } else if (isDraggingHorizontal) {
                                      // Millisecond level scrubbing
                                      val maxDur = LionPlayerManager.player?.duration?.coerceAtLeast(0L) ?: 0L
                                      if (maxDur > 0) {
                                          val offsetMs = ((dx / screenW) * 60000.0).toLong()
                                          targetSeekPosition = (initialSeekPosition + offsetMs).coerceIn(0L, maxDur)
                                          binding.playerSeekBar.progress = targetSeekPosition.toInt()
                                          binding.tvCurrentTime.text = FormatUtils.formatDurationWithMillis(targetSeekPosition)
          
                                          val now = SystemClock.uptimeMillis()
                                          if (now - lastSeekDispatchTime >= 16L) {
                                              lastSeekDispatchTime = now
                                              LionPlayerManager.player?.seekTo(targetSeekPosition)
                                          }
                                          binding.hudSeek.visibility = View.VISIBLE
                                          val diffSec = (targetSeekPosition - initialSeekPosition) / 1000.0
                                          val sign = if (diffSec > 0) "+" else ""
                                          binding.tvSeekTarget.text = String.format("%s%.1fs\n%s / %s", sign, diffSec, FormatUtils.formatDurationWithMillis(targetSeekPosition), FormatUtils.formatDuration(maxDur))
                                      }
                                  }
                              }
                              lastTouchX = event.x
                              lastTouchY = event.y
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              handler.removeCallbacks(longPressRunnable)
                              if (isLongPressSpeeding) {
                                  isLongPressSpeeding = false
                                  binding.hudFastForward.visibility = View.GONE
                                  LionPlayerManager.player?.playbackParameters = PlaybackParameters(originalSpeedBeforeLongPress)
                              }
                              binding.hudVolume.visibility = View.GONE
                              binding.hudBrightness.visibility = View.GONE
                              binding.hudSeek.visibility = View.GONE
                          }
                      }
                      true
                  }
              }
          
              override fun onStart() {
                  super.onStart()
                  handler.post(updateProgressRunnable)
                  LionPlayerManager.onTrackChanged = { item -> runOnUiThread { updateUIForItem(item) } }
                  LionPlayerManager.onPlaybackStateChanged = { isPlaying -> runOnUiThread { updatePlayPauseButton(isPlaying) } }
              }
          
              override fun onStop() {
                  super.onStop()
                  handler.removeCallbacks(updateProgressRunnable)
              }
          }
