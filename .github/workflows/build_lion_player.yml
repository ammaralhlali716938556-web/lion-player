          # activity_player.xml
          cat << 'EOF' > app/src/main/res/layout/activity_player.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/playerContainer"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:use_controller="false"
                  app:surface_type="surface_view" />

              <LinearLayout
                  android:id="@+id/lyricsContainer"
                  android:layout_width="match_parent"
                  android:layout_height="220dp"
                  android:layout_marginStart="24dp"
                  android:layout_marginEnd="24dp"
                  android:layout_marginBottom="16dp"
                  android:background="@drawable/bg_hud"
                  android:orientation="vertical"
                  android:padding="12dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toTopOf="@id/bottomControls">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="كلمات الأغنية"
                      android:gravity="center"
                      android:textColor="@color/accent"
                      android:textSize="13sp"
                      android:textStyle="bold" />

                  <ScrollView
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:layout_marginTop="6dp">

                      <TextView
                          android:id="@+id/tvLyricsContent"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center"
                          android:textColor="#FFFFFF"
                          android:textSize="14sp"
                          android:lineSpacingExtra="4dp" />
                  </ScrollView>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/topControls"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_controls_gradient"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:padding="12dp"
                  app:layout_constraintTop_toTopOf="parent">

                  <ImageButton
                      android:id="@+id/btnBack"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_back"
                      app:tint="#FFFFFF" />

                  <TextView
                      android:id="@+id/tvVideoTitle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="8dp"
                      android:layout_marginEnd="8dp"
                      android:ellipsize="end"
                      android:maxLines="1"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <ImageButton
                      android:id="@+id/btnToggleNav"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_nav_toggle"
                      app:tint="#FFFFFF" />

                  <ImageButton
                      android:id="@+id/btnLyricsToggle"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_lyrics"
                      app:tint="#FFFFFF" />

                  <ImageButton
                      android:id="@+id/btnEqualizer"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_equalizer"
                      app:tint="#FFFFFF" />

                  <ImageButton
                      android:id="@+id/btnSubtitles"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_subtitles"
                      app:tint="#FFFFFF" />

                  <ImageButton
                      android:id="@+id/btnRotate"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_screen_rotation"
                      app:tint="#FFFFFF" />

                  <Button
                      android:id="@+id/btnDecoder"
                      android:layout_width="wrap_content"
                      android:layout_height="36dp"
                      android:backgroundTint="#FF9800"
                      android:text="HW"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp" />

                  <ImageButton
                      android:id="@+id/btnPip"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_pip"
                      app:tint="#FFFFFF" />

                  <ImageButton
                      android:id="@+id/btnLock"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_lock"
                      app:tint="#FFFFFF" />
              </LinearLayout>

              <ImageButton
                  android:id="@+id/btnUnlock"
                  android:layout_width="56dp"
                  android:layout_height="56dp"
                  android:layout_margin="24dp"
                  android:background="@drawable/bg_hud"
                  android:src="@drawable/ic_lock_open"
                  android:visibility="gone"
                  app:tint="#FF9800"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintStart_toStartOf="parent" />

              <LinearLayout
                  android:id="@+id/hudBrightness"
                  android:layout_width="64dp"
                  android:layout_height="240dp"
                  android:layout_marginStart="24dp"
                  android:background="@drawable/bg_hud"
                  android:gravity="center_horizontal"
                  android:orientation="vertical"
                  android:padding="8dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent">

                  <ImageView
                      android:layout_width="24dp"
                      android:layout_height="24dp"
                      android:src="@drawable/ic_brightness"
                      app:tint="#FFFFFF" />

                  <FrameLayout
                      android:layout_width="24dp"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="8dp"
                      android:layoutDirection="ltr">

                      <ProgressBar
                          android:id="@+id/brightnessProgressBar"
                          style="@android:style/Widget.ProgressBar.Horizontal"
                          android:layout_width="140dp"
                          android:layout_height="12dp"
                          android:layout_gravity="center"
                          android:layoutDirection="ltr"
                          android:max="100"
                          android:progress="50"
                          android:progressDrawable="@drawable/progress_hud"
                          android:rotation="270" />
                  </FrameLayout>

                  <TextView
                      android:id="@+id/tvBrightnessValue"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="50%"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/hudVolume"
                  android:layout_width="64dp"
                  android:layout_height="240dp"
                  android:layout_marginEnd="24dp"
                  android:background="@drawable/bg_hud"
                  android:gravity="center_horizontal"
                  android:orientation="vertical"
                  android:padding="8dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintTop_toTopOf="parent">

                  <ImageView
                      android:layout_width="24dp"
                      android:layout_height="24dp"
                      android:src="@drawable/ic_audiotrack"
                      app:tint="#FFFFFF" />

                  <FrameLayout
                      android:layout_width="24dp"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="8dp"
                      android:layoutDirection="ltr">

                      <ProgressBar
                          android:id="@+id/volumeProgressBar"
                          style="@android:style/Widget.ProgressBar.Horizontal"
                          android:layout_width="140dp"
                          android:layout_height="12dp"
                          android:layout_gravity="center"
                          android:layoutDirection="ltr"
                          android:max="100"
                          android:progress="50"
                          android:progressDrawable="@drawable/progress_hud"
                          android:rotation="270" />
                  </FrameLayout>

                  <TextView
                      android:id="@+id/tvVolumeValue"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="50%"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/hudSeek"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_hud"
                  android:gravity="center"
                  android:orientation="vertical"
                  android:padding="16dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent">

                  <TextView
                      android:id="@+id/tvSeekTarget"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:gravity="center"
                      android:textColor="#FFFFFF"
                      android:textSize="18sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/bottomControls"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_controls_gradient"
                  android:orientation="vertical"
                  android:padding="12dp"
                  app:layout_constraintBottom_toBottomOf="parent">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/tvCurrentTime"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="00:00"
                          android:textColor="#FFFFFF"
                          android:textSize="12sp" />

                      <SeekBar
                          android:id="@+id/playerSeekBar"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:progressTint="#FF9800"
                          android:thumbTint="#FF9800" />

                      <TextView
                          android:id="@+id/tvTotalTime"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="00:00"
                          android:textColor="#FFFFFF"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:gravity="center"
                      android:orientation="horizontal">

                      <ImageButton
                          android:id="@+id/btnNext"
                          android:layout_width="44dp"
                          android:layout_height="44dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_skip_next"
                          app:tint="#FFFFFF" />

                      <ImageButton
                          android:id="@+id/btnForward10"
                          android:layout_width="44dp"
                          android:layout_height="44dp"
                          android:layout_marginStart="14dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_forward_10"
                          app:tint="#FFFFFF" />

                      <ImageButton
                          android:id="@+id/btnPlayPause"
                          android:layout_width="64dp"
                          android:layout_height="64dp"
                          android:layout_marginStart="20dp"
                          android:layout_marginEnd="20dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_play"
                          app:tint="#FF9800" />

                      <ImageButton
                          android:id="@+id/btnRewind10"
                          android:layout_width="44dp"
                          android:layout_height="44dp"
                          android:layout_marginEnd="14dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_replay_10"
                          app:tint="#FFFFFF" />

                      <ImageButton
                          android:id="@+id/btnPrev"
                          android:layout_width="44dp"
                          android:layout_height="44dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_skip_previous"
                          app:tint="#FFFFFF" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <ImageButton
                          android:id="@+id/btnResize"
                          android:layout_width="40dp"
                          android:layout_height="40dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_aspect_ratio"
                          app:tint="#FFFFFF" />

                      <View
                          android:layout_width="0dp"
                          android:layout_height="1dp"
                          android:layout_weight="1" />

                      <Button
                          android:id="@+id/btnSpeed"
                          android:layout_width="wrap_content"
                          android:layout_height="36dp"
                          android:backgroundTint="#333333"
                          android:text="1.0x"
                          android:textColor="#FFFFFF"
                          android:textSize="12sp" />
                  </LinearLayout>
              </LinearLayout>
