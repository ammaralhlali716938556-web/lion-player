          package com.lionplayer.app.ui
          
          import android.os.Bundle
          import android.view.View
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.lionplayer.app.data.repository.VaultRepository
          import com.lionplayer.app.databinding.ActivityVaultBinding
          import com.lionplayer.app.ui.adapter.MediaAdapter
          import kotlinx.coroutines.launch
          import java.util.concurrent.Executor
          
          class VaultActivity : AppCompatActivity() {
          
              private lateinit var binding: ActivityVaultBinding
              private lateinit var vaultRepository: VaultRepository
              private lateinit var mediaAdapter: MediaAdapter
              private val DECOY_PIN = "0000"
              private val REAL_PIN = "1234"
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityVaultBinding.inflate(layoutInflater)
                  setContentView(binding.root)
          
                  vaultRepository = VaultRepository(this)
                  setupViews()
                  setupBiometrics()
              }
          
              private fun setupViews() {
                  binding.toolbarVault.setNavigationOnClickListener { finish() }
          
                  binding.btnUnlockPin.setOnClickListener {
                      val enteredPin = binding.etPin.text.toString().trim()
                      if (enteredPin == REAL_PIN) {
                          unlockVault(isDecoy = false)
                      } else if (enteredPin == DECOY_PIN) {
                          unlockVault(isDecoy = true)
                      } else {
                          Toast.makeText(this, "رمز PIN غير صحيح!", Toast.LENGTH_SHORT).show()
                      }
                  }
          
                  binding.rvVaultMedia.layoutManager = LinearLayoutManager(this)
                  mediaAdapter = MediaAdapter(
                      emptyList(),
                      MediaAdapter.VIEW_MODE_LIST,
                      showExtensions = false,
                      isSelectionMode = false,
                      onItemClick = { item ->
                          Toast.makeText(this, "تشغيل مشفر: ${item.title}", Toast.LENGTH_SHORT).show()
                      },
                      onItemLongClick = {},
                      onMoreOptionsClick = { _, _ -> }
                  )
                  binding.rvVaultMedia.adapter = mediaAdapter
              }
          
              private fun setupBiometrics() {
                  val executor: Executor = ContextCompat.getMainExecutor(this)
                  val biometricPrompt = BiometricPrompt(this, executor, object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                          super.onAuthenticationSucceeded(result)
                          unlockVault(isDecoy = false)
                      }
                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                          super.onAuthenticationError(errorCode, errString)
                      }
                  })
          
                  val promptInfo = BiometricPrompt.PromptInfo.Builder()
                      .setTitle("فتح الخزنة السرية")
                      .setSubtitle("استخدم البصمة أو التعرف على الوجه")
                      .setNegativeButtonText("إلغاء")
                      .build()
          
                  binding.btnBiometric.setOnClickListener {
                      biometricPrompt.authenticate(promptInfo)
                  }
              }
          
              private fun unlockVault(isDecoy: Boolean) {
                  binding.layoutAuth.visibility = View.GONE
                  binding.layoutVaultContent.visibility = View.VISIBLE
          
                  if (isDecoy) {
                      Toast.makeText(this, "تم الدخول في وضع الخزنة البديلة (Decoy Mode)", Toast.LENGTH_LONG).show()
                      mediaAdapter.updateData(emptyList())
                  } else {
                      lifecycleScope.launch {
                          val items = vaultRepository.getVaultItems()
                          mediaAdapter.updateData(items)
                      }
                  }
              }
          }
