name: Build Lion Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Lion Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Create App Code & Environment
        run: |
          mkdir -p gradle
          mkdir -p app/src/main/java/com/lionplayer/app/model
          mkdir -p app/src/main/java/com/lionplayer/app/adapter
          mkdir -p app/src/main/java/com/lionplayer/app/player
          mkdir -p app/src/main/java/com/lionplayer/app/receiver
          mkdir -p app/src/main/java/com/lionplayer/app/subtitle
          mkdir -p app/src/main/java/com/lionplayer/app/ui
          mkdir -p app/src/main/java/com/lionplayer/app/viewmodel
          mkdir -p app/src/main/java/com/lionplayer/app/util
          mkdir -p app/src/main/java/com/lionplayer/app/vault/model
          mkdir -p app/src/main/java/com/lionplayer/app/vault/security
          mkdir -p app/src/main/java/com/lionplayer/app/vault/adapter
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/color

          # Setup local-maven stub for media3-decoder-ffmpeg if required by offline resolver
          python3 -c "
          import os, zipfile
          maven_dir = 'local-maven/androidx/media3/media3-decoder-ffmpeg/1.3.0'
          os.makedirs(maven_dir, exist_ok=True)
          pom = '<project><modelVersion>4.0.0</modelVersion><groupId>androidx.media3</groupId><artifactId>media3-decoder-ffmpeg</artifactId><version>1.3.0</version><packaging>aar</packaging></project>'
          with open(os.path.join(maven_dir, 'media3-decoder-ffmpeg-1.3.0.pom'), 'w') as pf:
              pf.write(pom)
          aar_path = os.path.join(maven_dir, 'media3-decoder-ffmpeg-1.3.0.aar')
          with zipfile.ZipFile(aar_path, 'w') as zf:
              zf.writestr('AndroidManifest.xml', '<manifest package=\"androidx.media3.decoder.ffmpeg\"/>')
              classes_jar = zipfile.ZipFile('classes.jar', 'w')
              classes_jar.close()
              zf.write('classes.jar', 'classes.jar')
              if os.path.exists('classes.jar'): os.remove('classes.jar')
          "

          # 1. gradle.properties
          cat << 'EOF_GRADLE_PROP' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF_GRADLE_PROP

          # 2. settings.gradle
          cat << 'EOF_SETTINGS' > settings.gradle
          rootProject.name = "LionPlayer"
          include ':app'
          EOF_SETTINGS

          # 3. Root build.gradle
          cat << 'EOF_ROOT_BUILD' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "${rootDir}/local-maven" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "${rootDir}/local-maven" }
              }
          }

          tasks.register('clean', Delete) {
              delete rootProject.layout.buildDirectory
          }
          EOF_ROOT_BUILD

          # 4. app/build.gradle
          cat << 'EOF_APP_BUILD' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.lionplayer.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.lionplayer.app"
                  minSdk 23
                  targetSdk 34
                  versionCode 11
                  versionName "2.0.0"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.media:media:1.7.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'

              // Security & Biometric Vault
              implementation 'androidx.biometric:biometric:1.1.0'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'

              // Architecture Components & Coroutines
              implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

              // Coil High-Performance Image & Video Thumbnail Loading
              implementation 'io.coil-kt:coil:2.6.0'
              implementation 'io.coil-kt:coil-video:2.6.0'

              // Media3
              def media3_version = "1.3.0"
              implementation "androidx.media3:media3-exoplayer:$media3_version"
              implementation "androidx.media3:media3-ui:$media3_version"
              implementation "androidx.media3:media3-common:$media3_version"
              implementation "androidx.media3:media3-session:$media3_version"
              implementation "androidx.media3:media3-extractor:$media3_version"
              implementation "androidx.media3:media3-decoder-ffmpeg:$media3_version"
          }
          EOF_APP_BUILD

          # 5. app/proguard-rules.pro
          cat << 'EOF_PROGUARD' > app/proguard-rules.pro
          -keep class androidx.media3.** { *; }
          -keep class com.lionplayer.app.model.** { *; }
          -keep class com.lionplayer.app.vault.** { *; }
          -keep class com.lionplayer.app.subtitle.** { *; }
          -keep class androidx.biometric.** { *; }
          -keep class androidx.security.crypto.** { *; }
          -keep class coil.** { *; }
          EOF_PROGUARD

          # 6. AndroidManifest.xml
          cat << 'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />

              <application
                  android:name=".LionPlayerApp"
                  android:allowBackup="false"
                  android:icon="@drawable/ic_lion_logo"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_lion_logo"
                  android:supportsRtl="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/Theme.LionPlayer">

                  <activity
                      android:name=".ui.SplashActivity"
                      android:theme="@style/Theme.LionPlayer.Player"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="false" />

                  <activity
                      android:name=".ui.PlayerActivity"
                      android:theme="@style/Theme.LionPlayer.Player"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:supportsPictureInPicture="true"
                      android:launchMode="singleTask"
                      android:exported="false" />

                  <!-- Secure Vault Activities -->
                  <activity
                      android:name=".ui.VaultLockActivity"
                      android:exported="false"
                      android:theme="@style/Theme.LionPlayer"
                      android:windowSoftInputMode="adjustResize" />

                  <activity
                      android:name=".ui.VaultActivity"
                      android:exported="false"
                      android:theme="@style/Theme.LionPlayer" />

                  <activity
                      android:name=".ui.VaultPlayerActivity"
                      android:exported="false"
                      android:theme="@style/Theme.LionPlayer.Player"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden" />

                  <receiver
                      android:name=".receiver.NotificationReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_PREV" />
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_PLAY_PAUSE" />
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_NEXT" />
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_CLOSE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_MANIFEST

          # 7. strings.xml
          cat << 'EOF_STRINGS' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Lion Player</string>
              <string name="tab_video">فيديو</string>
              <string name="tab_audio">صوتيات</string>
              <string name="tab_all">جميع الملفات</string>
              <string name="tab_favorites">المفضلة</string>
              <string name="action_search">بحث</string>
              <string name="action_refresh">تحديث الوسائط</string>
              <string name="action_sort">فرز حسب</string>
              <string name="action_order">ترتيب</string>
              <string name="action_display_mode">طريقة العرض</string>
              <string name="action_view_mode">أسلوب العرض</string>
              <string name="action_toggle_extension">إظهار امتداد الملفات</string>
              <string name="action_settings">الإعدادات</string>
              <string name="action_vault">الخزينة السرية</string>
              <string name="subtitles_title">إعدادات الترجمة</string>
              <string name="audio_tracks">المسارات الصوتية</string>
          </resources>
          EOF_STRINGS

          # 8. colors.xml
          cat << 'EOF_COLORS' > app/src/main/res/values/colors.xml
          <resources>
              <color name="primary">#FF9800</color>
              <color name="primary_dark">#E65100</color>
              <color name="accent">#FFB74D</color>

              <color name="app_background">#F5F5F7</color>
              <color name="app_surface">#FFFFFF</color>
              <color name="app_card">#FFFFFF</color>
              <color name="card_stroke">#E2E8F0</color>
              <color name="mini_player_bg">#EDF2F7</color>
              <color name="text_primary">#1A202C</color>
              <color name="text_secondary">#718096</color>
              <color name="divider_color">#14000000</color>

              <color name="background_dark">@color/app_background</color>
              <color name="surface_dark">@color/app_surface</color>
              <color name="card_dark">@color/app_card</color>
          </resources>
          EOF_COLORS

          # 9. values-night/colors.xml
          cat << 'EOF_COLORS_NIGHT' > app/src/main/res/values-night/colors.xml
          <resources>
              <color name="primary">#FF9800</color>
              <color name="primary_dark">#E65100</color>
              <color name="accent">#FFB74D</color>

              <color name="app_background">#121212</color>
              <color name="app_surface">#1A1A1A</color>
              <color name="app_card">#222222</color>
              <color name="card_stroke">#333333</color>
              <color name="mini_player_bg">#1E222B</color>
              <color name="text_primary">#FFFFFF</color>
              <color name="text_secondary">#A0AEC0</color>
              <color name="divider_color">#18FFFFFF</color>

              <color name="background_dark">@color/app_background</color>
              <color name="surface_dark">@color/app_surface</color>
              <color name="card_dark">@color/app_card</color>
          </resources>
          EOF_COLORS_NIGHT

          # 10. styles.xml
          cat << 'EOF_STYLES' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.LionPlayer" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:windowBackground">@color/app_background</item>
                  <item name="android:statusBarColor">@color/app_surface</item>
                  <item name="android:navigationBarColor">@color/app_surface</item>
              </style>

              <style name="Theme.LionPlayer.Player" parent="Theme.LionPlayer">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:statusBarColor">#00000000</item>
                  <item name="android:navigationBarColor">#00000000</item>
              </style>

              <style name="BottomSheetDialogTheme" parent="Theme.Design.Light.BottomSheetDialog">
                  <item name="bottomSheetStyle">@style/BottomSheetStyle</item>
              </style>

              <style name="BottomSheetStyle" parent="Widget.Design.BottomSheet.Modal">
                  <item name="android:background">@android:color/transparent</item>
              </style>

              <style name="KeypadButtonStyle">
                  <item name="android:layout_width">72dp</item>
                  <item name="android:layout_height">72dp</item>
                  <item name="android:layout_margin">8dp</item>
                  <item name="android:background">@drawable/bg_keypad_circle</item>
                  <item name="android:clickable">true</item>
                  <item name="android:focusable">true</item>
                  <item name="android:gravity">center</item>
                  <item name="android:textColor">@color/text_primary</item>
                  <item name="android:textSize">26sp</item>
                  <item name="android:textStyle">bold</item>
              </style>

              <style name="KeypadImageButtonStyle">
                  <item name="android:layout_width">72dp</item>
                  <item name="android:layout_height">72dp</item>
                  <item name="android:layout_margin">8dp</item>
                  <item name="android:background">@drawable/bg_keypad_circle</item>
                  <item name="android:clickable">true</item>
                  <item name="android:focusable">true</item>
                  <item name="android:scaleType">centerInside</item>
                  <item name="android:padding">20dp</item>
              </style>
          </resources>
          EOF_STYLES

          # 11. color_chip_text.xml
          cat << 'EOF_CHIP' > app/src/main/res/color/color_chip_text.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_selected="true" android:color="@color/primary" />
              <item android:color="@color/text_secondary" />
          </selector>
          EOF_CHIP

          # 12. Drawables
          cat << 'EOF_LOGO' > app/src/main/res/drawable/ic_lion_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
            <path
                android:fillColor="#FF9800"
                android:pathData="M48,8C25.9,8 8,25.9 8,48s17.9,40 40,40 40,-17.9 40,-40S70.1,8 48,8zM38,66V30l28,18 -28,18z"/>
          </vector>
          EOF_LOGO

          cat << 'EOF_DUR_BG' > app/src/main/res/drawable/bg_duration_badge.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#B3000000" />
              <corners android:radius="4dp" />
          </shape>
          EOF_DUR_BG

          cat << 'EOF_NEW_BG' > app/src/main/res/drawable/bg_new_badge.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#E53935" />
              <corners android:radius="3dp" />
          </shape>
          EOF_NEW_BG

          cat << 'EOF_RED_CIRCLE' > app/src/main/res/drawable/bg_badge_red_circle.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#E53935" />
          </shape>
          EOF_RED_CIRCLE

          cat << 'EOF_DEC_BG' > app/src/main/res/drawable/bg_decoder_badge.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FF9800" />
              <corners android:radius="4dp" />
          </shape>
          EOF_DEC_BG

          cat << 'EOF_D1' > app/src/main/res/drawable/ic_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="36dp"
              android:height="36dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF_D1

          cat << 'EOF_D2' > app/src/main/res/drawable/ic_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="36dp"
              android:height="36dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M6,19h4V5H6v14zm8,-14v14h4V5h-4z"/>
          </vector>
          EOF_D2

          cat << 'EOF_D3' > app/src/main/res/drawable/ic_skip_previous.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="32dp"
              android:height="32dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M6,6h2v12H6zm3.5,6l8.5,6V6z"/>
          </vector>
          EOF_D3

          cat << 'EOF_D4' > app/src/main/res/drawable/ic_skip_next.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="32dp"
              android:height="32dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M6,18l8.5,-6L6,6v12zM16,6v12h2V6h-2z"/>
          </vector>
          EOF_D4

          cat << 'EOF_D5' > app/src/main/res/drawable/ic_replay_10.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="32dp"
              android:height="32dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M12,5V1L7,6l5,5V7c3.31,0 6,2.69 6,6s-2.69,6 -6,6 -6,-2.69 -6,-6H4c0,4.42 3.58,8 8,8s8,-3.58 8,-8 -3.58,-8 -8,-8zM10.25,16.5h-1.5v-5h-1v-1.25h2.5v6.25zm4.75,0h-1.5v-6.25h1.5v6.25z"/>
          </vector>
          EOF_D5

          cat << 'EOF_D6' > app/src/main/res/drawable/ic_forward_10.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="32dp"
              android:height="32dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M12,5V1l5,5 -5,5V7c-3.31,0 -6,2.69 -6,6s2.69,6 6,6 6,-2.69 6,-6h2c0,4.42 -3.58,8 -8,8s-8,-3.58 -8,-8 3.58,-8 8,-8zM10.25,16.5h-1.5v-5h-1v-1.25h2.5v6.25zm4.75,0h-1.5v-6.25h1.5v6.25z"/>
          </vector>
          EOF_D6

          cat << 'EOF_D7' > app/src/main/res/drawable/ic_close.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/>
          </vector>
          EOF_D7

          cat << 'EOF_D8' > app/src/main/res/drawable/ic_more_vert.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zm0,2c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zm0,6c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/>
          </vector>
          EOF_D8

          cat << 'EOF_D9' > app/src/main/res/drawable/ic_favorite.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FF9800"
                android:pathData="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z"/>
          </vector>
          EOF_D9

          cat << 'EOF_D10' > app/src/main/res/drawable/ic_favorite_border.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M16.5,3c-1.74,0 -3.41,0.81 -4.5,2.09C10.91,3.81 9.24,3 7.5,3 4.42,3 2,5.42 2,8.5c0,3.78 3.4,6.86 8.55,11.54L12,21.35l1.45,-1.32C18.6,15.36 22,12.28 22,8.5 22,5.42 19.58,3 16.5,3zm-4.4,15.55l-0.1,0.1 -0.1,-0.1C7.14,14.24 4,11.39 4,8.5 4,6.5 5.5,5 7.5,5c1.54,0 3.04,0.99 3.57,2.36h1.87C13.46,5.99 14.96,5 16.5,5c2,0 3.5,1.5 3.5,3.5 0,2.89 -3.14,5.74 -7.9,10.05z"/>
          </vector>
