<?xml version="1.0" encoding="utf-8"?>
<androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:app="http://schemas.android.com/apk/res-auto"
    android:id="@+id/playerContainer"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="#000000">

    <androidx.media3.ui.PlayerView
        android:id="@+id/playerView"
        android:layout_width="match_parent"
        android:layout_height="match_parent"
        app:use_controller="false"
        app:surface_type="texture_view" />

    <LinearLayout
        android:id="@+id/layoutLyrics"
        android:layout_width="match_parent"
        android:layout_height="240dp"
        android:layout_marginStart="24dp"
        android:layout_marginEnd="24dp"
        android:background="@drawable/bg_hud"
        android:orientation="vertical"
        android:padding="16dp"
        android:visibility="gone"
        app:layout_constraintTop_toBottomOf="@id/topControls"
        app:layout_constraintBottom_toTopOf="@id/bottomControls">

        <TextView
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:gravity="center"
            android:text="كلمات الأغنية"
            android:textColor="@color/accent"
            android:textSize="14sp"
            android:textStyle="bold" />

        <ScrollView
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:layout_marginTop="8dp">

            <TextView
                android:id="@+id/tvLyrics"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:gravity="center"
                android:lineSpacingExtra="6dp"
                android:textColor="#FFFFFF"
                android:textSize="15sp" />
        </ScrollView>
    </LinearLayout>

    <!-- Top Controls: Two borderless bars -->
    <LinearLayout
        android:id="@+id/topControls"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:background="@drawable/bg_controls_gradient"
        android:orientation="vertical"
        android:paddingStart="6dp"
        android:paddingEnd="6dp"
        android:paddingTop="6dp"
        android:paddingBottom="4dp"
        app:layout_constraintTop_toTopOf="parent">

        <!-- Top Bar Primary -->
        <LinearLayout
            android:id="@+id/topBarPrimary"
            android:layout_width="match_parent"
            android:layout_height="42dp"
            android:gravity="center_vertical"
            android:orientation="horizontal">

            <ImageButton
                android:id="@+id/btnBack"
                android:layout_width="38dp"
                android:layout_height="38dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_back"
                app:tint="#FFFFFF"
                android:contentDescription="رجوع" />

            <TextView
                android:id="@+id/tvVideoTitle"
                android:layout_width="0dp"
                android:layout_height="wrap_content"
                android:layout_weight="1"
                android:layout_marginStart="8dp"
                android:layout_marginEnd="6dp"
                android:ellipsize="end"
                android:maxLines="1"
                android:textColor="#FFFFFF"
                android:textSize="14sp"
                android:textStyle="bold" />

            <TextView
                android:id="@+id/btnDecoder"
                android:layout_width="wrap_content"
                android:layout_height="22dp"
                android:layout_marginStart="4dp"
                android:layout_marginEnd="6dp"
                android:background="@drawable/bg_decoder_badge"
                android:clickable="true"
                android:focusable="true"
                android:gravity="center"
                android:paddingStart="7dp"
                android:paddingEnd="7dp"
                android:text="HW"
                android:textColor="#FFFFFF"
                android:textSize="10sp"
                android:textStyle="bold" />

            <ImageButton
                android:id="@+id/btnCast"
                android:layout_width="38dp"
                android:layout_height="38dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_cast"
                app:tint="#FFFFFF"
                android:contentDescription="بث للشاشة" />

            <ImageButton
                android:id="@+id/btnMore"
                android:layout_width="38dp"
                android:layout_height="38dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_more_vert"
                app:tint="#FFFFFF"
                android:contentDescription="الإعدادات" />
        </LinearLayout>

        <!-- Top Bar Secondary: Feature icons -->
        <LinearLayout
            android:id="@+id/topBarSecondary"
            android:layout_width="match_parent"
            android:layout_height="38dp"
            android:gravity="center_vertical|end"
            android:orientation="horizontal">

            <ImageButton
                android:id="@+id/btnRepeat"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_repeat"
                app:tint="#FFFFFF"
                android:contentDescription="تكرار المقطع" />

            <ImageButton
                android:id="@+id/btnAbRepeat"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_ab_repeat"
                app:tint="#FFFFFF"
                android:contentDescription="تكرار A-B" />

            <ImageButton
                android:id="@+id/btnSubtitles"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_subtitles"
                app:tint="#FFFFFF"
                android:contentDescription="الترجمة والمسارات" />

            <ImageButton
                android:id="@+id/btnSubtitleSync"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_sync"
                app:tint="#FFFFFF"
                android:contentDescription="مزامنة الترجمة" />

            <ImageButton
                android:id="@+id/btnSleepTimer"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_timer"
                app:tint="#FFFFFF"
                android:contentDescription="مؤقت النوم" />

            <ImageButton
                android:id="@+id/btnFavorite"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_favorite_border"
                app:tint="#FFFFFF"
                android:contentDescription="تفضيل" />

            <ImageButton
                android:id="@+id/btnEqualizer"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_equalizer"
                app:tint="#FFFFFF"
                android:contentDescription="معادل الصوت" />

            <ImageButton
                android:id="@+id/btnRotate"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_screen_rotation"
                app:tint="#FFFFFF"
                android:contentDescription="تدوير الشاشة" />

            <ImageButton
                android:id="@+id/btnPip"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_pip"
                app:tint="#FFFFFF"
                android:contentDescription="الشاشة العائمة" />

            <ImageButton
                android:id="@+id/btnLock"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_lock"
                app:tint="#FFFFFF"
                android:contentDescription="قفل الشاشة" />

            <ImageButton
                android:id="@+id/btnToggleNav"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_fullscreen"
                app:tint="#FFFFFF"
                android:contentDescription="شاشة كاملة" />

            <ImageButton
                android:id="@+id/btnLyricsToggle"
                android:layout_width="34dp"
                android:layout_height="34dp"
                android:background="?attr/selectableItemBackgroundBorderless"
                android:src="@drawable/ic_lyrics"
                app:tint="#FFFFFF"
                android:contentDescription="كلمات الأغنية" />
        </LinearLayout>
    </LinearLayout>

    <ImageButton
        android:id="@+id/btnUnlock"
        android:layout_width="56dp"
        android:layout_height="56dp"
        android:layout_margin="24dp"
        android:background="@drawable/bg_hud"
        android:src="@drawable/ic_lock_open"
        android:visibility="gone"
        app:tint="#FF9800"
        app:layout_constraintTop_toTopOf="parent"
        app:layout_constraintStart_toStartOf="parent" />

    <!-- Brightness HUD -->
    <LinearLayout
        android:id="@+id/hudBrightness"
        android:layout_width="64dp"
        android:layout_height="240dp"
        android:layout_marginStart="24dp"
        android:background="@drawable/bg_hud"
        android:gravity="center_horizontal"
        android:orientation="vertical"
        android:padding="8dp"
        android:visibility="gone"
        app:layout_constraintBottom_toBottomOf="parent"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintTop_toTopOf="parent">

        <ImageView
            android:layout_width="24dp"
            android:layout_height="24dp"
            android:src="@drawable/ic_brightness"
            app:tint="#FFFFFF" />

        <FrameLayout
            android:layout_width="24dp"
            android:layout_height="0dp"
            android:layout_weight="1"
            android:layout_marginTop="8dp"
            android:layout_marginBottom="8dp"
            android:layoutDirection="ltr">

            <ProgressBar
                android:id="@+id/brightnessProgressBar"
                style="@android:style/Widget.ProgressBar.Horizontal"
                android:layout_width="140dp"
                android:layout_height="12dp"
                android:layout_gravity="center"
                android:layoutDirection="ltr"
                android:max="100"
                android:progress="50"
                android:progressDrawable="@drawable/progress_hud"
                android:rotation="270" />
        </FrameLayout>

        <TextView
            android:id="@+id/tvBrightnessValue"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="50%"
            android:textColor="#FFFFFF"
            android:textSize="12sp"
            android:textStyle="bold" />
    </LinearLayout>

    <!-- Volume 200% HUD -->
    <LinearLayout
        android:id="@+id/hudVolume"
        android:layout_width="76dp"
        android:layout_height="240dp"
        android:layout_marginEnd="24dp"
        android:background="@drawable/bg_hud"
        android:gravity="center_horizontal"
        android:orientation="vertical"
        android:padding="8dp"
        android:visibility="gone"
        app:layout_constraintBottom_toBottomOf="parent"
        app:layout_constraintEnd_toEndOf="parent"
        app:layout_constraintTop_toTopOf="parent">

        <ImageView
            android:layout_width="24dp"
            android:layout_height="24dp"
            android:src="@drawable/ic_audiotrack"
            app:tint="#FFFFFF" />

        <FrameLayout
            android:layout_width="24dp"
            android:layout_height="0dp"
            android:layout_weight="1"
            android:layout_marginTop="8dp"
            android:layout_marginBottom="8dp"
            android:layoutDirection="ltr">

            <ProgressBar
                android:id="@+id/volumeProgressBar"
                style="@android:style/Widget.ProgressBar.Horizontal"
                android:layout_width="140dp"
                android:layout_height="12dp"
                android:layout_gravity="center"
                android:layoutDirection="ltr"
                android:max="100"
                android:progress="50"
                android:progressDrawable="@drawable/progress_hud"
                android:rotation="270" />
        </FrameLayout>

        <TextView
            android:id="@+id/tvVolumeValue"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="50%"
            android:textColor="#FFFFFF"
            android:textSize="11sp"
            android:textStyle="bold"
            android:gravity="center" />
    </LinearLayout>

    <!-- Seek Target HUD -->
    <LinearLayout
        android:id="@+id/hudSeek"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:background="@drawable/bg_hud"
        android:gravity="center"
        android:orientation="vertical"
        android:padding="16dp"
        android:visibility="gone"
        app:layout_constraintBottom_toBottomOf="parent"
        app:layout_constraintEnd_toEndOf="parent"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintTop_toTopOf="parent">

        <TextView
            android:id="@+id/tvSeekTarget"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:gravity="center"
            android:textColor="#FFFFFF"
            android:textSize="18sp"
            android:textStyle="bold" />
    </LinearLayout>

    <!-- Fast Forward HUD -->
    <LinearLayout
        android:id="@+id/hudFastForward"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:background="@drawable/bg_hud"
        android:gravity="center"
        android:orientation="horizontal"
        android:paddingStart="20dp"
        android:paddingEnd="20dp"
        android:paddingTop="12dp"
        android:paddingBottom="12dp"
        android:visibility="gone"
        app:layout_constraintTop_toTopOf="parent"
        app:layout_constraintBottom_toBottomOf="parent"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent">

        <TextView
            android:id="@+id/tvFastForwardValue"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="2x ⏩"
            android:textColor="#FF9800"
            android:textSize="20sp"
            android:textStyle="bold" />
    </LinearLayout>

    <!-- Zoom HUD -->
    <LinearLayout
        android:id="@+id/hudZoom"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:background="@drawable/bg_hud"
        android:gravity="center"
        android:orientation="horizontal"
        android:paddingStart="18dp"
        android:paddingEnd="18dp"
        android:paddingTop="10dp"
        android:paddingBottom="10dp"
        android:visibility="gone"
        app:layout_constraintTop_toTopOf="parent"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent"
        android:layout_marginTop="85dp">

        <TextView
            android:id="@+id/tvZoomValue"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="تكبير 100%"
            android:textColor="#FFFFFF"
            android:textSize="15sp"
            android:textStyle="bold" />
    </LinearLayout>

    <!-- A-B Loop HUD -->
    <LinearLayout
        android:id="@+id/hudAbLoop"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:background="@drawable/bg_hud"
        android:gravity="center"
        android:orientation="horizontal"
        android:paddingStart="16dp"
        android:paddingEnd="16dp"
        android:paddingTop="8dp"
        android:paddingBottom="8dp"
        android:visibility="gone"
        app:layout_constraintBottom_toTopOf="@id/bottomControls"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent"
        android:layout_marginBottom="12dp">

        <TextView
