          # app/src/main/java/com/lionplayer/app/data/repository/SubtitleRepository.kt
          cat << 'EOF_FILE_9' > app/src/main/java/com/lionplayer/app/data/repository/SubtitleRepository.kt
          package com.lionplayer.app.data.repository
          
          import com.lionplayer.app.data.model.SubtitleTrackItem
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          
          class SubtitleRepository {
          
              suspend fun searchOpenSubtitles(query: String): List<SubtitleTrackItem> = withContext(Dispatchers.IO) {
                  val results = mutableListOf<SubtitleTrackItem>()
                  try {
                      val encodedQuery = URLEncoder.encode(query, "UTF-8")
                      val url = URL("https://api.opensubtitles.com/api/v1/subtitles?query=$encodedQuery")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "GET"
                      conn.setRequestProperty("User-Agent", "LionPlayer v2.0")
                      conn.connectTimeout = 8000
                      conn.readTimeout = 8000
          
                      if (conn.responseCode == 200) {
                          val reader = BufferedReader(InputStreamReader(conn.inputStream))
                          val response = reader.readText()
                          reader.close()
          
                          val json = JSONObject(response)
                          val data = json.optJSONArray("data")
                          if (data != null) {
                              for (i in 0 until data.length().coerceAtMost(10)) {
                                  val item = data.getJSONObject(i)
                                  val attributes = item.optJSONObject("attributes") ?: continue
                                  val files = attributes.optJSONArray("files")
                                  val fileId = files?.optJSONObject(0)?.optString("file_id") ?: ""
                                  val lang = attributes.optString("language", "ar")
                                  val release = attributes.optString("release", "ترجمة $lang")
          
                                  results.add(
                                      SubtitleTrackItem(
                                          id = fileId,
                                          name = release,
                                          language = lang,
                                          uri = "https://api.opensubtitles.com/api/v1/download?file_id=$fileId",
                                          isEmbedded = false,
                                          format = "srt"
                                      )
                                  )
                              }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  results
              }
          
              fun findLocalSubtitles(videoPath: String): List<SubtitleTrackItem> {
                  val list = mutableListOf<SubtitleTrackItem>()
                  if (videoPath.isEmpty()) return list
                  try {
                      val videoFile = File(videoPath)
                      val parent = videoFile.parentFile ?: return list
                      val baseName = videoFile.nameWithoutExtension
          
                      parent.listFiles()?.forEach { file ->
                          val ext = file.extension.lowercase()
                          if (ext in listOf("srt", "ass", "ssa", "vtt")) {
                              if (file.nameWithoutExtension.startsWith(baseName, ignoreCase = true)) {
                                  list.add(
                                      SubtitleTrackItem(
                                          id = file.absolutePath,
                                          name = file.name,
                                          language = "ar",
                                          uri = file.absolutePath,
                                          isEmbedded = false,
                                          format = ext
                                      )
                                  )
                              }
                          }
                      }
                  } catch (e: Exception) {}
                  return list
              }
          }
          EOF_FILE_9

