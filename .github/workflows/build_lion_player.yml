          package com.lionplayer.app.ui.viewmodel
          
          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.lionplayer.app.data.model.MediaItem
          import com.lionplayer.app.data.repository.MediaRepository
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.launch
          
          class MediaViewModel(application: Application) : AndroidViewModel(application) {
          
              private val repository = MediaRepository(application)
          
              private val _videos = MutableStateFlow<List<MediaItem>>(emptyList())
              val videos: StateFlow<List<MediaItem>> = _videos
          
              private val _audios = MutableStateFlow<List<MediaItem>>(emptyList())
              val audios: StateFlow<List<MediaItem>> = _audios
          
              private val _isLoading = MutableStateFlow(false)
              val isLoading: StateFlow<Boolean> = _isLoading
          
              fun loadAllMedia() {
                  viewModelScope.launch {
                      _isLoading.value = true
                      _videos.value = repository.getVideos()
                      _audios.value = repository.getAudio()
                      _isLoading.value = false
                  }
              }
          }
