          package com.lionplayer.app.viewmodel

          import android.app.Application
          import android.content.ContentUris
          import android.content.Context
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.LiveData
          import androidx.lifecycle.MutableLiveData
          import androidx.lifecycle.viewModelScope
          import com.lionplayer.app.model.MediaItem
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          enum class SortOption {
          DATE, NAME, SIZE
          }

          class MediaViewModel(application: Application) : AndroidViewModel(application) {

          private val _rawMediaList = MutableLiveData<List<MediaItem>>(emptyList())
          private val _filteredMediaList = MutableLiveData<List<MediaItem>>(emptyList())
          val filteredMediaList: LiveData<List<MediaItem>> = _filteredMediaList

          private val _isLoading = MutableLiveData<Boolean>(false)
          val isLoading: LiveData<Boolean> = _isLoading

          var currentFilter: String = "ALL"
          var currentFolder: String? = null
          var searchQuery: String = ""
          var currentSort: SortOption = SortOption.DATE
          var isSortAscending: Boolean = false

          private val prefs = application.getSharedPreferences("lion_player_prefs", Context.MODE_PRIVATE)

          fun loadMedia() {
          viewModelScope.launch {
            _isLoading.value = true
            val items = withContext(Dispatchers.IO) {
                queryMediaStore()
            }
            _rawMediaList.value = items
            applyFilterAndSort()
            _isLoading.value = false
          }
          }

          private fun queryMediaStore(): List<MediaItem> {
          val result = mutableListOf<MediaItem>()
          val context = getApplication<Application>()
          val favoriteIds = prefs.getStringSet("favorite_ids", emptySet()) ?: emptySet()
          val playedIds = prefs.getStringSet("played_ids", emptySet()) ?: emptySet()

          // 1. Videos
          val videoProjection = arrayOf(
            MediaStore.Video.Media._ID,
            MediaStore.Video.Media.TITLE,
            MediaStore.Video.Media.DURATION,
            MediaStore.Video.Media.SIZE,
            MediaStore.Video.Media.DATE_ADDED,
            MediaStore.Video.Media.DATA
          )
          val videoUri = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
          context.contentResolver.query(videoUri, videoProjection, null, null, null)?.use { cursor ->
            val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
            val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.TITLE)
            val durCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
            val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
            val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED)
            val dataCol = cursor.getColumnIndex(MediaStore.Video.Media.DATA)

            while (cursor.moveToNext()) {
                val id = cursor.getLong(idCol)
                val title = cursor.getString(titleCol) ?: "فيديو بدون اسم"
                val duration = cursor.getLong(durCol)
                val size = cursor.getLong(sizeCol)
                val dateAdded = cursor.getLong(dateCol)
                val path = if (dataCol != -1) cursor.getString(dataCol) ?: "" else ""
                val itemUri = ContentUris.withAppendedId(videoUri, id).toString()
                val parentFolder = if (path.isNotEmpty()) {
                    File(path).parentFile?.name ?: "الرئيسي"
                } else "الرئيسي"

                val isFav = favoriteIds.contains(id.toString())
                val isNew = !playedIds.contains(id.toString())

                result.add(
                    MediaItem(
                        id = id,
                        title = title,
                        uri = itemUri,
                        duration = duration,
                        size = size,
                        dateAdded = dateAdded,
                        isVideo = true,
                        parentFolder = parentFolder,
                        artist = "فيديو",
                        album = parentFolder,
                        isFavorite = isFav,
                        path = path,
                        isNew = isNew
                    )
                )
            }
          }

          // 2. Audio
          val audioProjection = arrayOf(
            MediaStore.Audio.Media._ID,
            MediaStore.Audio.Media.TITLE,
            MediaStore.Audio.Media.DURATION,
            MediaStore.Audio.Media.SIZE,
            MediaStore.Audio.Media.DATE_ADDED,
            MediaStore.Audio.Media.ARTIST,
            MediaStore.Audio.Media.ALBUM,
            MediaStore.Audio.Media.DATA
          )
          val audioUri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
          val selection = "${MediaStore.Audio.Media.IS_MUSIC} != 0"
          context.contentResolver.query(audioUri, audioProjection, selection, null, null)?.use { cursor ->
            val idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
            val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
            val durCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
            val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.SIZE)
            val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DATE_ADDED)
            val artistCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
            val albumCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
            val dataCol = cursor.getColumnIndex(MediaStore.Audio.Media.DATA)

            while (cursor.moveToNext()) {
                val id = cursor.getLong(idCol)
                val title = cursor.getString(titleCol) ?: "صوت بدون اسم"
                val duration = cursor.getLong(durCol)
                val size = cursor.getLong(sizeCol)
                val dateAdded = cursor.getLong(dateCol)
                val artist = cursor.getString(artistCol) ?: "غير معروف"
                val album = cursor.getString(albumCol) ?: "غير معروف"
                val path = if (dataCol != -1) cursor.getString(dataCol) ?: "" else ""
                val itemUri = ContentUris.withAppendedId(audioUri, id).toString()
                val parentFolder = if (path.isNotEmpty()) {
                    File(path).parentFile?.name ?: "الرئيسي"
                } else "الرئيسي"

                val isFav = favoriteIds.contains(id.toString())
                val isNew = !playedIds.contains(id.toString())

                result.add(
                    MediaItem(
                        id = id,
                        title = title,
                        uri = itemUri,
                        duration = duration,
                        size = size,
                        dateAdded = dateAdded,
                        isVideo = false,
                        parentFolder = parentFolder,
                        artist = artist,
                        album = album,
                        isFavorite = isFav,
                        path = path,
                        isNew = isNew
                    )
                )
            }
          }

          return result
          }

          fun applyFilterAndSort() {
          val raw = _rawMediaList.value ?: return

          var list = raw

          // Filter by tab
          when (currentFilter) {
            "VIDEOS" -> list = list.filter { it.isVideo }
            "AUDIOS" -> list = list.filter { !it.isVideo }
            "FAVORITES" -> list = list.filter { it.isFavorite }
            "FOLDERS" -> {
                if (currentFolder == null) {
                    // Group into folder items
                    val folderMap = mutableMapOf<String, MutableList<MediaItem>>()
                    for (item in raw) {
                        val folder = item.parentFolder
                        folderMap.getOrPut(folder) { mutableListOf() }.add(item)
                    }
                    val folderItems = folderMap.map { (folderName, itemsInFolder) ->
                        val newestDate = itemsInFolder.maxOfOrNull { it.dateAdded } ?: 0L
                        val totalSize = itemsInFolder.sumOf { it.size }
                        val newCount = itemsInFolder.count { it.isNew }
                        val firstVideo = itemsInFolder.find { it.isVideo }
                        val thumbUri = firstVideo?.uri ?: itemsInFolder.firstOrNull()?.uri ?: ""
                        val hasVideo = itemsInFolder.any { it.isVideo }

                        MediaItem(
                            id = folderName.hashCode().toLong(),
                            title = folderName,
                            uri = thumbUri,
                            duration = 0L,
                            size = totalSize,
                            dateAdded = newestDate,
                            isVideo = hasVideo,
                            parentFolder = folderName,
                            isFolder = true,
                            itemCount = itemsInFolder.size,
                            newCount = newCount,
                            isNew = newCount > 0
                        )
                    }
                    list = folderItems
                } else {
                    list = list.filter { it.parentFolder == currentFolder }
                }
            }
          }

          // Search query
          if (searchQuery.isNotEmpty()) {
            val q = searchQuery.lowercase()
            list = list.filter {
                it.title.lowercase().contains(q) ||
                it.artist.lowercase().contains(q) ||
                it.album.lowercase().contains(q) ||
                it.parentFolder.lowercase().contains(q)
            }
          }

          // Sorting
          list = when (currentSort) {
            SortOption.DATE -> if (isSortAscending) list.sortedBy { it.dateAdded } else list.sortedByDescending { it.dateAdded }
            SortOption.NAME -> if (isSortAscending) list.sortedBy { it.title.lowercase() } else list.sortedByDescending { it.title.lowercase() }
            SortOption.SIZE -> if (isSortAscending) list.sortedBy { it.size } else list.sortedByDescending { it.size }
          }

          _filteredMediaList.value = list
          }

          fun toggleFavorite(item: MediaItem) {
          val favoriteIds = (prefs.getStringSet("favorite_ids", emptySet()) ?: emptySet()).toMutableSet()
          val idStr = item.id.toString()
          if (favoriteIds.contains(idStr)) {
            favoriteIds.remove(idStr)
            item.isFavorite = false
          } else {
            favoriteIds.add(idStr)
            item.isFavorite = true
          }
          prefs.edit().putStringSet("favorite_ids", favoriteIds).apply()
          applyFilterAndSort()
          }

          fun removeItems(items: List<MediaItem>) {
          val current = _rawMediaList.value?.toMutableList() ?: return
          val removeIds = items.map { it.id }.toSet()
          current.removeAll { removeIds.contains(it.id) }
          _rawMediaList.value = current
          applyFilterAndSort()
          }
          }

