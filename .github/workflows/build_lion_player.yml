          package com.lionplayer.app.player
          
          import android.content.Context
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.net.Uri
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.nio.ByteBuffer
          
          object AudioExtractor {
          
              suspend fun extractAudio(
                  context: Context,
                  videoUri: Uri,
                  destFile: File,
                  onProgress: (Int) -> Unit
              ): Boolean = withContext(Dispatchers.IO) {
                  val extractor = MediaExtractor()
                  var muxer: MediaMuxer? = null
                  try {
                      extractor.setDataSource(context, videoUri, null)
                      var audioTrackIndex = -1
                      var audioFormat: MediaFormat? = null
          
                      for (i in 0 until extractor.trackCount) {
                          val format = extractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("audio/")) {
                              audioTrackIndex = i
                              audioFormat = format
                              break
                          }
                      }
          
                      if (audioTrackIndex == -1 || audioFormat == null) {
                          return@withContext false
                      }
          
                      extractor.selectTrack(audioTrackIndex)
                      destFile.parentFile?.mkdirs()
          
                      muxer = MediaMuxer(destFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                      val muxerAudioTrack = muxer.addTrack(audioFormat)
                      muxer.start()
          
                      val maxBufferSize = if (audioFormat.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                          audioFormat.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE)
                      } else {
                          1024 * 1024
                      }
                      val buffer = ByteBuffer.allocate(maxBufferSize)
                      val bufferInfo = MediaCodec.BufferInfo()
          
                      val durationUs = if (audioFormat.containsKey(MediaFormat.KEY_DURATION)) {
                          audioFormat.getLong(MediaFormat.KEY_DURATION)
                      } else 1L
          
                      while (true) {
                          bufferInfo.offset = 0
                          bufferInfo.size = extractor.readSampleData(buffer, 0)
                          if (bufferInfo.size < 0) {
                              break
                          }
                          bufferInfo.presentationTimeUs = extractor.sampleTime
                          bufferInfo.flags = extractor.sampleFlags
                          muxer.writeSampleData(muxerAudioTrack, buffer, bufferInfo)
          
                          if (durationUs > 0) {
                              val progress = ((bufferInfo.presentationTimeUs.toDouble() / durationUs) * 100).toInt().coerceIn(0, 100)
                              withContext(Dispatchers.Main) { onProgress(progress) }
                          }
          
                          extractor.advance()
                      }
          
                      withContext(Dispatchers.Main) { onProgress(100) }
                      true
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  } finally {
                      try { extractor.release() } catch (e: Exception) {}
                      try {
                          muxer?.stop()
                          muxer?.release()
                      } catch (e: Exception) {}
                  }
              }
          }
