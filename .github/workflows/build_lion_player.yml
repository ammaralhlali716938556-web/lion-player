                      val encFileName = "enc_${System.currentTimeMillis()}_${mediaItem.id}.bin"
                      val targetFile = File(vaultDir, encFileName)
          
                      val master = getMasterKey(context)
                      val encryptedFile = EncryptedFile.Builder(
                          context,
                          targetFile,
                          master,
                          EncryptedFile.FileEncryptionScheme.AES256_GCM_HKDF_4KB
                      ).build()
          
                      val resolver = context.contentResolver
                      val inputStream = if (mediaItem.uri.isNotEmpty()) {
                          try {
                              resolver.openInputStream(Uri.parse(mediaItem.uri))
                          } catch (e: Exception) {
                              if (mediaItem.path.isNotEmpty() && File(mediaItem.path).exists()) {
                                  FileInputStream(File(mediaItem.path))
                              } else null
                          }
                      } else if (mediaItem.path.isNotEmpty() && File(mediaItem.path).exists()) {
                          FileInputStream(File(mediaItem.path))
                      } else null
          
                      if (inputStream == null) return@withContext false
          
                      encryptedFile.openFileOutput().use { outputStream ->
                          inputStream.use { input ->
                              input.copyTo(outputStream)
                          }
                      }
          
                      val mime = if (mediaItem.isVideo) "video/*" else "audio/*"
                      val vaultItem = VaultItem(
                          id = mediaItem.id,
                          encryptedFileName = encFileName,
                          originalTitle = mediaItem.title,
                          originalPath = mediaItem.path,
                          originalParentFolder = mediaItem.parentFolder,
                          mimeType = mime,
                          isVideo = mediaItem.isVideo,
                          size = mediaItem.size,
                          duration = mediaItem.duration,
                          dateAdded = mediaItem.dateAdded,
                          dateEncrypted = System.currentTimeMillis()
                      )
          
                      val currentItems = getVaultItems(context).toMutableList()
                      currentItems.add(0, vaultItem)
                      saveVaultItems(context, currentItems)
          
                      if (deleteOriginal) {
                          try {
                              if (mediaItem.uri.isNotEmpty()) {
                                  resolver.delete(Uri.parse(mediaItem.uri), null, null)
                              }
                              if (mediaItem.path.isNotEmpty()) {
                                  val originalFile = File(mediaItem.path)
                                  if (originalFile.exists()) {
                                      originalFile.delete()
                                  }
                              }
                          } catch (e: Exception) {}
                      }
          
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          
              suspend fun restoreMediaItem(
                  context: Context,
                  vaultItem: VaultItem
              ): Boolean = withContext(Dispatchers.IO) {
                  try {
                      val vaultDir = getVaultDir(context)
                      val encFile = File(vaultDir, vaultItem.encryptedFileName)
                      if (!encFile.exists()) return@withContext false
          
                      val master = getMasterKey(context)
                      val encryptedFile = EncryptedFile.Builder(
                          context,
                          encFile,
                          master,
                          EncryptedFile.FileEncryptionScheme.AES256_GCM_HKDF_4KB
                      ).build()
          
                      val resolver = context.contentResolver
                      val isVideo = vaultItem.isVideo
                      val collectionUri = if (isVideo) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                          } else {
                              MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                          }
                      } else {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              MediaStore.Audio.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                          } else {
                              MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                          }
                      }
          
                      val fileName = vaultItem.originalTitle
                      val targetFolder = if (vaultItem.originalParentFolder.isNotEmpty()) vaultItem.originalParentFolder else "LionPlayer"
                      val relativeDir = if (isVideo) "Movies/$targetFolder" else "Music/$targetFolder"
          
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                          put(MediaStore.MediaColumns.MIME_TYPE, vaultItem.mimeType)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(MediaStore.MediaColumns.RELATIVE_PATH, relativeDir)
                              put(MediaStore.MediaColumns.IS_PENDING, 1)
                          }
                      }
          
                      val newUri = resolver.insert(collectionUri, values) ?: return@withContext false
          
                      encryptedFile.openFileInput().use { input ->
                          resolver.openOutputStream(newUri)?.use { output ->
                              input.copyTo(output)
                          }
                      }
          
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          values.clear()
                          values.put(MediaStore.MediaColumns.IS_PENDING, 0)
                          resolver.update(newUri, values, null, null)
                      }
          
                      encFile.delete()
                      val currentItems = getVaultItems(context).filter { it.id != vaultItem.id }
                      saveVaultItems(context, currentItems)
          
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          
              suspend fun deleteVaultItem(
                  context: Context,
                  vaultItem: VaultItem
              ): Boolean = withContext(Dispatchers.IO) {
                  try {
                      val vaultDir = getVaultDir(context)
                      val encFile = File(vaultDir, vaultItem.encryptedFileName)
                      if (encFile.exists()) {
                          encFile.delete()
                      }
                      val currentItems = getVaultItems(context).filter { it.id != vaultItem.id }
                      saveVaultItems(context, currentItems)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          
