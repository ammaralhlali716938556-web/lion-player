          # 14. Layouts
          cat << 'EOF' > app/src/main/res/layout/activity_splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/app_background">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:orientation="vertical"
                  android:padding="24dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <ImageView
                      android:id="@+id/ivSplashLogo"
                      android:layout_width="160dp"
                      android:layout_height="160dp"
                      android:src="@drawable/ic_lion_logo"
                      android:contentDescription="@string/app_name" />

                  <TextView
                      android:id="@+id/tvSplashName"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:text="@string/app_name"
                      android:textColor="@color/primary"
                      android:textSize="32sp"
                      android:textStyle="bold"
                      android:letterSpacing="0.05" />
              </LinearLayout>

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true"
              android:background="@color/app_background">

              <com.google.android.material.appbar.MaterialToolbar
                  android:id="@+id/topToolbar"
                  android:layout_width="match_parent"
                  android:layout_height="?attr/actionBarSize"
                  android:background="@color/app_surface"
                  app:title="@string/app_name"
                  app:titleTextColor="@color/text_primary"
                  app:layout_constraintTop_toTopOf="parent" />

              <LinearLayout
                  android:id="@+id/selectionBar"
                  android:layout_width="match_parent"
                  android:layout_height="?attr/actionBarSize"
                  android:background="@color/app_surface"
                  android:gravity="center_vertical"
                  android:paddingStart="8dp"
                  android:paddingEnd="8dp"
                  android:visibility="gone"
                  app:layout_constraintTop_toTopOf="parent">

                  <ImageButton
                      android:id="@+id/btnCancelSelection"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_close"
                      app:tint="@color/text_primary" />

                  <TextView
                      android:id="@+id/tvSelectionCount"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="8dp"
                      android:text="تم تحديد 1"
                      android:textColor="@color/text_primary"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <ImageButton
                      android:id="@+id/btnFavoriteSelected"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_favorite"
                      app:tint="@color/primary"
                      android:contentDescription="تفضيل" />

                  <ImageButton
                      android:id="@+id/btnSelectAll"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_all_files"
                      app:tint="@color/text_primary" />

                  <ImageButton
                      android:id="@+id/btnCopySelected"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_copy"
                      app:tint="@color/text_primary" />

                  <ImageButton
                      android:id="@+id/btnMoveSelected"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_move"
                      app:tint="@color/text_primary" />

                  <ImageButton
                      android:id="@+id/btnDeleteSelected"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_close"
                      app:tint="#F44336" />
              </LinearLayout>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvMedia"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:clipToPadding="false"
                  app:layout_constraintTop_toBottomOf="@id/topToolbar"
                  app:layout_constraintBottom_toTopOf="@id/pasteBar" />

              <TextView
                  android:id="@+id/tvEmptyState"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="لا توجد ملفات للعرض"
                  android:textColor="@color/text_secondary"
                  android:textSize="16sp"
                  android:visibility="gone"
                  app:layout_constraintTop_toTopOf="@id/rvMedia"
                  app:layout_constraintBottom_toBottomOf="@id/rvMedia"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <LinearLayout
                  android:id="@+id/pasteBar"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:background="@color/app_surface"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toTopOf="@id/miniPlayerLayout">

                  <ImageView
                      android:id="@+id/ivPasteIcon"
                      android:layout_width="24dp"
                      android:layout_height="24dp"
                      android:src="@drawable/ic_paste"
                      app:tint="@color/primary" />

                  <TextView
                      android:id="@+id/tvPasteStatus"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="8dp"
                      android:layout_marginEnd="8dp"
                      android:ellipsize="end"
