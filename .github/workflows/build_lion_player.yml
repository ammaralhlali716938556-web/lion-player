    private fun showSubtitlesDialog() {
        val dialogView = LayoutInflater.from(this).inflate(R.layout.dialog_subtitles, null)
        val tvSubOffset = dialogView.findViewById<TextView>(R.id.tvSubOffset)
        val btnMinus = dialogView.findViewById<Button>(R.id.btnSubMinus100)
        val btnPlus = dialogView.findViewById<Button>(R.id.btnSubPlus100)
        val btnLoadLocal = dialogView.findViewById<Button>(R.id.btnLoadLocalSubtitle)
        val btnSearchOnline = dialogView.findViewById<Button>(R.id.btnSearchOnlineSubtitles)

        tvSubOffset.text = "${LionPlayerManager.subtitleSyncEngine.subtitleOffsetMs} ms"

        btnMinus.setOnClickListener {
            val offset = LionPlayerManager.subtitleSyncEngine.adjustSubtitleOffset(-100)
            tvSubOffset.text = "$offset ms"
            Toast.makeText(this, "تأخير الترجمة: $offset ms", Toast.LENGTH_SHORT).show()
        }

        btnPlus.setOnClickListener {
            val offset = LionPlayerManager.subtitleSyncEngine.adjustSubtitleOffset(100)
            tvSubOffset.text = "$offset ms"
            Toast.makeText(this, "تقديم الترجمة: $offset ms", Toast.LENGTH_SHORT).show()
