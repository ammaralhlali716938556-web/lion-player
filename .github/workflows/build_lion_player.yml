          package com.lion.player.ui

          import android.Manifest
          import android.content.ContentUris
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.lion.player.adapter.VideoAdapter
          import com.lion.player.databinding.ActivityMainBinding
          import com.lion.player.model.VideoItem

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private lateinit var videoAdapter: VideoAdapter
              private val videoList = mutableListOf<VideoItem>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  setupRecyclerView()
                  setupBottomNav()
                  checkPermissionsAndLoad()

                  binding.swipeRefresh.setOnRefreshListener {
                      loadLocalVideos()
                      binding.swipeRefresh.isRefreshing = false
                  }
              }

              private fun setupRecyclerView() {
                  videoAdapter = VideoAdapter(
                      onVideoClick = { video ->
                          val intent = Intent(this, PlayerActivity::class.java).apply {
                              putExtra("VIDEO_URI", video.uri.toString())
                              putExtra("VIDEO_TITLE", video.title)
                          }
                          startActivity(intent)
                      },
                      onVideoLongClick = { video ->
                          showMediaActionsDialog(video)
                      }
                  )
                  binding.recyclerViewMedia.layoutManager = LinearLayoutManager(this)
                  binding.recyclerViewMedia.adapter = videoAdapter
              }

              private fun setupBottomNav() {
                  binding.bottomNavigation.setOnItemSelectedListener { item ->
                      when (item.itemId) {
                          com.lion.player.R.id.nav_local -> {
                              loadLocalVideos()
                              true
                          }
                          com.lion.player.R.id.nav_stream -> {
                              showStreamDialog()
                              true
                          }
                          com.lion.player.R.id.nav_music -> {
                              Toast.makeText(this, "تبويب الموسيقى والصوتيات", Toast.LENGTH_SHORT).show()
                              true
                          }
                          else -> false
                      }
                  }
              }

              private fun checkPermissionsAndLoad() {
                  val permissions = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      arrayOf(Manifest.permission.READ_MEDIA_VIDEO, Manifest.permission.READ_MEDIA_AUDIO)
                  } else {
                      arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }

                  val needReq = permissions.any {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (needReq) {
                      ActivityCompat.requestPermissions(this, permissions, 1001)
                  } else {
                      loadLocalVideos()
                  }
              }

              private fun loadLocalVideos() {
                  videoList.clear()
                  val projection = arrayOf(
                      MediaStore.Video.Media._ID,
                      MediaStore.Video.Media.TITLE,
                      MediaStore.Video.Media.DATA,
                      MediaStore.Video.Media.DURATION,
                      MediaStore.Video.Media.SIZE,
                      MediaStore.Video.Media.RESOLUTION,
                      MediaStore.Video.Media.BUCKET_DISPLAY_NAME
                  )

                  val sortOrder = "${MediaStore.Video.Media.DATE_ADDED} DESC"
                  val cursor = contentResolver.query(
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                      projection, null, null, sortOrder
                  )

                  cursor?.use {
                      val idCol = it.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                      val titleCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.TITLE)
                      val dataCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                      val durCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                      val sizeCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                      val resCol = it.getColumnIndex(MediaStore.Video.Media.RESOLUTION)
                      val folderCol = it.getColumnIndex(MediaStore.Video.Media.BUCKET_DISPLAY_NAME)

                      while (it.moveToNext()) {
                          val id = it.getLong(idCol)
                          val title = it.getString(titleCol) ?: "Unknown"
                          val path = it.getString(dataCol) ?: ""
                          val duration = it.getLong(durCol)
                          val size = it.getLong(sizeCol)
                          val resolution = if (resCol != -1) it.getString(resCol) ?: "HD" else "HD"
                          val folder = if (folderCol != -1) it.getString(folderCol) ?: "Local" else "Local"
                          val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)

                          videoList.add(VideoItem(id, title, path, uri, duration, size, resolution, folder))
                      }
                  }
                  videoAdapter.submitList(videoList)
              }

              private fun showStreamDialog() {
                  val input = android.widget.EditText(this).apply {
                      hint = "https://example.com/stream.m3u8"
                  }
                  AlertDialog.Builder(this)
                      .setTitle("تشغيل رابط عبر الإنترنت (Stream)")
                      .setView(input)
                      .setPositiveButton("تشغيل") { _, _ ->
                          val url = input.text.toString().trim()
                          if (url.isNotEmpty()) {
                              val intent = Intent(this, PlayerActivity::class.java).apply {
                                  putExtra("VIDEO_URI", url)
                                  putExtra("VIDEO_TITLE", "Online Stream")
                              }
                              startActivity(intent)
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun showMediaActionsDialog(video: VideoItem) {
                  val options = arrayOf("مشاركة", "الخصائص")
                  AlertDialog.Builder(this)
                      .setTitle(video.title)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> {
                                  val share = Intent(Intent.ACTION_SEND).apply {
                                      type = "video/*"
                                      putExtra(Intent.EXTRA_STREAM, video.uri)
                                  }
                                  startActivity(Intent.createChooser(share, "مشاركة الفيديو"))
                              }
                              1 -> {
                                  AlertDialog.Builder(this)
                                      .setTitle("خصائص الفيديو")
                                      .setMessage("الاسم: ${video.title}\nالمسار: ${video.path}\nالحجم: ${video.size / (1024*1024)} MB\nالدقة: ${video.resolution}")
                                      .setPositiveButton("حسناً", null)
                                      .show()
                              }
                          }
                      }.show()
              }
          }
