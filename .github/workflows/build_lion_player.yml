          class VaultPlayerActivity : AppCompatActivity() {

          private lateinit var binding: ActivityVaultPlayerBinding
          private var player: ExoPlayer? = null
          private var tempFilePath: String? = null
          private val handler = Handler(Looper.getMainLooper())

          private val progressRunnable = object : Runnable {
          override fun run() {
            player?.let { p ->
                if (p.isPlaying) {
                    val curr = p.currentPosition
                    val total = p.duration.coerceAtLeast(0L)
                    binding.sbVaultProgress.max = total.toInt()
                    binding.sbVaultProgress.progress = curr.toInt()
                    binding.tvVaultCurrentTime.text = formatDuration(curr)
                    binding.tvVaultTotalTime.text = formatDuration(total)
                }
            }
            handler.postDelayed(this, 300)
          }
          }

          override fun onCreate(savedInstanceState: Bundle?) {
          super.onCreate(savedInstanceState)
          window.setFlags(
            WindowManager.LayoutParams.FLAG_SECURE,
            WindowManager.LayoutParams.FLAG_SECURE
          )

          binding = ActivityVaultPlayerBinding.inflate(layoutInflater)
          setContentView(binding.root)

          val item = intent.getSerializableExtra("EXTRA_VAULT_ITEM") as? VaultItem
          tempFilePath = intent.getStringExtra("EXTRA_TEMP_PATH")

          binding.tvVaultPlayerTitle.text = item?.originalName ?: "معاينة مشفرة"
          binding.btnVaultPlayerBack.setOnClickListener { finish() }

          if (tempFilePath != null && File(tempFilePath!!).exists()) {
            player = ExoPlayer.Builder(this).build()
            binding.vaultPlayerView.player = player
            val mediaItem = MediaItem.fromUri(android.net.Uri.fromFile(File(tempFilePath!!)))
            player?.setMediaItem(mediaItem)
            player?.prepare()
            player?.play()

            binding.btnVaultPlayPause.setOnClickListener {
                player?.let { p ->
                    if (p.isPlaying) {
                        p.pause()
                        binding.btnVaultPlayPause.setImageResource(R.drawable.ic_play)
                    } else {
                        p.play()
                        binding.btnVaultPlayPause.setImageResource(R.drawable.ic_pause)
                    }
                }
            }

            binding.sbVaultProgress.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                    if (fromUser) {
                        player?.seekTo(progress.toLong())
                        binding.tvVaultCurrentTime.text = formatDuration(progress.toLong())
                    }
                }
                override fun onStartTrackingTouch(sb: SeekBar?) {}
                override fun onStopTrackingTouch(sb: SeekBar?) {}
            })

            handler.post(progressRunnable)
          } else {
            finish()
          }
          }

          private fun formatDuration(durationMs: Long): String {
          val totalSec = durationMs / 1000
          val sec = totalSec % 60
          val min = (totalSec / 60) % 60
          val hrs = totalSec / 3600
          return if (hrs > 0) {
            String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
          } else {
            String.format(Locale.US, "%02d:%02d", min, sec)
          }
          }

          override fun onDestroy() {
          super.onDestroy()
          handler.removeCallbacks(progressRunnable)
          player?.release()
          player = null
          tempFilePath?.let { path ->
            try {
                val f = File(path)
                if (f.exists()) f.delete()
            } catch (e: Exception) {}
          }
          }
          }

