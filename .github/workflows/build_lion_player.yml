                              initialVolumePercent = LionPlayerManager.effectsController?.currentVolumePercent ?: 100f
                              initialBrightness = window.attributes.screenBrightness.coerceAtLeast(0.5f)
          
                              if (event.pointerCount == 1 && videoScale <= 1.05f && LionPlayerManager.player?.isPlaying == true) {
                                  handler.postDelayed(longPressRunnable, 400)
