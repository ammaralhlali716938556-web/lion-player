                      "النوع: " + (if (item.isVideo) "فيديو" else "صوتيات") + "\n" +
                      "الألبوم: " + item.album + "\n" +
                      "الفنان: " + item.artist + "\n" +
                      "الحجم: " + sizeMb + "\n" +
                      "المدة: " + durStr + "\n" +
                      "تاريخ الإضافة: " + dateStr
          
                  AlertDialog.Builder(this)
                      .setTitle("خصائص المقطع")
                      .setMessage(message)
                      .setPositiveButton("إغلاق", null)
                      .show()
              }
          
