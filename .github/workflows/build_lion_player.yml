          class IptvActivity : AppCompatActivity() {
          
              private lateinit var binding: ActivityIptvBinding
              private val iptvRepo = IptvRepository()
              private val allChannels = mutableListOf<IptvChannel>()
              private lateinit var iptvAdapter: IptvAdapter
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityIptvBinding.inflate(layoutInflater)
                  setContentView(binding.root)
          
                  binding.toolbarIptv.setNavigationOnClickListener { finish() }
          
                  iptvAdapter = IptvAdapter(emptyList()) { channel ->
                      playChannel(channel)
                  }
                  binding.rvIptvChannels.layoutManager = LinearLayoutManager(this)
                  binding.rvIptvChannels.adapter = iptvAdapter
          
                  binding.btnLoadM3u.setOnClickListener { showLoadDialog() }
          
                  binding.etIptvSearch.addTextChangedListener { text ->
                      val query = text?.toString().orEmpty()
                      val filtered = allChannels.filter { it.name.contains(query, ignoreCase = true) || it.group.contains(query, ignoreCase = true) }
                      iptvAdapter.updateChannels(filtered)
                  }
              }
          
              private fun showLoadDialog() {
                  val input = EditText(this).apply {
                      hint = "أدخل رابط قائمة M3U أو M3U8..."
                      setText("https://iptv-org.github.io/iptv/index.m3u")
                  }
                  AlertDialog.Builder(this)
                      .setTitle("تحميل قنوات IPTV")
                      .setView(input)
                      .setPositiveButton("تحميل") { _, _ ->
                          val url = input.text.toString().trim()
                          if (url.isNotEmpty()) {
                              loadM3uUrl(url)
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }
          
              private fun loadM3uUrl(url: String) {
                  Toast.makeText(this, "جاري جلب القنوات وتحليلها...", Toast.LENGTH_SHORT).show()
                  lifecycleScope.launch {
                      try {
                          val list = iptvRepo.parseFromUrl(url)
                          allChannels.clear()
                          allChannels.addAll(list)
                          iptvAdapter.updateChannels(allChannels)
                          Toast.makeText(this@IptvActivity, "تم تحميل ${list.size} قناة بنجاح", Toast.LENGTH_LONG).show()
                      } catch (e: Exception) {
                          Toast.makeText(this@IptvActivity, "فشل في تحميل القائمة: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }
          
              private fun playChannel(channel: IptvChannel) {
                  val mediaItem = MediaItem(
                      id = channel.streamUrl.hashCode().toLong(),
                      title = channel.name,
                      uri = channel.streamUrl,
                      duration = 0L,
                      size = 0L,
                      dateAdded = System.currentTimeMillis() / 1000,
                      isVideo = true,
                      parentFolder = channel.group
                  )
                  val intent = Intent(this, PlayerActivity::class.java).apply {
                      putExtra("PLAYLIST", arrayListOf(mediaItem))
                      putExtra("CURRENT_INDEX", 0)
                  }
                  startActivity(intent)
              }
          }
