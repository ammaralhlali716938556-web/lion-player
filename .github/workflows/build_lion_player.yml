                      binding.tvVaultTitle.text = item.originalTitle
                      val typeStr = if (item.isVideo) "فيديو" else "صوت"
                      val sizeStr = formatFileSize(item.size)
                      val durStr = if (item.duration > 0) formatDuration(item.duration) else ""
                      val detailStr = if (durStr.isNotEmpty()) "$typeStr • $durStr • $sizeStr" else "$typeStr • $sizeStr"
                      binding.tvVaultDetails.text = detailStr
          
