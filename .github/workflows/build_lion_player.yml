          package com.lionplayer.app.ui
          
          import android.app.Activity
          import android.content.Context
          import android.graphics.Color
          import android.util.TypedValue
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import com.lionplayer.app.LionPlayerApp
          import com.lionplayer.app.player.LionPlayerManager
          import com.lionplayer.app.player.SleepTimerManager
          
          object PlayerSettingsBottomSheet {
          
              fun show(
                  activity: Activity,
                  onEqualizerClick: (() -> Unit)? = null,
                  onVolumeBoostChanged: ((Boolean) -> Unit)? = null,
                  onSettingChanged: (() -> Unit)? = null,
                  onAudioExtractorClick: (() -> Unit)? = null
              ) {
                  val prefs = activity.getSharedPreferences("lion_player_prefs", Context.MODE_PRIVATE)
                  val builder = AlertDialog.Builder(activity)
                  builder.setTitle("إعدادات المشغل والتطبيق")
          
                  val typedValue = TypedValue()
                  activity.theme.resolveAttribute(android.R.attr.textColorPrimary, typedValue, true)
                  val primaryTextColor = if (typedValue.resourceId != 0) {
                      androidx.core.content.ContextCompat.getColor(activity, typedValue.resourceId)
                  } else typedValue.data
          
                  val scroll = ScrollView(activity)
                  val layout = LinearLayout(activity).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 24, 32, 24)
                  }
          
                  fun createHeader(title: String): TextView {
                      return TextView(activity).apply {
                          text = title
                          setTextColor(Color.parseColor("#FF9800"))
                          textSize = 14f
                          paint.isFakeBoldText = true
                          setPadding(0, 16, 0, 8)
                      }
                  }
          
                  // 1. Theme
                  layout.addView(createHeader("مظهر التطبيق (السمة):"))
                  val themeModes = arrayOf("dark", "light", "system")
                  val themeLabels = arrayOf("داكن (AMOLED Pitch Black)", "فاتح", "النظام")
                  var currentTheme = prefs.getString("theme_mode", "dark") ?: "dark"
                  val themeSpinner = Spinner(activity)
                  themeSpinner.adapter = ArrayAdapter(activity, android.R.layout.simple_spinner_dropdown_item, themeLabels)
                  themeSpinner.setSelection(themeModes.indexOf(currentTheme).coerceAtLeast(0))
                  themeSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p0: AdapterView<*>?, p1: View?, position: Int, p3: Long) {
                          val selected = themeModes[position]
                          if (currentTheme != selected) {
                              currentTheme = selected
                              prefs.edit().putString("theme_mode", selected).apply()
                              LionPlayerApp.applyTheme(selected)
                          }
                      }
                      override fun onNothingSelected(p0: AdapterView<*>?) {}
                  }
                  layout.addView(themeSpinner)
          
                  // 2. Audio Boost
                  layout.addView(createHeader("الصوت والمؤثرات:"))
                  val switchBoost = Switch(activity).apply {
                      text = "مضاعفة الصوت حتى 200% (تعزيز نقي مع مانع التشويه DRC)"
                      isChecked = prefs.getBoolean("volume_boost_enabled", false)
                      setTextColor(primaryTextColor)
                      setOnCheckedChangeListener { _, isChecked ->
                          prefs.edit().putBoolean("volume_boost_enabled", isChecked).apply()
                          onVolumeBoostChanged?.invoke(isChecked)
                          onSettingChanged?.invoke()
                      }
                  }
                  layout.addView(switchBoost)
          
                  if (onEqualizerClick != null) {
                      val tvEq = TextView(activity).apply {
                          text = "فتح معادل الصوت والمؤثرات (Equalizer & 3D Reverb) ❯"
                          setTextColor(Color.parseColor("#FF9800"))
                          textSize = 14f
                          setPadding(0, 12, 0, 8)
                          setOnClickListener { onEqualizerClick.invoke() }
                      }
                      layout.addView(tvEq)
                  }
          
                  // 3. Sleep Timer
                  layout.addView(createHeader("مؤقت النوم الإيقافي (Sleep Timer):"))
                  val sleepTimerBtn = Button(activity).apply {
                      val status = if (SleepTimerManager.isTimerActive) "مؤقت النوم يعمل (${SleepTimerManager.remainingMinutes} دقيقة) - اضغط للإلغاء" else "ضبط مؤقت النوم (15د، 30د، 60د)"
                      text = status
                      setOnClickListener {
                          if (SleepTimerManager.isTimerActive) {
                              SleepTimerManager.cancelTimer()
                              text = "ضبط مؤقت النوم (15د، 30د، 60د)"
                              Toast.makeText(activity, "تم إلغاء مؤقت النوم", Toast.LENGTH_SHORT).show()
                          } else {
                              val options = arrayOf("15 دقيقة", "30 دقيقة", "60 دقيقة")
                              val minutes = arrayOf(15, 30, 60)
                              AlertDialog.Builder(activity)
                                  .setTitle("اختر مدة النوم:")
                                  .setItems(options) { _, which ->
                                      SleepTimerManager.startTimer(LionPlayerManager.player, minutes[which]) {
                                          Toast.makeText(activity, "انتهى مؤقت النوم، تم إيقاف التشغيل بسلاسة", Toast.LENGTH_LONG).show()
                                      }
                                      text = "مؤقت النوم يعمل (${minutes[which]} دقيقة) - اضغط للإلغاء"
                                      Toast.makeText(activity, "تم تفعيل مؤقت النوم لمدة ${options[which]}", Toast.LENGTH_SHORT).show()
                                  }
                                  .show()
                          }
                      }
                  }
                  layout.addView(sleepTimerBtn)
          
                  // 4. Video to Audio Converter
                  if (onAudioExtractorClick != null) {
                      layout.addView(createHeader("تحويل وقص الوسائط:"))
                      val btnExtract = Button(activity).apply {
                          text = "استخراج الصوت من الفيديو الحالي (.m4a / .mp3)"
                          setOnClickListener { onAudioExtractorClick.invoke() }
                      }
                      layout.addView(btnExtract)
                  }
          
                  // 5. Long Press Fast Forward Speed
                  layout.addView(createHeader("سرعة الضغط المطول للتسريع:"))
                  val speedLabels = arrayOf("1.5x", "2.0x", "3.0x")
                  val speedValues = floatArrayOf(1.5f, 2.0f, 3.0f)
                  val speedSpinner = Spinner(activity)
                  speedSpinner.adapter = ArrayAdapter(activity, android.R.layout.simple_spinner_dropdown_item, speedLabels)
                  val savedSpeed = prefs.getFloat("long_press_speed", 2.0f)
                  val idx = if (savedSpeed == 1.5f) 0 else if (savedSpeed == 3.0f) 2 else 1
                  speedSpinner.setSelection(idx)
                  speedSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p0: AdapterView<*>?, p1: View?, position: Int, p3: Long) {
                          prefs.edit().putFloat("long_press_speed", speedValues[position]).apply()
                      }
                      override fun onNothingSelected(p0: AdapterView<*>?) {}
                  }
                  layout.addView(speedSpinner)
          
                  scroll.addView(layout)
                  builder.setView(scroll)
                  builder.setPositiveButton("تم", null)
                  builder.show()
              }
          }
