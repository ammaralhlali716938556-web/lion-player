          package com.lionplayer.app.ui
          
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.lionplayer.app.R
          import com.lionplayer.app.adapter.VaultAdapter
          import com.lionplayer.app.databinding.ActivityVaultBinding
          import com.lionplayer.app.model.MediaItem
          import com.lionplayer.app.model.VaultItem
          import com.lionplayer.app.security.VaultManager
          import kotlinx.coroutines.launch
          import java.io.File
          
          class VaultActivity : AppCompatActivity() {
          
              private lateinit var binding: ActivityVaultBinding
              private lateinit var vaultAdapter: VaultAdapter
              private var allVaultItems: List<VaultItem> = emptyList()
              private var currentFilterMode = 0 // 0: all, 1: videos, 2: audios
          
              private val mediaPickerLauncher = registerForActivityResult(
                  ActivityResultContracts.GetMultipleContents()
              ) { uris ->
                  if (uris.isNotEmpty()) {
                      importUrisToVault(uris)
                  }
              }
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // Activate FLAG_SECURE to prevent screenshots and screen recordings
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  )
          
                  binding = ActivityVaultBinding.inflate(layoutInflater)
                  setContentView(binding.root)
          
                  setupToolbar()
                  setupRecyclerView()
                  setupFilters()
          
                  loadVaultData()
              }
          
              private fun setupToolbar() {
                  binding.vaultToolbar.setNavigationOnClickListener { finish() }
                  binding.vaultToolbar.title = getString(R.string.vault_title)
                  binding.btnAddFiles.setOnClickListener { openMediaPicker() }
                  binding.btnAddFilesEmpty.setOnClickListener { openMediaPicker() }
              }
          
              private fun setupRecyclerView() {
                  binding.rvVaultMedia.layoutManager = LinearLayoutManager(this)
                  vaultAdapter = VaultAdapter(
                      items = emptyList(),
                      onItemClick = { item -> playVaultItem(item) },
                      onRestoreClick = { item -> confirmRestore(item) },
                      onDeleteClick = { item -> confirmDelete(item) }
                  )
                  binding.rvVaultMedia.adapter = vaultAdapter
              }
          
              private fun setupFilters() {
                  binding.filterAll.isSelected = true
          
                  binding.filterAll.setOnClickListener {
                      currentFilterMode = 0
                      updateFilterSelection()
                      filterAndDisplayList()
                  }
                  binding.filterVideos.setOnClickListener {
                      currentFilterMode = 1
                      updateFilterSelection()
                      filterAndDisplayList()
                  }
                  binding.filterAudios.setOnClickListener {
                      currentFilterMode = 2
                      updateFilterSelection()
                      filterAndDisplayList()
                  }
              }
          
              private fun updateFilterSelection() {
                  binding.filterAll.isSelected = (currentFilterMode == 0)
                  binding.filterVideos.isSelected = (currentFilterMode == 1)
                  binding.filterAudios.isSelected = (currentFilterMode == 2)
              }
          
              private fun loadVaultData() {
                  allVaultItems = VaultManager.getVaultItems(this)
                  filterAndDisplayList()
              }
          
              private fun filterAndDisplayList() {
                  val filtered = when (currentFilterMode) {
                      1 -> allVaultItems.filter { it.isVideo }
                      2 -> allVaultItems.filter { !it.isVideo }
                      else -> allVaultItems
                  }
          
                  vaultAdapter.updateData(filtered)
                  if (filtered.isEmpty()) {
                      binding.layoutEmptyVault.visibility = View.VISIBLE
                      binding.rvVaultMedia.visibility = View.GONE
                  } else {
                      binding.layoutEmptyVault.visibility = View.GONE
                      binding.rvVaultMedia.visibility = View.VISIBLE
                  }
              }
          
              private fun openMediaPicker() {
                  mediaPickerLauncher.launch("*/*")
              }
          
              private fun importUrisToVault(uris: List<Uri>) {
                  binding.pbVaultLoading.visibility = View.VISIBLE
                  lifecycleScope.launch {
                      var successCount = 0
                      for (uri in uris) {
                          try {
                              val cr = contentResolver
                              val mime = cr.getType(uri) ?: ""
                              val isVideo = mime.startsWith("video")
                              val name = getFileNameFromUri(uri)
          
                              val item = MediaItem(
                                  id = System.currentTimeMillis() + (0..999).random(),
                                  title = name,
                                  uri = uri.toString(),
                                  duration = 0L,
                                  size = 0L,
                                  dateAdded = System.currentTimeMillis() / 1000L,
                                  isVideo = isVideo,
                                  parentFolder = "مستورد",
                                  path = ""
                              )
          
                              val success = VaultManager.encryptMediaItem(this@VaultActivity, item, deleteOriginal = false)
                              if (success) successCount++
                          } catch (e: Exception) {}
                      }
          
                      binding.pbVaultLoading.visibility = View.GONE
                      loadVaultData()
                      Toast.makeText(this@VaultActivity, "تم تشفير وإخفاء ($successCount) ملفات بنجاح 🔒", Toast.LENGTH_SHORT).show()
                  }
              }
          
              private fun getFileNameFromUri(uri: Uri): String {
                  var name = "encrypted_media_${System.currentTimeMillis()}"
                  try {
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIndex = cursor.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME)
                          if (cursor.moveToFirst() && nameIndex != -1) {
                              name = cursor.getString(nameIndex)
                          }
                      }
                  } catch (e: Exception) {}
