          add('app/src/main/res/layout/activity_main.xml',
          """\
          <?xml version=\"1.0\" encoding=\"utf-8\"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"
              xmlns:app=\"http://schemas.android.com/apk/res-auto\"
              android:layout_width=\"match_parent\"
              android:layout_height=\"match_parent\"
              android:background=\"@color/app_background\"
              android:fitsSystemWindows=\"true\">

              <com.google.android.material.appbar.MaterialToolbar
                  android:id=\"@+id/topToolbar\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"?attr/actionBarSize\"
                  android:background=\"@color/app_surface\"
                  app:layout_constraintTop_toTopOf=\"parent\"
                  app:title=\"@string/app_name\"
                  app:titleTextColor=\"@color/text_primary\" />

              <androidx.recyclerview.widget.RecyclerView
                  android:id=\"@+id/rvMedia\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"0dp\"
                  android:clipToPadding=\"false\"
                  android:paddingBottom=\"8dp\"
                  app:layout_constraintBottom_toTopOf=\"@id/selectionBar\"
                  app:layout_constraintTop_toBottomOf=\"@id/topToolbar\" />

              <TextView
                  android:id=\"@+id/tvEmptyState\"
                  android:layout_width=\"wrap_content\"
                  android:layout_height=\"wrap_content\"
                  android:drawablePadding=\"10dp\"
                  android:gravity=\"center\"
                  android:padding=\"24dp\"
                  android:text=\"@string/vault_empty\"
                  android:textColor=\"@color/text_secondary\"
                  android:textSize=\"15sp\"
                  android:visibility=\"gone\"
                  app:drawableTopCompat=\"@drawable/ic_video\"
                  app:layout_constraintBottom_toBottomOf=\"@id/rvMedia\"
                  app:layout_constraintEnd_toEndOf=\"@id/rvMedia\"
                  app:layout_constraintStart_toStartOf=\"@id/rvMedia\"
                  app:layout_constraintTop_toTopOf=\"@id/rvMedia\" />

              <!-- =================== Selection action bar =================== -->
              <LinearLayout
                  android:id=\"@+id/selectionBar\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@color/app_surface\"
                  android:gravity=\"center_vertical\"
                  android:orientation=\"horizontal\"
                  android:paddingStart=\"6dp\"
                  android:paddingTop=\"6dp\"
                  android:paddingEnd=\"6dp\"
                  android:paddingBottom=\"6dp\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toTopOf=\"@id/pasteBar\">

                  <ImageButton
                      android:id=\"@+id/btnCancelSelection\"
                      android:layout_width=\"36dp\"
                      android:layout_height=\"36dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_close\"
                      app:tint=\"@color/text_primary\" />

                  <TextView
                      android:id=\"@+id/tvSelectionCount\"
                      android:layout_width=\"0dp\"
                      android:layout_height=\"wrap_content\"
                      android:layout_weight=\"1\"
                      android:paddingStart=\"6dp\"
                      android:textColor=\"@color/text_primary\"
                      android:textSize=\"13sp\" />

                  <ImageButton
                      android:id=\"@+id/btnSelectAll\"
                      android:layout_width=\"36dp\"
                      android:layout_height=\"36dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_check_circle\"
                      app:tint=\"@color/text_primary\" />

                  <ImageButton
                      android:id=\"@+id/btnFavoriteSelected\"
                      android:layout_width=\"36dp\"
                      android:layout_height=\"36dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_favorite_border\"
                      app:tint=\"@color/text_primary\" />

                  <ImageButton
                      android:id=\"@+id/btnCopySelected\"
                      android:layout_width=\"36dp\"
                      android:layout_height=\"36dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_copy\"
                      app:tint=\"@color/text_primary\" />

                  <ImageButton
                      android:id=\"@+id/btnMoveSelected\"
                      android:layout_width=\"36dp\"
                      android:layout_height=\"36dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_move\"
                      app:tint=\"@color/text_primary\" />

                  <ImageButton
                      android:id=\"@+id/btnLockSelected\"
                      android:layout_width=\"36dp\"
                      android:layout_height=\"36dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/vault_name\"
                      android:src=\"@drawable/ic_lock\"
                      app:tint=\"@color/primary\" />

                  <ImageButton
                      android:id=\"@+id/btnDeleteSelected\"
                      android:layout_width=\"36dp\"
                      android:layout_height=\"36dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_close\"
                      app:tint=\"#F44336\" />
              </LinearLayout>

              <!-- =================== Paste / clipboard bar =================== -->
              <LinearLayout
                  android:id=\"@+id/pasteBar\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@color/app_card\"
                  android:gravity=\"center_vertical\"
                  android:orientation=\"horizontal\"
                  android:paddingStart=\"10dp\"
                  android:paddingTop=\"8dp\"
                  android:paddingEnd=\"6dp\"
                  android:paddingBottom=\"8dp\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toTopOf=\"@id/miniPlayerLayout\">

                  <ImageView
                      android:layout_width=\"20dp\"
                      android:layout_height=\"20dp\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_paste\"
                      app:tint=\"@color/primary\" />

                  <TextView
                      android:id=\"@+id/tvPasteStatus\"
                      android:layout_width=\"0dp\"
                      android:layout_height=\"wrap_content\"
                      android:layout_weight=\"1\"
                      android:paddingStart=\"8dp\"
                      android:paddingEnd=\"8dp\"
                      android:textColor=\"@color/text_primary\"
                      android:textSize=\"12sp\" />

                  <com.google.android.material.button.MaterialButton
                      android:id=\"@+id/btnExecutePaste\"
                      style=\"@style/Widget.MaterialComponents.Button.TextButton\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:minWidth=\"0dp\"
                      android:text=\"لصق هنا\"
                      android:textSize=\"12sp\" />

                  <com.google.android.material.button.MaterialButton
                      android:id=\"@+id/btnSafPaste\"
                      style=\"@style/Widget.MaterialComponents.Button.TextButton\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"wrap_content\"
                      android:minWidth=\"0dp\"
                      android:text=\"مجلد SAF\"
                      android:textSize=\"12sp\" />

                  <ImageButton
                      android:id=\"@+id/btnCancelPaste\"
                      android:layout_width=\"32dp\"
                      android:layout_height=\"32dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_close\"
                      app:tint=\"@color/text_secondary\" />
              </LinearLayout>

              <!-- =================== Mini player =================== -->
              <LinearLayout
                  android:id=\"@+id/miniPlayerLayout\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@drawable/bg_mini_player\"
                  android:gravity=\"center_vertical\"
                  android:orientation=\"horizontal\"
                  android:padding=\"6dp\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toTopOf=\"@id/bottomNavigation\">

                  <androidx.cardview.widget.CardView
                      android:layout_width=\"44dp\"
                      android:layout_height=\"44dp\"
                      app:cardCornerRadius=\"8dp\"
                      app:cardElevation=\"0dp\">

                      <ImageView
                          android:id=\"@+id/ivMiniThumb\"
                          android:layout_width=\"match_parent\"
                          android:layout_height=\"match_parent\"
                          android:contentDescription=\"@string/content_desc\"
                          android:scaleType=\"centerCrop\"
                          android:src=\"@drawable/ic_video\" />
                  </androidx.cardview.widget.CardView>

                  <LinearLayout
                      android:id=\"@+id/miniPlayerInfo\"
                      android:layout_width=\"0dp\"
                      android:layout_height=\"wrap_content\"
                      android:layout_weight=\"1\"
                      android:orientation=\"vertical\"
                      android:paddingStart=\"10dp\"
                      android:paddingEnd=\"4dp\">

                      <TextView
                          android:id=\"@+id/tvMiniTitle\"
                          android:layout_width=\"match_parent\"
                          android:layout_height=\"wrap_content\"
                          android:ellipsize=\"marquee\"
                          android:singleLine=\"true\"
                          android:textColor=\"@color/text_primary\"
                          android:textSize=\"13sp\"
                          android:textStyle=\"bold\" />

                      <TextView
                          android:id=\"@+id/tvMiniSub\"
                          android:layout_width=\"match_parent\"
                          android:layout_height=\"wrap_content\"
                          android:ellipsize=\"end\"
                          android:singleLine=\"true\"
                          android:textColor=\"@color/text_secondary\"
                          android:textSize=\"11sp\" />
                  </LinearLayout>

                  <ImageButton
                      android:id=\"@+id/btnMiniPrev\"
                      android:layout_width=\"36dp\"
                      android:layout_height=\"36dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_skip_previous\"
                      app:tint=\"@color/text_primary\" />

                  <ImageButton
                      android:id=\"@+id/btnMiniPlayPause\"
                      android:layout_width=\"40dp\"
                      android:layout_height=\"40dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_play\"
                      app:tint=\"@color/primary\" />

                  <ImageButton
                      android:id=\"@+id/btnMiniNext\"
                      android:layout_width=\"36dp\"
                      android:layout_height=\"36dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_skip_next\"
                      app:tint=\"@color/text_primary\" />

                  <ImageButton
                      android:id=\"@+id/btnMiniClose\"
                      android:layout_width=\"32dp\"
                      android:layout_height=\"32dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_close\"
                      app:tint=\"@color/text_secondary\" />
              </LinearLayout>

              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id=\"@+id/bottomNavigation\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@color/app_surface\"
                  app:itemIconTint=\"@color/primary\"
                  app:itemTextColor=\"@color/text_primary\"
                  app:labelVisibilityMode=\"labeled\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:menu=\"@menu/bottom_nav_menu\" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          """)

          # ---------------- app/src/main/res/layout/activity_player.xml ----------------
          add('app/src/main/res/layout/activity_player.xml',
          """\
          <?xml version=\"1.0\" encoding=\"utf-8\"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"
              xmlns:app=\"http://schemas.android.com/apk/res-auto\"
              android:id=\"@+id/playerContainer\"
              android:layout_width=\"match_parent\"
              android:layout_height=\"match_parent\"
              android:background=\"#000000\">

              <androidx.media3.ui.PlayerView
                  android:id=\"@+id/playerView\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"match_parent\"
                  app:surface_type=\"texture_view\"
                  app:use_controller=\"false\" />

              <ImageView
                  android:id=\"@+id/ivAudioCover\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"match_parent\"
                  android:contentDescription=\"@string/content_desc\"
                  android:scaleType=\"centerCrop\"
                  android:visibility=\"gone\" />

              <!-- ===================== Top controls ===================== -->
              <LinearLayout
                  android:id=\"@+id/topControls\"
                  android:layout_width=\"match_parent\"
                  android:layout_height=\"wrap_content\"
                  android:background=\"@color/scrim\"
                  android:gravity=\"center_vertical\"
                  android:orientation=\"horizontal\"
                  android:padding=\"6dp\"
                  app:layout_constraintTop_toTopOf=\"parent\">

                  <ImageButton
                      android:id=\"@+id/btnBack\"
                      android:layout_width=\"40dp\"
                      android:layout_height=\"40dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_back\"
                      app:tint=\"#FFFFFF\" />

                  <TextView
                      android:id=\"@+id/tvVideoTitle\"
                      android:layout_width=\"0dp\"
                      android:layout_height=\"wrap_content\"
                      android:layout_weight=\"1\"
                      android:ellipsize=\"marquee\"
                      android:paddingStart=\"6dp\"
                      android:paddingEnd=\"6dp\"
                      android:singleLine=\"true\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"14sp\"
                      android:textStyle=\"bold\" />

                  <ImageButton
                      android:id=\"@+id/btnFavorite\"
                      android:layout_width=\"40dp\"
                      android:layout_height=\"40dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_favorite_border\"
                      app:tint=\"#FFFFFF\" />

                  <ImageButton
                      android:id=\"@+id/btnSubtitles\"
                      android:layout_width=\"40dp\"
                      android:layout_height=\"40dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_subtitles\"
                      app:tint=\"#FFFFFF\" />

                  <ImageButton
                      android:id=\"@+id/btnAudioTracks\"
                      android:layout_width=\"40dp\"
                      android:layout_height=\"40dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_audiotrack\"
                      app:tint=\"#FFFFFF\" />

                  <com.google.android.material.button.MaterialButton
                      android:id=\"@+id/btnDecoder\"
                      style=\"@style/Widget.MaterialComponents.Button.TextButton\"
                      android:layout_width=\"wrap_content\"
                      android:layout_height=\"36dp\"
                      android:background=\"@drawable/bg_decoder_badge\"
                      android:minWidth=\"0dp\"
                      android:minHeight=\"0dp\"
                      android:text=\"HW\"
                      android:textColor=\"#FFFFFF\"
                      android:textSize=\"11sp\" />

                  <ImageButton
                      android:id=\"@+id/btnMore\"
                      android:layout_width=\"40dp\"
                      android:layout_height=\"40dp\"
                      android:background=\"?attr/selectableItemBackgroundBorderless\"
                      android:contentDescription=\"@string/app_name\"
                      android:src=\"@drawable/ic_more_vert\"
                      app:tint=\"#FFFFFF\" />
              </LinearLayout>

              <!-- ===================== Lock / unlock overlay button ===================== -->
              <ImageButton
                  android:id=\"@+id/btnUnlock\"
                  android:layout_width=\"48dp\"
                  android:layout_height=\"48dp\"
                  android:layout_marginStart=\"12dp\"
                  android:background=\"@drawable/bg_hud\"
                  android:contentDescription=\"@string/app_name\"
                  android:src=\"@drawable/ic_lock\"
                  android:visibility=\"gone\"
                  app:layout_constraintBottom_toBottomOf=\"parent\"
                  app:layout_constraintStart_toStartOf=\"parent\"
