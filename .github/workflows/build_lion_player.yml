              private fun executeMoveToVault(items: List<MediaItem>) {
                  lifecycleScope.launch {
            Toast.makeText(this@MainActivity, "جاري التشفير والنقل إلى الخزينة...", Toast.LENGTH_SHORT).show()
            var successCount = 0
            for (item in items) {
                val uri = Uri.parse(item.uri)
                val imported = VaultManager.encryptAndImportFile(
                    this@MainActivity,
                    uri,
                    item.title,
                    item.path,
                    item.isVideo,
                    item.duration
                )
                if (imported != null) {
                    successCount++
                }
            }
            performDelete(items)
            Toast.makeText(this@MainActivity, "تم تشفير ونقل ($successCount) عناصر إلى الخزينة بنجاح 🔒", Toast.LENGTH_LONG).show()
            viewModel.clearSelection()
            viewModel.loadMedia()
                  }
              }

