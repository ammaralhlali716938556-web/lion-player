                  lifecycleScope.launch {
            var count = 0
            for (uri in uris) {
                val fileName = getFileNameFromUri(uri)
                val isVideo = contentResolver.getType(uri)?.startsWith("video/") == true ||
                        fileName.endsWith(".mp4", true) || fileName.endsWith(".mkv", true)
                val imported = VaultManager.encryptAndImportFile(
                    this@VaultActivity,
                    uri,
                    fileName,
                    "",
                    isVideo,
                    0L
                )
                if (imported != null) count++
            }
            hideLoading()
            Toast.makeText(this@VaultActivity, "تم تشفير ونقل ($count) عناصر إلى الخزينة بنجاح 🔒", Toast.LENGTH_LONG).show()
            loadVaultMedia()
                  }
              }

