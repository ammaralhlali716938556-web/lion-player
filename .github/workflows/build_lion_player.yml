            <Button android:id="@+id/btnKey1" style="?attr/materialButtonOutlinedStyle" android:layout_width="72dp" android:layout_height="72dp" android:layout_margin="8dp" android:text="1" android:textSize="22sp" android:textStyle="bold" />
            <Button android:id="@+id/btnKey2" style="?attr/materialButtonOutlinedStyle" android:layout_width="72dp" android:layout_height="72dp" android:layout_margin="8dp" android:text="2" android:textSize="22sp" android:textStyle="bold" />
            <Button android:id="@+id/btnKey3" style="?attr/materialButtonOutlinedStyle" android:layout_width="72dp" android:layout_height="72dp" android:layout_margin="8dp" android:text="3" android:textSize="22sp" android:textStyle="bold" />

            <Button android:id="@+id/btnKey4" style="?attr/materialButtonOutlinedStyle" android:layout_width="72dp" android:layout_height="72dp" android:layout_margin="8dp" android:text="4" android:textSize="22sp" android:textStyle="bold" />
            <Button android:id="@+id/btnKey5" style="?attr/materialButtonOutlinedStyle" android:layout_width="72dp" android:layout_height="72dp" android:layout_margin="8dp" android:text="5" android:textSize="22sp" android:textStyle="bold" />
            <Button android:id="@+id/btnKey6" style="?attr/materialButtonOutlinedStyle" android:layout_width="72dp" android:layout_height="72dp" android:layout_margin="8dp" android:text="6" android:textSize="22sp" android:textStyle="bold" />

            <Button android:id="@+id/btnKey7" style="?attr/materialButtonOutlinedStyle" android:layout_width="72dp" android:layout_height="72dp" android:layout_margin="8dp" android:text="7" android:textSize="22sp" android:textStyle="bold" />
            <Button android:id="@+id/btnKey8" style="?attr/materialButtonOutlinedStyle" android:layout_width="72dp" android:layout_height="72dp" android:layout_margin="8dp" android:text="8" android:textSize="22sp" android:textStyle="bold" />
            <Button android:id="@+id/btnKey9" style="?attr/materialButtonOutlinedStyle" android:layout_width="72dp" android:layout_height="72dp" android:layout_margin="8dp" android:text="9" android:textSize="22sp" android:textStyle="bold" />

