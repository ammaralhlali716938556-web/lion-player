          cat << 'EOF' > app/src/main/res/layout/item_media_grid.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/itemRootView"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="?attr/selectableItemBackground"
              android:gravity="center_horizontal"
              android:orientation="vertical"
              android:padding="6dp">

              <RelativeLayout android:layout_width="match_parent" android:layout_height="100dp">
                  <ImageView android:id="@+id/ivThumbnail" android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="centerCrop" android:background="@drawable/bg_thumb_round" android:clipToOutline="true" android:src="@drawable/ic_video" />
                  <ImageView android:id="@+id/ivCheck" android:layout_width="28dp" android:layout_height="28dp" android:layout_alignParentStart="true" android:layout_alignParentTop="true" android:layout_margin="4dp" android:src="@drawable/ic_check_circle" android:visibility="gone" />
                  <ImageButton android:id="@+id/btnMore" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentTop="true" android:layout_alignParentEnd="true" android:background="#66000000" android:src="@drawable/ic_more_vert" app:tint="#FFFFFF" />
              </RelativeLayout>

