name: Build Lion Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Lion Player Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create App Code & Environment
        run: |
          mkdir -p app
          mkdir -p app/src/main
          mkdir -p app/src/main/java/com/lionplayer/app
          mkdir -p app/src/main/java/com/lionplayer/app/data/model
          mkdir -p app/src/main/java/com/lionplayer/app/data/repository
          mkdir -p app/src/main/java/com/lionplayer/app/player
          mkdir -p app/src/main/java/com/lionplayer/app/player/decoder
          mkdir -p app/src/main/java/com/lionplayer/app/receiver
          mkdir -p app/src/main/java/com/lionplayer/app/ui
          mkdir -p app/src/main/java/com/lionplayer/app/ui/adapter
          mkdir -p app/src/main/java/com/lionplayer/app/ui/viewmodel
          mkdir -p app/src/main/java/com/lionplayer/app/util
          mkdir -p app/src/main/res/color
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night

          # app/build.gradle
          cat << 'EOF_FILE_0' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          
          android {
              namespace 'com.lionplayer.app'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.lionplayer.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 8
                  versionName "2.0.0"
          
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
          
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  viewBinding true
              }
          }
          
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.media:media:1.7.0'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'androidx.fragment:fragment-ktx:1.6.2'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          
              // Media3 (ExoPlayer, Session, UI, Formats)
              def media3_version = "1.3.1"
              implementation "androidx.media3:media3-exoplayer:$media3_version"
              implementation "androidx.media3:media3-ui:$media3_version"
              implementation "androidx.media3:media3-common:$media3_version"
              implementation "androidx.media3:media3-session:$media3_version"
              implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
              implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
              implementation "androidx.media3:media3-exoplayer-rtsp:$media3_version"
              implementation "androidx.media3:media3-cast:$media3_version"
          
              // High Performance Asynchronous Thumbnail Engine (Coil + Video Frame Decoder)
              implementation 'io.coil-kt:coil:2.6.0'
              implementation 'io.coil-kt:coil-video:2.6.0'
          
              // Biometric Security & AES-256-GCM Vault
              implementation 'androidx.biometric:biometric:1.1.0'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
          }
          EOF_FILE_0

          # app/proguard-rules.pro
          cat << 'EOF_FILE_1' > app/proguard-rules.pro
          -keep class androidx.media3.** { *; }
          -keep class com.lionplayer.app.data.model.** { *; }
          -keep class io.coilkt.** { *; }
          EOF_FILE_1

          # app/src/main/AndroidManifest.xml
          cat << 'EOF_FILE_2' > app/src/main/AndroidManifest.xml
