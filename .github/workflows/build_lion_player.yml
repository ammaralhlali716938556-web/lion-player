          package com.lionplayer.app.ui

          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.View
          import android.view.WindowManager
          import android.widget.ArrayAdapter
          import android.widget.EditText
          import android.widget.Spinner
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import com.lionplayer.app.R
          import com.lionplayer.app.databinding.ActivityVaultLockBinding
          import com.lionplayer.app.vault.security.VaultSecurityManager

          class VaultLockActivity : AppCompatActivity() {

          private lateinit var binding: ActivityVaultLockBinding
          private lateinit var vaultSecurityManager: VaultSecurityManager
          private val enteredPin = StringBuilder()
          private var isSetupMode = false
          private var setupStep = 1
          private var firstEnteredPin = ""

          override fun onCreate(savedInstanceState: Bundle?) {
          super.onCreate(savedInstanceState)
          window.setFlags(
            WindowManager.LayoutParams.FLAG_SECURE,
            WindowManager.LayoutParams.FLAG_SECURE
          )

          binding = ActivityVaultLockBinding.inflate(layoutInflater)
          setContentView(binding.root)

          vaultSecurityManager = VaultSecurityManager(this)
          isSetupMode = !vaultSecurityManager.isVaultInitialized()

          setupUI()
          setupKeypad()

          if (!isSetupMode) {
            checkAndPromptBiometrics()
          }
          }

          private fun setupUI() {
          if (isSetupMode) {
            binding.tvVaultLockTitle.text = "إعداد الخزينة السرية"
            binding.tvVaultLockSubtitle.text = "أنشئ رمز PIN لحماية مقاطعك السرية (4 أرقام)"
            binding.btnForgotPin.visibility = View.GONE
            binding.btnKeyBiometric.visibility = View.INVISIBLE
          } else {
            binding.tvVaultLockTitle.text = "الخزينة السرية"
            binding.tvVaultLockSubtitle.text = "أدخل رمز PIN أو استخدم البصمة لفتح القفل"
            binding.btnForgotPin.visibility = View.VISIBLE
            binding.btnKeyBiometric.visibility = View.VISIBLE
            binding.btnForgotPin.setOnClickListener { showForgotPinDialog() }
          }
          updatePinDots()
          }

          private fun setupKeypad() {
          val numberButtons = mapOf(
            binding.btnKey0 to "0",
            binding.btnKey1 to "1",
            binding.btnKey2 to "2",
            binding.btnKey3 to "3",
            binding.btnKey4 to "4",
            binding.btnKey5 to "5",
            binding.btnKey6 to "6",
            binding.btnKey7 to "7",
            binding.btnKey8 to "8",
            binding.btnKey9 to "9"
          )

          for ((view, digit) in numberButtons) {
            view.setOnClickListener { onDigitPressed(digit) }
          }

          binding.btnKeyBackspace.setOnClickListener { onBackspacePressed() }
          binding.btnKeyBiometric.setOnClickListener { checkAndPromptBiometrics() }
          }

          private fun onDigitPressed(digit: String) {
          if (enteredPin.length < 4) {
            enteredPin.append(digit)
            updatePinDots()
            if (enteredPin.length == 4) {
                handlePinCompleted()
            }
          }
          }

          private fun onBackspacePressed() {
          if (enteredPin.isNotEmpty()) {
            enteredPin.deleteCharAt(enteredPin.length - 1)
            updatePinDots()
          }
          }

          private fun updatePinDots() {
          val len = enteredPin.length
          binding.dot1.setImageResource(if (len >= 1) R.drawable.bg_pin_dot_filled else R.drawable.bg_pin_dot_empty)
          binding.dot2.setImageResource(if (len >= 2) R.drawable.bg_pin_dot_filled else R.drawable.bg_pin_dot_empty)
          binding.dot3.setImageResource(if (len >= 3) R.drawable.bg_pin_dot_filled else R.drawable.bg_pin_dot_empty)
          binding.dot4.setImageResource(if (len >= 4) R.drawable.bg_pin_dot_filled else R.drawable.bg_pin_dot_empty)
          }

          private fun handlePinCompleted() {
          val pin = enteredPin.toString()
          if (isSetupMode) {
            if (setupStep == 1) {
                firstEnteredPin = pin
                setupStep = 2
                enteredPin.clear()
                updatePinDots()
                binding.tvVaultLockSubtitle.text = "أعد إدخال رمز PIN للتأكيد"
            } else {
                if (pin == firstEnteredPin) {
                    showSetupSecurityQuestionDialog(pin)
                } else {
                    triggerErrorFeedback()
                    Toast.makeText(this, "الرمزان غير متطابقين، يرجى المحاولة ثانية", Toast.LENGTH_SHORT).show()
                    setupStep = 1
                    firstEnteredPin = ""
                    enteredPin.clear()
                    updatePinDots()
                    binding.tvVaultLockSubtitle.text = "أنشئ رمز PIN لحماية مقاطعك السرية (4 أرقام)"
                }
            }
          } else {
            if (vaultSecurityManager.verifyPin(pin)) {
                unlockVault()
            } else {
                triggerErrorFeedback()
                Toast.makeText(this, "رمز PIN غير صحيح", Toast.LENGTH_SHORT).show()
                enteredPin.clear()
                updatePinDots()
            }
          }
          }

          private fun showSetupSecurityQuestionDialog(pin: String) {
          val questions = arrayOf(
            "ما هو اسم أول مدرسة التحقت بها؟",
            "ما هي مدينتك المفضلة؟",
            "ما هو اسم حيوانك الأليف الأول؟",
            "ما هو اسم أفضل صديق في طفولتك؟"
          )

          val layout = android.widget.LinearLayout(this).apply {
            orientation = android.widget.LinearLayout.VERTICAL
            setPadding(40, 20, 40, 10)
          }

          val tvLabel = android.widget.TextView(this).apply {
            text = "اختر سؤال أمان لاستعادة الرمز في حال نسيانه:"
            setTextColor(ContextCompat.getColor(this@VaultLockActivity, R.color.text_primary))
            textSize = 13f
            setPadding(0, 0, 0, 8)
          }
          layout.addView(tvLabel)

          val spinner = Spinner(this).apply {
            adapter = ArrayAdapter(this@VaultLockActivity, android.R.layout.simple_spinner_dropdown_item, questions)
          }
          layout.addView(spinner)

          val etAnswer = EditText(this).apply {
            hint = "اكتب إجابتك هنا..."
            setPadding(20, 20, 20, 20)
          }
          layout.addView(etAnswer)

          AlertDialog.Builder(this)
            .setTitle("حماية الاستعادة 🛡️")
            .setView(layout)
            .setCancelable(false)
            .setPositiveButton("حفظ وتأكيد") { _, _ ->
                val answer = etAnswer.text.toString().trim()
                if (answer.isNotEmpty()) {
                    val q = questions[spinner.selectedItemPosition]
                    vaultSecurityManager.setupVault(pin, q, answer)
                    Toast.makeText(this, "تم إعداد الخزينة السرية بنجاح 🔒", Toast.LENGTH_SHORT).show()
                    unlockVault()
                } else {
                    Toast.makeText(this, "يجب إدخال إجابة لسؤال الأمان", Toast.LENGTH_LONG).show()
                    showSetupSecurityQuestionDialog(pin)
                }
            }
            .show()
          }

          private fun showForgotPinDialog() {
          val question = vaultSecurityManager.getSecurityQuestion()
          val view = layoutInflater.inflate(R.layout.dialog_reset_vault_pin, null)
          val tvQuestion = view.findViewById<android.widget.TextView>(R.id.tvDialogQuestion)
          val etAnswer = view.findViewById<EditText>(R.id.etSecurityAnswer)
          val etNewPin = view.findViewById<EditText>(R.id.etNewPin)
          val etConfirmNewPin = view.findViewById<EditText>(R.id.etConfirmNewPin)

          tvQuestion.text = "سؤال الأمان:
          $question"

          AlertDialog.Builder(this)
            .setTitle("استعادة رمز الخزينة")
            .setView(view)
            .setPositiveButton("تحديث ودخول") { _, _ ->
                val answer = etAnswer.text.toString().trim()
                val newPin = etNewPin.text.toString().trim()
                val confirmPin = etConfirmNewPin.text.toString().trim()

                if (!vaultSecurityManager.verifySecurityAnswer(answer)) {
                    Toast.makeText(this, "إجابة سؤال الأمان غير صحيحة", Toast.LENGTH_SHORT).show()
                    return@setPositiveButton
                }

                if (newPin.length != 4 || newPin != confirmPin) {
                    Toast.makeText(this, "يجب أن يتطابق رمز PIN المكون من 4 أرقام", Toast.LENGTH_SHORT).show()
                    return@setPositiveButton
                }

                vaultSecurityManager.updatePin(newPin)
                Toast.makeText(this, "تم تحديث رمز PIN بنجاح", Toast.LENGTH_SHORT).show()
                unlockVault()
            }
            .setNegativeButton("إلغاء", null)
            .show()
          }

          private fun checkAndPromptBiometrics() {
          val biometricManager = BiometricManager.from(this)
          val canAuth = biometricManager.canAuthenticate(
            BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.BIOMETRIC_WEAK
          )

          if (canAuth == BiometricManager.BIOMETRIC_SUCCESS) {
            val executor = ContextCompat.getMainExecutor(this)
            val prompt = BiometricPrompt(this, executor, object : BiometricPrompt.AuthenticationCallback() {
                override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                    unlockVault()
                }

                override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                    // Fall back silently to PIN keypad
                }
            })

            val promptInfo = BiometricPrompt.PromptInfo.Builder()
                .setTitle("الخزينة السرية 🔒")
                .setSubtitle("قم بتأكيد هويتك عبر البصمة للدخول")
                .setNegativeButtonText("استخدام PIN")
                .build()

            prompt.authenticate(promptInfo)
          }
          }

          private fun unlockVault() {
          startActivity(Intent(this, VaultActivity::class.java))
          finish()
          }

          private fun triggerErrorFeedback() {
          try {
            val vibrator = getSystemService(VIBRATOR_SERVICE) as? Vibrator
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                vibrator?.vibrate(VibrationEffect.createOneShot(120, VibrationEffect.DEFAULT_AMPLITUDE))
            } else {
                @Suppress("DEPRECATION")
                vibrator?.vibrate(120)
            }
          } catch (e: Exception) {}
          }
          }

