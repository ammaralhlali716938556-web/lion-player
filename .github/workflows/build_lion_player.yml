          package com.lionplayer.app.ui
          
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.view.WindowManager
          import android.widget.SeekBar
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import com.lionplayer.app.R
          import com.lionplayer.app.databinding.ActivityVaultPlayerBinding
          import com.lionplayer.app.model.VaultItem
          import com.lionplayer.app.security.VaultManager
          import kotlinx.coroutines.launch
          import java.io.File
          import java.util.Locale
          
          class VaultPlayerActivity : AppCompatActivity() {
          
              private lateinit var binding: ActivityVaultPlayerBinding
              private var player: ExoPlayer? = null
              private var tempDecryptedFile: File? = null
              private val handler = Handler(Looper.getMainLooper())
          
              private val progressRunnable = object : Runnable {
                  override fun run() {
                      player?.let { p ->
                          if (p.isPlaying) {
                              val current = p.currentPosition
                              val total = p.duration.coerceAtLeast(0L)
                              binding.vaultSeekBar.max = total.toInt()
                              binding.vaultSeekBar.progress = current.toInt()
                              binding.tvVaultCurrentTime.text = formatDuration(current)
                              binding.tvVaultTotalTime.text = formatDuration(total)
                          }
                      }
                      handler.postDelayed(this, 500)
                  }
              }
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // Activate FLAG_SECURE to prevent screenshots and screen recordings
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  )
          
                  binding = ActivityVaultPlayerBinding.inflate(layoutInflater)
                  setContentView(binding.root)
          
                  val vaultItem = intent.getSerializableExtra("VAULT_ITEM") as? VaultItem
                  if (vaultItem == null) {
                      Toast.makeText(this, "تعذر تحميل المقطع المشفر", Toast.LENGTH_SHORT).show()
                      finish()
                      return
                  }
          
                  binding.tvVaultPlayerTitle.text = vaultItem.originalTitle
                  binding.btnVaultPlayerBack.setOnClickListener { finish() }
          
                  initPlayer(vaultItem)
                  setupControls()
              }
          
              private fun initPlayer(vaultItem: VaultItem) {
                  lifecycleScope.launch {
                      Toast.makeText(this@VaultPlayerActivity, "جاري فك تشفير المقطع للعرض الآمن...", Toast.LENGTH_SHORT).show()
                      val tempFile = VaultManager.prepareDecryptedTempFile(this@VaultPlayerActivity, vaultItem)
                      if (tempFile == null || !tempFile.exists()) {
                          Toast.makeText(this@VaultPlayerActivity, "فشل فك تشفير المقطع", Toast.LENGTH_SHORT).show()
                          finish()
                          return@launch
                      }
                      tempDecryptedFile = tempFile
          
                      player = ExoPlayer.Builder(this@VaultPlayerActivity).build().apply {
                          val mediaItem = MediaItem.fromUri(Uri.fromFile(tempFile))
                          setMediaItem(mediaItem)
                          prepare()
                          play()
          
                          addListener(object : Player.Listener {
                              override fun onIsPlayingChanged(isPlaying: Boolean) {
                                  binding.btnVaultPlayPause.setImageResource(
                                      if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play
                                  )
                              }
                              override fun onPlaybackStateChanged(playbackState: Int) {
                                  if (playbackState == Player.STATE_ENDED) {
                                      seekTo(0)
                                      pause()
                                  }
                              }
                          })
                      }
          
                      binding.vaultPlayerView.player = player
                      handler.post(progressRunnable)
                  }
              }
          
              private fun setupControls() {
                  binding.btnVaultPlayPause.setOnClickListener {
                      player?.let { p ->
                          if (p.isPlaying) p.pause() else p.play()
                      }
                  }
          
                  binding.btnVaultRewind10.setOnClickListener {
                      player?.let { p ->
                          p.seekTo((p.currentPosition - 10000L).coerceAtLeast(0L))
                      }
                  }
          
                  binding.btnVaultForward10.setOnClickListener {
                      player?.let { p ->
                          p.seekTo((p.currentPosition + 10000L).coerceAtMost(p.duration))
                      }
                  }
          
                  binding.vaultSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) {
                              player?.seekTo(progress.toLong())
                              binding.tvVaultCurrentTime.text = formatDuration(progress.toLong())
                          }
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })
              }
          
              private fun formatDuration(durationMs: Long): String {
                  val totalSec = durationMs / 1000
                  val sec = totalSec % 60
                  val min = (totalSec / 60) % 60
                  val hrs = totalSec / 3600
                  return if (hrs > 0) {
                      String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
                  } else {
                      String.format(Locale.US, "%02d:%02d", min, sec)
                  }
              }
          
              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(progressRunnable)
                  player?.release()
                  player = null
                  // Ensure decrypted temp file is completely wiped from cache
                  try {
                      tempDecryptedFile?.delete()
                  } catch (e: Exception) {}
              }
          }
