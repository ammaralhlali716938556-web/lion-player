                          lifecycleScope.launch {
                              Toast.makeText(this@MainActivity, "جاري التشفير والنقل إلى الخزينة...", Toast.LENGTH_SHORT).show()
                              val success = VaultManager.encryptMediaItem(this@MainActivity, item, deleteOriginal = true)
                              if (success) {
                                  viewModel.onItemsDeleted(listOf(item))
                                  Toast.makeText(this@MainActivity, "تم إخفاء الملف وتشفيره في الخزينة بنجاح 🔒", Toast.LENGTH_SHORT).show()
                              } else {
                                  Toast.makeText(this@MainActivity, "فشل تشفير الملف في الخزينة", Toast.LENGTH_SHORT).show()
