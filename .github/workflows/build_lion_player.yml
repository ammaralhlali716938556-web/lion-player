          # 17. Vault Models & Security
          cat << 'EOF_VAULT_ITEM' > app/src/main/java/com/lionplayer/app/vault/model/VaultItem.kt
          package com.lionplayer.app.vault.model

          import java.io.Serializable

          data class VaultItem(
              val id: String,
              val originalName: String,
              val originalPath: String,
              val isVideo: Boolean,
              val size: Long,
              val duration: Long,
              val dateAdded: Long,
