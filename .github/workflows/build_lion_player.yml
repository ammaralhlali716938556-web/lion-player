            <Button android:id="@+id/btnKey0" style="?attr/materialButtonOutlinedStyle" android:layout_width="72dp" android:layout_height="72dp" android:layout_margin="8dp" android:text="0" android:textSize="22sp" android:textStyle="bold" />

