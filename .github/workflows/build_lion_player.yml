package com.lionplayer.app.adapter

import android.graphics.Color
import android.view.LayoutInflater
import android.view.View
import android.view.ViewGroup
import android.widget.TextView
import androidx.recyclerview.widget.RecyclerView
import com.lionplayer.app.R
import com.lionplayer.app.model.LyricsLine

class LyricsAdapter(
    private var lines: List<LyricsLine> = emptyList()
) : RecyclerView.Adapter<LyricsAdapter.LyricViewHolder>() {

    var activeIndex: Int = -1

    fun updateLyrics(newLines: List<LyricsLine>) {
        this.lines = newLines
        this.activeIndex = -1
        notifyDataSetChanged()
    }

    fun updateCurrentTime(currentMs: Long): Int {
        var newIdx = -1
        for (i in lines.indices) {
            if (currentMs >= lines[i].timeMs) {
                newIdx = i
            } else {
                break
            }
        }
        if (newIdx != activeIndex) {
            val oldIdx = activeIndex
            activeIndex = newIdx
            if (oldIdx != -1) notifyItemChanged(oldIdx)
            if (activeIndex != -1) notifyItemChanged(activeIndex)
        }
        return activeIndex
    }

    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): LyricViewHolder {
        val view = LayoutInflater.from(parent.context).inflate(R.layout.item_lyric_line, parent, false)
        return LyricViewHolder(view)
    }

    override fun onBindViewHolder(holder: LyricViewHolder, position: Int) {
        holder.bind(lines[position], position == activeIndex)
    }

    override fun getItemCount(): Int = lines.size

    class LyricViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
        private val tvLyricText: TextView = itemView.findViewById(R.id.tvLyricText)

        fun bind(line: LyricsLine, isActive: Boolean) {
            tvLyricText.text = line.text
            if (isActive) {
                tvLyricText.setTextColor(Color.parseColor("#FF9800"))
                tvLyricText.textSize = 18f
                tvLyricText.paint.isFakeBoldText = true
            } else {
                tvLyricText.setTextColor(Color.parseColor("#99FFFFFF"))
                tvLyricText.textSize = 15f
                tvLyricText.paint.isFakeBoldText = false
            }
        }
    }
}
