          # app/src/main/java/com/lionplayer/app/util/CryptoUtils.kt
          cat << 'EOF_FILE_28' > app/src/main/java/com/lionplayer/app/util/CryptoUtils.kt
          package com.lionplayer.app.util
          
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec
          
          object CryptoUtils {
          
              private const val ANDROID_KEYSTORE = "AndroidKeyStore"
              private const val KEY_ALIAS = "LionVaultMasterKey"
              private const val TRANSFORMATION = "AES/GCM/NoPadding"
              private const val GCM_IV_LENGTH = 12
              private const val GCM_TAG_LENGTH = 128
          
              private fun getOrCreateKey(): SecretKey {
                  val keyStore = KeyStore.getInstance(ANDROID_KEYSTORE).apply { load(null) }
                  if (keyStore.containsAlias(KEY_ALIAS)) {
                      val entry = keyStore.getEntry(KEY_ALIAS, null) as KeyStore.SecretKeyEntry
                      return entry.secretKey
                  }
          
                  val keyGenerator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, ANDROID_KEYSTORE)
                  val spec = KeyGenParameterSpec.Builder(
                      KEY_ALIAS,
                      KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
                  )
                      .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                      .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                      .setKeySize(256)
                      .build()
          
                  keyGenerator.init(spec)
                  return keyGenerator.generateKey()
              }
          
              fun encryptFile(sourceFile: File, destEncryptedFile: File) {
                  val key = getOrCreateKey()
                  val cipher = Cipher.getInstance(TRANSFORMATION)
                  cipher.init(Cipher.ENCRYPT_MODE, key)
                  val iv = cipher.iv
          
                  destEncryptedFile.parentFile?.mkdirs()
                  FileOutputStream(destEncryptedFile).use { out ->
                      out.write(iv)
                      FileInputStream(sourceFile).use { input ->
                          val buffer = ByteArray(1024 * 64)
                          var bytesRead: Int
                          while (input.read(buffer).also { bytesRead = it } != -1) {
                              val encryptedChunk = cipher.update(buffer, 0, bytesRead)
                              if (encryptedChunk != null && encryptedChunk.isNotEmpty()) {
                                  out.write(encryptedChunk)
                              }
                          }
                          val finalChunk = cipher.doFinal()
                          if (finalChunk != null && finalChunk.isNotEmpty()) {
                              out.write(finalChunk)
                          }
                      }
                  }
              }
          
              fun decryptFile(encryptedFile: File, decryptedOutFile: File) {
                  val key = getOrCreateKey()
                  FileInputStream(encryptedFile).use { input ->
                      val iv = ByteArray(GCM_IV_LENGTH)
                      input.read(iv)
          
                      val cipher = Cipher.getInstance(TRANSFORMATION)
                      val spec = GCMParameterSpec(GCM_TAG_LENGTH, iv)
                      cipher.init(Cipher.DECRYPT_MODE, key, spec)
          
                      decryptedOutFile.parentFile?.mkdirs()
                      FileOutputStream(decryptedOutFile).use { out ->
                          val buffer = ByteArray(1024 * 64)
                          var bytesRead: Int
                          while (input.read(buffer).also { bytesRead = it } != -1) {
                              val decryptedChunk = cipher.update(buffer, 0, bytesRead)
                              if (decryptedChunk != null && decryptedChunk.isNotEmpty()) {
                                  out.write(decryptedChunk)
                              }
                          }
                          val finalChunk = cipher.doFinal()
                          if (finalChunk != null && finalChunk.isNotEmpty()) {
                              out.write(finalChunk)
                          }
                      }
                  }
              }
          }
