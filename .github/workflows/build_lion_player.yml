package com.lionplayer.app.repository

import com.lionplayer.app.model.IptvChannel
import java.io.BufferedReader
import java.io.InputStream
import java.io.InputStreamReader

object IptvParser {

    fun parse(inputStream: InputStream): List<IptvChannel> {
        val channels = mutableListOf<IptvChannel>()
        val reader = BufferedReader(InputStreamReader(inputStream))
        var line: String?
        var currentName = "قناة"
        var currentLogo = ""
        var currentCategory = "عام"

        val tvgNameRegex = "tvg-name=\"([^\"]+)\"".toRegex()
        val tvgLogoRegex = "tvg-logo=\"([^\"]+)\"".toRegex()
        val groupTitleRegex = "group-title=\"([^\"]+)\"".toRegex()

        while (reader.readLine().also { line = it } != null) {
            val trimmed = line!!.trim()
            if (trimmed.startsWith("#EXTINF:", ignoreCase = true)) {
                tvgNameRegex.find(trimmed)?.let { currentName = it.groupValues[1] }
                tvgLogoRegex.find(trimmed)?.let { currentLogo = it.groupValues[1] }
                groupTitleRegex.find(trimmed)?.let { currentCategory = it.groupValues[1] }

                val commaIdx = trimmed.lastIndexOf(',')
                if (commaIdx != -1 && commaIdx < trimmed.length - 1) {
                    val rawName = trimmed.substring(commaIdx + 1).trim()
                    if (rawName.isNotEmpty()) currentName = rawName
                }
            } else if (trimmed.isNotEmpty() && !trimmed.startsWith("#")) {
                channels.add(
                    IptvChannel(
                        name = currentName,
                        streamUrl = trimmed,
                        logoUrl = currentLogo,
                        category = currentCategory
                    )
                )
                currentName = "قناة"
                currentLogo = ""
                currentCategory = "عام"
            }
        }
        return channels
    }
}
