          # 17. ThumbnailLoader.kt
          cat << 'EOF' > app/src/main/java/com/lionplayer/app/adapter/ThumbnailLoader.kt
          package com.lionplayer.app.adapter

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.Process
          import android.util.LruCache
          import android.util.Size
          import android.widget.ImageView
          import com.lionplayer.app.R
          import com.lionplayer.app.model.MediaItem
          import java.io.File
          import java.util.concurrent.Executors

          object ThumbnailLoader {

              private val maxMemory = (Runtime.getRuntime().maxMemory() / 1024).toInt()
              private val cacheSize = maxMemory / 8

              private val memoryCache = object : LruCache<String, Bitmap>(cacheSize) {
                  override fun sizeOf(key: String, bitmap: Bitmap): Int {
                      return bitmap.byteCount / 1024
                  }
              }

              private val executor = Executors.newFixedThreadPool(2) { r ->
                  Thread {
                      Process.setThreadPriority(Process.THREAD_PRIORITY_BACKGROUND)
                      r.run()
                  }
              }

              private val mainHandler = Handler(Looper.getMainLooper())

              fun load(imageView: ImageView, item: MediaItem) {
                  if (item.isFolder) {
                      imageView.setImageResource(R.drawable.ic_folder)
                      return
                  }

                  val cacheKey = "${item.id}_${item.isVideo}"
                  val cachedBitmap = memoryCache.get(cacheKey)
                  if (cachedBitmap != null) {
                      imageView.setImageBitmap(cachedBitmap)
                      return
                  }

                  val placeholder = if (item.isVideo) R.drawable.ic_video else R.drawable.ic_music_note
                  imageView.setImageResource(placeholder)
                  imageView.tag = cacheKey

                  executor.execute {
                      if (imageView.tag != cacheKey) return@execute
                      val bitmap = retrieveThumbnail(imageView.context, item)
                      if (bitmap != null) {
                          memoryCache.put(cacheKey, bitmap)
                          mainHandler.post {
                              if (imageView.tag == cacheKey) {
                                  imageView.setImageBitmap(bitmap)
                              }
                          }
                      }
                  }
              }

              private fun retrieveThumbnail(context: Context, item: MediaItem): Bitmap? {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          try {
                              context.contentResolver.loadThumbnail(Uri.parse(item.uri), Size(96, 96), null)
                          } catch (e: Exception) {
                              fallbackThumbnail(context, item)
                          }
                      } else {
                          fallbackThumbnail(context, item)
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun fallbackThumbnail(context: Context, item: MediaItem): Bitmap? {
                  val retriever = MediaMetadataRetriever()
                  return try {
                      if (item.path.isNotEmpty() && File(item.path).exists()) {
                          retriever.setDataSource(item.path)
                      } else {
                          retriever.setDataSource(context, Uri.parse(item.uri))
                      }

                      if (item.isVideo) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                              try {
                                  retriever.getScaledFrameAtTime(1000000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC, 96, 96)
                              } catch (e: Throwable) {
                                  retriever.getFrameAtTime(1000000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)?.let { scaleDown(it, 96) }
                              }
                          } else {
                              retriever.getFrameAtTime(1000000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)?.let { scaleDown(it, 96) }
                          }
                      } else {
                          val art = retriever.embeddedPicture
                          if (art != null) {
                              decodeSampled(art, 96, 96)
                          } else null
                      }
                  } catch (e: Exception) {
                      null
                  } finally {
                      try { retriever.release() } catch (e: Exception) {}
                  }
              }

              private fun scaleDown(bitmap: Bitmap, maxDim: Int): Bitmap {
                  val width = bitmap.width
                  val height = bitmap.height
                  if (width <= maxDim && height <= maxDim) return bitmap
                  val ratio = width.toFloat() / height.toFloat()
                  val targetW = if (width > height) maxDim else (maxDim * ratio).toInt()
                  val targetH = if (width > height) (maxDim / ratio).toInt() else maxDim
                  val scaled = Bitmap.createScaledBitmap(bitmap, targetW.coerceAtLeast(1), targetH.coerceAtLeast(1), true)
                  if (scaled != bitmap) bitmap.recycle()
                  return scaled
              }

              private fun decodeSampled(data: ByteArray, reqW: Int, reqH: Int): Bitmap? {
                  val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeByteArray(data, 0, data.size, options)
                  var inSampleSize = 1
                  if (options.outHeight > reqH || options.outWidth > reqW) {
                      val halfH = options.outHeight / 2
                      val halfW = options.outWidth / 2
                      while ((halfH / inSampleSize) >= reqH && (halfW / inSampleSize) >= reqW) {
                          inSampleSize *= 2
                      }
                  }
                  options.inSampleSize = inSampleSize
                  options.inJustDecodeBounds = false
                  return BitmapFactory.decodeByteArray(data, 0, data.size, options)
              }
          }
          EOF

