name: Build Lion Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Lion Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create App Code & Environment
        run: |
          mkdir -p app
          mkdir -p app/src
          mkdir -p app/src/main
          mkdir -p app/src/main/java
          mkdir -p app/src/main/java/com
          mkdir -p app/src/main/java/com/lionplayer
          mkdir -p app/src/main/java/com/lionplayer/app
          mkdir -p app/src/main/java/com/lionplayer/app/adapter
          mkdir -p app/src/main/java/com/lionplayer/app/model
          mkdir -p app/src/main/java/com/lionplayer/app/player
          mkdir -p app/src/main/java/com/lionplayer/app/receiver
          mkdir -p app/src/main/java/com/lionplayer/app/security
          mkdir -p app/src/main/java/com/lionplayer/app/subtitle
          mkdir -p app/src/main/java/com/lionplayer/app/ui
          mkdir -p app/src/main/java/com/lionplayer/app/util
          mkdir -p app/src/main/java/com/lionplayer/app/viewmodel
          mkdir -p app/src/main/res
          mkdir -p app/src/main/res/color
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p gradle

          # Setup local-maven stub for media3-decoder-ffmpeg if required by offline resolver
          python3 -c "
          import os, zipfile
          maven_dir = 'local-maven/androidx/media3/media3-decoder-ffmpeg/1.3.0'
          os.makedirs(maven_dir, exist_ok=True)
          pom = '<?xml version="1.0" encoding="UTF-8"?><project xmlns="http://maven.apache.org/POM/4.0.0" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><modelVersion>4.0.0</modelVersion><groupId>androidx.media3</groupId><artifactId>media3-decoder-ffmpeg</artifactId><version>1.3.0</version><packaging>aar</packaging></project>'
          with open(os.path.join(maven_dir, 'media3-decoder-ffmpeg-1.3.0.pom'), 'w') as pf:
              pf.write(pom)
          aar_path = os.path.join(maven_dir, 'media3-decoder-ffmpeg-1.3.0.aar')
          with zipfile.ZipFile(aar_path, 'w') as zf:
              zf.writestr('AndroidManifest.xml', '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="androidx.media3.decoder.ffmpeg"/>')
              classes_jar = zipfile.ZipFile('classes.jar', 'w')
              classes_jar.close()
              zf.write('classes.jar', 'classes.jar')
              if os.path.exists('classes.jar'): os.remove('classes.jar')
          "

          cat << 'EOF_APP_BUILD_GRADLE_0' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          
          android {
              namespace 'com.lionplayer.app'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.lionplayer.app"
                  minSdk 23
                  targetSdk 34
                  versionCode 11
                  versionName "2.0.0"
          
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
          
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  viewBinding true
              }
          }
          
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.media:media:1.7.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'
          
              // Architecture Components & Coroutines
              implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          
              // Biometric Authentication
              implementation 'androidx.biometric:biometric:1.1.0'
          
              // Jetpack Security Crypto (AES-256 GCM)
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
          
              // Coil High-Performance Image & Video Thumbnail Loading
              implementation 'io.coil-kt:coil:2.6.0'
              implementation 'io.coil-kt:coil-video:2.6.0'
          
              // Media3
              def media3_version = "1.3.0"
              implementation "androidx.media3:media3-exoplayer:$media3_version"
              implementation "androidx.media3:media3-ui:$media3_version"
              implementation "androidx.media3:media3-common:$media3_version"
              implementation "androidx.media3:media3-session:$media3_version"
              implementation "androidx.media3:media3-extractor:$media3_version"
              implementation "androidx.media3:media3-decoder-ffmpeg:$media3_version"
          }
          EOF_APP_BUILD_GRADLE_0

          cat << 'EOF_APP_PROGUARD_RULES_PRO_1' > app/proguard-rules.pro
          -keep class androidx.media3.** { *; }
          -keep class com.lionplayer.app.model.** { *; }
          -keep class com.lionplayer.app.subtitle.** { *; }
          -keep class com.lionplayer.app.security.** { *; }
          -keep class androidx.biometric.** { *; }
          -keep class androidx.security.crypto.** { *; }
          -keep class coil.** { *; }
          EOF_APP_PROGUARD_RULES_PRO_1

          cat << 'EOF_APP_SRC_MAIN_ANDROIDMANIFEST_XML_2' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />
          
              <application
                  android:name=".LionPlayerApp"
                  android:allowBackup="true"
                  android:icon="@drawable/ic_lion_logo"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_lion_logo"
                  android:supportsRtl="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/Theme.LionPlayer">
          
                  <activity
                      android:name=".ui.SplashActivity"
                      android:theme="@style/Theme.LionPlayer.Player"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="false" />
          
                  <activity
                      android:name=".ui.PlayerActivity"
                      android:theme="@style/Theme.LionPlayer.Player"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:supportsPictureInPicture="true"
                      android:launchMode="singleTask"
                      android:exported="false" />
          
                  <!-- Secret Vault Activities -->
                  <activity
                      android:name=".ui.VaultAuthActivity"
                      android:theme="@style/Theme.LionPlayer"
                      android:windowSoftInputMode="adjustResize"
                      android:exported="false" />
          
                  <activity
                      android:name=".ui.VaultActivity"
                      android:theme="@style/Theme.LionPlayer"
                      android:exported="false" />
          
                  <activity
                      android:name=".ui.VaultPlayerActivity"
                      android:theme="@style/Theme.LionPlayer.Player"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:supportsPictureInPicture="true"
                      android:exported="false" />
          
                  <receiver
                      android:name=".receiver.NotificationReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_PREV" />
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_PLAY_PAUSE" />
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_NEXT" />
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_CLOSE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_APP_SRC_MAIN_ANDROIDMANIFEST_XML_2

          cat << 'EOF_APP_SRC_MAIN_JAVA_COM_LIONPLAYER_APP_LIONPLAYERAPP_KT_3' > app/src/main/java/com/lionplayer/app/LionPlayerApp.kt
          package com.lionplayer.app
          
          import android.app.Application
          import android.content.Context
          import androidx.appcompat.app.AppCompatDelegate
          import coil.ImageLoader
          import coil.ImageLoaderFactory
          import coil.decode.VideoFrameDecoder
          import coil.disk.DiskCache
          import coil.memory.MemoryCache
          import com.lionplayer.app.adapter.AudioCoverFetcher
          
          class LionPlayerApp : Application(), ImageLoaderFactory {
          
              override fun onCreate() {
                  super.onCreate()
                  val prefs = getSharedPreferences("lion_player_prefs", Context.MODE_PRIVATE)
                  val mode = prefs.getString("theme_mode", "dark") ?: "dark"
                  applyTheme(mode)
              }
          
              override fun newImageLoader(): ImageLoader {
                  return ImageLoader.Builder(this)
                      .components {
                          add(VideoFrameDecoder.Factory())
                          add(AudioCoverFetcher.Factory(this@LionPlayerApp))
                      }
                      .memoryCache {
                          MemoryCache.Builder(this)
                              .maxSizePercent(0.25)
                              .strongReferencesEnabled(true)
                              .build()
                      }
                      .diskCache {
                          DiskCache.Builder()
                              .directory(cacheDir.resolve("lion_media_thumb_cache"))
                              .maxSizeBytes(250L * 1024 * 1024)
                              .build()
                      }
                      .crossfade(true)
                      .respectCacheHeaders(false)
                      .build()
              }
          
              companion object {
                  fun applyTheme(mode: String) {
                      when (mode) {
                          "light" -> AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_NO)
                          "dark" -> AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_YES)
                          "system" -> AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM)
                          else -> AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_YES)
                      }
                  }
              }
          }
          EOF_APP_SRC_MAIN_JAVA_COM_LIONPLAYER_APP_LIONPLAYERAPP_KT_3

          cat << 'EOF_APP_SRC_MAIN_JAVA_COM_LIONPLAYER_APP_ADAPTER_COILEXTENSIONS_KT_4' > app/src/main/java/com/lionplayer/app/adapter/CoilExtensions.kt
          package com.lionplayer.app.adapter
          
          import android.content.Context
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.widget.ImageView
          import coil.ImageLoader
          import coil.decode.DataSource
          import coil.decode.ImageSource
          import coil.fetch.FetchResult
          import coil.fetch.Fetcher
          import coil.fetch.SourceResult
          import coil.load
          import coil.request.Options
          import coil.request.videoFrameMillis
          import com.lionplayer.app.R
          import com.lionplayer.app.model.MediaItem
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okio.Buffer
          import java.io.File
          
          data class AudioCover(val uri: Uri, val path: String)
          
          class AudioCoverFetcher(
              private val context: Context,
              private val data: AudioCover
          ) : Fetcher {
          
              override suspend fun fetch(): FetchResult? = withContext(Dispatchers.IO) {
                  val retriever = MediaMetadataRetriever()
                  try {
                      if (data.path.isNotEmpty() && File(data.path).exists()) {
                          retriever.setDataSource(data.path)
                      } else if (data.uri.toString().isNotEmpty()) {
                          retriever.setDataSource(context, data.uri)
                      } else {
                          return@withContext null
                      }
                      val artBytes = retriever.embeddedPicture
                      if (artBytes != null) {
                          val buffer = Buffer().write(artBytes)
                          SourceResult(
                              source = ImageSource(buffer, context),
                              mimeType = "image/jpeg",
                              dataSource = DataSource.DISK
                          )
                      } else null
                  } catch (e: Exception) {
                      null
                  } finally {
                      try { retriever.release() } catch (e: Exception) {}
                  }
              }
          
              class Factory(private val context: Context) : Fetcher.Factory<AudioCover> {
                  override fun create(data: AudioCover, options: Options, imageLoader: ImageLoader): Fetcher {
                      return AudioCoverFetcher(context, data)
                  }
              }
          }
          
          fun ImageView.loadMediaThumbnail(item: MediaItem) {
              if (item.isFolder) {
                  if (item.uri.isEmpty()) {
                      setImageResource(R.drawable.ic_folder)
                  } else {
                      val uri = Uri.parse(item.uri)
                      if (item.isVideo) {
                          load(uri) {
                              placeholder(R.drawable.ic_folder)
                              error(R.drawable.ic_folder)
                              videoFrameMillis(1000)
                              size(256, 256)
                          }
                      } else {
                          load(AudioCover(uri, item.path)) {
                              placeholder(R.drawable.ic_folder)
                              error(R.drawable.ic_folder)
                              size(256, 256)
                          }
                      }
                  }
                  return
              }
          
              val placeholderRes = if (item.isVideo) R.drawable.ic_video else R.drawable.ic_music_note
              val uri = if (item.uri.isNotEmpty()) Uri.parse(item.uri) else Uri.fromFile(File(item.path))
          
              if (item.isVideo) {
                  load(uri) {
                      placeholder(placeholderRes)
                      error(placeholderRes)
                      videoFrameMillis(1000)
                      size(256, 256)
                  }
              } else {
                  load(AudioCover(uri, item.path)) {
                      placeholder(placeholderRes)
                      error(placeholderRes)
                      size(256, 256)
                  }
              }
          }
          EOF_APP_SRC_MAIN_JAVA_COM_LIONPLAYER_APP_ADAPTER_COILEXTENSIONS_KT_4

          cat << 'EOF_APP_SRC_MAIN_JAVA_COM_LIONPLAYER_APP_ADAPTER_MEDIAADAPTER_KT_5' > app/src/main/java/com/lionplayer/app/adapter/MediaAdapter.kt
          package com.lionplayer.app.adapter
          
          import android.graphics.Color
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import androidx.recyclerview.widget.RecyclerView
          import com.lionplayer.app.R
          import com.lionplayer.app.databinding.ItemMediaGridBinding
          import com.lionplayer.app.databinding.ItemMediaVideoBinding
          import com.lionplayer.app.model.MediaItem
          import java.io.File
          import java.util.Locale
          
          class MediaAdapter(
              private var items: List<MediaItem>,
              private var viewMode: Int,
              private var showExtensions: Boolean,
              var isSelectionMode: Boolean = false,
              private val onItemClick: (MediaItem) -> Unit,
              private val onItemLongClick: (MediaItem) -> Unit,
              private val onMoreOptionsClick: (MediaItem, View) -> Unit
          ) : RecyclerView.Adapter<MediaAdapter.BaseViewHolder>() {
          
              companion object {
                  const val VIEW_MODE_LIST = 0
                  const val VIEW_MODE_GRID_LARGE = 1
                  const val VIEW_MODE_GRID_SMALL = 2
              }
          
              fun updateData(newItems: List<MediaItem>, newViewMode: Int = viewMode, newShowExt: Boolean = showExtensions) {
                  this.items = newItems
                  this.viewMode = newViewMode
                  this.showExtensions = newShowExt
                  notifyDataSetChanged()
              }
          
              override fun getItemViewType(position: Int): Int = viewMode
          
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): BaseViewHolder {
                  val inflater = LayoutInflater.from(parent.context)
                  return if (viewType == VIEW_MODE_LIST) {
                      val binding = ItemMediaVideoBinding.inflate(inflater, parent, false)
                      ListViewHolder(binding)
                  } else {
                      val binding = ItemMediaGridBinding.inflate(inflater, parent, false)
                      GridViewHolder(binding)
                  }
              }
          
              override fun onBindViewHolder(holder: BaseViewHolder, position: Int) {
                  holder.bind(items[position])
              }
          
              override fun getItemCount(): Int = items.size
          
              abstract inner class BaseViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
                  abstract fun bind(item: MediaItem)
              }
          
              inner class ListViewHolder(private val binding: ItemMediaVideoBinding) : BaseViewHolder(binding.root) {
                  override fun bind(item: MediaItem) {
                      val ext = if (item.path.isNotEmpty()) File(item.path).extension else ""
                      val displayTitle = if (item.isFolder) {
                          item.title
                      } else if (showExtensions) {
                          if (item.title.contains(".") || ext.isEmpty()) item.title else "${item.title}.$ext"
                      } else {
                          item.title.substringBeforeLast('.')
                      }
                      binding.tvTitle.text = displayTitle
          
                      if (isSelectionMode && !item.isFolder) {
                          binding.ivCheck.visibility = View.VISIBLE
                          if (item.isSelected) {
                              binding.ivCheck.setImageResource(R.drawable.ic_check_circle)
                              binding.itemRootView.setBackgroundColor(Color.parseColor("#33FF9800"))
                          } else {
                              binding.ivCheck.setImageResource(R.drawable.bg_thumb_round)
                              binding.itemRootView.setBackgroundColor(Color.TRANSPARENT)
                          }
                      } else {
                          binding.ivCheck.visibility = View.GONE
                          binding.itemRootView.setBackgroundColor(Color.TRANSPARENT)
                      }
          
                      binding.ivThumbnail.loadMediaThumbnail(item)
          
                      if (item.isFolder) {
                          binding.tvSubInfo.visibility = View.GONE
                          binding.tvDetails.text = "${item.itemCount} عناصر"
                          binding.btnMore.visibility = View.GONE
                          binding.tvThumbDuration.visibility = View.GONE
                          binding.tvNewBadge.visibility = View.GONE
          
                          if (item.newCount > 0) {
                              binding.tvFolderNewCount.visibility = View.VISIBLE
                              binding.tvFolderNewCount.text = if (item.newCount > 99) "99+" else item.newCount.toString()
                          } else {
                              binding.tvFolderNewCount.visibility = View.GONE
                          }
                      } else {
                          binding.tvFolderNewCount.visibility = View.GONE
                          if (item.isNew && !(isSelectionMode && item.isSelected)) {
                              binding.tvNewBadge.visibility = View.VISIBLE
                          } else {
                              binding.tvNewBadge.visibility = View.GONE
                          }
          
                          if (item.duration > 0) {
                              binding.tvThumbDuration.visibility = View.VISIBLE
                              binding.tvThumbDuration.text = formatDuration(item.duration)
                          } else {
                              binding.tvThumbDuration.visibility = View.GONE
                          }
          
                          binding.tvSubInfo.visibility = View.VISIBLE
                          val albumStr = if (item.album.isNotEmpty() && item.album != "<unknown>") item.album else "ألبوم غير محدد"
                          val artistStr = if (item.artist.isNotEmpty() && item.artist != "<unknown>") item.artist else "فنان غير معروف"
                          binding.tvSubInfo.text = "الألبوم: $albumStr • الفنان: $artistStr"
          
                          val sizeFormatted = formatFileSize(item.size)
                          val durationFormatted = formatDuration(item.duration)
                          val favMark = if (item.isFavorite) " ❤️" else ""
                          binding.tvDetails.text = "$durationFormatted | $sizeFormatted$favMark"
          
                          binding.btnMore.visibility = if (isSelectionMode) View.GONE else View.VISIBLE
                          binding.btnMore.setOnClickListener { v -> onMoreOptionsClick(item, v) }
                      }
          
                      itemView.setOnClickListener { onItemClick(item) }
                      itemView.setOnLongClickListener {
                          if (!item.isFolder) {
                              onItemLongClick(item)
                              true
                          } else false
                      }
                  }
              }
          
              inner class GridViewHolder(private val binding: ItemMediaGridBinding) : BaseViewHolder(binding.root) {
                  override fun bind(item: MediaItem) {
                      val ext = if (item.path.isNotEmpty()) File(item.path).extension else ""
                      val displayTitle = if (item.isFolder) {
                          item.title
                      } else if (showExtensions) {
                          if (item.title.contains(".") || ext.isEmpty()) item.title else "${item.title}.$ext"
                      } else {
                          item.title.substringBeforeLast('.')
                      }
                      binding.tvTitle.text = displayTitle
          
                      if (isSelectionMode && !item.isFolder) {
                          binding.ivCheck.visibility = View.VISIBLE
                          if (item.isSelected) {
                              binding.ivCheck.setImageResource(R.drawable.ic_check_circle)
                              binding.itemRootView.setBackgroundColor(Color.parseColor("#33FF9800"))
                          } else {
                              binding.ivCheck.setImageResource(R.drawable.bg_thumb_round)
                              binding.itemRootView.setBackgroundColor(Color.TRANSPARENT)
                          }
                      } else {
                          binding.ivCheck.visibility = View.GONE
                          binding.itemRootView.setBackgroundColor(Color.TRANSPARENT)
                      }
          
                      binding.ivThumbnail.loadMediaThumbnail(item)
          
                      if (item.isFolder) {
                          binding.tvSubInfo.visibility = View.GONE
                          binding.tvDetails.text = "${item.itemCount} عناصر"
                          binding.btnMore.visibility = View.GONE
                          binding.tvThumbDuration.visibility = View.GONE
                          binding.tvNewBadge.visibility = View.GONE
          
                          if (item.newCount > 0) {
                              binding.tvFolderNewCount.visibility = View.VISIBLE
                              binding.tvFolderNewCount.text = if (item.newCount > 99) "99+" else item.newCount.toString()
                          } else {
                              binding.tvFolderNewCount.visibility = View.GONE
                          }
                      } else {
                          binding.tvFolderNewCount.visibility = View.GONE
                          if (item.isNew && !(isSelectionMode && item.isSelected)) {
                              binding.tvNewBadge.visibility = View.VISIBLE
                          } else {
                              binding.tvNewBadge.visibility = View.GONE
                          }
          
                          if (item.duration > 0) {
                              binding.tvThumbDuration.visibility = View.VISIBLE
                              binding.tvThumbDuration.text = formatDuration(item.duration)
                          } else {
                              binding.tvThumbDuration.visibility = View.GONE
                          }
          
                          binding.tvSubInfo.visibility = View.VISIBLE
                          val albumStr = if (item.album.isNotEmpty() && item.album != "<unknown>") item.album else "ألبوم غير محدد"
                          val artistStr = if (item.artist.isNotEmpty() && item.artist != "<unknown>") item.artist else "فنان غير معروف"
                          binding.tvSubInfo.text = "الألبوم: $albumStr • الفنان: $artistStr"
          
                          val sizeFormatted = formatFileSize(item.size)
                          val durationFormatted = formatDuration(item.duration)
                          val favMark = if (item.isFavorite) " ❤️" else ""
                          binding.tvDetails.text = "$durationFormatted | $sizeFormatted$favMark"
          
                          binding.btnMore.visibility = if (isSelectionMode) View.GONE else View.VISIBLE
                          binding.btnMore.setOnClickListener { v -> onMoreOptionsClick(item, v) }
                      }
          
                      itemView.setOnClickListener { onItemClick(item) }
                      itemView.setOnLongClickListener {
                          if (!item.isFolder) {
                              onItemLongClick(item)
                              true
                          } else false
                      }
                  }
              }
          
              private fun formatFileSize(size: Long): String {
                  if (size <= 0) return "0 MB"
                  val mb = size / (1024.0 * 1024.0)
                  return String.format(Locale.US, "%.1f MB", mb)
              }
          
              private fun formatDuration(durationMs: Long): String {
                  val totalSec = durationMs / 1000
                  val sec = totalSec % 60
                  val min = (totalSec / 60) % 60
                  val hrs = totalSec / 3600
                  return if (hrs > 0) {
