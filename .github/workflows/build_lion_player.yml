                  super.onCreate(savedInstanceState)
                  hideSystemBars()
                  binding = ActivitySplashBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  binding.ivSplashLogo.alpha = 0f
                  binding.ivSplashLogo.scaleX = 0.65f
                  binding.ivSplashLogo.scaleY = 0.65f
                  binding.tvSplashName.alpha = 0f
                  binding.tvSplashName.translationY = 35f

                  binding.ivSplashLogo.animate()
                      .alpha(1f)
                      .scaleX(1.08f)
                      .scaleY(1.08f)
                      .setDuration(350)
                      .setInterpolator(AccelerateDecelerateInterpolator())
                      .withEndAction {
                          binding.ivSplashLogo.animate().scaleX(1.0f).scaleY(1.0f).setDuration(200).start()
                      }
                      .start()

                  binding.tvSplashName.animate()
                      .alpha(1f)
                      .translationY(0f)
                      .setDuration(400)
                      .setStartDelay(100)
                      .start()

                  Handler(Looper.getMainLooper()).postDelayed({
                      val intent = Intent(this, MainActivity::class.java)
                      startActivity(intent)
                      overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
                      finish()
                  }, 850)
              }

