package com.lionplayer.app.data.vault

import android.content.Context
import android.util.Base64
import java.io.File
import java.io.FileInputStream
import java.io.FileOutputStream
import java.security.SecureRandom
import javax.crypto.Cipher
import javax.crypto.CipherInputStream
import javax.crypto.CipherOutputStream
import javax.crypto.spec.IvParameterSpec
import javax.crypto.spec.SecretKeySpec

object VaultManager {
    private const val PREFS_NAME = "lion_vault_prefs"
    private const val KEY_SECRET = "vault_master_key"
    private const val KEY_IV = "vault_iv"

    fun getOrCreateKey(context: Context): ByteArray {
        val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
        val saved = prefs.getString(KEY_SECRET, null)
        if (saved != null) {
            return Base64.decode(saved, Base64.NO_WRAP)
        }
        val key = ByteArray(32) // AES-256
        SecureRandom().nextBytes(key)
        prefs.edit().putString(KEY_SECRET, Base64.encodeToString(key, Base64.NO_WRAP)).apply()
        return key
    }

    fun getOrCreateIv(context: Context): ByteArray {
        val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
        val saved = prefs.getString(KEY_IV, null)
        if (saved != null) {
            return Base64.decode(saved, Base64.NO_WRAP)
        }
        val iv = ByteArray(16) // 16 bytes for AES block
        SecureRandom().nextBytes(iv)
        prefs.edit().putString(KEY_IV, Base64.encodeToString(iv, Base64.NO_WRAP)).apply()
        return iv
    }

    fun getVaultDir(context: Context): File {
        val dir = File(context.filesDir, "lion_vault")
        if (!dir.exists()) dir.mkdirs()
        return dir
    }

    fun encryptFileToVault(context: Context, sourceFile: File): File {
        val key = getOrCreateKey(context)
        val iv = getOrCreateIv(context)
        val vaultDir = getVaultDir(context)
        val encryptedFile = File(vaultDir, "${System.currentTimeMillis()}_${sourceFile.name}.enc")

        val cipher = Cipher.getInstance("AES/CTR/NoPadding")
        cipher.init(Cipher.ENCRYPT_MODE, SecretKeySpec(key, "AES"), IvParameterSpec(iv))

        FileInputStream(sourceFile).use { fis ->
            FileOutputStream(encryptedFile).use { fos ->
                CipherOutputStream(fos, cipher).use { cos ->
                    val buffer = ByteArray(1024 * 64)
                    var read: Int
                    while (fis.read(buffer).also { read = it } != -1) {
                        cos.write(buffer, 0, read)
                    }
                    cos.flush()
                }
            }
        }
        return encryptedFile
    }

    fun getVaultFiles(context: Context): List<File> {
        val dir = getVaultDir(context)
        return dir.listFiles { f -> f.extension == "enc" }?.toList() ?: emptyList()
    }
}
