          cat << 'EOF' > app/src/main/java/com/lion/player/utils/AudioBoostManager.kt
          package com.lion.player.utils

          import android.content.Context
          import android.media.AudioManager
          import android.media.audiofx.LoudnessEnhancer

          class AudioBoostManager(context: Context) {
              private val audioManager = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private var loudnessEnhancer: LoudnessEnhancer? = null

              fun attachAudioSession(audioSessionId: Int) {
                  try {
                      if (audioSessionId > 0) {
                          loudnessEnhancer = LoudnessEnhancer(audioSessionId)
                      }
                  } catch (_: Exception) {}
              }

              fun setBoostLevel(percent: Int) {
                  val maxStreamVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                  if (percent <= 100) {
                      try {
                          loudnessEnhancer?.enabled = false
                      } catch (_: Exception) {}
                      val targetVol = (percent * maxStreamVol) / 100
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, targetVol, 0)
                  } else {
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, maxStreamVol, 0)
                      try {
                          loudnessEnhancer?.let {
                              it.enabled = true
                              val boostGainMb = ((percent - 100) * 20)
                              it.setTargetGain(boostGainMb)
                          }
                      } catch (_: Exception) {}
                  }
              }

              fun release() {
                  try {
                      loudnessEnhancer?.release()
                      loudnessEnhancer = null
                  } catch (_: Exception) {}
              }
          }
