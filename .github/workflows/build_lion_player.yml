    private fun showOpenSubtitlesResultsDialog(results: List<SubtitleItem>) {
        val names = results.map { "${it.title} [${it.language}]" }.toTypedArray()
        AlertDialog.Builder(this)
            .setTitle("نتائج ترجمات OpenSubtitles")
            .setItems(names) { _, which ->
                val selected = results[which]
                Toast.makeText(this, "جاري تحميل الترجمة وتطبيقها...", Toast.LENGTH_SHORT).show()
                OpenSubtitlesRepository.downloadSubtitle(this, selected) { path ->
                    runOnUiThread {
                        if (path != null) {
                            LionPlayerManager.setSubtitleForCurrent(this, Uri.fromFile(File(path)).toString())
                            Toast.makeText(this, "تم تطبيق الترجمة بنجاح ✅", Toast.LENGTH_SHORT).show()
                        } else {
                            Toast.makeText(this, "فشل تحميل ملف الترجمة", Toast.LENGTH_SHORT).show()
                        }
                    }
                }
            }
            .setNegativeButton("إلغاء", null)
            .show()
