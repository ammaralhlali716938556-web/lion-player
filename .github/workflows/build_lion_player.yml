          cat << 'EOF_PLAYER_ACT' > app/src/main/java/com/lionplayer/app/ui/PlayerActivity.kt
          package com.lionplayer.app.ui

          import android.app.PictureInPictureParams
          import android.content.pm.ActivityInfo
          import android.content.res.Configuration
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Rational
          import android.view.View
          import android.view.WindowManager
          import android.widget.SeekBar
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.Player
          import androidx.media3.ui.AspectRatioFrameLayout
          import com.lionplayer.app.R
          import com.lionplayer.app.databinding.ActivityPlayerBinding
          import com.lionplayer.app.player.LionPlayerManager

          class PlayerActivity : AppCompatActivity() {

          private lateinit var binding: ActivityPlayerBinding
          private val handler = Handler(Looper.getMainLooper())
          private var isControlsVisible = true
          private var isLocked = false
          private var resizeModeIndex = 0
          private val resizeModes = intArrayOf(
          AspectRatioFrameLayout.RESIZE_MODE_FIT,
          AspectRatioFrameLayout.RESIZE_MODE_FILL,
          AspectRatioFrameLayout.RESIZE_MODE_ZOOM,
          AspectRatioFrameLayout.RESIZE_MODE_FIXED_WIDTH,
          AspectRatioFrameLayout.RESIZE_MODE_FIXED_HEIGHT
          )
          private val resizeLabels = arrayOf("ملاءمة الشاشة", "ملء الشاشة", "تكبير (Zoom)", "عرض ثابت", "ارتفاع ثابت")

          private val progressRunnable = object : Runnable {
          override fun run() {
            val player = LionPlayerManager.player
            if (player != null && player.isPlaying) {
                val current = player.currentPosition
                val total = player.duration.coerceAtLeast(0L)
                binding.tvCurrentTime.text = LionPlayerManager.formatDuration(current)
                binding.tvTotalTime.text = LionPlayerManager.formatDuration(total)
                if (total > 0) {
                    binding.playerSeekBar.progress = ((current * 1000) / total).toInt()
                }
            }
            handler.postDelayed(this, 1000)
          }
          }

          override fun onCreate(savedInstanceState: Bundle?) {
          super.onCreate(savedInstanceState)
          binding = ActivityPlayerBinding.inflate(layoutInflater)
          setContentView(binding.root)

          window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

          setupPlayerView()
          setupControls()
          setupListeners()
          }

          override fun onStart() {
          super.onStart()
          handler.post(progressRunnable)
          }

          override fun onStop() {
          super.onStop()
          handler.removeCallbacks(progressRunnable)
          }

          private fun setupPlayerView() {
          val player = LionPlayerManager.getOrCreatePlayer(this)
          binding.playerView.player = player
          binding.playerView.useController = false

          val curr = LionPlayerManager.getCurrentItem()
          binding.tvVideoTitle.text = curr?.title ?: "مشغل الوسائط"
          }

          private fun setupControls() {
          binding.btnBack.setOnClickListener { finish() }

          binding.btnPlayPause.setOnClickListener {
            LionPlayerManager.togglePlayPause(this)
            updatePlayPauseButton()
          }

          binding.btnNext.setOnClickListener {
            LionPlayerManager.playNext(this)
            val curr = LionPlayerManager.getCurrentItem()
            binding.tvVideoTitle.text = curr?.title ?: ""
            updatePlayPauseButton()
          }

          binding.btnPrev.setOnClickListener {
            LionPlayerManager.playPrevious(this)
            val curr = LionPlayerManager.getCurrentItem()
            binding.tvVideoTitle.text = curr?.title ?: ""
            updatePlayPauseButton()
          }

          binding.btnForward10.setOnClickListener {
            val player = LionPlayerManager.player ?: return@setOnClickListener
            player.seekTo((player.currentPosition + 10000).coerceAtMost(player.duration))
          }

          binding.btnRewind10.setOnClickListener {
            val player = LionPlayerManager.player ?: return@setOnClickListener
            player.seekTo((player.currentPosition - 10000).coerceAtLeast(0))
          }

          binding.btnSubtitles.setOnClickListener {
            SubtitleSettingsBottomSheet.newInstance().show(supportFragmentManager, SubtitleSettingsBottomSheet.TAG)
          }

          binding.btnAudioTracks.setOnClickListener {
            showAudioTrackDialog()
          }

          binding.btnDecoder.setOnClickListener {
            val nextMode = if (LionPlayerManager.currentDecoderMode == "HW") "SW" else "HW"
            val newPlayer = LionPlayerManager.switchDecoder(this, nextMode)
            binding.playerView.player = newPlayer
            binding.btnDecoder.text = nextMode
            Toast.makeText(this, "وضع مفكك الترميز: $nextMode", Toast.LENGTH_SHORT).show()
          }

          binding.btnRepeat.setOnClickListener {
            val isRepeat = LionPlayerManager.toggleRepeat()
            Toast.makeText(this, if (isRepeat) "تكرار التشغيل مفعل" else "تكرار التشغيل ملغي", Toast.LENGTH_SHORT).show()
          }

          binding.btnRotate.setOnClickListener {
            requestedOrientation = if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) {
                ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
            } else {
                ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
            }
          }

          binding.btnPip.setOnClickListener {
            enterPipMode()
          }

          binding.btnLock.setOnClickListener {
            lockUi(true)
          }

          binding.btnUnlock.setOnClickListener {
            lockUi(false)
          }

          binding.btnResize.setOnClickListener {
            resizeModeIndex = (resizeModeIndex + 1) % resizeModes.size
            binding.playerView.resizeMode = resizeModes[resizeModeIndex]
            Toast.makeText(this, resizeLabels[resizeModeIndex], Toast.LENGTH_SHORT).show()
          }

          binding.btnSpeed.setOnClickListener {
            showSpeedDialog()
          }

          binding.playerContainer.setOnClickListener {
            if (!isLocked) {
                toggleControls()
            }
          }
          }

          private fun setupListeners() {
          binding.playerSeekBar.max = 1000
          binding.playerSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
            override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                if (fromUser) {
                    val player = LionPlayerManager.player ?: return
                    val total = player.duration.coerceAtLeast(0L)
                    val seekTarget = (progress * total) / 1000
                    binding.tvCurrentTime.text = LionPlayerManager.formatDuration(seekTarget)
                }
            }
            override fun onStartTrackingTouch(seekBar: SeekBar?) {}
            override fun onStopTrackingTouch(seekBar: SeekBar?) {
                val player = LionPlayerManager.player ?: return
                val total = player.duration.coerceAtLeast(0L)
                val seekTarget = ((seekBar?.progress ?: 0) * total) / 1000
                player.seekTo(seekTarget)
            }
          })
          }

          private fun updatePlayPauseButton() {
          val player = LionPlayerManager.player
          val isPlaying = player?.isPlaying == true
          binding.btnPlayPause.setImageResource(
            if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play
          )
          }

          private fun toggleControls() {
          isControlsVisible = !isControlsVisible
          val vis = if (isControlsVisible) View.VISIBLE else View.GONE
          binding.topControls.visibility = vis
          binding.bottomControls.visibility = vis
          }

          private fun lockUi(locked: Boolean) {
          isLocked = locked
          if (locked) {
            binding.topControls.visibility = View.GONE
            binding.bottomControls.visibility = View.GONE
            binding.btnUnlock.visibility = View.VISIBLE
            Toast.makeText(this, "تم قفل الشاشة لمنع اللمس العرضي", Toast.LENGTH_SHORT).show()
          } else {
            binding.btnUnlock.visibility = View.GONE
            binding.topControls.visibility = View.VISIBLE
            binding.bottomControls.visibility = View.VISIBLE
            isControlsVisible = true
          }
          }

          private fun enterPipMode() {
          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            val params = PictureInPictureParams.Builder()
                .setAspectRatio(Rational(16, 9))
                .build()
            enterPictureInPictureMode(params)
          } else {
            Toast.makeText(this, "خاصية الصورة داخل صورة غير مدعومة على هذا الإصدار", Toast.LENGTH_SHORT).show()
          }
          }

          override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
          super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
          if (isInPictureInPictureMode) {
            binding.topControls.visibility = View.GONE
            binding.bottomControls.visibility = View.GONE
            binding.btnUnlock.visibility = View.GONE
          } else {
            binding.topControls.visibility = View.VISIBLE
            binding.bottomControls.visibility = View.VISIBLE
          }
          }

          private fun showSpeedDialog() {
          val speeds = arrayOf("0.25x", "0.5x", "0.75x", "1.0x (طبيعي)", "1.25x", "1.5x", "1.75x", "2.0x")
          val speedValues = floatArrayOf(0.25f, 0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 1.75f, 2.0f)

          AlertDialog.Builder(this)
            .setTitle("سرعة التشغيل")
            .setItems(speeds) { _, which ->
                val chosen = speedValues[which]
                LionPlayerManager.player?.playbackParameters = androidx.media3.common.PlaybackParameters(chosen)
                binding.btnSpeed.text = "${chosen}x"
            }
            .show()
          }

          private fun showAudioTrackDialog() {
          val player = LionPlayerManager.player ?: return
          val currentTracks = player.currentTracks
          val audioTracks = mutableListOf<Pair<androidx.media3.common.TrackGroup, Int>>()
          val trackNames = mutableListOf<String>()

          for (group in currentTracks.groups) {
            if (group.type == androidx.media3.common.C.TRACK_TYPE_AUDIO) {
                for (i in 0 until group.length) {
                    val format = group.getTrackFormat(i)
                    val label = format.label ?: format.language ?: "مسار صوتي ${audioTracks.size + 1}"
                    trackNames.add(label)
                    audioTracks.add(Pair(group.mediaTrackGroup, i))
                }
            }
          }

          if (audioTracks.isEmpty()) {
            Toast.makeText(this, "لا توجد مسارات صوتية إضافية", Toast.LENGTH_SHORT).show()
            return
          }

          AlertDialog.Builder(this)
            .setTitle("اختر المسار الصوتي")
            .setItems(trackNames.toTypedArray()) { _, which ->
                val pair = audioTracks[which]
                LionPlayerManager.selectAudioTrack(pair.first, pair.second)
                Toast.makeText(this, "تم تفعيل: ${trackNames[which]}", Toast.LENGTH_SHORT).show()
            }
            .show()
          }
          }

