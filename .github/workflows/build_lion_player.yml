    private fun refreshListDisplay() {
        displayedList.clear()

        when (currentTab) {
            TAB_VIDEO -> {
                if (isVideoFolderMode && currentSelectedFolder == null) {
                    toolbar.title = "مجلدات الفيديو"
                    val grouped = rawVideosList.groupBy { it.parentFolder }
                    for ((folderName, items) in grouped) {
                        displayedList.add(
                            MediaItem(
                                id = folderName.hashCode().toLong(),
                                title = folderName,
                                uri = "",
                                duration = 0,
                                size = items.sumOf { it.size },
                                dateAdded = items.maxOfOrNull { it.dateAdded } ?: 0,
                                isVideo = true,
                                parentFolder = folderName,
                                isFolder = true,
                                itemCount = items.size
                            )
                        )
                    }
                } else if (isVideoFolderMode && currentSelectedFolder != null) {
                    toolbar.title = currentSelectedFolder
                    displayedList.addAll(rawVideosList.filter { it.parentFolder == currentSelectedFolder })
                } else {
                    toolbar.title = "كافة الفيديوهات"
                    displayedList.addAll(rawVideosList)
                }
            }
            TAB_AUDIO -> {
                if (isAudioFolderMode && currentSelectedFolder == null) {
                    toolbar.title = "مجلدات الصوت"
                    val grouped = rawAudioList.groupBy { it.parentFolder }
                    for ((folderName, items) in grouped) {
                        displayedList.add(
                            MediaItem(
                                id = folderName.hashCode().toLong(),
                                title = folderName,
                                uri = "",
                                duration = 0,
                                size = items.sumOf { it.size },
                                dateAdded = items.maxOfOrNull { it.dateAdded } ?: 0,
                                isVideo = false,
                                parentFolder = folderName,
                                isFolder = true,
                                itemCount = items.size
                            )
                        )
                    }
                } else if (isAudioFolderMode && currentSelectedFolder != null) {
                    toolbar.title = currentSelectedFolder
                    displayedList.addAll(rawAudioList.filter { it.parentFolder == currentSelectedFolder })
                } else {
                    toolbar.title = "كافة الصوتيات"
                    displayedList.addAll(rawAudioList)
                }
            }
            TAB_ALL -> {
                toolbar.title = "جميع الملفات"
                displayedList.addAll(rawVideosList)
                displayedList.addAll(rawAudioList)
            }
            TAB_FAVORITES -> {
                toolbar.title = "المفضلة"
                val favVideos = rawVideosList.filter { it.isFavorite }
                val favAudios = rawAudioList.filter { it.isFavorite }
                displayedList.addAll(favVideos)
                displayedList.addAll(favAudios)
            }
        }

        applySorting()
        mediaAdapter.updateData(displayedList, viewStyle, showExtensions, isSelectionMode)
        tvEmptyState.visibility = if (displayedList.isEmpty()) View.VISIBLE else View.GONE
    }

    private fun applySorting() {
        val comparator = when (sortBy) {
            "name" -> compareBy<MediaItem> { it.title.lowercase() }
            "date" -> compareBy { it.dateAdded }
            "size" -> compareBy { it.size }
            "duration" -> compareBy { it.duration }
            else -> compareBy { it.title.lowercase() }
        }
        if (sortAsc) {
            displayedList.sortWith(comparator)
        } else {
            displayedList.sortWith(comparator.reversed())
        }
    }

    override fun onCreateOptionsMenu(menu: Menu?): Boolean {
        menuInflater.inflate(R.menu.top_main_menu, menu)
        val searchItem = menu?.findItem(R.id.action_search)
        val searchView = searchItem?.actionView as? SearchView
        searchView?.queryHint = "ابحث عن أي مقطع..."
        searchView?.setOnQueryTextListener(object : SearchView.OnQueryTextListener {
            override fun onQueryTextSubmit(query: String?): Boolean = false
            override fun onQueryTextChange(newText: String?): Boolean {
                filterSearch(newText.orEmpty())
                return true
            }
        })

        val extItem = menu?.findItem(R.id.action_toggle_extension)
        extItem?.isChecked = showExtensions

        return true
    }

    private fun filterSearch(query: String) {
        val combined = mutableListOf<MediaItem>()
        when (currentTab) {
            TAB_VIDEO -> combined.addAll(rawVideosList)
            TAB_AUDIO -> combined.addAll(rawAudioList)
            TAB_ALL -> { combined.addAll(rawVideosList); combined.addAll(rawAudioList) }
            TAB_FAVORITES -> {
                combined.addAll(rawVideosList.filter { it.isFavorite })
                combined.addAll(rawAudioList.filter { it.isFavorite })
            }
        }
        val filtered = combined.filter { it.title.contains(query, ignoreCase = true) }
        displayedList.clear()
        displayedList.addAll(filtered)
        applySorting()
        mediaAdapter.updateData(displayedList, viewStyle, showExtensions, isSelectionMode)
    }

    override fun onOptionsItemSelected(item: MenuItem): Boolean {
        when (item.itemId) {
            R.id.action_refresh -> {
                Toast.makeText(this, "جاري تحديث المقاطع...", Toast.LENGTH_SHORT).show()
                loadMedia()
                return true
            }
            R.id.action_view_mode -> {
                showViewStyleDialog()
                return true
            }
            R.id.action_display_mode -> {
                showDisplayModeDialog()
                return true
            }
            R.id.action_sort -> {
                showSortByDialog()
                return true
            }
            R.id.action_order -> {
                showOrderDialog()
                return true
            }
            R.id.action_toggle_extension -> {
                showExtensions = !showExtensions
                item.isChecked = showExtensions
                saveCurrentState()
                mediaAdapter.updateData(displayedList, viewStyle, showExtensions, isSelectionMode)
                val msg = if (showExtensions) "تم إظهار الامتدادات بجانب اسم الملف" else "تم إخفاء الامتدادات"
                Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                return true
            }
            R.id.action_settings -> {
                showGeneralSettingsDialog()
                return true
            }
        }
        return super.onOptionsItemSelected(item)
    }

    // نافذة الإعدادات العامة (سماعة البلوتوث وكلمات الأغاني)
    private fun showGeneralSettingsDialog() {
        val dialogView = LinearLayout(this).apply {
