                  app:title="@string/vault_title"
                  app:titleTextColor="@color/text_primary"
                  app:layout_constraintTop_toTopOf="parent" />
          
              <!-- Auth Keypad Container -->
              <LinearLayout
                  android:id="@+id/layoutAuth"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:gravity="center"
                  android:orientation="vertical"
                  android:padding="32dp"
                  app:layout_constraintTop_toBottomOf="@id/toolbarVault"
                  app:layout_constraintBottom_toBottomOf="parent">
          
                  <ImageView
                      android:layout_width="72dp"
                      android:layout_height="72dp"
                      android:src="@drawable/ic_vault"
                      app:tint="@color/primary" />
          
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="الخزنة السرية المشفرة (AES-256)"
                      android:textColor="@color/text_primary"
                      android:textSize="18sp"
                      android:textStyle="bold" />
          
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="أدخل رمز PIN أو استخدم البصمة الحيوية لفك القفل"
                      android:textColor="@color/text_secondary"
                      android:textSize="13sp" />
          
                  <EditText
                      android:id="@+id/etPin"
                      android:layout_width="200dp"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:gravity="center"
                      android:hint="••••"
                      android:inputType="numberPassword"
                      android:maxLength="6"
                      android:textSize="24sp" />
          
                  <Button
                      android:id="@+id/btnUnlockPin"
                      android:layout_width="200dp"
                      android:layout_height="48dp"
                      android:layout_marginTop="16dp"
                      android:backgroundTint="@color/primary"
                      android:text="دخول"
                      android:textColor="#FFFFFF" />
          
                  <Button
                      android:id="@+id/btnBiometric"
                      android:layout_width="200dp"
                      android:layout_height="48dp"
                      android:layout_marginTop="12dp"
                      android:text="استخدام البصمة" />
              </LinearLayout>
          
              <!-- Vault Content Container -->
              <LinearLayout
                  android:id="@+id/layoutVaultContent"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:orientation="vertical"
                  android:visibility="gone"
                  app:layout_constraintTop_toBottomOf="@id/toolbarVault"
                  app:layout_constraintBottom_toBottomOf="parent">
          
                  <Button
                      android:id="@+id/btnImportMedia"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:layout_margin="12dp"
                      android:backgroundTint="@color/primary"
                      android:text="+ استيراد وتشفير ملفات إلى الخزنة"
                      android:textColor="#FFFFFF" />
          
                  <androidx.recyclerview.widget.RecyclerView
                      android:id="@+id/rvVaultMedia"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1" />
              </LinearLayout>
          
          </androidx.constraintlayout.widget.ConstraintLayout>
