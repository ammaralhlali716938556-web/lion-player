          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true"
              android:background="@color/app_background">
          
              <com.google.android.material.appbar.MaterialToolbar
                  android:id="@+id/vaultToolbar"
                  android:layout_width="match_parent"
                  android:layout_height="?attr/actionBarSize"
                  android:background="@color/app_surface"
                  app:navigationIcon="@drawable/ic_back"
                  app:title="@string/vault_title"
                  app:titleTextColor="@color/text_primary"
                  app:layout_constraintTop_toTopOf="parent" />
          
              <LinearLayout
                  android:id="@+id/filterBar"
                  android:layout_width="match_parent"
                  android:layout_height="48dp"
                  android:background="@color/app_surface"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp"
                  app:layout_constraintTop_toBottomOf="@id/vaultToolbar">
          
                  <TextView
                      android:id="@+id/filterAll"
                      android:layout_width="wrap_content"
                      android:layout_height="34dp"
                      android:background="@drawable/bg_chip_selector"
                      android:gravity="center"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp"
                      android:text="الكل"
                      android:textColor="@color/color_chip_text"
                      android:textSize="12sp"
                      android:textStyle="bold" />
          
                  <TextView
                      android:id="@+id/filterVideos"
                      android:layout_width="wrap_content"
                      android:layout_height="34dp"
                      android:layout_marginStart="8dp"
                      android:background="@drawable/bg_chip_selector"
                      android:gravity="center"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp"
                      android:text="فيديوهات"
                      android:textColor="@color/color_chip_text"
                      android:textSize="12sp"
                      android:textStyle="bold" />
          
                  <TextView
                      android:id="@+id/filterAudios"
                      android:layout_width="wrap_content"
                      android:layout_height="34dp"
                      android:layout_marginStart="8dp"
                      android:background="@drawable/bg_chip_selector"
                      android:gravity="center"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp"
                      android:text="صوتيات"
                      android:textColor="@color/color_chip_text"
                      android:textSize="12sp"
                      android:textStyle="bold" />
          
                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />
          
                  <Button
                      android:id="@+id/btnAddFiles"
                      android:layout_width="wrap_content"
                      android:layout_height="36dp"
                      android:backgroundTint="@color/primary"
                      android:text="+ إضافة ملفات"
                      android:textColor="#FFFFFF"
                      android:textSize="11sp" />
              </LinearLayout>
          
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvVaultMedia"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:clipToPadding="false"
                  android:paddingTop="8dp"
                  android:paddingBottom="16dp"
                  app:layout_constraintTop_toBottomOf="@id/filterBar"
                  app:layout_constraintBottom_toBottomOf="parent" />
          
              <ProgressBar
                  android:id="@+id/pbVaultLoading"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:visibility="gone"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />
          
              <LinearLayout
                  android:id="@+id/layoutEmptyVault"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:orientation="vertical"
                  android:padding="32dp"
                  android:visibility="gone"
                  app:layout_constraintTop_toTopOf="@id/rvVaultMedia"
                  app:layout_constraintBottom_toBottomOf="@id/rvVaultMedia">
          
                  <ImageView
                      android:layout_width="84dp"
                      android:layout_height="84dp"
                      android:src="@drawable/ic_vault"
                      app:tint="@color/text_secondary" />
          
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="@string/vault_empty"
                      android:textColor="@color/text_primary"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:gravity="center" />
          
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:gravity="center"
                      android:text="الملفات المخفية هنا مشفرة بمعيار AES-256 GCM ومعزولة عن معرض الهاتف."
                      android:textColor="@color/text_secondary"
                      android:textSize="13sp" />
          
                  <Button
                      android:id="@+id/btnAddFilesEmpty"
                      android:layout_width="wrap_content"
                      android:layout_height="44dp"
                      android:layout_marginTop="20dp"
                      android:backgroundTint="@color/primary"
                      android:text="🔒 تشفير وإخفاء ملفات الآن"
                      android:textColor="#FFFFFF" />
              </LinearLayout>
          
          </androidx.constraintlayout.widget.ConstraintLayout>
