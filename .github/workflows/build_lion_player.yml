              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) applySystemBarsVisibility()
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  applySystemBarsVisibility()
              }

              private fun isInPictureInPictureModeCompat(): Boolean {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) isInPictureInPictureMode else false
              }

              /**
               * إظهار أزرار التنقل في الوضع الطولي وإخفاؤها تلقائياً في الوضع العرضي
               */
              private fun applySystemBarsVisibility() {
                  if (isInPictureInPictureModeCompat()) {
                      hideSystemBars()
                      return
                  }

                  val currentItem = LionPlayerManager.getCurrentItem()
                  val isVideo = currentItem?.isVideo ?: true

                  if (isVideo) {
                      val isLandscape = resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
                      if (isLandscape) {
                          hideSystemBars()
                      } else {
                          showNavigationBars()
                      }
                  } else {
                      showSystemBars()
                  }
              }

              private fun hideSystemBars() {
                  isSystemNavHidden = true
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let { controller ->
                          controller.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          controller.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          or View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      )
                  }
              }

              private fun showNavigationBars() {
                  isSystemNavHidden = false
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let { controller ->
                          controller.show(WindowInsets.Type.navigationBars())
                          controller.systemBarsBehavior = WindowInsetsController.BEHAVIOR_DEFAULT
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      var flags = window.decorView.systemUiVisibility
                      flags = flags and View.SYSTEM_UI_FLAG_HIDE_NAVIGATION.inv()
                      flags = flags and View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY.inv()
                      window.decorView.systemUiVisibility = flags
                  }
              }

              private fun showSystemBars() {
                  isSystemNavHidden = false
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let { controller ->
                          controller.show(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          controller.systemBarsBehavior = WindowInsetsController.BEHAVIOR_DEFAULT
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  }
              }

              private fun showAllControls() {
                  if (isInPictureInPictureModeCompat()) {
                      hideAllControls()
                      return
                  }
                  controlsVisible = true
                  topControls.visibility = View.VISIBLE
                  bottomControls.visibility = View.VISIBLE
                  handler.removeCallbacks(autoHideControlsRunnable)
                  handler.postDelayed(autoHideControlsRunnable, 3500)
              }

              private fun hideAllControls() {
                  controlsVisible = false
                  topControls.visibility = View.GONE
                  bottomControls.visibility = View.GONE
                  layoutLyrics.visibility = View.GONE
                  hudSeek.visibility = View.GONE
                  hudVolume.visibility = View.GONE
                  hudBrightness.visibility = View.GONE
                  handler.removeCallbacks(autoHideControlsRunnable)
                  if (LionPlayerManager.getCurrentItem()?.isVideo == true) {
                      applySystemBarsVisibility()
                  }
              }

              private fun enterPipMode() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      hideAllControls()
                      val params = PictureInPictureParams.Builder().build()
                      try {
                          enterPictureInPictureMode(params)
                      } catch (e: Exception) {
                          Toast.makeText(this, "تعذر تشغيل النافذة العائمة", Toast.LENGTH_SHORT).show()
                      }
                  } else {
                      Toast.makeText(this, "خاصية النافذة العائمة غير مدعومة", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  if (isInPictureInPictureMode) {
                      hideAllControls()
                  } else {
                      if (!isLocked) showAllControls()
                      applySystemBarsVisibility()
                  }
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && LionPlayerManager.getCurrentItem()?.isVideo == true && LionPlayerManager.player?.isPlaying == true) {
                      enterPipMode()
                  }
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  intent?.let { handleIntent(it) }
              }

              private fun handleIntent(intent: Intent) {
                  val incomingList = intent.getSerializableExtra("PLAYLIST") as? ArrayList<*>
                  val list = incomingList?.filterIsInstance<LionMediaItem>()?.let { ArrayList(it) }
                  val index = intent.getIntExtra("CURRENT_INDEX", -1)

                  if (list != null && index >= 0) LionPlayerManager.playPlaylist(this, list, index)
                  else LionPlayerManager.getCurrentItem()?.let { updateUIForItem(it) }
                  updatePlayPauseButton(LionPlayerManager.player?.isPlaying == true)
                  updateScreenLock()
              }

              private fun initViews() {
                  playerContainer = findViewById(R.id.playerContainer)
                  playerView = findViewById(R.id.playerView)
                  topControls = findViewById(R.id.topControls)
                  bottomControls = findViewById(R.id.bottomControls)
                  tvVideoTitle = findViewById(R.id.tvVideoTitle)
                  btnBack = findViewById(R.id.btnBack)
                  btnRotate = findViewById(R.id.btnRotate)
                  btnDecoder = findViewById(R.id.btnDecoder)
                  btnEqualizer = findViewById(R.id.btnEqualizer)
                  btnPip = findViewById(R.id.btnPip)
                  btnLock = findViewById(R.id.btnLock)
                  btnUnlock = findViewById(R.id.btnUnlock)
                  btnToggleNav = findViewById(R.id.btnToggleNav)
                  btnLyricsToggle = findViewById(R.id.btnLyricsToggle)

                  layoutLyrics = findViewById(R.id.layoutLyrics)
                  tvLyrics = findViewById(R.id.tvLyrics)

                  btnPrev = findViewById(R.id.btnPrev)
                  btnRewind10 = findViewById(R.id.btnRewind10)
                  btnPlayPause = findViewById(R.id.btnPlayPause)
                  btnForward10 = findViewById(R.id.btnForward10)
                  btnNext = findViewById(R.id.btnNext)
                  tvCurrentTime = findViewById(R.id.tvCurrentTime)
                  tvTotalTime = findViewById(R.id.tvTotalTime)
                  playerSeekBar = findViewById(R.id.playerSeekBar)
                  btnResize = findViewById(R.id.btnResize)
                  btnSpeed = findViewById(R.id.btnSpeed)

                  hudSeek = findViewById(R.id.hudSeek)
                  tvSeekTarget = findViewById(R.id.tvSeekTarget)
                  hudVolume = findViewById(R.id.hudVolume)
                  volumeProgressBar = findViewById(R.id.volumeProgressBar)
                  tvVolumeValue = findViewById(R.id.tvVolumeValue)
                  hudBrightness = findViewById(R.id.hudBrightness)
                  brightnessProgressBar = findViewById(R.id.brightnessProgressBar)
                  tvBrightnessValue = findViewById(R.id.tvBrightnessValue)
              }

              private fun initAudioManager() {
                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  maxSystemVolume = audioManager?.getStreamMaxVolume(AudioManager.STREAM_MUSIC) ?: 15
              }

              private fun initAudioEffects() {
                  try {
                      val sessionId = LionPlayerManager.player?.audioSessionId ?: 0
                      if (sessionId != C.AUDIO_SESSION_ID_UNSET && sessionId != 0) {
                          if (equalizer == null) equalizer = Equalizer(0, sessionId).apply { enabled = true }
                          if (bassBoost == null) bassBoost = BassBoost(0, sessionId).apply { enabled = true }
                          if (presetReverb == null) presetReverb = PresetReverb(0, sessionId).apply { enabled = true }
                      }
                  } catch (e: Exception) {}
              }

              private fun updateScreenLock() {
                  val isVideo = LionPlayerManager.getCurrentItem()?.isVideo == true
                  val isPlaying = LionPlayerManager.player?.isPlaying == true
                  if (isVideo && isPlaying && !isLocked) window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  else window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }

              private fun updateUIForItem(item: LionMediaItem) {
                  tvVideoTitle.text = item.title
                  val dur = item.duration.coerceAtLeast(0L)
                  tvTotalTime.text = formatDuration(dur)
                  playerSeekBar.max = dur.toInt()
                  val curr = LionPlayerManager.player?.currentPosition ?: 0L
                  playerSeekBar.progress = curr.toInt()
                  tvCurrentTime.text = formatDuration(curr)

                  val videoVis = if (item.isVideo) View.VISIBLE else View.GONE
                  btnRotate.visibility = videoVis
                  btnDecoder.visibility = videoVis
                  btnPip.visibility = videoVis
                  btnResize.visibility = videoVis
                  btnToggleNav.visibility = videoVis
                  btnLyricsToggle.visibility = if (!item.isVideo) View.VISIBLE else View.GONE

                  if (item.isVideo) layoutLyrics.visibility = View.GONE
                  else checkAndLoadLyrics(item)

                  applySystemBarsVisibility()
                  updateScreenLock()
              }

              private fun checkAndLoadLyrics(item: LionMediaItem) {
                  if (!prefs.getBoolean("show_lyrics", true) || item.isVideo) {
                      layoutLyrics.visibility = View.GONE
                      return
                  }
                  val lyrics = extractLyrics(item)
                  if (lyrics.isNotEmpty()) {
                      tvLyrics.text = lyrics
                      layoutLyrics.visibility = View.VISIBLE
                  } else {
                      layoutLyrics.visibility = View.GONE
                  }
              }

              private fun extractLyrics(item: LionMediaItem): String {
                  try {
                      if (item.path.isNotEmpty()) {
                          val lrc = File(item.path.substringBeforeLast('.') + ".lrc")
                          if (lrc.exists()) return lrc.readText()
                          val txt = File(item.path.substringBeforeLast('.') + ".txt")
                          if (txt.exists()) return txt.readText()
                      }
                      val retriever = MediaMetadataRetriever()
                      if (item.path.isNotEmpty() && File(item.path).exists()) retriever.setDataSource(item.path)
                      else retriever.setDataSource(this, Uri.parse(item.uri))
                      val comp = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_COMPILATION)
                      retriever.release()
                      return comp ?: ""
                  } catch (e: Exception) { return "" }
              }

              private fun updatePlayPauseButton(isPlaying: Boolean) {
                  btnPlayPause.setImageResource(if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play)
                  updateScreenLock()
              }

              private fun setupListeners() {
                  btnBack.setOnClickListener { handleBackAction() }

                  btnRotate.setOnClickListener {
                      rotationState = (rotationState + 1) % 3
                      when (rotationState) {
                          0 -> requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR
                          1 -> requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                          2 -> requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                      }
                      playerView.post { applySystemBarsVisibility() }
                  }

                  btnToggleNav.setOnClickListener {
                      if (isSystemNavHidden) { showNavigationBars(); Toast.makeText(this, "إظهار أزرار التنقل", Toast.LENGTH_SHORT).show() }
                      else { hideSystemBars(); Toast.makeText(this, "إخفاء أزرار التنقل", Toast.LENGTH_SHORT).show() }
                  }

                  btnLyricsToggle.setOnClickListener {
                      val current = LionPlayerManager.getCurrentItem() ?: return@setOnClickListener
                      if (layoutLyrics.visibility == View.VISIBLE) layoutLyrics.visibility = View.GONE
                      else { checkAndLoadLyrics(current); if (layoutLyrics.visibility != View.VISIBLE) Toast.makeText(this, "لا توجد كلمات متاحة", Toast.LENGTH_SHORT).show() }
                  }

                  btnPlayPause.setOnClickListener { LionPlayerManager.togglePlayPause(this) }
                  btnNext.setOnClickListener { LionPlayerManager.playNext(this) }
                  btnPrev.setOnClickListener { LionPlayerManager.playPrevious(this) }

                  btnRewind10.setOnClickListener {
                      LionPlayerManager.player?.let { p -> p.seekTo((p.currentPosition - 10000).coerceAtLeast(0L)); LionPlayerManager.updateNotification(this) }
                  }
                  btnForward10.setOnClickListener {
                      LionPlayerManager.player?.let { p -> p.seekTo((p.currentPosition + 10000).coerceAtMost(p.duration)); LionPlayerManager.updateNotification(this) }
                  }

                  btnEqualizer.setOnClickListener { showAudioSettingsDialog() }

                  btnLock.setOnClickListener {
                      isLocked = true
                      hideAllControls()
                      btnUnlock.visibility = View.VISIBLE
                      updateScreenLock()
                      Toast.makeText(this, "تم قفل الشاشة", Toast.LENGTH_SHORT).show()
                  }

                  btnUnlock.setOnClickListener {
                      isLocked = false
                      btnUnlock.visibility = View.GONE
                      showAllControls()
                      updateScreenLock()
                      Toast.makeText(this, "تم إلغاء قفل الشاشة", Toast.LENGTH_SHORT).show()
                  }

                  btnPip.setOnClickListener { enterPipMode() }

                  btnResize.setOnClickListener {
                      AlertDialog.Builder(this).setTitle("أبعاد الفيديو").setItems(arrayOf("ملاءمة للشاشة (Fit)", "ملء الشاشة (Crop)", "تمديد (Stretch)")) { _, which ->
                          playerView.resizeMode = when (which) { 1 -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM 2 -> AspectRatioFrameLayout.RESIZE_MODE_FILL else -> AspectRatioFrameLayout.RESIZE_MODE_FIT }
                      }.show()
                  }

                  btnSpeed.setOnClickListener {
                      val speeds = arrayOf("0.5x", "0.75x", "1.0x", "1.25x", "1.5x", "2.0x")
                      val vals = floatArrayOf(0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 2.0f)
                      AlertDialog.Builder(this).setTitle("سرعة التشغيل").setItems(speeds) { _, which ->
                          LionPlayerManager.player?.playbackParameters = PlaybackParameters(vals[which])
                          btnSpeed.text = speeds[which]
                      }.show()
                  }

                  playerSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) { LionPlayerManager.player?.seekTo(progress.toLong()); tvCurrentTime.text = formatDuration(progress.toLong()) }
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) { LionPlayerManager.updateNotification(this@PlayerActivity) }
                  })

                  topControls.setOnClickListener { if (!isLocked && controlsVisible) hideAllControls() }
                  bottomControls.setOnClickListener { if (!isLocked && controlsVisible) hideAllControls() }
              }

              private fun showAudioSettingsDialog() {
                  initAudioEffects()
                  val eq = equalizer ?: run { Toast.makeText(this, "المعادل غير مدعوم حالياً", Toast.LENGTH_SHORT).show(); return }
                  val builder = AlertDialog.Builder(this).setTitle("المعادل الصوتي")
                  val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(32, 24, 32, 24) }

                  layout.addView(Switch(this).apply {
                      text = "تفعيل المعادل الصوتي"
                      isChecked = eq.enabled
                      setTextColor(Color.WHITE)
                      setOnCheckedChangeListener { _, c -> eq.enabled = c; bassBoost?.enabled = c }
                  })

                  val numPresets = eq.numberOfPresets.toInt()
                  if (numPresets > 0) {
                      val presetNames = (0 until numPresets).map { eq.getPresetName(it.toShort()) }
                      val spinner = Spinner(this).apply { adapter = ArrayAdapter(this@PlayerActivity, android.R.layout.simple_spinner_dropdown_item, presetNames) }
                      try { spinner.setSelection(eq.currentPreset.toInt().coerceIn(0, numPresets - 1)) } catch (e: Exception) {}
                      spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, p1: View?, pos: Int, p3: Long) { try { eq.usePreset(pos.toShort()) } catch (e: Exception) {} }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                      layout.addView(spinner)
                  }
                  builder.setView(ScrollView(this).apply { addView(layout) }).setPositiveButton("تم", null).show()
              }

              /**
               * عند الضغط ضغطة واحدة يتم اخفاء كافة الأزرار فوراً
               */
              private fun setupGestureDetection() {
                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (!isLocked) {
                              if (controlsVisible) {
                                  hideAllControls()
                              } else {
                                  showAllControls()
                              }
                          }
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          if (isLocked) return true
                          val screenWidth = resources.displayMetrics.widthPixels
                          val p = LionPlayerManager.player ?: return true
                          if (e.x > screenWidth / 2) p.seekTo((p.currentPosition + 10000).coerceAtMost(p.duration))
                          else p.seekTo((p.currentPosition - 10000).coerceAtLeast(0L))
                          return true
                      }
                  })

                  playerView.setOnTouchListener { _, event ->
                      gestureDetector.onTouchEvent(event)
                      if (isLocked) return@setOnTouchListener true

                      val screenWidth = resources.displayMetrics.widthPixels
                      val screenHeight = resources.displayMetrics.heightPixels

                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              gestureStartX = event.x
                              initialGestureY = event.y
                              isDraggingVertical = false
                              isDraggingHorizontal = false
                              gestureMode = 0
                              initialSeekPosition = LionPlayerManager.player?.currentPosition ?: 0L
                              audioManager?.let { am -> initialVolume = am.getStreamVolume(AudioManager.STREAM_MUSIC) }
                              initialBrightness = window.attributes.screenBrightness.takeIf { it >= 0f } ?: 0.5f
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.x - gestureStartX
                              val dy = event.y - initialGestureY
                              if (!isDraggingVertical && !isDraggingHorizontal) {
                                  if (kotlin.math.abs(dy) > 25 && kotlin.math.abs(dy) > kotlin.math.abs(dx)) {
                                      isDraggingVertical = true
                                      gestureMode = if (gestureStartX > screenWidth / 2) GESTURE_VOLUME else GESTURE_BRIGHTNESS
                                  } else if (kotlin.math.abs(dx) > 25 && kotlin.math.abs(dx) > kotlin.math.abs(dy)) {
                                      isDraggingHorizontal = true
                                  }
                              }
                              if (isDraggingVertical) {
                                  val deltaPercent = ((initialGestureY - event.y) / (screenHeight * 0.6f)) * 100f
                                  if (gestureMode == GESTURE_VOLUME) updateVolumeByPercent(deltaPercent)
                                  else if (gestureMode == GESTURE_BRIGHTNESS) updateBrightnessByPercent(deltaPercent)
                              } else if (isDraggingHorizontal) {
                                  val maxDur = LionPlayerManager.player?.duration?.coerceAtLeast(0L) ?: 0L
                                  if (maxDur > 0) {
                                      targetSeekPosition = (initialSeekPosition + ((gestureStartX - event.x) / screenWidth * 90000L).toLong()).coerceIn(0L, maxDur)
                                      playerSeekBar.progress = targetSeekPosition.toInt()
                                      tvCurrentTime.text = formatDuration(targetSeekPosition)
                                      hudSeek.visibility = View.VISIBLE
                                      val diff = (targetSeekPosition - initialSeekPosition) / 1000
                                      tvSeekTarget.text = "${if (diff >= 0) "+" else ""}${diff}s\n${formatDuration(targetSeekPosition)} / ${formatDuration(maxDur)}"
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              if (isDraggingHorizontal) { LionPlayerManager.player?.seekTo(targetSeekPosition); LionPlayerManager.updateNotification(this); hudSeek.visibility = View.GONE }
                              hudVolume.visibility = View.GONE
                              hudBrightness.visibility = View.GONE
                              isDraggingVertical = false
                              isDraggingHorizontal = false
                          }
                      }
                      true
                  }
              }

              private fun updateVolumeByPercent(deltaPercent: Float) {
                  audioManager?.let { am ->
                      val targetPercent = ((initialVolume.toFloat() / maxSystemVolume) * 100f + deltaPercent).coerceIn(0f, 100f)
                      val targetVol = kotlin.math.round((targetPercent / 100f) * maxSystemVolume).toInt().coerceIn(0, maxSystemVolume)
                      am.setStreamVolume(AudioManager.STREAM_MUSIC, targetVol, 0)
                      hudVolume.visibility = View.VISIBLE
                      volumeProgressBar.progress = targetPercent.toInt()
                      tvVolumeValue.text = "${targetPercent.toInt()}%"
                  }
              }

              private fun updateBrightnessByPercent(deltaPercent: Float) {
                  val targetPercent = (initialBrightness * 100f + deltaPercent).coerceIn(1f, 100f)
                  val lp = window.attributes
                  lp.screenBrightness = (targetPercent / 100f).coerceIn(0.01f, 1.0f)
                  window.attributes = lp
                  hudBrightness.visibility = View.VISIBLE
                  brightnessProgressBar.progress = targetPercent.toInt()
                  tvBrightnessValue.text = "${targetPercent.toInt()}%"
              }

              private fun formatDuration(durationMs: Long): String {
                  val sec = (durationMs / 1000) % 60
                  val min = (durationMs / (1000 * 60)) % 60
                  val hrs = durationMs / (1000 * 3600)
                  return if (hrs > 0) String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
                  else String.format(Locale.US, "%02d:%02d", min, sec)
              }

              private fun handleBackAction() {
                  if (isLocked) { Toast.makeText(this, "الشاشة مقفلة", Toast.LENGTH_SHORT).show(); return }
                  if (LionPlayerManager.getCurrentItem()?.isVideo == true) {
                      AlertDialog.Builder(this).setTitle("تشغيل الفيديو").setMessage("هل تريد متابعة تشغيل الفيديو في الخلفية؟")
                          .setPositiveButton("استمرار بالعمل") { _, _ -> LionPlayerManager.allowBackgroundPlayback = true; LionPlayerManager.updateNotification(this); finish() }
                          .setNegativeButton("إغلاق") { _, _ -> LionPlayerManager.stop(this); finish() }
                          .setNeutralButton("إلغاء", null).show()
                  } else {
                      LionPlayerManager.allowBackgroundPlayback = true
                      LionPlayerManager.updateNotification(this)
                      finish()
                  }
              }

              override fun onBackPressed() = handleBackAction()

              override fun onStart() {
                  super.onStart()
                  LionPlayerManager.onTrackChanged = { item -> runOnUiThread { updateUIForItem(item) } }
                  LionPlayerManager.onPlaybackStateChanged = { isPlaying -> runOnUiThread { updatePlayPauseButton(isPlaying) } }
                  LionPlayerManager.getCurrentItem()?.let { updateUIForItem(it) }
                  playerView.player = LionPlayerManager.player
                  updatePlayPauseButton(LionPlayerManager.player?.isPlaying == true)
                  updateScreenLock()
                  handler.post(updateProgressRunnable)
              }

              override fun onResume() {
                  super.onResume()
                  applySystemBarsVisibility()
                  updateScreenLock()
              }

              override fun onStop() {
                  super.onStop()
                  LionPlayerManager.onTrackChanged = null
                  LionPlayerManager.onPlaybackStateChanged = null
                  updateScreenLock()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(updateProgressRunnable)
                  playerView.player = null
                  if (!LionPlayerManager.allowBackgroundPlayback && LionPlayerManager.player?.isPlaying != true) {
                      LionPlayerManager.dismissNotification(this)
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LionPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
