              private fun startClipboardOperation(action: ClipAction) {
                  val selected = displayedList.filter { it.isSelected && !it.isFolder }
                  if (selected.isEmpty()) {
                      Toast.makeText(this, "يرجى تحديد مقطع واحد على الأقل", Toast.LENGTH_SHORT).show()
                      return
                  }
                  clipBufferList.clear()
                  clipBufferList.addAll(selected)
                  activeClipAction = action

                  exitSelectionMode()
                  updatePasteBarUI()
                  val actionName = if (action == ClipAction.COPY) "نسخ" else "نقل"
                  Toast.makeText(this, "تم اختيار $actionName (${clipBufferList.size}) مقاطع. انتقل للمجلد المطلوب واضغط لصق هنا", Toast.LENGTH_LONG).show()
              }

              private fun updatePasteBarUI() {
                  if (activeClipAction != ClipAction.NONE && clipBufferList.isNotEmpty()) {
                      pasteBar.visibility = View.VISIBLE
                      val typeStr = if (activeClipAction == ClipAction.COPY) "نسخ" else "نقل"
                      val destFolder = currentSelectedFolder ?: "المجلد الحالي"
                      tvPasteStatus.text = "جاهز لـ $typeStr (${clipBufferList.size}) عناصر إلى: $destFolder"
                  } else {
                      pasteBar.visibility = View.GONE
                  }
              }

              private fun cancelPasteOperation() {
                  activeClipAction = ClipAction.NONE
                  clipBufferList.clear()
                  updatePasteBarUI()
                  Toast.makeText(this, "تم إلغاء عملية النسخ/النقل", Toast.LENGTH_SHORT).show()
              }

              private fun executePaste() {
                  if (clipBufferList.isEmpty() || activeClipAction == ClipAction.NONE) return

                  val targetDir: File = run {
                      if (currentSelectedFolder != null) {
                          val sample = (rawVideosList + rawAudioList).firstOrNull { it.parentFolder == currentSelectedFolder && it.path.isNotEmpty() }
                          if (sample != null) {
                              File(sample.path).parentFile ?: getPublicMediaDir()
                          } else getPublicMediaDir()
                      } else {
                          getPublicMediaDir()
                      }
                  }

                  if (!targetDir.exists()) targetDir.mkdirs()

                  var successCount = 0
                  val filesToScan = mutableListOf<String>()

                  for (item in clipBufferList) {
                      val srcFile = File(item.path)
                      if (srcFile.exists()) {
                          val destFile = File(targetDir, srcFile.name)
                          try {
                              if (activeClipAction == ClipAction.COPY) {
                                  copyFile(srcFile, destFile)
                                  filesToScan.add(destFile.absolutePath)
                                  successCount++
                              } else if (activeClipAction == ClipAction.MOVE) {
                                  val moved = srcFile.renameTo(destFile)
                                  if (!moved) {
                                      copyFile(srcFile, destFile)
                                      srcFile.delete()
                                  }
                                  filesToScan.add(destFile.absolutePath)
                                  try { contentResolver.delete(Uri.parse(item.uri), null, null) } catch (e: Exception) {}
                                  successCount++
                              }
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }

                  if (filesToScan.isNotEmpty()) {
                      MediaScannerConnection.scanFile(this, filesToScan.toTypedArray(), null) { _, _ ->
                          runOnUiThread { loadMedia() }
                      }
                  }

                  val actionName = if (activeClipAction == ClipAction.COPY) "نسخ" else "نقل"
                  Toast.makeText(this, "تم $actionName $successCount ملفات بنجاح إلى: ${targetDir.name}", Toast.LENGTH_LONG).show()

                  cancelPasteOperation()
                  loadMedia()
              }

              private fun getPublicMediaDir(): File {
                  return if (currentTab == TAB_AUDIO) {
                      Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC)
                  } else {
                      Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES)
                  }
              }

              private fun copyFile(src: File, dst: File) {
                  FileInputStream(src).use { input ->
                      FileOutputStream(dst).use { output ->
                          val buffer = ByteArray(1024 * 32)
                          var read: Int
                          while (input.read(buffer).also { read = it } > 0) {
                              output.write(buffer, 0, read)
                          }
                      }
                  }
              }

