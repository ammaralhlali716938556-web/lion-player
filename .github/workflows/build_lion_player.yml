          cat << 'EOF_FILE_15' > app/src/main/java/com/lionplayer/app/player/SleepTimerManager.kt
          package com.lionplayer.app.player
          
          import android.os.Handler
          import android.os.Looper
          import androidx.media3.exoplayer.ExoPlayer
          
          object SleepTimerManager {
          
              private val handler = Handler(Looper.getMainLooper())
              private var sleepRunnable: Runnable? = null
              var isTimerActive: Boolean = false
                  private set
              var remainingMinutes: Int = 0
                  private set
          
              fun startTimer(player: ExoPlayer?, minutes: Int, onFinish: () -> Unit) {
                  cancelTimer()
                  if (minutes <= 0) return
          
                  isTimerActive = true
                  remainingMinutes = minutes
          
                  val totalMs = minutes * 60 * 1000L
                  val fadeStartMs = (totalMs - 15000L).coerceAtLeast(0L) // Fade out over last 15 seconds
          
                  // Gradual fade-out logic
                  handler.postDelayed({
                      player?.let { p ->
                          fadeAudio(p, 10)
                      }
                  }, fadeStartMs)
          
                  sleepRunnable = Runnable {
                      isTimerActive = false
                      remainingMinutes = 0
                      player?.pause()
                      player?.volume = 1.0f
                      onFinish()
                  }
          
                  handler.postDelayed(sleepRunnable!!, totalMs)
              }
          
              private fun fadeAudio(player: ExoPlayer, steps: Int) {
                  if (steps <= 0) return
                  val currentVol = player.volume
                  val newVol = (currentVol - 0.1f).coerceAtLeast(0f)
                  player.volume = newVol
                  handler.postDelayed({
                      fadeAudio(player, steps - 1)
                  }, 1500L)
              }
          
              fun cancelTimer() {
                  sleepRunnable?.let { handler.removeCallbacks(it) }
                  sleepRunnable = null
                  isTimerActive = false
                  remainingMinutes = 0
              }
          }
