              private fun updateNotification() {
                  val currentItem = playlist.getOrNull(currentIndex) ?: return
                  val isPlaying = player?.isPlaying == true

                  val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  } else {
                      PendingIntent.FLAG_UPDATE_CURRENT
                  }

                  val contentIntent = Intent(this, PlayerActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val contentPendingIntent = PendingIntent.getActivity(this, 0, contentIntent, flags)

                  val prevIntent = Intent(ACTION_NOTIF_PREV).setPackage(packageName)
                  val prevPending = PendingIntent.getBroadcast(this, 1, prevIntent, flags)

                  val playPauseIntent = Intent(ACTION_NOTIF_PLAY_PAUSE).setPackage(packageName)
                  val playPausePending = PendingIntent.getBroadcast(this, 2, playPauseIntent, flags)

                  val nextIntent = Intent(ACTION_NOTIF_NEXT).setPackage(packageName)
                  val nextPending = PendingIntent.getBroadcast(this, 3, nextIntent, flags)

                  val closeIntent = Intent(ACTION_NOTIF_CLOSE).setPackage(packageName)
                  val closePending = PendingIntent.getBroadcast(this, 4, closeIntent, flags)

                  val playPauseIcon = if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play
                  val playPauseTitle = if (isPlaying) "إيقاف مؤقت" else "تشغيل"

                  val builder = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_lion_logo)
                      .setContentTitle(currentItem.title)
                      .setContentText(if (currentItem.isVideo) "مشغل ليون - فيديو" else "مشغل ليون - صوت")
                      .setContentIntent(contentPendingIntent)
                      .setOngoing(isPlaying)
                      .setOnlyAlertOnce(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .addAction(R.drawable.ic_skip_previous, "السابق", prevPending)
                      .addAction(playPauseIcon, playPauseTitle, playPausePending)
                      .addAction(R.drawable.ic_skip_next, "التالي", nextPending)
                      .addAction(R.drawable.ic_close, "إنهاء", closePending)

                  try {
                      builder.setStyle(
                          androidx.media.app.NotificationCompat.MediaStyle()
                              .setShowActionsInCompactView(0, 1, 2)
                      )
                  } catch (_: Throwable) {}

                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  try {
                      manager.notify(NOTIFICATION_ID, builder.build())
                  } catch (_: SecurityException) {}
              }

              private fun dismissNotification() {
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.cancel(NOTIFICATION_ID)
