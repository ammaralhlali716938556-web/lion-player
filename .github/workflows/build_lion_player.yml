              private fun searchSubtitlesOnline() {
                  val currentItem = LionPlayerManager.getCurrentItem()
                  val cleanName = (currentItem?.title ?: "")
                      .replace(Regex("\\.(mp4|mkv|avi|mov|webm|flv|wmv)$", RegexOption.IGNORE_CASE), "")
                  val query = Uri.encode("$cleanName ترجمة srt")
                  val url = "https://www.google.com/search?q=$query"
                  try {
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                      startActivity(intent)
