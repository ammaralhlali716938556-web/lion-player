package com.lionplayer.app.repository

import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL
import java.net.URLEncoder

object SubtitleFetcher {

    suspend fun searchSubtitles(query: String): List<SubtitleResult> = withContext(Dispatchers.IO) {
        val results = mutableListOf<SubtitleResult>()
        try {
            val encodedQuery = URLEncoder.encode(query, "UTF-8")
            val url = URL("https://api.opensubtitles.com/api/v1/subtitles?query=$encodedQuery&languages=ar,en")
            val conn = url.openConnection() as HttpURLConnection
            conn.requestMethod = "GET"
            conn.setRequestProperty("User-Agent", "LionPlayer v2.0")
            conn.connectTimeout = 8000
            conn.readTimeout = 8000

            if (conn.responseCode == 200) {
                val responseText = conn.inputStream.bufferedReader().use { it.readText() }
                val json = JSONObject(responseText)
                val data = json.optJSONArray("data")
                if (data != null) {
                    for (i in 0 until data.length()) {
                        val item = data.getJSONObject(i)
                        val attributes = item.optJSONObject("attributes") ?: continue
                        val release = attributes.optString("release", "ترجمة")
                        val language = attributes.optString("language", "ar")
                        val files = attributes.optJSONArray("files")
                        val fileId = files?.optJSONObject(0)?.optInt("file_id") ?: 0
                        results.add(SubtitleResult(fileId, release, language))
                    }
                }
            }
        } catch (e: Exception) {
            e.printStackTrace()
        }
        results
    }
}

data class SubtitleResult(val fileId: Int, val name: String, val language: String)
