              android:layout_height="match_parent"
              android:background="#000000">
          
              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:use_controller="false"
                  app:surface_type="texture_view" />
          
              <LinearLayout
                  android:id="@+id/layoutLyrics"
                  android:layout_width="match_parent"
                  android:layout_height="240dp"
                  android:layout_marginStart="24dp"
                  android:layout_marginEnd="24dp"
                  android:background="@drawable/bg_hud"
                  android:orientation="vertical"
                  android:padding="16dp"
                  android:visibility="gone"
                  app:layout_constraintTop_toBottomOf="@id/topControls"
                  app:layout_constraintBottom_toTopOf="@id/bottomControls">
          
                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center"
                      android:text="كلمات الأغنية"
                      android:textColor="@color/accent"
                      android:textSize="14sp"
                      android:textStyle="bold" />
          
                  <ScrollView
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:layout_marginTop="8dp">
          
                      <TextView
                          android:id="@+id/tvLyrics"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center"
                          android:lineSpacingExtra="6dp"
                          android:textColor="#FFFFFF"
                          android:textSize="15sp" />
                  </ScrollView>
              </LinearLayout>
          
              <!-- Top Controls: Two borders-free bars -->
              <LinearLayout
                  android:id="@+id/topControls"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_controls_gradient"
                  android:orientation="vertical"
                  android:paddingStart="6dp"
                  android:paddingEnd="6dp"
                  android:paddingTop="6dp"
                  android:paddingBottom="4dp"
                  app:layout_constraintTop_toTopOf="parent">
          
                  <!-- Top Bar 1 -->
                  <LinearLayout
                      android:id="@+id/topBarPrimary"
                      android:layout_width="match_parent"
                      android:layout_height="42dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
          
                      <ImageButton
                          android:id="@+id/btnBack"
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_back"
                          app:tint="#FFFFFF"
                          android:contentDescription="رجوع" />
          
                      <TextView
                          android:id="@+id/tvVideoTitle"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:layout_marginStart="8dp"
                          android:layout_marginEnd="6dp"
                          android:ellipsize="end"
                          android:maxLines="1"
                          android:textColor="#FFFFFF"
                          android:textSize="14sp"
                          android:textStyle="bold" />
          
                      <!-- Dynamic Decoder Button -->
                      <TextView
                          android:id="@+id/btnDecoder"
                          android:layout_width="wrap_content"
                          android:layout_height="22dp"
                          android:layout_marginStart="4dp"
                          android:layout_marginEnd="6dp"
                          android:background="@drawable/bg_decoder_badge"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:paddingStart="7dp"
                          android:paddingEnd="7dp"
                          android:text="HW"
                          android:textColor="#FFFFFF"
                          android:textSize="10sp"
                          android:textStyle="bold" />
          
                      <ImageButton
                          android:id="@+id/btnSubtitles"
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_subtitles"
                          app:tint="#FFFFFF"
                          android:contentDescription="الترجمات" />
          
                      <ImageButton
                          android:id="@+id/btnMore"
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_more_vert"
