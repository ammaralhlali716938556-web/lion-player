    private lateinit var btnMiniPrev: ImageButton
    private lateinit var btnMiniPlayPause: ImageButton
    private lateinit var btnMiniNext: ImageButton
    private lateinit var btnMiniClose: ImageButton

    private var currentTab = 0
    private val TAB_VIDEO = 0
    private val TAB_AUDIO = 1
    private val TAB_STREAM = 2
    private val TAB_VAULT = 3
    private val TAB_FAVORITES = 4

    private var isVideoFolderMode = true
    private var isAudioFolderMode = true
    private var currentSelectedFolder: String? = null

    private var sortBy = "name"
    private var sortAsc = true
    private var viewStyle = MediaAdapter.VIEW_MODE_LIST
    private var showExtensions = false

    enum class ClipAction { NONE, COPY, MOVE }
    private var activeClipAction = ClipAction.NONE
    private val clipBufferList = mutableListOf<MediaItem>()

    private val rawVideosList = mutableListOf<MediaItem>()
    private val rawAudioList = mutableListOf<MediaItem>()
    private val rawStreamList = mutableListOf<MediaItem>()
    private val rawVaultList = mutableListOf<MediaItem>()
    private val displayedList = mutableListOf<MediaItem>()

    // Scoped Storage Delete Launcher for Android 11+
    private val deleteRequestLauncher = registerForActivityResult(ActivityResultContracts.StartIntentSenderForResult()) { result ->
        if (result.resultCode == Activity.RESULT_OK) {
            Toast.makeText(this, "تم الحذف بنجاح", Toast.LENGTH_SHORT).show()
            loadMedia()
        }
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        showSystemBars()
        setContentView(R.layout.activity_main)

        prefs = getSharedPreferences("lion_player_prefs", Context.MODE_PRIVATE)

        showExtensions = prefs.getBoolean("show_extensions", false)
        viewStyle = prefs.getInt("view_style", MediaAdapter.VIEW_MODE_LIST)
        sortBy = prefs.getString("sort_by", "name") ?: "name"
        sortAsc = prefs.getBoolean("sort_asc", true)
        isVideoFolderMode = prefs.getBoolean("is_video_folder_mode", true)
        isAudioFolderMode = prefs.getBoolean("is_audio_folder_mode", true)
        currentTab = prefs.getInt("last_tab", TAB_VIDEO)
        currentSelectedFolder = prefs.getString("last_folder", null)

        LionPlayerManager.bluetoothControlEnabled = prefs.getBoolean("bluetooth_headset_control", true)

        toolbar = findViewById(R.id.topToolbar)
        rvMedia = findViewById(R.id.rvMedia)
        tvEmptyState = findViewById(R.id.tvEmptyState)
        bottomNav = findViewById(R.id.bottomNavigation)

        initSelectionBar()
        initPasteBar()
        initMiniPlayer()

        setSupportActionBar(toolbar)
        setupRecyclerView()
        setupBottomNav()

        val targetMenuId = when (currentTab) {
            TAB_VIDEO -> R.id.nav_local
            TAB_AUDIO -> R.id.nav_music
            TAB_STREAM -> R.id.nav_stream
            TAB_VAULT -> R.id.nav_vault
            TAB_FAVORITES -> R.id.nav_favorites
            else -> R.id.nav_local
        }
        bottomNav.selectedItemId = targetMenuId

        checkAndRequestPermissions()
    }

    private fun showSystemBars() {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
            window.insetsController?.show(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
        } else {
            @Suppress("DEPRECATION")
            window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
        }
        window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
    }

    private fun markItemAsPlayed(id: Long) {
        val playedSet = prefs.getStringSet("played_media_ids", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
        if (playedSet.add(id.toString())) {
            prefs.edit().putStringSet("played_media_ids", playedSet).apply()
        }
    }

    private fun syncPlayedStatus() {
        val playedSet = prefs.getStringSet("played_media_ids", setOf()) ?: setOf()
        for (item in rawVideosList) {
            item.isNew = !playedSet.contains(item.id.toString())
        }
        for (item in rawAudioList) {
            item.isNew = !playedSet.contains(item.id.toString())
        }
        refreshListDisplay()
    }

    private fun initSelectionBar() {
        selectionBar = findViewById(R.id.selectionBar)
        tvSelectionCount = findViewById(R.id.tvSelectionCount)
        btnCancelSelection = findViewById(R.id.btnCancelSelection)
        btnFavoriteSelected = findViewById(R.id.btnFavoriteSelected)
        btnSelectAll = findViewById(R.id.btnSelectAll)
        btnCopySelected = findViewById(R.id.btnCopySelected)
        btnMoveSelected = findViewById(R.id.btnMoveSelected)
        btnDeleteSelected = findViewById(R.id.btnDeleteSelected)

        btnCancelSelection.setOnClickListener { exitSelectionMode() }

        btnFavoriteSelected.setOnClickListener {
            val selected = displayedList.filter { it.isSelected && !it.isFolder }
            if (selected.isNotEmpty()) {
                toggleFavoriteMultiple(selected)
            }
        }

        btnSelectAll.setOnClickListener {
            val allSelected = displayedList.filter { !it.isFolder }.all { it.isSelected }
            displayedList.forEach { if (!it.isFolder) it.isSelected = !allSelected }
            updateSelectionUI()
        }
        btnCopySelected.setOnClickListener {
            startClipboardOperation(ClipAction.COPY)
        }
        btnMoveSelected.setOnClickListener {
            startClipboardOperation(ClipAction.MOVE)
        }
        btnDeleteSelected.setOnClickListener {
            val selected = displayedList.filter { it.isSelected && !it.isFolder }
            if (selected.isNotEmpty()) {
                confirmDeleteMultiple(selected)
            }
        }
    }

    private fun toggleFavoriteMultiple(items: List<MediaItem>) {
        val favSet = prefs.getStringSet("favorite_ids", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
        val allAlreadyFav = items.all { it.isFavorite }

        for (item in items) {
            val idStr = item.id.toString()
            if (allAlreadyFav) {
                favSet.remove(idStr)
                item.isFavorite = false
            } else {
                favSet.add(idStr)
                item.isFavorite = true
            }
        }

        prefs.edit().putStringSet("favorite_ids", favSet).apply()
        refreshListDisplay()
        exitSelectionMode()

        val msg = if (allAlreadyFav) {
            "تمت إزالة (${items.size}) مقاطع من المفضلة"
        } else {
            "تمت إضافة (${items.size}) مقاطع إلى المفضلة ❤️"
        }
        Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
    }

    private fun initPasteBar() {
        pasteBar = findViewById(R.id.pasteBar)
        tvPasteStatus = findViewById(R.id.tvPasteStatus)
        btnExecutePaste = findViewById(R.id.btnExecutePaste)
        btnCancelPaste = findViewById(R.id.btnCancelPaste)

        btnExecutePaste.setOnClickListener { executePaste() }
        btnCancelPaste.setOnClickListener { cancelPasteOperation() }
    }

    private fun startClipboardOperation(action: ClipAction) {
        val selected = displayedList.filter { it.isSelected && !it.isFolder }
        if (selected.isEmpty()) {
            Toast.makeText(this, "يرجى تحديد مقطع واحد على الأقل", Toast.LENGTH_SHORT).show()
            return
        }
        clipBufferList.clear()
        clipBufferList.addAll(selected)
        activeClipAction = action

        exitSelectionMode()
        updatePasteBarUI()
        val actionName = if (action == ClipAction.COPY) "نسخ" else "نقل"
        Toast.makeText(this, "تم اختيار $actionName (${clipBufferList.size}) مقاطع. انتقل للمجلد المطلوب واضغط لصق هنا", Toast.LENGTH_LONG).show()
    }

    private fun updatePasteBarUI() {
        if (activeClipAction != ClipAction.NONE && clipBufferList.isNotEmpty()) {
            pasteBar.visibility = View.VISIBLE
            val typeStr = if (activeClipAction == ClipAction.COPY) "نسخ" else "نقل"
            val destFolder = currentSelectedFolder ?: "المجلد الحالي"
            tvPasteStatus.text = "جاهز لـ $typeStr (${clipBufferList.size}) عناصر إلى: $destFolder"
        } else {
            pasteBar.visibility = View.GONE
        }
    }

    private fun cancelPasteOperation() {
        activeClipAction = ClipAction.NONE
        clipBufferList.clear()
        updatePasteBarUI()
        Toast.makeText(this, "تم إلغاء عملية النسخ/النقل", Toast.LENGTH_SHORT).show()
    }

    private fun executePaste() {
        if (clipBufferList.isEmpty() || activeClipAction == ClipAction.NONE) return

        val targetDir: File = run {
            if (currentSelectedFolder != null) {
                val sample = (rawVideosList + rawAudioList).firstOrNull { it.parentFolder == currentSelectedFolder && it.path.isNotEmpty() }
                if (sample != null) {
                    File(sample.path).parentFile ?: getPublicMediaDir()
                } else getPublicMediaDir()
            } else {
                getPublicMediaDir()
            }
        }

        if (!targetDir.exists()) targetDir.mkdirs()

        var successCount = 0
        val filesToScan = mutableListOf<String>()

        for (item in clipBufferList) {
            val srcFile = File(item.path)
            if (srcFile.exists()) {
                val destFile = File(targetDir, srcFile.name)
                try {
                    if (activeClipAction == ClipAction.COPY) {
                        copyFile(srcFile, destFile)
                        filesToScan.add(destFile.absolutePath)
                        successCount++
                    } else if (activeClipAction == ClipAction.MOVE) {
                        val moved = srcFile.renameTo(destFile)
                        if (!moved) {
                            copyFile(srcFile, destFile)
                            srcFile.delete()
                        }
                        filesToScan.add(destFile.absolutePath)
                        try { contentResolver.delete(Uri.parse(item.uri), null, null) } catch (e: Exception) {}
                        successCount++
                    }
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }
        }

        if (filesToScan.isNotEmpty()) {
            MediaScannerConnection.scanFile(this, filesToScan.toTypedArray(), null) { _, _ ->
                runOnUiThread { loadMedia() }
            }
        }

        val actionName = if (activeClipAction == ClipAction.COPY) "نسخ" else "نقل"
        Toast.makeText(this, "تم $actionName $successCount ملفات بنجاح إلى: ${targetDir.name}", Toast.LENGTH_LONG).show()

        cancelPasteOperation()
        loadMedia()
    }

    private fun getPublicMediaDir(): File {
        return if (currentTab == TAB_AUDIO) {
            Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC)
        } else {
            Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES)
        }
    }

    private fun copyFile(src: File, dst: File) {
        FileInputStream(src).use { input ->
            FileOutputStream(dst).use { output ->
                val buffer = ByteArray(1024 * 32)
                var read: Int
                while (input.read(buffer).also { read = it } > 0) {
                    output.write(buffer, 0, read)
                }
            }
        }
    }

    private fun enterSelectionMode(initialItem: MediaItem? = null) {
        mediaAdapter.isSelectionMode = true
        selectionBar.visibility = View.VISIBLE
        initialItem?.isSelected = true
        updateSelectionUI()
    }

    private fun exitSelectionMode() {
        mediaAdapter.isSelectionMode = false
        selectionBar.visibility = View.GONE
        displayedList.forEach { it.isSelected = false }
        mediaAdapter.notifyDataSetChanged()
    }

    private fun updateSelectionUI() {
        val count = displayedList.count { it.isSelected && !it.isFolder }
        tvSelectionCount.text = "تم تحديد $count"
        mediaAdapter.notifyDataSetChanged()
    }

    private fun initMiniPlayer() {
        miniPlayerLayout = findViewById(R.id.miniPlayerLayout)
        ivMiniThumb = findViewById(R.id.ivMiniThumb)
        tvMiniTitle = findViewById(R.id.tvMiniTitle)
        tvMiniSub = findViewById(R.id.tvMiniSub)
        btnMiniPrev = findViewById(R.id.btnMiniPrev)
        btnMiniPlayPause = findViewById(R.id.btnMiniPlayPause)
        btnMiniNext = findViewById(R.id.btnMiniNext)
        btnMiniClose = findViewById(R.id.btnMiniClose)

        findViewById<View>(R.id.miniPlayerInfo).setOnClickListener { openPlayerFromMini() }
        ivMiniThumb.setOnClickListener { openPlayerFromMini() }

        btnMiniPrev.setOnClickListener { LionPlayerManager.playPrevious(this) }
        btnMiniPlayPause.setOnClickListener { LionPlayerManager.togglePlayPause(this) }
        btnMiniNext.setOnClickListener { LionPlayerManager.playNext(this) }
        btnMiniClose.setOnClickListener {
            LionPlayerManager.stop(this)
            miniPlayerLayout.visibility = View.GONE
        }
    }

    private fun openPlayerFromMini() {
        val current = LionPlayerManager.getCurrentItem() ?: return
        val playlist = LionPlayerManager.playlist
        val index = LionPlayerManager.currentIndex
        val intent = Intent(this, PlayerActivity::class.java).apply {
            putExtra("PLAYLIST", playlist)
            putExtra("CURRENT_INDEX", index)
        }
        startActivity(intent)
    }

    private fun updateMiniPlayerUI() {
        val current = LionPlayerManager.getCurrentItem()
        val player = LionPlayerManager.player
        if (current != null && player != null) {
            miniPlayerLayout.visibility = View.VISIBLE
            tvMiniTitle.text = current.title
            val subText = if (current.isVideo) "فيديو • ${current.parentFolder}" else "صوتيات • ${current.artist}"
            tvMiniSub.text = subText

            val isPlaying = player.isPlaying
            btnMiniPlayPause.setImageResource(if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play)
        } else {
            miniPlayerLayout.visibility = View.GONE
        }
    }

    private fun setupRecyclerView() {
        mediaAdapter = MediaAdapter(
            displayedList,
            viewStyle,
            showExtensions,
            false,
            onItemClick = { item ->
                if (mediaAdapter.isSelectionMode) {
                    if (!item.isFolder) {
                        item.isSelected = !item.isSelected
                        updateSelectionUI()
                    }
                } else {
                    if (item.isFolder) {
                        currentSelectedFolder = item.title
                        prefs.edit().putString("last_folder", currentSelectedFolder).apply()
                        refreshListDisplay()
                        updatePasteBarUI()
                    } else {
                        markItemAsPlayed(item.id)
                        item.isNew = false
                        mediaAdapter.notifyDataSetChanged()

                        val playlist = ArrayList(displayedList.filter { !it.isFolder })
                        val index = playlist.indexOfFirst { it.id == item.id }.coerceAtLeast(0)
                        val intent = Intent(this, PlayerActivity::class.java).apply {
                            putExtra("PLAYLIST", playlist)
                            putExtra("CURRENT_INDEX", index)
                        }
                        startActivity(intent)
                    }
                }
            },
            onItemLongClick = { item ->
                enterSelectionMode(item)
            },
            onMoreOptionsClick = { item, _ -> showItemActionDialog(item) }
        )
        applyLayoutManager()
        rvMedia.adapter = mediaAdapter

        var lastScaleTriggerTime = 0L
        scaleGestureDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
            override fun onScale(detector: ScaleGestureDetector): Boolean {
                val now = System.currentTimeMillis()
                if (now - lastScaleTriggerTime < 350) return false

                val factor = detector.scaleFactor
                if (factor > 1.15f) {
                    lastScaleTriggerTime = now
                    zoomIn()
                    return true
                } else if (factor < 0.85f) {
                    lastScaleTriggerTime = now
                    zoomOut()
                    return true
                }
                return false
            }
        })

        rvMedia.setOnTouchListener { _, event ->
            scaleGestureDetector.onTouchEvent(event)
            false
        }
    }

    private fun showItemActionDialog(item: MediaItem) {
        val favoriteTitle = if (item.isFavorite) "إلغاء التفضيل" else "تفضيل"
        val options = arrayOf(
            "تحديد",
            "نسخ",
            "نقل",
            favoriteTitle,
            "إعادة تسمية",
            "مشاركة",
            "خصائص",
            "نقل إلى الخزنة الآمنة",
            "استخراج الصوت (MP3/AAC)",
            "حذف"
        )

        AlertDialog.Builder(this)
            .setTitle(item.title)
            .setItems(options) { _, which ->
                when (which) {
                    0 -> enterSelectionMode(item)
                    1 -> {
                        clipBufferList.clear()
                        clipBufferList.add(item)
                        activeClipAction = ClipAction.COPY
                        updatePasteBarUI()
                        Toast.makeText(this, "تم نسخ المقطع. انتقل للمجلد المطلوب واضغط لصق هنا", Toast.LENGTH_SHORT).show()
                    }
                    2 -> {
                        clipBufferList.clear()
                        clipBufferList.add(item)
                        activeClipAction = ClipAction.MOVE
                        updatePasteBarUI()
                        Toast.makeText(this, "تم تحديد المقطع للنقل. انتقل للمجلد واضغط لصق هنا", Toast.LENGTH_SHORT).show()
                    }
                    3 -> toggleFavorite(item)
                    4 -> showRenameDialog(item)
                    5 -> shareMediaItem(item)
                    6 -> showPropertiesDialog(item)
                    7 -> encryptToVault(item)
                    8 -> extractAudioFromItem(item)
                    9 -> confirmDeleteMediaItem(item)
                }
            }
            .show()
    }

    private fun encryptToVault(item: MediaItem) {
        if (item.path.isEmpty() || !File(item.path).exists()) {
            Toast.makeText(this, "الملف غير متوفر على القرص للتشفير", Toast.LENGTH_SHORT).show()
            return
        }
        AlertDialog.Builder(this)
            .setTitle("نقل إلى الخزنة الآمنة")
            .setMessage("سيتم تشفير هذا الملف بواسطة AES-256 وحمايته بالبصمة ورقم PIN. متابعة؟")
            .setPositiveButton("تشفير وقفل") { _, _ ->
                try {
                    val file = File(item.path)
                    VaultManager.encryptFileToVault(this, file, item.isVideo)
                    performDelete(listOf(item))
                    Toast.makeText(this, "تم قفل الملف داخل الخزنة الآمنة 🔒", Toast.LENGTH_LONG).show()
                } catch (e: Exception) {
                    Toast.makeText(this, "فشل التشفير: ${e.localizedMessage}", Toast.LENGTH_SHORT).show()
                }
            }
            .setNegativeButton("إلغاء", null)
            .show()
    }

    private fun extractAudioFromItem(item: MediaItem) {
        if (!item.isVideo || item.path.isEmpty() || !File(item.path).exists()) {
            Toast.makeText(this, "يرجى تحديد ملف فيديو محلي صالح للاستخراج", Toast.LENGTH_SHORT).show()
            return
        }
        val outDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC)
        val outFile = File(outDir, "${item.title.substringBeforeLast('.')}_audio.m4a")

        Toast.makeText(this, "جاري استخراج الصوت بدقة عالية...", Toast.LENGTH_SHORT).show()
        AudioTrimmer.extractAudio(item.path, outFile.absolutePath) { success, result ->
            runOnUiThread {
                if (success) {
                    MediaScannerConnection.scanFile(this, arrayOf(outFile.absolutePath), null) { _, _ ->
                        runOnUiThread { loadMedia() }
                    }
                    Toast.makeText(this, "تم استخراج الصوت بنجاح في مجلد الموسيقى: ${outFile.name}", Toast.LENGTH_LONG).show()
                } else {
                    Toast.makeText(this, "فشل استخراج الصوت: $result", Toast.LENGTH_LONG).show()
                }
            }
        }
    }

    private fun toggleFavorite(item: MediaItem) {
        val favSet = prefs.getStringSet("favorite_ids", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
        val idStr = item.id.toString()
        if (item.isFavorite) {
            favSet.remove(idStr)
            item.isFavorite = false
            Toast.makeText(this, "تمت الإزالة من المفضلة", Toast.LENGTH_SHORT).show()
        } else {
            favSet.add(idStr)
            item.isFavorite = true
            Toast.makeText(this, "تمت الإضافة إلى المفضلة ❤️", Toast.LENGTH_SHORT).show()
        }
        prefs.edit().putStringSet("favorite_ids", favSet).apply()
        refreshListDisplay()
    }

    private fun showRenameDialog(item: MediaItem) {
        val input = EditText(this).apply {
            setText(item.title)
            setSelection(item.title.length)
        }
        AlertDialog.Builder(this)
            .setTitle("إعادة تسمية")
            .setView(input)
            .setPositiveButton("حفظ") { _, _ ->
                val newName = input.text.toString().trim()
                if (newName.isNotEmpty()) {
                    item.title = newName
                    mediaAdapter.notifyDataSetChanged()
                    Toast.makeText(this, "تمت إعادة التسمية بنجاح", Toast.LENGTH_SHORT).show()
                }
            }
            .setNegativeButton("إلغاء", null)
            .show()
    }

    private fun shareMediaItem(item: MediaItem) {
        try {
            val intent = Intent(Intent.ACTION_SEND).apply {
                type = if (item.isVideo) "video/*" else "audio/*"
                putExtra(Intent.EXTRA_STREAM, Uri.parse(item.uri))
                addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
            }
            startActivity(Intent.createChooser(intent, "مشاركة المقطع"))
        } catch (e: Exception) {
            Toast.makeText(this, "تعذر مشاركة المقطع", Toast.LENGTH_SHORT).show()
        }
    }

    private fun showPropertiesDialog(item: MediaItem) {
        val sdf = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.getDefault())
        val dateStr = sdf.format(Date(item.dateAdded * 1000L))
        val sizeMb = String.format(Locale.US, "%.2f MB", item.size / (1024.0 * 1024.0))
        val durStr = LionPlayerManager.formatDuration(item.duration)

        val message = """
            الاسم: ${item.title}
            المسار: ${item.path.ifEmpty { item.uri }}
            النوع: ${if (item.isVideo) "فيديو" else "صوتيات"}
            الألبوم: ${item.album}
            الفنان: ${item.artist}
            الحجم: $sizeMb
            المدة: $durStr
            تاريخ الإضافة: $dateStr
        """.trimIndent()

        AlertDialog.Builder(this)
            .setTitle("خصائص المقطع")
            .setMessage(message)
            .setPositiveButton("إغلاق", null)
            .show()
    }

    private fun confirmDeleteMediaItem(item: MediaItem) {
        AlertDialog.Builder(this)
            .setTitle("حذف المقطع")
            .setMessage("هل أنت متأكد من رغبتك في حذف ${item.title} نهائياً من الجهاز؟")
            .setPositiveButton("حذف") { _, _ ->
                performDelete(listOf(item))
            }
            .setNegativeButton("إلغاء", null)
            .show()
    }

    private fun confirmDeleteMultiple(items: List<MediaItem>) {
        AlertDialog.Builder(this)
            .setTitle("حذف المقاطع المحددة")
            .setMessage("هل أنت متأكد من رغبتك في حذف ${items.size} عناصر نهائياً من الذاكرة؟")
            .setPositiveButton("حذف") { _, _ ->
                performDelete(items)
                exitSelectionMode()
            }
            .setNegativeButton("إلغاء", null)
            .show()
    }

    private fun performDelete(items: List<MediaItem>) {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
            val uriList = items.mapNotNull {
                try { Uri.parse(it.uri) } catch (e: Exception) { null }
            }
            if (uriList.isNotEmpty()) {
                val pendingIntent = MediaStore.createDeleteRequest(contentResolver, uriList)
                deleteRequestLauncher.launch(IntentSenderRequest.Builder(pendingIntent.intentSender).build())
                return
            }
        }

        for (item in items) {
            try {
                if (item.path.isNotEmpty()) {
                    File(item.path).delete()
                }
                contentResolver.delete(Uri.parse(item.uri), null, null)
            } catch (e: Exception) {}
            rawVideosList.removeAll { it.id == item.id }
            rawAudioList.removeAll { it.id == item.id }
        }
        refreshListDisplay()
        Toast.makeText(this, "تم الحذف بنجاح", Toast.LENGTH_SHORT).show()
    }

    private fun zoomIn() {
        if (viewStyle == MediaAdapter.VIEW_MODE_GRID_SMALL) {
            viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
            applyLayoutManager()
            saveViewStylePref()
            mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
        } else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) {
            viewStyle = MediaAdapter.VIEW_MODE_LIST
            applyLayoutManager()
            saveViewStylePref()
            mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
        }
    }

    private fun zoomOut() {
        if (viewStyle == MediaAdapter.VIEW_MODE_LIST) {
            viewStyle = MediaAdapter.VIEW_MODE_GRID_LARGE
            applyLayoutManager()
            saveViewStylePref()
            mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
        } else if (viewStyle == MediaAdapter.VIEW_MODE_GRID_LARGE) {
            viewStyle = MediaAdapter.VIEW_MODE_GRID_SMALL
            applyLayoutManager()
            saveViewStylePref()
            mediaAdapter.updateData(displayedList, viewStyle, showExtensions)
        }
    }

    private fun saveViewStylePref() {
        prefs.edit().putInt("view_style", viewStyle).apply()
    }

    private fun applyLayoutManager() {
        when (viewStyle) {
            MediaAdapter.VIEW_MODE_LIST -> rvMedia.layoutManager = LinearLayoutManager(this)
            MediaAdapter.VIEW_MODE_GRID_LARGE -> rvMedia.layoutManager = GridLayoutManager(this, 2)
            MediaAdapter.VIEW_MODE_GRID_SMALL -> rvMedia.layoutManager = GridLayoutManager(this, 3)
        }
    }

    private fun setupBottomNav() {
        bottomNav.setOnItemSelectedListener { menuItem ->
            val newTab = when (menuItem.itemId) {
                R.id.nav_local -> TAB_VIDEO
                R.id.nav_music -> TAB_AUDIO
                R.id.nav_stream -> TAB_STREAM
                R.id.nav_vault -> TAB_VAULT
                R.id.nav_favorites -> TAB_FAVORITES
                else -> TAB_VIDEO
            }

            if (newTab == TAB_VAULT) {
                handleVaultAccess()
                return@setOnItemSelectedListener true
            }

            if (currentTab != newTab) {
                currentTab = newTab
                currentSelectedFolder = null
                prefs.edit().putInt("last_tab", currentTab).putString("last_folder", null).apply()
                refreshListDisplay()
                updatePasteBarUI()
            }
            true
        }
    }

    private fun handleVaultAccess() {
        if (VaultManager.hasPin(this)) {
            VaultManager.authenticateBiometric(
                activity = this,
                onSuccess = {
                    currentTab = TAB_VAULT
                    currentSelectedFolder = null
                    loadVaultMedia()
                },
                onError = {
                    showVaultPinDialog()
                }
            )
        } else {
            showSetVaultPinDialog()
        }
    }

    private fun showSetVaultPinDialog() {
        val input = EditText(this).apply {
            hint = "أدخل رمز PIN جديد للخزنة (4-6 أرقام)"
            inputType = android.text.InputType.TYPE_CLASS_NUMBER or android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD
        }
        AlertDialog.Builder(this)
            .setTitle("إنشاء رقم PIN للخزنة الآمنة")
            .setView(input)
            .setPositiveButton("تعيين") { _, _ ->
                val pin = input.text.toString().trim()
                if (pin.length >= 4) {
                    VaultManager.setPin(this, pin)
                    Toast.makeText(this, "تم تعيين رمز PIN بنجاح", Toast.LENGTH_SHORT).show()
                    currentTab = TAB_VAULT
                    loadVaultMedia()
                } else {
                    Toast.makeText(this, "يجب أن يتكون الرمز من 4 أرقام على الأقل", Toast.LENGTH_SHORT).show()
                }
            }
            .setNegativeButton("إلغاء", null)
            .show()
    }

    private fun showVaultPinDialog() {
        val input = EditText(this).apply {
            hint = "رمز PIN الخاص بالخزنة"
            inputType = android.text.InputType.TYPE_CLASS_NUMBER or android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD
        }
        AlertDialog.Builder(this)
            .setTitle("تأكيد هوية الخزنة")
            .setView(input)
            .setPositiveButton("دخول") { _, _ ->
                val pin = input.text.toString().trim()
                val result = VaultManager.verifyPin(this, pin)
                if (result == VaultManager.PinResult.SUCCESS) {
                    currentTab = TAB_VAULT
                    loadVaultMedia()
                } else if (result == VaultManager.PinResult.DECOY) {
                    currentTab = TAB_VAULT
                    rawVaultList.clear()
                    refreshListDisplay()
                    Toast.makeText(this, "تم فتح الخزنة (وضع التمويه)", Toast.LENGTH_SHORT).show()
                } else {
                    Toast.makeText(this, "رمز PIN غير صحيح!", Toast.LENGTH_SHORT).show()
                }
            }
            .setNegativeButton("إلغاء", null)
            .show()
    }

    private fun loadVaultMedia() {
        rawVaultList.clear()
        rawVaultList.addAll(VaultManager.getVaultItems(this))
        refreshListDisplay()
    }

    private fun checkAndRequestPermissions() {
        val permissionsNeeded = mutableListOf<String>()
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                permissionsNeeded.add(Manifest.permission.READ_MEDIA_VIDEO)
            }
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                permissionsNeeded.add(Manifest.permission.READ_MEDIA_AUDIO)
            }
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                permissionsNeeded.add(Manifest.permission.POST_NOTIFICATIONS)
            }
        } else {
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                permissionsNeeded.add(Manifest.permission.READ_EXTERNAL_STORAGE)
            }
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                permissionsNeeded.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
            }
        }

        if (permissionsNeeded.isNotEmpty()) {
            ActivityCompat.requestPermissions(this, permissionsNeeded.toTypedArray(), PERMISSION_REQ_CODE)
        } else {
            loadMedia()
        }
    }

    override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults)
        if (requestCode == PERMISSION_REQ_CODE) {
            if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                loadMedia()
            } else {
                Toast.makeText(this, "يرجى منح صلاحيات الوسائط لتشغيل الملفات", Toast.LENGTH_LONG).show()
            }
        }
    }

    private fun loadMedia() {
        loadVideos()
        loadAudio()
        refreshListDisplay()
        updatePasteBarUI()
    }

    private fun loadVideos() {
        rawVideosList.clear()
        val favSet = prefs.getStringSet("favorite_ids", setOf()) ?: setOf()
        val playedSet = prefs.getStringSet("played_media_ids", setOf()) ?: setOf()
        val uri = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
        val projection = arrayOf(
            MediaStore.Video.Media._ID,
            MediaStore.Video.Media.DISPLAY_NAME,
            MediaStore.Video.Media.DATA,
            MediaStore.Video.Media.DURATION,
            MediaStore.Video.Media.SIZE,
            MediaStore.Video.Media.DATE_ADDED,
            MediaStore.Video.Media.ARTIST,
            MediaStore.Video.Media.ALBUM
        )

        try {
            contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                val nameCol = cursor.getColumnIndex(MediaStore.Video.Media.DISPLAY_NAME)
                val dataCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                val durationCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED)
                val artistCol = cursor.getColumnIndex(MediaStore.Video.Media.ARTIST)
                val albumCol = cursor.getColumnIndex(MediaStore.Video.Media.ALBUM)

                while (cursor.moveToNext()) {
                    val id = cursor.getLong(idCol)
                    val path = cursor.getString(dataCol) ?: ""
                    val dispName = if (nameCol != -1) cursor.getString(nameCol) ?: "" else ""
                    val title = if (dispName.isNotEmpty()) dispName else File(path).name.ifEmpty { "فيديو" }
                    val duration = cursor.getLong(durationCol)
                    val size = cursor.getLong(sizeCol)
                    val dateAdded = cursor.getLong(dateCol)
                    val artist = if (artistCol != -1) cursor.getString(artistCol) ?: "فيديو" else "فيديو"
                    val album = if (albumCol != -1) cursor.getString(albumCol) ?: "فيديو" else "فيديو"
                    val contentUri = ContentUris.withAppendedId(uri, id).toString()
                    val folderName = try {
                        val parent = File(path).parentFile?.name
                        if (!parent.isNullOrEmpty()) parent else "الرئيسي"
                    } catch (e: Exception) {
                        "الرئيسي"
                    }
                    val isFav = favSet.contains(id.toString())
                    val isNew = !playedSet.contains(id.toString())

                    rawVideosList.add(
                        MediaItem(
                            id, title, contentUri, duration, size, dateAdded, true,
                            folderName, false, 0, artist, album, isFav, path,
                            isSelected = false, isNew = isNew, newCount = 0
                        )
                    )
                }
            }
        } catch (e: Exception) {}
    }

