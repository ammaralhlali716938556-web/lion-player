          package com.lionplayer.app.data.repository
          
          import android.content.Context
          import com.lionplayer.app.data.model.MediaItem
          import com.lionplayer.app.util.CryptoUtils
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          
          class VaultRepository(private val context: Context) {
          
              private val vaultDir = File(context.filesDir, ".lion_vault")
          
              init {
                  if (!vaultDir.exists()) vaultDir.mkdirs()
              }
          
              suspend fun getVaultItems(): List<MediaItem> = withContext(Dispatchers.IO) {
                  val list = mutableListOf<MediaItem>()
                  vaultDir.listFiles()?.forEach { file ->
                      if (file.isFile) {
                          list.add(
                              MediaItem(
                                  id = file.name.hashCode().toLong(),
                                  title = file.name.substringBeforeLast(".enc"),
                                  uri = file.absolutePath,
                                  duration = 0,
                                  size = file.length(),
                                  dateAdded = file.lastModified() / 1000,
                                  isVideo = true,
                                  parentFolder = "الخزنة",
                                  path = file.absolutePath,
                                  isVaultItem = true
                              )
                          )
                      }
                  }
                  list
              }
          
              suspend fun importToVault(sourceFile: File): Boolean = withContext(Dispatchers.IO) {
                  try {
                      val destEncrypted = File(vaultDir, "${sourceFile.name}.enc")
                      CryptoUtils.encryptFile(sourceFile, destEncrypted)
                      sourceFile.delete()
                      true
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  }
              }
          
              suspend fun decryptToTemp(encryptedFile: File): File? = withContext(Dispatchers.IO) {
                  try {
                      val tempDir = File(context.cacheDir, "vault_playback")
                      if (!tempDir.exists()) tempDir.mkdirs()
                      val tempOut = File(tempDir, encryptedFile.name.substringBeforeLast(".enc"))
                      CryptoUtils.decryptFile(encryptedFile, tempOut)
                      tempOut
                  } catch (e: Exception) {
                      e.printStackTrace()
                      null
                  }
              }
          }
