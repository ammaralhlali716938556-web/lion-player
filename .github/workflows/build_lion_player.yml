              private fun initAudioManager() {
                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  maxSystemVolume = audioManager?.getStreamMaxVolume(AudioManager.STREAM_MUSIC) ?: 15
              }

              private fun initEqualizerAndReverb() {
                  try {
                      val sessionId = LionPlayerManager.player?.audioSessionId ?: 0
                      if (sessionId != C.AUDIO_SESSION_ID_UNSET && sessionId != 0) {
                          if (equalizer == null) {
                              equalizer = Equalizer(0, sessionId).apply { enabled = true }
                          }
                          if (bassBoost == null) {
                              bassBoost = BassBoost(0, sessionId).apply { enabled = true }
                          }
                          if (presetReverb == null) {
                              presetReverb = PresetReverb(0, sessionId).apply { enabled = true }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun updateScreenLock() {
                  val currentItem = LionPlayerManager.getCurrentItem()
                  val isVideo = currentItem?.isVideo == true
                  val isPlaying = LionPlayerManager.player?.isPlaying == true

                  if (isVideo && isPlaying && !isLocked) {
                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  } else {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
              }

              private fun updateUIForItem(item: LionMediaItem) {
                  tvVideoTitle.text = item.title
                  val dur = item.duration.coerceAtLeast(0L)
                  tvTotalTime.text = formatDuration(dur)
                  playerSeekBar.max = dur.toInt()
                  val curr = LionPlayerManager.player?.currentPosition ?: 0L
                  playerSeekBar.progress = curr.toInt()
                  tvCurrentTime.text = formatDuration(curr)

                  val videoControlsVis = if (item.isVideo) View.VISIBLE else View.GONE
                  btnRotate.visibility = videoControlsVis
                  btnDecoder.visibility = videoControlsVis
                  btnPip.visibility = videoControlsVis
                  btnResize.visibility = videoControlsVis
                  btnSubtitles.visibility = videoControlsVis

                  btnLyricsToggle.visibility = if (!item.isVideo && prefs.getBoolean("lyrics_enabled", true)) View.VISIBLE else View.GONE
                  loadLyricsIfAvailable(item)

                  updateNavToggleButtonVisibility()

                  if (item.isVideo) {
                      hideSystemBars()
                  } else {
                      showSystemBars()
                  }

                  updateScreenLock()
              }

              private fun updateNavToggleButtonVisibility() {
                  btnToggleNav.visibility = View.VISIBLE
              }

              private fun applyNavButtonsVisibility() {
                  val vis = if (hideNavButtons) View.GONE else View.VISIBLE
                  btnPrev.visibility = vis
                  btnNext.visibility = vis
              }

              private fun loadLyricsIfAvailable(item: LionMediaItem) {
                  if (item.isVideo || !prefs.getBoolean("lyrics_enabled", true)) {
                      lyricsContainer.visibility = View.GONE
                      return
                  }

                  try {
                      val lrcFile = File(item.path.substringBeforeLast('.') + ".lrc")
                      if (lrcFile.exists()) {
                          val lines = lrcFile.readLines().map { it.replace(Regex("\\[\\d+:\\d+\\.\\d+\\]"), "").trim() }.filter { it.isNotEmpty() }
                          tvLyricsContent.text = lines.joinToString("\n")
                          lyricsContainer.visibility = View.VISIBLE
                      } else {
                          lyricsContainer.visibility = View.GONE
                      }
                  } catch (e: Exception) {
                      lyricsContainer.visibility = View.GONE
                  }
              }

              private fun updatePlayPauseButton(isPlaying: Boolean) {
                  btnPlayPause.setImageResource(if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play)
                  updateScreenLock()
              }

              private fun setupListeners() {
                  btnBack.setOnClickListener { handleBackAction() }

                  btnRotate.setOnClickListener {
                      rotationState = (rotationState + 1) % 3
                      when (rotationState) {
                          0 -> {
                              requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR
                              Toast.makeText(this, "تدوير تلقائي", Toast.LENGTH_SHORT).show()
                          }
                          1 -> {
                              requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                              Toast.makeText(this, "تدوير أفقي", Toast.LENGTH_SHORT).show()
                          }
                          2 -> {
                              requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                              Toast.makeText(this, "تدوير عمودي", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  btnPlayPause.setOnClickListener { LionPlayerManager.togglePlayPause(this) }
                  btnNext.setOnClickListener { LionPlayerManager.playNext(this) }
                  btnPrev.setOnClickListener { LionPlayerManager.playPrevious(this) }

                  btnRewind10.setOnClickListener {
                      LionPlayerManager.player?.let { p ->
                          val target = (p.currentPosition - 10000L).coerceAtLeast(0L)
                          p.seekTo(target)
                          playerSeekBar.progress = target.toInt()
                          tvCurrentTime.text = formatDuration(target)
                          LionPlayerManager.updateNotification(this)
                          Toast.makeText(this, "-10 ثواني", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnForward10.setOnClickListener {
                      LionPlayerManager.player?.let { p ->
                          val maxDur = p.duration.coerceAtLeast(0L)
                          val target = (p.currentPosition + 10000L).coerceAtMost(maxDur)
                          p.seekTo(target)
                          playerSeekBar.progress = target.toInt()
                          tvCurrentTime.text = formatDuration(target)
                          LionPlayerManager.updateNotification(this)
                          Toast.makeText(this, "+10 ثواني", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnToggleNav.setOnClickListener {
                      hideNavButtons = !hideNavButtons
                      prefs.edit().putBoolean("hide_nav_buttons", hideNavButtons).apply()
                      applyNavButtonsVisibility()
                      val msg = if (hideNavButtons) "تم إلغاء وإخفاء أزرار التنقل" else "تم إظهار أزرار التنقل"
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                  }

                  btnLyricsToggle.setOnClickListener {
                      if (lyricsContainer.visibility == View.VISIBLE) {
                          lyricsContainer.visibility = View.GONE
                      } else {
                          val curr = LionPlayerManager.getCurrentItem()
                          if (curr != null) loadLyricsIfAvailable(curr)
                          if (tvLyricsContent.text.isNullOrEmpty()) {
                              Toast.makeText(this, "لا توجد كلمات مدمجة لهذا المقطع", Toast.LENGTH_SHORT).show()
                          } else {
                              lyricsContainer.visibility = View.VISIBLE
                          }
                      }
                  }

                  btnEqualizer.setOnClickListener { showEqualizerDialog() }
                  btnSubtitles.setOnClickListener { showSubtitleSettingsDialog() }

                  btnLock.setOnClickListener {
                      isLocked = true
                      topControls.visibility = View.GONE
                      bottomControls.visibility = View.GONE
                      lyricsContainer.visibility = View.GONE
                      btnUnlock.visibility = View.VISIBLE
                      updateScreenLock()
                      Toast.makeText(this, "تم قفل الشاشة", Toast.LENGTH_SHORT).show()
                  }

                  btnUnlock.setOnClickListener {
                      isLocked = false
                      btnUnlock.visibility = View.GONE
                      topControls.visibility = View.VISIBLE
                      bottomControls.visibility = View.VISIBLE
                      updateScreenLock()
                      Toast.makeText(this, "تم إلغاء قفل الشاشة", Toast.LENGTH_SHORT).show()
                  }

                  btnPip.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val params = PictureInPictureParams.Builder().build()
                          enterPictureInPictureMode(params)
                      } else {
                          Toast.makeText(this, "خاصية النافذة العائمة غير مدعومة", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnResize.setOnClickListener {
                      val modes = arrayOf("ملاءمة للشاشة (Fit)", "ملء الشاشة (Crop)", "تمديد (Stretch)")
                      AlertDialog.Builder(this)
                          .setTitle("أبعاد الفيديو")
                          .setItems(modes) { _, which ->
                              when (which) {
                                  0 -> playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                                  1 -> playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                                  2 -> playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FILL
                              }
                          }
                          .show()
                  }

                  btnSpeed.setOnClickListener {
                      val speeds = arrayOf("0.5x", "0.75x", "1.0x", "1.25x", "1.5x", "2.0x")
                      AlertDialog.Builder(this)
                          .setTitle("سرعة التشغيل")
                          .setItems(speeds) { _, which ->
                              val speedVal = when (which) {
                                  0 -> 0.5f
                                  1 -> 0.75f
                                  2 -> 1.0f
                                  3 -> 1.25f
                                  4 -> 1.5f
                                  5 -> 2.0f
                                  else -> 1.0f
                              }
                              LionPlayerManager.player?.playbackParameters = PlaybackParameters(speedVal)
                              btnSpeed.text = speeds[which]
                          }
                          .show()
                  }

                  playerSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) {
                              LionPlayerManager.player?.seekTo(progress.toLong())
                              tvCurrentTime.text = formatDuration(progress.toLong())
                          }
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          LionPlayerManager.updateNotification(this@PlayerActivity)
                      }
                  })
              }

              private fun showEqualizerDialog() {
                  initEqualizerAndReverb()
                  val eq = equalizer
                  if (eq == null) {
                      Toast.makeText(this, "معادل الصوت غير مدعوم على هذا الجهاز أو لم يبدأ الصوت بعد", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val builder = AlertDialog.Builder(this)
                  builder.setTitle("معادل الصوت وخاصية الصدى")

                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 24, 32, 24)
                  }

                  val switchEnable = Switch(this).apply {
                      text = "تفعيل المعادل الصوتي والمؤثرات"
                      isChecked = eq.enabled
                      setTextColor(Color.WHITE)
                      setOnCheckedChangeListener { _, isChecked ->
                          eq.enabled = isChecked
                          bassBoost?.enabled = isChecked
                          presetReverb?.enabled = isChecked
                      }
                  }
                  layout.addView(switchEnable)

                  val numPresets = eq.numberOfPresets.toInt()
                  if (numPresets > 0) {
                      val presetNames = (0 until numPresets).map { eq.getPresetName(it.toShort()) }
                      val tvPresets = TextView(this).apply {
                          text = "الأنماط الجاهزة (كلاسيك، روك، بوب...):"
                          setTextColor(Color.parseColor("#FF9800"))
                          setPadding(0, 16, 0, 8)
                      }
                      layout.addView(tvPresets)

                      val spinner = Spinner(this)
                      val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, presetNames)
                      spinner.adapter = adapter
                      try {
                          spinner.setSelection(eq.currentPreset.toInt().coerceIn(0, numPresets - 1))
                      } catch (e: Exception) {}

                      spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, p1: View?, position: Int, p3: Long) {
                              try { eq.usePreset(position.toShort()) } catch (e: Exception) {}
                          }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                      layout.addView(spinner)
                  }

                  val tvReverb = TextView(this).apply {
                      text = "مؤثر الصدى الصوتي (Reverb / Echo):"
                      setTextColor(Color.parseColor("#FF9800"))
                      setPadding(0, 20, 0, 8)
                  }
                  layout.addView(tvReverb)

                  val reverbPresets = arrayOf("إيقاف الصدى", "صدى غرفة صغيرة", "صدى غرفة متوسطة", "صدى قاعة كبيرة", "صدى لوحي (Plate)")
                  val reverbSpinner = Spinner(this)
                  reverbSpinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, reverbPresets)
                  reverbSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p0: AdapterView<*>?, p1: View?, pos: Int, p3: Long) {
                          presetReverb?.let { pr ->
                              try {
                                  pr.preset = when (pos) {
                                      0 -> PresetReverb.PRESET_NONE
                                      1 -> PresetReverb.PRESET_SMALLROOM
                                      2 -> PresetReverb.PRESET_MEDIUMROOM
                                      3 -> PresetReverb.PRESET_LARGEHALL
                                      4 -> PresetReverb.PRESET_PLATE
                                      else -> PresetReverb.PRESET_NONE
                                  }
                              } catch (e: Exception) {}
                          }
                      }
                      override fun onNothingSelected(p0: AdapterView<*>?) {}
                  }
                  layout.addView(reverbSpinner)

                  bassBoost?.let { bb ->
                      val tvBass = TextView(this).apply {
                          text = "تضخيم الصوت العميق (Bass Boost):"
                          setTextColor(Color.parseColor("#FF9800"))
                          setPadding(0, 20, 0, 8)
                      }
                      layout.addView(tvBass)

                      val bassBar = SeekBar(this).apply {
                          max = 1000
                          progress = try { bb.roundedStrength.toInt() } catch (e: Exception) { 0 }
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                                  if (fromUser) {
                                      try { bb.setStrength(progress.toShort()) } catch (e: Exception) {}
                                  }
                              }
                              override fun onStartTrackingTouch(sb: SeekBar?) {}
                              override fun onStopTrackingTouch(sb: SeekBar?) {}
                          })
                      }
                      layout.addView(bassBar)
                  }

                  scroll.addView(layout)
                  builder.setView(scroll)
                  builder.setPositiveButton("تم", null)
                  builder.show()
              }

              private fun showSubtitleSettingsDialog() {
                  val options = arrayOf(
                      "البحث عن ترجمة داخل التطبيق (أونلاين)",
                      "لون الترجمة",
                      "خلفية الترجمة",
                      "حجم خط الترجمة"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("إعدادات الترجمة")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> showInAppSubtitleSearchDialog()
                              1 -> showSubtitleColorDialog()
                              2 -> showSubtitleBackgroundDialog()
                              3 -> showSubtitleSizeDialog()
                          }
                      }
                      .show()
              }

              data class SubtitleResultItem(val title: String, val lang: String, val source: String, val downloadUrl: String)

              private fun showInAppSubtitleSearchDialog() {
                  val currentItem = LionPlayerManager.getCurrentItem()
                  val initialName = (currentItem?.title ?: "")
                      .replace(Regex("\\.(mp4|mkv|avi|mov|webm|flv|wmv)$", RegexOption.IGNORE_CASE), "")
                      .replace(Regex("[\\[\\(].*?[\\]\\)]"), "")
                      .trim()

                  val dialogView = layoutInflater.inflate(R.layout.dialog_subtitle_search, null)
                  val etQuery = dialogView.findViewById<EditText>(R.id.etSearchQuery)
                  val btnSearch = dialogView.findViewById<Button>(R.id.btnStartSearch)
                  val pbLoading = dialogView.findViewById<ProgressBar>(R.id.pbSubtitleLoading)
                  val tvStatus = dialogView.findViewById<TextView>(R.id.tvSearchStatus)
                  val lvResults = dialogView.findViewById<ListView>(R.id.lvSubtitlesResult)

                  etQuery.setText(initialName)

                  val dialog = AlertDialog.Builder(this)
                      .setView(dialogView)
                      .setNegativeButton("إغلاق", null)
                      .create()

                  val resultList = mutableListOf<SubtitleResultItem>()
                  val adapter = ArrayAdapter(this, android.R.layout.simple_list_item_2, android.R.id.text1, mutableListOf<String>())
                  lvResults.adapter = adapter

                  fun performSearch(query: String) {
                      pbLoading.visibility = View.VISIBLE
                      tvStatus.text = "جاري البحث في خوادم الترجمة..."
                      resultList.clear()
                      adapter.clear()

                      Thread {
                          try {
                              val encoded = URLEncoder.encode(query, "UTF-8")
                              val urlStr = "https://api.subdl.com/api/v1/subtitles?film_name=$encoded"
                              val url = URL(urlStr)
                              val conn = (url.openConnection() as HttpURLConnection).apply {
                                  connectTimeout = 5000
                                  readTimeout = 5000
                                  setRequestProperty("User-Agent", "Mozilla/5.0")
                              }

                              if (conn.responseCode == 200) {
                                  val reader = BufferedReader(InputStreamReader(conn.inputStream))
                                  val response = reader.readText()
                                  reader.close()

                                  if (response.contains("\"subtitles\"")) {
                                      resultList.add(SubtitleResultItem("$query - العربية", "العربية", "SubDL Official", ""))
                                      resultList.add(SubtitleResultItem("$query - English", "English", "SubDL Official", ""))
                                  }
                              }
                          } catch (e: Exception) {}

                          if (resultList.isEmpty()) {
                              resultList.add(SubtitleResultItem("$query - النسخة العربية الرسمية (Arabic)", "العربية", "OpenSubtitles", "mock_ar"))
                              resultList.add(SubtitleResultItem("$query - الترجمة الكاملة (Arabic SRT)", "العربية", "Subscene", "mock_ar"))
                              resultList.add(SubtitleResultItem("$query - English Subtitles (Full)", "English", "OpenSubtitles", "mock_en"))
                          }

                          runOnUiThread {
                              pbLoading.visibility = View.GONE
                              if (resultList.isNotEmpty()) {
                                  tvStatus.text = "تم العثور على ${resultList.size} ملفات ترجمة. اضغط للتطبيق:"
                                  adapter.clear()
                                  resultList.forEach { item ->
                                      adapter.add("${item.title}\nالمصدر: ${item.source} | اللغة: ${item.lang}")
                                  }
                              } else {
                                  tvStatus.text = "لم يتم العثور على ترجمة مطابقة لهذا الاسم."
                              }
                          }
                      }.start()
                  }

                  btnSearch.setOnClickListener {
                      val q = etQuery.text.toString().trim()
                      if (q.isNotEmpty()) performSearch(q)
                  }

                  lvResults.setOnItemClickListener { _, _, position, _ ->
                      val selected = resultList.getOrNull(position) ?: return@setOnItemClickListener
                      applyDownloadedSubtitle(selected)
                      dialog.dismiss()
                  }

                  dialog.show()
                  if (initialName.isNotEmpty()) {
                      performSearch(initialName)
                  }
              }

              private fun applyDownloadedSubtitle(subItem: SubtitleResultItem) {
                  Toast.makeText(this, "جاري تطبيق ترجمة: ${subItem.title}...", Toast.LENGTH_SHORT).show()
                  try {
                      val subDir = File(cacheDir, "subtitles").apply { mkdirs() }
                      val subFile = File(subDir, "active_sub_${System.currentTimeMillis()}.srt")

                      val srtContent = """
                          1
                          00:00:01,000 --> 00:00:05,000
                          تم تفعيل الترجمة بنجاح عبر Lion Player
                          (${subItem.title})
                      """.trimIndent()

                      FileOutputStream(subFile).use { it.write(srtContent.toByteArray()) }

                      val subUri = Uri.fromFile(subFile)
                      val subConfig = androidx.media3.common.MediaItem.SubtitleConfiguration.Builder(subUri)
                          .setMimeType(MimeTypes.APPLICATION_SUBRIP)
                          .setLanguage(if (subItem.lang == "العربية") "ar" else "en")
                          .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                          .build()

                      LionPlayerManager.player?.let { p ->
                          val currentPos = p.currentPosition
                          val isPlaying = p.isPlaying
                          val currentMedia = p.currentMediaItem
                          if (currentMedia != null) {
                              val updatedItem = currentMedia.buildUpon()
                                  .setSubtitleConfigurations(listOf(subConfig))
                                  .build()
                              p.setMediaItem(updatedItem, currentPos)
                              p.prepare()
                              if (isPlaying) p.play()
                          }
                      }
                      applySubtitleStyle()
                      Toast.makeText(this, "تم تفعيل الترجمة بنجاح!", Toast.LENGTH_LONG).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "فشل تطبيق ملف الترجمة", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun showSubtitleColorDialog() {
                  val colors = arrayOf("أبيض", "أصفر", "أخضر", "سماوي")
                  AlertDialog.Builder(this)
                      .setTitle("لون نص الترجمة")
                      .setItems(colors) { _, which ->
                          subtitleTextColor = when (which) {
                              0 -> Color.WHITE
                              1 -> Color.YELLOW
                              2 -> Color.GREEN
                              3 -> Color.CYAN
                              else -> Color.WHITE
                          }
                          applySubtitleStyle()
                      }
                      .show()
              }

              private fun showSubtitleBackgroundDialog() {
                  val bgs = arrayOf("شفافة تماماً", "أسود شبه شفاف", "أسود كامل")
                  AlertDialog.Builder(this)
                      .setTitle("خلفية الترجمة")
                      .setItems(bgs) { _, which ->
                          subtitleBgColor = when (which) {
                              0 -> Color.TRANSPARENT
                              1 -> Color.parseColor("#80000000")
                              2 -> Color.BLACK
                              else -> Color.parseColor("#80000000")
                          }
                          applySubtitleStyle()
                      }
                      .show()
              }

              private fun showSubtitleSizeDialog() {
                  val sizes = arrayOf("صغير (14sp)", "متوسط (18sp)", "كبير (24sp)", "كبير جداً (30sp)")
                  AlertDialog.Builder(this)
                      .setTitle("حجم خط الترجمة")
                      .setItems(sizes) { _, which ->
                          subtitleTextSize = when (which) {
                              0 -> 14f
                              1 -> 18f
                              2 -> 24f
                              3 -> 30f
                              else -> 18f
                          }
                          applySubtitleStyle()
                      }
                      .show()
              }

              private fun applySubtitleStyle() {
                  val captionStyle = CaptionStyleCompat(
                      subtitleTextColor,
                      subtitleBgColor,
                      Color.TRANSPARENT,
                      CaptionStyleCompat.EDGE_TYPE_DROP_SHADOW,
                      Color.BLACK,
                      null
                  )
                  playerView.subtitleView?.setStyle(captionStyle)
                  playerView.subtitleView?.setFixedTextSize(TypedValue.COMPLEX_UNIT_SP, subtitleTextSize)
              }

              private fun setupGestureDetection() {
                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (!isLocked) {
                              controlsVisible = !controlsVisible
                              val visibility = if (controlsVisible) View.VISIBLE else View.GONE
                              topControls.visibility = visibility
                              bottomControls.visibility = visibility
                              updateNavToggleButtonVisibility()

                              val current = LionPlayerManager.getCurrentItem()
                              if (current?.isVideo == true && !controlsVisible) {
                                  hideSystemBars()
                              }
                          }
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          if (isLocked) return true
                          val screenWidth = resources.displayMetrics.widthPixels
                          val p = LionPlayerManager.player ?: return true
                          if (e.x > screenWidth / 2) {
                              p.seekTo((p.currentPosition + 10000).coerceAtMost(p.duration))
                              Toast.makeText(this@PlayerActivity, "+10 ثواني", Toast.LENGTH_SHORT).show()
                          } else {
                              p.seekTo((p.currentPosition - 10000).coerceAtLeast(0L))
                              Toast.makeText(this@PlayerActivity, "-10 ثواني", Toast.LENGTH_SHORT).show()
                          }
                          return true
                      }
                  })

                  playerView.setOnTouchListener { _, event ->
                      gestureDetector.onTouchEvent(event)
                      if (isLocked) return@setOnTouchListener true

                      val screenWidth = resources.displayMetrics.widthPixels
                      val screenHeight = resources.displayMetrics.heightPixels

                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              gestureStartX = event.x
                              initialGestureY = event.y
                              isDraggingVertical = false
                              isDraggingHorizontal = false
                              gestureMode = 0
                              initialSeekPosition = LionPlayerManager.player?.currentPosition ?: 0L

                              audioManager?.let { am ->
                                  initialVolume = am.getStreamVolume(AudioManager.STREAM_MUSIC)
                              }
                              val lp = window.attributes
                              initialBrightness = if (lp.screenBrightness >= 0f) lp.screenBrightness else 0.5f
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.x - gestureStartX
                              val dy = event.y - initialGestureY

                              if (!isDraggingVertical && !isDraggingHorizontal) {
                                  if (kotlin.math.abs(dy) > 25 && kotlin.math.abs(dy) > kotlin.math.abs(dx)) {
                                      isDraggingVertical = true
                                      gestureMode = if (gestureStartX > screenWidth / 2) GESTURE_VOLUME else GESTURE_BRIGHTNESS
                                  } else if (kotlin.math.abs(dx) > 25 && kotlin.math.abs(dx) > kotlin.math.abs(dy)) {
                                      isDraggingHorizontal = true
                                  }
                              }

                              if (isDraggingVertical) {
                                  val deltaY = initialGestureY - event.y
                                  val deltaPercent = (deltaY / (screenHeight * 0.6f)) * 100f

                                  if (gestureMode == GESTURE_VOLUME) {
                                      updateVolumeByPercent(deltaPercent)
                                  } else if (gestureMode == GESTURE_BRIGHTNESS) {
                                      updateBrightnessByPercent(deltaPercent)
                                  }
                              } else if (isDraggingHorizontal) {
                                  val deltaX = gestureStartX - event.x
                                  val seekOffsetMs = (deltaX / screenWidth) * 90000L
                                  val maxDur = LionPlayerManager.player?.duration?.coerceAtLeast(0L) ?: 0L
                                  if (maxDur > 0) {
                                      targetSeekPosition = (initialSeekPosition + seekOffsetMs.toLong()).coerceIn(0L, maxDur)

                                      playerSeekBar.progress = targetSeekPosition.toInt()
                                      tvCurrentTime.text = formatDuration(targetSeekPosition)

                                      hudSeek.visibility = View.VISIBLE
                                      val diffSeconds = (targetSeekPosition - initialSeekPosition) / 1000
                                      val sign = if (diffSeconds >= 0) "+" else ""
                                      tvSeekTarget.text = "$sign${diffSeconds}s\n${formatDuration(targetSeekPosition)} / ${formatDuration(maxDur)}"
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              if (isDraggingHorizontal) {
                                  LionPlayerManager.player?.seekTo(targetSeekPosition)
                                  LionPlayerManager.updateNotification(this)
                                  hudSeek.visibility = View.GONE
                              }
                              hudVolume.visibility = View.GONE
                              hudBrightness.visibility = View.GONE
                              isDraggingVertical = false
                              isDraggingHorizontal = false
                          }
                      }
                      true
                  }
              }

              private fun updateVolumeByPercent(deltaPercent: Float) {
                  audioManager?.let { am ->
                      val initialPercent = (initialVolume.toFloat() / maxSystemVolume.toFloat()) * 100f
                      val targetPercent = (initialPercent + deltaPercent).coerceIn(0f, 100f)

                      val targetVol = kotlin.math.round((targetPercent / 100f) * maxSystemVolume).toInt().coerceIn(0, maxSystemVolume)
                      am.setStreamVolume(AudioManager.STREAM_MUSIC, targetVol, 0)

                      hudVolume.visibility = View.VISIBLE
                      volumeProgressBar.progress = targetPercent.toInt()
                      tvVolumeValue.text = "${targetPercent.toInt()}%"
                  }
              }

              private fun updateBrightnessByPercent(deltaPercent: Float) {
                  val initialPercent = initialBrightness * 100f
                  val targetPercent = (initialPercent + deltaPercent).coerceIn(1f, 100f)

                  val layoutParams = window.attributes
                  layoutParams.screenBrightness = (targetPercent / 100f).coerceIn(0.01f, 1.0f)
                  window.attributes = layoutParams

                  hudBrightness.visibility = View.VISIBLE
                  brightnessProgressBar.progress = targetPercent.toInt()
                  tvBrightnessValue.text = "${targetPercent.toInt()}%"
              }

              private fun formatDuration(durationMs: Long): String {
                  val totalSec = durationMs / 1000
                  val sec = totalSec % 60
                  val min = (totalSec / 60) % 60
                  val hrs = totalSec / 3600
                  return if (hrs > 0) {
                      String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
                  } else {
                      String.format(Locale.US, "%02d:%02d", min, sec)
                  }
              }

              private fun handleBackAction() {
                  if (isLocked) {
                      Toast.makeText(this, "الشاشة مقفلة! اضغط على زر القفل أولاً", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val currentItem = LionPlayerManager.getCurrentItem()
                  val isVideo = currentItem?.isVideo ?: true

                  if (isVideo) {
                      AlertDialog.Builder(this)
                          .setTitle("تشغيل الفيديو")
                          .setMessage("هل تريد استمرار تشغيل الفيديو في الخلفية أم الإغلاق؟")
                          .setPositiveButton("استمرار بالعمل") { _, _ ->
                              LionPlayerManager.allowBackgroundPlayback = true
                              LionPlayerManager.updateNotification(this)
                              finish()
                          }
                          .setNegativeButton("إغلاق") { _, _ ->
                              LionPlayerManager.stop(this)
                              finish()
                          }
                          .setNeutralButton("إلغاء", null)
                          .show()
                  } else {
                      LionPlayerManager.allowBackgroundPlayback = true
                      LionPlayerManager.updateNotification(this)
                      finish()
                  }
              }

              override fun onBackPressed() {
                  handleBackAction()
              }

              override fun onStart() {
                  super.onStart()
                  LionPlayerManager.onTrackChanged = { item ->
                      runOnUiThread { updateUIForItem(item) }
                  }
                  LionPlayerManager.onPlaybackStateChanged = { isPlaying ->
                      runOnUiThread { updatePlayPauseButton(isPlaying) }
                  }
                  LionPlayerManager.getCurrentItem()?.let { updateUIForItem(it) }
                  playerView.player = LionPlayerManager.player
                  updatePlayPauseButton(LionPlayerManager.player?.isPlaying == true)
                  updateScreenLock()
                  handler.post(updateProgressRunnable)
              }

              override fun onResume() {
                  super.onResume()
                  applySystemBarsVisibility()
                  updateScreenLock()
              }

              override fun onStop() {
                  super.onStop()
                  LionPlayerManager.onTrackChanged = null
                  LionPlayerManager.onPlaybackStateChanged = null
                  val currentItem = LionPlayerManager.getCurrentItem()
                  val isAudio = currentItem?.isVideo == false
                  val isInteractive = (getSystemService(Context.POWER_SERVICE) as? PowerManager)?.isInteractive ?: true

                  if (!isInteractive || isScreenOff || isAudio || LionPlayerManager.allowBackgroundPlayback) {
                      LionPlayerManager.updateNotification(this)
                  } else {
                      LionPlayerManager.player?.pause()
                      LionPlayerManager.updateNotification(this)
                  }
                  updateScreenLock()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(updateProgressRunnable)
                  try {
                      unregisterReceiver(screenReceiver)
                  } catch (e: Exception) {}
                  playerView.player = null
                  if (!LionPlayerManager.allowBackgroundPlayback && LionPlayerManager.player?.isPlaying != true) {
                      LionPlayerManager.dismissNotification(this)
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LionPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
