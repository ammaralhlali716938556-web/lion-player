import androidx.media3.exoplayer.mediacodec.MediaCodecSelector
import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
import androidx.media3.exoplayer.source.MediaSource
import com.lionplayer.app.data.vault.VaultManager
import com.lionplayer.app.model.MediaItem as LionMediaItem
import com.lionplayer.app.player.datasource.EncryptedDataSourceFactory
import java.io.File

object PlayerEngine {

    fun createRenderersFactory(context: Context, mode: String): DefaultRenderersFactory {
        val factory = DefaultRenderersFactory(context.applicationContext)
        // Prefer software/FFmpeg extensions when available, and enable seamless fallback
        factory.setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER)
        factory.setEnableDecoderFallback(true)

        when (mode) {
            "SW" -> {
                factory.setMediaCodecSelector { mimeType, requiresSecureDecoder, requiresTunnelingDecoder ->
                    val allDecoders = MediaCodecSelector.DEFAULT.getDecoderInfos(mimeType, requiresSecureDecoder, requiresTunnelingDecoder)
                    val swDecoders = allDecoders.filter {
                        it.softwareOnly || it.name.startsWith("OMX.google.", ignoreCase = true) || it.name.startsWith("c2.android.", ignoreCase = true)
                    }
                    if (swDecoders.isNotEmpty()) swDecoders else allDecoders
                }
            }
            "HW+" -> {
                // High-performance asynchronous queueing for smooth 4K and 10-bit HEVC playback
                factory.forceEnableMediaCodecAsynchronousQueueing()
                factory.setMediaCodecSelector { mimeType, requiresSecureDecoder, requiresTunnelingDecoder ->
                    val allDecoders = MediaCodecSelector.DEFAULT.getDecoderInfos(mimeType, requiresSecureDecoder, requiresTunnelingDecoder)
                    val hwDecoders = allDecoders.filter {
                        !it.softwareOnly && !it.name.startsWith("OMX.google.", ignoreCase = true) && !it.name.startsWith("c2.android.", ignoreCase = true)
                    }
                    if (hwDecoders.isNotEmpty()) hwDecoders else allDecoders
                }
            }
            else -> { // Standard "HW"
                factory.setMediaCodecSelector { mimeType, requiresSecureDecoder, requiresTunnelingDecoder ->
                    val allDecoders = MediaCodecSelector.DEFAULT.getDecoderInfos(mimeType, requiresSecureDecoder, requiresTunnelingDecoder)
                    val hwDecoders = allDecoders.filter { !it.softwareOnly }
                    if (hwDecoders.isNotEmpty()) hwDecoders else allDecoders
                }
            }
        }
        return factory
    }

    fun createPlayer(context: Context, mode: String = "HW"): ExoPlayer {
        val appContext = context.applicationContext
        return ExoPlayer.Builder(appContext)
            .setRenderersFactory(createRenderersFactory(appContext, mode))
            .setSeekParameters(SeekParameters.EXACT)
            .setAudioAttributes(
                AudioAttributes.Builder()
                    .setUsage(C.USAGE_MEDIA)
                    .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                    .build(),
                true
            )
            .setWakeMode(C.WAKE_MODE_LOCAL)
            .setHandleAudioBecomingNoisy(true)
            .build()
    }

    fun buildMediaSource(context: Context, item: LionMediaItem): MediaSource {
        val appContext = context.applicationContext

        if (item.isVault) {
            // Zero-Disk Encrypted Streaming via AES/CTR in RAM
            val key = VaultManager.getOrCreateKey(appContext)
            val iv = VaultManager.getOrCreateIv(appContext)
            val encFactory = EncryptedDataSourceFactory(key, iv)
            val mediaItem = MediaItem.fromUri(Uri.fromFile(File(item.path)))
            return DefaultMediaSourceFactory(encFactory).createMediaSource(mediaItem)
        }

        val mediaItemBuilder = MediaItem.Builder()
        if (item.uri.isNotEmpty()) {
            mediaItemBuilder.setUri(Uri.parse(item.uri))
        } else if (item.path.isNotEmpty()) {
            mediaItemBuilder.setUri(Uri.fromFile(File(item.path)))
        }

        // Real Subtitle Integration Engine (SRT, ASS, SSA, WebVTT)
        item.subtitleUri?.let { subUriStr ->
            val subUri = Uri.parse(subUriStr)
            val mimeType = SubtitleSyncEngine.detectMimeType(subUriStr)
            val subConfig = SubtitleSyncEngine.buildSubtitleConfig(subUri, mimeType)
            mediaItemBuilder.setSubtitleConfigurations(listOf(subConfig))
        }

        val mediaItem = mediaItemBuilder.build()
        val dataSourceFactory = if (item.isNetworkStream) {
            DefaultHttpDataSource.Factory()
                .setUserAgent("LionPlayerPro/2.0")
                .setConnectTimeoutMs(15000)
                .setReadTimeoutMs(15000)
                .setAllowCrossProtocolRedirects(true)
        } else {
            DefaultDataSource.Factory(appContext)
        }

        return DefaultMediaSourceFactory(dataSourceFactory).createMediaSource(mediaItem)
    }
}
