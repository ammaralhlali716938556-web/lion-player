          # 14. ThumbnailLoader.kt
          cat << 'EOF' > app/src/main/java/com/lionplayer/app/adapter/ThumbnailLoader.kt
          package com.lionplayer.app.adapter

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.util.LruCache
          import android.util.Size
          import android.widget.ImageView
          import com.lionplayer.app.R
          import com.lionplayer.app.model.MediaItem
          import java.io.File
          import java.util.concurrent.Executors

          object ThumbnailLoader {

              private val maxMemory = (Runtime.getRuntime().maxMemory() / 1024).toInt()
              private val cacheSize = maxMemory / 8

              private val memoryCache = object : LruCache<String, Bitmap>(cacheSize) {
                  override fun sizeOf(key: String, bitmap: Bitmap): Int {
                      return bitmap.byteCount / 1024
                  }
              }

              private val executor = Executors.newFixedThreadPool(4)
              private val mainHandler = Handler(Looper.getMainLooper())

              fun load(imageView: ImageView, item: MediaItem) {
                  if (item.isFolder) {
                      imageView.setImageResource(R.drawable.ic_folder)
                      return
                  }

                  val cacheKey = "${item.id}_${item.isVideo}"
                  val cachedBitmap = memoryCache.get(cacheKey)
                  if (cachedBitmap != null) {
                      imageView.setImageBitmap(cachedBitmap)
                      return
                  }

                  val placeholder = if (item.isVideo) R.drawable.ic_video else R.drawable.ic_music_note
                  imageView.setImageResource(placeholder)
                  imageView.tag = cacheKey

                  executor.execute {
                      val bitmap = retrieveThumbnail(imageView.context, item)
                      if (bitmap != null) {
                          memoryCache.put(cacheKey, bitmap)
                          mainHandler.post {
                              if (imageView.tag == cacheKey) {
                                  imageView.setImageBitmap(bitmap)
                              }
                          }
                      }
                  }
              }

              private fun retrieveThumbnail(context: Context, item: MediaItem): Bitmap? {
                  return try {
                      if (item.isVideo) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              try {
                                  context.contentResolver.loadThumbnail(Uri.parse(item.uri), Size(128, 128), null)
                              } catch (e: Exception) {
                                  getVideoFrameFallback(context, item)
                              }
                          } else {
                              getVideoFrameFallback(context, item)
                          }
                      } else {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              try {
                                  context.contentResolver.loadThumbnail(Uri.parse(item.uri), Size(128, 128), null)
                              } catch (e: Exception) {
                                  getAudioArtFallback(context, item)
                              }
                          } else {
                              getAudioArtFallback(context, item)
                          }
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun getVideoFrameFallback(context: Context, item: MediaItem): Bitmap? {
                  val retriever = MediaMetadataRetriever()
                  return try {
                      if (item.path.isNotEmpty() && File(item.path).exists()) {
                          retriever.setDataSource(item.path)
                      } else {
                          retriever.setDataSource(context, Uri.parse(item.uri))
                      }
                      retriever.getFrameAtTime(1000000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                  } catch (e: Exception) {
                      null
                  } finally {
                      try { retriever.release() } catch (e: Exception) {}
                  }
              }

              private fun getAudioArtFallback(context: Context, item: MediaItem): Bitmap? {
                  val retriever = MediaMetadataRetriever()
                  return try {
                      if (item.path.isNotEmpty() && File(item.path).exists()) {
                          retriever.setDataSource(item.path)
                      } else {
                          retriever.setDataSource(context, Uri.parse(item.uri))
                      }
                      val art = retriever.embeddedPicture
                      if (art != null) {
                          BitmapFactory.decodeByteArray(art, 0, art.size)
                      } else {
                          null
                      }
                  } catch (e: Exception) {
                      null
                  } finally {
                      try { retriever.release() } catch (e: Exception) {}
                  }
              }
          }
          EOF

          # 15. LionPlayerManager.kt
          cat << 'EOF' > app/src/main/java/com/lionplayer/app/player/LionPlayerManager.kt
          package com.lionplayer.app.player

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import com.lionplayer.app.R
          import com.lionplayer.app.model.MediaItem as LionMediaItem
          import com.lionplayer.app.receiver.NotificationReceiver
          import com.lionplayer.app.ui.PlayerActivity
          import java.util.ArrayList
          import java.util.Locale

          object LionPlayerManager {

              const val CHANNEL_ID = "lion_playback_channel"
              const val NOTIFICATION_ID = 2024

              var player: ExoPlayer? = null
                  private set

              private var mediaSession: MediaSession? = null

              var playlist: ArrayList<LionMediaItem> = arrayListOf()
              var currentIndex: Int = 0
              var allowBackgroundPlayback: Boolean = false

              var onTrackChanged: ((LionMediaItem) -> Unit)? = null
              var onPlaybackStateChanged: ((Boolean) -> Unit)? = null

              fun getOrCreatePlayer(context: Context): ExoPlayer {
                  if (player == null) {
                      val appContext = context.applicationContext
                      player = ExoPlayer.Builder(appContext)
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(C.USAGE_MEDIA)
                                  .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                                  .build(),
                              true
                          )
                          .setWakeMode(C.WAKE_MODE_LOCAL)
                          .setHandleAudioBecomingNoisy(true)
                          .build().apply {
                              addListener(object : Player.Listener {
                                  override fun onIsPlayingChanged(isPlaying: Boolean) {
                                      onPlaybackStateChanged?.invoke(isPlaying)
                                      updateNotification(appContext)
                                  }

                                  override fun onPlaybackStateChanged(playbackState: Int) {
                                      if (playbackState == Player.STATE_ENDED) {
                                          if (currentIndex < playlist.size - 1) {
                                              playNext(appContext)
                                          } else {
                                              onPlaybackStateChanged?.invoke(false)
                                              updateNotification(appContext)
                                          }
                                      }
                                  }
                              })
                          }

                      mediaSession = MediaSession.Builder(appContext, player!!)
                          .setId("LionMediaSession")
                          .build()

                      createNotificationChannel(appContext)
                  }
                  return player!!
              }

              fun playPlaylist(context: Context, list: ArrayList<LionMediaItem>, index: Int) {
                  val appContext = context.applicationContext
                  val p = getOrCreatePlayer(appContext)

                  val currentItem = playlist.getOrNull(currentIndex)
                  val targetItem = list.getOrNull(index)

                  if (currentItem != null && targetItem != null && currentItem.id == targetItem.id && p.isPlaying) {
                      playlist = list
                      currentIndex = index
                      onTrackChanged?.invoke(targetItem)
                      return
                  }

                  playlist = list
                  currentIndex = index
                  playCurrentItem(appContext)
              }

              fun playCurrentItem(context: Context) {
                  val item = playlist.getOrNull(currentIndex) ?: return
                  val appContext = context.applicationContext
                  val p = getOrCreatePlayer(appContext)

                  if (!item.isVideo) {
                      allowBackgroundPlayback = true
                  }

                  val mediaItem = MediaItem.fromUri(Uri.parse(item.uri))
                  p.setMediaItem(mediaItem)
                  p.prepare()
                  p.play()

                  onTrackChanged?.invoke(item)
                  onPlaybackStateChanged?.invoke(true)
                  updateNotification(appContext)
              }

              fun playNext(context: Context) {
                  if (currentIndex < playlist.size - 1) {
                      currentIndex++
                      playCurrentItem(context)
                  } else {
                      Toast.makeText(context.applicationContext, "هذا هو العنصر الأخير في القائمة", Toast.LENGTH_SHORT).show()
                  }
              }

              fun playPrevious(context: Context) {
                  if (currentIndex > 0) {
                      currentIndex--
                      playCurrentItem(context)
                  } else {
                      Toast.makeText(context.applicationContext, "هذا هو العنصر الأول في القائمة", Toast.LENGTH_SHORT).show()
                  }
              }

              fun togglePlayPause(context: Context) {
                  val p = player ?: return
                  if (p.isPlaying) {
                      p.pause()
                  } else {
                      p.play()
                  }
                  updateNotification(context)
              }

              fun stop(context: Context) {
                  allowBackgroundPlayback = false
                  player?.stop()
                  dismissNotification(context)
                  onPlaybackStateChanged?.invoke(false)
              }

              fun release() {
                  allowBackgroundPlayback = false
                  mediaSession?.release()
                  mediaSession = null
                  player?.release()
                  player = null
              }

              fun getCurrentItem(): LionMediaItem? = playlist.getOrNull(currentIndex)

              fun createNotificationChannel(context: Context) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val name = "Lion Playback"
                      val desc = "Lion Player Media Playback Controls"
                      val importance = NotificationManager.IMPORTANCE_LOW
                      val channel = NotificationChannel(CHANNEL_ID, name, importance).apply {
                          description = desc
                          setShowBadge(false)
                          setSound(null, null)
                          enableVibration(false)
                      }
                      val manager = context.getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }

              fun formatDuration(durationMs: Long): String {
                  val totalSec = durationMs / 1000
                  val sec = totalSec % 60
                  val min = (totalSec / 60) % 60
                  val hrs = totalSec / 3600
                  return if (hrs > 0) {
                      String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
                  } else {
                      String.format(Locale.US, "%02d:%02d", min, sec)
                  }
              }

              fun updateNotification(context: Context) {
                  val currentItem = playlist.getOrNull(currentIndex) ?: return
                  val p = player
                  val isPlaying = p?.isPlaying == true
                  val appContext = context.applicationContext

                  val currentPos = p?.currentPosition ?: 0L
                  val totalDur = (if (p != null && p.duration > 0) p.duration else currentItem.duration).coerceAtLeast(0L)
                  val timeString = "${formatDuration(currentPos)} / ${formatDuration(totalDur)}"
                  val mediaTypeString = if (currentItem.isVideo) "فيديو" else "صوت"

                  val pendingFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  } else {
                      PendingIntent.FLAG_UPDATE_CURRENT
                  }

                  val contentIntent = Intent(appContext, PlayerActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val contentPendingIntent = PendingIntent.getActivity(appContext, 0, contentIntent, pendingFlags)

                  val prevIntent = Intent(NotificationReceiver.ACTION_NOTIF_PREV).setPackage(appContext.packageName)
                  val prevPending = PendingIntent.getBroadcast(appContext, 1, prevIntent, pendingFlags)

                  val playPauseIntent = Intent(NotificationReceiver.ACTION_NOTIF_PLAY_PAUSE).setPackage(appContext.packageName)
                  val playPausePending = PendingIntent.getBroadcast(appContext, 2, playPauseIntent, pendingFlags)

                  val nextIntent = Intent(NotificationReceiver.ACTION_NOTIF_NEXT).setPackage(appContext.packageName)
                  val nextPending = PendingIntent.getBroadcast(appContext, 3, nextIntent, pendingFlags)

                  val closeIntent = Intent(NotificationReceiver.ACTION_NOTIF_CLOSE).setPackage(appContext.packageName)
                  val closePending = PendingIntent.getBroadcast(appContext, 4, closeIntent, pendingFlags)

                  val playPauseIcon = if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play
                  val playPauseTitle = if (isPlaying) "إيقاف مؤقت" else "تشغيل"

                  val builder = NotificationCompat.Builder(appContext, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_lion_logo)
                      .setContentTitle(currentItem.title)
                      .setContentText("$timeString • $mediaTypeString")
                      .setSubText(timeString)
                      .setContentIntent(contentPendingIntent)
                      .setOngoing(isPlaying)
                      .setOnlyAlertOnce(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .addAction(R.drawable.ic_skip_previous, "السابق", prevPending)
                      .addAction(playPauseIcon, playPauseTitle, playPausePending)
                      .addAction(R.drawable.ic_skip_next, "التالي", nextPending)
                      .addAction(R.drawable.ic_close, "إنهاء", closePending)

                  try {
                      builder.setStyle(
                          androidx.media.app.NotificationCompat.MediaStyle()
                              .setShowActionsInCompactView(0, 1, 2)
                      )
                  } catch (e: Exception) {}

                  val manager = appContext.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  try {
                      manager.notify(NOTIFICATION_ID, builder.build())
                  } catch (e: SecurityException) {}
              }

              fun dismissNotification(context: Context) {
                  val manager = context.applicationContext.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.cancel(NOTIFICATION_ID)
              }
          }
          EOF

          # 16. NotificationReceiver.kt
          cat << 'EOF' > app/src/main/java/com/lionplayer/app/receiver/NotificationReceiver.kt
          package com.lionplayer.app.receiver

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import com.lionplayer.app.player.LionPlayerManager

          class NotificationReceiver : BroadcastReceiver() {

              companion object {
                  const val ACTION_NOTIF_PREV = "com.lionplayer.app.ACTION_NOTIF_PREV"
                  const val ACTION_NOTIF_PLAY_PAUSE = "com.lionplayer.app.ACTION_NOTIF_PLAY_PAUSE"
                  const val ACTION_NOTIF_NEXT = "com.lionplayer.app.ACTION_NOTIF_NEXT"
                  const val ACTION_NOTIF_CLOSE = "com.lionplayer.app.ACTION_NOTIF_CLOSE"
              }

              override fun onReceive(context: Context, intent: Intent?) {
                  when (intent?.action) {
                      ACTION_NOTIF_PREV -> LionPlayerManager.playPrevious(context)
                      ACTION_NOTIF_PLAY_PAUSE -> LionPlayerManager.togglePlayPause(context)
                      ACTION_NOTIF_NEXT -> LionPlayerManager.playNext(context)
                      ACTION_NOTIF_CLOSE -> LionPlayerManager.stop(context)
                  }
              }
          }
          EOF

          # 17. MediaAdapter.kt
          cat << 'EOF' > app/src/main/java/com/lionplayer/app/adapter/MediaAdapter.kt
          package com.lionplayer.app.adapter

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageButton
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import com.lionplayer.app.R
          import com.lionplayer.app.model.MediaItem
          import java.util.Locale

          class MediaAdapter(
              private var items: List<MediaItem>,
              private var viewMode: Int,
              private var showExtensions: Boolean,
              private val onItemClick: (MediaItem) -> Unit,
              private val onItemLongClick: (MediaItem) -> Unit,
              private val onMoreOptionsClick: (MediaItem, View) -> Unit
          ) : RecyclerView.Adapter<MediaAdapter.MediaViewHolder>() {

              companion object {
                  const val VIEW_MODE_LIST = 0
                  const val VIEW_MODE_GRID_LARGE = 1
                  const val VIEW_MODE_GRID_SMALL = 2
              }

              fun updateData(newItems: List<MediaItem>, newViewMode: Int = viewMode, newShowExt: Boolean = showExtensions) {
                  this.items = newItems
                  this.viewMode = newViewMode
                  this.showExtensions = newShowExt
                  notifyDataSetChanged()
              }

              override fun getItemViewType(position: Int): Int = viewMode

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): MediaViewHolder {
                  val layoutId = if (viewType == VIEW_MODE_LIST) {
                      R.layout.item_media_video
                  } else {
                      R.layout.item_media_grid
                  }
                  val view = LayoutInflater.from(parent.context).inflate(layoutId, parent, false)
                  return MediaViewHolder(view)
              }

              override fun onBindViewHolder(holder: MediaViewHolder, position: Int) {
                  holder.bind(items[position])
              }

              override fun getItemCount(): Int = items.size

              inner class MediaViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
                  private val ivThumbnail: ImageView = itemView.findViewById(R.id.ivThumbnail)
                  private val tvTitle: TextView = itemView.findViewById(R.id.tvTitle)
                  private val tvSubInfo: TextView = itemView.findViewById(R.id.tvSubInfo)
                  private val tvDetails: TextView = itemView.findViewById(R.id.tvDetails)
                  private val btnMore: ImageButton? = itemView.findViewById(R.id.btnMore)

                  fun bind(item: MediaItem) {
                      val displayTitle = if (item.isFolder || showExtensions) {
                          item.title
                      } else {
                          item.title.replace(Regex("\\.[a-zA-Z0-9]{2,5}$"), "")
                      }
                      tvTitle.text = displayTitle

                      if (item.isFolder) {
                          ivThumbnail.setImageResource(R.drawable.ic_folder)
                          tvSubInfo.visibility = View.GONE
                          tvDetails.text = "${item.itemCount} عناصر"
                          btnMore?.visibility = View.GONE
                      } else {
                          ThumbnailLoader.load(ivThumbnail, item)

                          tvSubInfo.visibility = View.VISIBLE
                          val folderStr = if (item.parentFolder.isNotEmpty()) item.parentFolder else "الرئيسي"
                          val albumStr = if (item.album.isNotEmpty() && item.album != "<unknown>") item.album else "ألبوم غير محدد"
                          val artistStr = if (item.artist.isNotEmpty() && item.artist != "<unknown>") item.artist else "فنان غير معروف"
                          tvSubInfo.text = "قائمة: $folderStr • ألبوم: $albumStr • فنان: $artistStr"

                          val sizeFormatted = formatFileSize(item.size)
                          val durationFormatted = formatDuration(item.duration)
                          val favMark = if (item.isFavorite) " ❤️" else ""
                          tvDetails.text = "$durationFormatted | $sizeFormatted$favMark"

                          btnMore?.visibility = View.VISIBLE
                          btnMore?.setOnClickListener { v -> onMoreOptionsClick(item, v) }
                      }

                      itemView.setOnClickListener { onItemClick(item) }
                      itemView.setOnLongClickListener {
                          if (!item.isFolder) {
                              onItemLongClick(item)
                              true
                          } else false
                      }
                  }

                  private fun formatFileSize(size: Long): String {
                      if (size <= 0) return "0 MB"
                      val mb = size / (1024.0 * 1024.0)
                      return String.format(Locale.US, "%.1f MB", mb)
                  }

                  private fun formatDuration(durationMs: Long): String {
                      val totalSec = durationMs / 1000
                      val sec = totalSec % 60
                      val min = (totalSec / 60) % 60
                      val hrs = totalSec / 3600
                      return if (hrs > 0) {
                          String.format(Locale.US, "%d:%02d:%02d", hrs, min, sec)
                      } else {
                          String.format(Locale.US, "%02d:%02d", min, sec)
                      }
                  }
              }
          }
          EOF

