          inner class LinearViewHolder(private val binding: ItemMediaVideoBinding) :
          RecyclerView.ViewHolder(binding.root) {

          fun bind(item: MediaItem) {
            binding.tvTitle.text = item.title

            if (item.isFolder) {
                binding.tvSubInfo.text = "مجلد • ${item.itemCount} ملفات"
                binding.tvDetails.text = Formatter.formatFileSize(itemView.context, item.size)
                binding.tvThumbDuration.visibility = View.GONE
                binding.ivThumbnail.setImageResource(R.drawable.ic_folder)
                binding.tvFolderNewCount.visibility = if (item.newCount > 0) View.VISIBLE else View.GONE
                binding.tvFolderNewCount.text = item.newCount.toString()
                binding.tvNewBadge.visibility = View.GONE
            } else {
                val durStr = LionPlayerManager.formatDuration(item.duration)
