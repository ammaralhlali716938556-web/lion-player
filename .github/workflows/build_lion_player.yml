package com.lionplayer.app.player

import android.net.Uri
import androidx.media3.common.C
import androidx.media3.common.MediaItem
import androidx.media3.common.MimeTypes

class SubtitleSyncEngine {
    var subtitleOffsetMs: Long = 0L
        private set

    fun adjustSubtitleOffset(deltaMs: Long): Long {
        subtitleOffsetMs += deltaMs
        return subtitleOffsetMs
    }

    fun resetSubtitleOffset() {
        subtitleOffsetMs = 0L
    }

    companion object {
        fun buildSubtitleConfig(uri: Uri, mimeType: String, language: String = "ar", label: String = "عربي"): MediaItem.SubtitleConfiguration {
            return MediaItem.SubtitleConfiguration.Builder(uri)
                .setMimeType(mimeType)
                .setLanguage(language)
                .setLabel(label)
                .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                .build()
        }

        fun detectMimeType(filePath: String): String {
            val lower = filePath.lowercase()
            return when {
                lower.endsWith(".srt") -> MimeTypes.APPLICATION_SUBRIP
                lower.endsWith(".ass") || lower.endsWith(".ssa") -> MimeTypes.TEXT_SSA
                lower.endsWith(".vtt") -> MimeTypes.TEXT_VTT
                else -> MimeTypes.APPLICATION_SUBRIP
            }
        }
    }
}
