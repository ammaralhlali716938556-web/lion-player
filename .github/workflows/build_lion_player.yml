                          android:contentDescription="الإعدادات" />
                  </LinearLayout>
          
                  <!-- Top Bar 2 -->
                  <LinearLayout
                      android:id="@+id/topBarSecondary"
                      android:layout_width="match_parent"
                      android:layout_height="38dp"
                      android:gravity="center_vertical|end"
                      android:orientation="horizontal">
          
                      <ImageButton
                          android:id="@+id/btnAbRepeat"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginStart="2dp"
                          android:layout_marginEnd="2dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_ab_repeat"
                          app:tint="#FFFFFF"
                          android:contentDescription="تكرار مقطعي A-B" />
          
                      <ImageButton
                          android:id="@+id/btnRepeat"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginStart="2dp"
                          android:layout_marginEnd="2dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_repeat"
                          app:tint="#FFFFFF"
                          android:contentDescription="تكرار المقطع" />
          
                      <ImageButton
                          android:id="@+id/btnFavorite"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginStart="2dp"
                          android:layout_marginEnd="2dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_favorite_border"
                          app:tint="#FFFFFF"
                          android:contentDescription="تفضيل" />
          
                      <ImageButton
                          android:id="@+id/btnEqualizer"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginStart="2dp"
                          android:layout_marginEnd="2dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_equalizer"
                          app:tint="#FFFFFF"
                          android:contentDescription="معادل الصوت" />
          
                      <ImageButton
                          android:id="@+id/btnRotate"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginStart="2dp"
                          android:layout_marginEnd="2dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_screen_rotation"
                          app:tint="#FFFFFF"
                          android:contentDescription="تدوير الشاشة" />
          
                      <ImageButton
                          android:id="@+id/btnPip"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginStart="2dp"
                          android:layout_marginEnd="2dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_pip"
                          app:tint="#FFFFFF"
                          android:contentDescription="الشاشة العائمة" />
          
                      <ImageButton
                          android:id="@+id/btnLock"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginStart="2dp"
                          android:layout_marginEnd="2dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_lock"
                          app:tint="#FFFFFF"
                          android:contentDescription="قفل الشاشة" />
          
                      <ImageButton
                          android:id="@+id/btnToggleNav"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginStart="2dp"
                          android:layout_marginEnd="2dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_fullscreen"
                          app:tint="#FFFFFF"
                          android:contentDescription="شاشة كاملة" />
          
                      <ImageButton
                          android:id="@+id/btnLyricsToggle"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginStart="2dp"
                          android:layout_marginEnd="2dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:src="@drawable/ic_lyrics"
                          app:tint="#FFFFFF"
                          android:contentDescription="كلمات الأغنية" />
                  </LinearLayout>
              </LinearLayout>
          
              <ImageButton
                  android:id="@+id/btnUnlock"
                  android:layout_width="56dp"
                  android:layout_height="56dp"
                  android:layout_margin="24dp"
                  android:background="@drawable/bg_hud"
                  android:src="@drawable/ic_lock_open"
                  android:visibility="gone"
                  app:tint="#FF9800"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintStart_toStartOf="parent" />
          
              <!-- Brightness HUD -->
              <LinearLayout
                  android:id="@+id/hudBrightness"
                  android:layout_width="64dp"
                  android:layout_height="240dp"
                  android:layout_marginStart="24dp"
                  android:background="@drawable/bg_hud"
                  android:gravity="center_horizontal"
                  android:orientation="vertical"
                  android:padding="8dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent">
          
                  <ImageView
                      android:layout_width="24dp"
                      android:layout_height="24dp"
                      android:src="@drawable/ic_brightness"
                      app:tint="#FFFFFF" />
          
                  <FrameLayout
                      android:layout_width="24dp"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="8dp"
                      android:layoutDirection="ltr">
          
                      <ProgressBar
                          android:id="@+id/brightnessProgressBar"
                          style="@android:style/Widget.ProgressBar.Horizontal"
                          android:layout_width="140dp"
                          android:layout_height="12dp"
                          android:layout_gravity="center"
                          android:layoutDirection="ltr"
                          android:max="100"
                          android:progress="50"
                          android:progressDrawable="@drawable/progress_hud"
                          android:rotation="270" />
                  </FrameLayout>
          
                  <TextView
                      android:id="@+id/tvBrightnessValue"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="50%"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp"
                      android:textStyle="bold" />
              </LinearLayout>
          
              <!-- Volume HUD with 200% Loudness HUD -->
              <LinearLayout
                  android:id="@+id/hudVolume"
                  android:layout_width="72dp"
                  android:layout_height="240dp"
                  android:layout_marginEnd="24dp"
                  android:background="@drawable/bg_hud"
                  android:gravity="center_horizontal"
                  android:orientation="vertical"
                  android:padding="8dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintTop_toTopOf="parent">
          
                  <ImageView
                      android:layout_width="24dp"
                      android:layout_height="24dp"
                      android:src="@drawable/ic_audiotrack"
                      app:tint="#FFFFFF" />
          
                  <FrameLayout
                      android:layout_width="24dp"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="8dp"
