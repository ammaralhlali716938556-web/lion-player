name: Build Lion Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Lion Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create App Code & Environment
        run: |
          mkdir -p gradle
          mkdir -p app/src/main/java/com/lionplayer/app/model
          mkdir -p app/src/main/java/com/lionplayer/app/adapter
          mkdir -p app/src/main/java/com/lionplayer/app/player
          mkdir -p app/src/main/java/com/lionplayer/app/receiver
          mkdir -p app/src/main/java/com/lionplayer/app/ui
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "LionPlayer"
          include ':app'
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          tasks.register('clean', Delete) {
              delete rootProject.layout.buildDirectory
          }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.lionplayer.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lionplayer.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "1.3.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.media:media:1.7.0'
              def media3_version = "1.3.0"
              implementation "androidx.media3:media3-exoplayer:$media3_version"
              implementation "androidx.media3:media3-ui:$media3_version"
              implementation "androidx.media3:media3-common:$media3_version"
              implementation "androidx.media3:media3-session:$media3_version"
          }
          EOF

          # 5. app/proguard-rules.pro
          cat << 'EOF' > app/proguard-rules.pro
          -keep class androidx.media3.** { *; }
          -keep class com.lionplayer.app.model.** { *; }
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_lion_logo"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_lion_logo"
                  android:supportsRtl="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/Theme.LionPlayer">

                  <activity
                      android:name=".ui.SplashActivity"
                      android:theme="@style/Theme.LionPlayer.Splash"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="false" />

                  <activity
                      android:name=".ui.PlayerActivity"
                      android:theme="@style/Theme.LionPlayer.Player"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:supportsPictureInPicture="true"
                      android:launchMode="singleTask"
                      android:exported="false" />

                  <receiver
                      android:name=".receiver.NotificationReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_PREV" />
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_PLAY_PAUSE" />
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_NEXT" />
                          <action android:name="com.lionplayer.app.ACTION_NOTIF_CLOSE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 7. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Lion Player</string>
              <string name="app_slogan">مشغل الوسائط الاحترافي</string>
              <string name="tab_video">فيديو</string>
              <string name="tab_audio">صوتيات</string>
              <string name="tab_all">جميع الملفات</string>
              <string name="tab_favorites">المفضلة</string>
              <string name="action_search">بحث</string>
              <string name="action_refresh">تحديث الوسائط</string>
              <string name="action_sort">فرز حسب</string>
              <string name="action_order">ترتيب</string>
              <string name="action_display_mode">طريقة العرض</string>
              <string name="action_view_mode">أسلوب العرض</string>
              <string name="action_toggle_extension">إظهار امتداد الملفات</string>
              <string name="action_settings">الإعدادات</string>
          </resources>
          EOF

          # 8. colors.xml
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="primary">#FF9800</color>
              <color name="primary_dark">#E65100</color>
              <color name="accent">#FFB74D</color>
              <color name="background_dark">#121212</color>
              <color name="surface_dark">#1A1A1A</color>
              <color name="card_dark">#1F1F1F</color>
              <color name="mini_player_bg">#1E222B</color>
              <color name="text_primary">#FFFFFF</color>
              <color name="text_secondary">#AAAAAA</color>
              <color name="divider_color">#18FFFFFF</color>
          </resources>
          EOF

          # 9. styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.LionPlayer" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:windowBackground">@color/background_dark</item>
                  <item name="android:statusBarColor">@color/surface_dark</item>
                  <item name="android:navigationBarColor">@color/surface_dark</item>
              </style>

              <style name="Theme.LionPlayer.Splash" parent="Theme.LionPlayer">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:statusBarColor">@color/background_dark</item>
                  <item name="android:navigationBarColor">@color/background_dark</item>
              </style>

              <style name="Theme.LionPlayer.Player" parent="Theme.LionPlayer">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:statusBarColor">#00000000</item>
                  <item name="android:navigationBarColor">#00000000</item>
              </style>
          </resources>
          EOF

          # 10. Drawables
          cat << 'EOF' > app/src/main/res/drawable/ic_lion_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="128dp" android:height="128dp" android:viewportWidth="96" android:viewportHeight="96">
            <path android:fillColor="#FF9800" android:pathData="M48,8C25.9,8 8,25.9 8,48s17.9,40 40,40 40,-17.9 40,-40S70.1,8 48,8zM38,66V30l28,18 -28,18z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="36dp" android:height="36dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_pause.xml
