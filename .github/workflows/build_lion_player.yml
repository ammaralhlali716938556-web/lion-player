package com.lionplayer.app.player

import android.media.audiofx.BassBoost
import android.media.audiofx.Equalizer
import android.media.audiofx.LoudnessEnhancer
import android.media.audiofx.PresetReverb
import android.os.Build
import androidx.media3.common.C

class AudioEffectsManager {
    var equalizer: Equalizer? = null
        private set
    var bassBoost: BassBoost? = null
        private set
    var presetReverb: PresetReverb? = null
        private set
    var loudnessEnhancer: LoudnessEnhancer? = null
        private set

    var isDialogueClarityEnabled: Boolean = false
        private set
    private var savedBandLevels = shortArrayOf()

    fun attachToAudioSession(audioSessionId: Int) {
        if (audioSessionId == C.AUDIO_SESSION_ID_UNSET || audioSessionId == 0) return
        try {
            if (equalizer == null) {
                equalizer = Equalizer(0, audioSessionId).apply { enabled = true }
            }
            if (bassBoost == null) {
                bassBoost = BassBoost(0, audioSessionId).apply { enabled = true }
            }
            if (presetReverb == null) {
                presetReverb = PresetReverb(0, audioSessionId).apply { enabled = false }
            }
            if (loudnessEnhancer == null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                loudnessEnhancer = LoudnessEnhancer(audioSessionId)
            }
        } catch (e: Exception) {
            e.printStackTrace()
        }
    }

    fun setVolumeBoostGain(gainMb: Int) {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
            try {
                loudnessEnhancer?.let {
                    if (gainMb > 0) {
                        it.setTargetGain(gainMb)
                        it.enabled = true
                    } else {
                        it.setTargetGain(0)
                        it.enabled = false
                    }
                }
            } catch (e: Exception) {}
        }
    }

    /**
     * AI Dialogue Clarity & Voice Boost:
     * Focuses on human vocal frequency bands (1kHz - 3.5kHz), elevating dialog fundamentals
     * while attenuating explosive low rumbles (<150Hz) and reducing background audio noise.
     */
    fun toggleDialogueClarity(): Boolean {
        isDialogueClarityEnabled = !isDialogueClarityEnabled
        val eq = equalizer ?: return isDialogueClarityEnabled

        if (isDialogueClarityEnabled) {
            val numBands = eq.numberOfBands.toInt()
            savedBandLevels = ShortArray(numBands)
            for (i in 0 until numBands) {
                savedBandLevels[i] = eq.getBandLevel(i.toShort())
            }

            for (i in 0 until numBands) {
                val centerFreq = eq.getCenterFreq(i.toShort()) / 1000 // In Hz
                when {
                    centerFreq in 800..3500 -> {
                        // Boost human voice clarity (+8 dB)
                        eq.setBandLevel(i.toShort(), 800.coerceAtMost(eq.bandLevelRange[1].toInt()).toShort())
                    }
                    centerFreq < 200 -> {
                        // Suppress loud rumbling effects (-4 dB)
                        eq.setBandLevel(i.toShort(), (-400).coerceAtLeast(eq.bandLevelRange[0].toInt()).toShort())
                    }
                    centerFreq > 7000 -> {
                        // Gentle roll-off for harsh frequencies
                        eq.setBandLevel(i.toShort(), (-200).coerceAtLeast(eq.bandLevelRange[0].toInt()).toShort())
                    }
                    else -> {
                        eq.setBandLevel(i.toShort(), 0)
                    }
                }
            }
            // Add subtle dynamic boost
            setVolumeBoostGain(400)
        } else {
            // Restore original equalizer settings
            if (savedBandLevels.isNotEmpty()) {
                for (i in savedBandLevels.indices) {
                    if (i < eq.numberOfBands) {
                        eq.setBandLevel(i.toShort(), savedBandLevels[i])
                    }
                }
            }
            setVolumeBoostGain(0)
        }
        return isDialogueClarityEnabled
    }

    fun release() {
        try {
            equalizer?.release()
            bassBoost?.release()
            presetReverb?.release()
            loudnessEnhancer?.release()
        } catch (e: Exception) {}
        equalizer = null
        bassBoost = null
        presetReverb = null
        loudnessEnhancer = null
    }
}
