                  if (playlistUris.isNotEmpty() && currentTrackIndex > 0) {
                      playTrackAtIndex(currentTrackIndex - 1)
                      Toast.makeText(this, "السابق: ${playlistTitles.getOrNull(currentTrackIndex) ?: ""}", Toast.LENGTH_SHORT).show()
                  } else {
                      Toast.makeText(this, "بداية القائمة", Toast.LENGTH_SHORT).show()
                  }
